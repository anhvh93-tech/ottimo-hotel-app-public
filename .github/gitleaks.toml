# gitleaks configuration (FB-R1-ARC-OPS-02 point 3). Used by the `secrets-scan` CI job.
# Default rules stay ON; the allowlist only covers known, reviewed non-secrets. Each entry has a reason.
title = "OTTIMO Desk gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Reviewed false positives – see .github/gitleaks.toml comments"
paths = [
  # Round-0 prototype kept for reference only (217 KB single HTML, no backend, no real keys).
  '''product/legacy/''',
  # Lockfile integrity hashes (sha512-…) look like high-entropy keys.
  '''product/pnpm-lock\.yaml''',
]
regexes = [
  # Dev/CI-only placeholder passwords in .env.example, compose, CI and docs (never valid anywhere else).
  '''change_me_[a-z_]*dev_only''',
  '''ci_[a-z]*_?only''',
  # Fake marker values in log-redaction tests (services/api/test/http.test.ts): the test asserts they
  # never reach the log. Convention: <prefix>_SECRET_<digits>; real keys never look like this.
  '''[a-z]+_SECRET_[0-9]+''',
  # Business parameter key (BR §13, electricity/water meter anomaly default) quoted as `"key": "…"`
  # in rounds/round-02/outputs/QA/w1-report.md (commit a1cd73a); generic-api-key false positive.
  '''meter_anomaly_default_m3''',
  # Public Visa test card number used to prove card numbers are rejected in posAuthCode
  # (services/api/test/integration/payments-s3.test.ts, commit e3959ec); not a secret.
  '''4111111111111111''',
  # 13-char fake POS auth code used to prove the TOO_LONG limit in the same test file.
  '''ABCDEF1234567''',
  # Public container image tags `…/ottimo-api:sha-<commit>[-test]` in OPS staging notes (commit b9a97fa):
  # the word "api" next to a hex commit id trips generic-api-key; a git commit id is not a secret.
  # Allowlist regexes match the detected value, which here is the tag itself.
  '''^sha-[0-9a-f]{7,40}(-test)?$''',
  # Fake values in R3 2FA tests and the OpenAPI example (commits dd78694, 02a1a8e, 8228f33): a deliberately
  # wrong test password and a made-up mfaToken example. Neither is valid anywhere.
  '''^Wrong-pass-2026$''',
  '''^q8Zr1vX0bW6mN3pL5tY7uI9oA2sD4fG6hJ8kK0lQ$''',
]
