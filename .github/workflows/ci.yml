# CI for OTTIMO Desk (ADR-012). Code lives in product/; this file stays at the repo root.
name: CI

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: format · lint · test · build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: product
    services:
      postgres:
        image: postgres:17-alpine
        env:
          # Throwaway CI-only database, not a secret.
          POSTGRES_USER: ottimo
          POSTGRES_PASSWORD: ci_only
          POSTGRES_DB: ottimo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ottimo -d ottimo_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://ottimo:ci_only@localhost:5432/ottimo_test
      TURBO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: product/package.json

      - uses: actions/setup-node@v4
        with:
          node-version-file: product/.nvmrc
          # Only enable the pnpm cache once the lockfile is committed (setup-node fails without it).
          cache: ${{ hashFiles('product/pnpm-lock.yaml') != '' && 'pnpm' || '' }}
          cache-dependency-path: product/pnpm-lock.yaml

      - name: Install dependencies
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            echo "::warning title=Missing lockfile::product/pnpm-lock.yaml is not committed yet. Install is not reproducible. Commit the lockfile (see docs/dev-setup.md); this fallback must be removed in Round 2."
            pnpm install --no-frozen-lockfile
          fi

      - name: Turbo cache
        uses: actions/cache@v4
        with:
          path: product/.turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - name: Format check
        run: pnpm format:check

      - name: Lint (ESLint + tsc)
        run: pnpm lint

      - name: Test (Vitest, real PostgreSQL)
        run: pnpm test

      - name: Build
        run: pnpm build

  secrets-scan:
    name: gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Run the gitleaks CLI image directly (no license needed, unlike gitleaks-action for orgs).
      - name: Scan full git history for secrets
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/repo" -w /repo \
            ghcr.io/gitleaks/gitleaks:v8.21.2 \
            detect --source=/repo --redact --verbose --exit-code 1

  docker-build:
    name: docker images build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - name: Build api image
        run: docker build -f product/infra/docker/Dockerfile.api -t ottimo-api:ci product
      - name: Build web image
        run: docker build -f product/infra/docker/Dockerfile.web -t ottimo-web:ci product
      - name: Smoke test GET /health against PostgreSQL
        run: |
          docker network create ottimo-ci
          docker run -d --name pg --network ottimo-ci \
            -e POSTGRES_USER=ottimo -e POSTGRES_PASSWORD=ci_only -e POSTGRES_DB=ottimo \
            postgres:17-alpine
          for i in $(seq 1 30); do docker exec pg pg_isready -U ottimo -d ottimo && break; sleep 2; done
          docker run -d --name api --network ottimo-ci -p 3000:3000 \
            -e DATABASE_URL=postgres://ottimo:ci_only@pg:5432/ottimo ottimo-api:ci
          for i in $(seq 1 30); do curl -fsS http://localhost:3000/health && exit 0; sleep 2; done
          docker logs api
          exit 1
