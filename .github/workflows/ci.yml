# CI for OTTIMO Desk (ADR-012). Code lives in product/; this file stays at the repo root.
# Supply chain (FB-R1-SEC-OPS-04): every action is pinned to a commit SHA (tag in the comment),
# images by digest; Dependabot (github-actions, docker) bumps both. Checkouts never keep the token.
# R2 deploy job: put `permissions` (packages: write) on that job only, run it on push to main only.
name: CI

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: format · lint · audit · test · build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: product
    services:
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          # Throwaway CI-only database, not a secret.
          POSTGRES_USER: ottimo_admin
          POSTGRES_PASSWORD: ci_admin_only
          POSTGRES_DB: ottimo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U ottimo_admin -d ottimo_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      # Tests run as the application role, never as the superuser (FB-R1-SEC-OPS-01).
      DATABASE_URL: postgres://ottimo_app:ci_app_only@localhost:5432/ottimo_test
      # Migrations (R2) log in as ottimo_migrator and SET ROLE ottimo_owner (NOLOGIN) – erd.md 2.1, BUG-R1-SEC-06.
      MIGRATION_DATABASE_URL: postgres://ottimo_migrator:ci_migrator_only@localhost:5432/ottimo_test
      TURBO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Create database roles (same script as docker compose)
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGPASSWORD: ci_admin_only
          POSTGRES_USER: ottimo_admin
          OTTIMO_DATABASES: ottimo_test
          OTTIMO_MIGRATOR_DB_PASSWORD: ci_migrator_only
          OTTIMO_APP_DB_PASSWORD: ci_app_only
        run: bash infra/postgres/init/02-roles.sh

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          package_json_file: product/package.json

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: product/.nvmrc
          cache: pnpm
          cache-dependency-path: product/pnpm-lock.yaml

      # Lockfile is mandatory (ADR-012, SEC-R1-24): a missing or stale pnpm-lock.yaml fails the job.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # FB-R1-SEC-OPS-05 (SR-SUP-01): fail on High/Critical advisories. Accepted exceptions go in
      # package.json > pnpm.auditConfig.ignoreCves, each with an expiry noted in the PR.
      - name: Dependency audit
        run: pnpm audit --audit-level=high

      - name: Turbo cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: product/.turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - name: Format check
        run: pnpm format:check

      - name: Lint (ESLint once for the workspace + tsc per package)
        run: pnpm lint

      # erd 16.6 (b): the Drizzle schema must match the committed migrations. drizzle-kit generate needs no
      # database; if it writes anything (new SQL, snapshot, journal) the schema changed without a migration.
      - name: Schema matches migrations (drizzle-kit generate creates no file)
        timeout-minutes: 3
        run: |
          pnpm --filter @ottimo/api exec drizzle-kit generate < /dev/null
          drift=$(git status --porcelain --untracked-files=all -- services/api/src/db/migrations)
          if [ -n "$drift" ]; then
            echo "$drift"
            echo "::error::schema and migrations differ – run 'pnpm --filter @ottimo/api db:generate' and commit the migration"
            exit 1
          fi

      # Explicit migrate step (same runner as deploys: ottimo_migrator → SET ROLE ottimo_owner, erd 16 point 5).
      # Vitest's globalSetup migrates too (no-op after this); a broken migration fails here with a clear name.
      # The runner imports @ottimo/integrations, so the api's workspace dependencies are built first.
      - name: Migrate test database (pnpm db:migrate as ottimo_migrator)
        run: |
          pnpm exec turbo run build --filter=@ottimo/api^...
          pnpm db:migrate

      - name: Test (Vitest, real PostgreSQL as ottimo_app)
        run: pnpm test

      - name: Build
        run: pnpm build

  test-surface-guard:
    # BUG-R1-SEC-08 / SR-SECR-05: the production contract must not contain /__test__ paths
    # (they live in docs/api/openapi.test.yaml only). The bundle half runs in docker-build.
    name: no test endpoints in production contract
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: openapi.yaml has no /__test__ path
        run: bash product/infra/ci/check-no-test-surface.sh spec product/docs/api/openapi.yaml

  contract-lint:
    # FB-R1-ARC-OPS-08: lint docs/api/openapi.yaml. Blocking since R2 (Redocly 0 errors, OpenAPI 0.3.0).
    name: OpenAPI lint (Redocly)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: product/.nvmrc
      - name: Redocly lint
        run: npx --yes @redocly/cli@1.34.21 lint product/docs/api/openapi.yaml

  api-contract:
    # BUG-R1-021 (plan R2 W5): structural validity of both contracts + the static RBAC check of
    # tests/tools/gen_traceability.py --strict (OpenAPI x-roles/x-rbac/x-rbac-field vs rbac-matrix).
    # The matrix is written to a temp file: the committed docs/qa/traceability.md is QA's to regenerate.
    name: API contract (spec validator · RBAC --strict)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: openapi-spec-validator (openapi.yaml + openapi.test.yaml)
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet --disable-pip-version-check openapi-spec-validator==0.7.2
          "$RUNNER_TEMP/venv/bin/openapi-spec-validator" product/docs/api/openapi.yaml product/docs/api/openapi.test.yaml
      - name: RBAC / traceability static check (gen_traceability.py --strict)
        run: python3 product/tests/tools/gen_traceability.py --strict --out "$RUNNER_TEMP/traceability.md"
      # QA's role x operation matrix (tests/fixtures/rbac-cases.json|csv) must be regenerated whenever
      # OpenAPI x-roles/x-rbac/x-scope or the DS-E accounts change: stale files = red.
      - name: RBAC case matrix up to date (gen_rbac_cases.py --check)
        run: python3 product/tests/tools/gen_rbac_cases.py --check

  secrets-scan:
    name: gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      # Run the gitleaks CLI image directly (no license needed, unlike gitleaks-action for orgs).
      # Allowlist with reasons: .github/gitleaks.toml.
      - name: Scan full git history for secrets
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/repo" -w /repo \
            ghcr.io/gitleaks/gitleaks:v8.21.2@sha256:0e99e8821643ea5b235718642b93bb32486af9c8162c8b8731f7cbdc951a7f46 \
            detect --source=/repo --config=/repo/.github/gitleaks.toml --redact --verbose --exit-code 1

  docker-build:
    name: docker images build · E2E smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: build-test
    env:
      TURBO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Build api image (production build, INCLUDE_TEST_SUPPORT=0)
        run: docker build -f product/infra/docker/Dockerfile.api -t ottimo-api:ci product
      # BUG-R1-SEC-08: fail if the production image ships TestSupportModule or any /__test__ route.
      # Must stay green before BE merges TestSupportModule (R2) – do not mark continue-on-error.
      - name: Production api bundle has no test-only code
        run: |
          rm -rf "$RUNNER_TEMP/api-bundle" && mkdir -p "$RUNNER_TEMP/api-bundle"
          cid=$(docker create ottimo-api:ci)
          docker cp "$cid:/app/dist" "$RUNNER_TEMP/api-bundle/dist"
          # Workspace packages bundled into the image (if any) are checked too.
          docker cp "$cid:/app/node_modules/@ottimo" "$RUNNER_TEMP/api-bundle/ottimo-packages" 2>/dev/null || true
          docker rm "$cid"
          dirs="$RUNNER_TEMP/api-bundle/dist"
          [ -d "$RUNNER_TEMP/api-bundle/ottimo-packages" ] && dirs="$dirs $RUNNER_TEMP/api-bundle/ottimo-packages"
          bash product/infra/ci/check-no-test-surface.sh bundle $dirs
      - name: Build web image
        run: docker build -f product/infra/docker/Dockerfile.web -t ottimo-web:ci product
      - name: Smoke test GET /health against PostgreSQL (app role, same init scripts as dev)
        env:
          PG_IMAGE: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        run: |
          docker network create ottimo-ci
          docker run -d --name pg --network ottimo-ci \
            -e POSTGRES_USER=ottimo_admin -e POSTGRES_PASSWORD=ci_admin_only -e POSTGRES_DB=ottimo \
            -e OTTIMO_MIGRATOR_DB_PASSWORD=ci_migrator_only -e OTTIMO_APP_DB_PASSWORD=ci_app_only \
            -v "$GITHUB_WORKSPACE/product/infra/postgres/init:/docker-entrypoint-initdb.d:ro" \
            "$PG_IMAGE"
          for i in $(seq 1 30); do
            docker exec pg pg_isready -h 127.0.0.1 -U ottimo_admin -d ottimo && break; sleep 2
          done
          # Migrate from the production image itself (dist/db/migrate-cli.js + dist/db/migrations), as a
          # deploy does: ottimo_migrator → SET ROLE ottimo_owner. Re-run must be a no-op.
          for run in 1 2; do
            docker run --rm --network ottimo-ci \
              -e MIGRATION_DATABASE_URL=postgres://ottimo_migrator:ci_migrator_only@pg:5432/ottimo \
              ottimo-api:ci node dist/db/migrate-cli.js
          done
          docker run -d --name api --network ottimo-ci -p 127.0.0.1:3000:3000 -e APP_ENV=test \
            -e DATABASE_URL=postgres://ottimo_app:ci_app_only@pg:5432/ottimo ottimo-api:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/health; then
              # The image must refuse to start without APP_ENV (fail-fast config, FB-R1-SEC-OPS-09).
              if docker run --rm --network ottimo-ci \
                -e DATABASE_URL=postgres://ottimo_app:ci_app_only@pg:5432/ottimo ottimo-api:ci; then
                echo "api started without APP_ENV"; exit 1
              fi
              exit 0
            fi
            sleep 2
          done
          docker logs pg
          docker logs api
          exit 1
      - name: Remove production-image smoke containers (frees port 3000 for the compose stack)
        if: always()
        run: |
          docker rm -f api pg >/dev/null 2>&1 || true
          docker network rm ottimo-ci >/dev/null 2>&1 || true

      # ---- E2E smoke (QA W8, rounds/round-02/outputs/QA/w1-report.md): the dev compose stack, one-shot ----
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          package_json_file: product/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: product/.nvmrc
          cache: pnpm
          cache-dependency-path: product/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: product
        run: pnpm install --frozen-lockfile
      - name: Playwright version
        id: pw
        working-directory: product
        run: echo "version=$(pnpm --filter @ottimo/tests exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium-webkit
      # Browsers are cached; their OS libraries (apt) are not, so install-deps runs on a cache hit too.
      - name: Install Playwright browsers (chromium, webkit – projects in e2e/playwright.config.ts)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        working-directory: product
        run: pnpm --filter @ottimo/tests exec playwright install --with-deps chromium webkit
      - name: Install Playwright OS dependencies (browser cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        working-directory: product
        run: pnpm --filter @ottimo/tests exec playwright install-deps chromium webkit
      # Random per-run passwords (DB roles, QA_SEED_PASSWORD) – masked, never a repo secret.
      - name: Create throwaway product/.env
        run: bash product/infra/ci/make-ci-env.sh product/.env.example product/.env
      # Turn the api's Origin lists on (compose passes API_*_BASE_URL → ADMIN/STAFF/GUEST_BASE_URL; empty in dev)
      # so TC-SEC-024 (SR-SES-09: staff login from guest-web → 403) runs instead of skipping. Values must equal
      # the origins the E2E harness sends (E2E_ORIGIN / E2E_GUEST_ORIGIN below). Not secrets.
      - name: Enable api Origin checks for the E2E stack
        run: |
          {
            echo 'API_ADMIN_BASE_URL=http://localhost:8081'
            echo 'API_STAFF_BASE_URL=http://localhost:8082'
            echo 'API_GUEST_BASE_URL=http://localhost:8083'
          } >> product/.env
      # `migrate` (one-shot) runs first; api/worker wait for it to complete successfully.
      - name: Start compose stack (postgres, migrate, api, worker, web)
        working-directory: product
        run: docker compose --env-file .env -f infra/docker-compose.yml up --build --detach --wait --wait-timeout 300
      # DS-E accounts qa.* (password = QA_SEED_PASSWORD of this run): without them every E2E login is 401 and
      # the harness used to retry until SR-RL-01 answered 429 (run 38887585274). QA, round-02 s1-report mục 8.
      - name: Load QA seed DS-E (one-shot, profile seed)
        working-directory: product
        # The seed container runs as `node` (uid 1000) and writes device tokens to the bind-mounted
        # tests/fixtures/seed/.out; the runner checkout belongs to another uid, so pre-create it writable.
        run: |
          mkdir -p tests/fixtures/seed/.out
          chmod 0777 tests/fixtures/seed/.out
          docker compose --env-file .env -f infra/docker-compose.yml run --rm seed
      # E2E_COMPOSE_CONTROL=1: TC-X-050c may stop/start postgres – this stack is disposable.
      - name: E2E smoke (pnpm test:e2e)
        working-directory: product
        env:
          E2E_API_URL: http://127.0.0.1:3000
          E2E_WEB_URL: http://127.0.0.1:8081
          E2E_ORIGIN: http://localhost:8081
          E2E_GUEST_ORIGIN: http://localhost:8083
          E2E_COMPOSE_CONTROL: '1'
        run: pnpm test:e2e
      # The origin-list cases must really run on this stack (Sprint 1 carry-over: TC-SEC-024 used to skip).
      - name: Origin checks ran (TC-SEC-024 not skipped)
        working-directory: product
        run: |
          junit=tests/e2e/test-results/junit.xml
          [ -f "$junit" ] || { echo "::error::$junit missing"; exit 1; }
          python3 - "$junit" <<'PY'
          import sys, xml.etree.ElementTree as ET
          cases = [c for c in ET.parse(sys.argv[1]).iter('testcase') if 'TC-SEC-024' in (c.get('name') or '')]
          if not cases:
              sys.exit('::error::TC-SEC-024 not found in junit report')
          skipped = [c.get('name') for c in cases if c.find('skipped') is not None]
          if skipped:
              sys.exit('::error::TC-SEC-024 skipped – api Origin lists not set on the E2E stack: ' + '; '.join(skipped))
          print(f'TC-SEC-024: {len(cases)} case(s) ran')
          PY
      - name: Compose logs (on failure)
        if: failure()
        working-directory: product
        run: docker compose --env-file .env -f infra/docker-compose.yml logs --no-color --tail 300
      # Test data is fake (test-strategy section 4); reports hold no secrets (passwords are masked/not logged).
      - name: Upload Playwright report (on failure)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            product/tests/e2e/playwright-report
            product/tests/e2e/test-results
          retention-days: 7
          if-no-files-found: ignore
      - name: Stop compose stack
        if: always()
        working-directory: product
        run: |
          [ -f .env ] || exit 0
          docker compose --env-file .env -f infra/docker-compose.yml down --volumes --remove-orphans
          rm -f .env
