# CI for OTTIMO Desk (ADR-012). Code lives in product/; this file stays at the repo root.
# Supply chain (FB-R1-SEC-OPS-04): every action is pinned to a commit SHA (tag in the comment),
# images by digest; Dependabot (github-actions, docker) bumps both. Checkouts never keep the token.
# Images + staging deploy: jobs publish-images / deploy-staging at the end (push to main only, opt-in by repository
# variables); packages: write exists on publish-images only.
# T9 nightly (sprint-4-plan T9/G5, qa/s4-test-plan 3.2): the `schedule` below (and a manual run with t9 = true) runs
# this whole workflow on main – Vitest (turbo may replay a commit already green) + the full E2E incl. every UI case
# and axe outside WRITES, always run fresh – plus the T9 steps of docker-build (retry guard, reports kept).
# publish-images / deploy-staging stay push-only, so T9 never publishes or deploys.
# "Is this a T9 run" = github.event_name == 'schedule' || inputs.t9 == true (concurrency, job name, env T9).
name: CI

on:
  pull_request:
  push:
    branches: [main, master]
  schedule:
    # 19:17 UTC = 02:17 Asia/Ho_Chi_Minh (UTC+7, no DST): low traffic at the hotel and in the team; off the full hour,
    # where GitHub delays or drops scheduled runs. Runs on the default branch (main) only.
    - cron: '17 19 * * *'
  workflow_dispatch:
    inputs:
      t9:
        description: 'T9 nightly run (retry guard, JSON report, reports uploaded even when green). Untick = plain CI.'
        type: boolean
        default: true

permissions:
  contents: read

# T9 runs get their own group and are never cancelled by a push to main (or the reverse); pushes keep cancelling
# their own older run on the same ref.
concurrency:
  group: ci-${{ (github.event_name == 'schedule' || inputs.t9 == true) && 't9-' || '' }}${{ github.ref }}
  cancel-in-progress: ${{ !(github.event_name == 'schedule' || inputs.t9 == true) }}

jobs:
  build-test:
    name: format · lint · audit · test · build
    runs-on: ubuntu-24.04
    # 15 → 25 (18/10, run 39085982603 on 7ac11a4 cancelled at 15 min: Vitest 714 s on the 2-vCPU runner, then build).
    # Typical job 11–15 min; splitting the api tests is proposed in rounds/round-02/outputs/OPS/s4-nightly.md.
    timeout-minutes: 25
    defaults:
      run:
        working-directory: product
    services:
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          # Throwaway CI-only database, not a secret.
          POSTGRES_USER: ottimo_admin
          POSTGRES_PASSWORD: ci_admin_only
          POSTGRES_DB: ottimo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U ottimo_admin -d ottimo_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      # Tests run as the application role, never as the superuser (FB-R1-SEC-OPS-01).
      DATABASE_URL: postgres://ottimo_app:ci_app_only@localhost:5432/ottimo_test
      # Migrations (R2) log in as ottimo_migrator and SET ROLE ottimo_owner (NOLOGIN) – erd.md 2.1, BUG-R1-SEC-06.
      MIGRATION_DATABASE_URL: postgres://ottimo_migrator:ci_migrator_only@localhost:5432/ottimo_test
      # R3-OPS-02: the production bootstrap test needs its own EMPTY database (refuses a DB that holds a property).
      BOOTSTRAP_DATABASE_URL: postgres://ottimo_app:ci_app_only@localhost:5432/ottimo_bootstrap_test
      BOOTSTRAP_MIGRATION_DATABASE_URL: postgres://ottimo_migrator:ci_migrator_only@localhost:5432/ottimo_bootstrap_test
      TURBO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create database roles (same script as docker compose)
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGPASSWORD: ci_admin_only
          POSTGRES_USER: ottimo_admin
          OTTIMO_DATABASES: ottimo_test ottimo_bootstrap_test
          OTTIMO_MIGRATOR_DB_PASSWORD: ci_migrator_only
          OTTIMO_APP_DB_PASSWORD: ci_app_only
        run: |
          psql -v ON_ERROR_STOP=1 --no-psqlrc -U ottimo_admin -d ottimo_test -c 'CREATE DATABASE ottimo_bootstrap_test'
          bash infra/postgres/init/02-roles.sh

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: product/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: product/.nvmrc
          cache: pnpm
          cache-dependency-path: product/pnpm-lock.yaml

      # Lockfile is mandatory (ADR-012, SEC-R1-24): a missing or stale pnpm-lock.yaml fails the job.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # FB-R1-SEC-OPS-05 (SR-SUP-01): fail on High/Critical advisories. Accepted exceptions go in
      # package.json > pnpm.auditConfig.ignoreCves, each with an expiry noted in the PR.
      - name: Dependency audit
        run: pnpm audit --audit-level=high

      - name: Turbo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: product/.turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - name: Format check
        run: pnpm format:check

      - name: Lint (ESLint once for the workspace + tsc per package)
        run: pnpm lint

      # erd 16.6 (b): the Drizzle schema must match the committed migrations. drizzle-kit generate needs no
      # database; if it writes anything (new SQL, snapshot, journal) the schema changed without a migration.
      - name: Schema matches migrations (drizzle-kit generate creates no file)
        timeout-minutes: 3
        run: |
          pnpm --filter @ottimo/api exec drizzle-kit generate < /dev/null
          drift=$(git status --porcelain --untracked-files=all -- services/api/src/db/migrations)
          if [ -n "$drift" ]; then
            echo "$drift"
            echo "::error::schema and migrations differ – run 'pnpm --filter @ottimo/api db:generate' and commit the migration"
            exit 1
          fi

      # Explicit migrate step (same runner as deploys: ottimo_migrator → SET ROLE ottimo_owner, erd 16 point 5).
      # Vitest's globalSetup migrates too (no-op after this); a broken migration fails here with a clear name.
      # The runner imports @ottimo/integrations, so the api's workspace dependencies are built first.
      - name: Migrate test database (pnpm db:migrate as ottimo_migrator)
        run: |
          pnpm exec turbo run build --filter=@ottimo/api^...
          pnpm db:migrate

      # Landing LP-v1 (ADR-014 9, sprint-4-plan 11.3): its own named step so a red landing is visible at a glance.
      # Astro static build, then Vitest on the source (brand palette, copy EN/VI, language rule) and on dist/
      # (no inline script/style, nothing from another origin, one H1 per page, hreflang + x-default, sitemap/robots,
      # palette-only colours, byte budgets of concept 11.2). The workspace-wide Test/Build below reuse the turbo cache.
      - name: Landing LP-v1 (build + source/dist checks)
        run: pnpm exec turbo run build test --filter=@ottimo/landing-web

      - name: Test (Vitest, real PostgreSQL as ottimo_app)
        run: pnpm test

      - name: Build
        run: pnpm build

  landing-e2e:
    # LP-v1 gate (ADR-014 9, concept 11, sprint-4-plan T11/11.3): the static landing served with the production
    # headers of ADR-014 1.4 (tests/e2e/landing/serve.mjs – real CSP), Chromium at 320/375/768/1280 px × EN/VI:
    # axe 0 violations, no horizontal scroll, one H1, no console/CSP error, 0 requests to another origin, glyphs only
    # from the self-hosted fonts, language rule (no redirect, suggestion strip, kept choice), byte budgets per DPR,
    # v1.2.1 structure (8 sections, phone bar, Zalo first, other channels folded) and the booking form on the review build.
    # No API stack needed: independent of build-test and docker-build.
    name: landing LP-v1 · Playwright (axe, CSP, budgets)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: product
    env:
      TURBO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: product/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: product/.nvmrc
          cache: pnpm
          cache-dependency-path: product/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # dist/ = production build (booking form off); dist-booking-preview/ = review build with the form rendered
      # (never deployed) for the form cases – concept 5, SEC UXD-08; dist-booking-live/ = live-form test build
      # (LANDING_BOOKING_FORM=true, slug dl01, public API answered by the tests – US-155 v1.0, FE-B).
      - name: Build landing (production + booking-form review build + live-form test build)
        run: |
          pnpm --filter @ottimo/landing-web build
          pnpm --filter @ottimo/landing-web build:booking-preview
          pnpm --filter @ottimo/landing-web build:booking-live-test
      - name: Playwright version
        id: pw
        run: echo "version=$(pnpm --filter @ottimo/tests exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium
      - name: Install Playwright Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @ottimo/tests exec playwright install --with-deps chromium
      - name: Install Playwright OS dependencies (browser cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @ottimo/tests exec playwright install-deps chromium
      - name: Landing E2E (pnpm test:e2e:landing)
        run: pnpm --filter @ottimo/tests test:e2e:landing
      - name: Upload landing Playwright report (on failure)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: landing-playwright-report
          path: |
            product/tests/e2e/playwright-report/landing
            product/tests/e2e/test-results/landing
          retention-days: 7
          if-no-files-found: ignore

  infra-scripts:
    # Server scripts run as root/deploy user on the VPS (infra/server): a quoting bug there is an outage.
    name: infra scripts (shellcheck)
    runs-on: ubuntu-24.04
    # Usually < 1 min; without a cap a hung docker run in check-caddy-prod.sh would hold the runner for 6 h.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck (warnings and errors)
        run: |
          shellcheck --version | head -2
          shellcheck -x -S warning product/infra/server/bootstrap-vps.sh product/infra/server/bin/dc \
            product/infra/server/bin/*.sh product/infra/postgres/init/02-roles.sh product/infra/ci/*.sh \
            product/infra/caddy/*.sh product/infra/demo/*.sh product/infra/docker/*.sh \
            product/services/api/scripts/production-bootstrap.sh product/services/api/scripts/mfa-operator-reset.sh
      # UXR P-15: demo/production web builds refuse a missing, malformed or placeholder desk phone; dev only warns.
      - name: Web build config guard (VITE_DESK_PHONE)
        run: bash product/infra/ci/test-web-build-config.sh
      # Independent of build-test (blocker verification 17/10: a red lint must not skip these guards).
      - name: Compose rules (blob volume only in api/worker, web without blob/secrets, prod hardening)
        run: bash product/infra/ci/check-compose.sh
      - name: Caddyfile.prod rules on the stock caddy image (exact headers, real-file probes, 413, log masking)
        run: bash product/infra/ci/check-caddy-prod.sh --stub
      # SEC E.8 / R5-01: the CI deploy key gets one summary line back (public Actions log); other commands → exit 2.
      - name: deploy-from-ci.sh (one summary line, full log on the server, refused commands)
        run: bash product/infra/ci/test-deploy-from-ci.sh
      # R3 v1.0: staging + production on one VPS behind one edge (SNI routing, PROXY protocol, landing preview auth).
      - name: Shared edge (render guards, routing, client address, no spoofing)
        run: bash product/infra/ci/test-edge.sh

  test-surface-guard:
    # BUG-R1-SEC-08 / SR-SECR-05: the production contract must not contain /__test__ paths
    # (they live in docs/api/openapi.test.yaml only). The bundle half runs in docker-build.
    name: no test endpoints in production contract
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: openapi.yaml has no /__test__ path
        run: bash product/infra/ci/check-no-test-surface.sh spec product/docs/api/openapi.yaml

  contract-lint:
    # FB-R1-ARC-OPS-08: lint docs/api/openapi.yaml. Blocking since R2 (Redocly 0 errors, OpenAPI 0.3.0).
    name: OpenAPI lint (Redocly)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: product/.nvmrc
      - name: Redocly lint
        run: npx --yes @redocly/cli@1.34.21 lint product/docs/api/openapi.yaml

  api-contract:
    # BUG-R1-021 (plan R2 W5): structural validity of both contracts + the static RBAC check of
    # tests/tools/gen_traceability.py --strict (OpenAPI x-roles/x-rbac/x-rbac-field vs rbac-matrix).
    # The matrix is written to a temp file: the committed docs/qa/traceability.md is QA's to regenerate.
    name: API contract (spec validator · RBAC --strict)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: openapi-spec-validator (openapi.yaml + openapi.test.yaml)
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet --disable-pip-version-check openapi-spec-validator==0.7.2
          "$RUNNER_TEMP/venv/bin/openapi-spec-validator" product/docs/api/openapi.yaml product/docs/api/openapi.test.yaml
      - name: RBAC / traceability static check (gen_traceability.py --strict)
        run: python3 product/tests/tools/gen_traceability.py --strict --out "$RUNNER_TEMP/traceability.md"
      # QA's role x operation matrix (tests/fixtures/rbac-cases.json|csv) must be regenerated whenever
      # OpenAPI x-roles/x-rbac/x-scope or the DS-E accounts change: stale files = red.
      - name: RBAC case matrix up to date (gen_rbac_cases.py --check)
        run: python3 product/tests/tools/gen_rbac_cases.py --check

  secrets-scan:
    name: gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Run the gitleaks CLI image directly (no license needed, unlike gitleaks-action for orgs).
      # Allowlist with reasons: .github/gitleaks.toml.
      - name: Scan full git history for secrets
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/repo" -w /repo \
            ghcr.io/gitleaks/gitleaks:v8.21.2@sha256:0e99e8821643ea5b235718642b93bb32486af9c8162c8b8731f7cbdc951a7f46 \
            detect --source=/repo --config=/repo/.github/gitleaks.toml --redact --verbose --exit-code 1

  docker-build:
    # Push/PR keep the exact name (branch protection); T9 runs say so in the job list.
    name: docker images build · E2E smoke${{ (github.event_name == 'schedule' || inputs.t9 == true) && ' · T9 nightly' || '' }}
    runs-on: ubuntu-24.04
    # 14.5–16.3 min on 17–18/10 (E2E ≈ 12.5 min): about half of the cap, kept at 30.
    timeout-minutes: 30
    needs: build-test
    env:
      TURBO_TELEMETRY_DISABLED: '1'
      # 'true' on the nightly schedule and on a manual run with t9 ticked; 'false' on push / pull_request.
      T9: ${{ github.event_name == 'schedule' || inputs.t9 == true }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build api image (production build, INCLUDE_TEST_SUPPORT=0)
        run: docker build -f product/infra/docker/Dockerfile.api -t ottimo-api:ci product
      # BUG-R1-SEC-08: fail if the production image ships TestSupportModule or any /__test__ route.
      # Must stay green before BE merges TestSupportModule (R2) – do not mark continue-on-error.
      - name: Production api bundle has no test-only code
        run: |
          rm -rf "$RUNNER_TEMP/api-bundle" && mkdir -p "$RUNNER_TEMP/api-bundle"
          cid=$(docker create ottimo-api:ci)
          docker cp "$cid:/app/dist" "$RUNNER_TEMP/api-bundle/dist"
          # Workspace packages bundled into the image (if any) are checked too.
          docker cp "$cid:/app/node_modules/@ottimo" "$RUNNER_TEMP/api-bundle/ottimo-packages" 2>/dev/null || true
          docker rm "$cid"
          dirs="$RUNNER_TEMP/api-bundle/dist"
          [ -d "$RUNNER_TEMP/api-bundle/ottimo-packages" ] && dirs="$dirs $RUNNER_TEMP/api-bundle/ottimo-packages"
          bash product/infra/ci/check-no-test-surface.sh bundle $dirs
      - name: Build web image
        run: docker build -f product/infra/docker/Dockerfile.web -t ottimo-web:ci product
      # Staging/production files are checked on every PR (FB-R2-SEC-OPS-03 point 4): the compose file interpolates
      # with the server template, and the production Caddyfile – run from the image just built, *.localhost names,
      # internal CA, no Internet – serves CSP/HSTS/Referrer-Policy, 404 on blob/dot-file probes, 413 over 1 MB and
      # masks /g/<token> in its log (infra/ci/check-caddy-prod.sh).
      - name: Production compose rules + Caddyfile.prod on the built web image (hardened like production)
        run: |
          bash product/infra/ci/check-compose.sh
          bash product/infra/ci/check-caddy-prod.sh ottimo-web:ci
      - name: Smoke test GET /health against PostgreSQL (app role, same init scripts as dev)
        env:
          PG_IMAGE: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        run: |
          docker network create ottimo-ci
          docker run -d --name pg --network ottimo-ci \
            -e POSTGRES_USER=ottimo_admin -e POSTGRES_PASSWORD=ci_admin_only -e POSTGRES_DB=ottimo \
            -e OTTIMO_MIGRATOR_DB_PASSWORD=ci_migrator_only -e OTTIMO_APP_DB_PASSWORD=ci_app_only \
            -v "$GITHUB_WORKSPACE/product/infra/postgres/init:/docker-entrypoint-initdb.d:ro" \
            "$PG_IMAGE"
          for i in $(seq 1 30); do
            docker exec pg pg_isready -h 127.0.0.1 -U ottimo_admin -d ottimo && break; sleep 2
          done
          # Migrate from the production image itself (dist/db/migrate-cli.js + dist/db/migrations), as a
          # deploy does: ottimo_migrator → SET ROLE ottimo_owner. Re-run must be a no-op.
          for run in 1 2; do
            docker run --rm --network ottimo-ci \
              -e MIGRATION_DATABASE_URL=postgres://ottimo_migrator:ci_migrator_only@pg:5432/ottimo \
              ottimo-api:ci node dist/db/migrate-cli.js
          done
          docker run -d --name api --network ottimo-ci -p 127.0.0.1:3000:3000 -e APP_ENV=test \
            -e DATABASE_URL=postgres://ottimo_app:ci_app_only@pg:5432/ottimo ottimo-api:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/health; then
              # The image must refuse to start without APP_ENV (fail-fast config, FB-R1-SEC-OPS-09).
              if docker run --rm --network ottimo-ci \
                -e DATABASE_URL=postgres://ottimo_app:ci_app_only@pg:5432/ottimo ottimo-api:ci; then
                echo "api started without APP_ENV"; exit 1
              fi
              exit 0
            fi
            sleep 2
          done
          docker logs pg
          docker logs api
          exit 1
      - name: Remove production-image smoke containers (frees port 3000 for the compose stack)
        if: always()
        run: |
          docker rm -f api pg >/dev/null 2>&1 || true
          docker network rm ottimo-ci >/dev/null 2>&1 || true

      # ---- E2E smoke (QA W8, rounds/round-02/outputs/QA/w1-report.md): the dev compose stack, one-shot ----
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: product/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: product/.nvmrc
          cache: pnpm
          cache-dependency-path: product/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: product
        run: pnpm install --frozen-lockfile
      - name: Playwright version
        id: pw
        working-directory: product
        run: echo "version=$(pnpm --filter @ottimo/tests exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium-webkit
      # Browsers are cached; their OS libraries (apt) are not, so install-deps runs on a cache hit too.
      - name: Install Playwright browsers (chromium, webkit – projects in e2e/playwright.config.ts)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        working-directory: product
        run: pnpm --filter @ottimo/tests exec playwright install --with-deps chromium webkit
      - name: Install Playwright OS dependencies (browser cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        working-directory: product
        run: pnpm --filter @ottimo/tests exec playwright install-deps chromium webkit
      # Random per-run passwords (DB roles, QA_SEED_PASSWORD) – masked, never a repo secret.
      - name: Create throwaway product/.env
        run: bash product/infra/ci/make-ci-env.sh product/.env.example product/.env
      # Turn the api's Origin lists on (compose passes API_*_BASE_URL → ADMIN/STAFF/GUEST_BASE_URL; empty in dev)
      # so TC-SEC-024 (SR-SES-09: staff login from guest-web → 403) runs instead of skipping. Values must equal
      # the origins the E2E harness sends (E2E_ORIGIN / E2E_GUEST_ORIGIN below). Not secrets.
      - name: Enable api Origin checks for the E2E stack
        run: |
          {
            echo 'API_ADMIN_BASE_URL=http://localhost:8081'
            echo 'API_STAFF_BASE_URL=http://localhost:8082'
            echo 'API_GUEST_BASE_URL=http://localhost:8083'
          } >> product/.env
      # `db-roles` (one-shot, 02-roles.sh – SEC H3) then `migrate` (one-shot) run first; api/worker wait for both.
      # On failure the reason is printed right here (ORC 16/10: run 38929255451 only said "api is unhealthy").
      - name: Start compose stack (postgres, db-roles, migrate, api, worker, web)
        working-directory: product
        run: |
          dc() { docker compose --env-file .env -f infra/docker-compose.yml "$@"; }
          if ! dc up --build --detach --wait --wait-timeout 300; then
            echo "::error::compose stack did not become healthy – service states and logs follow"
            dc ps --all
            for s in db-roles migrate api worker web; do
              echo "::group::logs $s"
              dc logs --no-color --tail 200 "$s" || true
              echo "::endgroup::"
            done
            exit 1
          fi
      # SEC s3-checklist H3: the runtime role limits must be in force on the stack the tests use.
      - name: DB role limits applied (ottimo_app rolconfig)
        working-directory: product
        run: |
          cfg=$(docker compose --env-file .env -f infra/docker-compose.yml exec -T postgres \
            sh -c 'psql -X -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tA' <<'SQL'
          SELECT array_to_string(rolconfig, ',') FROM pg_roles WHERE rolname = 'ottimo_app';
          SQL
          )
          echo "ottimo_app rolconfig: $cfg"
          case ",$cfg," in *,idle_in_transaction_session_timeout=30s,*) ;; *) echo "::error::idle_in_transaction_session_timeout missing"; exit 1 ;; esac
          case ",$cfg," in *,statement_timeout=15s,*) ;; *) echo "::error::statement_timeout missing"; exit 1 ;; esac
      # DS-E accounts qa.* (password = QA_SEED_PASSWORD of this run): without them every E2E login is 401 and
      # the harness used to retry until SR-RL-01 answered 429 (run 38887585274). QA, round-02 s1-report mục 8.
      - name: Load QA seed DS-E (one-shot, profile seed)
        working-directory: product
        # The loader writes the trusted-device tokens to the bind-mounted tests/fixtures/seed/.out/ds-e.map.json with
        # mode 0600. Run it as the RUNNER's uid (not the image's `node`, uid 1000 ≠ runner 1001): otherwise the file
        # belongs to 1000 and the E2E process cannot read it → no device cookie → DEVICE_NOT_TRUSTED on every C3 case
        # (TC-L3-060..062, SEC-C3 – blocker verification 17/10). The directory stays writable for that uid only.
        run: |
          mkdir -p tests/fixtures/seed/.out
          chmod 0700 tests/fixtures/seed/.out
          docker compose --env-file .env -f infra/docker-compose.yml run --rm --user "$(id -u):$(id -g)" seed
          test -r tests/fixtures/seed/.out/ds-e.map.json || { echo "::error::seed device map not readable by the runner"; ls -ln tests/fixtures/seed/.out; exit 1; }
      # E2E_COMPOSE_CONTROL=1: TC-X-050c may stop/start postgres – this stack is disposable.
      # E2E_UI=1 (QC Sprint 2 ĐK-S2-4, QA s3-kickoff): project desk-chromium drives admin-web in Chromium against the
      # real api – UI smoke (login/menus, rack, booking, two desks saving at once) + axe H01–H12 (0 critical/serious).
      # E2E_WEB_URL must be http://localhost:8081: the browser sends the page origin as Origin and the api only
      # accepts API_ADMIN_BASE_URL (http://localhost:8081) – 127.0.0.1:8081 would get 403 on every write.
      - name: E2E (pnpm test:e2e – API, RBAC, UI desk-chromium + axe)
        working-directory: product
        env:
          E2E_API_URL: http://127.0.0.1:3000
          E2E_WEB_URL: http://localhost:8081
          E2E_ORIGIN: http://localhost:8081
          E2E_GUEST_ORIGIN: http://localhost:8083
          E2E_COMPOSE_CONTROL: '1'
          E2E_UI: '1'
        # T9 = the same suite and configured reporters plus a JSON report (every attempt with its retry index and
        # annotations) for the retry guard below. Push / pull_request run exactly `pnpm test:e2e` as before.
        run: |
          if [ "$T9" = true ]; then
            PLAYWRIGHT_JSON_OUTPUT_FILE="$PWD/tests/e2e/test-results/t9-report.json" \
              pnpm --filter @ottimo/tests run test:e2e --add-reporter=json
          else
            pnpm test:e2e
          fi
      # The origin-list cases must really run on this stack (Sprint 1 carry-over: TC-SEC-024 used to skip).
      - name: Origin checks ran (TC-SEC-024 not skipped)
        working-directory: product
        run: |
          junit=tests/e2e/test-results/junit.xml
          [ -f "$junit" ] || { echo "::error::$junit missing"; exit 1; }
          python3 - "$junit" <<'PY'
          import sys, xml.etree.ElementTree as ET
          cases = [c for c in ET.parse(sys.argv[1]).iter('testcase') if 'TC-SEC-024' in (c.get('name') or '')]
          if not cases:
              sys.exit('::error::TC-SEC-024 not found in junit report')
          skipped = [c.get('name') for c in cases if c.find('skipped') is not None]
          if skipped:
              sys.exit('::error::TC-SEC-024 skipped – api Origin lists not set on the E2E stack: ' + '; '.join(skipped))
          print(f'TC-SEC-024: {len(cases)} case(s) ran')
          PY
      # ĐK-S2-4: the UI cases must really run (no skip because of the environment: browser missing, E2E_UI unset,
      # login form not found). Allowed skips = test.fixme listed here (QA keeps this list in step with ui/*.spec.ts).
      - name: UI cases ran (desk-chromium + desk-clock not skipped, write steps, axe H01–H12 present)
        working-directory: product
        run: |
          python3 - tests/e2e/test-results/junit.xml <<'PY'
          import sys, xml.etree.ElementTree as ET
          ALLOWED_SKIP = ('TC-L2-020 (E)', 'TC-L2-076 (E)')
          cases = list(ET.parse(sys.argv[1]).iter('testcase'))
          ui = [c for c in cases if (c.get('classname') or '').startswith(('ui/', 'ui-clock/'))]
          if not ui:
              sys.exit('::error::no ui/ test case in junit report – desk-chromium did not run')
          if not any((c.get('classname') or '').startswith('ui-clock/') for c in ui):
              sys.exit('::error::no ui-clock/ test case in junit report – desk-clock did not run')
          # QC-S3-09: cases that really click the write steps (fix round 9) must run, never silently skip.
          WRITES = ('TC-L3-075', 'TC-L4-093', 'TC-L4-094', 'TC-L2-085', 'TC-L2-086', 'TC-L3-076', 'TC-L4-095', 'TC-L3-077', 'TC-L4-096', 'TC-X-070', 'TC-X-072')
          ran = {w for w in WRITES for c in ui if w in (c.get('name') or '') and c.find('skipped') is None}
          if ran != set(WRITES):
              sys.exit('::error::UI write-step cases missing or skipped: ' + ', '.join(sorted(set(WRITES) - ran)))
          skipped = [c.get('name') for c in ui if c.find('skipped') is not None]
          bad = [n for n in skipped if not any(a in (n or '') for a in ALLOWED_SKIP)]
          if bad:
              sys.exit('::error::UI cases skipped (environment): ' + '; '.join(bad))
          axe = [c for c in ui if 'TC-X-040' in (c.get('name') or '') and c.find('skipped') is None]
          if len(axe) < 9:
              sys.exit(f'::error::axe H01–H12: only {len(axe)} case(s) ran, expected 9')
          print(f'UI: {len(ui)} case(s), {len(skipped)} allowed skip(s), axe {len(axe)} case(s) ran')
          PY
      # T9 only (qa/s4-test-plan 3.2 point 3, BUG-R2-064 point 2): a retry must not hide a known-bug case, so red when
      # a case annotated `bug` (knownBug) needed a retry, and red on any attempt annotated `precondition-failed`, even
      # if the retry passed. Other flaky cases are warnings for QA's morning log. The table goes to the run summary.
      # Runs after a red E2E too, so the summary always lists what failed.
      - name: T9 retry guard + summary (bug-annotated retries, precondition-failed)
        if: ${{ !cancelled() && env.T9 == 'true' }}
        working-directory: product
        run: |
          python3 - tests/e2e/test-results/t9-report.json <<'PY'
          import collections, json, os, sys
          path = sys.argv[1]
          if not os.path.isfile(path):
              sys.exit(f'::error::{path} missing – E2E did not reach the end of the run')
          report = json.load(open(path, encoding='utf-8'))
          rows = []
          def walk(suite):
              for spec in suite.get('specs') or []:
                  for t in spec.get('tests') or []:
                      results = t.get('results') or []
                      notes = list(t.get('annotations') or [])
                      for r in results:
                          notes += r.get('annotations') or []
                      kinds = {n.get('type') for n in notes}
                      rows.append({
                          'project': t.get('projectName') or '?',
                          'case': f"{spec.get('file')}:{spec.get('line')} {spec.get('title')}",
                          'status': t.get('status'),
                          'retries': max([r.get('retry') or 0 for r in results] or [0]),
                          'bug': 'bug' in kinds,
                          'pre': 'precondition-failed' in kinds,
                      })
              for child in suite.get('suites') or []:
                  walk(child)
          for s in report.get('suites') or []:
              walk(s)
          per = collections.defaultdict(collections.Counter)
          for r in rows:
              per[r['project']][r['status']] += 1
          masked = [r for r in rows if r['bug'] and r['retries'] > 0]
          pre = [r for r in rows if r['pre']]
          failed = [r for r in rows if r['status'] == 'unexpected']
          flaky = [r for r in rows if r['status'] == 'flaky' and not (r['bug'] or r['pre'])]
          errors = [((e.get('message') or 'error').splitlines() or ['error'])[0] for e in report.get('errors') or []]
          sha, event = os.environ.get('GITHUB_SHA', '')[:7], os.environ.get('GITHUB_EVENT_NAME', '')
          out = ['## T9 nightly – E2E', '', f'Commit `{sha}`, event `{event}`.', '',
                 '| Project | expected | unexpected | flaky | skipped |', '|---|---|---|---|---|']
          for p in sorted(per):
              c = per[p]
              out.append(f"| {p} | {c['expected']} | {c['unexpected']} | {c['flaky']} | {c['skipped']} |")
          for p in ('mobile-webkit', 'android-chromium'):
              if p not in per:
                  out.append(f'| {p} | 0 | 0 | 0 | 0 |')
                  print(f'::notice::T9: project {p} has no test yet (flows/*.mobile.spec.ts)')
          def section(title, items):
              if items:
                  out.extend(['', f'### {title} ({len(items)})'])
                  out.extend(f"- [{r['project']}] {r['case']} (retry {r['retries']})" for r in items)
          section('RED – known-bug case needed a retry', masked)
          section('RED – precondition-failed', pre)
          section('Failed (unexpected)', failed)
          section('Flaky, passed on retry – QA logs these', flaky)
          if errors:
              out.extend(['', f'### Run errors ({len(errors)})', *[f'- {e}' for e in errors]])
          summary = os.environ.get('GITHUB_STEP_SUMMARY')
          if summary:
              with open(summary, 'a', encoding='utf-8') as f:
                  f.write('\n'.join(out) + '\n')
          print('\n'.join(out))
          for r in flaky:
              print(f"::warning::T9 flaky: [{r['project']}] {r['case']}")
          bad = [f"[{r['project']}] {r['case']}" for r in masked + pre]
          if bad:
              sys.exit('::error::T9 retry guard: ' + '; '.join(bad))
          if failed or errors:
              sys.exit(f'::error::T9: {len(failed)} failed case(s), {len(errors)} run error(s) – see the summary')
          print(f'T9: {len(rows)} case(s), {len(flaky)} flaky, 0 masked by retry')
          PY
      - name: Compose logs (on failure)
        if: failure()
        working-directory: product
        run: |
          [ -f .env ] || exit 0
          docker compose --env-file .env -f infra/docker-compose.yml ps --all || true
          for s in api worker db-roles migrate web postgres; do
            echo "::group::logs $s"
            docker compose --env-file .env -f infra/docker-compose.yml logs --no-color --tail 300 "$s" || true
            echo "::endgroup::"
          done
      # Test data is fake (test-strategy section 4); reports hold no secrets (passwords are masked/not logged).
      # T9 keeps the report (junit.xml, t9-report.json, HTML) on every run, green or red, for 14 days: QA logs the
      # night's failures the next morning (qa/s4-test-plan 3.2 points 2 and 4).
      - name: Upload Playwright report (on failure; every T9 run)
        if: ${{ failure() || (!cancelled() && env.T9 == 'true') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.T9 == 'true' && 't9-playwright-report' || 'playwright-report' }}
          path: |
            product/tests/e2e/playwright-report
            product/tests/e2e/test-results
          retention-days: ${{ env.T9 == 'true' && 14 || 7 }}
          if-no-files-found: ignore
      - name: Stop compose stack
        if: always()
        working-directory: product
        run: |
          [ -f .env ] || exit 0
          docker compose --env-file .env -f infra/docker-compose.yml down --volumes --remove-orphans
          rm -f .env

  # ---- Images + staging deploy (R2, hosting-plan 6). Both jobs are OFF until the repository variables say so:
  #   PUBLISH_IMAGES=true   push images to GHCR (private packages of this repository owner)
  #   STAGING_DEPLOY=true   + STAGING_SSH_HOST (variable), STAGING_SSH_KEY / STAGING_SSH_KNOWN_HOSTS (secrets of the
  #                         `staging` environment) – the key only runs infra/server/bin/deploy-from-ci.sh on the VPS
  # Only pushes to main; packages: write exists in publish-images only (FB-R1-SEC-OPS-04). The T9 nightly (schedule)
  # and manual runs (workflow_dispatch) never match `github.event_name == 'push'`: they never publish nor deploy.
  #   VITE_DESK_PHONE       repository VARIABLE (not a secret – public front desk number): baked into the web image
  #                         (staff PWA "Gọi lễ tân", guest web). Missing/malformed = publish-images fails before any
  #                         build (UXR P-15, infra/docker/check-web-build-config.sh, format in product/.env.example)
  publish-images:
    name: publish images (GHCR)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PUBLISH_IMAGES == 'true'
    needs: [build-test, docker-build, secrets-scan, test-surface-guard, contract-lint, api-contract, infra-scripts]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.build.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build (api production + api -test variant for staging + web + landing)
        id: build
        env:
          # Public number, passed by name to docker build (value from the environment, not the command line).
          VITE_DESK_PHONE: ${{ vars.VITE_DESK_PHONE }}
        run: |
          # Fail in seconds, before the api builds, when the desk phone is missing or malformed (UXR P-15).
          WEB_BUILD_PROFILE=production sh product/infra/docker/check-web-build-config.sh
          owner=$(tr '[:upper:]' '[:lower:]' <<<"$GITHUB_REPOSITORY_OWNER")
          tag="sha-${GITHUB_SHA::12}"
          api="ghcr.io/$owner/ottimo-api"; web="ghcr.io/$owner/ottimo-web"
          docker build -f product/infra/docker/Dockerfile.api -t "$api:$tag" product
          docker build -f product/infra/docker/Dockerfile.api --build-arg INCLUDE_TEST_SUPPORT=1 -t "$api:$tag-test" product
          docker build -f product/infra/docker/Dockerfile.web --build-arg WEB_BUILD_PROFILE=production \
            --build-arg VITE_DESK_PHONE -t "$web:$tag" product
          # Landing (ADR-014, R3 v1.0): the release image (indexable) – reaches the public only through the release
          # workflow (tag landing-v*, environment production = INV approval); staging serves it behind basic auth.
          landing="ghcr.io/$owner/ottimo-landing"
          docker build -f product/infra/docker/Dockerfile.landing --build-arg LANDING_SITE_URL=https://ottimo.vn \
            --build-arg LANDING_INDEXABLE=true -t "$landing:$tag" product
          # The production tag must not contain test endpoints (BUG-R1-SEC-08) – same guard as docker-build.
          rm -rf "$RUNNER_TEMP/b" && mkdir -p "$RUNNER_TEMP/b"
          cid=$(docker create "$api:$tag"); docker cp "$cid:/app/dist" "$RUNNER_TEMP/b/dist"; docker rm "$cid" >/dev/null
          bash product/infra/ci/check-no-test-surface.sh bundle "$RUNNER_TEMP/b/dist"
          { echo "tag=$tag"; echo "api=$api"; echo "web=$web"; echo "landing=$landing"; } >> "$GITHUB_OUTPUT"
      - name: Push to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.build.outputs.tag }}
          API: ${{ steps.build.outputs.api }}
          WEB: ${{ steps.build.outputs.web }}
          LANDING: ${{ steps.build.outputs.landing }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$API:$TAG"; docker push "$API:$TAG-test"; docker push "$WEB:$TAG"; docker push "$LANDING:$TAG"
          docker logout ghcr.io
          echo "pushed $API:$TAG(-test), $WEB:$TAG, $LANDING:$TAG"
          # FB-R3-SEC-OPS-02: record the digests THIS run pushed. release.yml takes them from this run's artifact (same
          # commit, CI green) and refuses a release when GHCR now serves something else under the tag.
          d() { docker buildx imagetools inspect "$1" | awk '/^Digest:/ { print $2; exit }'; }
          mkdir -p "$RUNNER_TEMP/digests"
          { echo "tag=$TAG"; echo "api=$(d "$API:$TAG")"; echo "web=$(d "$WEB:$TAG")"; echo "landing=$(d "$LANDING:$TAG")"; } \
            > "$RUNNER_TEMP/digests/image-digests.txt"
          grep -cE '^(api|web|landing)=sha256:[0-9a-f]{64}$' "$RUNNER_TEMP/digests/image-digests.txt" | grep -qx 3 \
            || { echo "::error::could not read the pushed digests"; exit 1; }
          cat "$RUNNER_TEMP/digests/image-digests.txt"
      - name: Keep the pushed digests (read by release.yml)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-digests
          path: ${{ runner.temp }}/digests/image-digests.txt
          retention-days: 90
          if-no-files-found: error

  deploy-staging:
    name: deploy staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PUBLISH_IMAGES == 'true' && vars.STAGING_DEPLOY == 'true'
    needs: publish-images
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: staging
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      # Public repository = public Actions log (SEC s4-SEC.md E.8, R5-01): host, key and known_hosts are secrets of the
      # environment `staging` (masked); no `set -x`, no echo of the environment; ssh LogLevel=ERROR (no host warnings);
      # the forced command answers one summary line only (full output stays in a 0600 log on the VPS).
      - name: Deploy over SSH (forced command deploy-from-ci.sh – the key cannot do anything else)
        env:
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
          HOST: ${{ secrets.STAGING_SSH_HOST }}
          TAG: ${{ needs.publish-images.outputs.tag }}
        run: |
          [ -n "$HOST" ] && [ -n "$SSH_KEY" ] && [ -n "$KNOWN_HOSTS" ] || { echo "::error::STAGING_SSH_HOST / STAGING_SSH_KEY / STAGING_SSH_KNOWN_HOSTS missing"; exit 1; }
          install -d -m 0700 ~/.ssh
          ( umask 077; printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key; printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts )
          trap 'rm -f ~/.ssh/deploy_key ~/.ssh/known_hosts' EXIT
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes -o LogLevel=ERROR -o ConnectTimeout=20 \
            "ottimo@$HOST" "deploy $TAG"

  # Landing preview on staging (R3 v1.0, decision-log 23/10 "landing lên mạng sớm"): every main push with the landing
  # image → staging.<domain> behind basic auth + noindex, after INV approves the `staging` environment. OFF until the
  # repository variable LANDING_PREVIEW_DEPLOY=true (staging must run behind the shared edge first – v1-production.md).
  deploy-landing-preview:
    name: deploy landing preview (staging)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PUBLISH_IMAGES == 'true' && vars.LANDING_PREVIEW_DEPLOY == 'true'
    needs: [publish-images, deploy-staging]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: staging
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      - name: Deploy landing over SSH (forced command deploy-from-ci.sh)
        env:
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
          HOST: ${{ secrets.STAGING_SSH_HOST }}
          TAG: ${{ needs.publish-images.outputs.tag }}
        run: |
          [ -n "$HOST" ] && [ -n "$SSH_KEY" ] && [ -n "$KNOWN_HOSTS" ] || { echo "::error::STAGING_SSH_HOST / STAGING_SSH_KEY / STAGING_SSH_KNOWN_HOSTS missing"; exit 1; }
          install -d -m 0700 ~/.ssh
          ( umask 077; printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key; printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts )
          trap 'rm -f ~/.ssh/deploy_key ~/.ssh/known_hosts' EXIT
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes -o LogLevel=ERROR -o ConnectTimeout=20 \
            "ottimo@$HOST" "landing $TAG"
