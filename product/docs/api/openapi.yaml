  /v1/properties/{propertyId}/reservations/{reservationId}/actions/confirm-deposit:
    parameters:
      - $ref: '#/components/parameters/PropertyId'
      - $ref: '#/components/parameters/ReservationId'
    post:
      tags: [reservations]
      operationId: confirmDeposit
      summary: Xác nhận cọc/ký quỹ – hold → confirmed (B4); dài hạn sinh HĐ + lịch kỳ thu (H1, US-086)
      description: |
        Ghi giao dịch `succeeded` (nếu gửi `payment`) rồi, **nếu tổng cọc đã đủ** `depositRequiredVnd`, chuyển `hold → confirmed` (B4) trong cùng giao dịch; kiểm trùng lại (BR-906).
        **Chưa đủ (US-086 AC2, 0.3.5 A-13)**: giao dịch vẫn được ghi, đơn giữ `hold` → **`200`** trả `Reservation` (`status=hold`, `depositPaidVnd` mới) – client báo
        "Đã ghi nhận, còn thiếu {depositRequiredVnd − depositPaidVnd}". Không trả 4xx khi đã ghi tiền (4xx = không có gì được ghi; client gửi lại an toàn).
        `422 DEPOSIT_INSUFFICIENT` chỉ khi **không** gửi `payment` mới (dùng `existingPaymentId` hoặc gọi lại) mà tổng cọc vẫn thiếu – không ghi gì.
        Giữ chỗ đã quá hạn chỉ xác nhận khi tiền về trước hạn (`receivedAt` < `hold.expiresAt`, US-085 AC4), ngược lại `409 HOLD_EXPIRED` (+ `expiredAt`).
        CTV **không** được gọi (rbac ghi chú 20) – CTV dùng `.../deposit-notices`.
      x-roles: [owner, manager, front_desk_lead, front_desk, sales_staff]
      x-scope: { sales_staff: own }
      x-rbac: [A04]
      x-transition: B4
      x-stories: [US-086, US-119]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                payment: { $ref: '#/components/schemas/PaymentCreate' }
                existingPaymentId: { $ref: '#/components/schemas/Uuid' }
                acceptShortfallReason:
                  type: string
                  minLength: 3
                  maxLength: 500
                  x-rbac-field: D12c
                  description: |
                    0.3.6 (B-29, DOM D-9). **Chỉ MGR+** (FD/FDL/SAL gửi → `403 FORBIDDEN_ACTION`). Đơn `hold` có tổng cọc `succeeded` > 0 (= 0 → `409 INVALID_TRANSITION`).
                    Tổng cọc < `depositRequiredVnd` mà có lý do → B4 `confirmed` (giữ `shortfallVnd` trên đơn), audit `money` + `StaffNotification`
                    `deposit_shortfall_accepted` tới OWN. Audit `category='money'`, `action='deposit.shortfall_accepted'`, `after` có `shortfallVnd`, `reason` (UXD #3).
                    Không gửi → hành vi A-13 (200, vẫn `hold`).
            example:
              payment: { type: deposit, method: bank_transfer, amountVnd: 1500000, receivedAt: '2026-10-15T10:12:00+07:00', note: CK Vietcombank }
      responses:
        '200': { $ref: '#/components/responses/ReservationOk' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/VersionConflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
