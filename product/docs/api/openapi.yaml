  # ───────────────────────── auth / users ─────────────────────────
  /v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Đăng nhập nhân viên (US-001)
      security: []
      x-roles: [public]
      x-stories: [US-001]
      x-rate-limit: 5 sai/tài khoản/15 phút; 20 lần/IP/15 phút (SR-RL-01)
      description: |
        Đặt cookie `__Host-ottimo_sid` (HttpOnly) và trả token CSRF. Sai nhiều lần → khóa tạm, `429 RATE_LIMITED`.
        Thông báo lỗi không phân biệt "sai tên" hay "sai mật khẩu"; thời gian phản hồi đồng đều.
        **`username` duy nhất toàn hệ thống** (không chỉ theo tổ chức) nên body không cần mã tổ chức; tra người dùng bằng hàm
        `auth_find_user()` SECURITY DEFINER (erd mục 2.4) vì chưa có ngữ cảnh RLS.
        Tài khoản có 2FA (R3): trả `401 MFA_REQUIRED` kèm `mfaToken` ngắn hạn → gọi `POST /v1/auth/login/mfa`.
        Mật khẩu tạm (`mustChangePassword=true` trong `Me`): mọi API khác trả `403 PASSWORD_CHANGE_REQUIRED` cho tới khi đổi.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string, minLength: 3, maxLength: 64 }
                password: { type: string, minLength: 8, maxLength: 256, writeOnly: true }
            example: { username: hanh.fd, password: '********' }
      responses:
        '200':
          description: Đăng nhập thành công
          headers:
            Set-Cookie:
              schema: { type: string }
              description: '__Host-ottimo_sid=...; HttpOnly; Secure; SameSite=Lax; Path=/'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /v1/auth/login/mfa:
    post:
      tags: [auth]
      operationId: loginMfa
      summary: Bước 2 đăng nhập – mã TOTP hoặc mã khôi phục (SR-AUTH-06)
      security: []
      x-roles: [public]
      x-round: R3
      x-stories: [US-001]
      x-rate-limit: 5 sai/người/15 phút (SR-RL-02)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mfaToken, code]
              properties:
                mfaToken: { type: string, writeOnly: true, description: Token ngắn hạn (5 phút) trả kèm 401 MFA_REQUIRED }
                code: { type: string, pattern: '^([0-9]{6}|[A-Z0-9]{10})$', writeOnly: true, description: TOTP 6 số hoặc mã khôi phục 10 ký tự }
      responses:
        '200':
          description: Đăng nhập thành công (đặt cookie như `login`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Hủy phiên hiện tại. Tự nhiên idempotent (gọi lại vẫn 204) nên không cần Idempotency-Key.
      x-roles: [any_staff]
      x-stories: [US-001]
      responses:
        '204': { description: Đã hủy phiên }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /v1/me/password:
    post:
      tags: [auth]
      operationId: changeMyPassword
      summary: Tự đổi mật khẩu (cần mật khẩu cũ) – thu hồi mọi phiên kể cả phiên đang gọi, cấp phiên mới cho client đang gọi (SR-AUTH-05, SR-SES-02/06)
      description: |
        0.3.4 (Q3, FB-R2-QA-BE-05): đổi thành công → **mọi** phiên của người dùng bị thu hồi, kể cả phiên đang gọi (cookie cũ → `401 UNAUTHENTICATED`);
        server cấp **phiên mới** cho chính client đang gọi qua `Set-Cookie`. `csrfToken` gắn với phiên nên **đổi** → client bắt buộc gọi lại `getMe`
        trước lệnh ghi tiếp theo. `User.version` tăng 1 (màn đang giữ ETag cũ của người dùng này sẽ nhận `412` – tải lại).
        Sai `currentPassword` → `401 REAUTH_FAILED` kèm `errors[{field: currentPassword, code: REAUTH_FAILED}]` – **không** phải hết phiên (Q4).
      x-roles: [any_staff]
      x-stories: [US-001]
      x-rate-limit: 5 sai/người/15 phút
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string, writeOnly: true, minLength: 8, maxLength: 256 }
                newPassword: { type: string, writeOnly: true, minLength: 10, maxLength: 256 }
      responses:
        '204':
          description: Đã đổi; mọi phiên cũ (kể cả phiên gọi) bị thu hồi; cookie phiên mới được đặt; ghi `audit_event` security
          headers:
            Set-Cookie:
              schema: { type: string }
              description: '__Host-ottimo_sid=...; HttpOnly; Secure; SameSite=Lax; Path=/ – phiên mới (csrfToken mới qua getMe)'
        '401': { $ref: '#/components/responses/ReauthFailed' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /v1/me/approval-pin:
    put:
      tags: [auth]
      operationId: setMyApprovalPin
      summary: Đặt/đổi PIN duyệt 6 số (khác mật khẩu, argon2id) – vai có quyền duyệt hoặc xác nhận lại C3 (SR-AUTH-09, SR-C3-09, BR-432)
      x-roles: [owner, manager, front_desk_lead, front_desk]
      x-rbac: [S01]
      x-stories: [US-007]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, pin]
              properties:
                currentPassword: { type: string, writeOnly: true }
                pin: { type: string, pattern: '^[0-9]{6}$', writeOnly: true }
      responses:
        '204': { description: Đã đặt; ghi `audit_event` security }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /v1/me/step-up:
    post:
      tags: [auth]
      operationId: stepUp
      summary: Xác nhận lại bằng PIN duyệt hoặc mật khẩu – mở cửa sổ trượt cho thao tác C3 (SR-C3-09)
      x-roles: [owner, manager, front_desk_lead, front_desk]
      x-rate-limit: 5 sai/người/15 phút (SR-RL-02)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                pin: { type: string, pattern: '^[0-9]{6}$', writeOnly: true }
                password: { type: string, writeOnly: true }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [validUntil]
                properties:
                  validUntil: { $ref: '#/components/schemas/Instant' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /v1/me/2fa:
    get:
      tags: [auth]
      operationId: getMy2fa
      summary: Trạng thái 2FA của tôi (R3; bắt buộc với owner, manager trước khi đưa dữ liệu thật)
      x-roles: [any_staff]
      x-round: R3
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [enabled, required]
                properties:
                  enabled: { type: boolean }
                  required: { type: boolean, description: Vai owner/manager → true }
                  recoveryCodesRemaining: { type: integer }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    delete:
      tags: [auth]
      operationId: disableMy2fa
      summary: Tắt 2FA (không cho vai bắt buộc) – cần mật khẩu + TOTP; thu hồi mọi phiên (SR-SES-06)
      x-roles: [any_staff]
      x-round: R3
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MfaConfirmInput' }
      responses:
        '204': { description: Đã tắt }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/me/2fa/setup:
    post:
      tags: [auth]
      operationId: startMy2faSetup
      summary: Bắt đầu đăng ký TOTP – trả URI otpauth để hiện QR (chỉ trả 1 lần, no-store)
      x-roles: [any_staff]
      x-round: R3
      x-c3-log: { subjectType: mfa_secret, action: create }
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword]
              properties:
                currentPassword: { type: string, writeOnly: true }
      responses:
        '200':
          description: Bí mật tạm (chưa bật cho tới khi xác nhận)
          headers:
            Cache-Control: { schema: { type: string, enum: [no-store] } }
          content:
            application/json:
              schema:
                type: object
                required: [otpauthUri]
                properties:
                  otpauthUri: { type: string, x-classification: C3, description: 'otpauth://totp/OTTIMO:<username>?secret=…', x-rbac-field: D27 }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /v1/me/2fa/confirm:
    post:
      tags: [auth]
      operationId: confirmMy2fa
      summary: Xác nhận mã TOTP đầu tiên → bật 2FA, trả 10 mã khôi phục (một lần, no-store)
      x-roles: [any_staff]
      x-round: R3
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, pattern: '^[0-9]{6}$', writeOnly: true }
      responses:
        '200':
          description: Đã bật
          headers:
            Cache-Control: { schema: { type: string, enum: [no-store] } }
          content:
            application/json:
              schema:
                type: object
                required: [recoveryCodes]
                properties:
                  recoveryCodes: { type: array, items: { type: string }, minItems: 10, maxItems: 10 }
        '422': { $ref: '#/components/responses/ValidationFailed' }
