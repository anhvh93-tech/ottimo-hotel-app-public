    get:
      tags: [folio]
      operationId: listPayments
      summary: Danh sách giao dịch của cơ sở – mặc định "Chờ đối soát" (US-119 AC6, BR-527; S33). FD/FDL/SAL chỉ thấy giao dịch do mình ghi/xác nhận.
      description: |
        **0.3.3 (E05-03)**. Sắp xếp `receivedAt` tăng dần (chờ lâu nhất lên đầu), phân trang con trỏ. Mặc định `reconciliation=pending`.
        `receivedFrom`/`receivedTo` là **ngày nghiệp vụ** (BR-010) của `receivedAt`; khoảng > 92 ngày → 422 `DATE_RANGE_TOO_LONG`. `recordedBy` chỉ nhận người dùng
        của cơ sở (`NOT_IN_LIST`). Phạm vi `own` (FDL, FD, SAL): chỉ giao dịch có `recordedByUserId` hoặc `confirmedByUserId` = người gọi; tham số `recordedBy`
