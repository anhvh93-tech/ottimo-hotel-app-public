        ruleRef: { type: string, example: BR-511 }
    MinibarCheckInput:
      type: object
      required: [mode, lines, roomId, periodId]
      description: '0.3.7 bổ sung 4 (vòng sửa 5b, ARC 16.19 K11-03/K11-08): `roomId` và `periodId` **bắt buộc** với mọi vai (thiếu → 422 `REQUIRED`); bỏ nhánh "vắng = căn đang gán / không so"'
      properties:
        mode: { type: string, enum: [checkout, stayover] }
        lines:
          type: array
          items:
            type: object
            required: [itemId, remainingQty]
            properties:
              itemId: { $ref: '#/components/schemas/Uuid' }
              remainingQty: { type: integer, minimum: 0 }
        performedAt: { $ref: '#/components/schemas/Instant' }
        roomId:
          $ref: '#/components/schemas/Uuid'
          description: '0.3.7 bổ sung 4 (mô hình minibar M-1, BUG-R2-136, BR-703; vòng sửa 5b K11-03): tủ được đếm = `MinibarStandard.roomId` client đang hiển thị (căn cũ của **chính lượt này** sau B14 được; căn khác → 422 `NOT_IN_LIST`). **Bắt buộc** (thiếu → 422 `REQUIRED`); server không còn suy ra "căn đang gán"'
        periodId:
          oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }]
          description: '0.3.7 bổ sung 4 (ARC 16.16 (ab); vòng sửa 5b K11-03/K11-08): `MinibarStandard.periodId` client đã dùng để soạn lần đếm – **bắt buộc**, có thể `null`. Server so **sau khi khóa** (ARC 16.19): lần nạp `periodId` không thuộc tủ (lượt, `roomId`) hoặc không còn là kỳ hiện tại của tủ → 409 `MINIBAR_PERIOD_CHANGED`; `null` = lúc soạn tủ (lượt, `roomId`) **chưa có lần nạp** – dưới khóa tủ đó đã có lần nạp → 409. `null` không bao giờ nghĩa là "kỳ của căn đang gán". Desk và PWA HK gửi nguyên giá trị đã đọc, kể cả lệnh từ hàng đợi offline'
    MinibarCheck:
      type: object
      required: [id, mode, lines]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        mode: { type: string, enum: [checkout, stayover] }
        checkedAt: { $ref: '#/components/schemas/Instant' }
        lines:
          type: array
          items:
            type: object
            required: [itemId, standardQty, remainingQty, usedQty]
            properties:
              itemId: { $ref: '#/components/schemas/Uuid' }
              itemName: { type: string }
              standardQty: { type: integer }
              remainingQty: { type: integer }
              usedQty: { type: integer }
              isFree: { type: boolean }
              amountVnd:
                $ref: '#/components/schemas/MoneyVnd'
                x-visible-to: [owner, manager, front_desk_lead, front_desk]
        totalVnd:
          $ref: '#/components/schemas/MoneyVnd'
          x-visible-to: [owner, manager, front_desk_lead, front_desk]
        refillTaskId: { $ref: '#/components/schemas/Uuid' }
        replacesCheckId: { $ref: '#/components/schemas/Uuid', description: 'Bản kiểm `checkout` trước bị thay (dòng folio cũ đã đảo) – 0.3.3, E05-04' }
        checkedByName:
          type: string
          x-rbac-field: D27
          x-visible-to: [owner, manager, front_desk_lead, front_desk]
          description: '0.3.7 (nháp B-8, FE S3-14): tên hiển thị người kiểm (HK hoặc FD)'
    MinibarStandard:
      type: object
      required: [items]
      description: '0.3.3, E05-04. 0.3.7 bổ sung 4: `standardQty` = mốc của tủ (lượt × căn) – mô hình minibar M-1'
      properties:
        roomId:
          $ref: '#/components/schemas/Uuid'
          description: '0.3.7 bổ sung 4 (vòng sửa 5b, K11-03): tủ mà bản chuẩn này mô tả – server **luôn trả**; `periodId` thuộc tủ này. Client gửi lại đúng giá trị này trong `MinibarCheckInput.roomId`'
        roomNo: { type: string }
        periodId:
          oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }]
          description: '0.3.7 bổ sung 4 (ARC 16.16 (ab)): kỳ hiện tại của tủ (`minibar_fill.id` mở kỳ; `null` = tủ chưa có lần nạp) – client gửi lại trong `MinibarCheckInput.periodId`'
        items:
          type: array
          items:
            type: object
            required: [itemId, itemName, standardQty, isFree]
            properties:
              itemId: { $ref: '#/components/schemas/Uuid' }
              itemName: { type: string }
              standardQty: { type: integer, minimum: 1 }
              isFree: { type: boolean }
              unitPriceVnd:
                $ref: '#/components/schemas/MoneyVnd'
                x-visible-to: [owner, manager, front_desk_lead, front_desk]
              lastCheckUsedQty: { type: [integer, 'null'], description: '0.3.7 bổ sung 4 (DOM (e)): đã dùng ở lần đếm trước của món trong tủ (cùng kỳ nạp); `null` = chưa đếm' }
              folioLineId:
                oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }]
                x-visible-to: [owner, manager, front_desk_lead, front_desk]
                description: '0.3.7 bổ sung 4 (DOM (e)): dòng folio **sống** của món trong tủ (dòng thay của `adjustFolioLine` nếu đã sửa); `null` = không có dòng sống (chưa tính, đếm 0, đã void)'
              folioUsedQty:
                type: [integer, 'null']
                x-visible-to: [owner, manager, front_desk_lead, front_desk]
                description: '0.3.7 bổ sung 4 (DOM (e)): số lượng trên dòng folio sống (0 khi dòng đã void/đảo sau lần đếm); `null` = món chưa từng được tính trong tủ'
              folioAmountVnd:
                $ref: '#/components/schemas/MoneyVnd'
                x-visible-to: [owner, manager, front_desk_lead, front_desk]
                description: '0.3.7 bổ sung 4 (DOM (e)): số tiền dòng folio sống (trước FOC)'
              adjustedAfterLastCheck:
                type: boolean
                x-visible-to: [owner, manager, front_desk_lead, front_desk]
                description: '0.3.7 bổ sung 4 (DOM (e)): dòng folio của món bị sửa/void có lý do sau lần đếm trước → Desk cảnh báo, mặc định giữ folio'
        latestCheck:
          oneOf: [{ $ref: '#/components/schemas/MinibarCheck' }, { type: 'null' }]
          description: 'Lần kiểm `checkout` gần nhất trong ngày nghiệp vụ (HK hoặc FD) để điền sẵn. **0.3.7 bổ sung 4 (BUG-R2-144)**: = lần đếm sống của tủ **sau mốc gần nhất** (mở kỳ, lượt vào lại căn, gia hạn B13 – BR-703-02), nhất quán với `minibarUncheckedRooms` – `null` = tủ cần đếm (lại). Vòng sửa 5b (K11-09): tủ **căn đang ở** thêm điều kiện cùng ngày nghiệp vụ hiện tại; tủ căn đã rời không lọc theo ngày'

    # ── duyệt ──
    ApprovalRequest:
      type: object
      required: [id, type, status, amountVnd, reasonCode, requestedBy, requestedAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        type:
          type: string
          enum: [foc, special_discount, refund, contract_override, checkin_room_not_ready, late_checkout_conflict, meter_lower_than_previous, stocktake_variance, damage_pricing, quote_extension, no_show_restore, debt_on_checkout]
        status: { $ref: '#/components/schemas/ApprovalStatus' }
        reservationCode: { type: string }
        folioLineId:
          $ref: '#/components/schemas/Uuid'
          description: '**0.3.7 bổ sung 3 (BE-B, sửa mô tả)**: chỉ `type` ∈ `foc`, `special_discount` – **dòng giảm (FOC, số âm) hiện tại** của yêu cầu: dòng `pending_approval` khi chờ duyệt, dòng đang áp khi đã duyệt; đi theo dòng mới khi dòng được giảm bị ghi lại (BR-434 v0.3.5). Dòng được giảm (dòng gốc) = `FolioLine.relatedLineId` của dòng này. Thay câu "dòng gốc hiện tại" của 0.3.7 bổ sung D1'
        amountVnd: { $ref: '#/components/schemas/MoneyVnd', description: 'Số xin (chờ duyệt) / **số đã duyệt** (BR-434: "số đã duyệt" đọc từ đây, không từ dòng FOC)' }
        effectiveAmountVnd:
          $ref: '#/components/schemas/MoneyVnd'
          description: |
            0.3.7 bổ sung D1 (BR-434 v0.3.5, S4-02/S4-18): chỉ `type` ∈ `foc`, `special_discount`. `pending`: số **sẽ áp nếu duyệt lúc này** = min(`amountVnd`, giá trị dòng hiện tại của khóa)
            – câu "khi duyệt sẽ áp X" (0 khi dòng đang về 0 – duyệt xong FOC ngủ); `approved`: số **đang áp** (dòng FOC sống; 0 khi `focState` ≠ `applied`); folio đã chốt: số thực áp.
            Báo cáo FOC tháng và cảnh báo BR-435 cộng trường này; hạn mức người duyệt (BR-433) cộng `amountVnd` của yêu cầu còn sống (`focState` ∈ `applied`, `dormant`).
            **0.3.7 bổ sung 4 (FB-R2-SEC-BE-80; ARC 16.30) – `reasonCode = debt_write_off`**: `pending`/`escalated` = min(`amountVnd`, giá trị dòng, công nợ đang mở lúc đọc) – số thực áp do
            lúc duyệt quyết; `approved` = số đang áp, không vượt trần cố định lúc duyệt (min(số đã duyệt, công nợ đang mở lúc đó)); `cancelled` (`debt_cleared`) = 0.
        focState:
          type: string
          enum: [applied, dormant, suspended, cancelled]
          description: |
            0.3.7 bổ sung D1 (BR-434, BR-433, BR-315 (g)): chỉ yêu cầu `foc`/`special_discount` **đã duyệt** (vắng với trạng thái khác). `applied` – có dòng FOC sống; `dormant` – dòng của khóa
            về 0 hoặc tạm không có, tự khôi phục khi dòng có lại (vẫn tính hạn mức); `suspended` – đơn no-show (không tính hạn mức, không vào báo cáo; khôi phục B12 → `applied`);
            `cancelled` – FOC hủy theo quy tắc (`focCancelReason`, audit `folio.foc_cancelled`, trả hạn mức). Bất biến: yêu cầu `approved` luôn có đúng một trong bốn giá trị.
        focCancelReason:
          type: string
          enum: [night_removed, reservation_cancelled, settled_while_dormant]
          description: '0.3.7 bổ sung D1: chỉ khi `focState = cancelled` – đêm bỏ không có đêm thay (BR-434 (3)) · đơn `cancelled` · folio chốt khi FOC còn ngủ ("không áp"). **0.3.7 bổ sung 3 (BE-B (g), DOM-S4-15 – không thêm giá trị)**: `settled_while_dormant` = folio chốt khi FOC **chưa áp** – còn `dormant` **hoặc** `suspended` (no-show, dịch vụ giữ); `reservation_cancelled` cũng dùng cho FOC trên dòng dịch vụ giữ khi hủy đơn (BR-434-13)'
        lineChangedNote:
          type: [object, 'null']
          description: |
            0.3.7 bổ sung D1 (BR-434 v0.3.5, S4-18): yêu cầu **chờ duyệt** mà dòng gốc vừa bị ghi lại (B7, B8, B9a, B13, B14, B16, giảm theo số đêm, sửa số khách, đổi giờ trả) – yêu cầu đi theo
            dòng mới; người gửi và hàng chờ thấy "Dòng đã đổi: {oldLineVnd} → {newLineVnd}, khi duyệt sẽ áp {effectiveAmountVnd}" (chuỗi UXD). Lần ghi lại gần nhất; `null` = dòng chưa đổi
            kể từ lúc gửi. Không tên/ghi chú khách.
          required: [oldLineVnd, newLineVnd, cause, changedAt]
          properties:
            oldLineVnd: { $ref: '#/components/schemas/MoneyVnd' }
            newLineVnd: { $ref: '#/components/schemas/MoneyVnd' }
            fromServiceDate: { $ref: '#/components/schemas/LocalDate', description: 'Ngày dịch vụ cũ – chỉ khi yêu cầu chuyển sang đêm khác (BR-434 (2))' }
            toServiceDate: { $ref: '#/components/schemas/LocalDate', description: 'Ngày dịch vụ mới – chỉ khi chuyển đêm' }
            cause:
              type: string
              enum: [move, postpone, prior_night, extend, room_change, early_departure, los_reprice, party_change, checkout_time_change, manual_adjust]
              description: |
                **0.3.7 bổ sung 3 (BE-B)**: thêm `manual_adjust` – lễ tân/quản lý sửa giá dòng bằng `adjustFolioLine` (S4-35). Khi luồng ghi lại không nêu nguyên nhân, server đặt theo loại khóa:
                phụ thu nhận sớm/trả muộn → `checkout_time_change`, phụ thu người (`extra_person`) → `party_change`, còn lại → `move`. Client gặp giá trị lạ → câu chung ("Dòng đã đổi").
            changedAt: { $ref: '#/components/schemas/Instant' }
        autoCancelReason:
          type: string
          enum: [line_removed, reservation_cancelled, reservation_no_show, superseded, no_show_restored, debt_cleared]
          description: |
            0.3.7 bổ sung D1 (BR-434, BR-315 (g)): có khi `status = cancelled` do **hệ thống** (không phải `rejected`) – không còn dòng tương ứng · đơn hủy · đơn no-show · bị yêu cầu mới thay.
            **0.3.7 bổ sung 4 (FB-R2-SEC-BE-80, BR-525 – BE-B, migration 0077; ARC duyệt tên ở lượt kiểm 8)**: `debt_cleared` – FOC `debt_write_off` được duyệt khi công nợ đã về 0 / đã đóng
            (khách trả đủ trong lúc chờ) → hệ thống hủy, không ghi dòng FOC, báo người xin; phản hồi `approveRequest` trả chính yêu cầu với `status = cancelled`, `autoCancelReason = debt_cleared`,
            `effectiveAmountVnd = 0`. Duyệt khi công nợ còn ít hơn số xin → `status = approved`, `effectiveAmountVnd` = số thực áp (= min(số xin, công nợ đang mở lúc duyệt) – giữ cố định về sau),
            `amountVnd` giữ số xin (SM-10).
            **0.3.7 bổ sung 4 (S4-38, BE-B giả định (j))**: thêm `no_show_restored` – B12 khôi phục no-show tự hủy yêu cầu hoàn đã sinh do no-show (S438-CANCEL-03); trước đây ghi `superseded`
            (sai nghĩa – không có yêu cầu mới thay). BE-B dùng giá trị mới khi mở rộng CHECK `approval_request.auto_cancel_reason` (migration số ORC cấp); tới đó vẫn `superseded`. Client gặp giá trị lạ → câu chung.
            Không tính hạn mức; báo người gửi và người đã nhận `approval_requested` (`StaffNotification.kind = approval_cancelled`)
        reasonCode: { type: string }
        reasonNote: { type: string }
        requestedBy: { type: string }
        requestedById:
          $ref: '#/components/schemas/Uuid'
          x-visible-to: [owner, manager, front_desk_lead, front_desk]
          description: '0.3.7 (nháp B-5, UXD/FE): người tạo – Desk ẩn nút "Chi" khi người xem là người tạo (`SELF_REFUND_FORBIDDEN`)'
        requestedAt: { $ref: '#/components/schemas/Instant' }
        requiredRole: { $ref: '#/components/schemas/Role' }
        targetType: { type: string, description: 'Loại đối tượng của yêu cầu (folio_line, reservation, quote…) – 0.3.3' }
        targetCode: { type: string, description: 'Mã hiển thị của đối tượng (mã đơn, số căn…) – không C2/C3; 0.3.3 (BE-A, erd `approval_request.target_code`)' }
        selfApplied: { type: boolean, description: 'true = người gửi tự áp trong hạn mức vai (BR-436, US-007 AC6) – trạng thái `approved` ngay, người duyệt = người gửi; 0.3.3' }
        approverName: { type: string }
        approverRole: { $ref: '#/components/schemas/Role' }
        decidedAt: { $ref: '#/components/schemas/Instant' }
        decisionNote: { type: string }
        approverRemainingMonthlyVnd:
          $ref: '#/components/schemas/MoneyVnd'
          x-visible-to: [owner, manager, front_desk_lead]
        refundDestination:
          type: object
          description: 'Chỉ yêu cầu `refund` – nơi nhận hoàn **đã che** (D15). Số đầy đủ chỉ qua `getRefundDestination` (0.3.6, A-33)'
          x-visible-to: [owner, manager, front_desk_lead, front_desk]
          properties:
            method: { type: string, enum: [cash, bank_transfer, original_method] }
            bankBin: { type: string }
            accountNoLast4: { type: string, pattern: '^[0-9]{4}$', x-rbac-field: D15 }
            setAt: { $ref: '#/components/schemas/Instant' }
        refundedVnd: { $ref: '#/components/schemas/MoneyVnd', description: 'Đã chi theo yêu cầu `refund` (0.3.6)' }
        version:
          type: integer
          description: '0.3.7 (B-6, CỔNG): tăng khi đổi trạng thái, số tiền, nơi nhận hoàn – gửi lại ở `approveRequest`/`rejectRequest.expectedVersion` (bắt buộc với `refund`)'

    # ── nhật ký ──
    AuditEvent:
      type: object
      required: [occurredAt, actorType, category, action]
      properties:
        occurredAt: { $ref: '#/components/schemas/Instant' }
        actorType: { type: string, enum: [user, guest, system] }
        actorName: { type: string, x-rbac-field: D27 }
        category: { type: string, enum: [money, state, config, access, security, data] }
        action:
          type: string
          example: folio_line.adjusted
          description: |
            **0.3.6 bổ sung 2 (BA v0.3, ARC 17/10) (UXD FB-R2-UXD-FE-S3-09)** – với `category = money` đây là **tập đóng** (thêm mã mới = đổi hợp đồng; BE có test mọi `recordMoney` ∈ danh sách;
            FE có câu `mlog.a_*` cho từng mã, mã lạ → `mlog.a_other`):
            `payment.recorded`, `payment.qr_created`, `payment.confirmed_received`, `payment.expired`, `payment.reconciled`, `payment.cash_handover_confirmed`,
            `payment.reversed`, `payment.ota_collected`, `payment.ota_collect_adjusted`, `folio.line_posted`, `folio.line_reversed`, `folio_line.adjusted`,
            `folio.settled`, `folio.stay_reversed`, `folio.foc_requested`, `folio.foc_posted`, `folio.foc_rejected`, `folio.foc_cancelled`, `folio.foc_dormant`,
            `folio.foc_suspended`, `folio.foc_restored`, `folio.damage_posted`, `folio.damage_rejected`,
            `refund.destination_set`, `refund.paid`, `refund.cash_paid`, `deposit.shortfall_accepted`, `reservation.deposit_confirmed`,
            `reservation.no_show_deposit_retained`, `reservation.cancellation_fee`, `reservation.debt_on_checkout`, `reservation.early_departure`,
            `reservation.extended`, `reservation.prior_night_added`, `reservation.extra_night_on_checkout`, `reservation.late_fee_instead_of_night`, `reservation.priced`, `reservation.repriced`,
            `reservation.room_change_repriced`, `reservation.closer_changed`, `commission.projected`, `commission.earned`, `commission.voided`,
            `channel_fee.recorded`, `channel_fee.updated`, `overbooking.relocation_cost`, `approval.requested`, `approval.self_applied`, `approval.approved`,
            `approval.rejected`, `approval.escalated`, `approval.reopened`, `approval.cancelled` (yêu cầu loại tiền), `approval.applied_capped`, `config.changed` (chỉ khóa `payment_receiving_account`).
            **0.3.7 bổ sung 4 (FB-R2-SEC-BE-80, BR-525 – BE-B; ARC duyệt ở lượt kiểm 8)**: `approval.applied_capped` – FOC `debt_write_off` được duyệt nhưng chỉ áp tới công nợ đang mở lúc duyệt (`before.amountVnd` = số xin, `after.appliedVnd` = số áp, `after.openDebtVnd`, `after.reasonCode` = `debt_write_off`; `reason` = mã `debt_collected_before_approval`). Yêu cầu tự hủy vì hết nợ: `approval.cancelled` với `reason` = `auto: debt_cleared`. **ARC 16.31**: nghĩa của mã lý do theo **điều kiện** – công nợ đang mở lúc duyệt < số đã duyệt – không khẳng định nguyên nhân; ở R2 (sau BUG-R2-207, điều kiện OPS của BUG-R2-210) nguyên nhân duy nhất còn lại là khoản thu trong lúc chờ (khoản thu trả công nợ trước – BR-525 G-6). Đường mới làm giảm công nợ đang mở phải thêm mã lý do riêng; Desk gặp mã lạ hiện câu chung.
            `payment.recorded`: phân biệt sale/CTV bằng `after.recordedByRole`; phương thức ở `after.method`, chờ đối soát ở `after.reconciliation`.
            **0.3.7 bổ sung D1 (BR-433, BR-434 v0.3.5, BR-315 (g) – S4-02/S4-18/S4-22)**: `folio.foc_cancelled` – FOC đã duyệt hủy theo quy tắc, trả hạn mức (`after`: `approvalRequestId`,
            `serviceDate`, `amountVnd` = số đã duyệt trả lại, `reason` = `focCancelReason`); `folio.foc_dormant` – dòng của khóa về 0, dòng FOC đảo, yêu cầu vẫn `approved`;
            `folio.foc_suspended` – đơn no-show, FOC tạm dừng (không tính hạn mức); `folio.foc_restored` – FOC áp lại (`after.from` ∈ `dormant`, `suspended`). Yêu cầu chờ duyệt tự hủy dùng
            `approval.cancelled` (đã có). Mọi mã ghi `entityType = approval_request`, `entityCode` = mã đơn.
        entityType: { type: string }
        entityId: { type: string, description: 'Id thực thể – thường UUID, một số thực thể khóa text/bigint (erd 4.3 `audit_event.entity_id` text – 0.3.3 nới từ `Uuid`)' }
        entityCode: { type: string, description: 'Mã chứng từ hiển thị (OTM-00171, PT-000231…) – erd `audit_event.entity_code` (S27)' }
        before: { type: object, additionalProperties: true, description: 'Sinh bằng serializer audit theo danh sách trường cho phép từng thực thể; không bao giờ chứa cột `_enc`/giá trị C3; C2 che theo danh sách (SR-AUD-03)' }
        after: { type: object, additionalProperties: true, description: Như `before` }
        reason: { type: string }
    C3AccessEntry:
      type: object
      required: [occurredAt, actorType, subjectType, action]
      properties:
        occurredAt: { $ref: '#/components/schemas/Instant' }
        actorType: { type: string, enum: [user, guest, system], description: 'guest = khách xem mã cửa qua app mức 2 (SR-GST-10)' }
        userName: { type: string, description: Vắng khi actorType ≠ user, x-rbac-field: D27 }
        sessionRef: { type: string, description: '8 ký tự đầu của id phiên (đủ đối chiếu, không dùng lại được)' }
        trustedDeviceName: { type: string }
        requestId: { type: string }
        subjectType: { type: string, enum: [guest_document, document_image, door_credential, payee_account, portal_data] }
        action: { type: string, enum: [view, create, update, copy, delete, purge] }
        reservationCode: { type: string }
        subjectLabel: { type: string, description: 'Ví dụ "Hộ chiếu ••4821 – người 2" (không có số đầy đủ)' }
        reasonCode: { type: string }

    # ── khai báo ──
    RegistrationSummary:
      type: object
      required: [id, reservationId, reservationCode, status, requiredCount, submittedCount, deadlineLabel]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        reservationId: { $ref: '#/components/schemas/Uuid' }
        reservationCode: { type: string }
        roomNo: { type: string }
        guestDisplayName: { type: string, x-rbac-field: D01 }
        arrivalDate: { $ref: '#/components/schemas/LocalDate' }
        kind: { type: string, enum: [vn_citizen_stay, foreigner_temp_residence, mixed, unknown] }
        status: { $ref: '#/components/schemas/RegistrationStatus' }
        requiredCount: { type: integer }
        submittedCount: { type: integer }
        deadlineAt: { $ref: '#/components/schemas/Instant' }
        deadlineLabel: { type: string, enum: [at_checkin, before_deadline_today, overdue, done, needs_update] }
        isOverdue: { type: boolean }
    Registration:
      allOf:
        - $ref: '#/components/schemas/RegistrationSummary'
        - type: object
          required: [documents, allowedActions, version]
          properties:
            partyOverCount:
              type: integer
              minimum: 1
              description: |
                0.3.7 bổ sung 4 (BUG-R2-205, ARC 16.29): số người trong đoàn **vượt** số khách của đơn (người tính định mức BR-110) – thường do server tự thêm người đi cùng `unknown` khi giấy tờ
                gửi không có `partyMemberId` mà không khớp ai trong đơn (16.22). Vắng = không vượt. Desk (H14) hiện cảnh báo "Số người khai nhiều hơn số khách của đơn – kiểm tra người vừa thêm"
                ngay sau khi lưu giấy tờ và ở panel đoàn; gỡ người thừa (`removePartyMember`) hoặc gắn lại giấy tờ đúng người. Không tự tính phụ thu lúc nhập giấy tờ
            portalReference: { type: string }
            sentAt: { $ref: '#/components/schemas/Instant' }
            confirmedAt: { $ref: '#/components/schemas/Instant' }
            documents:
              type: array
              items: { $ref: '#/components/schemas/GuestDocumentMasked' }
            imageRetentionUntil: { $ref: '#/components/schemas/Instant' }
            consentNotice:
              type: object
              required: [currentNoticeVersion, imageRetentionDays]
              description: |
                0.3.6 bổ sung 3 (QA S3, ARC 17/10) (FE s3 mục 9.4, hệ quả của `ConsentInput.retentionDays` bắt buộc với P02b): nguồn cho Desk (H14 `recordImageConsent`) – cùng tham số
                cơ sở như `OnlineCheckin.currentNoticeVersion`/`imageRetentionDays`. Client gửi lại đúng hai giá trị này trong `ConsentInput`; không viết cứng.
              properties:
                currentNoticeVersion: { type: string, pattern: '^[a-z0-9][a-z0-9.-]{2,63}$' }
                imageRetentionDays: { type: integer, minimum: 1, maximum: 365 }
            blocksDoorCode:
              type: boolean
              description: |
                true khi có mục đối chiếu `blocking=true` (BR-613 c: hộ chiếu/thị thực hết hạn tại ngày nhận, thiếu dấu nhập cảnh) – server **không** cho cấp/hiện mã cửa
                (setDoorCredential → 409, GuestStay.doorCode vắng) cho tới khi xử lý. **R2 (0.3.3, E03-01/E06-01)**: là điều kiện `document_check_block` của
                `previewCheckIn`/`checkIn` (chặn B9, FDL+ bỏ qua bằng `documentBlockOverride`) – giả định BA, chờ DOM E05-06 (c).
            imagesPurgeScheduledAt: { $ref: '#/components/schemas/Instant', description: 'Lần xóa ảnh sớm nhất đã lên lịch (người không đồng ý/rút đồng ý → khi `confirmed`; đồng ý → hạn BR-610) – 0.3.3, E06-02' }
            imagesPurgedAt: { $ref: '#/components/schemas/Instant', description: 'Lần xóa ảnh gần nhất – 0.3.3, E06-04' }
            imagesPurgeReason:
              type: string
              enum: [retention, no_consent, consent_withdrawn, guest_request, void, unconfirmed]
              description: 'Lý do lần xóa gần nhất (erd `document_image.delete_reason`) – 0.3.3, E06-04. **0.3.7 bổ sung 3 (BE-C S4-12/BUG-R2-054)**: thêm `unconfirmed` – khai báo **chưa bao giờ** `confirmed`, ảnh xóa theo hạn SR-RET-02 (≤ 7 ngày sau trả phòng); khác `retention` (hạn lưu BR-610 sau khi đã khai báo) để lễ tân/nhật ký thấy khai báo không hoàn tất. Server ghi `retention` cho tới khi BE-C đổi CHECK DB; client gặp giá trị lạ → nhãn chung'
            portalReferences:
              type: array
              description: 'Khai báo `mixed`: mỗi khối (`kind`) một mã hồ sơ cổng; khai báo đơn loại có 1 phần tử, trùng `portalReference` (0.3.3, E06-03)'
              items:
                type: object
                required: [kind, reference]
                properties:
                  kind: { type: string, enum: [foreigner_temp_residence, vn_citizen_stay] }
                  reference: { type: string }
                  sentAt: { $ref: '#/components/schemas/Instant' }
                  sentByName: { type: string, x-rbac-field: D27 }
            onlineCheckin:
              type: [object, 'null']
              description: 'Tóm tắt check-in online cho Desk (US-107 AC1) – null khi khách chưa mở link (0.3.3, E06-06)'
              properties:
                completedAt: { $ref: '#/components/schemas/Instant' }
                etaTime: { $ref: '#/components/schemas/LocalTime' }
                lateArrival: { type: boolean }
                arrivalNote: { type: string, maxLength: 300, x-rbac-field: D23, x-visible-to: [owner, manager, front_desk_lead, front_desk], description: 'Ghi chú khách gửi lễ tân (C2, xóa theo T13 – SEC Q-S2) – chỉ FD+ thấy (D23), không trả lại app khách; hiển thị văn bản thuần' }
                uploadedCount: { type: integer }
                requiredCount: { type: integer }
                deferredPeople: { type: array, items: { type: integer, minimum: 1 }, description: 'Chỉ số người khách chọn "bổ sung tại quầy"' }
            allowedActions: { type: array, items: { $ref: '#/components/schemas/AllowedAction' } }
            version: { type: integer }
    GuestDocumentMasked:
      type: object
      required: [id, docType, isMain, docNumberLast4, checks]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        partyMemberId: { $ref: '#/components/schemas/Uuid' }
        docType: { $ref: '#/components/schemas/DocType' }
        isMain: { type: boolean }
        fullNameOnDoc: { type: string, x-rbac-field: D01 }
        nationalityCode: { type: string, pattern: '^[A-Z]{3}$', x-rbac-field: D01, description: 'ISO 3166-1 alpha-3 (giấy tờ) – 0.3.4' }
        docNumberLast4: { type: string, x-rbac-field: D03 }
        imageIds: { type: array, items: { $ref: '#/components/schemas/Uuid' }, x-rbac-field: D06, description: 'Rỗng sau khi ảnh bị xóa (J16, rút đồng ý, xóa sớm) – 0.3.3, E06-04' }
        imagePurgeAt: { $ref: '#/components/schemas/Instant', description: 'Thời điểm dự kiến xóa ảnh của người này theo quyết định đồng ý (BR-609/610) – 0.3.3, E06-02' }
        imageConsent: { type: string, enum: [not_recorded, granted, refused], x-rbac-field: D20 }
        captureMethod: { type: string, enum: [qr_cccd, mrz, manual, guest_upload] }
        personIndex:
          type: [integer, 'null']
          minimum: 1
          description: '0.3.7 (S4-48/S4-39): ô "Khách n" khi giấy tờ do khách gửi qua link (`captureMethod = guest_upload`); null với giấy tờ lễ tân nhập. Dồn số khi bỏ người (`removePartyMember`)'
        unclaimedUntil:
          type: [string, 'null']
          format: date-time
          description: |
            0.3.7 (S4-48/S4-39): hạn **chờ gắn người** – giấy tờ khách gửi qua link chưa gắn người sau khi bỏ người (đường không có lựa chọn của lễ tân); quá hạn J16 xóa giấy tờ + ảnh
            (`party_removed`). null = không chờ. Desk hiện nhãn "Chờ gắn người – tự xóa lúc {giờ}" theo trường này (thay cách đoán từ `imagePurgeAt`); gắn bằng `GuestDocumentLink`.
        possibleReturningGuest:
          type: boolean
          x-rbac-field: D29
          x-visible-to: [owner, manager, front_desk_lead, front_desk]
          description: '0.3.7 (nháp A.6, SEC s3 7.4 BE-A): tên + ngày sinh trên giấy tờ khớp một hồ sơ **ngoài đơn** – server **không** tự gắn; lễ tân xác nhận (BR-952 "nghi trùng")'
        checks:
          type: array
          items:
            type: object
            required: [code, result]
            properties:
              code: { $ref: '#/components/schemas/DocumentCheckCode' }
              result: { $ref: '#/components/schemas/DocumentCheckResult' }
              blocking:
                type: boolean
                description: |
                  0.3.3 (E06-01): true khi mục thuộc BR-613 (c) có kết quả cuối = Không đạt (`result=fail`, hoặc `unverified` mà `manualResult=fail`).
                  **Giả định ARC – chờ DOM/SEC**: `unverified` của 3 mục (c) cũng `blocking=true` cho tới khi lễ tân ghi `manualResult=pass` (an toàn mặc định).
              manualResult: { type: [string, 'null'], enum: [pass, fail, null], description: 'Kết quả lễ tân kiểm tay bản gốc cho mục `unverified` (`recordDocumentCheck`)' }
              handledNote: { type: string, description: 'Ghi chú xử lý (bắt buộc với `fail`/`unverified`) – không chứa số giấy tờ' }
              handledByName: { type: string, x-rbac-field: D27 }
              handledAt: { $ref: '#/components/schemas/Instant' }
    GuestDocumentInput:
      type: object
      required: [docType, fullNameOnDoc, docNumber]
      properties:
        partyMemberId: { $ref: '#/components/schemas/Uuid', description: 'Bỏ trống → server khớp theo tên + ngày sinh hoặc tạo người mới quan hệ "Chưa rõ" (US-043 AC3). **0.3.7 bổ sung 4 (SEC FB-R2-SEC-BE-73, ARC 16.22)**: người của giấy tờ **không bao giờ** suy ra từ `isMain` – không có "giấy tờ chính = người đặt". Desk **luôn gửi** `partyMemberId` (chọn người đặt chỉ khi đúng là người đặt; người ở chưa có trong đơn → để server tạo). Vắng → khớp theo mô tả `addGuestDocument` (khóa giấy tờ của hồ sơ có P05; tên + ngày sinh của người **trong đơn**, kể cả người đặt) → không khớp → hồ sơ "từ giấy tờ" + người đi cùng `unknown`. Khóa giấy tờ (`id_doc_hmac`, `id_doc_last4`) chỉ ghi lên hồ sơ của đúng người đó, khi người đó có P05' }
        docType: { $ref: '#/components/schemas/DocType' }
        isMain: { type: boolean, description: '0.3.7 bổ sung 4 (SEC-BE-73): chỉ đánh dấu khách chính **của khai báo lưu trú** (người đứng tên trên cổng khai báo); không quyết định giấy tờ thuộc hồ sơ nào – đặt hộ thì khách chính có thể không phải người đặt' }
        fullNameOnDoc: { type: string, x-rbac-field: D01 }
        docNumber: { type: string, writeOnly: true, x-classification: C3, x-rbac-field: D03 }
        dateOfBirth: { $ref: '#/components/schemas/LocalDate', writeOnly: true, x-classification: C3, x-rbac-field: D01 }
        gender: { type: string, enum: [male, female, other], x-rbac-field: D01 }
        nationalityCode: { type: string, pattern: '^[A-Z]{3}$', x-rbac-field: D01, description: 'ISO 3166-1 alpha-3 (như vùng MRZ); C/T phải `VNM` – 0.3.3 thu về đúng 3 ký tự (E06-05)' }
        passportIssueDate: { $ref: '#/components/schemas/LocalDate', writeOnly: true, x-classification: C3, x-rbac-field: D04 }
        passportExpiryDate: { $ref: '#/components/schemas/LocalDate', writeOnly: true, x-classification: C3, x-rbac-field: D04 }
        issuingPlace: { type: string, writeOnly: true, x-classification: C3, x-rbac-field: D04 }
        visaKind: { type: string, enum: [visa, visa_exempt, temp_residence_card], writeOnly: true, x-classification: C3, x-rbac-field: D05 }
        visaNumber: { type: string, writeOnly: true, x-classification: C3, x-rbac-field: D05 }
        visaValidUntil: { $ref: '#/components/schemas/LocalDate', writeOnly: true, x-classification: C3, x-rbac-field: D05 }
        entryDate: { $ref: '#/components/schemas/LocalDate', writeOnly: true, x-classification: C3, x-rbac-field: D05 }
        entryPort: { type: string, writeOnly: true, x-classification: C3, x-rbac-field: D05 }
        entryPurpose: { type: string, writeOnly: true, x-classification: C3, x-rbac-field: D05 }
        noEntryRecord:
          type: boolean
          writeOnly: true
          x-classification: C3
          x-rbac-field: D05
          description: 'Lễ tân đánh dấu hộ chiếu NN **không có** dấu/chứng nhận nhập cảnh → `entry_record_present = fail` (BR-613 c). Gửi `true` kèm `entryDate` → 422 (0.3.3, E06-01)'
        address: { type: string, writeOnly: true, x-classification: C3, description: 'Chỉ khi biểu mẫu cổng yêu cầu (R-REG-04)', x-rbac-field: D07 }
        captureMethod: { type: string, enum: [qr_cccd, mrz, manual] }
    GuestDocumentLink:
      type: object
      additionalProperties: false
      required: [partyMemberId]
      description: |
        0.3.7 (S4-39; SEC FE-07 bước 4, SEC 9.6 e (2)): thân `updateGuestDocument` **chỉ gắn người** cho giấy tờ chưa gắn (`partyMemberId` null – thường là giấy tờ khách gửi qua link,
        có thể đang chờ `unclaimedUntil`). Không đọc, không gửi lại trường C3. `partyMemberId` phải là người còn trong đoàn của đơn (khác → 422 `NOT_IN_LIST`); người đó đã có giấy tờ khác
        → 409 `PARTY_DUPLICATE`; giấy tờ đã gắn người khác → 409 `INVALID_TRANSITION` (đổi người dùng thân `GuestDocumentInput`). Thành công: bỏ hạn chờ (`unclaimedUntil` = null, ảnh
        hết hạn xóa 24 giờ), tính lại số người đã có giấy tờ và đối chiếu `party_count`, audit `registration.document_claimed` (chỉ id, không tên/số), SSE `registration.changed`.
      properties:
        partyMemberId: { $ref: '#/components/schemas/Uuid' }
    GuestDocumentSensitive:
      type: object
      description: 'C3 đầy đủ – chỉ endpoint .../sensitive, mỗi lần đọc ghi c3_access_log'
      x-classification: C3
      required: [id, docType, docNumber]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        docType: { $ref: '#/components/schemas/DocType' }
        fullNameOnDoc: { type: string, x-rbac-field: D01 }
        docNumber: { type: string, x-rbac-field: D03 }
        dateOfBirth: { $ref: '#/components/schemas/LocalDate', x-rbac-field: D01 }
        nationalityCode: { type: string, pattern: '^[A-Z]{3}$', x-rbac-field: D01, description: 'ISO 3166-1 alpha-3 (giấy tờ) – 0.3.4' }
        passportIssueDate: { $ref: '#/components/schemas/LocalDate', x-rbac-field: D04 }
        passportExpiryDate: { $ref: '#/components/schemas/LocalDate', x-rbac-field: D04 }
        issuingPlace: { type: string, x-rbac-field: D04 }
        visaKind: { type: string, x-rbac-field: D05 }
        visaNumber: { type: string, x-rbac-field: D05 }
        visaValidUntil: { $ref: '#/components/schemas/LocalDate', x-rbac-field: D05 }
        entryDate: { $ref: '#/components/schemas/LocalDate', x-rbac-field: D05 }
        entryPort: { type: string, x-rbac-field: D05 }
        entryPurpose: { type: string, x-rbac-field: D05 }
        noEntryRecord: { type: boolean, x-rbac-field: D05, description: '0.3.3' }
        address: { type: string, x-rbac-field: D07 }
    ConsentInput:
      type: object
      required: [purpose, decision, noticeVersion, locale]
      properties:
        partyMemberId: { $ref: '#/components/schemas/Uuid', description: '0.3.7 bổ sung 4 (SEC-BE-73, ARC 16.22): người quyết định. Desk **bắt buộc** gửi (thiếu → 422 `REQUIRED`); quyết định chỉ ghi lên hồ sơ của đúng người này – không bao giờ suy ra người đặt từ giấy tờ chính. Người chưa có hồ sơ (trẻ em dưới ngưỡng) → 422 `NOT_IN_LIST`' }
        personIndex: { type: integer, minimum: 1, description: 'Dùng ở app khách. 0.3.7 bổ sung 4 (SEC-BE-73): quyết định P05/P06/P07 theo `personIndex` chỉ áp lên hồ sơ **sau khi** giấy tờ của người đó được gắn vào người trong đơn (khớp theo `addGuestDocument` hoặc `GuestDocumentLink` của lễ tân); tới lúc đó lưu ở cấp khai báo, không ghi lên hồ sơ người đặt' }
        purpose: { type: string, enum: [P02B_ID_IMAGE_RETENTION, P05_CRM, P06_MARKETING, P07_REVIEW] }
        decision: { type: string, enum: [granted, refused] }
        noticeVersion: { type: string }
        retentionDays:
          type: integer
          minimum: 1
          maximum: 365
          description: |
            0.3.6 bổ sung (review S3, SEC ĐK-2 17/10): số ngày lưu ảnh mà người đồng ý **đã đọc** trong câu P02b (`OnlineCheckin.imageRetentionDays` / văn bản tại quầy).
            **Bắt buộc** khi `purpose = P02B_ID_IMAGE_RETENTION` (thiếu → 422 `REQUIRED`); khác tham số hiện hành → 422 `NOT_IN_LIST` (như `noticeVersion`).
            Lưu vào `consent_record`; J16 T02 dùng min(số ngày lúc đồng ý, tham số hiện hành).
        locale: { $ref: '#/components/schemas/Locale' }
        channel: { type: string, enum: [guest_app, desk, paper] }
    PortalData:
      type: object
      x-classification: C3
      required: [kind, portalUrl, people]
      properties:
        kind: { type: string, enum: [foreigner_temp_residence, vn_citizen_stay] }
        portalUrl: { type: string, format: uri }
        people:
          type: array
          items:
            type: object
            required: [fields]
            properties:
              fields:
                type: array
                items:
                  type: object
                  required: [label, value]
                  description: >
                    0.3.6 (ORC 17/10, UXD s3 mục 9): mọi trường của khối theo đúng thứ tự cổng (cả trường rỗng).
                    `label` = khóa i18n `reg.field.*`. `value` = chữ **tiếng Việt** dán lên cổng Bộ Công an
                    (enum đã đổi chữ, ví dụ "Nữ", "Miễn thị thực"; trường rỗng = chuỗi rỗng) bất kể ngôn ngữ
                    giao diện. `valueKey` = khóa `reg.value.*` để client hiện theo ngôn ngữ của mình – chỉ có
                    với giá trị enum (`reg.value.gender.*`, `reg.value.visa_kind.*`) và trường rỗng
                    (`reg.value.empty`, client không hiện nút Sao chép).
                  properties:
                    label: { type: string, pattern: '^reg\.field\.[a-z_]+$', description: 'Khóa i18n (0.3.6 bổ sung review S3: thêm pattern)' }
                    value:
                      type: string
                      x-rbac-field: D03
                      description: >
                        0.3.6 bổ sung (review S3, ARC 17/10 – **một** cài đặt duy nhất ở server, INT `guest-registration/manual` không còn dựng trường riêng):
                        ngày dạng `dd/MM/yyyy` (ví dụ `20/10/2026`); quốc tịch = **mã ISO 3166-1 alpha-3 in hoa** (ví dụ `KOR`) – INV đã quyết ESC-018 (17/10/2026;
                        tham số `portal_date_format`/`portal_nationality_format` mặc định đúng như vậy); "Ngày đến" = ngày lịch (giờ cơ sở) của giờ nhận phòng thực tế (BR-602, BR-417 (4)),
                        chưa nhận phòng → ngày đến của đơn; khách NN ngày đi khai = min(ngày đi, hạn thị thực/tạm trú) (BR-605).
                    valueKey: { type: string, pattern: '^reg\.value\.[a-z_.]+$' }
        clipboardText: { type: string, description: 'Văn bản sao chép đúng thứ tự cổng, giá trị tiếng Việt như `fields[].value` (mỗi người một dòng, các trường cách nhau bằng tab, trường rỗng để trống); client xóa clipboard sau khi dán (R-REG-07)', x-rbac-field: D03 }

    # ── buồng phòng ──
    RoomStatusEntry:
      type: object
      required: [roomId, roomNo, status, since, allowedEvents, version]
      properties:
        roomId: { $ref: '#/components/schemas/Uuid' }
        roomNo: { type: string }
        roomName: { type: [string, 'null'], description: '0.3.7 bổ sung D1 (BR-012 (2)): tên phòng – màn nhân viên hiện "{roomNo} · {roomName}"; HK/MT không gọi `listRooms` nên lấy ở đây. `null` = căn chưa có tên (hiện số căn)' }
        floor: { type: integer, description: 'Thay cho listRooms với HK/MT (BUG-R1-005)' }
        roomGroupCode: { type: string, example: L12, description: 'Thay cho listRoomGroups với HK/MT (BUG-R1-005)' }
        status: { $ref: '#/components/schemas/RoomStatusCode' }
        statusLabel: { type: string, example: Trống · cần dọn }
        since: { $ref: '#/components/schemas/Instant' }
        currentGuest: { type: string, description: 'Tên khách đang ở căn – **chỉ tên, không kèm số căn** (client ghép với `roomNo`, BR-614 "không lặp số căn trong cùng thẻ"; 0.3.7 bổ sung 4, ARC 18/10). Theo vai (BR-614, rbac D01): **HK** (trong phạm vi T) = **tên gọi** – khách VN chữ cuối của họ tên ("Phạm Gia Huy" → "Huy"), khách nước ngoài họ trên giấy tờ ("KIM MIN JUN" → "Kim"); **MT** không nhận trường này; **FD trở lên** = họ tên đầy đủ. Chưa có tên → vắng (màn hình chỉ hiện số căn)' }
        nextArrival:
