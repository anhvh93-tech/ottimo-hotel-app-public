              properties:
                receivedAt: { $ref: '#/components/schemas/Instant' }
                note: { type: string, maxLength: 300, description: 'Mã giao dịch ngân hàng, tên người chuyển (V-09 – chặn số thẻ)' }
                attachmentId: { $ref: '#/components/schemas/Uuid', description: 'Ảnh biên nhận (`uploadAttachment purpose=deposit_receipt`)' }
            example: { note: 'FT26292001234 – NGUYEN VAN A', receivedAt: '2026-10-19T14:41:00+07:00' }
      responses:
        '200':
          description: Giao dịch `succeeded`, `reconciliation=pending`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payment' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
