    Registration:
      allOf:
        - $ref: '#/components/schemas/RegistrationSummary'
        - type: object
          required: [documents, allowedActions, version]
          properties:
            portalReference: { type: string }
            sentAt: { $ref: '#/components/schemas/Instant' }
            confirmedAt: { $ref: '#/components/schemas/Instant' }
            documents:
              type: array
              items: { $ref: '#/components/schemas/GuestDocumentMasked' }
            imageRetentionUntil: { $ref: '#/components/schemas/Instant' }
            consentNotice:
              type: object
              required: [currentNoticeVersion, imageRetentionDays]
              description: |
                0.3.6 bổ sung 3 (QA S3, ARC 17/10) (FE s3 mục 9.4, hệ quả của `ConsentInput.retentionDays` bắt buộc với P02b): nguồn cho Desk (H14 `recordImageConsent`) – cùng tham số
                cơ sở như `OnlineCheckin.currentNoticeVersion`/`imageRetentionDays`. Client gửi lại đúng hai giá trị này trong `ConsentInput`; không viết cứng.
              properties:
                currentNoticeVersion: { type: string, pattern: '^[a-z0-9][a-z0-9.-]{2,63}$' }
                imageRetentionDays: { type: integer, minimum: 1, maximum: 365 }
            blocksDoorCode:
              type: boolean
              description: |
                true khi có mục đối chiếu `blocking=true` (BR-613 c: hộ chiếu/thị thực hết hạn tại ngày nhận, thiếu dấu nhập cảnh) – server **không** cho cấp/hiện mã cửa
                (setDoorCredential → 409, GuestStay.doorCode vắng) cho tới khi xử lý. **R2 (0.3.3, E03-01/E06-01)**: là điều kiện `document_check_block` của
                `previewCheckIn`/`checkIn` (chặn B9, FDL+ bỏ qua bằng `documentBlockOverride`) – giả định BA, chờ DOM E05-06 (c).
            imagesPurgeScheduledAt: { $ref: '#/components/schemas/Instant', description: 'Lần xóa ảnh sớm nhất đã lên lịch (người không đồng ý/rút đồng ý → khi `confirmed`; đồng ý → hạn BR-610) – 0.3.3, E06-02' }
            imagesPurgedAt: { $ref: '#/components/schemas/Instant', description: 'Lần xóa ảnh gần nhất – 0.3.3, E06-04' }
            imagesPurgeReason:
              type: string
              enum: [retention, no_consent, consent_withdrawn, guest_request, void]
              description: 'Lý do lần xóa gần nhất (erd `document_image.delete_reason`) – 0.3.3, E06-04'
            portalReferences:
              type: array
              description: 'Khai báo `mixed`: mỗi khối (`kind`) một mã hồ sơ cổng; khai báo đơn loại có 1 phần tử, trùng `portalReference` (0.3.3, E06-03)'
              items:
                type: object
                required: [kind, reference]
                properties:
                  kind: { type: string, enum: [foreigner_temp_residence, vn_citizen_stay] }
                  reference: { type: string }
                  sentAt: { $ref: '#/components/schemas/Instant' }
                  sentByName: { type: string, x-rbac-field: D27 }
            onlineCheckin:
              type: [object, 'null']
              description: 'Tóm tắt check-in online cho Desk (US-107 AC1) – null khi khách chưa mở link (0.3.3, E06-06)'
              properties:
                completedAt: { $ref: '#/components/schemas/Instant' }
                etaTime: { $ref: '#/components/schemas/LocalTime' }
                lateArrival: { type: boolean }
                arrivalNote: { type: string, maxLength: 300, x-rbac-field: D23, x-visible-to: [owner, manager, front_desk_lead, front_desk], description: 'Ghi chú khách gửi lễ tân (C2, xóa theo T13 – SEC Q-S2) – chỉ FD+ thấy (D23), không trả lại app khách; hiển thị văn bản thuần' }
                uploadedCount: { type: integer }
                requiredCount: { type: integer }
                deferredPeople: { type: array, items: { type: integer, minimum: 1 }, description: 'Chỉ số người khách chọn "bổ sung tại quầy"' }
            allowedActions: { type: array, items: { $ref: '#/components/schemas/AllowedAction' } }
            version: { type: integer }
    GuestDocumentMasked:
      type: object
      required: [id, docType, isMain, docNumberLast4, checks]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        partyMemberId: { $ref: '#/components/schemas/Uuid' }
        docType: { $ref: '#/components/schemas/DocType' }
        isMain: { type: boolean }
        fullNameOnDoc: { type: string, x-rbac-field: D01 }
        nationalityCode: { type: string, pattern: '^[A-Z]{3}$', x-rbac-field: D01, description: 'ISO 3166-1 alpha-3 (giấy tờ) – 0.3.4' }
        docNumberLast4: { type: string, x-rbac-field: D03 }
        imageIds: { type: array, items: { $ref: '#/components/schemas/Uuid' }, x-rbac-field: D06, description: 'Rỗng sau khi ảnh bị xóa (J16, rút đồng ý, xóa sớm) – 0.3.3, E06-04' }
        imagePurgeAt: { $ref: '#/components/schemas/Instant', description: 'Thời điểm dự kiến xóa ảnh của người này theo quyết định đồng ý (BR-609/610) – 0.3.3, E06-02' }
        imageConsent: { type: string, enum: [not_recorded, granted, refused], x-rbac-field: D20 }
        captureMethod: { type: string, enum: [qr_cccd, mrz, manual, guest_upload] }
        checks:
          type: array
          items:
            type: object
            required: [code, result]
            properties:
              code: { $ref: '#/components/schemas/DocumentCheckCode' }
              result: { $ref: '#/components/schemas/DocumentCheckResult' }
              blocking:
                type: boolean
                description: |
                  0.3.3 (E06-01): true khi mục thuộc BR-613 (c) có kết quả cuối = Không đạt (`result=fail`, hoặc `unverified` mà `manualResult=fail`).
                  **Giả định ARC – chờ DOM/SEC**: `unverified` của 3 mục (c) cũng `blocking=true` cho tới khi lễ tân ghi `manualResult=pass` (an toàn mặc định).
              manualResult: { type: [string, 'null'], enum: [pass, fail, null], description: 'Kết quả lễ tân kiểm tay bản gốc cho mục `unverified` (`recordDocumentCheck`)' }
              handledNote: { type: string, description: 'Ghi chú xử lý (bắt buộc với `fail`/`unverified`) – không chứa số giấy tờ' }
              handledByName: { type: string, x-rbac-field: D27 }
              handledAt: { $ref: '#/components/schemas/Instant' }
    GuestDocumentInput:
      type: object
      required: [docType, fullNameOnDoc, docNumber]
      properties:
        partyMemberId: { $ref: '#/components/schemas/Uuid', description: 'Bỏ trống → server khớp theo tên + ngày sinh hoặc tạo người mới quan hệ "Chưa rõ" (US-043 AC3)' }
        docType: { $ref: '#/components/schemas/DocType' }
        isMain: { type: boolean }
        fullNameOnDoc: { type: string, x-rbac-field: D01 }
        docNumber: { type: string, writeOnly: true, x-classification: C3, x-rbac-field: D03 }
        dateOfBirth: { $ref: '#/components/schemas/LocalDate', writeOnly: true, x-classification: C3, x-rbac-field: D01 }
        gender: { type: string, enum: [male, female, other], x-rbac-field: D01 }
        nationalityCode: { type: string, pattern: '^[A-Z]{3}$', x-rbac-field: D01, description: 'ISO 3166-1 alpha-3 (như vùng MRZ); C/T phải `VNM` – 0.3.3 thu về đúng 3 ký tự (E06-05)' }
        passportIssueDate: { $ref: '#/components/schemas/LocalDate', writeOnly: true, x-classification: C3, x-rbac-field: D04 }
        passportExpiryDate: { $ref: '#/components/schemas/LocalDate', writeOnly: true, x-classification: C3, x-rbac-field: D04 }
        issuingPlace: { type: string, writeOnly: true, x-classification: C3, x-rbac-field: D04 }
        visaKind: { type: string, enum: [visa, visa_exempt, temp_residence_card], writeOnly: true, x-classification: C3, x-rbac-field: D05 }
        visaNumber: { type: string, writeOnly: true, x-classification: C3, x-rbac-field: D05 }
        visaValidUntil: { $ref: '#/components/schemas/LocalDate', writeOnly: true, x-classification: C3, x-rbac-field: D05 }
        entryDate: { $ref: '#/components/schemas/LocalDate', writeOnly: true, x-classification: C3, x-rbac-field: D05 }
        entryPort: { type: string, writeOnly: true, x-classification: C3, x-rbac-field: D05 }
        entryPurpose: { type: string, writeOnly: true, x-classification: C3, x-rbac-field: D05 }
        noEntryRecord:
          type: boolean
          writeOnly: true
          x-classification: C3
          x-rbac-field: D05
          description: 'Lễ tân đánh dấu hộ chiếu NN **không có** dấu/chứng nhận nhập cảnh → `entry_record_present = fail` (BR-613 c). Gửi `true` kèm `entryDate` → 422 (0.3.3, E06-01)'
        address: { type: string, writeOnly: true, x-classification: C3, description: 'Chỉ khi biểu mẫu cổng yêu cầu (R-REG-04)', x-rbac-field: D07 }
        captureMethod: { type: string, enum: [qr_cccd, mrz, manual] }
    GuestDocumentSensitive:
      type: object
      description: 'C3 đầy đủ – chỉ endpoint .../sensitive, mỗi lần đọc ghi c3_access_log'
      x-classification: C3
      required: [id, docType, docNumber]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        docType: { $ref: '#/components/schemas/DocType' }
        fullNameOnDoc: { type: string, x-rbac-field: D01 }
        docNumber: { type: string, x-rbac-field: D03 }
        dateOfBirth: { $ref: '#/components/schemas/LocalDate', x-rbac-field: D01 }
        nationalityCode: { type: string, pattern: '^[A-Z]{3}$', x-rbac-field: D01, description: 'ISO 3166-1 alpha-3 (giấy tờ) – 0.3.4' }
        passportIssueDate: { $ref: '#/components/schemas/LocalDate', x-rbac-field: D04 }
        passportExpiryDate: { $ref: '#/components/schemas/LocalDate', x-rbac-field: D04 }
        issuingPlace: { type: string, x-rbac-field: D04 }
        visaKind: { type: string, x-rbac-field: D05 }
        visaNumber: { type: string, x-rbac-field: D05 }
        visaValidUntil: { $ref: '#/components/schemas/LocalDate', x-rbac-field: D05 }
        entryDate: { $ref: '#/components/schemas/LocalDate', x-rbac-field: D05 }
        entryPort: { type: string, x-rbac-field: D05 }
        entryPurpose: { type: string, x-rbac-field: D05 }
        noEntryRecord: { type: boolean, x-rbac-field: D05, description: '0.3.3' }
        address: { type: string, x-rbac-field: D07 }
    ConsentInput:
      type: object
      required: [purpose, decision, noticeVersion, locale]
      properties:
        partyMemberId: { $ref: '#/components/schemas/Uuid' }
        personIndex: { type: integer, minimum: 1, description: 'Dùng ở app khách' }
        purpose: { type: string, enum: [P02B_ID_IMAGE_RETENTION, P05_CRM, P06_MARKETING, P07_REVIEW] }
        decision: { type: string, enum: [granted, refused] }
        noticeVersion: { type: string }
        retentionDays:
          type: integer
          minimum: 1
          maximum: 365
          description: |
            0.3.6 bổ sung (review S3, SEC ĐK-2 17/10): số ngày lưu ảnh mà người đồng ý **đã đọc** trong câu P02b (`OnlineCheckin.imageRetentionDays` / văn bản tại quầy).
            **Bắt buộc** khi `purpose = P02B_ID_IMAGE_RETENTION` (thiếu → 422 `REQUIRED`); khác tham số hiện hành → 422 `NOT_IN_LIST` (như `noticeVersion`).
            Lưu vào `consent_record`; J16 T02 dùng min(số ngày lúc đồng ý, tham số hiện hành).
        locale: { $ref: '#/components/schemas/Locale' }
        channel: { type: string, enum: [guest_app, desk, paper] }
    PortalData:
      type: object
      x-classification: C3
      required: [kind, portalUrl, people]
      properties:
        kind: { type: string, enum: [foreigner_temp_residence, vn_citizen_stay] }
        portalUrl: { type: string, format: uri }
        people:
          type: array
          items:
            type: object
            required: [fields]
            properties:
              fields:
                type: array
                items:
                  type: object
                  required: [label, value]
                  description: >
                    0.3.6 (ORC 17/10, UXD s3 mục 9): mọi trường của khối theo đúng thứ tự cổng (cả trường rỗng).
                    `label` = khóa i18n `reg.field.*`. `value` = chữ **tiếng Việt** dán lên cổng Bộ Công an
                    (enum đã đổi chữ, ví dụ "Nữ", "Miễn thị thực"; trường rỗng = chuỗi rỗng) bất kể ngôn ngữ
                    giao diện. `valueKey` = khóa `reg.value.*` để client hiện theo ngôn ngữ của mình – chỉ có
                    với giá trị enum (`reg.value.gender.*`, `reg.value.visa_kind.*`) và trường rỗng
                    (`reg.value.empty`, client không hiện nút Sao chép).
                  properties:
                    label: { type: string, pattern: '^reg\.field\.[a-z_]+$', description: 'Khóa i18n (0.3.6 bổ sung review S3: thêm pattern)' }
                    value:
                      type: string
                      x-rbac-field: D03
                      description: >
                        0.3.6 bổ sung (review S3, ARC 17/10 – **một** cài đặt duy nhất ở server, INT `guest-registration/manual` không còn dựng trường riêng):
                        ngày dạng `dd/MM/yyyy` (ví dụ `20/10/2026`); quốc tịch = **mã ISO 3166-1 alpha-3 in hoa** (ví dụ `KOR`) – INV đã quyết ESC-018 (17/10/2026;
                        tham số `portal_date_format`/`portal_nationality_format` mặc định đúng như vậy); "Ngày đến" = ngày lịch (giờ cơ sở) của giờ nhận phòng thực tế (BR-602, BR-417 (4)),
                        chưa nhận phòng → ngày đến của đơn; khách NN ngày đi khai = min(ngày đi, hạn thị thực/tạm trú) (BR-605).
                    valueKey: { type: string, pattern: '^reg\.value\.[a-z_.]+$' }
        clipboardText: { type: string, description: 'Văn bản sao chép đúng thứ tự cổng, giá trị tiếng Việt như `fields[].value` (mỗi người một dòng, các trường cách nhau bằng tab, trường rỗng để trống); client xóa clipboard sau khi dán (R-REG-07)', x-rbac-field: D03 }

