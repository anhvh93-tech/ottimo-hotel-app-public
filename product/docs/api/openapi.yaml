  /v1/properties/{propertyId}/folios/{folioId}/vietqr:
    parameters:
      - $ref: '#/components/parameters/PropertyId'
      - $ref: '#/components/parameters/FolioId'
    post:
      tags: [folio]
      operationId: createVietQr
      summary: Sinh chuỗi VietQR đúng số tiền, nội dung = mã đơn/bill không dấu cách (US-120). Chưa cấu hình tài khoản → 409 PAYMENT_NOT_CONFIGURED.
      description: |
        **0.3.3 (E05-02, ARC chốt vòng đời giao dịch `pending`)**
        - `transferContent`: mã đơn bỏ dấu gạch (`OTM00171`) khi folio `open`; số bill bỏ dấu gạch (`F26000123`) khi folio `settled` (BR-521, US-120 AC1).
        - Tạo QR mới cho cùng folio → mọi giao dịch `method=vietqr`, `status=pending` **cũ** của folio → `expired` trong **cùng giao dịch DB** (chỉ một QR chờ/folio).
        - `expiresAt` = mốc đổi ngày nghiệp vụ kế tiếp (`business_day_rollover`, BR-010). Hết hạn: job `payment.expire` (erd 4.6) đặt `expired`;
          `confirmPaymentReceived` cũng kiểm `expiresAt` tại chỗ (không chờ job). Tiền về sau khi QR hết hạn → lễ tân ghi bằng `recordPayment` (`method=vietqr`,
          `reconciliation=pending`).
        - `amountVnd` > còn phải thu (hoặc cọc còn thiếu khi `hold`) → 422 `AMOUNT_EXCEEDS_BALANCE`, trừ khi FD+ gửi `overBalanceReason` (DOM G-4 đã quyết – 0.3.6).
        - `purpose=billing_period` chỉ R3 (kỳ thu HĐ) → R2 trả 422 `NOT_IN_LIST`.
        - Không vẽ QR giả khi chưa cấu hình tài khoản nhận (`409 PAYMENT_NOT_CONFIGURED`, US-120 AC2).
        - **0.3.6 (SEC F1–F3 [CHẶN])**: số tiền do server kiểm (≤ còn phải thu/cọc còn thiếu); `transferContent` chỉ mã đơn/số bill. **Ảnh QR vẽ tại chỗ**
          từ `qrPayload` (thư viện trong bundle admin-web) – **không** gọi dịch vụ ảnh QR bên ngoài (img.vietqr.io, Google Chart…); CSP `img-src 'self' blob: data:`.
          Tài khoản nhận đổi trong 24 giờ → `receivingAccountRecentlyChanged=true`, client hiện cảnh báo "Tài khoản nhận vừa đổi".
      x-roles: [owner, manager, front_desk_lead, front_desk, sales_staff]
      x-scope: { sales_staff: own }
      x-rbac: [A39]
      x-stories: [US-120]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amountVnd]
              properties:
                amountVnd: { $ref: '#/components/schemas/MoneyVnd' }
                purpose:
                  type: string
                  enum: [deposit, balance, check_in, check_out, billing_period]
                  description: |
                    0.3.7: `check_in` – QR ở bước thu của nhận phòng (đơn `confirmed`, ngày nghiệp vụ = ngày đến hoặc cửa sổ B9a; FD+): trần = `CheckInPreview.amountDueAtCheckinVnd` tính theo
                    `checkinTime`/`addPriorNight`/`priorNightRateVnd` gửi kèm (BUG-R2-038). `check_out` – QR ở bước 3 trả phòng (đơn `in_house`, cửa sổ B18; FD+): trần =
                    `CheckoutSummary.amountDueAtCheckoutVnd` theo `checkoutAt`/`extraNightRateVnd` gửi kèm (S4-47). Trong trần không cần `overBalanceReason`; sai trạng thái/ngày → 409
                    `INVALID_TRANSITION`; SAL/CTV → 403. Không ghi dòng nào – phụ thu/đêm thêm vẫn chỉ ghi ở B9/B18.
                checkinTime: { $ref: '#/components/schemas/LocalTime', description: '0.3.7 – chỉ `purpose=check_in` (như `previewCheckIn.checkinTime`); purpose khác → 422 `NOT_ALLOWED`' }
                addPriorNight: { type: boolean, description: '0.3.7 – chỉ `purpose=check_in`' }
                priorNightRateVnd: { $ref: '#/components/schemas/MoneyVnd', description: '0.3.7 – chỉ `purpose=check_in` khi `addPriorNight`' }
                checkoutAt: { $ref: '#/components/schemas/Instant', description: '0.3.7 – chỉ `purpose=check_out` (như `getCheckoutSummary.checkoutAt`; vắng = giờ server)' }
                extraNightRateVnd: { $ref: '#/components/schemas/MoneyVnd', description: '0.3.7 – chỉ `purpose=check_out` khi cần đêm thêm (vắng = `extraNightDefaultRateVnd`)' }
                overBalanceReason:
                  type: string
                  minLength: 3
                  maxLength: 300
                  x-rbac-field: D12c
                  description: '0.3.6 (DOM G-4, BA E15-03): **FD+** cho QR vượt còn phải thu khi "thu trước dịch vụ/ký quỹ"; SAL/CTV gửi → 403. Không có lý do mà vượt → 422 `AMOUNT_EXCEEDS_BALANCE`'
      responses:
        '201':
          description: Giao dịch `pending` + chuỗi QR
          content:
            application/json:
              schema:
                type: object
                required: [payment, qrPayload, transferContent]
                properties:
                  payment: { $ref: '#/components/schemas/Payment' }
                  qrPayload: { type: string, description: 'Chuỗi EMVCo/NAPAS VietQR – client tự vẽ ảnh (SEC F2)' }
                  transferContent: { type: string, example: OTM00171 }
                  receivingAccountMasked: { type: string, example: '9704••••1234', description: '0.3.6 – để lễ tân đối chiếu với khách' }
                  receivingAccountChangedAt: { $ref: '#/components/schemas/Instant' }
                  receivingAccountRecentlyChanged: { type: boolean, description: 'Đổi trong 24 giờ qua (SEC F3) – 0.3.6' }
                  expiredPaymentIds:
                    type: array
                    description: 'Giao dịch VietQR `pending` cũ của folio vừa chuyển `expired` (0.3.3)'
                    items: { $ref: '#/components/schemas/Uuid' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
