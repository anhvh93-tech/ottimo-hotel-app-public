      x-stories: [US-022]
      responses:
        '200':
          description: OK
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Party' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [reservations]
      operationId: addPartyMember
      summary: Thêm người đi cùng (hồ sơ khách) hoặc trẻ em (họ tên + năm sinh – C3, chỉ cho khai báo) (US-022; A20)
      x-roles: [owner, manager, front_desk_lead, front_desk]
      x-rbac: [A20]
      x-stories: [US-022]
