        attachmentId: { $ref: '#/components/schemas/Uuid', description: 'Ảnh biên nhận chuyển khoản (BR-527) – 0.3.3, E05-01' }
        qrPurpose: { type: string, enum: [deposit, balance, check_in, check_out, billing_period], description: '0.3.7 bổ sung 4 (DOM (f)): `purpose` lúc `createVietQr` (chỉ `method=vietqr`)' }
        amountDueNowVnd:
