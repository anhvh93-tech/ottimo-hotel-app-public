      summary: Nhập/sửa mã cửa và hiệu lực (MVP nhập tay; mặc định hiệu lực = giờ nhận → giờ trả, BR-403) (US-128 AC1)
      description: |
        Bỏ trống `code` → lõi sinh 6 chữ số từ CSPRNG, không trùng mã đang hiệu lực trên cùng khóa, không tái dùng cho căn trong 90 ngày (SR-LOCK-01).
        Lần tạo đầu: `If-Match` không áp dụng; sửa mã đã có: bắt buộc `If-Match` (chống gửi lại ghi đè mã mới bằng mã cũ – SR-KEY-08 thẻ SEC-ARC-24).
        Đặt mã do người dùng chọn = biết mã → **step-up** như `getDoorCredential` (BUG-R1-SEC-10): hết cửa sổ → `401 REAUTH_REQUIRED`;
        thiết bị không tin cậy → `403 DEVICE_NOT_TRUSTED`. Ghi `c3_access_log` `door_credential` trong **cùng giao dịch** với thao tác ghi
