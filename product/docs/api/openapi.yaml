        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/properties/{propertyId}/reservations/{reservationId}/actions/check-out:
    parameters:
      - $ref: '#/components/parameters/PropertyId'
      - $ref: '#/components/parameters/ReservationId'
    post:
      tags: [reservations]
      operationId: checkOut
      summary: Hoàn tất trả phòng (B18) – folio settled + cấp số bill, buồng → VD, việc dọn + bổ sung minibar, hủy mã cửa (US-038)
      description: |
        Chặn khi còn phải thu > 0 (`409 BALANCE_DUE`) trừ `debt` do MGR+ ghi (BR-525); chặn khi còn yêu cầu duyệt chờ (`409 PENDING_APPROVALS`).
        Khai báo NN → `needs_update` (BR-604). Hóa đơn điện tử: outbox (R3).

        **0.3.3 (EP03-05 mục 5.5)** – blocker kiểm lại ở server theo thứ tự: `minibar_not_checked` (`409 MINIBAR_NOT_CHECKED`) → `pending_approvals`
        (`409 PENDING_APPROVALS`) → `balance_due` (`409 BALANCE_DUE`; FD/FDL gửi `debt` → `403 FORBIDDEN_ACTION`). `expectedSurchargeVnd` bắt buộc khi
        `applyLateSurcharge=true`; lệch → `409 SURCHARGE_CHANGED`. Phụ thu trả muộn tính theo **giờ trả thực tế** (`checkoutTime`, DOM G-10): đã ghi ở `setLateCheckout` mà bậc
        thực tế khác (kể cả **thấp hơn** – hẹn 17:00 trả 13:00 → 50 % về 30 %) → server **đảo** dòng `late_checkout` cũ và ghi dòng mới (BR-008), không ghi hai lần; bằng nhau → giữ nguyên.
        `expectedSurchargeVnd` = tổng phụ thu sau khi tính lại (0.3.6).
        `checkoutTime` sau mốc cuối BR-412 → 422 `LATE_CHECKOUT_AFTER_LIMIT`. R2: không hủy mã cửa trong app (US-128 dời R3).

        **0.3.6 bổ sung 2 (BA v0.3, ARC 17/10)** (BA EP03-05 v0.3 mục 5, DOM S3-9/S3-10/S3-12/S3-16, BR-416/522 v0.3.4):
        - **Cửa sổ mở B18/B16**: ngày nghiệp vụ = ngày đi **hoặc** cửa sổ sau nửa đêm (ngày nghiệp vụ = ngày đi − 1 **và** ngày lịch = ngày đi, trước `business_day_rollover`)
          – trả trong cửa sổ sau nửa đêm hợp lệ, phụ thu 0. `allowedActions` có `check_out` trong cả hai trường hợp. Ngày đi tính trên **đơn chính + đơn con** (BR-422).
        - **"Trả phòng – tính thêm 1 đêm"** (E05-11, thay hướng G-16): giờ trả sau mốc cuối `late_checkout_tiers` (kể cả sau nửa đêm của ngày lịch kế tiếp) → bắt buộc
          `extraNight`; thiếu → 422 `LATE_CHECKOUT_AFTER_LIMIT` (`field` = `extraNight`). Cùng giao dịch: thêm đêm ngày đi (giá `extraNight.rateVnd`, sàn–trần BR-105 →
          `RATE_OUT_OF_RANGE`; Trực tiếp/CTV kéo đơn, OTA/HĐ nhập tay → đơn con Trực tiếp như B13), đêm bán + dòng `room`, **không** phụ thu trả muộn (dòng
          `late_checkout` sống bị đảo), rồi B18. Căn không trống đêm đó → 409 `ROOM_UNAVAILABLE`. Audit `money` `reservation.extra_night_on_checkout`.
        - Giờ nhập tay (E03-07): `checkoutTime`/`checkoutAt` muộn hơn giờ server quá `manual_time_tolerance_minutes` → 422 `TIME_AFTER_ACTION`; sớm hơn quá ngưỡng
          → bắt buộc `checkoutTimeNote` (→ 422 `TIME_NOTE_REQUIRED`).
        - Chỉ yêu cầu **tiền** (`foc`, `special_discount`, `damage_pricing`) chặn `pending_approvals`; yêu cầu vận hành (`checkin_room_not_ready`, `late_checkout_conflict`)
          tự hủy `superseded` trong giao dịch B18 (DOM S3-10). Phụ thu > 0 mà `applyLateSurcharge` ≠ `true` → 422 `SURCHARGE_DECISION_REQUIRED` (S3-12).
        - **Số dư thừa** (E15-05, DOM BE-14): `overpaymentHandling` chỉ xử lý `unhandledCreditVnd` (= `creditVnd` − yêu cầu hoàn đang mở) – **không** tạo yêu cầu hoàn trùng
          với yêu cầu đã có (ví dụ B16 trước đó). `unhandledCreditVnd = 0` → không cần `overpaymentHandling`. Phần dư sinh từ `ota_collect` không tính (xem `Folio.totals`).
        - **0.3.7 (S4-47)**: thứ tự trong giao dịch – đêm thêm `extraNight` (đảo phụ thu trả muộn) hoặc phụ thu trả muộn tính lại theo giờ thực tế → ghi `finalPayment` → xét `balance_due`.
          Trần `finalPayment.amountVnd` = còn phải thu **sau** các dòng đó (= `CheckoutSummary.amountDueAtCheckoutVnd` với giá đêm thêm đã chọn) → 422 `AMOUNT_EXCEEDS_BALANCE`
          (`field` = `finalPayment.amountVnd`, `max`). Tiền đêm thêm sau 18:00 thu bằng `finalPayment` (hoặc VietQR `purpose=check_out` + `confirmPaymentReceived` trước B18) – không ghi
          `recordPayment` trước B18 (vượt còn phải thu). Giờ mặc định của bước 2 lấy `CheckoutSummary.serverTime`.
        - **0.3.7 bổ sung 4 (BUG-R2-139, BR-416-06 – DOM 18/10)**: giờ trả sau mốc cuối mà đêm ngày đi **không bán được** (`extraNightAvailable = false`) → gửi `lateFeeInsteadOfNight`
          thay `extraNight` (thiếu cả hai → 422 `LATE_CHECKOUT_AFTER_LIMIT`, `field` = `lateFeeInsteadOfNight`; gửi `extraNight` → 409 `ROOM_UNAVAILABLE` như cũ; gửi `lateFeeInsteadOfNight` khi
          đêm còn bán được hoặc giờ trả chưa qua mốc cuối → 422 `NOT_ALLOWED`). Cùng giao dịch: đảo dòng `late_checkout` theo bậc đang sống, ghi dòng `late_checkout` (`charge_code =
          late_fee_as_night`, doanh thu khác, **không** đêm bán/`stay_night`, không vào công suất) = `CheckoutSummary.lateFeeAsNightVnd`; FOC trả muộn đã duyệt đi theo (khóa cả lượt);
          giờ trả = giờ rời thật; rồi B18. Audit `money` `reservation.late_fee_instead_of_night` (người làm, người xác nhận, lý do, số tiền).
        - **0.3.7 bổ sung 4 (vòng sửa 5b, K11-01 – ARC 16.19)**: thứ tự khóa đơn + đơn con (`NO KEY UPDATE`) → căn (`FOR UPDATE`) → **folio ngay sau căn**, rồi mới kiểm minibar,
          `pendingApprovals`, `resyncOtaCollect`, số dư và ghi `finalPayment`; mọi quyết định theo số dư/blocker đọc **sau** khóa folio (dòng folio chen vào lúc B18 không còn lọt qua).
        - **0.3.7 bổ sung 4 (SEC ARC-24)**: 401 `REAUTH_FAILED` (xác nhận `lateFeeInsteadOfNight` sai) / `UNAUTHENTICATED`; 403 `APPROVAL_LIMIT_EXCEEDED` (`requestFoc` vượt hạn mức người
          xác nhận) / `FORBIDDEN_ACTION` (`debt` của FD/FDL); 429 `RATE_LIMITED` (bộ đếm xác nhận lại đang khóa).
        - **0.3.8 bổ sung 8 (ESC-031, ESC-024 B)**: `lateFeeInsteadOfNight.postReview = true` không đi qua bước "người xác nhận" (không `verifyApprover`, không đếm SR-RL-02, không 401
          `REAUTH_FAILED`/429 `RATE_LIMITED` từ đường này); mọi lỗi 422/409 của khuôn body vẫn trả trước khi ghi. Audit `reservation.late_fee_instead_of_night` `after.channel` ∈
          `desk|self|remote|expired_self_record|post_review`.
        - **0.3.7 bổ sung 4 (BUG-R2-150, ARC + SEC)** – thứ tự trên đường `lateFeeInsteadOfNight`: **bước 0** tra `Idempotency-Key` đã hoàn tất (cùng người gọi, method, path; băm body
          **không** gồm `secret` – `SECRET_BODY_FIELDS`) **trước** mọi kiểm nghiệp vụ và `verifyApprover`: khớp → 200 đã lưu + `Idempotent-Replayed: true`, không kiểm mật khẩu, không đếm,
          không thông báo; băm lệch → 422 `IDEMPOTENCY_KEY_REUSED`; đang chạy → 409 như mọi lệnh. Rồi BE-64: khuôn body → kiểm nghiệp vụ chỉ đọc → người xác nhận → `uow.run`.
          **Khuôn body = mọi trường của thân B18** (SEC, BUG-R2-165): `checkoutTime`, `checkoutAt`, `checkoutTimeNote`, `extraNight`, `applyLateSurcharge`, `expectedSurchargeVnd`,
          `finalPayment`, `overpaymentHandling`, `debt`, `lateFeeInsteadOfNight` (gồm `requestFoc` và hạn `requestFoc.amountVnd` ≤ `lateFeeAsNightVnd` − FOC trả muộn đã duyệt/đang xin) – dùng
          chung hàm đọc input của `checkOut`; mọi lỗi 422/409 của các trường này trả **trước** khi thử mật khẩu, không đếm.
          Rủi ro đã ghi (SEC): gửi lại cùng khóa với mật khẩu **sai** nhận 200 đã lưu mà không ghi gì – chấp nhận vì không có tác dụng mới, khóa gắn người gọi, phản hồi lưu không
          phụ thuộc mật khẩu nên không thành kênh dò.
      x-roles: [owner, manager, front_desk_lead, front_desk]
      x-rbac: [A18, A19, S07]
      x-transition: B18
      x-stories: [US-038, US-036, US-135]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [checkoutTime]
              properties:
                checkoutTime: { $ref: '#/components/schemas/LocalTime' }
                checkoutAt:
                  $ref: '#/components/schemas/Instant'
                  description: |
                    0.3.6 (BA E05-09, DOM G-16): thời điểm trả thực tế. Có thì server dùng `checkoutAt` (bỏ qua `checkoutTime`, chỉ kiểm khớp giờ) – trả sau nửa đêm
                    (01:00 hôm sau, ngày nghiệp vụ vẫn là ngày đi) luôn > mốc cuối BR-412 → phải gửi `extraNight` (0.3.6 bổ sung 2 (BA v0.3, ARC 17/10) – trước đây: gia hạn 1 đêm trước). Không có → `checkoutTime`
                    hiểu trên trục ngày nghiệp vụ (00:00–05:59 = sau nửa đêm).
                checkoutTimeNote: { type: string, minLength: 3, maxLength: 300, x-rbac-field: D12c, description: '0.3.6 bổ sung 2 (BA v0.3, ARC 17/10) (E03-07): bắt buộc khi giờ trả nhập tay sớm hơn giờ thao tác quá `manual_time_tolerance_minutes`' }
                extraNight:
                  type: object
                  description: |
                    0.3.6 bổ sung 2 (BA v0.3, ARC 17/10) (E05-11, BR-416 v0.3.4, DOM S3-9): "Trả phòng – tính thêm 1 đêm" – bắt buộc khi `CheckoutSummary.extraNightRequired=true`.
                    Mặc định `CheckoutSummary.extraNightDefaultRateVnd` (lịch giá Trực tiếp đêm đó, BR-421); giá ngoài sàn–trần BR-105 → `RATE_OUT_OF_RANGE`.
                    **Vòng sửa 5 (ARC 16.18)**: `rateVnd` không còn bắt buộc – vắng = giá mặc định (nguồn `default`); có = lễ tân nhập tay (nguồn `manual`, kể cả bằng số gợi ý);
                    khoảng nhập `CheckoutSummary.extraNightFloorVnd`–`extraNightCeilingVnd`.
                  properties:
                    rateVnd: { $ref: '#/components/schemas/MoneyVnd' }
                lateFeeInsteadOfNight:
                  type: object
                  description: |
                    0.3.7 bổ sung 4 (BUG-R2-139, BR-416-06): "Trả phòng – phụ thu trả muộn bằng giá 1 đêm" khi đêm ngày đi không bán được – **quản lý trở lên xác nhận tại quầy** (ARC 18/10):
                    lễ tân làm B18, quản lý nhập tên đăng nhập + mật khẩu của mình (`approverUsername`, `authMethod`, `secret`); người gọi là OWN/MGR thì bỏ `approverUsername`, nhập lại mật khẩu
                    của chính mình. Không tạo yêu cầu duyệt. Người xác nhận phải là OWN/MGR **của cơ sở** và đang hoạt động; sai mật khẩu, tên không có hoặc không đủ vai đều trả **cùng** 401
                    `REAUTH_FAILED` (`field` = `lateFeeInsteadOfNight.secret`) – không lộ tên tài khoản; chung bộ đếm 5 sai/15 phút với duyệt (SR-RL-02), đếm theo người xác nhận. R3: `pin`.
                    **SEC 18/10 (`reviews/s4-SEC-lateFee-reauth.md`, ngoại lệ có phạm vi SR-AUTH-11 – chỉ đường này và `requestFoc` lồng)**: người xác nhận tìm theo cơ sở trên đường dẫn
                    (OWN/MGR chưa thu hồi, `active`, không khóa đăng nhập, không `must_change_password`; có 2FA mà chưa kiểm được yếu tố thứ hai → coi như không đủ điều kiện) – mọi nhánh
                    401 giống hệt, thời gian phản hồi đồng đều. Sai → tăng bộ đếm của **cả người gọi và người xác nhận**; một trong hai đang khóa → 429 `RATE_LIMITED` (`Retry-After`).
                    Điều kiện nghiệp vụ (422/409) kiểm **trước** mật khẩu và không đếm. Người xác nhận ≠ người gọi → thông báo `account_security_change` tới người xác nhận.
                    **R3 (contract-ahead)**: đường này chỉ nhận `pin`, hoặc `password` kèm `totpCode`; bắt buộc phiên máy quầy `device_trusted` (thiếu → 403 `DEVICE_NOT_TRUSTED`,
                    kiểm trước mật khẩu; OWN/MGR tự xác nhận không cần) và trần theo ngày (≥ 2 lần khóa/24 giờ cùng người gọi hoặc người xác nhận → khóa đường này 24 giờ + cảnh báo OWN) –
                    trước GL. Xác nhận từ xa trên máy của quản lý: backlog R3 (`openapi-0.3.7.md` 16.10).
                    `amountVnd` = số client đang hiện (`CheckoutSummary.lateFeeAsNightVnd`) – lệch → 409 `SURCHARGE_CHANGED`. Giảm/miễn: FOC trả muộn đã duyệt đi theo; FOC mới cho khoản này gửi
                    kèm `requestFoc` (B18 chốt folio ngay, không còn chỗ xin sau – DOM 18/10). `applyLateSurcharge`/`expectedSurchargeVnd` không dùng ở đường này. Không có `lateFeeAsNightVnd`
                    (không thêm đêm) nên không tính lại bậc BR-107 (DOM xác nhận 18/10).
                    **0.3.8 (US-164, ESC-024 B, SEC 06.29–06.31)** – ba cách xác nhận, đúng một:
                    (1) **Tại quầy** (D5, SR-AUTH-11): `amountVnd`, `reason`, `authMethod`, `secret` (+ `approverUsername` khi người gọi là FD/FDL). R3: người xác nhận đã bật 2FA chỉ được
                    `pin`, hoặc `password` **kèm** `totpCode` – mật khẩu đơn → 401 `REAUTH_FAILED` giống hệt (fail-closed); FE-08 giữ nguyên.
                    (2) **Từ xa đã duyệt**: chỉ gửi `confirmationId` (+ `reason` tùy chọn) – yêu cầu `approved`, cùng đơn, chưa dùng; số phụ thu/FOC lấy **từ yêu cầu** (server tính lại dưới khóa,
                    lệch → 409 `SURCHARGE_CHANGED`); giờ trả = `departedAt` của yêu cầu; FOC áp với người duyệt = người xác nhận (như D5). Gửi kèm `amountVnd`, `requestFoc`, `authMethod`,
                    `secret`, `approverUsername` → 422 `NOT_ALLOWED`. Yêu cầu chuyển `consumed` trong cùng giao dịch B18.
                    (3) **Hết hạn – lễ tân tự ghi (ESC-024 B)**: `confirmationId` của yêu cầu `expired` (không phải `rejected`), người gọi FD/FDL/MGR/OWN của cơ sở: ghi **đúng** phụ thu server tính
                    (`lateFeeAsNightVnd` đọc dưới khóa; khác số đã khóa ở yêu cầu → 409 `SURCHARGE_CHANGED`, tạo yêu cầu mới), **không** FOC (FOC xin trong yêu cầu bỏ, khách trả đủ), điều kiện
                    "đêm không bán được" phải còn đúng lúc ghi. Audit `money` `reservation.late_fee_instead_of_night` `after.channel = expired_self_record`, `after.confirmationId`; thông báo
                    `late_fee_post_review` mọi OWN/MGR; "Cần chú ý" `late_fee_post_review` hạn = ghi + `post_checkout_charge_hours` (bổ sung 8 – thay `late_fee_post_review_hours`). Không dùng mật khẩu/PIN của ai khác.
                    Miễn sau hậu kiểm: MGR+ dùng A32 (`adjustFolioLine`) trên folio `settled` trong cửa sổ 24 giờ → dư → hoàn tiền BR-522 (đường có sẵn, không thêm đường tiền) [GIẢ ĐỊNH – DOM chốt BR-416].
                    **0.3.8 bổ sung 8 (ESC-031, INV 26/10)** – cách thứ tư, nên thành "bốn cách, đúng một":
                    (4) **Lễ tân ghi, quản lý hậu kiểm** (`postReview: true`, chỉ v1.0 – xem `postReview`). Hết cách (1) dùng được ở production (MFA bắt buộc → (1) luôn 401 với người có 2FA,
                    giữ fail-closed); (2)/(3) chưa có tới US-164.
                  properties:
                    confirmationId: { $ref: '#/components/schemas/Uuid', description: '0.3.8 (US-164) – `ManagerConfirmation.id`' }
                    totpCode: { type: string, pattern: '^[0-9]{6}$', writeOnly: true, description: '0.3.8 (SR-AUTH-11 R3) – bắt buộc khi `authMethod = password` và người xác nhận đã bật 2FA' }
                    amountVnd: { $ref: '#/components/schemas/MoneyVnd' }
                    reason: { type: string, minLength: 3, maxLength: 500, x-rbac-field: D12c }
                    postReview:
                      type: boolean
                      default: false
                      description: |
                        0.3.8 bổ sung 8 (ARC 26/10; ESC-031 INV 26/10; ESC-024 B; BR-416 (1)–(4)) – cách (4) "Lễ tân ghi, quản lý hậu kiểm" (v1.0, chưa có US-164). Người gọi FD/FDL/MGR/OWN
                        của cơ sở (`x-roles` không đổi; MGR/OWN cũng theo đúng luật này, không có lối "mật khẩu của chính mình"). Gửi `amountVnd` (= `CheckoutSummary.lateFeeAsNightVnd`; lệch,
                        cao hay thấp → 409 `SURCHARGE_CHANGED`), `reason` (thiếu → 422, `errors[].code = REASON_REQUIRED`), `postReview: true`. Chỉ khi server xác định đêm ngày đi **không bán được**
                        (khác → 422 `NOT_ALLOWED`, `field` = `lateFeeInsteadOfNight`, như mọi cách).
                        Gửi kèm `approverUsername`, `authMethod`, `secret`, `totpCode`, `confirmationId` hoặc `requestFoc` → 422 `VALIDATION_FAILED`, `errors[].code = NOT_ALLOWED` từng trường
                        (`field` = `lateFeeInsteadOfNight.<trường>`); không phải boolean → 422, `errors[].code = VALIDATION_FAILED` (`field` = `lateFeeInsteadOfNight.postReview`). Không kiểm mật khẩu của ai,
                        không đếm SR-RL-02, không audit bảo mật; mọi lỗi trả **trước khi ghi**. `false`/vắng = cách (1)–(3) như cũ.
                        Lễ tân không sửa số, không miễn/giảm trong lệnh; FOC trả muộn **đã duyệt trước** đi theo như mọi đường B18 (BR-434, S3-11).
                        Cùng giao dịch B18 (B18 bị từ chối sau đó → không còn gì): dòng `late_checkout` `charge_code = late_fee_as_night`; audit `money` `reservation.late_fee_instead_of_night`
                        `after = {amountVnd, checkoutTime, date, channel: post_review, reviewDueAt}` (người làm = người gọi, **không** `confirmedBy`); thông báo `late_fee_post_review` mọi OWN/MGR
                        đang hoạt động của cơ sở (trừ người gọi); **một** mục "Cần chú ý" `late_fee_post_review` mỗi đơn (MGR+, `warning`, `dueAt` = ghi + `post_checkout_charge_hours`
                        = cột `folio.post_checkout_window_until` B18 vừa ghi). Quá hạn mà chưa "Đã xem" (`resolveAttentionEvent`, MGR+) → job `late_fee.post_review_overdue` báo mọi OWN **một lần** (cùng kind),
                        mục giữ nguyên; J15 đóng folio như thường (BR-416 (4)).
                        Miễn sau hậu kiểm: A32 (`adjustFolioLine`) trên folio `settled` → dư → yêu cầu hoàn BR-522 (K11-06, BR-433 (e), `SELF_REFUND_FORBIDDEN`) – không thêm đường tiền.
                        **v1.1 (US-164)**: trường còn trong hợp đồng nhưng `true` → 422 `NOT_ALLOWED` (`field` = `lateFeeInsteadOfNight.postReview`); lễ tân đi cách (2)/(3) (chờ
                        `remote_confirm_timeout_minutes` rồi mới tự ghi – ESC-024 B gốc). Hạ tầng hậu kiểm (kind, mục, job) dùng lại cho (3).
                    approverUsername: { type: string, minLength: 1, maxLength: 100, description: 'Bắt buộc khi người gọi là FD/FDL (thiếu → 422 `REQUIRED`); OWN/MGR bỏ trống = tự xác nhận' }
                    authMethod: { type: string, enum: [password, pin], description: 'R2 chỉ `password` (`pin` → 422 `NOT_IN_LIST`, không đếm). R3: `pin`, hoặc `password` + `totpCode` (contract-ahead, SEC ARC-24)' }
                    secret: { type: string, writeOnly: true, minLength: 6, maxLength: 256 }
                    requestFoc:
                      $ref: '#/components/schemas/FocRequestInput'
                      description: |
                        0.3.7 bổ sung 4 (DOM 18/10, như `setLateCheckout.requestFocForSurcharge`) – tùy chọn: FOC/giảm giá cho khoản phụ thu này, **người xác nhận** của `lateFeeInsteadOfNight`
                        **tự áp** trong hạn mức BR-433 của mình (cùng giao dịch B18, yêu cầu `approved`, người gửi = người gọi, người duyệt = người xác nhận). Dùng `kind` (**chỉ `foc`** –
                        `special_discount` chỉ cho dòng phòng → 422 `NOT_IN_LIST`, `field` = `lateFeeInsteadOfNight.requestFoc.kind`; ARC duyệt BE-A r3-4), `amountVnd`, `reasonCode`, `note`; **không** gửi `authMethod`/`secret` ở đây (→ 422 `NOT_ALLOWED`) – mật khẩu của `lateFeeInsteadOfNight` đã là xác nhận. Cùng khóa FOC trả muộn cả lượt (BR-434):
                        FOC đã duyệt đi theo trước, tổng ≤ `lateFeeAsNightVnd`; `amountVnd` > `lateFeeAsNightVnd` → 422 `VALUE_OUT_OF_RANGE`. Vượt hạn mức người xác nhận → 403
                        `APPROVAL_LIMIT_EXCEEDED`, **không ghi gì** (không để yêu cầu chờ chặn B18). Trần `finalPayment` = còn phải thu sau phụ thu và FOC này.
                        Ví dụ 203: phụ thu 792.000, miễn 50 % → FOC **396.000**, khách trả **396.000**
                applyLateSurcharge: { type: boolean, default: false }
                expectedSurchargeVnd:
                  $ref: '#/components/schemas/MoneyVnd'
                  description: 'Phụ thu trả muộn client đang hiển thị (từ `getCheckoutSummary`) – bắt buộc khi `applyLateSurcharge=true` (0.3.3, E03-02)'
                finalPayment: { $ref: '#/components/schemas/PaymentCreate' }
                overpaymentHandling:
                  type: object
                  description: |
                    0.3.6 (A-34). Bắt buộc khi `creditVnd > 0` (đã thu > tổng – ví dụ cọc lớn hơn bill sau FOC/trả sớm); thiếu → 422 `OVERPAYMENT_HANDLING_REQUIRED`.
                    **0.3.6 bổ sung 2 (BA v0.3, ARC 17/10) (E15-05)**: điều kiện và số tiền là `unhandledCreditVnd` (không phải `creditVnd`) – không tạo yêu cầu hoàn trùng; `retain_with_guest_consent` chỉ khi
                    khách **tự nguyện bỏ** khoản thừa (DOM S3-4) – ghi `deposit_forfeit` `charge_code = overpayment_retained`, bill `labelKey = bill.line.overpayment_retained`.
                    `refund_request`: tạo yêu cầu duyệt `refund` số tiền = `creditVnd` (A43, BR-522) trong cùng giao dịch B18 – loại `refund` **không** tính vào
                    blocker `pending_approvals`; nơi nhận nhập sau bằng `setRefundDestination`, MGR+ chi bằng `executeRefund`.
                    `retain_with_guest_consent`: chỉ MGR+ (FD/FDL → 403) – khách đồng ý để lại (DOM G-15 "khách để lại cho lần sau"): ghi dòng `deposit_forfeit`
                    bằng `creditVnd` + `reason` (R2 không có ví tín dụng khách; lần sau MGR giảm giá thủ công có ghi chú).
                  required: [mode, reason]
                  properties:
                    mode: { type: string, enum: [refund_request, retain_with_guest_consent] }
                    reason: { type: string, minLength: 3, maxLength: 500, x-rbac-field: D12c }
                debt:
                  type: object
                  description: Chỉ OWN/MGR (A19)
                  required: [dueDate, reason]
                  properties:
                    dueDate: { $ref: '#/components/schemas/LocalDate' }
                    reason: { type: string, minLength: 3 }
            example:
              checkoutTime: '11:40'
              finalPayment: { type: charge, method: vietqr, amountVnd: 2485000, receivedAt: '2026-10-22T11:42:00+07:00' }
      responses:
        '200':
          description: Đã trả phòng
          content:
            application/json:
              schema:
                type: object
                required: [reservation, billNo]
                properties:
                  reservation: { $ref: '#/components/schemas/Reservation' }
                  billNo: { $ref: '#/components/schemas/BillNo' }
                  createdTaskIds: { type: array, items: { $ref: '#/components/schemas/Uuid' } }
        '401':
          $ref: '#/components/responses/ReauthFailed'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: MINIBAR_NOT_CHECKED / PENDING_APPROVALS / BALANCE_DUE / SURCHARGE_CHANGED / INVALID_TRANSITION / ROOM_UNAVAILABLE (`extraNight` – 0.3.6 bổ sung 2 (BA v0.3, ARC 17/10))
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              examples:
                balanceDue:
                  value:
                    type: /problems/balance-due
                    title: Còn tiền chưa thu
                    status: 409
                    code: BALANCE_DUE
                    detail: Còn phải thu 2.485.000 đ
                    balanceDueVnd: 2485000
                minibarNotChecked:
                  value: { type: /problems/minibar-not-checked, title: Chưa kiểm minibar, status: 409, code: MINIBAR_NOT_CHECKED }
        '412': { $ref: '#/components/responses/VersionConflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429':
          $ref: '#/components/responses/RateLimited'
  /v1/properties/{propertyId}/reservations/{reservationId}/party:
    parameters:
      - $ref: '#/components/parameters/PropertyId'
      - $ref: '#/components/parameters/ReservationId'
