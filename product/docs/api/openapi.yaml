          type: integer
          minimum: 1
          maximum: 365
          example: 30
          x-guest-level: 1
          x-sec-review: approved-DK2 (SEC 17/10/2026)
          description: |
            0.3.6 bổ sung (review S3). Tham số `id_image_retention_days_after_checkout` (BR-610) hiện hành – số ngày câu đồng ý P02b hiện cho khách; gửi lại ở
