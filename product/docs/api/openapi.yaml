        - name: receivedTo
          in: query
          schema: { $ref: '#/components/schemas/LocalDate' }
        - name: recordedBy
          in: query
          schema: { $ref: '#/components/schemas/Uuid' }
        - name: recordedByRole
          in: query
          description: '0.3.6 – ví dụ `sales_staff`, `collaborator` (tiền sale/CTV nộp quầy)'
          schema: { $ref: '#/components/schemas/Role' }
        - name: method
          in: query
          schema: { $ref: '#/components/schemas/PaymentMethod' }
        - name: status
          in: query
          description: Mặc định mọi trạng thái trừ `pending`/`expired`/`failed` khi lọc theo đối soát
          schema: { $ref: '#/components/schemas/PaymentStatus' }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
