        approvalRequestId: { $ref: '#/components/schemas/Uuid', description: 'Giao dịch hoàn (`type=refund`): yêu cầu duyệt `refund` đã thực hiện (0.3.6, A-33)' }
        reconciliationNote:
          type: string
          description: 'Ghi chú đối soát (bắt buộc khi `disputed`) – 0.3.3'
          x-visible-to: [owner, manager, front_desk_lead, front_desk, sales_staff]
        version: { type: integer, description: 'Khóa lạc quan cho `reconcilePayment` (`If-Match`) – 0.3.3' }
        receivedAmountVnd:
          $ref: '#/components/schemas/MoneyVnd'
          description: '0.3.7 (nháp B-11): số lễ tân thực nhận khi `confirmCashHandover result=short` (< `amountVnd`)'
          x-visible-to: [owner, manager, front_desk_lead, front_desk]
        selfReconciled:
          type: boolean
          description: '0.3.7 (nháp B-11): OWN tự đối soát khoản do chính mình ghi (ngoại lệ rbac A46) – để MGR/OWN rà lại'
          x-visible-to: [owner, manager]
    PaymentListItem:
      description: 'Dòng của `listPayments` (0.3.3, E05-03)'
      allOf:
        - $ref: '#/components/schemas/Payment'
        - type: object
          properties:
            hasAttachment: { type: boolean }
            pendingDays: { type: integer, description: 'Số ngày nghiệp vụ kể từ `receivedAt` khi `reconciliation=pending`' }
            reconcileOverdue: { type: boolean, description: 'Chờ > `bank_reconcile_alert_days` (BR-527) – "Cần chú ý"' }
    PaymentCreate:
      type: object
      required: [type, method, amountVnd]
      description: '`type=refund` không nhận ở đây (422 `NOT_IN_LIST`, `field` = `type`) – hoàn chỉ qua `executeRefund` (0.3.6, A-33)'
      properties:
        type: { $ref: '#/components/schemas/PaymentType' }
        method: { $ref: '#/components/schemas/PaymentMethod' }
        amountVnd: { $ref: '#/components/schemas/MoneyVnd' }
        receivedAt: { $ref: '#/components/schemas/Instant' }
        posAuthCode: { type: string, maxLength: 12, description: 'Mã chuẩn chi máy POS (R-PAY-04) – không nhập số thẻ', x-rbac-field: D14 }
        note: { type: string, maxLength: 300 }
        billingPeriodId:
          $ref: '#/components/schemas/Uuid'
          description: 'Ghi thu kỳ hợp đồng dài hạn (US-119 AC5) – cập nhật `billing_period.paid_amount_vnd`, đủ tiền → kỳ `paid` (T2)'
        attachmentId:
          $ref: '#/components/schemas/Uuid'
          description: |
            Ảnh biên nhận chuyển khoản – id từ `uploadAttachment purpose=deposit_receipt` của cùng cơ sở, do chính người gọi tải hoặc FD+ (sai → 422 `NOT_IN_LIST`);
            BR-527 "kèm ảnh/mã giao dịch" (0.3.3, E05-01). **0.3.6**: bỏ chặn tạm A-17 – nhận từ Sprint 3 (SEC I1 duyệt). Một ảnh chỉ gắn một giao dịch.
    Folio:
      type: object
      required: [id, status, lines, payments, totals, version]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        status: { $ref: '#/components/schemas/FolioStatus' }
        billNo: { oneOf: [{ $ref: '#/components/schemas/BillNo' }, { type: 'null' }] }
        reservationIds: { type: array, items: { $ref: '#/components/schemas/Uuid' }, description: 'Đơn gốc + đơn con gia hạn dùng chung folio' }
        lines:
          type: array
          x-visible-to: [owner, manager, front_desk_lead, front_desk, sales_staff]
          items: { $ref: '#/components/schemas/FolioLine' }
        payments:
          type: array
          x-visible-to: [owner, manager, front_desk_lead, front_desk, sales_staff]
          items: { $ref: '#/components/schemas/Payment' }
        totals:
          type: object
          required: [roomVnd]
          description: CTV chỉ nhận `roomVnd` và `depositHeldVnd` (rbac, SEC-ARC-15); các trường khác vắng mặt với CTV
          properties:
            roomVnd: { $ref: '#/components/schemas/MoneyVnd' }
            otherVnd: { $ref: '#/components/schemas/MoneyVnd', x-visible-to: [owner, manager, front_desk_lead, front_desk, sales_staff] }
            focVnd: { $ref: '#/components/schemas/MoneyVnd', x-visible-to: [owner, manager, front_desk_lead, front_desk, sales_staff] }
            totalVnd: { $ref: '#/components/schemas/MoneyVnd', x-visible-to: [owner, manager, front_desk_lead, front_desk, sales_staff] }
            paidVnd: { $ref: '#/components/schemas/MoneyVnd', x-visible-to: [owner, manager, front_desk_lead, front_desk, sales_staff], description: 'Đã thu (giao dịch `succeeded` không phải dòng đảo, gồm cọc và `ota_collect`, không gồm `security_deposit`) – **không** trừ khoản hoàn (0.3.7 bổ sung 4, BUG-R2-102: Desk hiện "Đã thu" = số này, "Đã hoàn" = `refundedVnd`)' }
            refundedVnd: { $ref: '#/components/schemas/MoneyVnd', x-visible-to: [owner, manager, front_desk_lead, front_desk, sales_staff], description: '0.3.7 bổ sung 4 (BUG-R2-102, ARC 18/10): tổng đã hoàn cho khách (giao dịch `type = refund` `succeeded`, không phải dòng đảo), số dương – cùng số server đã dùng để tính `balanceDueVnd`/`creditVnd`. Desk không tự cộng giao dịch hoàn' }
            paidViaOtaVnd: { $ref: '#/components/schemas/MoneyVnd', x-visible-to: [owner, manager, front_desk_lead, front_desk, sales_staff] }
            depositHeldVnd: { $ref: '#/components/schemas/MoneyVnd' }
            balanceDueVnd: { $ref: '#/components/schemas/MoneyVnd', x-visible-to: [owner, manager, front_desk_lead, front_desk, sales_staff], description: '= max(0, tổng dòng `posted` sau phần OTA trả − (đã thu của khách sạn − đã hoàn)). Chỉ tính dòng **đã ghi**: folio chưa có dòng nào (đơn `hold`) → 0, Desk hiện "Chưa có khoản nào trên folio" thay vì "Còn phải thu 0" (0.3.7 bổ sung 4, BUG-R2-101; `Reservation.balanceDueVnd` vắng trong trường hợp này)' }
            creditVnd:
              $ref: '#/components/schemas/MoneyVnd'
              x-visible-to: [owner, manager, front_desk_lead, front_desk]
              description: 'Đã thu (gồm `pending` đối soát) − tổng − đã hoàn, khi > 0; ngược lại 0. `balanceDueVnd` và `creditVnd` không cùng > 0 (0.3.6, A-34). 0.3.6 bổ sung 2 (BA v0.3, ARC 17/10): không gồm phần dư sinh từ `ota_collect` (xem `otaExcessVnd`)'
            unhandledCreditVnd:
              $ref: '#/components/schemas/MoneyVnd'
              x-visible-to: [owner, manager, front_desk_lead, front_desk]
              description: '0.3.6 bổ sung 2 (BA v0.3, ARC 17/10) (E15-05, BR-522 v0.3.4): `creditVnd` − tổng yêu cầu hoàn đang mở (`pending`/`approved` chưa chi đủ); trần của `createRefundRequest` và `overpaymentHandling`'
            otaExcessVnd:
              $ref: '#/components/schemas/MoneyVnd'
              x-visible-to: [owner, manager, front_desk_lead, front_desk]
              description: |
                0.3.6 bổ sung 2 (BA v0.3, ARC 17/10) (DOM BE-13): phần OTA đã thu vượt tiền phòng hiện còn (ví dụ sau B16 đơn OTA) – OTA hoàn cho khách theo chính sách OTA, **không** vào
                `creditVnd`, blocker `credit_balance` hay luồng hoàn của OTTIMO.
          x-ota-prepaid-rule: |
            0.3.6 bổ sung 2 (BA v0.3, ARC 17/10) (DOM BE-13, BR-307): đơn `paymentModel = ota_prepaid` khi xác nhận (B2 OTA / nhập tay) có **một** giao dịch hệ thống `method = ota_collect`,
            `type = charge`, `recordedByRole` = null (actor `system`) bằng tiền phòng OTA của các đêm còn hiệu lực; tự điều chỉnh (đảo + ghi lại, audit
            `payment.ota_collect_adjusted`) khi đêm đổi (B13 OTA → đơn con, B16, đổi ngày = hủy + tạo lại). `paidVnd` gồm khoản này, `paidViaOtaVnd` = nó;
            `balanceDueVnd` vì thế chỉ còn khoản phát sinh tại quầy (Agoda 2 đêm 1.800.000 + minibar 70.000 → 70.000). `ota_pay_at_property`: không có `ota_collect`.
        pendingApprovals: { type: integer }
        invoiceRequest: { $ref: '#/components/schemas/InvoiceRequest' }
        version: { type: integer, description: '0.3.7 bổ sung 4 (N-6, ARC 16.29): tăng **mỗi lần** folio đổi tiền – ghi/đảo/sửa dòng (gồm dòng đêm do B7/B9a/B13/B14/B16 đồng bộ, dòng FOC, phí) và ghi/đổi trạng thái/đảo giao dịch (`recordPayment`, thu nợ, `createVietQr`, `confirmPaymentReceived`, đối soát, `reversePayment`, chi hoàn, đồng bộ `ota_collect`), cùng `settled`/`closed`. Không tăng khi chỉ gắn dòng với yêu cầu duyệt và khi QR chờ hết hạn (J24) – không đổi tiền (ARC 16.30). Một lệnh có thể tăng nhiều bậc; client chỉ so bằng. `If-Match` của `adjustFolioLine` dựa trên số này → quyết định trên số cũ nhận 412' }
    InvoiceRequest:
      type: object
      required: [buyerType]
      properties:
        buyerType: { type: string, enum: [company, individual, retail] }
        companyName: { type: string, x-rbac-field: D16 }
        taxCode: { type: string, pattern: '^[0-9]{10}(-?[0-9]{3})?$', x-rbac-field: D16 }
        address: { type: string, x-rbac-field: D16 }
        email: { type: string, format: email, x-rbac-field: D16 }
        einvoiceStatus: { type: string, enum: [not_requested, pending, issued, failed] }
    Bill:
      type: object
      required: [folioId, locale, lines, totalVnd, paidVnd, balanceDueVnd]
      properties:
        folioId: { $ref: '#/components/schemas/Uuid' }
        billNo: { type: [string, 'null'] }
        settledAt:
          type: [string, 'null']
          format: date-time
          description: |
            **0.3.7 bổ sung 1 (FE-B s4 mục 5 – S4-29, US-020 AC2)**: thời điểm chốt folio (`folio.settled_at`, SM-13 – cùng lúc cấp `billNo`), ISO có offset `+07:00`.
            `null` khi folio còn `open` (bản xem trước). Bản in ghi "Lập lúc {settledAt}" – in lại phiếu cũ giữ đúng giờ chốt, không dùng giờ máy lúc in.
        locale: { type: string, enum: [vi, vi_en] }
        property: { type: object, properties: { name: { type: string }, address: { type: string }, taxCode: { type: string } } }
        guestDisplayName: { type: string, x-rbac-field: D01 }
        roomNo:
          type: string
          deprecated: true
          description: '**Deprecated 0.3.7 bổ sung D1 (BR-012 (1))**: bill là chữ khách nhìn thấy – **không in** số căn (bản in/PDF dùng `roomName`). Server vẫn trả cho Desk tới 0.4 (tiêu đề màn xem)'
        roomName:
          type: [string, 'null']
          example: The Valley
          description: |
            0.3.7 bổ sung D1 (BR-012 (1), (5)): tên phòng in trên bill (căn của đoạn cuối). Folio `open` → tên hiện hành của căn; folio `settled`/`closed` → **tên lúc chốt**
            (chụp trong giao dịch chốt – `folio.settled_room_names`; đổi tên căn sau đó không đổi bill). `null` = căn chưa có tên (bản in tạm "phòng {số}" – DS 11.3)
        arrivalDate: { $ref: '#/components/schemas/LocalDate' }
        departureDate: { $ref: '#/components/schemas/LocalDate' }
        lines: { type: array, items: { $ref: '#/components/schemas/FolioLine' } }
        totalVnd: { $ref: '#/components/schemas/MoneyVnd', description: '`ota_prepaid`: chỉ các khoản tại quầy (khoản OTA đã thu không in – DOM BE-13, 0.3.6 bổ sung)' }
        paidVnd: { $ref: '#/components/schemas/MoneyVnd', description: 'Đã thu tại quầy (phần OTA thu hộ ở `otaPrepaidVnd`) – 0.3.6 bổ sung' }
        balanceDueVnd: { $ref: '#/components/schemas/MoneyVnd' }
        creditVnd:
          $ref: '#/components/schemas/MoneyVnd'
          description: 'Tiền khách trả thừa OTTIMO chưa hoàn (in "Hoàn lại khách {x}" – spec 5.4, DOM BE-21). 0.3.6 bổ sung (review S3)'
        usdReference:
          type: object
          description: 'Chỉ khi `locale=vi_en` (US-037 AC2, BR-004) – 0.3.3 mô tả'
          properties:
            rate: { type: integer }
            totalUsd: { type: number, multipleOf: 0.1, description: 'Tổng ÷ `fx_usd_vnd`, làm tròn 1 chữ số thập phân' }
            rateUpdatedOn: { $ref: '#/components/schemas/LocalDate' }
        vietqrTransferContent: { type: string }
        paymentModel: { type: string, enum: [direct, ota_prepaid, ota_pay_at_property], description: '0.3.6 (DOM G-13)' }
        otaPrepaidNote: { type: [string, 'null'], description: 'Chỉ `ota_prepaid`: "Đã thu qua {kênh}" theo `locale` – thay dòng tiền phòng (0.3.6)' }
        otaPrepaidVnd: { oneOf: [{ $ref: '#/components/schemas/MoneyVnd' }, { type: 'null' }], description: 'Tổng tiền phòng OTA đã thu (tóm tắt, không chi tiết đêm) – 0.3.6 E05-10' }
        refunds:
          type: array
          description: 'Dòng hoàn đã chi (`executeRefund`) in dưới phần thanh toán – 0.3.6 E05-10'
          items:
            type: object
            required: [amountVnd, paidAt, method]
            properties:
              amountVnd: { $ref: '#/components/schemas/MoneyVnd' }
              paidAt: { $ref: '#/components/schemas/Instant' }
              method: { $ref: '#/components/schemas/PaymentMethod' }
        refundedVnd: { $ref: '#/components/schemas/MoneyVnd' }
    ChargeCatalogItem:
      type: object
      required: [code, category, name, defaultUnitPriceVnd]
      properties:
        code: { type: string, example: smoking_fee }
        category: { $ref: '#/components/schemas/FolioLineCategory' }
