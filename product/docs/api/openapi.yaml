        **0.3.7 (nháp A.5–A.6, SEC s3 7.1/7.4)**: hồ sơ `source = document` chưa có P05 (`crmConsent` ≠ `granted`): gửi `tags`/`freeNote`/`serviceNotes`/`dateOfBirth`/`gender` → 422
