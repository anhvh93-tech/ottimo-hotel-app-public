  /v1/properties/{propertyId}/reservations/{reservationId}/messages/render:
    parameters:
      - $ref: '#/components/parameters/PropertyId'
      - $ref: '#/components/parameters/ReservationId'
    post:
      tags: [messaging]
      operationId: renderMessage
      summary: Điền mẫu tin theo đơn và ngôn ngữ để sao chép (manual_copy, US-125). Ghi message_log (không lưu nội dung).
      description: |
        Mẫu chứa link app khách (`checkin_link`, `guest_link`) đi qua cùng kiểm quyền với A22 `issueGuestLink`: CTV → `403 FORBIDDEN_ACTION` (SR-MSG-03).
        Render **không** cấp token mới và không thu hồi link khách đang dùng: server không giữ token rõ nên biến `{{guest_link}}` chỉ điền được khi
        gọi kèm `guestLinkUrl` vừa nhận từ `issueGuestLink` trong cùng thao tác; thiếu → `409 INVALID_TRANSITION` với hướng dẫn "Cấp link trước".
        Mẫu `verify_code` **không** render ở đây (chỉ có trong phản hồi `issueGuestVerificationCode`).
        **Không render mẫu chứa C3** (BUG-R1-SEC-01): `door_code` và mọi mẫu có `MessageTemplate.containsC3 = true` → `422 VALIDATION_FAILED`
        (`errors[{field: templateCode, code: C3_TEMPLATE_USE_DEDICATED_ENDPOINT}]`) với **mọi vai**; nhân viên FD+ dùng `renderDoorCodeMessage`.
        Phản hồi của operation này không bao giờ chứa giá trị C3. Email escape HTML.
      x-roles: [owner, manager, front_desk_lead, front_desk, sales_staff, collaborator]
      x-scope: { sales_staff: own, collaborator: own }
      x-stories: [US-125]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [templateCode, locale]
              properties:
                templateCode: { type: string, example: checkin_link }
                locale: { $ref: '#/components/schemas/Locale' }
                guestLinkUrl: { type: string, format: uri, writeOnly: true, description: URL vừa cấp bởi issueGuestLink (không lưu) }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [text, locale]
                properties:
                  locale: { $ref: '#/components/schemas/Locale' }
                  subject: { type: string }
                  text: { type: string }
              example: { locale: ru, text: 'Здравствуйте, Daniel! Ваше бронирование OTM-00171: заезд 19.10, выезд 22.10. Онлайн-регистрация: https://guest.example.invalid/g/…' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /v1/properties/{propertyId}/reservations/{reservationId}/messages/render-door-code:
    parameters:
      - $ref: '#/components/parameters/PropertyId'
      - $ref: '#/components/parameters/ReservationId'
    post:
      tags: [messaging]
      operationId: renderDoorCodeMessage
      summary: Điền mẫu tin chứa mã cửa (C3) để sao chép gửi khách – chỉ FD+ trên thiết bị được cấp, step-up, ghi c3_access_log (US-125, US-128; BUG-R1-SEC-01)
      description: |
        Operation **riêng** cho mọi mẫu `MessageTemplate.containsC3 = true` (hiện chỉ `door_code`) để kiểm soát C3 giống `getDoorCredential` (rbac A21, D22):
        - Vai: owner, manager, front_desk_lead, front_desk. `sales_staff`, `collaborator` và vai khác → `403 FORBIDDEN_ACTION` (ghi `audit_event access.denied`).
        - Thiết bị tin cậy bắt buộc (`403 DEVICE_NOT_TRUSTED`) và step-up trong cửa sổ `c3_stepup_minutes` (`401 REAUTH_REQUIRED`) – thứ tự kiểm theo mục "Thứ tự kiểm".
        - Chỉ khi `door_credential` của đơn còn hiệu lực, đúng ngày đến hoặc đơn `in_house` (SR-LOCK-03) và khai báo không chặn mã cửa
          (`Registration.blocksDoorCode`, BR-613 c); nếu không → `409 INVALID_TRANSITION`.
        - Ghi **một** dòng `c3_access_log` (`subject_type=door_credential`, `action=copy`, `purpose=send_to_guest`) **trước khi** trả phản hồi; ghi log thất bại → `500`, không trả mã.
        - Phản hồi `Cache-Control: no-store`. `message_log` ghi `template_code=door_code`, kênh `manual_copy`, **không** lưu nội dung/mã (giữ nguyên quy tắc).
        - Không có `Idempotency-Key`: gửi lại = thêm một lần xem mã, phải có thêm một dòng `c3_access_log` (không trả lại phản hồi đã lưu chứa C3).
      x-roles: [owner, manager, front_desk_lead, front_desk]
      x-rbac: [A21]
      x-classification: C3
      x-requires-trusted-device: true
      x-step-up: true
      x-c3-log: { subjectType: door_credential, action: copy }
      x-rate-limit: 60/giờ/người cảnh báo, 200/giờ chặn – chung bộ đếm với getDoorCredential (SR-RL-06)
      x-stories: [US-125, US-128]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [templateCode, locale]
              properties:
                templateCode: { type: string, enum: [door_code] }
                locale: { $ref: '#/components/schemas/Locale' }
            example: { templateCode: door_code, locale: en }
      responses:
        '200':
          description: OK – văn bản chứa mã cửa, chỉ hiển thị để sao chép, client không lưu (không cache, không đưa vào hàng đợi offline)
          headers:
            Cache-Control: { schema: { type: string, enum: [no-store] } }
          content:
            application/json:
              schema:
                type: object
                required: [text, locale, validFrom, validTo]
                properties:
                  locale: { $ref: '#/components/schemas/Locale' }
                  subject: { type: string }
                  text: { type: string, x-classification: C3, x-rbac-field: D22 }
                  validFrom: { $ref: '#/components/schemas/Instant' }
                  validTo: { $ref: '#/components/schemas/Instant' }
              example: { locale: en, text: 'Hi Daniel, your door code for unit 201 is 582913, valid 19/10 14:00 – 22/10 12:00.', validFrom: '2026-10-19T14:00:00+07:00', validTo: '2026-10-22T12:00:00+07:00' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }

  # ───────────────────────── guest portal (ADR-006) ─────────────────────────
  /v1/guest/sessions:
    post:
      tags: [guest-portal]
      operationId: openGuestSession
      summary: Đổi token trong link `/g/{token}` lấy cookie phiên khách mức 1 (US-106 AC1, AC2)
