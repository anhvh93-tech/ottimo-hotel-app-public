  /v1/properties/{propertyId}/folios/{folioId}/payments:
    parameters:
      - $ref: '#/components/parameters/PropertyId'
      - $ref: '#/components/parameters/FolioId'
    post:
      tags: [folio]
      operationId: recordPayment
      summary: Ghi nhận một lần thu (cọc, thu khi nhận/trả, OTA thu hộ) – giao dịch `succeeded` (US-119; A33). Không nhận dữ liệu thẻ.
      description: |
        **0.3.8 bổ sung 3 (ARC 24/10, FB-R3-ARC-FUZZ-01, BR-522 K11-06)**: trên folio `settled`, thao tác này để lại tiền dư chưa có yêu cầu hoàn (`unhandledCreditVnd` > 0) → server tạo **một** yêu cầu hoàn `overpayment` bằng phần chưa yêu cầu (người xin = người thao tác; người duyệt MGR+ khác người xin – SEC F8) và mở "Cần chú ý" `closed_reservation_credit`, **cùng giao dịch**; yêu cầu hoàn đang mở lớn hơn tiền dư → chạy lại `refundPlan` (hủy `superseded` + tạo lại, DOM-S4-14). Không đổi hình dạng phản hồi.
        **0.3.7 bổ sung 4 – thu công nợ sau trả phòng (BR-525, ARC 16.26)**: folio `settled`/`closed` mặc định → 409 `FOLIO_LOCKED`. **Ngoại lệ duy nhất**: đơn có **công nợ mở**
        (ghi lúc B18 `checkOut.debt`, hoặc tự ghi khi đảo khoản thu – G-4) và `type = charge` → được ghi (FD+, không SAL/CTV), số tiền ≤ còn phải thu (vượt → 422 `AMOUNT_EXCEEDS_BALANCE`,
        `max`); folio **giữ** `settled`/`closed`, hóa đơn đã xuất không đổi, audit `money` `payment.recorded` kèm `debtCollection: true`. Thứ tự khóa (16.19): mọi đơn của folio
        `NO KEY UPDATE` → folio → giao dịch. Thu đủ (còn phải thu = 0) trong cùng giao dịch → công nợ đóng (mục "Cần chú ý" `checkout_debt` tự hết) và gọi cổng hoa hồng "đã thu đủ".
        Thu một phần → công nợ còn mở với số còn lại. `type` khác `charge` trên folio đã khóa → 409 `FOLIO_LOCKED` như cũ.
        **ARC 16.31 (BR-525 lần 8)**: "công nợ mở" = `openDebtVnd` > 0 (theo số; folio `closed` = còn phải thu; công nợ ghi lúc B18, G-4 hoặc J15). Khoản thu trả **công nợ trước** (G-6) rồi
        mới tới khoản trong cửa sổ; Desk hiện một số còn phải thu. Trong cửa sổ, khoản thu cho khoản phát sinh sau trả phòng nhận như BR-427 (c) dù không có công nợ. Folio `settled` đã quá cửa sổ
        mà J15 (mỗi giờ) chưa chạy và chưa có công nợ → 409 `FOLIO_LOCKED` tới lần chạy J15 kế tiếp (N-15 – chấp nhận ở R2, khoảng hở ≤ 1 giờ).
      x-roles: [owner, manager, front_desk_lead, front_desk, sales_staff]
      x-scope: { sales_staff: own_deposit_only }
      x-rbac: [A33]
      x-stories: [US-119]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PaymentCreate' }
            example: { type: charge, method: bank_transfer, amountVnd: 1660000, receivedAt: '2026-10-19T14:40:00+07:00' }
      responses:
        '201':
          description: Đã ghi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payment' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 'FOLIO_LOCKED – bill đã khóa (US-038 AC2); SHIFT_NOT_OPEN (R3) – 0.3.7 khai (nháp B-10)'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
