              companion: { value: { role: companion, guestId: 0192a1b0-0000-7000-8000-0000000aa013, relationship: spouse } }
              child: { value: { role: child, childName: NGUYEN AN NHI, childBirthYear: 2019 } }
      responses:
        '201':
          description: Đã thêm
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Party' }
        '409':
          description: PARTY_DUPLICATE – người này đã có trong đơn, kể cả người đứng tên (US-022 AC3); hoặc INVALID_TRANSITION
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
