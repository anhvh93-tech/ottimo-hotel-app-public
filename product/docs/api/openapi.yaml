        selfInspection: { type: boolean }
        inspectedAt: { $ref: '#/components/schemas/Instant' }
        inspectedBy: { type: string }
        roomStatusAfter: { $ref: '#/components/schemas/RoomStatusCode' }
    HkTask:
      type: object
      required: [id, roomId, roomNo, type, status, dueDate, source, version]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        roomId: { $ref: '#/components/schemas/Uuid' }
