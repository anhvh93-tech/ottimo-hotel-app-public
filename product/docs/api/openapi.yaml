                secret: { type: string, writeOnly: true, minLength: 6, maxLength: 256 }
                reason: { type: string, minLength: 3, maxLength: 500 }
                pin: { type: string, writeOnly: true, deprecated: true, description: 'Bỏ từ 0.3.1 – dùng `authMethod` + `secret`' }
            example: { authMethod: password, secret: '********', reason: Không đủ điều kiện FOC theo BR-431 }
      responses:
