  # ───────────────────────── reservations (SM-01) ─────────────────────────
  /v1/properties/{propertyId}/reservations:
    parameters:
      - $ref: '#/components/parameters/PropertyId'
    get:
      tags: [reservations]
      operationId: listReservations
      summary: Danh sách đơn có lọc (SAL/CTV chỉ thấy đơn của mình – US-087)
      x-roles: [owner, manager, front_desk_lead, front_desk, sales_staff, collaborator]
      x-scope: { sales_staff: own, collaborator: own }
      x-rbac: [S04]
      x-stories: [US-020, US-087]
      parameters:
        - name: status
          in: query
          style: form
          explode: false
          schema: { type: array, items: { $ref: '#/components/schemas/ReservationStatus' } }
        - name: stayFrom
          in: query
          schema: { $ref: '#/components/schemas/LocalDate' }
        - name: stayTo
          in: query
          schema: { $ref: '#/components/schemas/LocalDate' }
        - name: q
          in: query
          description: |
            Mã đơn, mã OTA, mã khách hoặc **tên người đứng tên** (0.3.7, S4-44 – UXR #11): tên từ 2 ký tự, không phân biệt hoa/thường và dấu, khớp một phần
            ("ha" → "Nguyễn Thu Hà"); server so `guest.name_search` qua cổng `guests/public` (chỉ mục trigram có sẵn – BE-A không đọc bảng `guest` trực tiếp).
            Không nhận SĐT/email qua query (SEC). SAL/CTV vẫn chỉ đơn của mình. Không tìm theo tên người đi cùng (hồ sơ "từ giấy tờ") ở R2.
            **0.3.7 bổ sung D1 (BR-012 (2) – cài cùng S4-44, BE-A)**: cũng nhận **số căn** (khớp đúng, `401`) hoặc **tên phòng** (`Room.name`, bỏ tiền tố "The", không phân biệt hoa/thường và dấu,
            khớp một phần từ 3 ký tự – `pine` → căn 401) → đơn có đoạn trên căn đó (như `roomId`); kết quả là **hợp** các cách khớp. Ô chọn/tìm căn trên Desk/PWA lọc ở client trên
            `roomNo` + `roomName` (≤ 10 căn, không phân trang) cùng quy tắc chuẩn hóa.
          schema: { type: string, maxLength: 40 }
        - name: roomId
          in: query
          description: '0.3.7 (nháp B-9, FE): đơn có đoạn (segment) trên căn này giao với khoảng `stayFrom`–`stayTo` (vắng khoảng = mọi ngày)'
          schema: { $ref: '#/components/schemas/Uuid' }
        - name: externalContract
          in: query
          description: 'Lọc đơn dài hạn nhập tay R2 (US-017 AC5a) để chuyển sang HĐ đầy đủ ở R3'
          schema: { type: boolean }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data, page]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/ReservationSummary' } }
                  page: { $ref: '#/components/schemas/PageInfo' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [reservations]
      operationId: createReservation
      summary: Tạo đơn ngắn ngày đã đảm bảo (B2) – trực tiếp đã thu, khách vãng lai, đơn OTA nhập tay (US-017, US-018, US-019, US-047)
      description: |
        Server trong **một giao dịch**: kiểm quyền → tính giá (giá trống → giá niêm yết theo BR-101/104, hiển thị trước qua `.../quotes/calculate` hoặc `previewOnly`)
        → ghi `room_occupancy` (exclusion constraint) → cấp mã `OTM-xxxxx` → sinh `stay_night`, folio, bản ghi khai báo `none` (BR-608)
        → outbox đồng bộ kênh. Đơn kênh khác OTA trùng → `409 ROOM_UNAVAILABLE`.

        **Đơn OTA nhập tay vào căn đã kín** (decision-log PO 15/10, US-139 tối thiểu): server **không** tự đổi căn mà không báo –
        trả `409 ROOM_UNAVAILABLE` kèm `suggestions[]` (căn trống cùng nhóm, rồi nhóm cao hơn theo `room_group.sort_order`, đánh dấu `upgrade`).
        Lễ tân chọn căn và gửi lại với `roomId` mới; hết căn → gửi lại với `allowUnassigned: true` → đơn được tạo `confirmed`,
        `conflictState=open`, không gán căn (làn "Chưa gán căn", erd mục 7). `allowUnassigned` chỉ hợp lệ với kênh `channel_group=ota`.
        Đơn OTA về qua channel manager (R3) tự gán: căn ánh xạ → căn trống cùng nhóm; nhóm cao hơn chỉ gợi ý, không tự gán (DOM 15/10).

        Đơn OTA chỉ có tổng tiền (`otaRoomAmountVnd`, không `nightlyRates`) → chia đều theo đêm, phần nguyên đồng, dư dồn đêm cuối;
        có `nightlyRates` thì Σ phải bằng `otaRoomAmountVnd` (nếu gửi cả hai) – erd mục 8.

        **Đơn dài hạn nhập tay (US-017 AC5a, tạm R2)**: gửi `manualLongStay` – xem schema `ManualLongStayInput`. Không có `manualLongStay`
        mà số đêm đạt ngưỡng BR-108 → `422 VALIDATION_FAILED` mã trường `LONG_STAY_REQUIRES_CONTRACT` (US-017 AC5; R2 UI hướng sang AC5a).
        SAL/CTV không tạo được (A01 ✖ – operation này không có trong `x-roles` của họ).

        **Ở tối thiểu và đêm lẻ (BR-113, 0.3.5 A-05)**: `roomId` vẫn bắt buộc. Khoảng ngày là đêm lẻ của căn đã chọn → nhận (ngoại lệ a). Không phải →
        `422` mã trường `MIN_STAY_NOT_MET` kèm `minStayNights` và `suggestions[]` các căn cùng nhóm có đêm lẻ (`orphanNight=true`); FDL+ bỏ qua bằng `minStayOverrideReason`.
      x-roles: [owner, manager, front_desk_lead, front_desk]
      x-rbac: [A01, S05]
      x-transition: B2
      x-stories: [US-017, US-018, US-019, US-023, US-047, US-139]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReservationCreate' }
            examples:
              manualLongStay:
                summary: Đơn dài hạn nhập tay R2 – HĐ ngoài hệ thống (US-017 AC5a)
                value:
                  roomId: 0192a1b0-0000-7000-8000-0000000c0302
                  channelId: 0192a1b0-0000-7000-8000-0000000d0001
                  arrivalDate: '2026-11-01'
                  departureDate: '2027-05-01'
                  adults: 1
                  bookerGuestId: 0192a1b0-0000-7000-8000-00000000a021
                  paymentModel: direct
                  manualLongStay: { monthlyRentVnd: 9500000, externalContractRef: HĐ-2026-031, depositHeldVnd: 9500000 }
              ota:
                summary: Đơn Booking.com nhập tay (US-017 AC1)
                value:
                  roomId: 0192a1b0-0000-7000-8000-0000000c0203
                  channelId: 0192a1b0-0000-7000-8000-0000000cb002
                  arrivalDate: '2026-10-19'
                  departureDate: '2026-10-22'
                  adults: 2
                  bookerGuestId: 0192a1b0-0000-7000-8000-0000000aa012
                  otaRef: '4021788113'
                  paymentModel: ota_prepaid
                  nightlyRates: [{ date: '2026-10-19', amountVnd: 820000 }, { date: '2026-10-20', amountVnd: 820000 }, { date: '2026-10-21', amountVnd: 820000 }]
              walkIn:
                summary: Khách vãng lai đến hôm nay, giá mặc định
                value:
                  roomId: 0192a1b0-0000-7000-8000-0000000c0201
                  channelId: 0192a1b0-0000-7000-8000-0000000cb010
                  arrivalDate: '2026-10-15'
                  departureDate: '2026-10-17'
                  adults: 1
                  bookerGuestId: 0192a1b0-0000-7000-8000-0000000aa003
                  paymentModel: direct
                  initialPayment: { type: deposit, method: cash, amountVnd: 1334000 }
      responses:
        '201':
          description: Đã tạo
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reservation' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/RoomUnavailable' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
