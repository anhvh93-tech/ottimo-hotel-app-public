  /v1/guest/sessions/otp:
    post:
      tags: [guest-portal]
      operationId: sendGuestOtp
      summary: Gửi OTP email 6 số (10 phút) tới email trên đơn để lên mức 2 (SR-GST-07a)
      description: |
        OTP sinh bằng CSPRNG, lưu băm trên `guest_verification_code` gắn token; gửi qua `NotificationAdapter` email (outbox).
        Tối đa 3 OTP/giờ/token (SR-GST-08). Đơn **không có email** → `409 INVALID_TRANSITION` với hướng dẫn "nhờ lễ tân cấp mã".
        Email trên đơn **vừa đổi trong 24 giờ** sau khi đã cấp link → từ chối cùng hướng dẫn, trừ khi lễ tân đã xác nhận lại (SR-GST-14).
        Phản hồi chỉ có email đã che (`d***@g***.com`).
      security:
        - guestSession: []
      x-roles: [guest]
      x-guest-level: 1
      x-after-checkout: allowed
      x-rate-limit: 3 OTP/giờ/token (SR-RL-04)
      x-stories: [US-106, US-141]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Đã xếp gửi
          content:
            application/json:
              schema:
                type: object
                required: [maskedEmail, expiresAt]
                properties:
                  maskedEmail: { type: string, example: 'd***@g***.com' }
                  expiresAt: { $ref: '#/components/schemas/Instant' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /v1/guest/sessions/verify:
    post:
      tags: [guest-portal]
      operationId: verifyGuestSession
      summary: Lên mức 2 bằng OTP email hoặc mã xác minh do lễ tân cấp (SR-GST-07; US-106 AC3)
      description: |
        Chỉ hai yếu tố được chấp nhận: `email_otp` (gửi bằng `sendGuestOtp`) và `desk_code` (mã lễ tân cấp – tại quầy, điện thoại hoặc qua kênh
        nhắn tin nếu owner bật). 4 số cuối SĐT và mã đặt phòng **không** là yếu tố xác minh (TM-21).
        Đếm sai **theo token**, chung mọi loại mã: 5 lần sai/24 giờ → khóa xác minh của token (`429 GUEST_VERIFICATION_LOCKED`); khi bị khóa chỉ mã
        lễ tân đọc tại quầy/gọi điện còn dùng được (SR-GST-08). Mã dùng một lần. Phiên mức 2 hết sau `guest_level2_idle_minutes` (30) không hoạt động
        và tối đa 24 giờ → về mức 1 (SR-GST-09).
      security:
        - guestSession: []
      x-roles: [guest]
      x-guest-level: 1
      x-after-checkout: allowed
      x-rate-limit: 5 sai/token/24 giờ (SR-RL-04)
      x-stories: [US-106, US-141]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [method, code]
              properties:
                method: { type: string, enum: [email_otp, desk_code] }
                code: { type: string, pattern: '^[0-9]{6}$', writeOnly: true }
            example: { method: email_otp, code: '381904' }
      responses:
        '200':
          description: OK – phiên lên mức 2
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GuestSession' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /v1/guest/stay:
    get:
      tags: [guest-portal]
      operationId: getGuestStay
      summary: Thông tin lưu trú – ngày, giờ chuẩn, chỉ đường, nội quy + phí phạt; Wi-Fi và mã cửa chỉ từ ngày nhận phòng (mã cửa cần mức 2) (US-108, US-128)
      description: |
        Trường theo mức (SR-GST-06, -10): mức 1 – ngày, giờ, chỉ đường, nội quy, Wi-Fi (từ ngày nhận phòng); mức 2 thêm họ tên đầy đủ,
        `doorCode` (chỉ trong `[validFrom, validTo]` và đơn `confirmed`/`in_house`). Mỗi lần trả `doorCode` ghi `c3_access_log`
        (`actor_type=guest`) và phản hồi `no-store`. Sau `checked_out` → `403 GUEST_STAY_ENDED`.
      security:
        - guestSession: []
      x-roles: [guest]
      x-guest-level: 1
      x-after-checkout: blocked
      x-scope: { guest: reservation }
      x-stories: [US-108, US-128, US-112]
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GuestStay' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/GuestForbidden' }
