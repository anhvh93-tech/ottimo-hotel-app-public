            Đã nhận (cũng là phản hồi **giống hệt** cho ô bẫy và cho liên hệ vượt 3/ngày – không cho biết yêu cầu có được lưu hay không). Chỉ có `refCode` và câu hứa công khai
            `promise` (DOM-S4-18) – không trả lại dữ liệu khách nhập, không trả `replyBy` nội bộ. `Cache-Control: no-store`.
          headers:
