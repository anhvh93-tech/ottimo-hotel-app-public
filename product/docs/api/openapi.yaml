    # ── folio ──
    FolioLine:
      type: object
      required: [id, category, description, quantity, unitPriceVnd, amountVnd, lineState, postedAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        category: { $ref: '#/components/schemas/FolioLineCategory' }
        revenueGroup: { type: string, enum: [room, other, non_revenue] }
        description: { type: string }
        serviceDate: { $ref: '#/components/schemas/LocalDate' }
        quantity: { type: number }
        unitPriceVnd: { $ref: '#/components/schemas/MoneyVnd' }
        amountVnd: { $ref: '#/components/schemas/MoneyVnd' }
        vatRatePct: { $ref: '#/components/schemas/Percent' }
        lineState: { type: string, enum: [posted, pending_approval, rejected] }
        relatedLineId: { $ref: '#/components/schemas/Uuid' }
        reversalOfId: { $ref: '#/components/schemas/Uuid' }
        approvalRequestId: { $ref: '#/components/schemas/Uuid' }
        postedAt: { $ref: '#/components/schemas/Instant' }
        postedBy: { type: string }
    FolioLineCreate:
      type: object
      required: [quantity]
      properties:
        chargeCode: { type: string, description: 'Mã trong charge-catalog (giá mặc định từ tham số)' }
        category: { $ref: '#/components/schemas/FolioLineCategory' }
        description: { type: string, maxLength: 200 }
        quantity: { type: number, minimum: 0.01 }
        unitPriceVnd: { $ref: '#/components/schemas/MoneyVnd' }
        serviceDate: { $ref: '#/components/schemas/LocalDate' }
        note: { type: string, maxLength: 500 }
        evidenceAttachmentIds: { type: array, items: { $ref: '#/components/schemas/Uuid' } }
    Payment:
      type: object
      required: [id, code, type, method, amountVnd, status]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        code: { type: string, example: PT-000231 }
        type: { $ref: '#/components/schemas/PaymentType' }
        method: { $ref: '#/components/schemas/PaymentMethod' }
        amountVnd: { $ref: '#/components/schemas/MoneyVnd' }
        status: { $ref: '#/components/schemas/PaymentStatus' }
        receivedAt: { $ref: '#/components/schemas/Instant' }
        recordedBy: { type: string }
        payerName:
          type: string
          x-rbac-field: D14
          x-visible-to: [owner, manager, front_desk_lead, front_desk]
        cardBrand: { type: string }
        cardLast4: { type: string, pattern: '^[0-9]{4}$' }
        reversalOfId: { $ref: '#/components/schemas/Uuid' }
        expiresAt: { $ref: '#/components/schemas/Instant' }
        methodDetail: { type: [string, 'null'], enum: [qr, atm, intl_card, wallet, null] }
        billingPeriodId: { $ref: '#/components/schemas/Uuid' }
        reconciliation:
          type: string
          enum: [not_required, pending, reconciled, disputed]
          description: 'Chuyển khoản/VietQR lễ tân tự ghi → `pending` ("Chờ đối soát" – BR-527, US-119 AC6); MGR+ đối soát theo sao kê'
        reconciledAt: { $ref: '#/components/schemas/Instant' }
        reconciledByName: { type: string, x-visible-to: [owner, manager] }
    PaymentCreate:
      type: object
      required: [type, method, amountVnd]
      properties:
        type: { $ref: '#/components/schemas/PaymentType' }
        method: { $ref: '#/components/schemas/PaymentMethod' }
        amountVnd: { $ref: '#/components/schemas/MoneyVnd' }
        receivedAt: { $ref: '#/components/schemas/Instant' }
        posAuthCode: { type: string, maxLength: 12, description: 'Mã chuẩn chi máy POS (R-PAY-04) – không nhập số thẻ' }
        note: { type: string, maxLength: 300 }
        billingPeriodId:
          $ref: '#/components/schemas/Uuid'
          description: 'Ghi thu kỳ hợp đồng dài hạn (US-119 AC5) – cập nhật `billing_period.paid_amount_vnd`, đủ tiền → kỳ `paid` (T2)'
    Folio:
      type: object
      required: [id, status, lines, payments, totals, version]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        status: { $ref: '#/components/schemas/FolioStatus' }
        billNo: { type: [string, 'null'], example: F-261022-0003 }
        reservationIds: { type: array, items: { $ref: '#/components/schemas/Uuid' }, description: 'Đơn gốc + đơn con gia hạn dùng chung folio' }
        lines:
          type: array
          x-visible-to: [owner, manager, front_desk_lead, front_desk, sales_staff]
          items: { $ref: '#/components/schemas/FolioLine' }
        payments:
          type: array
          x-visible-to: [owner, manager, front_desk_lead, front_desk, sales_staff]
          items: { $ref: '#/components/schemas/Payment' }
        totals:
          type: object
          required: [roomVnd]
          description: CTV chỉ nhận `roomVnd` và `depositHeldVnd` (rbac, SEC-ARC-15); các trường khác vắng mặt với CTV
          properties:
            roomVnd: { $ref: '#/components/schemas/MoneyVnd' }
            otherVnd: { $ref: '#/components/schemas/MoneyVnd', x-visible-to: [owner, manager, front_desk_lead, front_desk, sales_staff] }
            focVnd: { $ref: '#/components/schemas/MoneyVnd', x-visible-to: [owner, manager, front_desk_lead, front_desk, sales_staff] }
            totalVnd: { $ref: '#/components/schemas/MoneyVnd', x-visible-to: [owner, manager, front_desk_lead, front_desk, sales_staff] }
            paidVnd: { $ref: '#/components/schemas/MoneyVnd', x-visible-to: [owner, manager, front_desk_lead, front_desk, sales_staff] }
            paidViaOtaVnd: { $ref: '#/components/schemas/MoneyVnd', x-visible-to: [owner, manager, front_desk_lead, front_desk, sales_staff] }
            depositHeldVnd: { $ref: '#/components/schemas/MoneyVnd' }
            balanceDueVnd: { $ref: '#/components/schemas/MoneyVnd', x-visible-to: [owner, manager, front_desk_lead, front_desk, sales_staff] }
        pendingApprovals: { type: integer }
        invoiceRequest: { $ref: '#/components/schemas/InvoiceRequest' }
        version: { type: integer }
    InvoiceRequest:
      type: object
      required: [buyerType]
      properties:
        buyerType: { type: string, enum: [company, individual, retail] }
        companyName: { type: string }
        taxCode: { type: string, pattern: '^[0-9]{10}(-?[0-9]{3})?$' }
        address: { type: string }
        email: { type: string, format: email }
        einvoiceStatus: { type: string, enum: [not_requested, pending, issued, failed] }
    Bill:
      type: object
      required: [folioId, locale, lines, totalVnd, paidVnd, balanceDueVnd]
      properties:
        folioId: { $ref: '#/components/schemas/Uuid' }
        billNo: { type: [string, 'null'] }
        locale: { type: string, enum: [vi, vi_en] }
        property: { type: object, properties: { name: { type: string }, address: { type: string }, taxCode: { type: string } } }
        guestDisplayName: { type: string }
        roomNo: { type: string }
        arrivalDate: { $ref: '#/components/schemas/LocalDate' }
        departureDate: { $ref: '#/components/schemas/LocalDate' }
        lines: { type: array, items: { $ref: '#/components/schemas/FolioLine' } }
        totalVnd: { $ref: '#/components/schemas/MoneyVnd' }
        paidVnd: { $ref: '#/components/schemas/MoneyVnd' }
        balanceDueVnd: { $ref: '#/components/schemas/MoneyVnd' }
        usdReference: { type: object, properties: { rate: { type: integer }, totalUsd: { type: number }, rateUpdatedOn: { $ref: '#/components/schemas/LocalDate' } } }
        vietqrTransferContent: { type: string }
    ChargeCatalogItem:
      type: object
      required: [code, category, name, defaultUnitPriceVnd]
      properties:
        code: { type: string, example: smoking_fee }
        category: { $ref: '#/components/schemas/FolioLineCategory' }
        name: { type: string }
        defaultUnitPriceVnd: { $ref: '#/components/schemas/MoneyVnd' }
        unit: { type: string }
        evidenceRequired: { type: boolean }
        ruleRef: { type: string, example: BR-511 }
    MinibarCheckInput:
      type: object
      required: [mode, lines]
      properties:
        mode: { type: string, enum: [checkout, stayover] }
        lines:
          type: array
          items:
            type: object
            required: [itemId, remainingQty]
            properties:
              itemId: { $ref: '#/components/schemas/Uuid' }
              remainingQty: { type: integer, minimum: 0 }
        performedAt: { $ref: '#/components/schemas/Instant' }
    MinibarCheck:
      type: object
      required: [id, mode, lines]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        mode: { type: string, enum: [checkout, stayover] }
        checkedAt: { $ref: '#/components/schemas/Instant' }
        lines:
          type: array
          items:
            type: object
            required: [itemId, standardQty, remainingQty, usedQty]
            properties:
              itemId: { $ref: '#/components/schemas/Uuid' }
              itemName: { type: string }
              standardQty: { type: integer }
              remainingQty: { type: integer }
              usedQty: { type: integer }
              isFree: { type: boolean }
              amountVnd:
                $ref: '#/components/schemas/MoneyVnd'
                x-visible-to: [owner, manager, front_desk_lead, front_desk]
        totalVnd:
          $ref: '#/components/schemas/MoneyVnd'
          x-visible-to: [owner, manager, front_desk_lead, front_desk]
        refillTaskId: { $ref: '#/components/schemas/Uuid' }

    # ── duyệt ──
    ApprovalRequest:
      type: object
      required: [id, type, status, amountVnd, reasonCode, requestedBy, requestedAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        type:
          type: string
          enum: [foc, special_discount, refund, contract_override, checkin_room_not_ready, late_checkout_conflict, meter_lower_than_previous, stocktake_variance, damage_pricing, quote_extension, no_show_restore, debt_on_checkout]
        status: { $ref: '#/components/schemas/ApprovalStatus' }
        reservationCode: { type: string }
        folioLineId: { $ref: '#/components/schemas/Uuid' }
        amountVnd: { $ref: '#/components/schemas/MoneyVnd' }
        reasonCode: { type: string }
        reasonNote: { type: string }
        requestedBy: { type: string }
        requestedAt: { $ref: '#/components/schemas/Instant' }
        requiredRole: { $ref: '#/components/schemas/Role' }
        approverName: { type: string }
        approverRole: { $ref: '#/components/schemas/Role' }
        decidedAt: { $ref: '#/components/schemas/Instant' }
        decisionNote: { type: string }
        approverRemainingMonthlyVnd:
          $ref: '#/components/schemas/MoneyVnd'
          x-visible-to: [owner, manager, front_desk_lead]

    # ── nhật ký ──
    AuditEvent:
      type: object
      required: [occurredAt, actorType, category, action]
      properties:
        occurredAt: { $ref: '#/components/schemas/Instant' }
        actorType: { type: string, enum: [user, guest, system] }
        actorName: { type: string }
        category: { type: string, enum: [money, state, config, access, security, data] }
        action: { type: string, example: folio_line.adjusted }
        entityType: { type: string }
        entityId: { $ref: '#/components/schemas/Uuid' }
        entityCode: { type: string }
        before: { type: object, additionalProperties: true, description: 'Sinh bằng serializer audit theo danh sách trường cho phép từng thực thể; không bao giờ chứa cột `_enc`/giá trị C3; C2 che theo danh sách (SR-AUD-03)' }
        after: { type: object, additionalProperties: true, description: Như `before` }
        reason: { type: string }
    C3AccessEntry:
      type: object
      required: [occurredAt, actorType, subjectType, action]
      properties:
        occurredAt: { $ref: '#/components/schemas/Instant' }
        actorType: { type: string, enum: [user, guest, system], description: 'guest = khách xem mã cửa qua app mức 2 (SR-GST-10)' }
        userName: { type: string, description: Vắng khi actorType ≠ user }
        sessionRef: { type: string, description: '8 ký tự đầu của id phiên (đủ đối chiếu, không dùng lại được)' }
        trustedDeviceName: { type: string }
        requestId: { type: string }
        subjectType: { type: string, enum: [guest_document, document_image, door_credential, payee_account, portal_data] }
        action: { type: string, enum: [view, create, update, copy, delete, purge] }
        reservationCode: { type: string }
        subjectLabel: { type: string, description: 'Ví dụ "Hộ chiếu ••4821 – người 2" (không có số đầy đủ)' }
        reasonCode: { type: string }

    # ── khai báo ──
    RegistrationSummary:
      type: object
      required: [id, reservationId, reservationCode, status, requiredCount, submittedCount, deadlineLabel]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        reservationId: { $ref: '#/components/schemas/Uuid' }
        reservationCode: { type: string }
        roomNo: { type: string }
        guestDisplayName: { type: string }
        arrivalDate: { $ref: '#/components/schemas/LocalDate' }
        kind: { type: string, enum: [vn_citizen_stay, foreigner_temp_residence, mixed, unknown] }
        status: { $ref: '#/components/schemas/RegistrationStatus' }
        requiredCount: { type: integer }
        submittedCount: { type: integer }
        deadlineAt: { $ref: '#/components/schemas/Instant' }
        deadlineLabel: { type: string, enum: [at_checkin, before_deadline_today, overdue, done, needs_update] }
        isOverdue: { type: boolean }
    Registration:
      allOf:
        - $ref: '#/components/schemas/RegistrationSummary'
        - type: object
          required: [documents, allowedActions, version]
          properties:
            portalReference: { type: string }
            sentAt: { $ref: '#/components/schemas/Instant' }
            confirmedAt: { $ref: '#/components/schemas/Instant' }
            documents:
              type: array
              items: { $ref: '#/components/schemas/GuestDocumentMasked' }
            imageRetentionUntil: { $ref: '#/components/schemas/Instant' }
            blocksDoorCode:
              type: boolean
              description: 'true khi giấy tờ người nước ngoài hết hạn tại ngày nhận phòng (BR-613 c) – server **không** cho cấp/hiện mã cửa (setDoorCredential → 409, GuestStay.doorCode vắng) cho tới khi xử lý'
            allowedActions: { type: array, items: { $ref: '#/components/schemas/AllowedAction' } }
            version: { type: integer }
    GuestDocumentMasked:
      type: object
      required: [id, docType, isMain, docNumberLast4, checks]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        partyMemberId: { $ref: '#/components/schemas/Uuid' }
        docType: { $ref: '#/components/schemas/DocType' }
        isMain: { type: boolean }
        fullNameOnDoc: { type: string }
        nationalityCode: { type: string }
        docNumberLast4: { type: string }
        imageIds: { type: array, items: { $ref: '#/components/schemas/Uuid' } }
        imageConsent: { type: string, enum: [not_recorded, granted, refused] }
        captureMethod: { type: string, enum: [qr_cccd, mrz, manual, guest_upload] }
        checks:
          type: array
          items:
            type: object
            required: [code, result]
            properties:
              code: { $ref: '#/components/schemas/DocumentCheckCode' }
              result: { type: string, enum: [ok, warning, not_applicable] }
              handledNote: { type: string }
    GuestDocumentInput:
      type: object
      required: [docType, fullNameOnDoc, docNumber]
      properties:
        partyMemberId: { $ref: '#/components/schemas/Uuid', description: 'Bỏ trống → server khớp theo tên + ngày sinh hoặc tạo người mới quan hệ "Chưa rõ" (US-043 AC3)' }
        docType: { $ref: '#/components/schemas/DocType' }
        isMain: { type: boolean }
        fullNameOnDoc: { type: string }
        docNumber: { type: string, writeOnly: true, x-classification: C3 }
        dateOfBirth: { $ref: '#/components/schemas/LocalDate', writeOnly: true, x-classification: C3 }
        gender: { type: string, enum: [male, female, other] }
        nationalityCode: { type: string, pattern: '^[A-Z]{2,3}$' }
        passportIssueDate: { $ref: '#/components/schemas/LocalDate', writeOnly: true, x-classification: C3 }
        passportExpiryDate: { $ref: '#/components/schemas/LocalDate', writeOnly: true, x-classification: C3 }
        issuingPlace: { type: string, writeOnly: true, x-classification: C3 }
        visaKind: { type: string, enum: [visa, visa_exempt, temp_residence_card], writeOnly: true, x-classification: C3 }
        visaNumber: { type: string, writeOnly: true, x-classification: C3 }
        visaValidUntil: { $ref: '#/components/schemas/LocalDate', writeOnly: true, x-classification: C3 }
        entryDate: { $ref: '#/components/schemas/LocalDate', writeOnly: true, x-classification: C3 }
        entryPort: { type: string, writeOnly: true, x-classification: C3 }
        entryPurpose: { type: string, writeOnly: true, x-classification: C3 }
        address: { type: string, writeOnly: true, x-classification: C3, description: 'Chỉ khi biểu mẫu cổng yêu cầu (R-REG-04)' }
        captureMethod: { type: string, enum: [qr_cccd, mrz, manual] }
    GuestDocumentSensitive:
      type: object
      description: 'C3 đầy đủ – chỉ endpoint .../sensitive, mỗi lần đọc ghi c3_access_log'
      x-classification: C3
      required: [id, docType, docNumber]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        docType: { $ref: '#/components/schemas/DocType' }
        fullNameOnDoc: { type: string }
        docNumber: { type: string }
        dateOfBirth: { $ref: '#/components/schemas/LocalDate' }
        nationalityCode: { type: string }
        passportIssueDate: { $ref: '#/components/schemas/LocalDate' }
        passportExpiryDate: { $ref: '#/components/schemas/LocalDate' }
        issuingPlace: { type: string }
        visaKind: { type: string }
        visaNumber: { type: string }
        visaValidUntil: { $ref: '#/components/schemas/LocalDate' }
        entryDate: { $ref: '#/components/schemas/LocalDate' }
        entryPort: { type: string }
        entryPurpose: { type: string }
        address: { type: string }
    ConsentInput:
      type: object
      required: [purpose, decision, noticeVersion, locale]
      properties:
        partyMemberId: { $ref: '#/components/schemas/Uuid' }
        personIndex: { type: integer, minimum: 1, description: 'Dùng ở app khách' }
        purpose: { type: string, enum: [P02B_ID_IMAGE_RETENTION, P05_CRM, P06_MARKETING, P07_REVIEW] }
        decision: { type: string, enum: [granted, refused] }
        noticeVersion: { type: string }
        locale: { $ref: '#/components/schemas/Locale' }
        channel: { type: string, enum: [guest_app, desk, paper] }
    PortalData:
      type: object
      x-classification: C3
      required: [kind, portalUrl, people]
      properties:
        kind: { type: string, enum: [foreigner_temp_residence, vn_citizen_stay] }
        portalUrl: { type: string, format: uri }
        people:
          type: array
          items:
            type: object
            required: [fields]
            properties:
              fields:
                type: array
                items:
                  type: object
                  required: [label, value]
                  properties:
                    label: { type: string }
                    value: { type: string }
        clipboardText: { type: string, description: 'Văn bản sao chép đúng thứ tự cổng; client xóa clipboard sau khi dán (R-REG-07)' }

    # ── buồng phòng ──
    RoomStatusEntry:
      type: object
      required: [roomId, roomNo, status, since, allowedEvents, version]
      properties:
        roomId: { $ref: '#/components/schemas/Uuid' }
        roomNo: { type: string }
        status: { $ref: '#/components/schemas/RoomStatusCode' }
        statusLabel: { type: string, example: Trống · cần dọn }
        since: { $ref: '#/components/schemas/Instant' }
        currentGuest: { type: string, description: 'Tên gọi + căn, chỉ trong phạm vi T với HK (rbac D01)' }
        nextArrival:
          type: object
          properties:
            date: { $ref: '#/components/schemas/LocalDate' }
            etaTime: { $ref: '#/components/schemas/LocalTime' }
            guestDisplayName: { type: string }
        serviceNotes: { type: array, items: { type: string }, description: '"Lưu ý phục vụ" từ danh mục (rbac D12)' }
        allowedEvents: { type: array, items: { type: string, enum: [start_cleaning, finish_cleaning, needs_cleaning, inspect] } }
        openTaskIds: { type: array, items: { $ref: '#/components/schemas/Uuid' } }
        version: { type: integer }
    InspectionInput:
      type: object
      required: [checklistVersion, items, performedAt]
      properties:
        checklistVersion: { type: integer }
        items:
          type: array
          items:
            type: object
            required: [code, passed]
            properties:
              code: { type: string }
              passed: { type: boolean }
              note: { type: string }
        photoAttachmentIds: { type: array, items: { $ref: '#/components/schemas/Uuid' } }
        performedAt: { $ref: '#/components/schemas/Instant' }
    Inspection:
      type: object
      required: [id, roomId, result, inspectedAt, inspectedBy]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        roomId: { $ref: '#/components/schemas/Uuid' }
        result: { type: string, enum: [pass, fail] }
        selfInspection: { type: boolean }
        inspectedAt: { $ref: '#/components/schemas/Instant' }
        inspectedBy: { type: string }
        roomStatusAfter: { $ref: '#/components/schemas/RoomStatusCode' }
    HkTask:
      type: object
      required: [id, roomId, roomNo, type, status, dueDate, source, version]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        roomId: { $ref: '#/components/schemas/Uuid' }
        roomNo: { type: string }
        type: { $ref: '#/components/schemas/HkTaskType' }
        status: { $ref: '#/components/schemas/HkTaskStatus' }
        dueDate: { $ref: '#/components/schemas/LocalDate' }
        windowStart: { $ref: '#/components/schemas/LocalTime' }
        windowEnd: { $ref: '#/components/schemas/LocalTime' }
        notBeforeTime: { $ref: '#/components/schemas/LocalTime' }
        priorityRank: { type: integer }
        source: { type: string, enum: [system, manual, guest_app] }
        note: { type: string }
        refillItems:
          type: array
          items:
            type: object
            properties:
              itemId: { $ref: '#/components/schemas/Uuid' }
              itemName: { type: string }
              quantity: { type: integer }
        assignedUserId: { $ref: '#/components/schemas/Uuid' }
        doneAt: { $ref: '#/components/schemas/Instant' }
        version: { type: integer }

    # ── bảo trì ──
    WorkOrderCreate:
      type: object
      required: [roomId, title, description]
      properties:
        roomId: { $ref: '#/components/schemas/Uuid' }
        title: { type: string, maxLength: 120 }
        description: { type: string, minLength: 1, maxLength: 2000 }
        severity: { $ref: '#/components/schemas/Severity' }
        assigneeUserId: { $ref: '#/components/schemas/Uuid' }
        photoAttachmentIds: { type: array, items: { $ref: '#/components/schemas/Uuid' } }
        block:
          type: object
          description: 'Tùy chọn khóa phòng – tạo khối OOO (O1)'
          required: [startDate, endDatePlanned, reason]
          properties:
            startDate: { $ref: '#/components/schemas/LocalDate' }
            endDatePlanned: { $ref: '#/components/schemas/LocalDate' }
            reason: { type: string }
            affectedReservationsAcknowledged: { type: boolean, description: 'MGR+ xác nhận đã có phương án dời (O1)' }
    WorkOrder:
      type: object
      required: [id, code, roomId, title, severity, status, source, version]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        code: { type: string, example: WO-00034 }
        roomId: { $ref: '#/components/schemas/Uuid' }
        roomNo: { type: string }
        title: { type: string }
        description: { type: string }
        severity: { $ref: '#/components/schemas/Severity' }
        status: { $ref: '#/components/schemas/WorkOrderStatus' }
        source: { type: string, enum: [housekeeping, front_desk, maintenance, guest_app, system] }
        reportedBy: { type: string }
        assigneeName: { type: string }
        ackDueAt: { $ref: '#/components/schemas/Instant' }
        resolveDueAt: { $ref: '#/components/schemas/Instant' }
        isOverdue: { type: boolean }
        roomBlock: { $ref: '#/components/schemas/RoomBlock' }
        photoAttachmentIds: { type: array, items: { $ref: '#/components/schemas/Uuid' } }
        allowedActions: { type: array, items: { $ref: '#/components/schemas/AllowedAction' } }
        version: { type: integer }
    RoomBlockCreate:
      type: object
      required: [roomId, startDate, endDatePlanned, reason]
      properties:
        roomId: { $ref: '#/components/schemas/Uuid' }
        startDate: { $ref: '#/components/schemas/LocalDate' }
        endDatePlanned:
          $ref: '#/components/schemas/LocalDate'
          description: |
            **Nửa mở** – ngày **mở bán lại** (khối chiếm `[startDate, endDatePlanned)`, cùng cách tính khoảng lưu trú BR-002).
            UI hiển thị "khóa đến hết ngày X" = `endDatePlanned − 1`; mặc định = ngày sửa xong + 1 (decision-log DOM 15/10, QA #1).
        reason: { type: string, minLength: 3 }
        workOrderId: { $ref: '#/components/schemas/Uuid' }
        affectedReservationsAcknowledged: { type: boolean }
    RoomBlock:
      type: object
      required: [id, roomId, status, startDate, endDatePlanned, reason, version]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        roomId: { $ref: '#/components/schemas/Uuid' }
        roomNo: { type: string }
        status: { $ref: '#/components/schemas/RoomBlockStatus' }
        startDate: { $ref: '#/components/schemas/LocalDate' }
        endDatePlanned: { $ref: '#/components/schemas/LocalDate' }
        endDateActual: { type: [string, 'null'], format: date }
        reason: { type: string }
        workOrderId: { $ref: '#/components/schemas/Uuid' }
        version: { type: integer }

    # ── kho ──
    ItemInput:
      type: object
      required: [code, name, unit, minibarStandardQty]
      properties:
        code: { type: string }
        name: { type: object, properties: { vi: { type: string }, en: { type: string }, ru: { type: string } } }
        unit: { type: string }
        costPriceVnd: { $ref: '#/components/schemas/MoneyVnd' }
        salePriceVnd: { type: [integer, 'null'], format: int64, description: 'null = miễn phí (BR-701)' }
        minibarStandardQty: { type: integer, minimum: 0 }
        minStockQty: { type: integer, minimum: 0 }
        isActive: { type: boolean }
    Item:
      type: object
      required: [id, code, name, unit, minibarStandardQty, isFree, version]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        code: { type: string }
        name: { type: string }
        unit: { type: string }
        isFree: { type: boolean }
        salePriceVnd:
          type: [integer, 'null']
          format: int64
          x-visible-to: [owner, manager, front_desk_lead, front_desk, housekeeping]
        costPriceVnd:
          $ref: '#/components/schemas/MoneyVnd'
          x-visible-to: [owner, manager]
        minibarStandardQty: { type: integer }
        minStockQty: { type: integer }
        isActive: { type: boolean }
        version: { type: integer }

    # ── khách (CRM) ──
    GuestSummary:
      type: object
      required: [id, code, displayName]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        code: { type: string, example: KH-0012 }
        displayName: { type: string }
        nationalityCode: { type: string }
        phoneMasked:
          type: string
          example: 0905***456
          x-visible-to: [owner, manager, front_desk_lead, front_desk, sales_staff, collaborator]
        tags:
          type: array
          items: { type: string }
          x-visible-to: [owner, manager, front_desk_lead, front_desk, sales_staff]
    GuestInput:
      type: object
      required: [fullName]
      description: 'Phải có SĐT hoặc email (US-071 AC1). Không có trường số giấy tờ (US-071 AC3).'
      properties:
        fullName: { type: string, minLength: 1, maxLength: 120 }
        phone: { type: string }
        email: { type: string, format: email }
        messagingHandles: { type: object, additionalProperties: { type: string } }
        dateOfBirth: { $ref: '#/components/schemas/LocalDate' }
        gender: { type: string, enum: [male, female, other] }
        nationalityCode: { type: string }
        preferredLocale: { $ref: '#/components/schemas/Locale' }
        preferredContact: { type: string, enum: [phone, zalo, whatsapp, kakaotalk, email] }
        companyName: { type: string }
        taxCode: { type: string, pattern: '^[0-9]{10}(-?[0-9]{3})?$' }
        tags: { type: array, items: { type: string } }
        serviceNotes: { type: array, items: { type: string } }
        freeNote: { type: string, maxLength: 1000 }
    Guest:
      type: object
      required: [id, code, fullName, version]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        code: { type: string }
        fullName: { type: string }
        phone:
          type: string
          x-rbac-field: D02
          x-visible-to: [owner, manager, front_desk_lead, front_desk, sales_staff, collaborator]
        email:
          type: string
          x-rbac-field: D02
          x-visible-to: [owner, manager, front_desk_lead, front_desk, sales_staff, collaborator]
        messagingHandles:
          type: object
          additionalProperties: { type: string }
          x-rbac-field: D02
          x-visible-to: [owner, manager, front_desk_lead, front_desk, sales_staff, collaborator]
        dateOfBirth:
          $ref: '#/components/schemas/LocalDate'
          x-rbac-field: D01
          x-visible-to: [owner, manager, front_desk_lead, front_desk]
        nationalityCode: { type: string }
        isForeigner: { type: boolean }
        preferredLocale: { $ref: '#/components/schemas/Locale' }
        preferredContact: { type: string }
        companyName: { type: string, x-rbac-field: D16, x-visible-to: [owner, manager, front_desk_lead, front_desk] }
        taxCode: { type: string, x-rbac-field: D16, x-visible-to: [owner, manager, front_desk_lead, front_desk] }
        tags:
          type: array
          items: { type: string }
          x-rbac-field: D12a
          x-visible-to: [owner, manager, front_desk_lead, front_desk, sales_staff]
        serviceNotes:
          type: array
          items: { type: string }
          description: Từ danh mục (không văn bản tự do – tránh ghi thông tin sức khỏe)
          x-rbac-field: D12a
          x-visible-to: [owner, manager, front_desk_lead, front_desk, housekeeping]
        freeNote:
          type: string
          x-rbac-field: D12c
          x-visible-to: [owner, manager, front_desk_lead, front_desk]
        idDocLast4:
          type: string
          x-rbac-field: D03
          description: '4 số cuối giấy tờ (BR-610) – SAL/CTV không nhận trường này (rbac M1)'
          x-visible-to: [owner, manager, front_desk_lead, front_desk]
        crmConsent: { type: string, enum: [not_asked, granted, refused] }
        warnings:
          type: array
          x-rbac-field: D29
          x-visible-to: [owner, manager, front_desk_lead, front_desk]
          items:
            type: object
            properties:
              code: { type: string, enum: [possible_duplicate_name_dob] }
              guestId: { $ref: '#/components/schemas/Uuid' }
              guestCode: { type: string }
        version: { type: integer }

    # ── yêu cầu khách, tin nhắn ──
    GuestRequest:
      type: object
      required: [id, reservationId, roomNo, type, status, routedTo, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        reservationId: { $ref: '#/components/schemas/Uuid' }
        roomNo: { type: string }
        type: { $ref: '#/components/schemas/GuestRequestType' }
        note: { type: string }
        status: { $ref: '#/components/schemas/GuestRequestStatus' }
        routedTo: { type: string, enum: [housekeeping, maintenance, front_desk] }
        ackDueAt: { $ref: '#/components/schemas/Instant' }
        isAckOverdue: { type: boolean }
        hkTaskId: { $ref: '#/components/schemas/Uuid' }
        workOrderId: { $ref: '#/components/schemas/Uuid' }
        createdAt: { $ref: '#/components/schemas/Instant' }
    GuestRequestForGuest:
      type: object
      required: [id, type, status, statusLabel, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        type: { $ref: '#/components/schemas/GuestRequestType' }
        note: { type: string }
        status: { $ref: '#/components/schemas/GuestRequestStatus' }
        statusLabel: { type: string, description: 'Đã gửi · Đã nhận · Đang xử lý · Hoàn thành · Không thực hiện được (theo ngôn ngữ)' }
        autoReply: { type: string }
        declinedReason: { type: string }
        createdAt: { $ref: '#/components/schemas/Instant' }
        updatedAt: { $ref: '#/components/schemas/Instant' }
    MessageTemplate:
      type: object
      required: [code, locales]
      properties:
        code: { type: string, example: checkin_link }
        name: { type: string }
        locales: { type: array, items: { $ref: '#/components/schemas/Locale' } }
        channel: { type: string, enum: [manual_copy, email, zalo_zns] }
        containsC3:
          type: boolean
          description: 'Mẫu có biến C3 (hiện chỉ `door_code`) – chỉ render qua `renderDoorCodeMessage`; không trả trong `listMessageTemplates` cho `sales_staff`/`collaborator` (BUG-R1-SEC-01)'

    # ── app khách ──
    GuestSession:
      type: object
      required: [level, reservationCode, locale, expiresAt]
      properties:
        level: { type: integer, enum: [1, 2] }
        reservationCode: { type: string }
        stayEnded: { type: boolean, description: 'Đơn đã trả phòng – chỉ còn bill/thanh toán phát sinh (SR-GST-11)' }
        verification:
          type: object
          description: Cách lên mức 2 khả dụng (để guest-web hiện đúng nút)
          properties:
            emailOtpAvailable: { type: boolean, description: 'false khi đơn không có email hoặc email vừa đổi < 24 giờ (SR-GST-14)' }
            maskedEmail: { type: string }
            locked: { type: boolean, description: 'Token bị khóa xác minh – chỉ mã lễ tân tại quầy/điện thoại (SR-GST-08)' }
        guestFirstName: { type: string }
        roomNo: { type: [string, 'null'] }
        locale: { $ref: '#/components/schemas/Locale' }
        expiresAt: { $ref: '#/components/schemas/Instant' }
        level2ExpiresAt: { $ref: '#/components/schemas/Instant' }
    GuestStay:
      type: object
      required: [reservationCode, status, arrivalDate, departureDate, checkinTime, checkoutTime, property]
      properties:
        reservationCode: { type: string }
        status: { $ref: '#/components/schemas/ReservationStatus' }
        stayType: { type: string, enum: [short, long] }
        roomNo: { type: [string, 'null'] }
        arrivalDate: { $ref: '#/components/schemas/LocalDate' }
        departureDate: { $ref: '#/components/schemas/LocalDate' }
        checkinTime: { $ref: '#/components/schemas/LocalTime' }
        checkoutTime: { $ref: '#/components/schemas/LocalTime' }
        property:
          type: object
          properties:
            name: { type: string }
            address: { type: string }
            mapUrl: { type: string, format: uri }
            phone: { type: string }
        houseRules: { type: string, description: 'Nội quy + phí phạt theo tham số BR-511, theo ngôn ngữ' }
        guestFullName:
          type: string
          x-guest-level: 2
        wifi:
          type: [object, 'null']
          description: 'null trước ngày nhận phòng (US-108 AC2)'
          properties:
            ssid: { type: string }
            password: { type: string }
        doorCode:
          type: [object, 'null']
          description: 'Chỉ khi phiên mức 2 và trong khoảng hiệu lực và đơn confirmed/in_house (BR-403, US-128 AC1, SR-GST-10); không trả → hiện "sẽ hiện vào ngày nhận phòng". Mỗi lần trả ghi c3_access_log actor_type=guest'
          x-guest-level: 2
          properties:
            code: { type: string, x-classification: C3, x-rbac-field: D22 }
            validFrom: { $ref: '#/components/schemas/Instant' }
            validTo: { $ref: '#/components/schemas/Instant' }
        doorCodeAvailableFrom: { $ref: '#/components/schemas/Instant' }
        onlineCheckinAvailable: { type: boolean }
    OnlineCheckin:
      type: object
      required: [currentStep, requiredPeople, uploadedPeople]
      properties:
        currentStep: { type: string, enum: [documents, eta, consent, done] }
        requiredPeople: { type: integer }
        uploadedPeople: { type: array, items: { type: integer }, description: 'Chỉ số người đã tải giấy tờ – không trả lại ảnh/số' }
        etaTime: { $ref: '#/components/schemas/LocalTime' }
        consentRecorded: { type: boolean }
        completedAt: { $ref: '#/components/schemas/Instant' }
    GuestFolio:
      type: object
      required: [lines, totalVnd, paidVnd, balanceDueVnd]
      properties:
        lines:
          type: array
          description: 'Không có dòng nội bộ, giá vốn, ghi chú nhân viên (US-111 AC2)'
          items:
            type: object
            required: [description, amountVnd]
            properties:
              description: { type: string }
              serviceDate: { $ref: '#/components/schemas/LocalDate' }
              quantity: { type: number }
              amountVnd: { $ref: '#/components/schemas/MoneyVnd' }
        totalVnd: { $ref: '#/components/schemas/MoneyVnd' }
        paidVnd: { $ref: '#/components/schemas/MoneyVnd' }
        balanceDueVnd: { $ref: '#/components/schemas/MoneyVnd' }
        usdReference: { type: object, properties: { rate: { type: integer }, balanceDueUsd: { type: number } } }
        postCheckoutCharges:
          type: boolean
          description: 'Có phát sinh sau trả phòng chưa thanh toán (BR-427 – trong `post_checkout_charge_hours`, US-106 AC2)'
        vietqr:
          type: [object, 'null']
          description: Chuỗi VietQR cho số còn phải thu (null khi = 0 hoặc chưa cấu hình tài khoản nhận)
          properties:
            payload: { type: string }
            amountVnd: { $ref: '#/components/schemas/MoneyVnd' }
            transferNote: { type: string, example: OTM00171 }

