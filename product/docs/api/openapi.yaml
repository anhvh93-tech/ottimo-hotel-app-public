  /v1/properties/{propertyId}/reservations/{reservationId}/actions/early-departure:
    parameters:
      - $ref: '#/components/parameters/PropertyId'
      - $ref: '#/components/parameters/ReservationId'
    post:
      tags: [reservations]
      operationId: earlyDeparture
      summary: Trả sớm (B16) – đổi ngày đi, mở bán đêm còn lại, phần hoàn theo BR-428 qua yêu cầu duyệt
      x-roles: [owner, manager, front_desk_lead, front_desk]
      x-rbac: [A17]
      x-transition: B16
      x-stories: [US-137]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newDepartureDate, noticeGivenAt]
              properties:
                newDepartureDate: { $ref: '#/components/schemas/LocalDate' }
                noticeGivenAt: { $ref: '#/components/schemas/Instant' }
                otaRetainedVnd:
                  $ref: '#/components/schemas/MoneyVnd'
                  description: |
                    0.3.6 bổ sung 2 (BA v0.3, ARC 17/10) (E04-06, DOM S3-2): **đơn kênh OTA bắt buộc** (thiếu → 422 `REQUIRED`) – số OTA giữ lại theo extranet, server không tự tính; ghi dòng
                    `early_departure_fee`; tiền OTA thu hộ không vào luồng hoàn của OTTIMO. Đơn kênh khác gửi → 422 `NOT_ALLOWED`. > tiền OTA của các đêm bỏ → 422 `VALUE_OUT_OF_RANGE`
                noticeEvidence:
