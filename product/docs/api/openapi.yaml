      responses:
        '201':
          description: Đã ghi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Folio' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /v1/properties/{propertyId}/folios/{folioId}/lines/{lineId}/adjustments:
    parameters:
      - $ref: '#/components/parameters/PropertyId'
      - $ref: '#/components/parameters/FolioId'
      - $ref: '#/components/parameters/LineId'
    post:
      tags: [folio]
      operationId: adjustFolioLine
      summary: Sửa một dòng = bút toán đảo + dòng mới, lý do bắt buộc (BR-008). Folio `settled` chỉ MGR+ (A32, US-038 AC2).
      description: |
        **0.3.8 bổ sung 3 (ARC 24/10, FB-R3-ARC-FUZZ-01, BR-522 K11-06)**: trên folio `settled`, thao tác này để lại tiền dư chưa có yêu cầu hoàn (`unhandledCreditVnd` > 0) → server tạo **một** yêu cầu hoàn `overpayment` bằng phần chưa yêu cầu (người xin = người thao tác; người duyệt MGR+ khác người xin – SEC F8) và mở "Cần chú ý" `closed_reservation_credit`, **cùng giao dịch**; yêu cầu hoàn đang mở lớn hơn tiền dư → chạy lại `refundPlan` (hủy `superseded` + tạo lại, DOM-S4-14). Không đổi hình dạng phản hồi.
        **0.3.6 bổ sung (review S3, ARC 17/10)**: `If-Match` = `Folio.version` (ETag của `getFolio`/`addFolioLine`; mọi thay đổi dòng của folio tăng version – BE-B decision 16/10; **0.3.7 bổ sung 4 (N-6)**: và mọi thay đổi giao dịch thu/hoàn – xem `Folio.version`).
        Dòng **sinh từ đêm lưu trú** (`room`, `extra_person`) sửa giá phải ghi lại giá đêm ở đơn (cùng giao dịch) để lần đồng bộ đêm sau (gia hạn, đổi phòng, đổi số người)
        **giữ** giá đã sửa và các dòng FOC/giảm giá đi kèm – không bao giờ tự đảo giá đã sửa (thẻ FB-R2-ARC-BE-S3-14).
        **0.3.7 bổ sung D1 – cách cài S4-35 (CỔNG; ARC chốt, thay "Done (tạm)" của ARC-BE-S3-14)**: bỏ chặn tạm 422 `NOT_ALLOWED` cho dòng `room`/`extra_person` của đơn
        `hold`/`confirmed`/`in_house`. Sửa giá dòng đêm = BE-B gọi cổng nội bộ **`StayNightPricingPort.setNightRate`** (module reservations, BE-A) trong **cùng giao dịch**, thứ tự khóa
        đơn → folio. Dòng `room`: `newUnitPriceVnd` = **giá đêm trước bậc giảm** (như giá lễ tân nhập lúc đặt – BR-429 (g) v0.3.6: giá sửa tay là giá lịch của đêm, bậc BR-107/BR-111 áp
        trên đó); cổng ghi `stay_night.calendar_rate_vnd` của đúng ngày (cột đã có – không thêm cột), tính lại dòng = làm tròn 1.000(giá × (1 − bậc hiện hành)), rồi BE-B đảo + ghi dòng mới.
        Dòng `extra_person`: `newUnitPriceVnd` = phụ thu đêm đó (không bậc giảm). FOC/giảm giá đã duyệt của khóa tính lại theo BR-434 (S4-23). Đồng bộ đêm sau (đổi ngày giữ căn, đổi căn do
        OTTIMO, bậc BR-107, sửa số khách) **giữ** giá đã sửa; B7/B14 khách tự xin đổi căn lấy lịch giá căn mới (BR-429 (a), (g) – `MovePreview.warnings` `MANUAL_RATE_REPRICED`, NÊN).
        Dòng đêm chỉ nhận `newUnitPriceVnd` (`newQuantity`/`voidLine` → 422 `NOT_ALLOWED` – bỏ đêm đi B7/B8/B16); giá ngoài sàn–trần BR-105 của nhóm căn → 422 `RATE_OUT_OF_RANGE`
        (thấp hơn sàn đi giảm giá đặc biệt có duyệt). Folio `settled`: bút toán sau chốt (MGR+, A32) không gọi cổng. Audit `folio_line.adjusted` (đã có).
        **0.3.7 bổ sung 4 (BUG-R2-201, ARC 16.28 – DOM đồng ý 18/10, SM-13 v0.2.6)**: folio **`closed`** (hết cửa sổ 24 giờ, phiếu đã cấp, mọi khoản còn nợ đã thành công nợ – BR-427 (d)) **không** điều chỉnh
        dòng → 409 `FOLIO_LOCKED` cho mọi vai. Sau khi đóng chỉ còn: thu công nợ (`recordPayment`, 16.26), xóa nợ (`requestFoc` `reasonCode = debt_write_off`) và đảo khoản thu
        (`reversePayment` G-4 – ARC 16.31, N-13). Điều chỉnh sau đóng (kèm hóa đơn điều chỉnh) để R3 cùng hóa đơn điện tử. Folio `settled` trong cửa sổ: giữ như trên (MGR+, A32).
        **N-15 (ARC 16.31; cài cùng BUG-R2-208)**: folio `settled` đã quá `post_checkout_window_until` (J15 chạy mỗi giờ, chưa kịp đóng) được coi như `closed` → 409 `FOLIO_LOCKED`.
        **0.3.7 bổ sung 4 (N-7 – DOM + SEC 18/10, BR-525, FB-R2-SEC-BE-81; ARC 16.30; điều kiện theo số – BUG-R2-208, ARC 16.31)**: folio `settled` trong cửa sổ, `openDebtVnd` = **công nợ
        đang mở theo số** (BR-525 (ii): số đã ghi nợ của chu kỳ − phần đã thu/xóa từ lúc mở, kẹp [0, còn phải thu]); khoản trong cửa sổ = còn phải thu − `openDebtVnd`. Điều chỉnh **giảm**
        (`voidLine`, giảm `newQuantity`, giảm `newUnitPriceVnd`; phần giảm = tiền dòng trước − sau) được khi **phần giảm ≤ còn phải thu − `openDebtVnd`** (chỉ chạm khoản trong cửa sổ,
        sau khi giảm còn phải thu vẫn ≥ công nợ đang mở); vượt → 409 `FOLIO_LOCKED` (kèm `detail`) cho **mọi vai, kể cả OWN**, không ghi gì – phần nợ chỉ giảm qua `requestFoc`
        `reasonCode = debt_write_off` (hạn mức BR-433, báo cáo FOC). `openDebtVnd` = 0 → như đơn không công nợ (A32 như trên; giảm sinh dư thừa → hoàn tiền có duyệt BR-522). Điều chỉnh
        **tăng** vẫn 201 (thành khoản trong cửa sổ, J15 mới chuyển thành công nợ). Cùng trạng thái tiền cho cùng kết quả, không phụ thuộc thứ tự thao tác. Ví dụ (BR-525 lần 8): đảo 100.000,
        minibar 70.000, FD thu 100.000 → void minibar **201**; FD chỉ thu 50.000 → void minibar 70.000 **201**, giảm thêm bất kỳ → **409**; công nợ 4.400.000, A32 tăng 10.000 × 9 → giảm 90.000
        **201**, giảm 90.001 → **409**. **Cài đặt**: mã R2 hiện chặn mọi giảm khi chu kỳ công nợ chưa đóng (kể cả khi `openDebtVnd` = 0); điều kiện theo số cài **sau** BUG-R2-207 và BUG-R2-210
        (hoặc điều kiện OPS của 210), có SEC review. Desk: 409 này → chỉ sang "Xóa công nợ". Thứ tự khóa (ARC 16.19, 16.30): L1 **mọi đơn của folio** `FOR NO KEY UPDATE` theo `id`
        → L3 folio, lấy **trước** cổng `setNightRate` của dòng đêm; công nợ và giờ cửa sổ đọc dưới L3.
      x-roles: [owner, manager, front_desk_lead, front_desk]
      x-rbac: [A31, A32]
      x-stories: [US-006, US-038]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                newQuantity: { type: number, minimum: 0 }
                newUnitPriceVnd: { $ref: '#/components/schemas/MoneyVnd' }
                voidLine: { type: boolean, default: false }
                reason: { type: string, minLength: 3, maxLength: 500 }
            example: { newUnitPriceVnd: 150000, reason: 'Khách trả 14:00 không phải 15:00' }
      responses:
        '201':
          description: Đã ghi bút toán
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Folio' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/properties/{propertyId}/folios/{folioId}/lines/{lineId}/foc:
    parameters:
      - $ref: '#/components/parameters/PropertyId'
      - $ref: '#/components/parameters/FolioId'
      - $ref: '#/components/parameters/LineId'
    post:
      tags: [folio, approvals]
      operationId: requestFoc
      summary: Gửi FOC / giảm giá đặc biệt cho một dòng (A35) – tạo yêu cầu duyệt; dòng FOC âm ở trạng thái chờ duyệt (US-007 AC1)
      description: |
        Người gửi **không** chọn người duyệt (BR-432). MGR/OWN gửi → tự áp (A2). FD với FOC minibar trong hạn mức vai FD → tự áp
        (chờ DOM trả lời SQ-3; tham số `foc_limits`).
        **0.3.6 bổ sung 4 (DOM luật OTA 17/10, ARC) (BR-307 v0.3.4)**: không FOC / giảm giá đặc biệt trên dòng `room` của đơn `paymentModel = ota_prepaid` → 422 `FOC_NOT_ALLOWED_OTA_PREPAID`
        (`field` = `kind`). Bù sự cố cho khách OTA trả trước bằng FOC trên khoản phát sinh, đêm bù, hoặc hoàn tiền thật (`createRefundRequest`, BR-522).
        Đơn `ota_pay_at_property`: FOC như kênh Trực tiếp. "Đã thu qua OTA" (`ota_collect`) = tổng dòng tiền phòng OTA **trước** FOC, đồng bộ cùng giao dịch mỗi lần ghi/sửa/đảo dòng.
        **0.3.7 bổ sung 4 – xóa công nợ sau trả phòng (R7LOCK-02, DOM 18/10 BR-525; ARC 16.27)**: folio `settled`/`closed` mặc định → 409 `FOLIO_LOCKED`. **Ngoại lệ duy nhất**: đơn có
        **công nợ mở** và `reasonCode = debt_write_off` – chỉ `kind = foc` (khác → 422 `NOT_ALLOWED`), chỉ **OWN/MGR** (FD/FDL → 403 `FORBIDDEN_ACTION`), `note` bắt buộc (≥ 3 – thiếu 422
        `REASON_REQUIRED`); số ≤ min(giá trị còn lại của dòng sau FOC khác, còn phải thu) – vượt → 422 `AMOUNT_EXCEEDS_BALANCE` (`max`); hạn mức BR-433: MGR tự áp tới giá 1 đêm
        (`nightRateBasis`), vượt → yêu cầu chờ **OWN** duyệt (luồng duyệt thường). Dòng FOC ghi là bút toán sau chốt (folio và hóa đơn đã xuất giữ nguyên). Áp xong còn phải thu về 0 → công nợ
        đóng (`debt_settled_at`, lý do `written_off`), "Cần chú ý" `checkout_debt` tự hết. Báo cáo FOC tách riêng mã `debt_write_off`. Hoa hồng (BR-903): FOC `debt_write_off` trên dòng
        **tiền phòng** trừ vào cơ sở hoa hồng, "đạt" lúc xóa nợ (CTV 8 %, xóa 100.000 → 408.400 thay 416.400); trên minibar/hư hỏng/phụ thu không đổi cơ sở. Thứ tự khóa như FOC (16.19).
        **Vòng sửa 8 (FB-R2-SEC-BE-80 Blocker, DOM 18/10 BR-525; ARC 16.30) – trần thay câu "còn phải thu" ở trên**: lúc gửi, số ≤ min(giá trị còn lại của dòng, **công nợ đang mở**
        − Σ `amountVnd` của các yêu cầu `debt_write_off` đang `pending`/`escalated` trên folio) – vượt → 422 `AMOUNT_EXCEEDS_BALANCE` kèm `max` (có thể **0** khi các yêu cầu đang chờ đã phủ hết
        nợ). Công nợ đang mở = phần nợ đã ghi (B18, đảo khoản thu G-4, J15) chưa thu/xóa; khoản phát sinh còn trong cửa sổ 24 giờ **không** phải công nợ nên không xóa được; hết cửa sổ
        (folio `closed`) = toàn bộ còn phải thu. Lúc duyệt (`approveRequest`): chỉ áp min(số đã duyệt, công nợ đang mở lúc duyệt), số này giữ **cố định** cho mọi lần đồng bộ sau;
        công nợ đã về 0 → yêu cầu tự hủy `autoCancelReason = debt_cleared` (không ghi dòng FOC). Folio không bao giờ có dư thừa vì xóa nợ.
        **ARC 16.31 (BR-525 lần 8 – "công nợ đang mở luôn theo số")**: "đơn có công nợ mở" ở ngoại lệ trên = `openDebtVnd` > 0, không phải "chu kỳ công nợ chưa đóng". `openDebtVnd` = 0 (đã
        thu/xóa hết, chỉ còn khoản trong cửa sổ) → 409 `FOLIO_LOCKED` như folio không công nợ; mã R2 hiện trả 422 `AMOUNT_EXCEEDS_BALANCE` `max` 0 – đổi cùng đợt BUG-R2-208 (một hàm công nợ).
        Khoản thu trên folio có công nợ trả **công nợ trước** (G-6), nên khách trả qua link cho khoản trong cửa sổ cũng làm `openDebtVnd` giảm.
      x-roles: [owner, manager, front_desk_lead, front_desk]
      x-rbac: [A35]
      x-transition: [A1, A2]
      x-stories: [US-007, US-026, US-029]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FocRequestInput' }
            example: { kind: foc, amountVnd: 210000, reasonCode: regular_vip, note: Khách quen lần thứ 4 }
      responses:
        '201':
          description: Yêu cầu đã tạo (hoặc đã tự áp)
