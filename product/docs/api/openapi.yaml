  /v1/properties/{propertyId}/reservations/{reservationId}/actions/move:
    parameters:
      - $ref: '#/components/parameters/PropertyId'
      - $ref: '#/components/parameters/ReservationId'
    post:
      tags: [reservations]
      operationId: moveReservation
      summary: Đổi căn / đổi ngày đơn chưa nhận phòng (B7) hoặc dời ngày thay vì hủy (B8, MGR+). Dùng để gán căn cho đơn OTA xung đột.
      description: |
        **0.3.7 (ESC-019 A, S4-21; BR-429 v0.3.5 (d))**: giá theo `reasonCode` như `previewMoveReservation` (khách tự xin đổi căn → giá căn mới; OTTIMO đổi và `other` → giữ giá;
        `other` sang căn giá cao hơn chỉ FDL+). Khi `reasonCode = guest_request` có đổi căn: **bắt buộc** `applyDifference = true` ("Đã báo khách số tiền mới") + `expectedDeltaVnd`
        (= `MovePreview.folioDeltaVnd`, kể cả 0) – thiếu → 422 `REQUIRED` (`field` = `applyDifference`); server tính lại lúc ghi, lệch → 409 `SURCHARGE_CHANGED`
        (`surchargeVnd` = chênh mới) – client xem trước lại rồi hỏi lại khách (BR-414).
        Cùng giao dịch: ghi lại dòng `room`/`extra_person` (đảo + ghi, BR-008), `room_change_difference` (OTA), FOC đi theo (BR-434), đồng bộ hoa hồng; audit `money`
        `reservation.room_change_repriced` (đã có trong tập đóng) kèm `reasonCode`. Lý do do OTTIMO: không đổi giá, `applyDifference` bỏ qua.
        **0.3.7 bổ sung D1**: số tiền do **cùng hàm tính** với `previewMoveReservation` (xem mô tả operation đó – critic #10). `reasonCode = inventory_optimize` khi
        `Reservation.roomDisclosedToGuest = true` → 422 `NOT_IN_LIST` (`field` = `reasonCode`, BR-429/BR-012 (4)); `guest_request` sang căn khác → đặt `roomDisclosedToGuest = true`.
        **0.3.7 bổ sung 3 (DOM-S4-06, BR-429-12 v0.3.8 – trả lời BA E02-10; server BE-A và Desk FE-A đã làm theo)** – thay câu "chỉ khi `guest_request` có đổi căn" ở trên:
        mọi B7/B8 có `folioDeltaVnd` ≠ 0 (**mọi** `reasonCode` – đổi ngày, thêm/bớt đêm, phụ thu người, chênh lệch OTA…) **bắt buộc** `applyDifference = true` + `expectedDeltaVnd`, như B14
        (`changeRoom.applyDifference`); khách tự xin đổi căn (`guest_request` có đổi căn) bắt buộc **kể cả** `folioDeltaVnd = 0`, **trừ** đơn hợp đồng giấy (`externalContract = true` –
        BR-429 (h)). Thiếu → 422 `REQUIRED` (`field` = `applyDifference`); lệch → 409 `SURCHARGE_CHANGED`. Câu "Lý do do OTTIMO: không đổi giá, `applyDifference` bỏ qua" chỉ còn đúng khi
        `folioDeltaVnd = 0`. **DOM-S4-19 (BE-A đang làm)**: `expectedDeltaVnd` có trong thân thì luôn được so – lệch → 409 `SURCHARGE_CHANGED`, kể cả khi không bắt buộc.
      x-roles: [owner, manager, front_desk_lead, front_desk]
      x-rbac: [A07, A08]
      x-transition: [B7, B8]
      x-stories: [US-024, US-018, US-061, US-139]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reasonCode]
              properties:
                roomId: { $ref: '#/components/schemas/Uuid' }
                arrivalDate: { $ref: '#/components/schemas/LocalDate' }
                departureDate: { $ref: '#/components/schemas/LocalDate' }
                mode: { type: string, enum: [change, postpone_instead_of_cancel], default: change }
                reasonCode: { $ref: '#/components/schemas/MoveReasonCode' }
                note: { type: string, maxLength: 500, description: 'Bắt buộc ≥ 3 ký tự khi `reasonCode` = `other` hoặc `force_majeure` (`REASON_REQUIRED`). 0.3.5' }
                capacityWarningAckReason:
                  type: string
                  minLength: 3
                  maxLength: 500
                  description: 'Như `ReservationCreate.capacityWarningAckReason` – đổi căn đơn OTA sang căn có sức chứa nhỏ hơn số khách (DOM D-1). 0.3.5'
                  x-rbac-field: D12c
                overbookingResolution:
                  type: string
                  enum: [reassigned_same_group, upgraded]
                  description: Bắt buộc khi đơn đang `conflictState=open`
                visaWarningAckReason:
                  type: string
                  minLength: 3
                  maxLength: 500
                  description: 'Đổi ngày đi vượt hạn thị thực/tạm trú của khách NN đã có giấy tờ → thiếu lý do: 422 cảnh báo `VISA_EXPIRES_BEFORE_DEPARTURE` (US-050 AC2; 0.3.3, E04-01)'
                applyDifference:
                  type: boolean
                  default: false
                  description: '0.3.7 (ESC-019 A, BR-429 (d)): ô "Đã báo khách số tiền mới" (BR-414). **0.3.7 bổ sung 3 (DOM-S4-06, BR-429-12)**: bắt buộc `true` khi `folioDeltaVnd` ≠ 0 với mọi lý do, và khi `reasonCode = guest_request` có đổi căn kể cả chênh 0 – trừ đơn hợp đồng giấy (BR-429 (h))'
                expectedDeltaVnd:
                  $ref: '#/components/schemas/MoneyVnd'
                  description: '0.3.7 – = `MovePreview.folioDeltaVnd` client đã hiển thị (có thể âm); lệch → 409 `SURCHARGE_CHANGED`. Bắt buộc cùng điều kiện với `applyDifference` (0.3.7 bổ sung 3, DOM-S4-06). **DOM-S4-19 (BE-A đang làm)**: đã gửi thì **luôn** phải khớp, kể cả khi không bắt buộc tick – lệch → 409 `SURCHARGE_CHANGED`'
      responses:
        '200': { $ref: '#/components/responses/ReservationOk' }
        '409': { $ref: '#/components/responses/RoomUnavailable' }
        '412': { $ref: '#/components/responses/VersionConflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /v1/properties/{propertyId}/reservations/{reservationId}/actions/mark-no-show:
    parameters:
      - $ref: '#/components/parameters/PropertyId'
      - $ref: '#/components/parameters/ReservationId'
    post:
      tags: [reservations]
      operationId: markNoShow
      summary: Đánh dấu không đến (B11) – không tự động (BR-311); chỉ sau mốc `no_show_mark_time` và khi đã ghi kết quả liên lạc (US-136 AC2, AC3)
      description: |
        **Một bước** (0.3.5, A-04): kết quả liên lạc (`contactAttemptNote`) ghi cùng lệnh đánh dấu, lưu `reservation.no_show_contact_note` + `state_transition.note` (xem `getReservationHistory`);
        R2 không có operation ghi lần gọi riêng. "Đã ghi kết quả liên lạc" (US-136 AC2/AC3) = ô bắt buộc trong hộp xác nhận.
        Thứ tự kiểm: body (`contactAttemptNote` thiếu/< 3 ký tự → `422 VALIDATION_FAILED`, `errors[{field: contactAttemptNote, code: REASON_REQUIRED}]`)
        → `If-Match` → trạng thái `confirmed` và giờ server ≥ `noShowAvailableFrom` (khác → `409 INVALID_TRANSITION` kèm `currentState`, `availableFrom`).
        0.3.6 (B-13): thu hồi mọi link/phiên khách của đơn trong cùng giao dịch; `restoreNoShow` **không** mở lại – lễ tân cấp link mới.
        **0.3.7 bổ sung D1** – cùng giao dịch: (1) S4-08 (BR-309 áp cả no-show): mọi dòng dịch vụ tự đảo trừ `retainLines` (Desk lấy danh sách dòng từ `getFolio`, không có tính thử);
        (2) S4-22 (BR-315 (g)): FOC/giảm giá đã duyệt của đêm bị hủy **tạm dừng** (`focState = suspended`, audit `folio.foc_suspended`), yêu cầu chờ duyệt tự hủy (`approval_cancelled`);
        (3) S4-06 (BR-522): số dư thừa sau phí no-show → yêu cầu hoàn tự tạo + "Cần chú ý" `closed_reservation_credit`; (4) US-136 AC2: đơn kênh `ota` → mục "Cần chú ý"
        `ota_no_show_report` (`params.action = report`); (5) US-136 AC4: thông báo `no_show_marked` cho OWN + MGR.
      x-roles: [owner, manager, front_desk_lead, front_desk]
      x-rbac: [A09]
      x-transition: B11
      x-stories: [US-136, US-021]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contactAttemptNote]
              properties:
                contactAttemptNote: { type: string, minLength: 3, maxLength: 500 }
                retainLines:
                  type: array
                  maxItems: 50
                  description: '0.3.7 bổ sung D1 (S4-08, BR-309): như `cancelReservation.retainLines` – dòng dịch vụ giữ (đã phát sinh chi phí, ví dụ xe đã đón); `lineId` không phải dòng dịch vụ sống → 422 `NOT_IN_LIST`'
                  items:
                    type: object
                    required: [lineId, reason]
                    properties:
                      lineId: { $ref: '#/components/schemas/Uuid' }
                      reason: { type: string, maxLength: 500 }
