  /v1/properties/{propertyId}/reservations/{reservationId}/actions/late-checkout:
    parameters:
      - $ref: '#/components/parameters/PropertyId'
      - $ref: '#/components/parameters/ReservationId'
    post:
      tags: [reservations]
      operationId: setLateCheckout
      summary: Đặt trả muộn (B15) – tính phụ thu theo bậc, cảnh báo khách đến cùng ngày (US-029; BR-412, 416)
      description: |
        `dryRun=true` trả phụ thu + cảnh báo (tên khách đến, giờ đến dự kiến – US-029 AC2) mà không lưu.
        **0.3.6 (SEC A3 [CHẶN])**: đường `dryRun=true` chạy trong giao dịch `readOnly` (`read()`), không qua `uow.run` – không ghi `folio_line`,
        `reservation_change`, `audit_event`, `approval_request`, không tiêu `Idempotency-Key` (như `cancelReservation`).
        Có khách đến cùng ngày và không có căn thay thế → `409 LATE_CHECKOUT_CONFLICT`, trừ MGR+ (hoặc tạo yêu cầu duyệt `late_checkout_conflict`).
        Sau mốc 100% BR-416 → trả lỗi gợi ý dùng gia hạn.
      x-roles: [owner, manager, front_desk_lead, front_desk]
      x-rbac: [A16]
      x-transition: B15
      x-stories: [US-029, US-027]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [checkoutTime]
              properties:
                checkoutTime: { $ref: '#/components/schemas/LocalTime', description: 'Sau mốc cuối `late_checkout_tiers` → 422 mã trường `LATE_CHECKOUT_AFTER_LIMIT` (dry-run trả `treatAsExtension=true` thay vì lỗi) (0.3.3, E04-02)' }
                applySurcharge:
                  type: boolean
                  default: false
                  description: '**0.3.3 đổi mặc định `true → false`** (BR-414: lễ tân phải xác nhận số tiền). Client luôn gửi tường minh'
                expectedSurchargeVnd:
                  $ref: '#/components/schemas/MoneyVnd'
                  description: 'Bắt buộc khi `applySurcharge=true` và `dryRun=false`; lệch số server tính → `409 SURCHARGE_CHANGED` (0.3.3, E03-02)'
                requestFocForSurcharge: { $ref: '#/components/schemas/FocRequestInput' }
                requestApproval:
                  type: boolean
                  default: false
                  description: 'FD gặp `LATE_CHECKOUT_CONFLICT` → gửi lại với `true` để tạo yêu cầu `late_checkout_conflict` cho MGR+ (A16 = D) → 202 (0.3.3, E04-02)'
                dryRun: { type: boolean, default: false }
            example: { checkoutTime: '15:00', applySurcharge: true, expectedSurchargeVnd: 410000, dryRun: false }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LateCheckoutResult' }
        '202':
          description: 'Đã tạo yêu cầu duyệt `late_checkout_conflict` (FD, `requestApproval=true`) – chưa lưu giờ trả muộn'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApprovalRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/VersionConflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /v1/properties/{propertyId}/reservations/{reservationId}/actions/change-room:
    parameters:
      - $ref: '#/components/parameters/PropertyId'
      - $ref: '#/components/parameters/ReservationId'
    post:
      tags: [reservations]
      operationId: changeRoom
      summary: Đổi phòng khi đang ở (B14) – lý do bắt buộc, giá theo BR-424; dùng khi dời khách do xung đột OTA
      x-roles: [owner, manager, front_desk_lead, front_desk]
      x-rbac: [A15]
      x-transition: B14
      x-stories: [US-024]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newRoomId, effectiveDate, cause, reason]
              properties:
                newRoomId: { $ref: '#/components/schemas/Uuid' }
                effectiveDate: { $ref: '#/components/schemas/LocalDate', description: 'Ngày nghiệp vụ hôm nay … ngày đi − 1; đêm từ ngày này dùng căn mới (0.3.6 làm rõ). **0.3.6 bổ sung (review S3, ARC 17/10)**: R2 chỉ nhận **ngày nghiệp vụ hôm nay** (khác → 422 `DATE_INVALID`, `field` = `effectiveDate`) vì trạng thái buồng, việc dọn và giao lại mã/thẻ áp ngay lúc ghi; đổi phòng hẹn ngày sau dời R3' }
                cause: { type: string, enum: [property_fault, guest_request], description: '`property_fault` → giữ giá cũ (nâng hạng miễn phí); `guest_request` → giá căn mới từ đêm đổi (BR-424). Giá căn mới xem trước bằng `searchAvailability?reservationId=`. **0.3.6 (A-37)**: số khách > `maxOccupancy` căn mới → **chặn cứng** 422 `CAPACITY_EXCEEDED` (`field` = `newRoomId`) mọi kênh – không có lý do bỏ qua (khách đang ở là người thật)' }
                reason: { type: string, minLength: 3, maxLength: 500 }
                workOrderId: { $ref: '#/components/schemas/Uuid', description: 'Phiếu sửa gây đổi phòng (`cause=property_fault`, EP07-08 6.4) – sai/khác căn cũ → 422 `NOT_IN_LIST` (0.3.6, E04-05)' }
                oldRoomVacated:
                  type: boolean
                  default: true
                  description: '`true` "Khách đã chuyển xong" → căn cũ `VD`; `false` "Chuyển sau" (còn để đồ) → `OD`; cả hai tạo việc dọn (0.3.6, E04-05)'
                applyDifference:
                  type: boolean
                  default: false
                  description: 'Xác nhận ghi chênh lệch đúng `preview.folioDeltaVnd` (BR-414); bắt buộc `true` khi chênh ≠ 0, kèm `expectedDeltaVnd` (lệch → 409 `SURCHARGE_CHANGED`) – 0.3.6'
                expectedDeltaVnd: { $ref: '#/components/schemas/MoneyVnd' }
                stayScope:
                  type: string
                  enum: [whole_stay, until_parent_departure]
                  default: whole_stay
                  description: |
                    0.3.7 (S4-09; DOM 17/10 BR-424 bổ sung – lượt có đơn con gia hạn). `whole_stay` (như 0.3.6): mọi đêm từ `effectiveDate` của đơn gốc **và** đơn con `in_house` sang căn mới;
                    căn mới không trống tới ngày đi hiệu lực → 409 `ROOM_UNAVAILABLE` (đêm vướng + gợi ý căn) kèm `parentOnlyAvailable = true` khi căn mới trống tới hết đơn gốc.
                    `until_parent_departure` ("Khách đồng ý – chỉ chuyển tới hết đơn gốc"): chỉ đêm của **đơn gốc** sang căn mới; đêm của đơn con **giữ căn cũ** – khách về lại căn cũ
                    đêm đầu của đơn con (`ChangeRoomPreview.returnToRoomDate`). Chọn giá trị này = lễ tân xác nhận khách đồng ý (`reason` ghi lời khách). Lượt không có đơn con → 422
                    `NOT_ALLOWED`. Cùng giao dịch: giá đêm đơn con không đổi; audit ghi `stayScope`; **không** sinh sẵn việc dọn (BR-424 v0.3.6 – DOM 17/10, thay giả định ARC).
                    Ngày về (`returnToRoomDate`): căn cũ là căn **có khách đến** – J8 07:00 xử lý như căn đón khách (`VC`/`VI` → không sinh việc; chưa sạch → việc dọn hạng "khách đến" hạn
                    `checkout_time`, không có việc mở thì `priority_clean`); căn mới là căn **có khách đi** nhưng J8 **không** chuyển sang `VD` lúc 07:00 – trạng thái đổi khi lễ tân ghi khách đã
                    chuyển về bằng `updateReservation.roomReturnRecorded = true` trên đơn con (0.3.7 bổ sung D1, cách ghi ARC chọn) → căn mới `VD` + `checkout_clean`. Không phụ thu trả muộn;
                    quên ghi → "Cần chú ý" `room_status_mismatch` (BR-806). Oracle BR-424-05.
                dryRun:
                  type: boolean
                  default: false
                  description: |
                    Trả `ChangeRoomPreview`, không ghi (giao dịch readOnly – SEC A3), không cần `Idempotency-Key`/`If-Match` (0.3.6, E04-05).
                    **0.3.7 bổ sung D1 (S4-04 – cùng S4-21, BE-A)**: `dryRun` và lệnh thật gọi **cùng một hàm tính** như `previewMoveReservation`/`moveReservation` – FOC đi theo = min(số đã duyệt,
                    giá mới) kể cả khi FOC > giá mới, FOC chờ duyệt không vào `folioDeltaVnd`; `expectedDeltaVnd` lấy từ `ChangeRoomPreview.folioDeltaVnd` không lệch khi dữ liệu không đổi.
      responses:
        '200':
          description: |
            Đơn sau khi đổi (`dryRun=false`) – căn mới `OC`, `doorAccessHandedOver` đặt lại `false` (R2: nhắc thu thẻ cũ, giao thẻ căn mới), hoặc
            `ChangeRoomPreview` (`dryRun=true`)
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: '#/components/schemas/Reservation' }
                  - { $ref: '#/components/schemas/ChangeRoomPreview' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '409':
          description: |
            ROOM_UNAVAILABLE / ROOM_BLOCKED (kèm `conflicts[]`, `suggestions[]`) hoặc **ROOM_NOT_READY** (0.3.1) – căn mới chưa `VI`/`VC`
            (BR-803, US-024 AC4), kèm `roomStatus`. Đơn có `extraGuestCount > 0` → sinh việc `extra_guest_kit_transfer` trong cùng giao dịch (BR-812 (4)).
            **0.3.7 (S4-09)**: `ROOM_UNAVAILABLE` do đêm của đơn con kèm `parentOnlyAvailable: true` khi căn mới trống tới hết đơn gốc – client hỏi khách rồi gửi lại
            (cả `dryRun`) với `stayScope = until_parent_departure`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              examples:
                notReady: { value: { type: /problems/room-not-ready, title: Căn chưa sẵn sàng, status: 409, code: ROOM_NOT_READY, roomStatus: VD } }
                unavailable: { value: { type: /problems/room-unavailable, title: Căn vừa được đặt, status: 409, code: ROOM_UNAVAILABLE } }
  /v1/properties/{propertyId}/reservations/{reservationId}/actions/assign-room:
    parameters:
      - $ref: '#/components/parameters/PropertyId'
      - $ref: '#/components/parameters/ReservationId'
    post:
      tags: [reservations]
      operationId: assignRoom
      summary: Gán căn cho đơn OTA xung đột chưa gán (B7a – US-139, US-018 AC5)
