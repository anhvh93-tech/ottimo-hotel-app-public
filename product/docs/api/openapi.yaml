    Commission:
      type: object
      required: [id, payeeType, status, amountVnd]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        reservationCode: { type: string }
        leaseContractCode: { type: string }
        payeeType: { type: string, enum: [agent, staff] }
        payeeName: { type: string, x-visible-to: [owner, manager] }
        ratePctSnapshot: { $ref: '#/components/schemas/Percent' }
        baseAmountVnd: { $ref: '#/components/schemas/MoneyVnd' }
        amountVnd: { $ref: '#/components/schemas/MoneyVnd' }
        status: { $ref: '#/components/schemas/CommissionStatus' }
        recognizedAt: { $ref: '#/components/schemas/Instant' }
        payouts:
          type: array
          items:
            type: object
            properties:
              id: { $ref: '#/components/schemas/Uuid' }
              trancheNo: { type: integer }
              dueDate: { $ref: '#/components/schemas/LocalDate' }
              amountVnd: { $ref: '#/components/schemas/MoneyVnd' }
              paidAt: { $ref: '#/components/schemas/Instant' }
        version: { type: integer }

    # ── public-site + yêu cầu đặt phòng từ website (0.3.7 bổ sung 2 – US-155, ADR-014 mục 4; phương án B = contract-ahead) ──
    PublicFormToken:
      type: object
      required: [token, notBefore, expiresAt]
      description: '0.3.7 bổ sung 2 – mã form có chữ ký dùng một lần (ADR-014 4.4). Trang giữ trong bộ nhớ, không lưu trình duyệt'
      properties:
        token: { type: string, minLength: 20, maxLength: 300 }
        notBefore: { $ref: '#/components/schemas/Instant' }
        expiresAt: { $ref: '#/components/schemas/Instant' }
    WebsiteUtm:
      type: object
      additionalProperties: false
      description: |
        0.3.7 bổ sung 2. Trang đọc `utm_source`/`utm_medium`/`utm_campaign` của **chính URL trang đặt phòng** (link nội bộ của landing giữ nguyên query UTM – không cookie,
        không localStorage); đổi chữ thường, ký tự ngoài `[a-z0-9._-]` → `-`, cắt 64 ký tự, rỗng thì bỏ. Nút "Book now" của fanpage:
        `https://<tên-miền>/book/?utm_source=facebook&utm_medium=page_button&utm_campaign=book_now` (bản Việt `/vi/book/…`).
      properties:
        source: { type: string, pattern: '^[a-z0-9._-]{1,64}$' }
        medium: { type: string, pattern: '^[a-z0-9._-]{1,64}$' }
        campaign: { type: string, pattern: '^[a-z0-9._-]{1,64}$' }
    DirectSubSource:
      type: string
      enum: [facebook, instagram, google, zalo, qr, other]
      description: |
        0.3.7 bổ sung 2 (FB-INV-002 ý 3 – "website · facebook"). **Nguồn phụ** của yêu cầu/đơn `directSource = website`; server suy ra lúc nhận yêu cầu, không ai nhập tay:
        (1) `utm.medium = qr` → `qr`; (2) `utm.source` ∈ {`facebook`, `fb`, `m.facebook.com`, `l.facebook.com`} → `facebook`; {`instagram`, `ig`} → `instagram`; {`google`} → `google`;
        {`zalo`} → `zalo`; giá trị khác → `other`; (3) không có `utm.source`: `refHost` là facebook.com / fb.com / fb.me / messenger.com (kể cả tên miền con) → `facebook`;
        instagram.com → `instagram`; google.<đuôi> → `google`; zalo.me / zalo.vn → `zalo`; khác → `other`; (4) không có cả hai → null (gõ địa chỉ, dấu trang).
        Bảng ánh xạ là hằng số của module `public-site`; thêm giá trị = đổi hợp đồng (chỉ thêm, DATA báo cáo theo kênh – US-158).
    WebsiteBookingRequestInput:
      type: object
      additionalProperties: false
      required: [formToken, arrival, departure, adults, guestName, phone, locale, consent, consentVersion]
      description: |
        0.3.7 bổ sung 2 – thân `createWebsiteBookingRequest` (phương án A). Chỉ hỏi đủ để trả lời yêu cầu (tối thiểu hóa – ADR-014 4.6): **không** hỏi quốc tịch, giấy tờ,
        ngày sinh, địa chỉ, số thẻ. Trang kiểm trước bằng cùng schema zod (`packages/contracts`) nên lỗi 422 hiếm. Ô đồng ý **không** tích sẵn, một mục đích ("để OTTIMO liên hệ
        trả lời yêu cầu này") – **không** có ô nhận ưu đãi (SEC DOM-05, US-151 AC6).
      properties:
        formToken: { type: string, minLength: 20, maxLength: 300, writeOnly: true, description: 'Từ `getPublicFormToken`' }
        website:
          type: string
          maxLength: 200
          writeOnly: true
          description: 'Ô bẫy (honeypot) – ẩn bằng class CSS (không `style=`), `tabindex="-1"`, `autocomplete="off"`, `aria-hidden="true"`; người thật để trống. Có giá trị → 202 giống hệt, không lưu'
        arrival: { $ref: '#/components/schemas/LocalDate', description: '≥ hôm nay (giờ cơ sở – ADR-008), ≤ hôm nay + `booking_window_days` (BR-112)' }
        departure:
          $ref: '#/components/schemas/LocalDate'
          description: |
            > `arrival`; tối đa 366 đêm. Một ô ngày cho cả hai nhóm khách (boutique stay – không tách "căn hộ dịch vụ"): từ 28 đêm (BR-108) server ghi `stayKind = long`, sale báo giá
            dài hạn (`calculateQuote` `type = long`); không báo lỗi.
        adults: { type: integer, minimum: 1, maximum: 12 }
        children: { type: integer, minimum: 0, maximum: 8, default: 0 }
        childrenAges:
          type: array
          maxItems: 8
          items: { type: integer, minimum: 0, maximum: 17 }
          description: 'Tùy chọn – có thì đúng `children` phần tử (khác → `VALUE_OUT_OF_RANGE`); giúp báo giá theo nhóm tuổi BR-110 (6–11, dưới 6)'
        roomType:
          type: string
          pattern: '^[a-z0-9-]{2,60}$'
          description: |
            Hạng phòng khách thích = slug của `Room.publicRoomType` (chữ thường, bỏ dấu, ký tự khác chữ-số → `-`, ví dụ "Standard Studio · Garden View" → `standard-studio-garden-view`).
            Vắng = "Chưa chọn – tư vấn giúp". Slug không khớp hạng nào đang bán → **vẫn nhận**, cờ `room_type_unmatched` (trang cũ không làm hỏng yêu cầu). Landing không hiện số phòng
            hay số căn của hạng (FB-INV-002 ý 1); server không trả gì về hạng.
        guestName: { type: string, minLength: 1, maxLength: 80, writeOnly: true, x-classification: C2, x-rbac-field: D28, description: 'Tên gọi (V-01 – bỏ ký tự điều khiển)' }
        phone:
          type: string
          minLength: 6
          maxLength: 32
          writeOnly: true
          x-classification: C2
          x-rbac-field: D28
          description: 'SĐT dùng Zalo/gọi – **bắt buộc** (Zalo OA là kênh chính – FB-INV-002 ý 4). Dạng người dùng gõ (V-02): số Việt Nam `0…` hoặc `+84…`; số nước ngoài phải có `+mã nước`. Server chuẩn hóa E.164'
        email: { type: string, format: email, maxLength: 254, writeOnly: true, x-classification: C2, x-rbac-field: D28, description: 'Tùy chọn (V-03); bắt buộc khi `preferredChannel = email`' }
        preferredChannel:
          type: string
          enum: [zalo, whatsapp, telegram, viber, phone, email]
          default: zalo
          description: 'Kênh khách muốn được trả lời. Trang xếp `zalo` đầu và chọn sẵn; WhatsApp/Telegram/Viber nằm trong "Kênh khác" (FB-INV-002 ý 4)'
        note:
          type: string
          maxLength: 500
          writeOnly: true
          x-classification: C2
          x-rbac-field: D28
          description: 'Lời nhắn. Trang ghi dưới ô: "Không ghi số thẻ, số giấy tờ hay thông tin sức khỏe" (SR-INP-05). Số thẻ → `CARD_NUMBER_DETECTED`; số giấy tờ → `ID_NUMBER_DETECTED` – không lưu'
        locale: { $ref: '#/components/schemas/Locale' }
        consent: { type: boolean, const: true, description: 'Ô đồng ý đã tích (không tích sẵn) – khác `true` → mã trường `CONSENT_REQUIRED` (SEC C-3)' }
        consentVersion:
          type: string
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}(\.[0-9]{1,2})?$'
          description: 'Phiên bản thông báo xử lý dữ liệu trang đã hiện (`privacy_notice_version` đã đăng của `locale`; bản trước còn nhận 7 ngày sau khi có bản mới) – sai → `NOTICE_VERSION_INVALID`'
        utm: { $ref: '#/components/schemas/WebsiteUtm' }
        refHost:
          type: string
          maxLength: 100
          pattern: '^[a-z0-9.-]{1,100}$'
          description: 'Chỉ **tên miền** của `document.referrer` khi khác origin landing (không đường dẫn, không query) – dùng suy `DirectSubSource` khi không có UTM'
        landingPath: { type: string, pattern: '^/[a-z0-9/_-]{0,199}$', description: 'Đường dẫn trang gửi form (không query), ví dụ `/book/`, `/vi/book/`, `/rooms/signature/`' }
        offerSnapshot:
          $ref: '#/components/schemas/PublicOfferSnapshot'
          description: '**Contract-ahead phương án B** – server phương án A bỏ qua (không lưu)'
    WebsiteBookingRequestAccepted:
      type: object
      required: [refCode, replyBy]
      description: '0.3.7 bổ sung 2 – phản hồi 202 duy nhất (cả khi bị ô bẫy hay giới hạn liên hệ chặn im lặng). Không có dữ liệu khách nhập'
      properties:
        refCode:
          type: string
          pattern: '^[0-9A-HJKMNP-TV-Z]{8}$'
          description: |
            Mã tham chiếu ngẫu nhiên (Crockford base32, 40 bit CSPRNG, không tăng dần; UK theo cơ sở). Trang hiện "Mã yêu cầu" + nút "Nhắn Zalo" soạn sẵn mã này. Chỉ để tra cứu nội bộ –
            **không** phải yếu tố xác minh, không có endpoint công khai tra theo mã (SEC ARC-04).
        replyBy:
          $ref: '#/components/schemas/Instant'
          description: 'Hạn trả lời dự kiến: trong `front_desk_hours` (BR-811) = lúc nhận + `web_request_response_minutes`; ngoài giờ = giờ mở trực kế tiếp + `web_request_response_minutes`'
    WebsiteBookingRequestStatus: { type: string, enum: [new, in_progress, converted, declined, spam], description: '0.3.7 bổ sung 2 – SM-18 đề xuất (BA đặt mã chính thức)' }
    WebsiteBookingRequestDeclineReason:
      type: string
      enum: [no_availability, price_not_accepted, guest_unreachable, guest_not_proceeding, duplicate, policy_mismatch, stale, other]
      description: '0.3.7 bổ sung 2 – lý do từ chối (DATA đếm nhu cầu mất, ví dụ `no_availability`). `stale` chỉ hệ thống đặt (WR7). Nhãn VI/EN do UXD (`webreq.decline.*`)'
    WebsiteBookingRequestTransition:
      type: object
      additionalProperties: false
      description: '0.3.7 bổ sung 2 – thân `transitionWebsiteBookingRequest`; chỉ `decline` cần `reasonCode`, hành động khác bỏ trống'
      properties:
        reasonCode: { $ref: '#/components/schemas/WebsiteBookingRequestDeclineReason' }
        note: { type: string, minLength: 3, maxLength: 300, x-classification: C2, x-rbac-field: D28, description: 'Bắt buộc khi `reasonCode = other` (`REASON_REQUIRED`); V-09' }
    WebsiteBookingRequest:
      type: object
      required: [id, refCode, status, arrival, departure, nights, stayKind, adults, children, locale, preferredChannel, replyBy, createdAt, updatedAt, version, allowedActions]
      description: |
        0.3.7 bổ sung 2 – bản nhìn của nhân viên (US-155). Trường C2 vắng khi `piiPurgedAt` có giá trị.
        **Chuyển thành giữ chỗ/đơn** (US-155 AC2 – WR6; không có operation "convert" riêng, đi qua luồng có sẵn để giữ mọi ràng buộc chống trùng ADR-009, giá BR, chống trùng hồ sơ BR-951):
        (a) Desk mở `GuestPicker` điền sẵn tên/SĐT/email → chọn hoặc tạo hồ sơ khách; (b) **giữ chỗ**: `saveQuote` kèm `websiteBookingRequestId` → `createHoldFromQuote`;
        (c) **đơn đảm bảo** (FD+, khách đã chốt và đã cọc): `createReservation` kèm `websiteBookingRequestId`. Đơn tạo ra có kênh `direct`, `directSource = website`,
        `directSubSource` = `subSource` của yêu cầu; yêu cầu → `converted` (`reservationId`) và **xóa trường C2** trong cùng giao dịch (dữ liệu đã ở hồ sơ khách).
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        refCode: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{8}$' }
        status: { $ref: '#/components/schemas/WebsiteBookingRequestStatus' }
        arrival: { $ref: '#/components/schemas/LocalDate' }
        departure: { $ref: '#/components/schemas/LocalDate' }
        nights: { type: integer, minimum: 1 }
        stayKind: { type: string, enum: [short, long], description: '`long` khi ≥ 28 đêm (BR-108) – báo giá dài hạn' }
        adults: { type: integer }
        children: { type: integer }
        childrenAges: { type: array, items: { type: integer } }
        roomType: { type: [string, 'null'], description: 'Slug khách chọn; null = chưa chọn' }
        roomTypeLabel: { type: [string, 'null'], description: '`Room.publicRoomType` hiện hành khớp slug; null = chưa chọn hoặc không khớp (cờ `room_type_unmatched`)' }
        guestName: { type: string, x-classification: C2, x-rbac-field: D28 }
        phone: { type: string, x-classification: C2, x-rbac-field: D28, description: 'E.164 có dấu `+` – Desk có nút mở Zalo/gọi' }
        email: { type: string, x-classification: C2, x-rbac-field: D28 }
        preferredChannel: { type: string, enum: [zalo, whatsapp, telegram, viber, phone, email] }
        note: { type: string, x-classification: C2, x-rbac-field: D28 }
        locale: { $ref: '#/components/schemas/Locale' }
        subSource:
          oneOf: [{ $ref: '#/components/schemas/DirectSubSource' }, { type: 'null' }]
          description: 'Nguồn phụ suy từ UTM/refHost – đơn chuyển từ yêu cầu mang `directSubSource` này'
        utmSource: { type: [string, 'null'] }
        utmMedium: { type: [string, 'null'] }
        utmCampaign: { type: [string, 'null'] }
        refHost: { type: [string, 'null'] }
        landingPath: { type: [string, 'null'] }
        suspiciousFlags:
          type: array
          description: 'Cờ để nhân viên lọc, không chặn: lời nhắn có URL; chữ ngoài bảng chữ của 3 ngôn ngữ; ngày đến xa (> 180 ngày); liên hệ gửi lặp; hạng phòng không khớp'
          items: { type: string, enum: [contains_url, unexpected_script, far_future, repeat_contact, room_type_unmatched] }
        duplicateCount: { type: integer, minimum: 0, description: 'Số lần cùng SĐT gửi thêm trong ngày bị giới hạn chặn (không tạo bản mới)' }
        replyBy: { $ref: '#/components/schemas/Instant' }
        isReplyOverdue: { type: boolean, description: '`new` đã quá `replyBy` – Desk tô cảnh báo; cùng điều kiện mục "Cần chú ý" `website_request_new` mức `warning`' }
        assignedUserId: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        assignedUserName: { type: [string, 'null'], description: 'Tên hiển thị người đang xử lý' }
        claimedAt: { oneOf: [{ $ref: '#/components/schemas/Instant' }, { type: 'null' }] }
        declineReasonCode: { oneOf: [{ $ref: '#/components/schemas/WebsiteBookingRequestDeclineReason' }, { type: 'null' }] }
        declineNote: { type: string, x-classification: C2, x-rbac-field: D28 }
        quoteId: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }], description: 'Báo giá gần nhất gắn yêu cầu (`saveQuote.websiteBookingRequestId`)' }
        reservationId: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }], description: 'Đơn tạo ra khi `converted`' }
        reservationCode: { type: [string, 'null'], example: OTM-00212 }
        convertedAt: { oneOf: [{ $ref: '#/components/schemas/Instant' }, { type: 'null' }] }
        offerSnapshot: { oneOf: [{ $ref: '#/components/schemas/PublicOfferSnapshot' }, { type: 'null' }], description: 'Contract-ahead phương án B – luôn null ở A' }
        createdAt: { $ref: '#/components/schemas/Instant' }
        updatedAt: { $ref: '#/components/schemas/Instant' }
        piiPurgedAt: { oneOf: [{ $ref: '#/components/schemas/Instant' }, { type: 'null' }], description: 'Lúc xóa trường C2 (chuyển thành đơn, hoặc job hạn lưu – erd 4.14)' }
        version: { type: integer }
        allowedActions: { type: array, items: { $ref: '#/components/schemas/AllowedAction' }, description: 'Theo trạng thái và vai/phạm vi người gọi (claim, release, decline, mark-spam, reopen)' }
    PublicOfferSnapshot:
      type: object
      additionalProperties: false
      description: '**Contract-ahead phương án B** (0.3.7 bổ sung 2): giá trang đã hiện lúc gửi (từ `getPublicOffers`) – Desk hiện "Giá trên web lúc gửi" cạnh giá tính lại; lệch thì sale quyết'
      properties:
        roomType: { type: string, pattern: '^[a-z0-9-]{2,60}$' }
        totalVnd: { $ref: '#/components/schemas/MoneyVnd' }
        computedAt: { $ref: '#/components/schemas/Instant' }
        priceVersion: { type: string, maxLength: 40 }
    PublicAvailability:
      type: object
      required: [from, to, roomTypes]
      description: '**Contract-ahead phương án B** (0.3.7 bổ sung 2) – `getPublicAvailability`'
      properties:
        from: { $ref: '#/components/schemas/LocalDate' }
        to: { $ref: '#/components/schemas/LocalDate' }
        currency: { type: string, enum: [VND] }
        roomTypes:
          type: array
          items:
            type: object
            required: [roomType, nights]
            properties:
              roomType: { type: string, description: 'Slug của `Room.publicRoomType`' }
              nights:
                type: array
                items:
                  type: object
                  required: [date, available]
                  properties:
                    date: { $ref: '#/components/schemas/LocalDate' }
                    available: { type: boolean, description: 'Chỉ còn/hết – không số căn còn lại' }
                    nightlyRateVnd: { $ref: '#/components/schemas/MoneyVnd', description: 'Chỉ khi còn phòng và `public_show_prices = true`' }
    PublicOffers:
      type: object
      required: [arrival, departure, nights, offers]
      description: '**Contract-ahead phương án B** (0.3.7 bổ sung 2) – `getPublicOffers`'
      properties:
        arrival: { $ref: '#/components/schemas/LocalDate' }
        departure: { $ref: '#/components/schemas/LocalDate' }
        nights: { type: integer }
        priceVersion: { type: string }
        offers:
          type: array
          items:
            type: object
            required: [roomType, available]
            properties:
              roomType: { type: string }
              available: { type: boolean }
              totalVnd: { $ref: '#/components/schemas/MoneyVnd' }
              nightlyAvgVnd: { $ref: '#/components/schemas/MoneyVnd' }
              extraGuestFeeVnd: { $ref: '#/components/schemas/MoneyVnd' }
              losDiscountPct: { $ref: '#/components/schemas/Percent' }
              depositPct: { $ref: '#/components/schemas/Percent', description: 'BR-305' }
              cancellationPolicyKey: { type: string }
        longStayHint:
          type: object
          description: 'Có khi ≥ 28 đêm (BR-108) – mời gửi yêu cầu, sale báo giá dài hạn'
          properties:
            fromMonthlyVnd: { $ref: '#/components/schemas/MoneyVnd' }
