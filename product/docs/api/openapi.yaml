  /v1/properties/{propertyId}/trusted-devices:
    parameters:
      - $ref: '#/components/parameters/PropertyId'
    get:
      tags: [devices]
      operationId: listTrustedDevices
      summary: Danh sách thiết bị được cấp quyền C3 + lần dùng gần nhất (màn S26, SR-DEV-06)
      x-roles: [owner]
      x-rbac: [S26]
      x-stories: [US-003, US-142]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/TrustedDevice' } }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [devices]
      operationId: trustCurrentDevice
      summary: Cấp quyền C3 cho **chính thiết bị đang gọi** (máy quầy / máy tính bảng của cơ sở) – SR-DEV-02
      description: |
        Chỉ gọi được từ origin **admin-web** (kiểm `Origin`); gọi từ origin PWA → `403 FORBIDDEN_ACTION` (SR-DEV-04).
        Người cấp xác nhận lại mật khẩu (và TOTP khi đã bật 2FA) – sai → `401 REAUTH_FAILED` + `errors[{field: currentPassword}]`;
        `hardeningChecklistConfirmed` ≠ true → `422` mã trường `CHECKLIST_REQUIRED` (0.3.4). Server sinh 256 bit, đặt cookie
        `__Host-ottimo_did` (HttpOnly; Secure; SameSite=Strict; hết hạn = `expiresAt`), DB lưu SHA-256. Hạn mặc định `trusted_device_days`.
        Trực đêm dùng thiết bị của cơ sở được cấp theo cách này (phân xử ORC 15/10) – không cấp cho điện thoại cá nhân.
        Ghi `audit_event` security.
      x-roles: [owner]
      x-rbac: [A100]
      x-stories: [US-003, US-142]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, deviceKind, currentPassword, hardeningChecklistConfirmed]
              properties:
                name: { type: string, maxLength: 80, example: Máy quầy lễ tân 1 }
                deviceKind:
                  type: string
                  enum: [desk, facility_mobile]
                  description: |
                    `desk` máy tính quầy (hạn `trusted_device_days`, mặc định 180) · `facility_mobile` máy tính bảng/điện thoại **của cơ sở**
                    mở admin-web trong trình duyệt (hạn ≤ 30 ngày, SR-DEV-08). Không bao giờ cấp cho máy cá nhân hay PWA (SR-DEV-09).
                currentPassword: { type: string, writeOnly: true }
                totpCode: { type: string, pattern: '^[0-9]{6}$', writeOnly: true }
                hardeningChecklistConfirmed: { type: boolean, description: Đã kiểm checklist cứng hóa SR-DEV-07 }
      responses:
        '201':
          description: Đã cấp; cookie thiết bị được đặt
          headers:
            Set-Cookie:
              schema: { type: string }
              description: '__Host-ottimo_did=...; HttpOnly; Secure; SameSite=Strict; Path=/; Expires=...'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrustedDevice' }
        '401': { $ref: '#/components/responses/ReauthFailed' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /v1/properties/{propertyId}/trusted-devices/{deviceId}/actions/revoke:
