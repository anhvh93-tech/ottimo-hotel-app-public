  /v1/properties/{propertyId}/parameters/{key}:
    parameters:
      - $ref: '#/components/parameters/PropertyId'
      - $ref: '#/components/parameters/ParameterKey'
    get:
      tags: [platform]
      operationId: getParameterHistory
      summary: Giá trị và lịch sử của một khóa (US-005 AC3)
      x-roles: [owner, manager, front_desk_lead]
      x-stories: [US-005]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [current, history]
                properties:
                  current: { $ref: '#/components/schemas/Parameter' }
                  history: { type: array, items: { $ref: '#/components/schemas/Parameter' } }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [platform]
      operationId: setParameter
      summary: Thêm giá trị mới có ngày hiệu lực (không sửa giá trị quá khứ). Khóa `foc_limits`, tỷ lệ hoa hồng, phí kênh, `vat_rate`, `retention.*` và mọi tham số bảo mật chỉ OWN (rbac 5.3, A118).
      description: |
        **Chỉ owner** (manager → `403 FORBIDDEN_ACTION`, ghi `audit_event access.denied`): `foc_limits`, tỷ lệ hoa hồng, phí kênh, `vat_rate`, `retention.*`
        và các **tham số bảo mật** liệt kê ở `x-security-parameters` (BUG-R1-SEC-02; erd 9.3 cột "Người sửa / Biên").
        Tham số bảo mật có **biên cứng** do SEC đặt – giá trị ngoài biên hoặc phần tử ngoài tập cho phép → `422 PARAM_OUT_OF_RANGE`
        (kèm `min`/`max` hoặc `allowed[]`); sai kiểu → `422 VALIDATION_FAILED`. Áp dụng cả với owner; đổi biên = đổi hợp đồng (SEC duyệt), không phải cấu hình.
        Khóa không bảo mật có khoảng giá trị (erd 9) cũng trả `PARAM_OUT_OF_RANGE` khi vượt khoảng.
        Mỗi lần sửa tham số bảo mật ghi `audit_event category='security'` (giá trị trước/sau, lý do, người sửa); các khóa khác ghi `category='config'`.
        Kiểm tra thực hiện trên server theo khóa trong đường dẫn – client không quyết định khóa nào là "bảo mật".
      x-roles: [owner, manager]
      x-rbac: [A101, A102, A118, A119]
      x-stories: [US-005]
      x-security-parameters:
        guest_verify_max_attempts: { type: integer, minimum: 3, maximum: 5, default: 5, ref: SR-GST-08 }
        guest_level2_idle_minutes: { type: integer, minimum: 5, maximum: 30, default: 30, ref: SR-GST-09 }
        guest_link_grace_hours: { type: integer, minimum: 0, maximum: 24, default: 24, ref: SR-GST-05/11 }
        guest_verify_code_channel_minutes: { type: integer, minimum: 5, maximum: 30, default: 15, ref: SR-GST-13 }
        guest_verify_code_channels: { type: array, uniqueItems: true, items: { enum: [airbnb_inbox, booking_inbox, agoda_inbox, zalo] }, default: [], ref: SR-GST-13 }
        trusted_device_days: { type: integer, minimum: 1, maximum: 180, default: 180, ref: SR-DEV-01 }
        trusted_device_mobile_days: { type: integer, minimum: 1, maximum: 30, default: 30, ref: SR-DEV-08 }
        c3_stepup_minutes: { type: integer, minimum: 1, maximum: 15, default: 15, ref: SR-C3-09 }
        session_policy:
          type: object
          ref: SR-SES-03
          default: { admin: { idleMinutes: 30, maxHours: 12 }, staff_pwa: { idleMinutes: 4320, maxHours: 720 } }
          description: |
            0.3.4 (SEC s1-decisions mục 1). Ràng buộc chéo: `idleMinutes ≤ maxHours × 60` từng kênh; vi phạm → `PARAM_OUT_OF_RANGE` kèm `min`/`max` của khóa con.
            **Phạm vi**: lưu theo cơ sở như mọi tham số; khi áp cho đăng nhập/phiên (chưa có cơ sở) server dùng giá trị **chặt nhất** trong các cơ sở
            người dùng có vai đang hoạt động (idle/max nhỏ nhất); ngày hiệu lực theo giờ cơ sở (FB-R2-SEC-BE-20).
          required: [admin, staff_pwa]
          properties:
            admin:
              type: object
              required: [idleMinutes, maxHours]
              properties:
                idleMinutes: { type: integer, minimum: 5, maximum: 30, default: 30 }
                maxHours: { type: integer, minimum: 1, maximum: 12, default: 12 }
            staff_pwa:
              type: object
              required: [idleMinutes, maxHours]
              properties:
                idleMinutes: { type: integer, minimum: 60, maximum: 4320, default: 4320 }
                maxHours: { type: integer, minimum: 24, maximum: 720, default: 720 }
        login_lockout:
          type: object
          ref: SR-AUTH-04
          default: { maxFailures: 5, lockMinutes: 15, hardLockAfterLocks: 3, lockWindowHours: 24 }
          description: |
            0.3.4 (SEC s1-decisions mục 1). Khóa tạm/khóa cứng chỉ chặn **đăng nhập mới**, không hủy phiên đang sống (FB-R2-SEC-BE-05).
            Phạm vi như `session_policy`: giá trị chặt nhất trong các cơ sở của người dùng (`maxFailures`, `hardLockAfterLocks` nhỏ nhất; `lockMinutes`, `lockWindowHours` lớn nhất).
          required: [maxFailures, lockMinutes, hardLockAfterLocks, lockWindowHours]
          properties:
            maxFailures: { type: integer, minimum: 3, maximum: 5, default: 5 }
            lockMinutes: { type: integer, minimum: 15, maximum: 60, default: 15 }
            hardLockAfterLocks: { type: integer, minimum: 2, maximum: 3, default: 3 }
            lockWindowHours: { type: integer, minimum: 24, maximum: 72, default: 24 }
      x-reauth-parameters:
        # 0.3.6 (SEC F3): khóa chỉ OWN + xác nhận lại mật khẩu trong request (`reauth`); tách khỏi x-security-parameters vì giá trị là chuỗi
        # (meta/bounds của x-security-parameters chỉ nhận integer/array/object số). BE-B kiểm theo schema dưới đây.
        payment_receiving_account:
          type: object
          ref: SEC s3-checklist F3, BR-521
          description: |
            0.3.6. Tài khoản nhận VietQR. **Chỉ OWN**; request **bắt buộc** `reauth` (mật khẩu của chính OWN, kiểm ngay – không dùng cửa sổ step-up)
            → sai: `401 REAUTH_FAILED`; audit `category='money'` với số tài khoản **che giữa** (cũ/mới); push + `StaffNotification`
            `receiving_account_changed` tới **mọi** OWN/MGR của cơ sở. `listParameters`/`getParameterHistory` chỉ trả `accountNoMasked`
            (`9704••••1234`), không bao giờ trả số đầy đủ; số đầy đủ chỉ nằm trong `qrPayload` do server dựng. QR tạo trong 24 giờ sau khi đổi →
            `createVietQr.receivingAccountRecentlyChanged=true` (lễ tân thấy cảnh báo). Thiếu khóa → `createVietQr` `409 PAYMENT_NOT_CONFIGURED`.
          required: [bankBin, accountNo, accountName]
          properties:
            bankBin: { type: string, pattern: '^[0-9]{6}$', description: 'Mã BIN ngân hàng (NAPAS)' }
            accountNo: { type: string, pattern: '^[0-9]{6,19}$', writeOnly: true }
            accountName: { type: string, maxLength: 50, description: 'Tên chủ tài khoản không dấu, IN HOA' }
