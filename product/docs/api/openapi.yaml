                    status: 409
                    code: ROOM_UNAVAILABLE
                    conflicts: [{ roomNo: '201', nights: ['2026-10-18'], kind: reservation }]
                    suggestions: [{ roomId: 0192a1b0-0000-7000-8000-0000000c0202, roomNo: '202', roomGroupCode: L12, upgrade: false }]
