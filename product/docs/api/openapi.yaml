        amountVnd: { $ref: '#/components/schemas/MoneyVnd' }
        status: { $ref: '#/components/schemas/PaymentStatus' }
        receivedAt: { $ref: '#/components/schemas/Instant' }
        recordedBy: { type: string }
        payerName:
          type: string
          x-rbac-field: D14
          x-visible-to: [owner, manager, front_desk_lead, front_desk]
        cardBrand: { type: string, x-rbac-field: D14 }
        cardLast4: { type: string, pattern: '^[0-9]{4}$', x-rbac-field: D14 }
        reversalOfId: { $ref: '#/components/schemas/Uuid' }
        expiresAt: { $ref: '#/components/schemas/Instant' }
        methodDetail: { type: [string, 'null'], enum: [qr, atm, intl_card, wallet, null] }
        billingPeriodId: { $ref: '#/components/schemas/Uuid' }
        reconciliation:
          type: string
          enum: [not_required, pending, reconciled, disputed]
          description: 'Chuyển khoản/VietQR lễ tân tự ghi → `pending` ("Chờ đối soát" – BR-527, US-119 AC6); MGR+ đối soát theo sao kê'
        reconciledAt: { $ref: '#/components/schemas/Instant' }
        reconciledByName: { type: string, x-visible-to: [owner, manager] }
        shiftId: { $ref: '#/components/schemas/Uuid', description: 'Ca đang mở khi ghi tiền mặt (SM-17; erd `payment.shift_id`) – null nếu không phải tiền mặt' }
        reservationGroupId: { $ref: '#/components/schemas/Uuid', description: 'Cọc chung nhóm (SM-16 G2) – phân bổ ở `allocateGroupDeposit`' }
        folioId: { $ref: '#/components/schemas/Uuid', description: '0.3.3' }
        reservationCode: { type: string, example: OTM-00171, description: '0.3.3 – cho danh sách đối soát' }
        recordedByUserId: { $ref: '#/components/schemas/Uuid', description: 'Người ghi/tạo giao dịch (0.3.3, E05-03)' }
        recordedByRole: { $ref: '#/components/schemas/Role', description: 'Vai của người ghi tại thời điểm ghi (snapshot) – lọc khoản sale/CTV ghi (BR-527) – 0.3.6, UXD #3' }
        confirmedAt: { $ref: '#/components/schemas/Instant', description: 'VietQR: lúc lễ tân xác nhận thấy tiền (`confirmPaymentReceived`) – 0.3.3' }
        confirmedByUserId: { $ref: '#/components/schemas/Uuid', description: '0.3.3' }
        confirmedByName: { type: string, description: '0.3.3' }
