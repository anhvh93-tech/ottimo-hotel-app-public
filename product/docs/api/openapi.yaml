      x-roles: [owner, manager, front_desk_lead, front_desk, sales_staff]
      x-scope: { sales_staff: own }
      x-rbac: [A33]
      x-transition: G2
      x-stories: [US-140]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GroupDepositInput' }
            example:
              payment: { type: charge, method: bank_transfer, amountVnd: 2300000, receivedAt: '2026-12-20T10:15:00+07:00' }
              allocations:
                - { reservationId: 0192a1b0-0000-7000-8000-0000000f0171, amountVnd: 708000 }
                - { reservationId: 0192a1b0-0000-7000-8000-0000000f0172, amountVnd: 708000 }
                - { reservationId: 0192a1b0-0000-7000-8000-0000000f0173, amountVnd: 884000 }
      responses:
        '200':
          description: Kết quả phân bổ (đã ghi, hoặc tính thử khi `dryRun=true`)
          content:
            application/json:
              schema:
                type: object
                required: [group, allocations]
                properties:
                  group: { $ref: '#/components/schemas/ReservationGroup' }
                  payment: { $ref: '#/components/schemas/Payment' }
                  allocations: { type: array, items: { $ref: '#/components/schemas/PaymentAllocation' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
