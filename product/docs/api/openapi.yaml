  # ───────────────────────── maintenance ─────────────────────────
  /v1/properties/{propertyId}/attachments:
    parameters:
      - $ref: '#/components/parameters/PropertyId'
    post:
      tags: [maintenance]
      operationId: uploadAttachment
      summary: Tải ảnh **không phải giấy tờ** (sự cố, kiểm phòng, bằng chứng phạt, biên nhận cọc). Ảnh nén ở client trước khi gửi.
      description: |
        0.3.6 (B-01, SEC I1–I7): cùng pipeline với ảnh giấy tờ (magic bytes JPEG/PNG/WebP, ≤ 10 MB, ≤ 40 MP, mã hóa lại, bỏ EXIF, xử lý trong bộ nhớ);
        lưu **C2 mã hóa DEK riêng mỗi tệp** qua `CryptoService` (xóa = hủy DEK). `purpose` là enum **đóng** – không bao giờ dùng cho giấy tờ tùy thân;
        guest-web không gọi. Giới hạn 20 tệp/phiếu hoặc lần kiểm, 50 tệp/người/ngày (429). Vai theo `purpose`: `deposit_receipt` FD+ và SAL/CTV;
        `penalty_evidence`, `meter` FD+ (+MT với `meter`); `work_order` mọi vai thấy phiếu; `inspection` FD+ và HK; `refund_proof` (ảnh ủy nhiệm chi/biên nhận
        chi hoàn – có thể chứa số tài khoản khách, đọc như D15): tải – OWN/MGR, và FD/FDL cho biên nhận hoàn tiền mặt; đọc – OWN/MGR + người tải (BA E15-02, PO 16/10). Sai vai cho `purpose` → 403. `refund_proof` xóa cùng hạn `deposit_receipt`.
        Thời hạn lưu (SEC I5, tham số OWN sửa): `work_order`/`inspection` 12 tháng sau đóng (`attachment_ops_retention_months` 3–24);
        `deposit_receipt` 90 ngày sau `reconciled` (`deposit_receipt_retention_days` 30–365; `disputed` giữ tới xử lý xong + 90 ngày);
        `penalty_evidence` 12 tháng sau trả phòng hoặc khiếu nại đóng (mốc muộn hơn); `meter` 12 tháng sau HĐ kết thúc. J16 xóa.
      x-roles: [owner, manager, front_desk_lead, front_desk, housekeeping, maintenance, sales_staff, collaborator]
      x-rate-limit: 50 tệp/người/ngày; 20 tệp/phiếu hoặc lần kiểm (SEC I7)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, purpose]
              properties:
                file: { type: string, format: binary }
                purpose: { type: string, enum: [work_order, inspection, penalty_evidence, deposit_receipt, meter, refund_proof] }
                reservationId: { $ref: '#/components/schemas/Uuid', description: 'Bắt buộc với `deposit_receipt`, `penalty_evidence` – kiểm phạm vi người gọi với đơn (SEC I1) – 0.3.6' }
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [id, purpose]
                properties:
                  id: { $ref: '#/components/schemas/Uuid' }
                  purpose: { type: string, enum: [work_order, inspection, penalty_evidence, deposit_receipt, meter, refund_proof] }
                  sizeBytes: { type: integer }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413':
          description: PAYLOAD_TOO_LARGE
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /v1/properties/{propertyId}/attachments/{attachmentId}:
    parameters:
      - $ref: '#/components/parameters/PropertyId'
      - name: attachmentId
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Uuid' }
    get:
      tags: [maintenance]
      operationId: getAttachment
      summary: Xem ảnh đính kèm (không phải giấy tờ) – giải mã, header an toàn, phạm vi theo `purpose` (B-01)
      description: |
        0.3.6 (B-01, SEC I1–I3 duyệt 16/10). C2 – **không** cần thiết bị được cấp, step-up, `c3_access_log`. Phạm vi theo `purpose`:
        `work_order` – ai thấy phiếu; `inspection` – FD+ và HK người chụp; `penalty_evidence`, `meter` – FD+; `refund_proof` – OWN/MGR, và FD/FDL người tải (biên nhận hoàn tiền mặt) (E15-02); `deposit_receipt` – FD+ và người tải
        (SAL/CTV) **khi** đơn vẫn trong phạm vi của họ. Ngoài phạm vi, khác cơ sở, đã xóa (DEK hủy) → `404`. Không URL ký sẵn; client `fetch` có cookie →
        object URL → thu hồi khi đóng. Không dùng cho giấy tờ (`getDocumentImage`).
      x-roles: [owner, manager, front_desk_lead, front_desk, housekeeping, maintenance, sales_staff, collaborator]
      x-scope: { housekeeping: own_or_routed, maintenance: routed_to_me, sales_staff: own, collaborator: own }
      x-sec-review: approved-B01 (SEC 16/10/2026)
      responses:
        '200':
          description: Ảnh đã mã hóa lại (không EXIF)
          headers:
            Cache-Control: { schema: { type: string, enum: ['private, no-store'] } }
            Content-Disposition: { schema: { type: string, example: 'inline; filename="attachment"' } }
            X-Content-Type-Options: { schema: { type: string, enum: [nosniff] } }
            Content-Security-Policy: { schema: { type: string, example: "sandbox; default-src 'none'" } }
            Cross-Origin-Resource-Policy: { schema: { type: string, enum: [same-origin] } }
          content:
            image/jpeg:
              schema: { type: string, format: binary }
            image/webp:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
