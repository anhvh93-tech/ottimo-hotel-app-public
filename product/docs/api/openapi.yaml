      description: |
        **0.3.3 (E06-01, E06-05)**: điều kiện – trạng thái `review`; đủ người (`party_count`); mọi mục `fail`/`unverified` có ghi chú (đã ghi qua
        `recordDocumentCheck` hoặc gửi trong `warningNotes`), mục `unverified` có `manualResult`; mọi người có ảnh (trừ dưới ngưỡng dữ liệu) đã ghi quyết định
        đồng ý. Thiếu → `409 REGISTRATION_INCOMPLETE` kèm `errors[]` (mục thiếu) hoặc 422 `CHECK_NOTE_REQUIRED`. Mục BR-613 (c) có kết quả cuối `fail`
        → `blocksDoorCode=true` (chặn B9 ở R2 – xem `checkIn`), các mục khác chỉ cảnh báo (R-REG-03).
      x-roles: [owner, manager, front_desk_lead, front_desk]
      x-rbac: [A70]
