                    reservationIds: [0192a1b0-0000-7000-8000-00000000b171]
                    link: /registrations?due=today
                  - kind: hold_expiring
                    source: computed
                    severity: warning
                    count: 1
                    dueAt: '2026-10-15T12:00:00+07:00'
                    reservationIds: [0192a1b0-0000-7000-8000-00000000b172]
