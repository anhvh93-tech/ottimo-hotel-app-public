                  - { code: pending_online_checkin }
                earlyCheckinSurcharge: { tierPct: 30, baseNightVnd: 700000, amountVnd: 210000, ruleRef: BR-411 }
                registrationDeadlinePreview: '2026-10-15T23:00:00+07:00'
