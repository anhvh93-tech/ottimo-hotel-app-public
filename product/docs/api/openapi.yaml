              properties:
                authMethod: { type: string, enum: [password, pin], description: 'R2 chỉ `password`; `pin` từ R3' }
                secret: { type: string, writeOnly: true, minLength: 6, maxLength: 256 }
                reason: { type: string, minLength: 3, maxLength: 500 }
                pin: { type: string, writeOnly: true, deprecated: true, description: 'Bỏ từ 0.3.1 – dùng `authMethod` + `secret`' }
                expectedVersion: { type: integer, minimum: 0, description: '0.3.7 (B-6, CỔNG) – `ApprovalRequest.version` đang xem; bắt buộc với `type = refund`' }
            example: { authMethod: password, secret: '********', reason: Không đủ điều kiện FOC theo BR-431 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApprovalRequest' }
        '401': { $ref: '#/components/responses/ReauthFailed' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/VersionConflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
