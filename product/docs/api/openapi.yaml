        defaultUnitPriceVnd: { $ref: '#/components/schemas/MoneyVnd' }
        unit: { type: string }
        evidenceRequired: { type: boolean }
        priceEditable:
          type: boolean
          description: 'false = giá theo tham số BR (phạt, hư hỏng theo bảng, dọn lẻ, giặt ủi) – FD không sửa (`PRICE_NOT_EDITABLE`); true = nhập giá (`fnb`, `service_fee`) (0.3.3, E04-03)'
        ruleRef: { type: string, example: BR-511 }
    MinibarCheckInput:
      type: object
      required: [mode, lines]
      properties:
        mode: { type: string, enum: [checkout, stayover] }
        lines:
          type: array
          items:
            type: object
            required: [itemId, remainingQty]
            properties:
              itemId: { $ref: '#/components/schemas/Uuid' }
              remainingQty: { type: integer, minimum: 0 }
        performedAt: { $ref: '#/components/schemas/Instant' }
    MinibarCheck:
      type: object
      required: [id, mode, lines]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        mode: { type: string, enum: [checkout, stayover] }
        checkedAt: { $ref: '#/components/schemas/Instant' }
        lines:
          type: array
          items:
            type: object
            required: [itemId, standardQty, remainingQty, usedQty]
            properties:
              itemId: { $ref: '#/components/schemas/Uuid' }
