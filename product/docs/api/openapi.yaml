                attachmentId: { $ref: '#/components/schemas/Uuid', description: 'Ảnh ủy nhiệm chi / biên nhận ký nhận (`uploadAttachment purpose=refund_proof`) – **bắt buộc** khi `bank_transfer` (`EVIDENCE_REQUIRED`), không bắt buộc với `cash` – 0.3.6 E15-02' }
                note: { type: string, maxLength: 300 }
