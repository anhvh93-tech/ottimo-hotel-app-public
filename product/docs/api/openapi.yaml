                - { reservationId: 0192a1b0-0000-7000-8000-0000000f0172, amountVnd: 708000 }
                - { reservationId: 0192a1b0-0000-7000-8000-0000000f0173, amountVnd: 884000 }
      responses:
        '200':
          description: Kết quả phân bổ (đã ghi, hoặc tính thử khi `dryRun=true`)
          content:
