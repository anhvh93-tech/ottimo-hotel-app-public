      summary: Hộp thông báo của tôi (báo người tạo giữ chỗ, nhắc bộ phận, cọc sau khi hủy…) – R2 trong app + SSE; Web Push R3
      description: Nội dung chỉ gồm loại + mã tham chiếu (mã đơn, số căn) – không C2/C3. Client dựng câu chữ theo `kind` (i18n UXD).
