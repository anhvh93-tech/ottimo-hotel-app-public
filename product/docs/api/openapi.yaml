  # ───────────────────────── auth / users ─────────────────────────
  /v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Đăng nhập nhân viên (US-001)
      security: []
      x-roles: [public]
      x-stories: [US-001]
      x-rate-limit: 5 sai/tài khoản/15 phút; 20 lần/IP/15 phút (SR-RL-01)
      description: |
        Đặt cookie `__Host-ottimo_sid` (HttpOnly) và trả token CSRF. Sai nhiều lần → khóa tạm, `429 RATE_LIMITED`.
        Thông báo lỗi không phân biệt "sai tên" hay "sai mật khẩu"; thời gian phản hồi đồng đều.
        **`username` duy nhất toàn hệ thống** (không chỉ theo tổ chức) nên body không cần mã tổ chức; tra người dùng bằng hàm
        `auth_find_user()` SECURITY DEFINER (erd mục 2.4) vì chưa có ngữ cảnh RLS.
        Tài khoản có 2FA (R3): trả `401 MFA_REQUIRED` kèm `mfaToken` ngắn hạn → gọi `POST /v1/auth/login/mfa`.
        **0.3.8 (SEC 06.17, 06.4)**: `mfaToken` ≥ 256 bit, DB chỉ lưu SHA-256, dùng **một lần**, hạn 5 phút, gắn `user_id` + kênh (admin/PWA); không phải phiên, không cookie, không URL/log.
        Không có "ghi nhớ thiết bị" để bỏ bước 2 (06.1). Cờ triển khai `MFA_ENFORCED = true` (bắt buộc ở staging/production – server từ chối khởi động production khi `false`) và người có vai
        `owner`/`manager` ở bất kỳ cơ sở nào **chưa** bật 2FA → đăng nhập 200 với **phiên hạn chế** (`Me.mfaEnrollmentRequired = true`): chỉ `getMe`, `getMy2fa`, `startMy2faSetup`,
        `confirmMy2fa`, `logout`; API khác → `403 MFA_ENROLLMENT_REQUIRED`. `MFA_ENFORCED = false` (dev/CI mặc định): đăng nhập bình thường, `Me.mfaRequiredButMissing = true` để nhắc.
        Mật khẩu tạm (`mustChangePassword=true` trong `Me`): mọi API khác trả `403 PASSWORD_CHANGE_REQUIRED` cho tới khi đổi.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string, minLength: 3, maxLength: 64 }
                password: { type: string, minLength: 8, maxLength: 256, writeOnly: true }
            example: { username: hanh.fd, password: '********' }
      responses:
        '200':
          description: Đăng nhập thành công
          headers:
            Set-Cookie:
              schema: { type: string }
              description: '__Host-ottimo_sid=...; HttpOnly; Secure; SameSite=Lax; Path=/'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /v1/auth/login/mfa:
    post:
      tags: [auth]
      operationId: loginMfa
      summary: Bước 2 đăng nhập – mã TOTP hoặc mã khôi phục (SR-AUTH-06)
      security: []
      x-roles: [public]
      x-round: R3
      x-stories: [US-001]
      x-rate-limit: 5 sai/người/15 phút (SR-RL-02); 5 sai/mfaToken thì token chết; lần sai cũng tính bộ đếm khóa đăng nhập SR-AUTH-04 (SEC 06.19)
      description: |
        **0.3.8 (SEC 06.17–06.22)**. Gửi **đúng một** trong `totpCode`, `recoveryCode` (cả hai/không có → `422 VALIDATION_FAILED`, không đếm).
        TOTP RFC 6238 (SHA-1, 6 số, bước 30 giây), nhận bước hiện tại ± 1; **chống phát lại**: lưu `app_user.mfa_last_used_step`, mã của bước ≤ bước đã dùng bị từ chối (cập nhật nguyên tử).
        Mã khôi phục: 16 ký tự base32 Crockford (server bỏ `-`/khoảng trắng, chữ hoa); xóa băm trong **cùng** câu `UPDATE … WHERE` (hai yêu cầu song song cùng mã → đúng một thành công);
        dùng mã → audit `security` `mfa.recovery_code_used`, thông báo `account_security_change` cho chính người đó và mọi `owner`, email theo SEC 06.15 (kênh email – xem `s1-contracts.md`).
        Mọi nhánh lỗi → **cùng** `401 MFA_INVALID` (06.20). Đúng → phiên **mới** (SR-SES-02), `user_session.mfa_at` + `amr` (`totp`/`recovery_code`).
        **0.3.8 bổ sung 1 (US-143 AC3 (a))**: vào bằng `recoveryCode` → phiên **hạn chế** (`enrollment_only`, `Me.mfaEnrollmentRequired = true`, mọi vai có 2FA): chỉ `getMe`, `getMy2fa`,
        `startMy2faSetup`, `confirmMy2fa`, `logout` – còn lại `403 MFA_ENROLLMENT_REQUIRED` tới khi đăng ký lại TOTP trên thiết bị mới (xem `startMy2faSetup`).
        Người có vai bắt buộc mà `MFA_ENFORCED = true`: phiên đầy đủ (đã có 2FA). Không `Idempotency-Key` (lệnh đăng nhập, token dùng một lần).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mfaToken]
              additionalProperties: false
              properties:
                mfaToken: { type: string, writeOnly: true, minLength: 32, maxLength: 128, description: 'Token ngắn hạn (5 phút, một lần) trả kèm 401 MFA_REQUIRED' }
                totpCode: { type: string, pattern: '^[0-9]{6}$', writeOnly: true, description: Mã 6 số từ ứng dụng xác thực }
                recoveryCode: { type: string, pattern: '^[0-9A-Za-z]{4}[- ]?[0-9A-Za-z]{4}[- ]?[0-9A-Za-z]{4}[- ]?[0-9A-Za-z]{4}$', writeOnly: true, description: 'Mã khôi phục 16 ký tự (hiển thị 4-4-4-4)' }
            example: { mfaToken: 'q8Zr1vX0bW6mN3pL5tY7uI9oA2sD4fG6hJ8kK0lQ', totpCode: '123456' }
      responses:
        '200':
          description: Đăng nhập thành công (đặt cookie như `login`)
          headers:
            Set-Cookie:
              schema: { type: string }
              description: '__Host-ottimo_sid=...; HttpOnly; Secure; SameSite=Lax; Path=/'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401':
          description: MFA_INVALID – mọi nhánh lỗi giống hệt (06.20)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example: { type: /problems/mfa-invalid, title: Mã xác thực không đúng hoặc đã hết hạn, status: 401, code: MFA_INVALID }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Hủy phiên hiện tại. Tự nhiên idempotent (gọi lại vẫn 204) nên không cần Idempotency-Key.
      x-roles: [any_staff]
      x-stories: [US-001]
      responses:
        '204': { description: Đã hủy phiên }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /v1/me/password:
    post:
      tags: [auth]
      operationId: changeMyPassword
      summary: Tự đổi mật khẩu (cần mật khẩu cũ) – thu hồi mọi phiên kể cả phiên đang gọi, cấp phiên mới cho client đang gọi (SR-AUTH-05, SR-SES-02/06)
      description: |
        0.3.4 (Q3, FB-R2-QA-BE-05): đổi thành công → **mọi** phiên của người dùng bị thu hồi, kể cả phiên đang gọi (cookie cũ → `401 UNAUTHENTICATED`);
        server cấp **phiên mới** cho chính client đang gọi qua `Set-Cookie`. `csrfToken` gắn với phiên nên **đổi** → client bắt buộc gọi lại `getMe`
        trước lệnh ghi tiếp theo. `User.version` tăng 1 (màn đang giữ ETag cũ của người dùng này sẽ nhận `412` – tải lại).
        Sai `currentPassword` → `401 REAUTH_FAILED` kèm `errors[{field: currentPassword, code: REAUTH_FAILED}]` – **không** phải hết phiên (Q4).
      x-roles: [any_staff]
      x-stories: [US-001, US-143]
      x-rate-limit: 5 sai/người/15 phút
      x-strong-reauth: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string, writeOnly: true, minLength: 8, maxLength: 256 }
                newPassword: { type: string, writeOnly: true, minLength: 10, maxLength: 256 }
                totpCode: { type: string, pattern: '^[0-9]{6}$', writeOnly: true, description: '0.3.8 (SEC 06.25 – S2): **bắt buộc** khi người gọi đã bật 2FA (thiếu → 422 `STRONG_REAUTH_REQUIRED`, `field` = `totpCode`), hoặc gửi `recoveryCode`; sai → 401 `REAUTH_FAILED` (`field` = `currentPassword` – không nói yếu tố nào sai)' }
                recoveryCode: { type: string, writeOnly: true, description: '0.3.8 – thay `totpCode` khi mất điện thoại (dùng một lần, như `loginMfa`)' }
      responses:
        '204':
          description: Đã đổi; mọi phiên cũ (kể cả phiên gọi) bị thu hồi; cookie phiên mới được đặt; ghi `audit_event` security
          headers:
            Set-Cookie:
              schema: { type: string }
              description: '__Host-ottimo_sid=...; HttpOnly; Secure; SameSite=Lax; Path=/ – phiên mới (csrfToken mới qua getMe)'
        '401': { $ref: '#/components/responses/ReauthFailed' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /v1/me/approval-pin:
    put:
      tags: [auth]
      operationId: setMyApprovalPin
      summary: Đặt/đổi PIN duyệt 6 số (khác mật khẩu, argon2id) – vai có quyền duyệt hoặc xác nhận lại C3 (SR-AUTH-09, SR-C3-09, BR-432)
      x-roles: [owner, manager, front_desk_lead, front_desk]
      x-rbac: [S01]
      x-stories: [US-007]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, pin]
              properties:
                currentPassword: { type: string, writeOnly: true }
                pin: { type: string, pattern: '^[0-9]{6}$', writeOnly: true }
      responses:
        '204': { description: Đã đặt; ghi `audit_event` security }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /v1/me/step-up:
    post:
      tags: [auth]
      operationId: stepUp
      summary: Xác nhận lại bằng PIN duyệt hoặc mật khẩu – mở cửa sổ trượt cho thao tác C3 (SR-C3-09)
      x-roles: [owner, manager, front_desk_lead, front_desk]
      x-rate-limit: 5 sai/người/15 phút (SR-RL-02)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                pin: { type: string, pattern: '^[0-9]{6}$', writeOnly: true }
                password: { type: string, writeOnly: true }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [validUntil]
                properties:
                  validUntil: { $ref: '#/components/schemas/Instant' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /v1/me/2fa:
    get:
      tags: [auth]
      operationId: getMy2fa
      summary: Trạng thái 2FA của tôi (R3; bắt buộc với owner, manager trước khi đưa dữ liệu thật)
      x-roles: [any_staff]
      x-round: R3
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [enabled, required]
                properties:
                  enabled: { type: boolean }
                  required: { type: boolean, description: Vai owner/manager → true }
                  enforced: { type: boolean, description: '0.3.8 – cờ triển khai `MFA_ENFORCED` (chỉ đọc)' }
                  pendingSetup: { type: boolean, description: '0.3.8 – đã gọi `startMy2faSetup`, chưa xác nhận (bí mật chờ hết hạn sau 10 phút)' }
                  enrolledAt: { $ref: '#/components/schemas/Instant' }
                  recoveryCodesRemaining: { type: integer, minimum: 0, maximum: 10 }
                  soleOwner: { type: boolean, description: '0.3.8 (ESC-027 B, SEC 06.6) – người gọi là `owner` duy nhất của tổ chức → câu `auth.enroll.single_owner`' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    delete:
      tags: [auth]
