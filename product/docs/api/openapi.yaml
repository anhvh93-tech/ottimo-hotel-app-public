      description: |
        **0.3.7 bổ sung 2 – contract-ahead phương án B** (ADR-014 4.7). Cùng bộ tính `calculateQuote` (kênh `direct`, nguồn `website`): giá niêm yết, lịch giá, giảm theo số đêm,
