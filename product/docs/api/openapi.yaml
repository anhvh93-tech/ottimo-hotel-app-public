        rbac: S33 (OWN/MGR toàn cơ sở). FD/FDL/SAL xem giao dịch **của mình** suy từ A33 (ghi thu) – **BA xác nhận** cập nhật S33 (hiện FD ✖, FDL R toàn bộ).
