  /v1/properties/{propertyId}/website-booking-requests/{requestId}/actions/{action}:
    parameters:
      - $ref: '#/components/parameters/PropertyId'
      - name: requestId
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Uuid' }
      - name: action
        in: path
        required: true
        schema: { type: string, enum: [claim, release, decline, mark-spam, reopen] }
    post:
      tags: [website-requests]
      operationId: transitionWebsiteBookingRequest
      summary: Nhận xử lý / trả lại hàng chờ / từ chối (lý do) / đánh dấu spam / mở lại (máy trạng thái đề xuất SM-18 – BA đặt mã chính thức)
      description: |
        **0.3.7 bổ sung 2 – phương án A (US-155)**. Chuyển (mã đề xuất WR1–WR7, BA chốt ở `state-machines.md`):
        | `action` | Chuyển | Ai (ngoài phạm vi → 404; vai không có → 403) | Ghi chú |
        |---|---|---|---|
        | `claim` | WR1 `new → in_progress` | FD+; SAL (yêu cầu chưa giao) | Giao cho người gọi (`assignedUserId`) |
        | `release` | WR2 `in_progress → new` | Người được giao; OWN/MGR/FDL với yêu cầu của người khác | Bỏ giao |
        | `decline` | WR3 `new, in_progress → declined` | FD+; SAL (giao cho mình) | `reasonCode` bắt buộc (`REQUIRED`); `other` → `note` bắt buộc (`REASON_REQUIRED`) |
        | `mark-spam` | WR4 `new, in_progress → spam` | FD+; SAL (giao cho mình) | Số spam lọt/tuần là điều kiện bật tầng 2 chống spam (ADR-014 4.4) |
        | `reopen` | WR5 `declined, spam → in_progress` | FD+; SAL (yêu cầu mình đã từ chối) | Chỉ khi trường C2 chưa xóa (`piiPurgedAt` rỗng); không vượt `retention.web_request_max_age_days`; giao cho người gọi |
        | (hệ thống) | WR6 `new, in_progress → converted` | `createHoldFromQuote` / `createReservation` có liên kết | Xem `WebsiteBookingRequest` mục "Chuyển thành giữ chỗ/đơn" |
        | (hệ thống) | WR7 `new, in_progress → declined` (`stale`) | job `web_request.stale` | Không hoạt động quá `retention.web_request_stale_days` (SEC ARC-03) |
        Sai trạng thái → 409 `INVALID_TRANSITION` (`currentState`). Mỗi chuyển ghi `state_transition` + `audit_event category='state'` (không ghi C2), phát SSE `website_request.changed`.
        `reasonCode = stale` chỉ hệ thống dùng (client gửi → `NOT_IN_LIST`). `note` lọc số thẻ/giấy tờ (V-09, `CARD_NUMBER_DETECTED`/`ID_NUMBER_DETECTED`).
      x-roles: [owner, manager, front_desk_lead, front_desk, sales_staff]
      x-scope: { sales_staff: unassigned_or_own }
      x-round: R3
      x-stories: [US-155]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WebsiteBookingRequestTransition' }
            examples:
              declineNoRoom: { value: { reasonCode: no_availability } }
              declineOther: { value: { reasonCode: other, note: Khách muốn mang theo chó lớn } }
      responses:
        '200':
          description: OK – yêu cầu sau khi chuyển
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebsiteBookingRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/VersionConflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }

  # ───────────────────────── webhooks (R3 – giữ chỗ hợp đồng) ─────────────────────────
  /v1/webhooks/{provider}/{propertySlug}:
    parameters:
      - name: provider
        in: path
        required: true
        description: |
          Cổng thanh toán (`vnpay`, `momo`, `sepay`, `payos`) hoặc channel manager (`beds24`). `mock` chỉ được đăng ký khi
          `APP_ENV ∈ {dev, test, staging}`; production không có route này; provider cấu hình `off` không đăng ký route (SR-PAY-05, INT-responses mục 4).
        schema: { type: string, enum: [vnpay, momo, sepay, payos, beds24, mock] }
      - $ref: '#/components/parameters/PropertySlug'
    get:
      tags: [webhooks]
      operationId: webhookGet
      summary: IPN dạng GET (query string) cho cổng yêu cầu – VNPay; cùng xử lý với POST. Caddy che query string `/v1/webhooks/*` trong log
      description: |
        Chỉ đăng ký cho provider dùng IPN GET (hiện `vnpay`); provider khác → `404`. Query string ≤ 4 KB (vượt → `414`), tham số trùng tên → từ chối.
        Chữ ký kiểm bởi **adapter của cổng** theo đặc tả (VNPay: `vnp_SecureHash` HMAC-SHA512 trên các tham số `vnp_*` đã sắp xếp, bỏ `vnp_SecureHash`/`vnp_SecureHashType`),
        so sánh thời gian hằng; sai/thiếu chữ ký → từ chối **trước khi** đọc dữ liệu nghiệp vụ (fail-closed), phản hồi theo định dạng cổng không lộ lý do
        (VNPay `RspCode=97`), ghi `integration_log` + `audit_event security` (không ghi query thô). Sau khi chữ ký hợp lệ: cùng luồng xử lý với `webhookPost`
        (khớp số tiền theo `paymentId`, inbox idempotent). Quy tắc chung ở `components.securitySchemes.providerSignature`.
      security:
        - providerSignature: []
      x-roles: [system]
      x-round: R3
      responses:
        '200': { description: Phản hồi theo đặc tả cổng (ví dụ VNPay RspCode) }
    post:
      tags: [webhooks]
      operationId: webhookPost
      summary: Webhook/IPN từ cổng thanh toán hoặc channel manager (ADR-011 điểm 3)
      description: |
        Cơ sở xác định bằng `propertySlug` qua hàm `webhook_resolve_property(provider, slug)` SECURITY DEFINER (erd 2.4) → chọn đúng bí mật theo cơ sở.
        Body ≤ 64 KB (`413`); 300/phút/provider; không cần phiên, ngoại lệ CSRF duy nhất. Lỗi (kể cả chữ ký sai) không lộ lý do.
        - **Cổng thanh toán**: xác thực chữ ký, khớp số tiền theo `paymentId` (= `payment.code`), ghi inbox idempotent, xử lý đồng bộ; phản hồi theo định dạng cổng (`200`).
        - **Channel manager**: dữ liệu webhook không được tin – ghi `inbox_message` (chỉ `filtered_payload` theo danh sách trường cho phép, trường nghi thẻ bị loại
          và tăng bộ đếm cảnh báo, xóa sau 90 ngày – SR-PAY-09) rồi worker kéo lại đơn qua API (SR-INT-01); trả `202`.
      security:
        - providerSignature: []
      x-roles: [system]
      x-round: R3
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
          application/x-www-form-urlencoded:
            schema: { type: object, additionalProperties: true }
      responses:
        '200': { description: Cổng thanh toán – phản hồi theo đặc tả cổng }
        '202': { description: Channel manager – đã nhận }
        '413': { description: Body vượt 64 KB }

components:
  securitySchemes:
    staffSession:
      type: apiKey
      in: cookie
      name: __Host-ottimo_sid
      description: Cookie phiên nhân viên (HttpOnly, Secure, SameSite=Lax, Path=/, không Domain). Method ghi cần thêm header `X-CSRF-Token` = `Me.csrfToken` và `Origin` hợp lệ. Dev HTTP dùng tên không tiền tố.
    guestSession:
      type: apiKey
      in: cookie
      name: __Host-ottimo_gsid
      description: Cookie phiên khách sau khi đổi token link (ADR-006); mức 1 hoặc 2. Origin guest-web riêng; không endpoint nào nhận cả cookie khách và nhân viên (SR-SES-09).
    providerSignature:
      type: apiKey
      in: header
      name: X-Provider-Signature
      description: |
        **Không phải API key và không có middleware chung** "có header là qua" (BUG-R1-SEC-05). Khai báo ở đây chỉ để đánh dấu operation webhook
        không dùng phiên; tên `X-Provider-Signature` là **danh nghĩa**. Vị trí và thuật toán chữ ký do **adapter từng cổng** kiểm theo đặc tả của cổng (INT 3.2):
        VNPay – query `vnp_SecureHash` (HMAC-SHA512); MoMo – trường `signature` trong body JSON (HMAC-SHA256 trên chuỗi trường theo thứ tự đặc tả);
        SePay/payOS – header/trường theo tài liệu cổng; Beds24 – theo cấu hình INT. Bí mật chọn theo (`provider`, cơ sở) qua `webhook_resolve_property`.
        Quy tắc: so sánh thời gian hằng; thiếu/sai chữ ký, provider `off`, cơ sở không khớp → **từ chối trước khi đọc/ghi dữ liệu nghiệp vụ** (fail-closed),
        phản hồi không lộ lý do; kiểm thêm số tiền/mã giao dịch với `payment` (chữ ký đúng chưa đủ – SR-PAY-01…05). Test hợp đồng: thiếu chữ ký → từ chối với từng provider.

  headers:
    ETag:
      description: Phiên bản bản ghi, dùng cho `If-Match`
      schema: { type: string, example: '"7"' }

  parameters:
    PropertyId:
      name: propertyId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    UserId:
      name: userId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    RoomId:
      name: roomId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    ReservationId:
      name: reservationId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    QuoteId:
      name: quoteId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    FolioId:
      name: folioId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    LineId:
      name: lineId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    PaymentId:
      name: paymentId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    GroupId:
      name: groupId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    ShiftId:
      name: shiftId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    ApprovalId:
      name: approvalId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    RegistrationId:
      name: registrationId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    DocumentId:
      name: documentId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    TaskId:
      name: taskId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    WorkOrderId:
      name: workOrderId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    RoomBlockId:
      name: roomBlockId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    ItemId:
      name: itemId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    GuestId:
      name: guestId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    ParameterKey:
      name: key
      in: path
      required: true
      description: Khóa tham số (erd mục 9), ví dụ `hold_hours_default`
      schema: { type: string, pattern: '^[a-z0-9_.<>]+$' }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        UUID do client sinh (PWA sinh khi xếp hàng offline). Giữ `idempotency_ttl_hours`. **Bắt buộc về nghiệp vụ** với mọi operation khai tham số này
        (trừ lần gọi `dryRun: true`): thiếu → middleware trả `428 PRECONDITION_REQUIRED` (khai `required: false` để validator spec không trả 422 – BE-ARC-11).
      schema: { type: string, format: uuid }
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: Giá trị `ETag` lần đọc gần nhất. Bắt buộc về nghiệp vụ (thiếu → `428 PRECONDITION_REQUIRED` do middleware), trừ lần tạo đầu của `setDoorCredential` và `dryRun`.
      schema: { type: string, example: '"7"' }
    PropertySlug:
      name: propertySlug
      in: path
      required: true
      description: Định danh cơ sở trong URL webhook (ADR-011) – chọn bí mật theo cơ sở
      schema: { type: string, pattern: '^[a-z0-9-]{2,40}$', example: dl01 }
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      schema: { type: string, enum: [vi, en, ru], default: vi }
    Cursor:
      name: cursor
      in: query
      required: false
      description: Con trỏ mờ từ `page.nextCursor`
      schema: { type: string, maxLength: 200 }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    DateFrom:
      name: from
      in: query
      required: false
      schema: { $ref: '#/components/schemas/LocalDate' }
    DateTo:
      name: to
      in: query
      required: false
      schema: { $ref: '#/components/schemas/LocalDate' }

  responses:
    ReservationOk:
      description: OK – đơn sau khi chuyển trạng thái
      headers:
        ETag: { $ref: '#/components/headers/ETag' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Reservation' }
    Unauthenticated:
      description: UNAUTHENTICATED / REAUTH_FAILED / REAUTH_REQUIRED (step-up hết cửa sổ) / GUEST_LINK_INVALID
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example: { type: /problems/unauthenticated, title: Cần đăng nhập, status: 401, code: UNAUTHENTICATED }
    ReauthFailed:
      description: |
        UNAUTHENTICATED (hết phiên – chuyển đăng nhập) **hoặc** REAUTH_FAILED (xác nhận lại sai – hiện lỗi ở ô mật khẩu, **không** đăng xuất). Client phân biệt
        theo `code`, không theo HTTP status (0.3.4 Q4). `REAUTH_FAILED` luôn kèm `errors[{field: <ô mật khẩu của operation>, code: REAUTH_FAILED}]`.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            reauthFailed:
              value: { type: /problems/reauth-failed, title: Mật khẩu xác nhận chưa đúng, status: 401, code: REAUTH_FAILED, errors: [{ field: currentPassword, code: REAUTH_FAILED }] }
            unauthenticated:
              value: { type: /problems/unauthenticated, title: Cần đăng nhập, status: 401, code: UNAUTHENTICATED }
    Forbidden:
      description: FORBIDDEN_ACTION / SELF_APPROVAL_FORBIDDEN / APPROVAL_LIMIT_EXCEEDED / DEVICE_NOT_TRUSTED / GUEST_VERIFICATION_REQUIRED / GUEST_STAY_ENDED – lần bị từ chối được ghi nhật ký
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example: { type: /problems/forbidden-action, title: Bạn không có quyền thực hiện thao tác này, status: 403, code: FORBIDDEN_ACTION }
    GuestForbidden:
      description: |
        App khách: `GUEST_VERIFICATION_REQUIRED` (cần phiên mức 2) hoặc `GUEST_STAY_ENDED` (đơn đã `checked_out` – operation có `x-after-checkout: blocked`,
        SR-GST-10/11). Operation `x-after-checkout: allowed` không trả `GUEST_STAY_ENDED`.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            stayEnded: { value: { type: /problems/guest-stay-ended, title: Kỳ lưu trú đã kết thúc, status: 403, code: GUEST_STAY_ENDED } }
            verificationRequired: { value: { type: /problems/guest-verification-required, title: Cần xác minh để xem nội dung này, status: 403, code: GUEST_VERIFICATION_REQUIRED } }
    NotFound:
      description: Không tồn tại, thuộc cơ sở khác hoặc ngoài phạm vi dữ liệu của vai
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example: { type: /problems/not-found, title: Không tìm thấy, status: 404, code: NOT_FOUND }
    Conflict:
      description: Xung đột nghiệp vụ (INVALID_TRANSITION, HOLD_EXPIRED, QUOTE_EXPIRED, DUPLICATE_GUEST, BALANCE_DUE, PENDING_APPROVALS, FOLIO_LOCKED, PAYMENT_NOT_CONFIGURED, REGISTRATION_INCOMPLETE, LATE_CHECKOUT_CONFLICT, IDEMPOTENCY_IN_PROGRESS, USERNAME_TAKEN, PARTY_DUPLICATE, ROOM_NOT_READY…)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: /problems/invalid-transition
            title: Không thể thực hiện với trạng thái hiện tại của đơn
            status: 409
            code: INVALID_TRANSITION
            currentState: cancelled
            allowedActions: []
    RoomUnavailable:
      description: |
        ROOM_UNAVAILABLE / ROOM_BLOCKED / ROOM_NOT_SELLABLE / ROOM_OCCUPIED – kèm đêm và đơn/khối đang chiếm (US-018 AC1). Thứ tự (0.3.5, A-03):
        căn ngừng bán/ngoài hiệu lực → `ROOM_NOT_SELLABLE`; (chỉ thao tác khóa phòng) đơn `in_house` giao khoảng khóa → `ROOM_OCCUPIED`;
        mọi phần tử `conflicts[]` là `kind=ooo` → `ROOM_BLOCKED`; còn lại → `ROOM_UNAVAILABLE`.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: /problems/room-unavailable
            title: Căn vừa được đặt
            status: 409
            code: ROOM_UNAVAILABLE
            detail: Căn 201 đã có đơn từ 20/10 đến 22/10
            conflicts:
              - roomNo: '201'
                nights: ['2026-10-21']
                kind: reservation
                reservationCode: OTM-00168
                guestDisplayName: Nguyễn T. Hà
            suggestions:
              - { roomId: 0192a1b0-0000-7000-8000-0000000c0202, roomNo: '202', roomGroupCode: L12, upgrade: false }
              - { roomId: 0192a1b0-0000-7000-8000-0000000c0401, roomNo: '401', roomGroupCode: NPLUS, upgrade: true }
    ValidationFailed:
      description: VALIDATION_FAILED và các lỗi dữ liệu nghiệp vụ 422 (CAPACITY_EXCEEDED, RATE_OUT_OF_RANGE, PHONE_REQUIRED, CARD_NUMBER_DETECTED, IDEMPOTENCY_KEY_REUSED…)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: /problems/validation-failed
            title: Dữ liệu chưa hợp lệ
            status: 422
            code: VALIDATION_FAILED
            errors:
              - { field: 'nightlyRates[0].amountVnd', code: RATE_OUT_OF_RANGE, message: 'Giá phải từ 530.000 đến 1.900.000' }
    VersionConflict:
      description: VERSION_CONFLICT – dữ liệu vừa thay đổi, tải lại
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example: { type: /problems/version-conflict, title: 'Dữ liệu vừa thay đổi, vui lòng tải lại', status: 412, code: VERSION_CONFLICT, currentVersion: 8 }
    PreconditionRequired:
      description: Thiếu `If-Match` hoặc `Idempotency-Key`
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    RateLimited:
      description: RATE_LIMITED
      headers:
        Retry-After: { schema: { type: integer } }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    # ── kiểu nền ──
    Uuid: { type: string, format: uuid }
    LocalDate: { type: string, format: date, description: 'Ngày theo giờ cơ sở (YYYY-MM-DD)' }
    LocalTime: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$', description: 'Giờ HH:mm theo giờ cơ sở', example: '14:00' }
    Instant: { type: string, format: date-time, description: 'Thời điểm ISO-8601 có offset, ví dụ 2026-10-15T14:30:00+07:00' }
    MoneyVnd: { type: integer, format: int64, description: Số nguyên VND (BR-004) }
    Percent: { type: number, description: 'Phần trăm, 15.5 = 15,5%' }
    Locale: { type: string, enum: [vi, en, ru] }
    Role:
      type: string
      enum: [owner, manager, front_desk_lead, front_desk, housekeeping, maintenance, sales_staff, collaborator]
    PageInfo:
      type: object
      required: [limit]
      properties:
        nextCursor: { type: [string, 'null'] }
        limit: { type: integer }
    FieldError:
      type: object
      required: [field, code]
      properties:
        field: { type: string, description: 'Đường dẫn JSON của trường, ví dụ nightlyRates[0].amountVnd' }
        code: { type: string, description: 'Mã lỗi trường – tập mở, bảng "Mã lỗi theo trường" ở info.description (0.3.1)' }
        message: { type: string }
    Problem:
      type: object
      description: RFC 9457 Problem Details + trường mở rộng
      required: [type, title, status, code]
      properties:
        type: { type: string, format: uri-reference, example: /problems/room-unavailable }
        title: { type: string, description: Tóm tắt theo Accept-Language }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string, format: uri-reference }
        code: { type: string, description: Mã máy đọc (bảng mã lỗi ở info.description) }
        requestId: { type: string }
        errors: { type: array, items: { $ref: '#/components/schemas/FieldError' } }
        min: { description: 'Với PARAM_OUT_OF_RANGE – biên dưới' }
        max: { description: 'PARAM_OUT_OF_RANGE – biên trên; CAPACITY_EXCEEDED – sức chứa tối đa của căn (0.3.5)' }
        allowed: { type: array, description: 'Với PARAM_OUT_OF_RANGE – tập giá trị cho phép (tham số dạng tập)', items: {} }
        conflicts:
          type: array
          description: |
            Với ROOM_UNAVAILABLE / ROOM_BLOCKED / ROOM_OCCUPIED – dựng bằng truy vấn sau khi rollback lỗi 23P01 (không đọc từ thông điệp lỗi DB);
            với CAPACITY_BELOW_BOOKINGS – các đơn vượt sức chứa mới (`reservationCode`, `stayFrom`, `stayTo`, `guestCount`). Phần tử theo `OccupancyConflict` (0.3.5).
          items: { $ref: '#/components/schemas/OccupancyConflict' }
        suggestions:
          type: array
          description: |
            ROOM_UNAVAILABLE / ROOM_BLOCKED / ROOM_OCCUPIED – căn trống thay thế (cùng nhóm trước, `upgrade=true` nếu nhóm cao hơn theo `room_group.sort_order`).
            **422 có lỗi trường `MIN_STAY_NOT_MET`** (0.3.5, A-05): căn trong nhóm mà khoảng ngày yêu cầu là **đêm lẻ** (BR-113 a) – `orphanNight=true`; rỗng/vắng = không có ngoại lệ.
          items:
            type: object
            required: [roomId, roomNo, upgrade]
            properties:
              roomId: { $ref: '#/components/schemas/Uuid' }
              roomNo: { type: string }
              roomGroupCode: { type: string }
              upgrade: { type: boolean }
              orphanNight: { type: boolean, description: 'Khoảng ngày yêu cầu là đêm lẻ của căn này (BR-113 ngoại lệ a). 0.3.5' }
        currentState:
          type: string
          description: |
            **Luôn có** với `409 INVALID_TRANSITION` (mọi operation – đơn, giao dịch, báo giá, khối OOO, phiếu sửa, việc HK, trạng thái buồng, check-in online):
            trạng thái hiện tại của đối tượng. Client tải lại và nêu trạng thái mới; PWA dùng để xếp mục hàng đợi vào "Đã áp dụng"/"Không áp dụng được". 0.3.5 (A-02)
        availableFrom:
          $ref: '#/components/schemas/Instant'
          description: '`409 INVALID_TRANSITION` của hành động mở theo giờ (R2: `markNoShow` – mốc `no_show_mark_time` của ngày đến, BR-311): thời điểm sớm nhất được làm. 0.3.5 (A-04)'
        allowedActions:
          type: array
          description: '`409 INVALID_TRANSITION` của đơn – hành động hợp lệ hiện tại (tùy chọn; client vẫn nên tải lại đơn). 0.3.5'
          items: { $ref: '#/components/schemas/AllowedAction' }
        expiredAt:
          $ref: '#/components/schemas/Instant'
          description: '`409 HOLD_EXPIRED` – lúc giữ chỗ hết hạn; `409 QUOTE_EXPIRED` – lúc báo giá hết hiệu lực. 0.3.5 (A-02)'
        depositRequiredVnd:
          $ref: '#/components/schemas/MoneyVnd'
          description: '`422 DEPOSIT_INSUFFICIENT` – cọc tối thiểu BR-305 của đơn. 0.3.5 (A-02)'
        depositPaidVnd:
          $ref: '#/components/schemas/MoneyVnd'
          description: '`422 DEPOSIT_INSUFFICIENT` – tổng cọc đã ghi nhận (`createReservation`: số tiền `initialPayment`, 0 nếu không gửi). 0.3.5 (A-02)'
        shortfallVnd:
          $ref: '#/components/schemas/MoneyVnd'
          description: '`422 DEPOSIT_INSUFFICIENT` – còn thiếu (= depositRequiredVnd − depositPaidVnd). 0.3.5 (A-15)'
        roomNo:
          type: string
          description: '`ROOM_NOT_SELLABLE`, `CAPACITY_EXCEEDED` – số căn liên quan. 0.3.5 (A-02)'
        currentVersion:
          type: integer
          description: '`412 VERSION_CONFLICT` – phiên bản hiện tại (có trong ví dụ từ 0.2; khai báo chính thức 0.3.5)'
        minStayNights:
          type: integer
          description: '422 có lỗi trường `MIN_STAY_NOT_MET` – số đêm tối thiểu áp cho ngày đến (BR-113). 0.3.5 (A-15)'
        dates:
          type: array
          items: { $ref: '#/components/schemas/LocalDate' }
          description: '422 có lỗi trường `RATE_OUT_OF_RANGE`/`RATE_OUT_OF_RANGE_WARNING` – các đêm có giá ngoài sàn–trần (BR-105). 0.3.5 (A-15)'
        expected:
          type: string
          description: '422 `moveReservation` gán căn đơn OTA xung đột – giá trị `overbookingResolution` đúng theo nhóm căn mới (`reassigned_same_group` | `upgraded`). 0.3.5 (A-15)'
        documentId:
          $ref: '#/components/schemas/Uuid'
          description: '`409 DOCUMENT_UNCLAIMED_EXISTS` – giấy tờ đang chờ gắn người trùng số (0.3.7, S4-39)'
        personIndex:
          type: integer
          minimum: 1
          description: '`409 DOCUMENT_UNCLAIMED_EXISTS` – ô "Khách n" của giấy tờ đó (0.3.7)'
        personIndexes:
          type: array
          items: { type: integer, minimum: 2 }
          description: '422 `removePartyMember` thiếu `guestUploadPersonIndex` – các ô "Khách n" đang chưa gắn người (chỉ số, không ảnh/tên – 0.3.7, S4-39)'
        parentOnlyAvailable:
          type: boolean
          description: '`409 ROOM_UNAVAILABLE` của `changeRoom` do đêm đơn con – căn mới trống tới hết đơn gốc, gửi lại với `stayScope = until_parent_departure` nếu khách đồng ý (0.3.7, S4-09)'
        missingCount:
          type: integer
          minimum: 1
          description: '`409 REGISTRATION_INCOMPLETE` – số người còn thiếu giấy tờ được tính (0.3.7)'
      additionalProperties: true
    OccupancyConflict:
      type: object
      description: |
        Phần tử `Problem.conflicts[]` (0.3.5, A-02). ROOM_*: `roomNo`, `nights`, `kind`, `reservationCode` (khi `kind` ≠ `ooo`), `guestDisplayName` (chỉ FD+).
        CAPACITY_BELOW_BOOKINGS: `reservationCode`, `stayFrom`, `stayTo`, `guestCount`.
      properties:
        roomNo: { type: string }
        nights: { type: array, items: { $ref: '#/components/schemas/LocalDate' } }
        kind: { type: string, enum: [reservation, hold, ooo] }
        reservationCode: { type: string, example: OTM-00168 }
        guestDisplayName:
          type: string
          x-rbac-field: D01
          x-visible-to: [owner, manager, front_desk_lead, front_desk]
        stayFrom: { $ref: '#/components/schemas/LocalDate' }
        stayTo: { $ref: '#/components/schemas/LocalDate' }
        guestCount: { type: integer }
      additionalProperties: true
    AllowedAction:
      type: object
      required: [event, transition, action]
      description: |
        `event` = mã sự kiện máy đọc của BA (state-machines.md mục 18, ví dụ `check_in`, `confirm_deposit`, `mark_sent`);
        `transition` = mã chuyển (B9, B4, K6…); `action` = đoạn đường dẫn `…/actions/<action>` (kebab-case) để client gọi.
        Bảng ánh xạ event ↔ action sinh trong `packages/contracts/src/state-machines/*.ts` từ state-machines.md.
      properties:
        event: { type: string, pattern: '^[a-z][a-z0-9_]*$', example: check_in }
        transition: { type: string, example: B9 }
        action: { type: string, description: 'Đường dẫn hành động (check-in, cancel, confirm-deposit…)', example: check-in }
        requiresApproval: { type: boolean, description: 'Vai hiện tại gửi được nhưng cần duyệt (ký hiệu D trong rbac)' }
        requiresTrustedDevice: { type: boolean, description: 'Hành động cần thiết bị tin cậy (vd. B9 nhận phòng – xem giấy tờ)' }

    # ── trạng thái (erd mục 5) ──
    ReservationStatus: { type: string, enum: [hold, confirmed, in_house, checked_out, cancelled, no_show] }
    RoomBlockStatus: { type: string, enum: [planned, active, released, cancelled] }
    RoomStatusCode: { type: string, enum: [VC, VI, VD, CL, OC, OD, OOO] }
    # ── nhóm đơn (SM-16) và ca làm việc (SM-17) – hợp đồng R2 W1, cài đặt R3 ──
    BillNo: { type: string, pattern: '^F\d{2}-\d{6,}$', example: F26-000123, description: 'Số bill server cấp (BR-007, erd mục 10) – `F` + 2 số năm + số thứ tự ≥ 6 chữ số, không đặt lại theo ngày' }
    ReservationGroupStatus: { type: string, enum: [open, closed], description: 'SM-16 (erd `reservation_group.status`)' }
    ShiftStatus: { type: string, enum: [open, closing, closed], description: 'SM-17 (erd `shift.status`)' }
    ReservationGroupSummary:
      type: object
      required: [id, code, status, reservationCount]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        code: { type: string, pattern: '^NH-\d{5,}$', example: NH-00012 }
        status: { $ref: '#/components/schemas/ReservationGroupStatus' }
        bookerDisplayName: { type: string, x-rbac-field: D01 }
        reservationCount: { type: integer, minimum: 0 }
        arrivalDate: { $ref: '#/components/schemas/LocalDate' }
        departureDate: { $ref: '#/components/schemas/LocalDate' }
        holdExpiresAt: { $ref: '#/components/schemas/Instant' }
        roomingListDueDate: { $ref: '#/components/schemas/LocalDate' }
    ReservationGroup:
      allOf:
        - $ref: '#/components/schemas/ReservationGroupSummary'
        - type: object
          required: [reservations, version]
          properties:
            booker: { $ref: '#/components/schemas/GuestSummary' }
            payer: { $ref: '#/components/schemas/GuestSummary' }
            closerUserId: { $ref: '#/components/schemas/Uuid' }
            reservations: { type: array, items: { $ref: '#/components/schemas/ReservationSummary' } }
            depositRequiredVnd:
              $ref: '#/components/schemas/MoneyVnd'
              description: 'Tổng cọc nhóm theo BR-305, làm tròn ở cấp nhóm (BR-322)'
            depositAllocatedVnd: { $ref: '#/components/schemas/MoneyVnd' }
            allocations:
              type: array
              x-visible-to: [owner, manager, front_desk_lead, front_desk, sales_staff]
              items: { $ref: '#/components/schemas/PaymentAllocation' }
            roomingListMissing:
              type: array
              description: 'Đơn căn chưa có tên khách trước hạn BR-323 → "Cần chú ý" (US-140 AC4)'
              items: { $ref: '#/components/schemas/Uuid' }
            closedAt: { $ref: '#/components/schemas/Instant' }
            allowedActions: { type: array, items: { $ref: '#/components/schemas/AllowedAction' } }
            version: { type: integer }
    ReservationGroupCreate:
      type: object
      required: [bookerGuestId]
      description: 'Đúng một trong hai: `reservationIds` (≥ 2) hoặc `rooms` (≥ 2)'
      properties:
        bookerGuestId: { $ref: '#/components/schemas/Uuid' }
        payerGuestId: { $ref: '#/components/schemas/Uuid' }
        quoteId: { $ref: '#/components/schemas/Uuid' }
        reservationIds: { type: array, minItems: 2, uniqueItems: true, items: { $ref: '#/components/schemas/Uuid' } }
        rooms: { type: array, minItems: 2, items: { $ref: '#/components/schemas/ReservationCreate' } }
    PaymentAllocation:
      type: object
      required: [reservationId, amountVnd]
      properties:
        reservationId: { $ref: '#/components/schemas/Uuid' }
        reservationCode: { type: string, example: OTM-00171 }
        amountVnd: { $ref: '#/components/schemas/MoneyVnd' }
    GroupDepositInput:
      type: object
      required: [payment]
      properties:
        payment: { $ref: '#/components/schemas/PaymentCreate' }
        allocations:
          type: array
          description: 'Bỏ trống → phân bổ theo tỷ lệ tiền phòng, phần lẻ dồn căn cuối (BR-322). Σ phải = `payment.amountVnd`'
          items: { $ref: '#/components/schemas/PaymentAllocation' }
        dryRun: { type: boolean, default: false }
    Shift:
      type: object
      required: [id, userId, status, openedAt, openingCashVnd, version]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        userId: { $ref: '#/components/schemas/Uuid' }
        userDisplayName: { type: string, x-rbac-field: D27 }
        status: { $ref: '#/components/schemas/ShiftStatus' }
        businessDate: { $ref: '#/components/schemas/LocalDate' }
        openedAt: { $ref: '#/components/schemas/Instant' }
        openingCashVnd: { $ref: '#/components/schemas/MoneyVnd' }
        closingStartedAt: { $ref: '#/components/schemas/Instant' }
        expectedCashVnd: { $ref: '#/components/schemas/MoneyVnd' }
        countedCashVnd: { $ref: '#/components/schemas/MoneyVnd' }
        varianceVnd: { type: integer, format: int64, description: 'counted − expected; âm = thiếu' }
        varianceReason: { type: string }
        closedAt: { $ref: '#/components/schemas/Instant' }
        handoverAcknowledgedBy: { $ref: '#/components/schemas/Uuid' }
        reviewedByName: { type: string, x-visible-to: [owner, manager, front_desk_lead] }
        reviewedAt: { $ref: '#/components/schemas/Instant' }
        allowedActions: { type: array, items: { $ref: '#/components/schemas/AllowedAction' } }
        version: { type: integer }
    ShiftReport:
      type: object
      required: [shift, totalsByMethod, carryOver, carryOverVersion]
      properties:
        shift: { $ref: '#/components/schemas/Shift' }
        totalsByMethod:
          type: array
          description: 'Tổng thu của ca theo cách thanh toán (BR-521, A44)'
          items:
            type: object
            required: [method, amountVnd, count]
            properties:
              method: { $ref: '#/components/schemas/PaymentMethod' }
              amountVnd: { $ref: '#/components/schemas/MoneyVnd' }
              count: { type: integer }
        pendingReconciliation:
          type: array
          description: 'Chuyển khoản ghi tay `reconciliation=pending` trong ca (BR-527, US-124 AC2)'
          items: { $ref: '#/components/schemas/Payment' }
        carryOver:
          type: object
          description: 'Việc tồn bàn giao ca sau (BR-526 d)'
          properties:
            registrationsNotSent: { type: array, items: { $ref: '#/components/schemas/Uuid' } }
            arrivalsNotArrived: { type: array, items: { $ref: '#/components/schemas/Uuid' } }
            openGuestRequests: { type: array, items: { $ref: '#/components/schemas/Uuid' } }
            highPriorityWorkOrders: { type: array, items: { $ref: '#/components/schemas/Uuid' } }
            restoredNoShows: { type: array, items: { $ref: '#/components/schemas/Uuid' } }
            selfAppliedFocLineIds: { type: array, items: { $ref: '#/components/schemas/Uuid' } }
            roomStatusMismatches: { type: array, items: { type: string }, description: 'Số căn lệch buồng – đơn (BR-806)' }
        carryOverVersion: { type: integer, description: 'Tăng khi danh sách việc tồn đổi; `closeShift` phải gửi lại đúng số này' }
        handoverNote: { type: string }
    WorkOrderStatus: { type: string, enum: [new, in_progress, waiting_parts, done, cancelled] }
    RegistrationStatus: { type: string, enum: [none, pre, partial, review, scanned, sent, confirmed, needs_update, updated, void] }
    LeaseContractStatus: { type: string, enum: [signed, active, terminating, settling, closed, cancelled] }
    BillingPeriodStatus: { type: string, enum: [scheduled, due_soon, due, overdue, escalated, paid, waived] }
    QuoteStatus: { type: string, enum: [active, expired, converted, withdrawn] }
    LeadStatus: { type: string, enum: [new, quoted, holding, won, lost] }
    ApprovalStatus: { type: string, enum: [pending, approved, rejected, escalated, cancelled] }
    CommissionStatus: { type: string, enum: [projected, earned, payable, paid, void] }
    PaymentStatus: { type: string, enum: [pending, succeeded, failed, expired, reversed] }
    FolioStatus: { type: string, enum: [open, settled, closed] }
    HkTaskStatus: { type: string, enum: [open, in_progress, done, cancelled] }
    GuestRequestStatus: { type: string, enum: [new, acknowledged, in_progress, done, declined] }
    ConflictState: { type: string, enum: [none, open, resolved], description: 'Đơn OTA xung đột (erd mục 7)' }
    Severity: { type: string, enum: [high, medium, low] }
    WorkOrderCategory:
      type: string
      enum: [hot_water, power, leak, door_lock, wifi, broken_item, drain, other]
      description: |
        0.3.7 (B-09, BA EP07-08 5.1; `drain` – DOM D-12 f, BA E07-17): loại sự cố, gợi ý mức mặc định BR-809 – nhóm Cao (`hot_water`, `power`, `leak`, `door_lock`, `drain`) khi căn có
        khách đang ở; khách dài hạn + `wifi`/`hot_water` nâng một bậc. Người tạo đổi được mức.
    CancelReasonCode:
      type: string
      description: |
        Danh mục BR-308 v0.2 (DOM) – dùng chung mọi luồng hủy. Mã hệ thống: `hold_expired` (J1), `ota_cancelled` (kênh báo hủy, BR-310),
        `overbooking_relocated` (dời khách, BR-312). DATA K-22a loại `hold_expired`, `overbooking_relocated`, `ota_cancelled` khỏi tử số chính
      enum: [guest_cancelled, guest_changed_mind, found_other, price, date_change, unreachable, hold_expired, ota_cancelled, overbooking_relocated, group_partial, other]
    DocType: { type: string, enum: [cccd, passport, child_personal_id, other] }
    DocumentCheckCode:
      type: string
      enum: [name_match, passport_valid_through_departure, visa_valid_through_departure, stay_within_visa, party_count, passport_valid_at_arrival, visa_valid_at_arrival, entry_record_present]
      description: '0.3.3 (E06-01) thêm 3 mục BR-613 (c) – kết quả `fail` → `blocking=true` → `Registration.blocksDoorCode`: `passport_valid_at_arrival`, `visa_valid_at_arrival`, `entry_record_present`. Mục thị thực/nhập cảnh/hộ chiếu chỉ áp khách NN; khách VN → `not_applicable`'
    DocumentCheckResult:
      type: string
      enum: [pass, fail, unverified, not_applicable, ok, warning]
      description: |
        US-044 AC2 (0.3.3, E06-01): **3 kết quả hiển thị** `pass` (Đạt) · `fail` (Không đạt) · `unverified` (Chưa kiểm được – thiếu dữ liệu, cần kiểm tay);
        `not_applicable` client **ẩn** dòng. Không bao giờ trả `pass` khi thiếu dữ liệu. `ok`, `warning` là giá trị của ≤ 0.3.2 – **deprecated**, server 0.3.3 không trả.
    HkTaskType:
      type: string
      enum: [checkout_clean, stayover_clean, long_stay_clean, minibar_refill, guest_request, after_repair_clean, adhoc_clean, priority_clean, extra_guest_kit_prepare, extra_guest_kit_collect, extra_guest_kit_transfer]
      description: |
        0.3.1 thêm 3 loại **bộ đồ dùng cho người ngủ sofa** (BR-812, ESC-014) – **chỉ hệ thống sinh** (`source=system`), luôn có `reservationId`, `quantity`, `dueAt`:
        `extra_guest_kit_prepare` (chuẩn bị – đơn vào `confirmed` có `extraCount > 0`: B2, B4, B7, B7a, B12; hạn = giờ nhận phòng của đơn);
        `extra_guest_kit_collect` (thu hồi – đơn đổi/giảm người/hủy sau khi đã chuẩn bị; thu hồi lúc trả phòng là một dòng trong `checkout_clean`);
        `extra_guest_kit_transfer` (chuyển bộ sang căn mới khi đổi phòng đang ở B14). Sinh/hủy/chuyển trong **cùng giao dịch** với chuyển trạng thái đơn.
    GuestRequestType: { type: string, enum: [extra_cleaning, amenities, report_issue, transport_tour, late_checkout, other] }
    PaymentMethod: { type: string, enum: [vietqr, bank_transfer, cash, card_pos, vnpay, momo, ota_collect] }
    PaymentType: { type: string, enum: [charge, deposit, security_deposit, refund, deposit_deduction] }
    FolioLineCategory:
      type: string
      enum: [room, early_checkin, late_checkout, extra_person, minibar, fnb, laundry, cleaning, service_fee, utilities, penalty, damage, cancellation_fee, no_show_fee, early_departure_fee, deposit_forfeit, discount, foc, adjustment, room_change_difference]
      description: '`room_change_difference` (0.3.6, BA E04-05): chênh lệch đổi phòng đơn OTA do khách yêu cầu, thu tại quầy'

    # ── người dùng ──
    PropertyRole:
      type: object
      required: [propertyId, role]
      properties:
        propertyId: { $ref: '#/components/schemas/Uuid' }
        role: { $ref: '#/components/schemas/Role' }
    Me:
      type: object
      required: [id, displayName, csrfToken, properties]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        displayName: { type: string }
        csrfToken: { type: string }
        activePropertyId: { $ref: '#/components/schemas/Uuid' }
        properties:
          type: array
          items:
            type: object
            required: [propertyId, name, timezone, roles, screens]
            properties:
              propertyId: { $ref: '#/components/schemas/Uuid' }
              name: { type: string }
              timezone: { type: string }
              roles: { type: array, items: { $ref: '#/components/schemas/Role' } }
              screens:
                type: array
                items: { type: string }
                description: |
                  Mã màn hình S01…S31 để dựng menu (rbac mục 3). Nguyên tắc (0.3.4 Q8): một màn có trong danh sách khi vai có ✔ hoặc ◐ **và** ở round hiện tại
                  có ít nhất một operation của màn đó (theo `x-roles`) vai được gọi. Ô ◐ chỉ gồm thao tác "của mình" đặt ở menu người dùng (đổi mật khẩu, PIN, 2FA,
                  phiên của mình) **không** tính là màn. R2: `manager` **không** có `S26`. Client không tự suy màn từ tên vai.
              deviceTrusted: { type: boolean, description: 'Thiết bị đang dùng đã được owner cấp (cookie `__Host-ottimo_did`) – FE ẩn nút C3 khi false; server vẫn kiểm (SR-DEV-05)' }
        mustChangePassword: { type: boolean, description: 'Mật khẩu tạm – chỉ cho đổi mật khẩu (SR-AUTH-05)' }
        mfaEnabled: { type: boolean }
        mfaRequiredButMissing: { type: boolean, description: 'Vai owner/manager chưa bật 2FA (R3 – nhắc bắt buộc trước khi đưa dữ liệu thật)' }
    User:
      type: object
      required: [id, username, displayName, status, roles, version]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        username: { type: string }
        displayName: { type: string }
        status: { type: string, enum: [active, locked, disabled] }
        roles: { type: array, items: { $ref: '#/components/schemas/PropertyRole' } }
        lastLoginAt: { $ref: '#/components/schemas/Instant' }
        version: { type: integer }
    UserCreate:
      type: object
      required: [username, displayName, initialPassword, roles]
      properties:
        username: { type: string, minLength: 3, maxLength: 64 }
        displayName: { type: string }
        phone: { type: string, x-rbac-field: D27 }
        initialPassword: { type: string, writeOnly: true, minLength: 10, maxLength: 256, description: 'V-10 (khớp `newPassword`); 0.3.1 nâng từ 8' }
        roles: { type: array, minItems: 1, items: { $ref: '#/components/schemas/PropertyRole' } }

    # ── nền tảng ──
    RoomGroup:
      type: object
      required: [id, code, name, sortOrder, maxOccupancy]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        code: { type: string, example: L12 }
        name: { type: string, example: Lầu 1–2 }
        sortOrder: { type: integer }
        baseOccupancy: { type: integer, description: 'Định mức **mặc định khi tạo căn** của nhóm (BR-110); định mức thật là `Room.baseOccupancy`' }
        maxOccupancy: { type: integer, description: 'Sức chứa mặc định khi tạo căn; sức chứa thật là `Room.maxOccupancy`' }
    Room:
      type: object
      required: [id, roomNo, roomGroupId, isSellable, version]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        roomNo: { type: string, example: '201' }
        name:
          type: string
          example: The Pine
          description: |
            Tên phòng hiển thị (BR-012; `room.<no>.name`) – tiếng Anh ở mọi ngôn ngữ (Brand Guidelines). **Chữ khách nhìn thấy** chỉ dùng tên (không số căn); **màn nhân viên**
            hiện "{roomNo} · {name}" (helper `roomLabel()`, DS C34). Tìm theo tên: không phân biệt hoa/thường và dấu, bỏ tiền tố "The " (`pine` → 401). Vắng = OWN chưa nhập
            (client hiện số căn). Ánh xạ tạm BL 4.1 tới khi INV gửi bảng ghép; đổi tên chỉ sửa căn, không sửa đơn – bill đã chốt giữ tên lúc chốt. 0.3.7 bổ sung D1 (mô tả)
        publicRoomType:
          type: [string, 'null']
          minLength: 1
          maxLength: 60
          example: Standard Studio · Garden View
          description: |
            0.3.7 bổ sung D1 (BR-012 (1), (4); S4-52): **hạng phòng công khai** `room.<no>.public_room_type` – một trong 4 hạng của e-brochure, chữ tiếng Anh như tên phòng.
            Khách thấy khi cần mô tả căn, và **thay tên phòng** khi đơn chưa báo căn (`Reservation.roomDisclosedToGuest = false`) hoặc trong tin Zalo tự động (SEC INT-10).
            `null` = chưa nhập [GIẢ ĐỊNH – chờ bảng ghép INV 19/10]
        roomGroupId: { $ref: '#/components/schemas/Uuid' }
        floor: { type: integer }
        baseOccupancy:
          type: integer
          minimum: 1
          maximum: 10
          description: 'Định mức – số người (người lớn + trẻ 6–11) đã gồm trong giá; thuộc tính **từng căn** (BR-110 v0.3.1: Studio 2; 301, 401: 4; 302, 402: 3). Trẻ dưới 6 tuổi không tính. 0.3.1'
          x-visible-to: [owner, manager, front_desk_lead, front_desk, sales_staff, collaborator]
        maxOccupancy:
          type: integer
          minimum: 1
          maximum: 11
          description: 'Sức chứa tối đa = `baseOccupancy` hoặc `baseOccupancy` + 1 (ESC-014: một người ngủ sofa); trẻ dưới 6 tuổi không tính'
          x-visible-to: [owner, manager, front_desk_lead, front_desk, sales_staff, collaborator]
        bedSetup: { type: string, maxLength: 100, example: 1 giường đôi 1m8 + sofa giường, description: 'Bố trí giường (C0, văn bản một ngôn ngữ ở R2) – erd 4.1 `bed_setup`; 0.3.4 Q6' }
        bedCount: { type: integer, minimum: 1, maximum: 10, description: 'Số giường (BR-110) – erd 4.1 `bed_count`; 0.3.4 Q6' }
        areaM2: { type: integer, minimum: 1, description: 'Diện tích m² – erd 4.1 `area_m2`; 0.3.4 Q6' }
        isSellable: { type: boolean }
        activeFrom: { $ref: '#/components/schemas/LocalDate' }
        activeTo: { type: [string, 'null'], format: date }
        currentListPrice:
          type: object
          x-visible-to: [owner, manager, front_desk_lead, front_desk, sales_staff, collaborator]
          properties:
            effectiveFrom: { $ref: '#/components/schemas/LocalDate' }
            monthlyListPriceVnd: { $ref: '#/components/schemas/MoneyVnd' }
            nightlyListPriceVnd: { $ref: '#/components/schemas/MoneyVnd' }
        version: { type: integer }
    RoomInput:
      type: object
      required: [roomNo, roomGroupId, monthlyListPriceVnd]
      description: |
        Bỏ trống `baseOccupancy` → lấy `room_group.base_occupancy`; bỏ trống `maxOccupancy` → `baseOccupancy` + 1 (ESC-014).
        `maxOccupancy` ∉ {`baseOccupancy`, `baseOccupancy` + 1} → `422 VALIDATION_FAILED` mã trường `MAX_OCCUPANCY_RANGE`.
      properties:
        roomNo: { type: string, pattern: '^[0-9A-Z]{1,6}$' }
        name: { type: string, description: 'Tên phòng (BR-012) – xem `Room.name`' }
        publicRoomType: { type: string, minLength: 1, maxLength: 60, description: '0.3.7 bổ sung D1 (BR-012, S4-52) – xem `Room.publicRoomType`' }
        roomGroupId: { $ref: '#/components/schemas/Uuid' }
        floor: { type: integer }
        baseOccupancy: { type: integer, minimum: 1, maximum: 10 }
        maxOccupancy: { type: integer, minimum: 1, maximum: 11 }
        bedSetup: { type: string, maxLength: 100 }
        bedCount: { type: integer, minimum: 1, maximum: 10 }
        areaM2: { type: integer, minimum: 1 }
        monthlyListPriceVnd: { $ref: '#/components/schemas/MoneyVnd' }
        activeFrom: { $ref: '#/components/schemas/LocalDate' }
    RoomPatch:
      type: object
      properties:
        name: { type: string, description: 'Tên phòng (BR-012) – đổi chỉ áp cho chữ hiển thị từ lúc lưu; bill đã chốt giữ tên cũ' }
        publicRoomType: { type: [string, 'null'], minLength: 1, maxLength: 60, description: '0.3.7 bổ sung D1 (BR-012, S4-52); `null` = xóa' }
        bedSetup: { type: [string, 'null'], maxLength: 100, description: '0.3.4 Q6; `null` = xóa' }
        bedCount: { type: [integer, 'null'], minimum: 1, maximum: 10 }
        areaM2: { type: [integer, 'null'], minimum: 1 }
        roomGroupId: { $ref: '#/components/schemas/Uuid' }
        baseOccupancy:
          type: integer
          minimum: 1
          maximum: 10
          description: |
            Đổi định mức chỉ áp cho đơn/báo giá tạo **sau** khi lưu (đơn đã có giữ định mức trong `pricing_snapshot` – BR-006).
            Kiểm lại `maxOccupancy` (giá trị gửi kèm hoặc giá trị hiện tại) ∈ {định mức, định mức + 1} → nếu không `MAX_OCCUPANCY_RANGE`.
        maxOccupancy:
          type: [integer, 'null']
          minimum: 1
          maximum: 11
          description: '`null` = đặt lại `baseOccupancy` + 1. Giảm dưới số người tính sức chứa của đơn tương lai/đang ở → `409 CAPACITY_BELOW_BOOKINGS`'
        isSellable: { type: boolean }
        activeTo: { type: [string, 'null'], format: date }
        listPrice:
          type: object
          required: [effectiveFrom, monthlyListPriceVnd, reason]
          properties:
            effectiveFrom: { $ref: '#/components/schemas/LocalDate' }
            monthlyListPriceVnd: { $ref: '#/components/schemas/MoneyVnd' }
            nightlyListPriceVnd: { $ref: '#/components/schemas/MoneyVnd' }
            reason: { type: string }
    Channel:
      type: object
      required: [id, code, name, channelGroup, isActive]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        code: { type: string, example: agoda, description: 'Mã kênh (UK theo cơ sở). Nhóm `direct` có **đúng một** kênh mã `direct`; nguồn chi tiết ở `Reservation.directSource` (0.3.5, A-08 – đóng erd E8)' }
        name: { type: string }
        channelGroup: { type: string, enum: [direct, agent, ota, internal] }
        requiresOtaRef: { type: boolean }
        isActive: { type: boolean }
        commissionRatePct:
          $ref: '#/components/schemas/Percent'
          x-visible-to: [owner, manager, front_desk_lead, front_desk]
    Parameter:
      type: object
      required: [key, value, effectiveFrom]
      properties:
        key: { type: string, example: hold_hours_default }
        value: { description: 'Giá trị theo schema của khóa' }
        effectiveFrom: { $ref: '#/components/schemas/LocalDate' }
        statusLabel: { type: string, pattern: '^[A-Z0-9-]{1,16}(\+[A-Z0-9-]{1,16}){0,3}$', example: INV-006+NGANH, description: 'Mã nhãn BR mục 13, ghép bằng `+` (GD = chờ INV xác nhận; NGANH; PL = chờ luật sư/kế toán; mã ESC/INV như `INV-004`). Là mã, client tự dịch; mã lạ hiện nguyên văn. 0.3.2: bỏ enum đóng (DS-E dùng `INV-004+GD`)' }
        brRef: { type: string, example: BR-302 }
        editableBy: { type: array, items: { $ref: '#/components/schemas/Role' } }
        changedBy: { type: string }
        changedAt: { $ref: '#/components/schemas/Instant' }
        reason: { type: string }

    # ── tổng quan ──
    TonightKpi:
      type: object
      required: [businessDate, roomsTotal, availableRoomsNet, occupiedRooms, occupancyPct]
      properties:
        businessDate: { $ref: '#/components/schemas/LocalDate' }
        roomsTotal: { type: integer }
        roomsSellable: { type: integer }
        oooRooms: { type: integer }
        availableRoomsNet: { type: integer, description: 'Mẫu số thuần (metrics Q-04)' }
        occupiedRooms: { type: integer, description: 'Số căn có đêm `sold` **đã gán căn** (`room_id IS NOT NULL`) – K-02' }
        holdOnlyRooms: { type: integer }
        arrivals: { type: integer, description: 'Đơn có ngày đến = ngày nghiệp vụ, `confirmed` hoặc `in_house` đã nhận hôm nay (BR-404) – không `hold`/`cancelled`/`no_show` (0.3.7 ghi rõ, B-19)' }
        arrivalsCheckedIn: { type: integer, description: '0.3.7 (B-19, BA E01-02): trong `arrivals`, số đã nhận phòng – hiện "{đã nhận}/{tổng}"' }
        departures: { type: integer, description: 'Đơn có ngày đi = ngày nghiệp vụ, `in_house` hoặc `checked_out` hôm nay (BR-404) (0.3.7 ghi rõ). 0.3.7 bổ sung 1: đơn chính theo **ngày đi hiệu lực** của lượt ở (đơn con gia hạn → ngày đi của đơn con) – cùng bộ đọc với `getArrivalsDepartures.departures`' }
        departuresCheckedOut: { type: integer, description: '0.3.7 (B-19): trong `departures`, số đã trả phòng' }
        inHouse: { type: integer, description: '0.3.7 bổ sung 1: số **lượt ở** (đơn chính `in_house`) – đơn con B9a/B13 không đếm riêng' }
        occupancyPct: { type: [number, 'null'], description: 'K-03 = đêm sold đã gán căn ÷ đêm khả dụng thuần; luôn ≤ 100%; null khi mẫu số = 0 (hiển thị "–", Q-15)' }
        unassignedConflictReservations: { type: integer, description: 'Số đơn OTA xung đột chưa gán căn có đêm hôm nay (**S1c** – metrics Q-05; sửa từ S1b ở 0.3.7, B-18) – hiện riêng, không cộng vào công suất (DATA FB-03)' }
        denominatorNote: { type: string }
        metricRefs:
          type: object
          description: Mã chỉ số (metrics-definitions) cho từng trường – S9
          additionalProperties: { type: string }
    ArrivalsDepartures:
      type: object
      required: [date, arrivals, departures, holdsArrivingToday]
      properties:
        date: { $ref: '#/components/schemas/LocalDate' }
        arrivals:
          type: array
          description: '0.3.7 bổ sung 1: đơn chính có ngày đến = `date` (`confirmed` chưa nhận, `in_house` đã nhận) – đơn con B9a/B13 không thành dòng riêng'
          items:
            allOf:
              - $ref: '#/components/schemas/ReservationSummary'
              - type: object
                properties:
                  allowedActions:
                    type: array
                    description: '0.3.7 (B-20, BA E01-03): chỉ `check_in` (B9) khi người gọi làm được lúc này, kèm `requiresTrustedDevice`; rỗng = chỉ mở đơn'
                    items: { $ref: '#/components/schemas/AllowedAction' }
        departures:
          type: array
          description: |
            0.3.7 bổ sung 1 (BE-D s4 2.5 #4): đơn chính `in_house`/`checked_out` của lượt ở có **ngày đi hiệu lực** = `date`. Trên mỗi dòng `departureDate` = **ngày đi hiệu lực**
            (ngày đi muộn nhất của đơn chính và các đơn con gia hạn còn hiệu lực – không phải ngày đi riêng của đơn chính), `nights` = từ `arrivalDate` tới ngày đi hiệu lực,
            `roomNo` = căn của đêm cuối; `id`/`code` = đơn chính (B18 gọi trên đơn chính).
          items:
            allOf:
              - $ref: '#/components/schemas/ReservationSummary'
              - type: object
                properties:
                  reminderState: { $ref: '#/components/schemas/DepartureReminderState' }
                  hasArrivalSameRoomToday: { type: boolean }
                  allowedActions:
                    type: array
                    description: '0.3.7 (B-20): chỉ `check_out` (B18) khi người gọi làm được lúc này (gồm cửa sổ sau nửa đêm); rỗng = chỉ mở đơn'
                    items: { $ref: '#/components/schemas/AllowedAction' }
        holdsArrivingToday: { type: array, items: { $ref: '#/components/schemas/ReservationSummary' } }
    DepartureReminderState:
      type: string
      description: 'US-031 – tính theo checkout_reminders và giờ VN thật'
      enum: [reminded_waiting, replied, call_needed, overdue, checked_out]
    AttentionItem:
      type: object
      required: [kind, source, severity]
      properties:
        kind:
          type: string
          enum: [vip_arrival, room_ooo, rent_due_soon, lease_expiring, registration_due, registration_overdue, visa_expiring, work_order_high_open, hold_expiring, meter_not_read, channel_sync_error, foc_threshold, overbooking, unassigned_with_free_room, data_quality, deposit_after_cancel, no_show_call, no_show_mark, security_alert, capacity_conflict, work_order_overdue, extra_guest_kit_overdue, room_status_mismatch, reconcile_overdue, ooo_ending_work_open, guest_request_overdue, ota_no_show_report, closed_reservation_credit, website_request_new]
          description: |
            0.3.7 bổ sung 2 (US-155): `website_request_new` – nguồn `computed`, FD+ (OWN/MGR/FDL/FD); `count` = số yêu cầu website `new` chưa ai nhận; mức `warning` khi yêu cầu `new`
            cũ nhất đã quá `replyBy`, còn lại `info`; `dueAt` = `replyBy` sớm nhất; `params` chỉ `count`; `refCode` = mã yêu cầu khi `count` = 1; `link` = `/website-requests?status=new`;
            không tên/SĐT. Hết khi không còn yêu cầu `new`. SAL nhận thông báo `website_request_new` thay cho mục này.
        source: { type: string, enum: [computed, event], description: 'computed = tính lúc đọc; event = bản ghi `attention_event` (đóng bằng resolveAttentionEvent)' }
        eventId: { $ref: '#/components/schemas/Uuid' }
        severity: { type: string, enum: [info, warning, critical] }
        count: { type: integer }
        dueAt: { $ref: '#/components/schemas/Instant' }
        reservationIds: { type: array, items: { $ref: '#/components/schemas/Uuid' } }
        roomNos: { type: array, items: { type: string } }
        link: { type: string, description: Đường dẫn màn hình xử lý }
        refCode: { type: string, description: 'Mã hiển thị (mã đơn, mã WO, số căn) – không C2/C3 (0.3.6, B-21)' }
        params:
          type: object
          description: |
            0.3.6 (B-21, SEC J duyệt có điều kiện): tham số điền chuỗi UXD. Mỗi `kind` có **danh sách khóa cho phép trong code**; khóa lạ → lỗi lúc sinh mục
            (không lọc im lặng). Chỉ số, mã đơn/WO, số căn, ngày – **không** tên, SĐT, ghi chú, số tiền chi tiết của khách. `reconcile_overdue`: `count`, `oldestDays`.
            **0.3.7**: `data_quality` → `check` ∈ `registration_stay_not_closed`, `registration_party_docs_unlinked` (S4-39); `ooo_ending_work_open` → `roomNo`, `endDate`.
            **0.3.7 bổ sung D1**: `ota_no_show_report` (US-136 AC2/AC5) → `action` ∈ `report` ("Báo no-show trên kênh" – sinh khi `markNoShow` đơn kênh `ota`), `revoke` ("Báo kênh hủy no-show" –
            sinh khi `restoreNoShow` đơn OTA đã báo), `channel` (mã kênh); `refCode` = mã đơn; nguồn `event`, mức `warning`, OWN/MGR/FDL/FD; lễ tân đóng bằng `resolveAttentionEvent` sau khi
            làm trên extranet (ghi người, lúc). `closed_reservation_credit` (S4-06, BR-522 – "tiền dư đơn đã đóng") → không tham số; `refCode` = mã đơn, **không** số tiền; nguồn `event`,
            mức `warning`, OWN/MGR/FDL/FD (như `deposit_after_cancel`); **tự đóng** khi yêu cầu hoàn chi đủ hoặc khách đồng ý để lại (`overpayment_retained`) – không đóng tay.
            **0.3.7 bổ sung 1 (BE-D s4 2.5 #2 – bảng khóa cho phép đúng như server đã cài, `ATTENTION_PARAM_KEYS`)**:
            | `kind` | Khóa `params` | Người thấy |
            |---|---|---|
            | `foc_threshold` (BR-435, US-012 AC8; `computed`, `warning`) | `check` = `foc_pct_of_room_revenue` → `pct` (FOC lũy kế tháng ÷ doanh thu phòng lũy kế × 100, 1 chữ số thập phân; **vắng** khi doanh thu phòng = 0 – hiện "–"), `threshold` (= `foc_alert_pct_of_room_revenue`); `check` = `foc_count_per_approver` → `count` (số FOC đã duyệt trong kỳ của **một** người duyệt, gồm tự áp BR-436), `max` (= `foc_alert_count_per_approver`) – mỗi người vượt ngưỡng một dòng, **không** nêu tên: `link` = `/approvals?type=foc&month=YYYY-MM&approverId=<id>`. Kỳ = ngày 1 tháng nghiệp vụ → hôm nay | chỉ OWN |
            | `reconcile_overdue` | `count`, `oldestDays` | MGR+ |
            | `no_show_call`, `no_show_mark` | `count`, `time` (`HH:mm` – `no_show_call_time` / `no_show_mark_time`) | FD+ |
            | `registration_due` | `count`, `deadline` (hạn sớm nhất – thời điểm ISO hoặc `HH:mm`) | FD+ |
            | `capacity_conflict`, `overbooking`, `unassigned_with_free_room`, `hold_expiring`, `room_ooo`, `extra_guest_kit_overdue`, `registration_overdue`, `guest_request_overdue` | `count` | FD+ |
            | `data_quality` | `check` | FD+ khi `check` bắt đầu `registration_`; còn lại (kiểm DATA) chỉ OWN |
            | `deposit_after_cancel`, `security_alert` | `code` (mã chứng từ dạng `OTM-00171`) | FD+ (`deposit_after_cancel`) / chỉ OWN (`security_alert`) |
            | `ota_no_show_report` | `action` (`report`\|`revoke`), `channel` (mã kênh) | FD+ |
            | `ooo_ending_work_open` | `roomNo`, `endDate` (`YYYY-MM-DD`) | FD+ |
            | `vip_arrival` (một dòng mỗi đơn, `info`; `refCode` = mã đơn, `roomNos`, `dueAt` = giờ đến dự kiến hoặc `checkin_time`), `closed_reservation_credit`, `visa_expiring` và mọi `kind` khác | không có `params` | FD+ |
            Định dạng giá trị (SEC-BE-52): đếm là số nguyên ≥ 0; `pct`/`threshold` số 0–1000; `check`/`channel` mã `snake_case` ≤ 40 ký tự; `roomNo` 1–10 ký tự chữ-số. `room_ooo`
            chỉ có `count` + `roomNos` (không `endDate`, không `dueAt`). `kind` chưa có nguồn ở R2 (`rent_due_soon`, `lease_expiring`, `meter_not_read`, `channel_sync_error`,
            `work_order_high_open`, `work_order_overdue`, `room_status_mismatch`): khóa `params` mới phải vào hợp đồng (ARC) **trước** khi thêm vào danh sách khóa cho phép.
          additionalProperties:
            oneOf: [{ type: string, maxLength: 40 }, { type: number }]

