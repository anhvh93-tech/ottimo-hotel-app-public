    ## Trường mở rộng của Problem theo code (0.3.5)
    Tên cố định; client chỉ đọc các trường này (không đọc `detail`).
    | code | Trường |
    |---|---|
    | INVALID_TRANSITION | `currentState` (luôn có), `availableFrom` (hành động mở theo giờ), `allowedActions` (đơn, tùy chọn) |
    | HOLD_EXPIRED · QUOTE_EXPIRED | `expiredAt` |
    | DEPOSIT_INSUFFICIENT | `depositRequiredVnd`, `depositPaidVnd`, `shortfallVnd` |
    | ROOM_UNAVAILABLE · ROOM_BLOCKED · ROOM_OCCUPIED | `conflicts[]` (`OccupancyConflict`), `suggestions[]`; `changeRoom` thêm `parentOnlyAvailable` (0.3.7, S4-09) |
    | DOCUMENT_UNCLAIMED_EXISTS | `documentId`, `personIndex` (0.3.7) |
    | CHECKLIST_OUTDATED | `currentVersion` (0.3.7) |
    | REGISTRATION_INCOMPLETE | `missingCount` (0.3.7 – `mark-sent`, `completeRegistrationReview`) |
    | 422 `removePartyMember` thiếu `guestUploadPersonIndex` | `personIndexes[]` – các số "Khách n" đang chưa gắn người (0.3.7) |
    | ROOM_NOT_SELLABLE | `roomNo` |
    | CAPACITY_EXCEEDED | `roomNo`, `max` |
    | CAPACITY_BELOW_BOOKINGS | `conflicts[]` |
    | VERSION_CONFLICT | `currentVersion` |
    | SURCHARGE_CHANGED | `surchargeVnd` |
    | REFUND_SOURCE_NOT_RECONCILED | `paymentIds[]`, `unreconciledVnd` (0.3.6 bổ sung 2 (BA v0.3, ARC 17/10)) |
    | OVERPAYMENT_HANDLING_REQUIRED (mã trường) | `unhandledCreditVnd` (0.3.6 bổ sung 2 (BA v0.3, ARC 17/10)) |
    | ROOM_NOT_READY | `roomStatus` |
    | PARAM_OUT_OF_RANGE | `min`, `max`, `allowed[]` |
    | 422 có `HOLD_LIMIT_REACHED` | `max` |
    | 422 có `MIN_STAY_NOT_MET` | `minStayNights`, `suggestions[]` với `orphanNight=true` (BR-113 a) |
    | 422 có `RATE_OUT_OF_RANGE(_WARNING)` | `dates[]` |
    | 422 `moveReservation` (`overbookingResolution` sai) | `expected` |

    ## Mã lỗi theo trường (`FieldError.code`, nằm trong `errors[]` của `422 VALIDATION_FAILED`) – 0.3.1
    Tập mã **mở** (schema `FieldError.code` là chuỗi): client không biết mã → hiện `field_error.generic`. Nguồn: BA `specs/EP00-platform.md` mục 0.3 (V-01…V-11),
    `specs/EP02-reservations.md`. Mã `Problem.code` loại 422 (`CAPACITY_EXCEEDED`, `RATE_OUT_OF_RANGE`, `CARD_NUMBER_DETECTED`…) cũng được dùng làm `FieldError.code`
    khi gắn được vào một ô.
    | code | Kiểm tra | Áp cho |
    |---|---|---|
    | REQUIRED | Thiếu trường bắt buộc / bắt buộc có điều kiện | mọi form |
    | TOO_LONG | Vượt độ dài tối đa | V-01, text |
    | NAME_INVALID | Họ tên sai ký tự | V-01 |
    | PHONE_INVALID · PHONE_COUNTRY_CODE_REQUIRED | SĐT sai dạng / số nước ngoài thiếu `+mã nước` | V-02 |
    | EMAIL_INVALID | Email sai dạng | V-03 |
    | TAX_CODE_INVALID | MST sai dạng | V-04 |
    | DATE_INVALID · DATE_ORDER · DATE_IN_PAST | Ngày sai lịch / ngày đi ≤ ngày đến / trước ngày nghiệp vụ. **0.3.6 bổ sung 2 (BA v0.3, ARC 17/10)**: `DATE_INVALID` là mã **chính thức** cho `changeRoom.effectiveDate` ≠ ngày nghiệp vụ hôm nay (không dùng `VALUE_OUT_OF_RANGE`) | V-05; `changeRoom.effectiveDate` |
    | DOB_FUTURE · DOB_MINOR · DOB_INVALID | Ngày sinh | V-06 |
    | AMOUNT_INVALID · AMOUNT_NOT_POSITIVE · AMOUNT_EXCEEDS_LINE | Tiền âm/không nguyên · ô giá ≤ 0 · vượt giá trị dòng folio | V-07, US-007 |
    | REASON_REQUIRED | Lý do thiếu/ngắn | V-08; `markNoShow.contactAttemptNote`, `extendQuote.reason` (0.3.5) |
    | PASSWORD_TOO_SHORT · PASSWORD_SAME_AS_USERNAME · PASSWORD_REUSED · PASSWORD_TOO_COMMON | Mật khẩu mới (`PASSWORD_TOO_COMMON`: có trong danh sách mật khẩu phổ biến SR-AUTH-02 – 0.3.4) | V-10 |
    | NOT_IN_LIST | Giá trị không có trong danh mục đang hoạt động | V-11 |
    | VALUE_OUT_OF_RANGE | Số ngoài biên của trường (ví dụ `baseOccupancy` 1–10). **0.3.7**: `getArrivalsDepartures.date` ngoài ngày nghiệp vụ ±7 (B-20) | US-004, `getArrivalsDepartures` |
    | DUPLICATE | Trùng khóa duy nhất của danh mục (ví dụ `roomNo`) | US-004 |
    | MAX_OCCUPANCY_RANGE | `maxOccupancy` ∉ {`baseOccupancy`, `baseOccupancy` + 1} (ESC-014, BR-110 v0.3.1) | `createRoom`, `updateRoom` |
    | LAST_OWNER | Bỏ vai `owner` / khóa tài khoản của OWN `active` cuối cùng của cơ sở (rbac 5.3) – `field` = `roles` hoặc `status` | `setUserRoles`, `updateUser` |
    | MIN_STAY_NOT_MET | Ngày đến có ở tối thiểu (BR-113) mà số đêm thấp hơn; FDL+ bỏ qua bằng `minStayOverrideReason` (đơn trực tiếp); không áp đơn OTA nhập tay. 0.3.5: kèm `minStayNights`; nhóm có căn mà khoảng ngày là đêm lẻ → kèm `suggestions[]` `orphanNight=true` (lễ tân chọn căn đó; quầy R2 không tự gán căn) | `createReservation`, `calculateQuote`, `saveQuote` |
    | OTA_REF_DUPLICATE | `otaRef` + kênh trùng đơn khác chưa hủy | `createReservation` |
    | RATE_OUT_OF_RANGE_WARNING | Kênh `ota`: giá đêm ngoài sàn–trần (BR-105) **và** thiếu `rateOverrideReason` → client hiện **cảnh báo** + ô lý do rồi gửi lại; có lý do thì lưu (kênh `direct`/`agent` vẫn là `RATE_OUT_OF_RANGE` chặn) | `createReservation` |
    | CAPACITY_EXCEEDED_WARNING | **Cảnh báo** (DOM D-1; với `assignRoom`/`moveReservation` `field` = `roomId`, với `updateReservation` `field` = `adults`): kênh `ota` có số khách tính (`adults` + `children6to11`) > `maxOccupancy` của căn và thiếu `capacityWarningAckReason` → client hiện hộp cảnh báo + ô lý do rồi gửi lại; có lý do → lưu, đơn `capacityConflict=true`. Kênh khác vẫn `CAPACITY_EXCEEDED` chặn (0.3.5) | `createReservation`, `moveReservation`, `assignRoom`, `updateReservation` |
    | ALLOW_UNASSIGNED_OTA_ONLY | `allowUnassigned=true` cho kênh không phải `ota` | `createReservation` |
    | LONG_STAY_REQUIRES_CONTRACT | Số đêm đạt ngưỡng BR-108 mà không có `manualLongStay` (US-017 AC5) | `createReservation` |
    | MANUAL_LONG_STAY_BELOW_THRESHOLD | `manualLongStay` mà số đêm dưới ngưỡng BR-108 (AC5a) | `createReservation` |
    | OTA_AMOUNT_MISMATCH | Σ `nightlyRates` ≠ `otaRoomAmountVnd` | `createReservation` |
    | OTA_PENALTY_OTA_ONLY | `otaPenaltyVnd` cho đơn không thuộc kênh `ota` | `cancelReservation` |
    | DIRECT_SOURCE_NOT_ALLOWED | `directSource` cho kênh không thuộc nhóm `direct` | `createReservation` |
    | CONSENT_REQUIRED | `consent` ≠ `true` – ô đồng ý không tích sẵn, một mục đích (SEC C-3) – 0.3.7 bổ sung 2 | `createWebsiteBookingRequest` |
    | NOTICE_VERSION_INVALID | `consentVersion` không phải thông báo xử lý dữ liệu đã đăng của `locale` (bản trước còn nhận 7 ngày sau khi có bản mới) – trang tải lại – 0.3.7 bổ sung 2 | `createWebsiteBookingRequest` |
    | ID_NUMBER_DETECTED | Văn bản tự do có chuỗi giống số CCCD (12 số)/hộ chiếu/MRZ (bộ nhận diện SR-LOG-04) – không lưu; trang nhắc "Không cần gửi giấy tờ ở bước này" (SEC ARC-08) – 0.3.7 bổ sung 2 | `createWebsiteBookingRequest.note`, `transitionWebsiteBookingRequest.note` |
    | EXTENSION_LIMIT_EXCEEDED | `nights` > `ExtensionOptions.maxNights` (đêm liên tiếp còn trống, giới hạn BR-421) – 0.3.3 E04-01 | `extendStay` |
    | NIGHTLY_RATES_NOT_ALLOWED | Gửi `nightlyRates` cho đơn `externalContract=true` (đơn dài hạn nhập tay không sinh dòng `room`) – 0.3.3 E04-01 | `extendStay` |
    | VISA_EXPIRES_BEFORE_DEPARTURE | **Cảnh báo**: khách NN có hạn thị thực/tạm trú < ngày đi mới và thiếu `visaWarningAckReason` → client hiện hộp cảnh báo + ô lý do rồi gửi lại (như `RATE_OUT_OF_RANGE_WARNING`) – BR-605, US-050 AC2; 0.3.3 E04-01 | `extendStay`, `updateReservation`, `moveReservation` |
    | LATE_CHECKOUT_AFTER_LIMIT | Giờ trả sau mốc cuối `late_checkout_tiers` (BR-412/416) – dùng Gia hạn 1 đêm – 0.3.3 E04-02. **0.3.6 bổ sung 2 (BA v0.3, ARC 17/10)**: ở `checkOut` mã này nghĩa là "phải tính thêm 1 đêm" – `field` = `extraNight` (gửi `checkOut.extraNight`, BR-416 v0.3.4, DOM S3-9) | `setLateCheckout`, `checkOut` |
    | PRICE_NOT_EDITABLE | Gửi `unitPriceVnd` cho khoản danh mục có `priceEditable=false` (giá theo tham số BR) – 0.3.3 E04-03 | `addFolioLine` |
    | EVIDENCE_REQUIRED | Khoản `evidenceRequired=true` (phạt, hư hỏng) thiếu cả `evidenceAttachmentIds` lẫn `note` ≥ 3 ký tự (US-032 AC2) – 0.3.3 E04-03. **0.3.6 bổ sung 2 (BA v0.3, ARC 17/10)**: `earlyDeparture` có `noticeGivenAt` nhập lùi (> `manual_time_tolerance_minutes` trước lúc thao tác hoặc khác ngày nghiệp vụ – BR-011) mà thiếu `noticeEvidence` (`field` = `noticeEvidence`). **0.3.7 (B-10)**: `transitionWorkOrder` `complete` thiếu ảnh sau sửa khi mức phiếu thuộc tham số `wo_done_photo_required_severities` (mặc định `[high, medium]` – DOM D-15) (`field` = `photoAttachmentIds`) | `addFolioLine`, `executeCashRefund`, `earlyDeparture`, `transitionWorkOrder` |
    | FOC_NOT_ALLOWED_OTA_PREPAID | FOC / giảm giá đặc biệt trên dòng tiền phòng của đơn OTA trả trước (BR-307 v0.3.4) – 0.3.6 bổ sung 4 (DOM luật OTA 17/10, ARC) | `requestFoc` |
