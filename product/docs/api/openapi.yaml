        confirmedAt: { $ref: '#/components/schemas/Instant', description: 'VietQR: lúc lễ tân xác nhận thấy tiền (`confirmPaymentReceived`) – 0.3.3' }
        confirmedByUserId: { $ref: '#/components/schemas/Uuid', description: '0.3.3' }
