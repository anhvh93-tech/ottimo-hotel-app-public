                reauth: { $ref: '#/components/schemas/StrongReauth', description: '0.3.8 (SEC 06.26 – S2): bắt buộc khi có `status` hoặc `resetPassword` (đổi tên hiển thị không cần)' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '403': { $ref: '#/components/responses/Forbidden' }
