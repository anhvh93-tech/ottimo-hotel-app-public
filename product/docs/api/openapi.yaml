        **0.3.3 (E06-01)** – để kết quả kiểm tay có hiệu lực **trước** nhận phòng (B9 chỉ cần khai báo ≥ `partial`, chưa cần K5).
        - Mục `unverified`: `manualResult` (bắt buộc) + `note`. Mục `fail`: chỉ `note` (`manualResult` gửi lên → 422 `NOT_IN_LIST` – không "sửa" kết quả hệ thống).
          Mục `pass`/`not_applicable` → `409 INVALID_TRANSITION`.
        - `note` 3–500 ký tự, V-09, không chứa số giấy tờ (thiếu → 422 `CHECK_NOTE_REQUIRED`).
        - Server tính lại `blocking` và `Registration.blocksDoorCode` trong cùng giao dịch; ghi nhật ký (người, thời điểm, kết quả) – không phải dữ liệu C3.
        - Gọi lại = ghi đè kết quả kiểm tay trước (có nhật ký). Khai báo đã `sent`/`confirmed` → `409 INVALID_TRANSITION`.
