              required: [expectedVersion]
              additionalProperties: false
              properties:
                pin: { type: string, pattern: '^[0-9]{6}$', writeOnly: true, description: 'Bắt buộc với `approve`, `reject`; `cancel` gửi → 422 `NOT_ALLOWED`' }
                expectedVersion: { type: integer, minimum: 0 }
                rejectReason: { type: string, minLength: 3, maxLength: 300, x-rbac-field: D12c }
                reason: { type: string, minLength: 3, maxLength: 300, x-rbac-field: D12c, description: Lý do hủy (tùy chọn) }
            examples:
              approve: { value: { pin: '123456', expectedVersion: 0 } }
              reject: { value: { pin: '123456', expectedVersion: 0, rejectReason: Gọi lại cho tôi trước khi thu } }
      responses:
        '200':
          description: Yêu cầu sau khi chuyển
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManagerConfirmation' }
