    parameters:
      - $ref: '#/components/parameters/PropertyId'
      - $ref: '#/components/parameters/QuoteId'
    post:
      tags: [quotes]
      operationId: createHoldFromQuote
      summary: Tạo giữ chỗ từ báo giá (B1 + Q2) – khóa căn, hạn giữ theo BR-302, lead → holding (US-084)
      description: |
        Báo giá hết hiệu lực → `409 QUOTE_EXPIRED` (US-083 AC3). Ngày đến = hôm nay → `422 HOLD_NOT_ALLOWED_TODAY` (BR-302).
        Khách chưa có SĐT → `422 PHONE_REQUIRED` (US-084 AC2). Trả số tiền cần thu (cọc ngắn ngày hoặc ký quỹ + kỳ đầu dài hạn – AC3).
        **0.3.7 bổ sung 2 (US-155 AC2 – contract-ahead, cài cùng US-155)**: báo giá có `websiteBookingRequestId` → đơn giữ chỗ `directSource = website`, `directSubSource` = nguồn phụ
        của yêu cầu; yêu cầu `new`/`in_progress` → `converted` (WR6, `reservationId`) và **xóa trường C2** của yêu cầu trong cùng giao dịch (qua `WebsiteRequestPort`); yêu cầu đã ở
        trạng thái khác → vẫn tạo giữ chỗ với nguồn `website`, không đổi yêu cầu. SSE `website_request.changed`.
        **Phản hồi review SEC (ARC-19 điểm 3)**: chỉ chuyển yêu cầu (WR6) khi người gọi là FD+ **hoặc** đang được giao yêu cầu đó; khác (ví dụ SAL dùng báo giá cũ sau khi yêu cầu đã giao
        cho người khác) → vẫn tạo giữ chỗ nguồn `website` + nguồn phụ, yêu cầu **không** đổi, người đang được giao nhận thông báo `website_request_linked_hold`.
      x-roles: [owner, manager, front_desk_lead, front_desk, sales_staff, collaborator]
      x-scope: { sales_staff: own, collaborator: own }
      x-rbac: [A02]
      x-transition: [B1, Q2]
      x-stories: [US-084, US-018, US-047]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [holdHours]
              properties:
                holdHours: { type: integer, description: 'Một trong hold_hours_options' }
                depositMethod: { type: string, enum: [vietqr, bank_transfer, cash, vnpay, momo] }
            example: { holdHours: 24, depositMethod: vietqr }
      responses:
        '201':
          description: Đơn giữ chỗ
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reservation' }
        '409': { $ref: '#/components/responses/RoomUnavailable' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
