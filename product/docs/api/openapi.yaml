    post:
      tags: [reservation-groups]
      operationId: allocateGroupDeposit
      summary: Ghi cọc chung của nhóm và phân bổ về từng đơn căn (G2; BR-322) (US-140 AC1, R3)
      description: |
        Một giao dịch `payment` gắn `reservation_group_id`; các dòng `payment_allocation` với Σ `amountVnd` = số tiền giao dịch (kiểm trong
        **cùng giao dịch** DB, lệch → `422 GROUP_ALLOCATION_MISMATCH`). Bỏ trống `allocations` → server phân bổ theo tỷ lệ tiền phòng từng đơn,
        phần lẻ dồn vào căn cuối (BR-322); gọi `dryRun=true` để xem phân bổ trước (không cần `Idempotency-Key`/`If-Match`).
        Đơn nào đạt mức cọc BR-305 thì chuyển `confirmed` (B4 từng đơn, cùng giao dịch). Chuyển khoản ghi tay → `reconciliation=pending` (BR-527);
        tiền mặt gắn ca đang mở của người ghi (SM-17, `409 SHIFT_NOT_OPEN` nếu chưa mở ca). CTV không ghi tiền (rbac A23 ghi chú 36 → dùng A33).
