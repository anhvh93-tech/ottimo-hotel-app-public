        '409':
          description: 'DOCUMENT_UNCLAIMED_EXISTS (kèm `documentId`, `personIndex`) / PARTY_DUPLICATE / INVALID_TRANSITION (khai báo `void`) – 0.3.7'
          content:
            application/problem+json:
