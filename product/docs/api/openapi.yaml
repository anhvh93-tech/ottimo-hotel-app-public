      summary: Lễ tân xác nhận đã thấy tiền của VietQR đang chờ – `pending → succeeded`, `reconciliation=pending` (SM-12; US-120, US-119 AC6)
      description: |
        **0.3.8 bổ sung 3 (ARC 24/10, FB-R3-ARC-FUZZ-01, BR-522 K11-06)**: trên folio `settled`, thao tác này để lại tiền dư chưa có yêu cầu hoàn (`unhandledCreditVnd` > 0) → server tạo **một** yêu cầu hoàn `overpayment` bằng phần chưa yêu cầu (người xin = người thao tác; người duyệt MGR+ khác người xin – SEC F8) và mở "Cần chú ý" `closed_reservation_credit`, **cùng giao dịch**; yêu cầu hoàn đang mở lớn hơn tiền dư → chạy lại `refundPlan` (hủy `superseded` + tạo lại, DOM-S4-14). Không đổi hình dạng phản hồi.
        **0.3.3 (E05-02)**. Chỉ giao dịch `method=vietqr`, `status=pending`, `expiresAt` chưa qua; khác → `409 INVALID_TRANSITION` (kèm `currentState`).
        Server khóa `payment … FOR UPDATE` + `folio … FOR UPDATE`; ghi `receivedAt` (mặc định bây giờ, ≤ bây giờ), `confirmedAt`, `confirmedBy` = người gọi,
        `reconciliation=pending` (chờ MGR+ đối soát sao kê – người xác nhận **không** được tự đối soát, A46); "còn phải thu" cập nhật ngay; nhật ký tiền BR-008.
        Giao dịch của cổng (VNPay/MoMo – R3) chỉ chuyển `succeeded` qua IPN đã xác thực, không qua endpoint này. Không cần `If-Match` (một chuyển trạng thái
        duy nhất, bảo vệ bằng khóa hàng + `Idempotency-Key`). SAL chỉ với giao dịch cọc (`type=deposit`) của đơn mình – như `recordPayment` (A33 M).
        **0.3.7 bổ sung 4 (DOM (f), R3PAY-02, BR-417 v0.3.8)**: không chặn xác nhận khi đêm B9a đã bán. Số tiền QR > **số còn phải thu lúc xác nhận** (`Payment.amountDueNowVnd` – trần đúng mục đích
        QR tính lại bây giờ với ngữ cảnh đã lưu lúc tạo: `check_in` như `amountDueAtCheckinVnd` (đêm B9a chỉ khi còn trống), `check_out` như `amountDueAtCheckoutVnd`, `deposit` = cọc còn thiếu,
        `balance` = còn phải thu folio) → **bắt buộc `note`** (3–300); thiếu → 422 `REASON_REQUIRED` (`field` = `note`, Problem `max` = số còn phải thu lúc xác nhận). Phần vượt nằm ở
        `Folio.totals.creditVnd`/`unhandledCreditVnd`, xử lý theo BR-522 (B18 `overpaymentHandling` hoặc `createRefundRequest`) – không tự tạo yêu cầu hoàn. Audit `money` ghi số vượt.
      x-roles: [owner, manager, front_desk_lead, front_desk, sales_staff]
      x-scope: { sales_staff: own_deposit_only }
      x-rbac: [A33]
      x-stories: [US-120, US-119]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                receivedAt: { $ref: '#/components/schemas/Instant' }
                note: { type: string, maxLength: 300, description: 'Mã giao dịch ngân hàng, tên người chuyển (V-09 – chặn số thẻ). **0.3.7 bổ sung 4 (DOM (f))**: bắt buộc (≥ 3) khi `amountVnd` > `Payment.amountDueNowVnd` – ghi lý do thu vượt' }
                attachmentId: { $ref: '#/components/schemas/Uuid', description: 'Ảnh biên nhận (`uploadAttachment purpose=deposit_receipt`)' }
            example: { note: 'FT26292001234 – NGUYEN VAN A', receivedAt: '2026-10-19T14:41:00+07:00' }
      responses:
        '200':
          description: Giao dịch `succeeded`, `reconciliation=pending`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payment' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /v1/properties/{propertyId}/payments/{paymentId}/actions/reconcile:
    parameters:
      - $ref: '#/components/parameters/PropertyId'
      - $ref: '#/components/parameters/PaymentId'
    post:
      tags: [folio]
      operationId: reconcilePayment
      summary: Đối soát giao dịch chuyển khoản lễ tân tự ghi (BR-527; SM-12 thuộc tính đối soát; US-119 AC6)
      description: |
        **0.3.3 (E05-03)**: chỉ giao dịch `status=succeeded` + `reconciliation=pending` (khác → `409 INVALID_TRANSITION`). Người gọi là người đã ghi
        (`recordedByUserId`) **hoặc** người đã xác nhận thấy tiền (`confirmedByUserId`, `confirmPaymentReceived`) và không phải OWN → `403 SELF_RECONCILE_FORBIDDEN`
        (rbac A46). `disputed` bắt buộc `note` (V-08, 3–300; thiếu → 422 `REASON_REQUIRED`) → cảnh báo đỏ OWN + MGR; **không tự đảo** – bước tiếp là
        `reversePayment`. `If-Match` = `Payment.version`.
        **0.3.6 (PO 16/10)**: đối soát chuyển khoản/VietQR với sao kê vẫn MGR+ (A46). Tiền mặt sale/CTV nộp quầy xác nhận bằng `confirmCashHandover` (FD+, A46a).
      x-roles: [owner, manager]
      x-rbac: [A46]
      x-stories: [US-119]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [result]
              properties:
                result: { type: string, enum: [reconciled, disputed] }
                note: { type: string, maxLength: 300, description: 'Bắt buộc (≥ 3 ký tự) khi `disputed`' }
            example: { result: disputed, note: Không thấy khoản 1.660.000 trên sao kê ngày 19/10 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payment' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: FORBIDDEN_ACTION / SELF_RECONCILE_FORBIDDEN
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example: { type: /problems/self-reconcile-forbidden, title: Giao dịch do bạn ghi cần người khác đối soát, status: 403, code: SELF_RECONCILE_FORBIDDEN }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/VersionConflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /v1/properties/{propertyId}/payments/{paymentId}/actions/confirm-cash-handover:
    parameters:
      - $ref: '#/components/parameters/PropertyId'
      - $ref: '#/components/parameters/PaymentId'
    post:
      tags: [payments]
      operationId: confirmCashHandover
      summary: Lễ tân xác nhận đã nhận tiền mặt sale/CTV nộp quầy (BR-527, BR-526; PO 16/10 – rbac A46a)
      description: |
        0.3.6. Chỉ giao dịch `method=cash`, `status=succeeded`, `reconciliation=pending`, `recordedByRole ∈ {sales_staff, collaborator}` (khác → `409 INVALID_TRANSITION`).
        Người xác nhận ≠ người ghi (so `user_id`, dưới `FOR UPDATE` + CHECK DB) → `403 SELF_RECONCILE_FORBIDDEN` (không ngoại lệ, kể cả OWN). Kết quả
        `reconciliation = reconciled`, `reconciledByName`, tiền vào **ca đang mở** của người xác nhận (`shiftId`; R3 khi bật đóng ca – `409 SHIFT_NOT_OPEN`);
        `short` → `disputed` + cảnh báo OWN/MGR (`payment_disputed`). Audit `money`; phát `payment.changed`. `received` → hoa hồng người ghi "đạt" (ESC-017 A, BR-527).
        FD/FDL thấy các khoản này trong `listPayments` nhờ phạm vi `own_or_cash_handover` (của mình **hoặc** `cash` do SAL/CTV ghi đang `pending`).
      x-roles: [owner, manager, front_desk_lead, front_desk]
      x-rbac: [A46a]
      x-stories: [US-119]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [result]
              properties:
                result: { type: string, enum: [received, short], description: '`received` – nhận đủ → `reconciled`; `short` – thiếu/không nhận → `disputed` + cảnh báo OWN/MGR (như `reconcilePayment disputed`, không tự đảo)' }
                receivedAmountVnd: { $ref: '#/components/schemas/MoneyVnd', description: 'Bắt buộc khi `short` (số thực nhận, < `amountVnd`)' }
                note: { type: string, maxLength: 300, description: 'Bắt buộc khi `short` (3–300, `REASON_REQUIRED`)' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payment' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/VersionConflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /v1/properties/{propertyId}/payments/{paymentId}/actions/reverse:
    parameters:
      - $ref: '#/components/parameters/PropertyId'
      - $ref: '#/components/parameters/PaymentId'
    post:
      tags: [folio]
      operationId: reversePayment
      summary: Đảo giao dịch ghi sai (không xóa) – MGR+ (US-119 AC3; A34)
      description: |
        **0.3.7 bổ sung 4 (BR-525 G-4 – DOM 18/10, BUG-R2-200; ARC 16.25)**: thứ tự khóa (16.19): mọi đơn của folio `FOR NO KEY UPDATE` theo id → folio → giao dịch → yêu cầu hoàn.
        Folio `settled` (đơn chính `checked_out`) mà việc đảo làm **tăng** còn phải thu và số sau > 0 → **trong cùng giao dịch**: tự ghi công nợ của khách (cùng cấu trúc công nợ lúc trả phòng –
        `checkOut.debt`; lý do = `reason`; hạn = tham số `debt_default_due_days`), audit `reservation.debt_on_checkout`, thông báo `debt_recorded` (OWN + MGR), mục "Cần chú ý" `checkout_debt`.
        Không ghi dòng phí; folio giữ `settled`, hóa đơn đã xuất không đổi. Sau **mọi** lần đảo: chạy lại kế hoạch hoàn (BR-522) – yêu cầu hoàn mở vượt dư thừa tự hủy (`autoCancelReason`
        = `superseded`). ~~Hoa hồng đã "đạt" không tính lại [chờ DOM].~~
        **ARC 16.31 (DOM 18/10 BR-525 (ii), (iii), lần 8; thay các câu tương ứng ở trên)**: số ghi nợ = **phần tăng** do việc đảo = max(0, còn phải thu sau) − max(0, còn phải thu trước).
        Folio `settled` **hoặc `closed`** (N-13 – ví dụ chuyển khoản bị ngân hàng hoàn sau 24 giờ; folio giữ `closed`, hóa đơn không đổi). Nối hay mở công nợ theo **số**: công nợ đang mở
        (`openDebtVnd` của chu kỳ) > 0 → ghi thêm vào công nợ đó, **giữ hạn và lý do cũ** (kể cả hạn quản lý đã sửa); = 0 → công nợ mới, hạn = ngày ghi + `debt_default_due_days` (3), lý do
        = `reason`. Hoa hồng `earned`/`payable` của đơn về `projected` (audit), đạt lại khi thu xong công nợ; `paid` không tự trừ ở R2 (BR-525 (iii)). Ví dụ: folio `closed` 17/11 10:00,
        còn phải thu 0; 18/11 đảo 500.000 → công nợ **500.000**, hạn **21/11**.
      x-roles: [owner, manager]
      x-rbac: [A34]
      x-stories: [US-119]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 3 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payment' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /v1/properties/{propertyId}/folios/{folioId}/vietqr:
    parameters:
      - $ref: '#/components/parameters/PropertyId'
      - $ref: '#/components/parameters/FolioId'
    post:
      tags: [folio]
      operationId: createVietQr
      summary: Sinh chuỗi VietQR đúng số tiền, nội dung = mã đơn/bill không dấu cách (US-120). Chưa cấu hình tài khoản → 409 PAYMENT_NOT_CONFIGURED.
      description: |
        **0.3.3 (E05-02, ARC chốt vòng đời giao dịch `pending`)**
        - `transferContent`: mã đơn bỏ dấu gạch (`OTM00171`) khi folio `open`; số bill bỏ dấu gạch (`F26000123`) khi folio `settled` (BR-521, US-120 AC1).
        - Tạo QR mới cho cùng folio → mọi giao dịch `method=vietqr`, `status=pending` **cũ** của folio → `expired` trong **cùng giao dịch DB** (chỉ một QR chờ/folio).
        - `expiresAt` = mốc đổi ngày nghiệp vụ kế tiếp (`business_day_rollover`, BR-010). Hết hạn: job `payment.expire` (erd 4.6) đặt `expired`;
          `confirmPaymentReceived` cũng kiểm `expiresAt` tại chỗ (không chờ job). Tiền về sau khi QR hết hạn → lễ tân ghi bằng `recordPayment` (`method=vietqr`,
          `reconciliation=pending`).
        - `amountVnd` > còn phải thu (hoặc cọc còn thiếu khi `hold`) → 422 `AMOUNT_EXCEEDS_BALANCE`, trừ khi FD+ gửi `overBalanceReason` (DOM G-4 đã quyết – 0.3.6).
        - `purpose=billing_period` chỉ R3 (kỳ thu HĐ) → R2 trả 422 `NOT_IN_LIST`.
        - Không vẽ QR giả khi chưa cấu hình tài khoản nhận (`409 PAYMENT_NOT_CONFIGURED`, US-120 AC2).
        - **0.3.6 (SEC F1–F3 [CHẶN])**: số tiền do server kiểm (≤ còn phải thu/cọc còn thiếu); `transferContent` chỉ mã đơn/số bill. **Ảnh QR vẽ tại chỗ**
          từ `qrPayload` (thư viện trong bundle admin-web) – **không** gọi dịch vụ ảnh QR bên ngoài (img.vietqr.io, Google Chart…); CSP `img-src 'self' blob: data:`.
          Tài khoản nhận đổi trong 24 giờ → `receivingAccountRecentlyChanged=true`, client hiện cảnh báo "Tài khoản nhận vừa đổi".
      x-roles: [owner, manager, front_desk_lead, front_desk, sales_staff]
      x-scope: { sales_staff: own }
      x-rbac: [A39]
      x-stories: [US-120]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amountVnd]
              properties:
                amountVnd: { $ref: '#/components/schemas/MoneyVnd' }
                purpose:
                  type: string
                  enum: [deposit, balance, check_in, check_out, billing_period]
                  description: |
                    0.3.7: `check_in` – QR ở bước thu của nhận phòng (đơn `confirmed`, ngày nghiệp vụ = ngày đến hoặc cửa sổ B9a; FD+): trần = `CheckInPreview.amountDueAtCheckinVnd` tính theo
                    **0.3.7 bổ sung 3 (BE-B (f), S4-10 – khai đúng cách server đã cài)**: `check_in`/`check_out` chỉ FD+ (SAL → 403); đơn sai trạng thái → 409 `INVALID_TRANSITION` (kiểm trước khi
                    khóa folio), ngoài ngày nghiệp vụ/cửa sổ → 409 (`availableFrom`); trường ngữ cảnh không khớp `purpose` → 422 `NOT_ALLOWED`; không ghi dòng folio nào, giao dịch `charge`.
                    `checkinTime`/`addPriorNight`/`priorNightRateVnd` gửi kèm (BUG-R2-038). `check_out` – QR ở bước 3 trả phòng (đơn `in_house`, cửa sổ B18; FD+): trần =
                    `CheckoutSummary.amountDueAtCheckoutVnd` theo `checkoutAt`/`extraNightRateVnd` gửi kèm (S4-47). Trong trần không cần `overBalanceReason`; sai trạng thái/ngày → 409
                    `INVALID_TRANSITION`; SAL/CTV → 403. Không ghi dòng nào – phụ thu/đêm thêm vẫn chỉ ghi ở B9/B18.
                checkinTime: { $ref: '#/components/schemas/LocalTime', description: '0.3.7 – chỉ `purpose=check_in` (như `previewCheckIn.checkinTime`); purpose khác → 422 `NOT_ALLOWED`' }
                addPriorNight: { type: boolean, description: '0.3.7 – chỉ `purpose=check_in`. **0.3.7 bổ sung 4 (BUG-R2-127)**: đêm trước không trống (`CheckInPreview.priorNight.available = false`) → 422 `NOT_ALLOWED` (`field` = `addPriorNight`)' }
                priorNightRateVnd: { $ref: '#/components/schemas/MoneyVnd', description: '0.3.7 – chỉ `purpose=check_in` khi `addPriorNight`. **0.3.7 bổ sung 3 (BE-B (f))**: gửi mà không kèm `addPriorNight = true` → 422 `NOT_ALLOWED` (`field` = `priorNightRateVnd`)' }
                checkoutAt: { $ref: '#/components/schemas/Instant', description: '0.3.7 – chỉ `purpose=check_out` (như `getCheckoutSummary.checkoutAt`; vắng = giờ server)' }
                extraNightRateVnd: { $ref: '#/components/schemas/MoneyVnd', description: '0.3.7 – chỉ `purpose=check_out` khi cần đêm thêm (vắng = `extraNightDefaultRateVnd`). **0.3.7 bổ sung 4 (BUG-R2-139)**: `CheckoutSummary.extraNightAvailable = false` → 422 `NOT_ALLOWED` (`field` = `extraNightRateVnd`) – không bao giờ cộng đêm không bán được; dùng `lateFeeAsNight`' }
                lateFeeAsNight: { type: boolean, description: '0.3.7 bổ sung 4 (BUG-R2-139, BR-416-06): chỉ `purpose=check_out`, khi tóm tắt (theo `checkoutAt`) có `extraNightRequired = true` và `extraNightAvailable = false` – trần = `CheckoutSummary.amountDueAtCheckoutVnd` gồm `lateFeeAsNightVnd` (= lệnh `checkOut.lateFeeInsteadOfNight`). Ngoài trường hợp đó → 422 `NOT_ALLOWED` (`field` = `lateFeeAsNight`). Vắng/false → trần không gồm khoản này' }
                overBalanceReason:
                  type: string
                  minLength: 3
                  maxLength: 300
                  x-rbac-field: D12c
                  description: '0.3.6 (DOM G-4, BA E15-03): **FD+** cho QR vượt còn phải thu khi "thu trước dịch vụ/ký quỹ"; SAL/CTV gửi → 403. Không có lý do mà vượt → 422 `AMOUNT_EXCEEDS_BALANCE`'
      responses:
        '201':
          description: Giao dịch `pending` + chuỗi QR
          content:
            application/json:
              schema:
                type: object
                required: [payment, qrPayload, transferContent]
                properties:
                  payment: { $ref: '#/components/schemas/Payment' }
                  qrPayload: { type: string, description: 'Chuỗi EMVCo/NAPAS VietQR – client tự vẽ ảnh (SEC F2)' }
                  transferContent: { type: string, example: OTM00171 }
                  receivingAccountMasked: { type: string, example: '9704••••1234', description: '0.3.6 – để lễ tân đối chiếu với khách' }
                  receivingAccountChangedAt: { $ref: '#/components/schemas/Instant' }
                  receivingAccountRecentlyChanged: { type: boolean, description: 'Đổi trong 24 giờ qua (SEC F3) – 0.3.6' }
                  expiredPaymentIds:
                    type: array
                    description: 'Giao dịch VietQR `pending` cũ của folio vừa chuyển `expired` (0.3.3)'
                    items: { $ref: '#/components/schemas/Uuid' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /v1/properties/{propertyId}/folios/{folioId}/refund-requests:
    parameters:
      - $ref: '#/components/parameters/PropertyId'
      - $ref: '#/components/parameters/FolioId'
    post:
      tags: [folio]
      operationId: createRefundRequest
      summary: Tạo yêu cầu hoàn **tay** từ folio khi khách trả thừa – giữa kỳ ở hoặc sau trả phòng (A43, BA E15-01)
      description: |
        **0.3.8 bổ sung 3 (ARC 24/10, FB-R3-ARC-FUZZ-01)**: nhận folio `open` **hoặc `settled`** (kể cả `settled` đã quá `post_checkout_window_until` mà J15 đang chờ –
        `waiting_refund`); folio `closed` → 409 `FOLIO_LOCKED`. Vai, trần (`unhandledCreditVnd` – 422 `REFUND_EXCEEDS_APPROVED` kèm `max`), `reasonCode = overpayment`
        và người duyệt (MGR+, khác người xin – SEC F8) như folio `open`. Dùng cho tiền dư sau trả phòng mà **không** có người bấm để tự tạo yêu cầu
        (khoản thu đối soát tự động, khách trả qua link, đồng bộ `ota_collect`): "Cần chú ý" `closed_reservation_credit` dẫn tới thao tác này; khi tiền dư đã có yêu cầu
        hoàn đủ (chi xong hoặc khách để lại tiền) J15 đóng folio ở lần chạy kế tiếp. Không đổi hình dạng request/response.
        0.3.6. Folio `open`, `creditVnd > 0`; `amountVnd` ≤ `creditVnd` − tổng yêu cầu `refund` đang `pending`/`approved` chưa chi của folio → 422 `REFUND_EXCEEDS_APPROVED`
        (`field` = `amountVnd`). Tạo `ApprovalRequest` `type=refund` (`reasonCode = overpayment`), duyệt MGR+ (BR-522); nơi nhận nhập bằng `setRefundDestination`
        (operation này **không** nhận nơi nhận – 0.3.7 sửa mô tả, nháp B-10). Các nguồn tự động (B10, B16, dời ra ngoài, A-34) **không** dùng operation này.
