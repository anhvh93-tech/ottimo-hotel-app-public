  /v1/guest/online-checkin:
    get:
      tags: [guest-portal]
      operationId: getOnlineCheckin
      summary: Tiến trình check-in online – tiếp tục từ bước dở (US-107 AC2). Không trả lại ảnh/số giấy tờ đã tải.
      security:
        - guestSession: []
      x-roles: [guest]
      x-guest-level: 1
      x-after-checkout: blocked
      x-stories: [US-107]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OnlineCheckin' }
        '403': { $ref: '#/components/responses/GuestForbidden' }
    put:
      tags: [guest-portal]
      operationId: updateOnlineCheckin
      summary: Lưu giờ đến dự kiến / bước hiện tại
      description: |
        **0.3.3 (E06-06) – SEC DUYỆT CÓ ĐIỀU KIỆN 16/10/2026 (ĐK-2, `outputs/SEC/s1-decisions.md` mục 3)**. Điều kiện BE phải cài:
        `noticeAccepted` chỉ `true` khi `noticeVersion` = bản hiện hành (đổi bản → `false`, `currentStep=notice`); `deferredPeople` chỉ số nguyên `1…requiredPeople`,
        không trùng (server bỏ chỉ số đã có ảnh); `arrivalNote` ≤ 300 + V-09 (`CARD_NUMBER_DETECTED`) + loại ký tự điều khiển, **không** đưa vào Web Push,
        `outbox_message.payload`, `audit_event.before/after` (chỉ ghi "có ghi chú"), log; JSON trả app khách không bao giờ có khóa `arrivalNote`.
        Giới hạn SR-RL-05: `updateOnlineCheckin` + `completeOnlineCheckin` ≤ 20 lần ghi/ngày/đơn (vượt → `429 RATE_LIMITED`).
        - `noticeVersion`: khách bấm "Tôi đã đọc" ở bước 0 → server ghi phiên bản thông báo xử lý dữ liệu đã hiển thị (+ `locale` phiên) vào `online_checkin`;
          phiên bản phải là bản hiện hành (khác → 422 `NOT_IN_LIST`). Chưa đọc bản hiện hành → mọi bước khác trả `409 INVALID_TRANSITION` (`currentStep=notice`).
        - `arrivalNote` (≤ 300, V-09 chặn số thẻ – `CARD_NUMBER_DETECTED`) **chỉ ghi**: không trả lại app khách, chỉ Desk thấy (`Registration.onlineCheckin`).
        - `lateArrival=true` ("Sau 22:00") → `etaTime` lưu `22:00` (giả định BA).
        - Đã đóng (`onlineCheckinAvailable=false`) → `409 ONLINE_CHECKIN_CLOSED`.
      security:
        - guestSession: []
      x-roles: [guest]
      x-guest-level: 1
      x-after-checkout: blocked
      x-sec-review: approved-DK2 (SEC 16/10/2026)
      x-rate-limit: 20 lần ghi/ngày/đơn chung với completeOnlineCheckin (SR-RL-05)
      x-stories: [US-107]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                etaTime: { $ref: '#/components/schemas/LocalTime' }
                currentStep: { type: string, enum: [notice, documents, eta, consent] }
                noticeVersion: { type: string, maxLength: 64, description: 'Phiên bản thông báo đã đọc (ví dụ `privacy-2026-10-v1`) – 0.3.3' }
                arrivalNote: { type: string, maxLength: 300, writeOnly: true, description: 'Ghi chú cho lễ tân – chỉ ghi, không đọc lại qua app khách (0.3.3)' }
                lateArrival: { type: boolean, description: '0.3.3' }
            example: { etaTime: '22:00', lateArrival: true, currentStep: consent }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OnlineCheckin' }
        '403': { $ref: '#/components/responses/GuestForbidden' }
        '409':
          description: ONLINE_CHECKIN_CLOSED (0.3.3, E06-06)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example: { type: /problems/online-checkin-closed, title: Lễ tân đã nhận giấy tờ của bạn, status: 409, code: ONLINE_CHECKIN_CLOSED }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /v1/guest/online-checkin/documents:
    post:
      tags: [guest-portal]
      operationId: uploadGuestDocument
      summary: Khách tải giấy tờ từng người (chỉ ghi, không đọc lại) – K2 none → pre (R-REG-08)
      description: |
        Chỉ ảnh JPEG/PNG/WebP (magic bytes); client chuẩn hóa qua canvas trước khi tải; HEIC/PDF → `422 FILE_REJECTED` kèm hướng dẫn
        "chụp lại bằng nút Chụp trong app". ≤ 10 MB/tệp, ≤ 4 ảnh/người, ≤ 30 tệp/đơn (SR-FILE-01/02, SR-RL-05); server mã hóa lại, bỏ EXIF/GPS.
        **0.3.3 (E06-07)**: gửi lại cho **cùng `personIndex`** = **thay thế**: ảnh cũ của người đó bị xóa (hủy DEK, `purge_journal`) trong cùng giao dịch, giữ bản mới nhất;
