    LeaseContract:
      type: object
      required: [id, code, status, startDate, endDate, monthlyRentVnd, depositVnd, billingCycleMonths, billingPeriods]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        code: { type: string, example: HD-00012 }
        status: { $ref: '#/components/schemas/LeaseContractStatus' }
        startDate: { $ref: '#/components/schemas/LocalDate' }
        termMonths: { type: integer }
        endDate: { $ref: '#/components/schemas/LocalDate' }
        monthlyRentVnd: { $ref: '#/components/schemas/MoneyVnd' }
        serviceFeeMonthlyVnd: { $ref: '#/components/schemas/MoneyVnd' }
