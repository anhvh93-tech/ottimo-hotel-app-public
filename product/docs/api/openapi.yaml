        - guestSession: []
      x-roles: [guest]
      x-guest-level: 1
      x-after-checkout: blocked
      x-scope: { guest: reservation }
      x-classification: C3
      x-c3-log: { subjectType: door_credential, action: view, actorType: guest, when: doorCode có trong phản hồi }
      x-stories: [US-108, US-128, US-112]
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GuestStay' }
          headers:
            Cache-Control: { schema: { type: string, enum: [no-store] } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/GuestForbidden' }
  /v1/guest/locale:
    put:
      tags: [guest-portal]
