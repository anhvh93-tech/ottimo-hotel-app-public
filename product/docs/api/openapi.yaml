    post:
      tags: [public]
      operationId: resendGuestLinkFromUnit
      summary: Ô "nhập mã đặt phòng" trên trang QR căn – chỉ GỬI LẠI link tới email/SĐT đã có trên đơn, KHÔNG cấp phiên (thẻ SEC-ARC-03)
      description: |
        Luôn trả cùng một phản hồi `202` "Nếu mã đúng, link đã được gửi tới liên hệ trên đơn" (không lộ đơn có tồn tại hay không).
        Chỉ xử lý khi mã đặt phòng thuộc đúng căn của `unitSlug` và đơn `confirmed`/`in_house`; gửi lại **link đang hiệu lực** không được vì server
        không giữ token rõ → cấp **link chờ** và gửi qua email trên đơn (R2) – không bao giờ trả link trong phản hồi.
        **Không thu hồi link đang dùng** (BUG-R1-SEC-03, ADR-006 điểm 4):
        - Link chờ (`guest_access_token.activation=pending`, `replaces_token_id` = link đang hiệu lực) chỉ thay link cũ khi được **mở lần đầu**
          (`openGuestSession`): lúc đó link cũ bị thu hồi, mã xác minh gắn link cũ vô hiệu. Trước đó link cũ, phiên và mã đang có vẫn dùng bình thường.
        - Tối đa **2** token còn hiệu lực/đơn (1 đang dùng + 1 chờ). Gọi lại khi đã có link chờ → thu hồi link **chờ** cũ (chưa ai dùng), cấp link chờ mới; link đang dùng giữ nguyên.
        - Link chờ **kế thừa** bộ đếm xác minh sai/khóa của link đang dùng (không reset `failed_verify_count`, `verify_locked_until` – SR-GST-08).
        - Đơn **không có email** → không cấp token, không đổi trạng thái token nào, không gửi gì (phản hồi vẫn như trên).
        - Mỗi lần xử lý (kể cả không gửi) ghi `audit_event category='security'` (`guest_link.resend_from_unit`, căn, đơn nếu khớp, IP HMAC; không ghi token).
        Giới hạn 5 lần/giờ/IP và 3 lần/ngày/đơn.
      security: []
      x-roles: [public]
      x-rate-limit: 5/giờ/IP; 3/ngày/đơn
      x-stories: [US-106]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bookingCode]
              properties:
                bookingCode: { type: string, maxLength: 20, writeOnly: true }
      responses:
        '202': { description: 'Nếu mã đúng, link đã được gửi tới liên hệ trên đơn' }
        '429': { $ref: '#/components/responses/RateLimited' }

  # ───────────────────────── public-site + hàng chờ "Yêu cầu từ website" (0.3.7 bổ sung 2 – US-155, ADR-014 mục 4, FB-INV-002 ý 3) ─────────────────────────
  # Phương án A (đội đề xuất, INV chưa xác nhận): yêu cầu đặt phòng không thanh toán → Desk, nguồn `website`. Operation phương án B (phòng trống + giá) là
  # contract-ahead, không cài. Mọi operation khối này có `x-round: R3` tới khi ORC xếp US-155 (kéo vào luồng LP thì ARC bỏ `x-round` của 5 operation A, sinh lại rbac-cases).
  /v1/public/properties/{propertySlug}/form-token:
    parameters:
      - $ref: '#/components/parameters/PropertySlug'
    get:
      tags: [public-site]
      operationId: getPublicFormToken
      summary: Mã form có chữ ký, dùng một lần – trang lấy khi khách bắt đầu điền "Yêu cầu đặt phòng" (ADR-014 4.4 tầng 1)
      description: |
        **0.3.7 bổ sung 2 – hợp đồng phương án A (US-155), cài theo lịch ORC.** Không đọc/ghi bảng nghiệp vụ.
        `token` = `v1.` + base64url(`issuedAt` | `nonce` 128 bit CSPRNG | HMAC-SHA256(`PUBLIC_FORM_SIGNING_KEY_FILE`, `propertyId | issuedAt | nonce`)).
        Dùng được trong `[notBefore, expiresAt)` = [lúc cấp + 3 giây, lúc cấp + 2 giờ] và **một lần** ở `createWebsiteBookingRequest` (nonce ghi `public_form_nonce` khi dùng).
        Cơ sở không có / không `active` / `public_booking_requests_enabled = false` → 404 cùng hình dạng (trang hiện nút Zalo thay form).
        Không cookie, không đọc phiên. GET không kiểm `Origin` (trình duyệt không gửi với GET cùng origin) – token chỉ dùng được ở POST có Origin landing.
      security: []
      x-roles: [public]
      x-allowed-origins: [landing]
      x-round: R3
      x-rate-limit: '30/giờ/IP, IPv6 theo /64 (SR-RL-10, RAM)'
      x-stories: [US-155]
      responses:
        '200':
          description: OK
          headers:
            Cache-Control: { schema: { type: string, enum: [no-store] } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicFormToken' }
              example: { token: 'v1.MTczMDUxNjQwMC5h…', notBefore: '2026-11-02T10:00:03+07:00', expiresAt: '2026-11-02T12:00:00+07:00' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /v1/public/properties/{propertySlug}/booking-requests:
    parameters:
      - $ref: '#/components/parameters/PropertySlug'
    post:
      tags: [public-site]
      operationId: createWebsiteBookingRequest
      summary: Khách gửi "Yêu cầu đặt phòng" từ website (nút "Book now" của fanpage trỏ về đây) → hàng chờ Desk, nguồn `website` – không giữ chỗ, không thanh toán
      description: |
        **0.3.7 bổ sung 2 – phương án A (FB-INV-002 ý 3; INV chưa xác nhận A/B), cài theo lịch ORC.** Tạo **một** bản ghi `website_booking_request` (`new`).
        **Không** tạo giữ chỗ, đơn, lead hay hồ sơ khách; **không** đọc `guest`, `lead`, `reservation`, `room_occupancy` trước khi trả lời → không lộ khách đã có hồ sơ hay đã gửi,
        không lộ phòng trống (v1 không trả phòng trống – phương án B: `getPublicAvailability`, `getPublicOffers`, contract-ahead). Thời gian phản hồi không phụ thuộc dữ liệu đã có.
        **Thứ tự kiểm** (đóng an toàn, ADR-014 4.4):
        1. `Origin` = `LANDING_BASE_URL` (`x-allowed-origins: [landing]`; origin app khác → 403 `FORBIDDEN_ACTION`); chỉ `application/json`; body ≤ 8 KB (Caddy chặn 16 KB). Bỏ qua mọi cookie.
        2. `Idempotency-Key` (bắt buộc – thiếu → 428; khóa của principal `public_site` + `propertyId`): đã hoàn tất cùng body → trả lại 202 cũ (`Idempotent-Replayed: true`) **trước**
           khi kiểm form token, nên mạng chập chờn gửi lại không tạo bản thứ hai; cùng khóa khác body → 422 `IDEMPOTENCY_KEY_REUSED`.
        3. Cơ sở không có / không `active` / `public_booking_requests_enabled = false` → 404.
        4. Schema (`additionalProperties: false`) → 422 `VALIDATION_FAILED`.
        5. Ô bẫy `website` có giá trị → **202 giống hệt** (mã tham chiếu ngẫu nhiên, không lưu); tăng bộ đếm `spam_honeypot`.
        6. Form token sai chữ ký / khác cơ sở / trước `notBefore` / quá `expiresAt` / đã dùng → 422 `FORM_TOKEN_INVALID`; trang lấy mã mới và gửi lại **một** lần (khóa idempotency mới).
        7. Giới hạn theo IP: 5/giờ, 20/ngày (IPv6 theo /64; IP lấy từ `X-Forwarded-For` của Caddy theo `TRUST_PROXY`, chỉ giữ HMAC) → 429 `RATE_LIMITED` + `Retry-After`.
        8. Nghiệp vụ → 422 `VALIDATION_FAILED` (`errors[]` chỉ có `field` + `code`, **không** lặp lại giá trị đã nhập): ngày (`DATE_IN_PAST`, `DATE_ORDER`, `OUTSIDE_BOOKING_WINDOW` –
           BR-112), `childrenAges` (`VALUE_OUT_OF_RANGE`), SĐT (`PHONE_INVALID`, `PHONE_COUNTRY_CODE_REQUIRED` – V-02), email (`EMAIL_INVALID`; `preferredChannel = email` mà thiếu →
           `REQUIRED`), `note` có chuỗi giống số thẻ (`CARD_NUMBER_DETECTED`, SR-PAY-09) hoặc số giấy tờ (`ID_NUMBER_DETECTED`, SR-LOG-04 – SEC ARC-08) – **không lưu gì**,
           đồng ý (`CONSENT_REQUIRED`, `NOTICE_VERSION_INVALID`).
        9. Giới hạn theo liên hệ: 3/ngày/SĐT (khóa = HMAC `web_request_contact` của SĐT E.164 – SEC ARC-07) → vượt: **202 giống hệt**, không tạo bản ghi mới; yêu cầu mới nhất của
           liên hệ đó tăng `duplicateCount` và có cờ `repeat_contact` (SEC ARC-04 – không cho dò SĐT đã gửi).
        10. Trần cơ sở `public_booking_request_daily_cap` yêu cầu/ngày (giờ cơ sở) → 503 `SITE_BUSY` + `Retry-After`, không lưu, **không** giả thành công (SEC ARC-02);
            OWN nhận **một** thông báo `website_request_cap_reached` mỗi ngày.
        11. Một giao dịch: INSERT `website_booking_request` (`refCode` ngẫu nhiên, `replyBy`, `subSource` suy từ `utm`/`refHost` – `DirectSubSource`, cờ `suspiciousFlags`) +
            `state_transition` + bộ đếm giới hạn + outbox thông báo `website_request_new` (FDL, FD, SAL – không tên/SĐT) + SSE `website_request.changed`.
        **Không** gửi email/Zalo/SMS tự động tới liên hệ khách nhập (chưa xác minh – ADR-014 4.3); nhân viên liên hệ qua kênh khách chọn. Log chỉ method/route/mã/thời gian.
        **Bật trên trang công khai** chỉ khi đạt SEC C-2, C-3, SEC-G1/G2 và trả lời ESC-001 (LZ-2, LZ-8) – US-155 AC4; trước đó trang hiện nút Zalo.
      security: []
      x-roles: [public]
      x-allowed-origins: [landing]
      x-round: R3
      x-sec-review: 'pending – SEC C-2, C-3 (landing-zalo-SEC.md), SR-RL-11'
      x-rate-limit: '5/giờ/IP và 20/ngày/IP (IPv6 /64) → 429; 3/ngày/SĐT → 202 giống hệt, không lưu; public_booking_request_daily_cap/ngày/cơ sở → 503 SITE_BUSY (SR-RL-11, đếm trong DB)'
      x-stories: [US-155, US-151]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WebsiteBookingRequestInput' }
            examples:
              facebookBookNow:
                summary: Khách bấm "Book now" trên fanpage Facebook → trang /book/?utm_source=facebook&utm_medium=page_button&utm_campaign=book_now
                value:
                  formToken: 'v1.MTczMDUxNjQwMC5h…'
                  website: ''
                  arrival: '2026-11-20'
                  departure: '2026-11-23'
                  adults: 2
                  children: 0
                  roomType: standard-studio-garden-view
                  guestName: Anna
                  phone: '+79123456789'
                  preferredChannel: whatsapp
                  note: 'Late arrival around 22:00'
                  locale: en
                  consent: true
                  consentVersion: '2026-11-01'
                  utm: { source: facebook, medium: page_button, campaign: book_now }
                  landingPath: /book/
              longStayVi:
                summary: Khách Việt ở 3 tháng, chưa chọn hạng phòng, nhắn qua Zalo
                value:
                  formToken: 'v1.MTczMDUxNzAwMC5i…'
                  arrival: '2026-12-01'
                  departure: '2027-03-01'
                  adults: 1
                  guestName: Minh
                  phone: '0905123456'
                  preferredChannel: zalo
                  locale: vi
                  consent: true
                  consentVersion: '2026-11-01'
                  landingPath: /vi/book/
      responses:
        '202':
          description: |
            Đã nhận (cũng là phản hồi **giống hệt** cho ô bẫy và cho liên hệ vượt 3/ngày – không cho biết yêu cầu có được lưu hay không). Chỉ có `refCode` và `replyBy` –
            không trả lại dữ liệu khách nhập. `Cache-Control: no-store`.
          headers:
            Cache-Control: { schema: { type: string, enum: [no-store] } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebsiteBookingRequestAccepted' }
              example: { refCode: W7K3QX9P, replyBy: '2026-11-02T10:45:00+07:00' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422':
          description: VALIDATION_FAILED (mã trường ở mô tả operation) / FORM_TOKEN_INVALID / IDEMPOTENCY_KEY_REUSED – `errors[]` không có giá trị đã nhập
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              examples:
                consent: { value: { type: /problems/validation-failed, title: Dữ liệu chưa hợp lệ, status: 422, code: VALIDATION_FAILED, errors: [{ field: consent, code: CONSENT_REQUIRED }] } }
                idInNote: { value: { type: /problems/validation-failed, title: Dữ liệu chưa hợp lệ, status: 422, code: VALIDATION_FAILED, errors: [{ field: note, code: ID_NUMBER_DETECTED }] } }
                token: { value: { type: /problems/form-token-invalid, title: Phiên điền form đã hết hạn, status: 422, code: FORM_TOKEN_INVALID } }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503':
          description: SITE_BUSY – chạm trần yêu cầu trong ngày của cơ sở; không lưu. Trang mời nhắn Zalo hoặc gọi (US-155 AC5). Cũng có thể là SERVICE_UNAVAILABLE (quy ước chung)
          headers:
            Retry-After: { schema: { type: integer } }
