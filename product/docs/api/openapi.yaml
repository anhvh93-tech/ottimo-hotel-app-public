      x-round: R3
      x-strong-reauth: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MfaConfirmInput' }
      responses:
        '204': { description: Đã tắt }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/me/2fa/setup:
    post:
      tags: [auth]
      operationId: startMy2faSetup
      summary: Bắt đầu đăng ký TOTP – trả URI otpauth để hiện QR (chỉ trả 1 lần, no-store)
      description: |
        **0.3.8 (SEC 06.7–06.9, 06.11)**: bí mật ≥ 160 bit (CSPRNG), lưu `app_user.mfa_pending_secret_enc` (DEK) hạn 10 phút; `mfa_enabled` vẫn `false`. Gọi lại → thay bí mật chờ cũ.
        **Không có `Idempotency-Key`** (bỏ ở 0.3.8): phản hồi chứa bí mật C3 không được lưu vào `idempotency_key.response_body` (SR-C3-02); gửi lại (F5, mạng chập) = bí mật chờ **mới**,
        QR cũ mất hiệu lực – không bao giờ trả lại bí mật cũ. Nhãn `OTTIMO:<tên đăng nhập>`, `issuer=OTTIMO` – không email/SĐT/tên cơ sở. 2FA đã bật → `409 INVALID_TRANSITION`.
        **0.3.8 bổ sung 1 (US-143 AC3 (a), FE-A Q1) – đăng ký lại sau khi vào bằng mã khôi phục**: ngoại lệ duy nhất của 409 – phiên hiện tại có `amr = recovery_code`
        (đăng nhập bằng mã khôi phục) thì gọi được khi 2FA **đang bật**: sinh bí mật chờ mới, bí mật cũ vẫn chạy tới khi `confirmMy2fa` thành công; `confirmMy2fa` trên đường này **thay** bí mật,
        sinh bộ 10 mã mới (bộ cũ hết hiệu lực), thu hồi phiên khác, cấp phiên mới `amr = totp`; audit `security` `mfa.reenrolled`. Thân giữ nguyên (`currentPassword` vẫn bắt buộc).
        Gọi được trong phiên hạn chế (`MFA_ENROLLMENT_REQUIRED`). Audit `security` `mfa.setup_started`.
      x-roles: [any_staff]
      x-round: R3
      x-stories: [US-143]
      x-c3-log: { subjectType: mfa_secret, action: create }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword]
              properties:
                currentPassword: { type: string, writeOnly: true }
      responses:
        '200':
          description: Bí mật tạm (chưa bật cho tới khi xác nhận)
          headers:
            Cache-Control: { schema: { type: string, enum: [no-store] } }
          content:
            application/json:
              schema:
                type: object
                required: [otpauthUri]
                properties:
                  otpauthUri: { type: string, x-classification: C3, description: 'otpauth://totp/OTTIMO:<username>?secret=…&issuer=OTTIMO', x-rbac-field: D27 }
                  expiresAt: { $ref: '#/components/schemas/Instant', description: '0.3.8 – hạn bí mật chờ (10 phút)' }
        '401': { $ref: '#/components/responses/ReauthFailed' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /v1/me/2fa/confirm:
    post:
      tags: [auth]
      operationId: confirmMy2fa
      summary: Xác nhận mã TOTP đầu tiên → bật 2FA, trả 10 mã khôi phục (một lần, no-store)
      x-c3-log: { subjectType: mfa_secret, action: create }
      description: |
        **0.3.8 (SEC 06.9, 06.10, 06.12)**: không `Idempotency-Key` (phản hồi có mã khôi phục). Đúng → `mfa_enabled = true`, `mfa_last_used_step` = bước vừa dùng, sinh 10 mã khôi phục
        (16 ký tự base32, ≥ 80 bit; DB chỉ lưu SHA-256), **thu hồi mọi phiên khác**, cấp phiên **mới** cho client đang gọi (`Set-Cookie`; `csrfToken` đổi → gọi lại `getMe`); phiên hạn chế
        kết thúc. Mất phản hồi (mạng) → gọi lại trả `409 INVALID_TRANSITION` (đã bật) – người dùng tạo bộ mã mới bằng `regenerateMyRecoveryCodes`. Không có bí mật chờ/đã hết hạn → `409`.
        Sai mã → `422 VALIDATION_FAILED` (`field` = `totpCode`), đếm SR-RL-02. Audit `security` `mfa.enrolled`; thông báo `account_security_change`.
      x-roles: [any_staff]
      x-round: R3
      x-stories: [US-143]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [totpCode]
              additionalProperties: false
              properties:
                totpCode: { type: string, pattern: '^[0-9]{6}$', writeOnly: true }
      responses:
        '200':
          description: Đã bật
          headers:
            Cache-Control: { schema: { type: string, enum: [no-store] } }
            Set-Cookie:
              schema: { type: string }
              description: Phiên mới (SR-SES-02)
          content:
            application/json:
              schema:
                type: object
                required: [recoveryCodes]
                properties:
                  recoveryCodes: { type: array, items: { type: string, description: '16 ký tự, nhóm 4-4-4-4' }, minItems: 10, maxItems: 10, x-classification: C3, x-rbac-field: D27 }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /v1/me/2fa/recovery-codes:
    post:
      tags: [auth]
      operationId: regenerateMyRecoveryCodes
      summary: Tạo bộ 10 mã khôi phục mới – bộ cũ mất hiệu lực ngay (S2; SEC 06.16)
      description: |
        **0.3.8**. Thân `StrongReauth` (mật khẩu + TOTP, hoặc mật khẩu + mã khôi phục còn lại). Không `Idempotency-Key` (phản hồi chứa mã – SEC 06.9). Chưa bật 2FA → `409 INVALID_TRANSITION`.
        Audit `security` `mfa.recovery_codes_regenerated`; thông báo `account_security_change`. Mã chỉ hiện một lần; tải `.txt`/in làm ở client (06.13).
      x-roles: [any_staff]
      x-round: R3
      x-stories: [US-143]
      x-strong-reauth: true
      x-c3-log: { subjectType: mfa_secret, action: update }
      x-rate-limit: 5 sai/người/15 phút (SR-RL-02)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StrongReauth' }
      responses:
        '200':
          description: Bộ mã mới (một lần, no-store)
          headers:
            Cache-Control: { schema: { type: string, enum: [no-store] } }
          content:
            application/json:
              schema:
                type: object
                required: [recoveryCodes]
                properties:
                  recoveryCodes: { type: array, items: { type: string }, minItems: 10, maxItems: 10, x-classification: C3, x-rbac-field: D27 }
        '401': { $ref: '#/components/responses/ReauthFailed' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
