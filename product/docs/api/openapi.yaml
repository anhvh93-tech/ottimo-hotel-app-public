  /v1/properties/{propertyId}/reservations/{reservationId}/actions/check-in:
    parameters:
      - $ref: '#/components/parameters/PropertyId'
      - $ref: '#/components/parameters/ReservationId'
    post:
      tags: [reservations]
      operationId: checkIn
      summary: Nhận phòng (B9) – buồng → OC, phụ thu (nếu lễ tân xác nhận), hạn khai báo bắt đầu tính
      description: |
        Buồng chưa VC/VI → cần `roomNotReadyOverride` (FDL+ trực tiếp; FD sẽ tạo yêu cầu duyệt `checkin_room_not_ready` – A12).
        Đơn `conflictState=open` → `409 RESERVATION_UNASSIGNED`.

        **0.3.3 (EP03-05 mục 1, E03-01…05)**
        - Thứ tự kiểm: thiết bị → quyền → `If-Match` → trạng thái `confirmed` + ngày nghiệp vụ = ngày đến (hoặc = ngày đến − 1 với B9a) (`INVALID_TRANSITION`)
          → `conflictState` (`RESERVATION_UNASSIGNED`) → điều kiện BR-402 + `document_check_block` (`409 CHECKIN_CONDITIONS_NOT_MET` + `unmet[]`)
          → phụ thu (`SURCHARGE_CHANGED`) → dữ liệu trường (422).
        - **FD gửi `roomNotReadyOverride`** → không nhận phòng, trả **202** + `ApprovalRequest` `type=checkin_room_not_ready` (A12 = D). Sau khi FDL+ duyệt,
          FD gọi lại với `roomNotReadyOverride.approvalRequestId` của yêu cầu `approved` (chỉ hiệu lực **trong ngày nghiệp vụ** duyệt, cùng đơn) → nhận phòng.
          FDL+ gửi lý do → ghi ngay (buồng → `OD`, việc dọn ưu tiên R7).
        - Chỉ trên **thiết bị được cấp** (SM-01 B9 điều kiện 0.2 điểm 8, rbac 8.7 – A11 "Q"): khác → `403 DEVICE_NOT_TRUSTED` (0.3.3 bổ sung chú thích máy đọc).
        - **`documentBlockOverride`** (điều kiện `document_check_block` = `Registration.blocksDoorCode`, BR-613 c): chỉ FDL+; FD gửi → `403 FORBIDDEN_ACTION`.
          Ghi lý do + cách xử lý vào nhật ký, `staff_notification` cho MGR. R2 chặn **B9** thay cho "chặn giao mã cửa" (giả định BA – chờ DOM E05-06 c).
        - **`expectedSurchargeVnd`**: bắt buộc khi `applyEarlySurcharge=true` (hoặc `addPriorNight=true` – là `priorNightRateVnd`); server tính lại tại thời điểm ghi,
          lệch → `409 SURCHARGE_CHANGED` kèm `surchargeVnd` mới (BR-414 "ghi đúng số đang hiển thị").
        - **B9a** (`addPriorNight=true`, event `check_in_add_prior_night`): chỉ khi ngày nghiệp vụ = ngày đến − 1; căn không trống đêm trước hoặc có OOO →
          `409 ROOM_UNAVAILABLE` + `suggestions[]`. Trực tiếp/CTV: thêm đêm đầu đơn; OTA: đơn con kênh Trực tiếp `in_house` chung folio (BR-422). `priorNightRateVnd`
          trong sàn–trần BR-105 (`RATE_OUT_OF_RANGE`). Miễn tiền đêm này = `requestFoc kind=special_discount` trên dòng `room`, không phải FOC phụ thu.
        - `cardsIssued`, `houseRulesSent` lưu vào đơn (`Reservation.cardsIssued`, `houseRulesSentAt`) – phục vụ phí thiếu thẻ/khử mùi BR-511 khi chưa có US-128.
        - `actualCheckinAt` = thời điểm bấm (giờ thật, kể cả sau nửa đêm – US-025 AC6); `checkinTime` chỉ dùng tính phụ thu.
        - **0.3.6 bổ sung 2 (BA v0.3, ARC 17/10) (E03-07, DOM S3-12)**: `checkinTime` muộn hơn giờ server quá `manual_time_tolerance_minutes` → 422 `TIME_AFTER_ACTION`; sớm hơn quá ngưỡng
          → bắt buộc `checkinTimeNote` (thiếu → 422 `TIME_NOTE_REQUIRED`). Trong **cửa sổ B9a** (ngày nghiệp vụ = ngày đến − 1, ngày lịch = ngày đến) server bỏ qua
          `checkinTime` và dùng giờ server; bắt buộc `addPriorNight=true` (thiếu → 409 `INVALID_TRANSITION`, `availableFrom` = mốc đổi ngày nghiệp vụ) – thẻ FB-R2-ARC-BE-S3-07.
          Phụ thu > 0 mà `applyEarlySurcharge` ≠ `true` → 422 `SURCHARGE_DECISION_REQUIRED` (không có "bỏ qua im lặng").
        - **0.3.7 (BUG-R2-038 – s3-contract 7.7; BA EP03-05 1.3, DOM G-7)**: `payment` (`PaymentCreate`, `type = charge`; khác → 422 `NOT_IN_LIST`, `field` = `payment.type`) – thu ngay
          trong B9, cùng quy tắc với `checkOut.finalPayment` (lỗi trường có tiền tố `payment.`; FD+ vượt còn phải thu phải có `payment.note`). VietQR: tạo QR trước bằng
          `createVietQr purpose=check_in` rồi `confirmPaymentReceived` – không gửi `payment` (folio tạm có `creditVnd` > 0 tới khi B9 ghi phụ thu, không phải trả thừa thật).
          **Thứ tự trong giao dịch**: kiểm `SURCHARGE_CHANGED` → ghi dòng phụ thu nhận sớm / đêm B9a → ghi `payment` → **mới** xét `balance_paid` (còn phải thu = 0). **BR-402 v0.3.6 (DOM 17/10 – thay giả định ARC)**:
          phần đang xin **FOC chờ duyệt trên khoản phát sinh** (phụ thu nhận sớm xin kèm `requestFocForSurcharge`, phụ thu người, khoản phát sinh đã xin trước) không phải thu để nhận phòng – mỗi
          yêu cầu trừ min(số xin, dòng) (theo thứ tự BR-434 S4-23); **tiền phòng, gồm đêm B9a, vẫn thu đủ** kể cả khi có FOC/giảm giá đặc biệt chờ duyệt; FOC tự áp trong hạn mức trừ ngay.
          Bị từ chối → còn phải thu, B18 chặn `BALANCE_DUE`; yêu cầu chưa quyết chặn trả phòng (BR-426). Oracle BR-402-01.
          Chưa đạt → 409 `CHECKIN_CONDITIONS_NOT_MET` (`unmet: [balance_paid]`), **không ghi gì** (kể cả khoản thu). Trần `payment.amountVnd` = còn phải thu sau các dòng trên
          (= `CheckInPreview.amountDueAtCheckinVnd` tính lại lúc ghi) → 422 `AMOUNT_EXCEEDS_BALANCE` (`field` = `payment.amountVnd`, `max`). Đơn `ota_prepaid`: `balance_paid` đạt như cũ.
        - **0.3.7 bổ sung 1 (FE-A s4 mục 4 – ARC chốt)**: nhánh **202** (FD gửi `roomNotReadyOverride` không kèm yêu cầu đã duyệt) **không nhận phòng và không ghi gì** ngoài
          `ApprovalRequest` `checkin_room_not_ready` – không phụ thu/đêm B9a, không FOC, không khoản thu, không lưu thẻ/nội quy. Vì vậy **không được gửi `payment`** ở nhánh này
          → 422 `VALIDATION_FAILED` mã trường `NOT_ALLOWED` (`field` = `payment`) – không ghi gì, khóa idempotency không bị tiêu; không có "bỏ qua im lặng" (tiền đã cầm mà không
          vào folio). Thu tiền khi đó: (a) FDL+ duyệt → FD gọi lại B9 kèm `roomNotReadyOverride.approvalRequestId` **và** `payment` (nhánh 200, trần như trên); hoặc (b) thu trước
          bằng `createVietQr purpose=check_in` + `confirmPaymentReceived` (folio tạm có `creditVnd`). Desk thu tiền mặt/chuyển khoản tay/POS ở lần gọi (a) – cùng giao dịch với B9 như S-1.
      x-roles: [owner, manager, front_desk_lead, front_desk]
      x-rbac: [A11, A12, S06]
      x-requires-trusted-device: true
      x-transition: [B9, B9a]
      x-stories: [US-025, US-026, US-027]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cardsIssued, houseRulesSent]
              properties:
                checkinTime: { $ref: '#/components/schemas/LocalTime' }
                checkinTimeNote: { type: string, minLength: 3, maxLength: 300, x-rbac-field: D12c, description: '0.3.6 bổ sung 2 (BA v0.3, ARC 17/10) (E03-07): bắt buộc khi `checkinTime` sớm hơn giờ thao tác quá `manual_time_tolerance_minutes`' }
                applyEarlySurcharge: { type: boolean, default: false, description: Lễ tân xác nhận ghi phụ thu vào folio (BR-414) }
                expectedSurchargeVnd:
                  $ref: '#/components/schemas/MoneyVnd'
                  description: 'Số phụ thu (hoặc tiền đêm thêm B9a) client đang hiển thị khi lễ tân xác nhận – bắt buộc khi `applyEarlySurcharge=true`; lệch → `409 SURCHARGE_CHANGED` (0.3.3, E03-02)'
                requestFocForSurcharge: { $ref: '#/components/schemas/FocRequestInput' }
                roomNotReadyOverride:
                  type: object
                  properties:
                    reason: { type: string, minLength: 3 }
                    approvalRequestId:
                      $ref: '#/components/schemas/Uuid'
                      description: 'FD gọi lại sau khi yêu cầu `checkin_room_not_ready` đã `approved` trong ngày nghiệp vụ (0.3.3, E03-03)'
                documentBlockOverride:
                  type: object
                  description: 'Chỉ FDL+ (FD → 403). Nhận tiếp khi `document_check_block` chưa đạt – lý do + cách xử lý (BR-613 c; 0.3.3, E03-01)'
                  required: [reason]
                  properties:
                    reason: { type: string, minLength: 3, maxLength: 500 }
                cardsIssued:
                  type: integer
                  minimum: 0
                  maximum: 2
                  description: 'Số thẻ phòng đã phát (BR-511: 1 chính + 1 dự phòng). **0.3.6 chốt (DOM G-1)**: tối đa 2 thẻ mỗi căn (đơn-căn), không theo đầu người'
                houseRulesSent:
                  type: boolean
                  const: true
                  description: 'Lễ tân xác nhận đã gửi/giao nội quy VI/EN – điều kiện để thu phí phạt sau này (BR-511). Thiếu/`false` → 422 `REQUIRED` (0.3.3, E03-04)'
                doorAccessHandedOver:
                  type: boolean
                  default: false
                  description: 'Ô tick "Đã giao mã cửa/thẻ cho khách" (R2 – lễ tân giao tay, app **không** lưu mã cửa; US-128 dời R3). Chỉ ghi thời điểm + người vào `Reservation.doorAccessHandedOverAt`; **không bắt buộc** – chờ PO quyết có bắt buộc trước B9 không (0.3.3, đề nghị UXD)'
                addPriorNight:
                  type: boolean
                  default: false
                  description: 'B9a – thêm đêm trước khi khách nhận trước mốc đổi ngày (BR-417, BR-010; 0.3.3, E03-05)'
                priorNightRateVnd:
                  $ref: '#/components/schemas/MoneyVnd'
                  description: 'Mặc định từ `CheckInPreview.priorNight.defaultRateVnd`; trong sàn–trần BR-105. **Vòng sửa 5 (ARC 16.18 – nguồn đêm theo thao tác)**: không còn bắt buộc – **vắng** = giá mặc định (nguồn `default`); **có** = lễ tân nhập tay (nguồn `manual`, kể cả bằng số gợi ý). Client chỉ gửi khi lễ tân sửa ô'
                payment:
                  $ref: '#/components/schemas/PaymentCreate'
                  description: '0.3.7 (BUG-R2-038): khoản thu ở bước nhận phòng H13 (`type = charge`) – thứ tự trong giao dịch và trần `amountDueAtCheckinVnd` xem mô tả operation'
            examples:
              normal: { value: { checkinTime: '14:30', applyEarlySurcharge: false, cardsIssued: 2, houseRulesSent: true } }
              earlyWithPayment: { value: { checkinTime: '11:00', applyEarlySurcharge: true, expectedSurchargeVnd: 210000, cardsIssued: 1, houseRulesSent: true, payment: { type: charge, method: cash, amountVnd: 1870000, receivedAt: '2026-10-19T11:05:00+07:00' } } }
              earlyWithSurcharge: { value: { checkinTime: '11:00', applyEarlySurcharge: true, expectedSurchargeVnd: 210000, cardsIssued: 1, houseRulesSent: true } }
