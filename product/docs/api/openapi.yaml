                    enum: [possible_duplicate]
                    description: |
                      0.3.4 Q1. Có mặt khi có ít nhất một hồ sơ sống trùng SĐT/email nằm **ngoài phạm vi** người gọi – chỉ xảy ra với SAL/CTV
                      (`exists_only_or_own`). FD+ không bao giờ nhận trường này. Client hiện "Có thể trùng – liên hệ lễ tân".
              examples:
                frontDesk: { value: { matches: [{ id: 0192a1b0-0000-7000-8000-0000000aa012, code: KH-0012, displayName: Đỗ Mai Anh, nationalityCode: VN, phoneMasked: 0901***567 }] } }
                salesOutOfScope: { value: { matches: [], match: possible_duplicate } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
