    `deprecated`, server R2 không nhận); `initialPassword`/`resetPassword` tối thiểu 10 ký tự (khớp `newPassword`, V-10); SM-16 G1/G4: CTV `own_hold_only` (rbac A23, ghi chú 36);
    ví dụ YAML có `:` đặt trong nháy (FB-R2-SEC-ARC-01). **Không đổi**: `NH-` là mã nhóm đơn; `HH-` dành cho nhóm hộ CRM (R3, erd mục 10).

    ## Thay đổi phiên bản 0.3.2-draft (R2 Đợt 0 – yêu cầu BE `d0-foundation.md` mục 5; chi tiết `rounds/round-02/outputs/ARC/d0-contract.md` mục 4)
    **Thêm**: mã `INTERNAL_ERROR` (500) vào bảng `Problem.code`. **Nới**: `ConfigParameter.statusLabel` từ enum `GD|NGANH|PL` thành mã có pattern
    (ghép `+`, ví dụ `INV-004+GD`) – client phải hiện được mã lạ. Không đổi đường dẫn, không đổi request.
