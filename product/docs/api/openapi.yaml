        Chỉ cho đơn `conflictState=open`. Server ghi segment + `room_occupancy`; trùng → `409 ROOM_UNAVAILABLE` kèm `suggestions[]`
        (cùng nhóm trước, nhóm cao hơn đánh dấu `upgrade` – chỉ gợi ý, lễ tân chọn; DOM A2). Thành công → `conflictState=resolved`,
        `overbooking_incident` → `resolved` với `resolution` tương ứng.
      x-roles: [owner, manager, front_desk_lead, front_desk]
      x-rbac: [A07]
      x-transition: B7a
      x-stories: [US-139, US-018]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roomId, resolution]
              properties:
                roomId: { $ref: '#/components/schemas/Uuid' }
                resolution: { type: string, enum: [reassigned_same_group, upgraded] }
                note: { type: string, maxLength: 500 }
                capacityWarningAckReason:
                  type: string
                  minLength: 3
                  maxLength: 500
                  description: 'Gán căn có sức chứa nhỏ hơn số khách của đơn OTA → thiếu lý do: 422 mã trường `CAPACITY_EXCEEDED_WARNING` (`field` = `roomId`); có lý do → gán, `capacityConflict=true` (DOM D-1). 0.3.5'
                  x-rbac-field: D12c
      responses:
        '200': { $ref: '#/components/responses/ReservationOk' }
        '409': { $ref: '#/components/responses/RoomUnavailable' }
        '412': { $ref: '#/components/responses/VersionConflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /v1/properties/{propertyId}/reservations/{reservationId}/actions/swap-room:
    parameters:
      - $ref: '#/components/parameters/PropertyId'
      - $ref: '#/components/parameters/ReservationId'
    post:
      tags: [reservations]
      operationId: swapRoom
      summary: Đổi chéo căn giữa 2 đơn trong một giao dịch (xử lý xung đột OTA – erd 7.5; BE-ARC-08)
      description: |
        Đơn A (đường dẫn) và đơn B (`otherReservationId`) đổi căn cho nhau trên khoảng giao nhau. Server khóa 2 dòng `room` theo
