                surchargeChanged:
                  value: { type: /problems/surcharge-changed, title: Phụ thu đã thay đổi – tải lại, status: 409, code: SURCHARGE_CHANGED, surchargeVnd: 350000 }
                priorNightUnavailable:
                  value:
                    type: /problems/room-unavailable
