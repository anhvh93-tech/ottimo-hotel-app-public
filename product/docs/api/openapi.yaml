        cardsIssued: { type: integer, minimum: 0, maximum: 2, description: '0.3.6 (DOM G-1): tối đa 2 thẻ **mỗi căn** (đơn-căn), không theo đầu người – BR-403/511' }
    DoorCredentialMasked:
