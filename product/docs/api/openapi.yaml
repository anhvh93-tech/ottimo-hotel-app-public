        **0.3.7 (B-10, B-11; BA EP07-08 6.5)**: `accept` → `acceptedAt` (người bấm thành người xử lý nếu chưa giao); `wait-parts` bắt buộc `note` và (mức `medium`/`low`) `partsExpectedDate`
