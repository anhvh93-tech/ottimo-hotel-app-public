    # ── app khách ──
    GuestSession:
      type: object
      required: [level, reservationCode, locale, expiresAt]
      properties:
        level: { type: integer, enum: [1, 2] }
        reservationCode: { type: string }
        stayEnded: { type: boolean, description: 'Đơn đã trả phòng – chỉ còn bill/thanh toán phát sinh (SR-GST-11)' }
        verification:
          type: object
          description: Cách lên mức 2 khả dụng (để guest-web hiện đúng nút)
          properties:
            emailOtpAvailable: { type: boolean, description: 'false khi đơn không có email hoặc email vừa đổi < 24 giờ (SR-GST-14)' }
            maskedEmail: { type: string, x-rbac-field: D02 }
            locked: { type: boolean, description: 'Token bị khóa xác minh – chỉ mã lễ tân tại quầy/điện thoại (SR-GST-08)' }
        guestFirstName: { type: string, x-rbac-field: D01 }
        roomNo:
          type: [string, 'null']
          deprecated: true
          description: '**Deprecated 0.3.7 bổ sung D1 (BR-012 (1))**: khách không thấy số căn – server **không trả** (vắng) từ bản cài S4-49 của BE; guest-web dùng `roomName`. Giữ trong schema tới 0.4 để client cũ không vỡ kiểu'
        roomName:
          type: [string, 'null']
          description: '0.3.7 bổ sung D1 (BR-012): như `GuestStay.roomName`'
        publicRoomType:
          type: [string, 'null']
          description: '0.3.7 bổ sung D1 (BR-012): như `GuestStay.publicRoomType`'
        locale:
          $ref: '#/components/schemas/Locale'
          description: |
            Ngôn ngữ của phiên – guest-web dùng đúng giá trị này (không tự đổi theo trình duyệt khi đã có phiên). **0.3.7 bổ sung 1 (MOB s4 mục 4, P-S4-10)** – server chọn lúc
            `openGuestSession` theo thứ tự: (1) **khách đã tự chọn** cho đơn này (`setGuestLocale` ở một phiên trước của cùng đơn, mới nhất thắng) → giữ, `localeChosenByGuest = true`;
            (2) `preferredLocale` của hồ sơ người đứng tên (`vi`/`en`/`ru`) nếu có; (3) `Accept-Language` của trình duyệt, thẻ ngôn ngữ đầu tiên: `vi*` → `vi`, `ru*` → `ru`,
            khác hoặc vắng → **`en`** (mặc định EN – P-S4-10). `setGuestLocale` đổi ngôn ngữ phiên và đánh dấu đã tự chọn.
        localeChosenByGuest:
          type: boolean
          description: '0.3.7 bổ sung 1 (MOB s4 mục 4): `true` khi `locale` là lựa chọn của khách (`setGuestLocale`), `false`/vắng khi server tự chọn theo hồ sơ hoặc `Accept-Language` – guest-web chỉ dùng để hiện trạng thái nút ngôn ngữ, không tự đổi `locale`'
        expiresAt: { $ref: '#/components/schemas/Instant' }
        level2ExpiresAt: { $ref: '#/components/schemas/Instant' }
    GuestStay:
      type: object
      required: [reservationCode, status, arrivalDate, departureDate, checkinTime, checkoutTime, property]
      properties:
        reservationCode: { type: string }
        status: { $ref: '#/components/schemas/ReservationStatus' }
        stayType: { type: string, enum: [short, long] }
        roomNo:
          type: [string, 'null']
          deprecated: true
          description: '**Deprecated 0.3.7 bổ sung D1 (BR-012 (1))**: khách không thấy số căn – server **không trả** (vắng) từ bản cài S4-49 của BE; guest-web dùng `roomName`/`publicRoomType`. Giữ trong schema tới 0.4 để client cũ không vỡ kiểu'
        roomName:
          type: [string, 'null']
          example: The Bloom
          description: |
            0.3.7 bổ sung D1 (BR-012 (1), (4), (5)): tên phòng của căn đang gán (đơn đang ở: căn hiện tại sau đổi phòng – khách thấy tên mới). `null` khi chưa gán căn, căn chưa có tên,
            hoặc đơn chưa báo căn cho khách (`Reservation.roomDisclosedToGuest = false`) – khi đó guest-web hiện `publicRoomType`. Tên phòng nhạy cảm như số căn (BR-978): trang có token
            được hiện, nhưng **không** đặt cạnh mã cửa trong một khối/tin (DS 11.3)
        publicRoomType:
          type: [string, 'null']
          example: Standard Studio · Garden View
          description: '0.3.7 bổ sung D1 (BR-012): hạng phòng công khai của căn đang gán (`Room.publicRoomType`); `null` khi chưa gán căn hoặc chưa nhập'
        arrivalDate: { $ref: '#/components/schemas/LocalDate' }
        departureDate: { $ref: '#/components/schemas/LocalDate' }
        checkinTime: { $ref: '#/components/schemas/LocalTime' }
        checkoutTime: { $ref: '#/components/schemas/LocalTime' }
        property:
          type: object
          properties:
            name: { type: string }
            address: { type: string }
            mapUrl:
              type: string
              format: uri
              description: |
                0.3.6 (SEC E14-08): chỉ `https`, host khớp **chính xác** một trong `maps.google.com`, `www.google.com` (path bắt đầu `/maps`), `maps.app.goo.gl`,
                `maps.apple.com`, `www.openstreetmap.org`; kiểm khi OWN lưu (422 `NOT_IN_LIST`). guest-web mở với `rel="noopener noreferrer"`.
                0.3.7 bổ sung 1 (S4-51): giá trị = tham số `property_map_url` đang hiệu lực (xem `setParameter`; vắng thì cột `property.map_url`); host kiểm lại **mỗi lần đọc** –
                không hợp lệ → trường vắng (không trả link lạ).
            phone: { type: string }
        houseRules: { type: string, description: 'Nội quy + phí phạt theo tham số BR-511, theo ngôn ngữ' }
        guestFullName:
          x-rbac-field: D01
          type: string
          x-guest-level: 2
        wifi:
          type: [object, 'null']
          description: 'null trước ngày nhận phòng (US-108 AC2)'
          properties:
            ssid: { type: string }
            password: { type: string }
        doorCode:
          type: [object, 'null']
          description: 'Chỉ khi phiên mức 2 và trong khoảng hiệu lực và đơn confirmed/in_house (BR-403, US-128 AC1, SR-GST-10); không trả → hiện "sẽ hiện vào ngày nhận phòng". Mỗi lần trả ghi c3_access_log actor_type=guest'
          x-guest-level: 2
          properties:
            code: { type: string, x-classification: C3, x-rbac-field: D22 }
            validFrom: { $ref: '#/components/schemas/Instant' }
            validTo: { $ref: '#/components/schemas/Instant' }
        doorCodeAvailableFrom: { $ref: '#/components/schemas/Instant' }
        onlineCheckinAvailable: { type: boolean }
    OnlineCheckin:
      type: object
      required: [currentStep, requiredPeople, uploadedPeople]
      properties:
        currentStep: { type: string, enum: [notice, documents, eta, consent, done], description: '0.3.3 thêm `notice` (bước 0 – thông báo xử lý dữ liệu)' }
        requiredPeople: { type: integer }
        uploadedPeople: { type: array, items: { type: integer }, description: 'Chỉ số người đã tải giấy tờ – không trả lại ảnh/số' }
        etaTime: { $ref: '#/components/schemas/LocalTime' }
        consentRecorded: { type: boolean, x-rbac-field: D20 }
        completedAt: { $ref: '#/components/schemas/Instant' }
        noticeAccepted:
          type: boolean
          x-guest-level: 1
          x-sec-review: approved-DK2 (SEC 16/10/2026)
          description: 'true khi khách đã bấm "Tôi đã đọc" cho phiên bản thông báo **hiện hành** (0.3.3, E06-06)'
        lateArrival:
          type: boolean
          x-guest-level: 1
          x-sec-review: approved-DK2 (SEC 16/10/2026)
          description: '0.3.3, E06-06'
        deferredPeople:
          type: array
          x-guest-level: 1
          x-sec-review: approved-DK2 (SEC 16/10/2026)
          items: { type: integer, minimum: 1 }
          description: 'Chỉ số người "bổ sung tại quầy" – không có thông tin nào khác về người đó (0.3.3, E06-06)'
        currentNoticeVersion:
          type: string
          x-guest-level: 1
          x-sec-review: approved-DK2 (SEC 17/10/2026)
          pattern: '^[a-z0-9][a-z0-9.-]{2,63}$'
          example: privacy-2026-10-v1
          description: |
            0.3.6 bổ sung (review S3 – đề nghị MOB s3 mục 5; SEC duyệt có điều kiện 17/10). Tham số **cơ sở** `privacy_notice_version` hiện hành theo ngày nghiệp vụ –
            giá trị phải gửi lại ở `updateOnlineCheckin.noticeVersion` và `ConsentInput.noticeVersion`. Client chỉ có văn bản cho các phiên bản nó biết: gặp phiên bản lạ
            hoặc thiếu trường → **không** hiện bước thông báo/câu đồng ý, hướng "làm thủ tục tại quầy" (fail closed). Có ở **mọi** phản hồi `OnlineCheckin`.
        imageRetentionDays:
          type: integer
          minimum: 1
          maximum: 365
          example: 30
          x-guest-level: 1
          x-sec-review: approved-DK2 (SEC 17/10/2026)
          description: |
            0.3.6 bổ sung (review S3). Tham số `id_image_retention_days_after_checkout` (BR-610) hiện hành – số ngày câu đồng ý P02b hiện cho khách; gửi lại ở
            `ConsentInput.retentionDays`. Thiếu trường → client không hiện câu đồng ý (không rơi về 30).
    GuestFolio:
