openapi: 3.1.0
info:
  title: OTTIMO Desk API
  version: 0.3.6-draft
  summary: Hợp đồng API bản nháp cho các story Must Round 2 (R1 Pha B – ARC)
  description: |
    Bản nháp hợp đồng API (contract-first, ADR-001). Nguồn sự thật cho kiểu dữ liệu dùng chung
    (`packages/contracts` sinh từ file này bằng openapi-typescript + zod).

    **Đọc cùng**: `product/docs/erd.md` (bảng, trạng thái), `product/docs/state-machines.md` (mã chuyển B1…, K1…),
    `product/docs/rbac-matrix.md` (vai, hành động A-xx, trường), `product/docs/business-rules.md` (BR-xxx),
    `product/docs/coding-standards.md` (quy ước API).

    ## Quy ước chung
    - **Đường dẫn**: `/v1/...`; tài nguyên cấp cơ sở nằm dưới `/v1/properties/{propertyId}/...` (ADR-007).
      Tài nguyên con được truy cập bằng id toàn cục (ví dụ `/v1/properties/{propertyId}/reservations/{reservationId}`).
    - **JSON**: tên trường `camelCase`; enum `snake_case` (trừ mã buồng `VC`, `VI`… giữ nguyên theo BR-801).
    - **SĐT** (0.3.4, FB-R2-QA-BE-04): request nhận dạng người dùng gõ (V-02); **response luôn là E.164 có dấu `+`** (`+84905123456`, `+79123456789`).
      DB lưu không dấu `+` (`guest.phone_e164` = `84…`, erd 4.2) – thêm/bỏ `+` chỉ ở tầng API. Adapter INT (Zalo/SMS) nhận dạng có `+` từ API nội bộ.
    - **Quốc tịch** (0.3.4): `nationalityCode` của **hồ sơ khách** (`GuestInput`, `Guest`, `GuestSummary`) là ISO 3166-1 **alpha-2** (`VN`, `RU`);
      của **giấy tờ** (`GuestDocument*`) là **alpha-3** (`VNM`, `RUS` – như MRZ). Chuyển đổi alpha-3 → alpha-2 khi cập nhật hồ sơ từ giấy tờ do server làm (module registration).
    - **Tiền**: số nguyên VND (`MoneyVnd`). **Ngày lưu trú**: `YYYY-MM-DD` theo giờ cơ sở. **Thời điểm**: ISO-8601 có offset `+07:00`.
      **Giờ cấu hình**: `HH:mm`.
    - **Lỗi**: RFC 9457 `application/problem+json` (schema `Problem`) với trường mở rộng `code` (mã máy đọc, ổn định)
      và `errors[]` (lỗi theo trường). Client hiển thị theo `code` + bản dịch của UXD, không hiển thị `detail` thô.
    - **Phân trang**: con trỏ (`cursor`, `limit` ≤ 100); phản hồi `{ data: [...], page: { nextCursor, limit } }`.
      Danh sách nhỏ cố định (căn, kênh, rack) không phân trang.
    - **Idempotency** (ADR-009): header `Idempotency-Key` (UUID) **bắt buộc** với mọi POST tạo đơn/giữ chỗ/thu tiền/chuyển trạng thái
      và mọi thao tác gửi từ hàng đợi offline của PWA. Gửi lại cùng key + cùng body → trả lại phản hồi cũ (kèm header `Idempotent-Replayed: true`);
      cùng key khác body → `422 IDEMPOTENCY_KEY_REUSED`; request trước còn đang xử lý → `409 IDEMPOTENCY_IN_PROGRESS`.
      Header khai `required: false` trong spec để validator không trả `422`; **middleware** kiểm operation có tham số này và trả
      `428 PRECONDITION_REQUIRED` khi thiếu (bảng mã lỗi là chuẩn).
      Khóa = (`principal_type` `user|guest_session`, `principal_id`, `key`). Bản ghi khóa INSERT `state=in_progress` **trong cùng giao dịch nghiệp vụ**:
      request trùng song song chờ UK rồi nhận `409 IDEMPOTENCY_IN_PROGRESS`; giao dịch rollback thì khóa cũng mất, client gửi lại được.
    - **Thứ tự kiểm** (bắt buộc, middleware dùng chung): xác thực → CSRF/Origin → thiết bị tin cậy (nếu `x-requires-trusted-device`)
      → `Idempotency-Key` (đã hoàn tất → trả lại phản hồi cũ, **không** kiểm `If-Match` nữa) → `If-Match` → quyền vai/phạm vi → nghiệp vụ.
      Nhờ vậy thao tác offline gửi lại sau khi đã thành công nhận lại kết quả cũ thay vì `412`.
    - **`dryRun: true`** (tính thử) **không** cần `Idempotency-Key`/`If-Match`, không ghi gì và không tiêu khóa; chỉ lần gọi thật mới cần.
    - **Khóa lạc quan**: GET tài nguyên sửa được trả `ETag: "<version>"`; PATCH và các hành động đổi trạng thái của đơn/folio/khai báo
      **bắt buộc** `If-Match: "<version>"`. Thiếu → `428 PRECONDITION_REQUIRED`; lệch → `412 VERSION_CONFLICT`
      ("Dữ liệu vừa thay đổi, tải lại" – state-machines 0.2.6). Ngoại lệ có chủ đích: thêm dòng folio (`addFolioLine`) là chỉ-thêm,
      không cần `If-Match`; server khóa `folio … FOR UPDATE` và trả `409 FOLIO_LOCKED` nếu bill đã khóa.
    - **Thiết bị tin cậy** (SR-DEV-01…06, decision-log SEC): operation có `x-requires-trusted-device: true` (mọi đọc/ghi C3 của nhân viên) chỉ chạy khi
      request có cookie `__Host-ottimo_did` hợp lệ, chưa thu hồi, cùng cơ sở → nếu không `403 DEVICE_NOT_TRUSTED` + `audit_event access.denied`.
      PWA nhân viên không bao giờ được cấp. Trực đêm dùng **thiết bị của cơ sở** đã được owner cấp (phân xử ORC 15/10).
    - **App khách** (ADR-006): operation `/v1/guest/*` có `x-guest-level` = `1` (chỉ cần link) hoặc `2` (đã xác minh bằng OTP email hoặc mã lễ tân cấp).
      Sau khi đơn `checked_out` chỉ còn `getGuestFolio` + thanh toán phát sinh (mức 2); mọi operation khác trả `403 GUEST_STAY_ENDED` (SR-GST-11).
      Mỗi operation khách khai `x-after-checkout: blocked|allowed` (`allowed`: mở phiên, OTP/xác minh, đổi ngôn ngữ, bill, rút đồng ý) để test sinh tự động (BUG-R1-SEC-04).
      Thuộc tính có `x-guest-level: 2` vắng mặt khi phiên mới ở mức 1.
    - **Ba origin** (SR-HDR-04): admin-web, PWA nhân viên, guest-web ở 3 tên miền con; mỗi origin proxy `/v1` tới api (không CORS);
      cookie host-only tiền tố `__Host-`. Ở dev HTTP tên cookie bỏ tiền tố qua cấu hình `COOKIE_SECURE_PREFIX=false`.
    - **Phân quyền** (rbac-matrix mục 8): mỗi operation có `x-roles` (vai được gọi) và `x-scope` (phạm vi dữ liệu theo vai:
      `all` toàn cơ sở, `own` của mình, `today` việc hôm nay, `reservation` đơn của khách). Vai không có trong `x-roles` → `403 FORBIDDEN_ACTION`
      và ghi nhật ký lần bị từ chối (US-002 AC2). Bản ghi ngoài phạm vi hoặc thuộc cơ sở khác → `404 NOT_FOUND` (không lộ sự tồn tại).
    - **Cấu hình kênh gửi mã xác minh**: tham số cơ sở `guest_verify_code_channels` (mảng con của `airbnb_inbox`, `booking_inbox`, `agoda_inbox`, `zalo`;
      mặc định rỗng = tắt) đọc/sửa qua `GET/PUT /v1/properties/{propertyId}/parameters/{key}` – chỉ owner sửa, ghi audit `security` (SR-GST-13, BUG-R1-SEC-02).
    - **Tham số bảo mật** (BUG-R1-SEC-02): các khóa trong `setParameter.x-security-parameters` chỉ **owner** sửa (vai khác → `403 FORBIDDEN_ACTION`),
      giá trị phải nằm trong biên cứng do SEC đặt (ngoài biên → `422 PARAM_OUT_OF_RANGE`, kể cả với owner), mỗi lần sửa ghi `audit_event category='security'`.
    - **Nhật ký C3** (`x-c3-log`): operation có thuộc tính này ghi **một** dòng `c3_access_log` (`subject_type`, `action` như khai) **trước khi** trả giá trị C3
      và luôn trả `Cache-Control: no-store`; với operation chỉ trả C3 trong một số trường hợp (ví dụ `getGuestStay` mức 2), chỉ ghi khi giá trị C3 thực sự có trong phản hồi.
      Operation **ghi** C3 (`action` `create|update|purge`) ghi log trong **cùng giao dịch** với thao tác ghi; `onCreate` = action dùng khi bản ghi chưa tồn tại.
      Mọi operation có `x-classification: C3` đều khai `x-c3-log` (BUG-R1-SEC-11, R2 W16); `subjectType`/`action` theo enum erd `c3_access_log`.
    - **Mã lỗi khai báo cho operation C3** (W16): có `x-requires-trusted-device` → khai `403`; có `x-step-up` hoặc cần phiên → khai `401`;
      có `x-rate-limit` → khai `429`. QA sinh test tầng R từ các chú thích này.
    - **Mã trường rbac**: thuộc tính nhạy cảm có `x-rbac-field` (D01…D29 của rbac-matrix mục 6) để QA sinh test trường tự động; phủ dần ở R2.
    - **Lọc trường theo vai**: thuộc tính schema có `x-visible-to` chỉ xuất hiện trong JSON khi người gọi có một trong các vai đó;
      với vai khác thuộc tính **vắng mặt** (không phải `null`). Thuộc tính có `x-classification: C3` chỉ trả qua endpoint `.../sensitive`
      hoặc tải ảnh, mỗi lần đều ghi `c3_access_log`, luôn `Cache-Control: no-store`.
    - **Hành động hợp lệ**: tài nguyên có máy trạng thái trả `allowedActions[]` tính theo trạng thái **và** vai người gọi (US-020).
      Mỗi phần tử có `action` (tên route `kebab-case`) **và** `event` = mã chuyển của BA (`B4`, `B9`, `K6`…, state-machines.md) để FE/QA đối chiếu.
    - **Bảo mật**: nhân viên dùng cookie phiên `__Host-ottimo_sid` (HttpOnly, Secure, SameSite=Lax, Path=/) + header `X-CSRF-Token` và `Origin` hợp lệ cho method ghi;
      khách dùng cookie `__Host-ottimo_gsid` sau khi đổi token link (ADR-006). Không đưa dữ liệu C2/C3 vào URL/query.
      Đổi vai, khóa tài khoản, đặt lại/đổi mật khẩu, tắt 2FA → **thu hồi ngay mọi phiên** của người đó; quyền đọc theo `user_property_role`
      mỗi request (cache ≤ 60 giây có `roles_version`) – SR-SES-06, SR-AZ-08.
    - **Nhật ký**: `AuditEvent.before/after` sinh bằng serializer audit theo **danh sách trường cho phép** từng thực thể; cột `_enc` và giá trị C3
      không bao giờ vào nhật ký (SR-AUD-03).
    - **Tệp tải lên** (SR-FILE-01…06, bản SEC v0.2): server chỉ nhận **JPEG, PNG, WebP** xác định bằng magic bytes cho mọi kênh;
      **không nhận PDF, không nhận HEIC/HEIF** (→ `422 FILE_REJECTED` kèm hướng dẫn chụp lại); client chuẩn hóa (canvas → JPEG ~0,85, cạnh ≤ 2.500 px);
      ≤ 10 MB/tệp, ≤ 40 MP, ≤ 4 ảnh/người/giấy tờ, ≤ 30 tệp/đơn từ app khách; server vẫn **mã hóa lại** ảnh (sharp), bỏ EXIF/GPS; phản hồi tệp có `Cache-Control: no-store`,
      `X-Content-Type-Options: nosniff`, `Content-Security-Policy: sandbox; default-src 'none'`, `Content-Disposition: inline; filename="document"`.
    - **Xác nhận lại (step-up)**: operation có `x-step-up: true` cần PIN duyệt hoặc mật khẩu trong cửa sổ trượt `c3_stepup_minutes`
      (mặc định 15 phút, mỗi thao tác C3 gia hạn) qua `POST /v1/me/step-up`; hết cửa sổ → `401 REAUTH_REQUIRED` (SR-C3-09).
    - **Endpoint kiểm thử**: `/__test__/*` (đặt/tua giờ `MutableClock`, chạy job theo yêu cầu) **không** thuộc hợp đồng này – xem `openapi.test.yaml`;
      chỉ đăng ký khi `APP_ENV ∈ {dev, test, staging}`, không bao giờ ở production.
    - **Hành động không đảo ngược** (US-135): hủy đơn, trả sớm, đặt trả muộn hỗ trợ `dryRun: true` để client hiện hộp xác nhận nêu hậu quả
      (đêm mở bán lại, khoản giữ lại/hoàn, phụ thu); hoàn tất trả phòng dùng `GET .../checkout-summary`. Server **không** dựa vào hộp xác nhận
      để bảo vệ dữ liệu – mọi điều kiện vẫn kiểm lại khi ghi.
    - **Thời gian thực**: SSE `GET /v1/properties/{propertyId}/events` chỉ phát `{type, id}`; client gọi lại API để lấy dữ liệu theo quyền.
      Danh mục sự kiện (0.3.5): `reservation.changed`, `room.status_changed`, `attention.changed`, `hk_task.changed`, `work_order.changed`,
      `guest_request.changed`, `notification.created` (chỉ tới người nhận). `task.assigned`, `request.created` của 0.2 bỏ.
      0.3.6 (A-35): thêm `registration.changed` (id = registrationId; FD+) và `payment.changed` (id = paymentId; MGR+ và người ghi). Folio đổi
      (dòng, thu tiền, bill) phát `reservation.changed` của đơn gốc – không có sự kiện `folio.*` riêng.

    ## Mã lỗi (`Problem.code`)
    | code | HTTP | Khi nào |
    |---|---|---|
    | VALIDATION_FAILED | 422 | Sai dữ liệu đầu vào (`errors[]`) |
    | UNAUTHENTICATED | 401 | Chưa đăng nhập / phiên hết hạn |
    | FORBIDDEN_ACTION | 403 | Vai không được làm hành động |
    | NOT_FOUND | 404 | Không có hoặc ngoài phạm vi |
    | INTERNAL_ERROR | 500 | Lỗi không lường trước ở server – `detail` chung, không lộ SQL/stack; kèm `requestId` để tra log (0.3.2). Mọi operation đều có thể trả; không khai lại ở từng operation |
    | CONCURRENT_UPDATE | 409 | Tranh chấp khóa DB tạm thời (chờ khóa quá `lock_timeout` 55P03, deadlock 40P01, serialization 40001) – **không có gì được ghi**; kèm header `Retry-After` (giây). Client gửi lại **cùng** `Idempotency-Key`/`If-Match`. Mọi operation ghi đều có thể trả; không khai lại ở từng operation (0.3.5, FB-R2-SEC-BE-23) |
    | SERVICE_UNAVAILABLE | 503 | Câu lệnh quá `statement_timeout` (57014) hoặc DB/pool tạm không phục vụ – không có gì được ghi; kèm `Retry-After`. Mọi operation đều có thể trả (0.3.5, FB-R2-SEC-BE-23) |
    | ROOM_UNAVAILABLE | 409 | Trùng căn – đêm (BR-906) – kèm `conflicts[]` |
    | ROOM_BLOCKED | 409 | Căn đang khóa OOO (US-019) – khi **mọi** phần tử `conflicts[]` là `kind=ooo`; lẫn đơn → ROOM_UNAVAILABLE (0.3.5) |
    | ROOM_NOT_SELLABLE | 409 | Căn ngừng bán (US-004) |
    | ROOM_OCCUPIED | 409 | Khóa phòng (`createRoomBlock`, `updateRoomBlock`, `createWorkOrder.block`) giao đơn đang ở (`in_house`) – đổi phòng cho khách trước (BR-804, BR-424); kèm `conflicts[]` (0.3.5) |
    | INVALID_TRANSITION | 409 | Chuyển trạng thái không hợp lệ với trạng thái hiện tại |
    | VERSION_CONFLICT | 412 | `If-Match` lệch |
    | PRECONDITION_REQUIRED | 428 | Thiếu `If-Match` hoặc `Idempotency-Key` |
    | IDEMPOTENCY_KEY_REUSED | 422 | Cùng key, khác body |
    | IDEMPOTENCY_IN_PROGRESS | 409 | Request cùng key đang xử lý |
    | HOLD_EXPIRED | 409 | Giữ chỗ đã hết hạn |
    | HOLD_NOT_ALLOWED_TODAY | 422 | Giữ chỗ cho ngày đến = hôm nay (BR-302) |
    | QUOTE_EXPIRED | 409 | Báo giá hết hiệu lực (BR-304) |
    | CAPACITY_EXCEEDED | 422 | Vượt sức chứa (BR-110) |
    | OUTSIDE_BOOKING_WINDOW | 422 | Ngoài cửa sổ bán / số đêm (BR-112) |
    | RATE_OUT_OF_RANGE | 422 | Giá ngoài sàn–trần (BR-105) |
    | PHONE_REQUIRED | 422 | Kênh trực tiếp/CTV thiếu SĐT |
    | DEPOSIT_INSUFFICIENT | 422 | Chưa đủ cọc để xác nhận (B4) |
    | CHECKIN_CONDITIONS_NOT_MET | 409 | Thiếu điều kiện BR-402 – kèm `unmet[]` |
    | RESERVATION_UNASSIGNED | 409 | Đơn OTA xung đột chưa gán căn |
    | LATE_CHECKOUT_CONFLICT | 409 | Có khách đến cùng ngày, không có căn thay thế (BR-416) |
    | BALANCE_DUE | 409 | Còn phải thu > 0 khi hoàn tất trả phòng (BR-426) |
    | PENDING_APPROVALS | 409 | Folio còn yêu cầu duyệt chờ (SM-10) |
    | FOLIO_LOCKED | 409 | Bill đã khóa (US-038 AC2) |
    | SELF_APPROVAL_FORBIDDEN | 403 | Tự duyệt yêu cầu của mình (BR-432) |
    | APPROVAL_LIMIT_EXCEEDED | 403 | Vượt hạn mức người duyệt (BR-433) – yêu cầu đã chuyển cấp trên |
    | REAUTH_FAILED | 401 | Xác nhận lại sai mật khẩu/PIN (`changeMyPassword`, `trustCurrentDevice`, `approveRequest`, `rejectRequest`, sau này step-up/PIN) – luôn kèm `errors[{field: <ô mật khẩu của operation>, code: REAUTH_FAILED}]`. **Không phải hết phiên**: client hiện lỗi tại ô, không chuyển trang đăng nhập; chỉ `code = UNAUTHENTICATED` mới là hết phiên (0.3.4 Q4) |
    | DUPLICATE_GUEST | 409 | `createGuest`/`updateGuest`: trùng SĐT/email (BR-951) – kèm `errors[{field: phone\|email, code: DUPLICATE_GUEST}]`; `existingGuestId`/`existingGuestCode` **chỉ có khi người gọi được xem hồ sơ đó** (SAL/CTV ngoài phạm vi → vắng). `PARTY_DUPLICATE` chỉ dùng cho `addPartyMember` (0.3.4 Q5) |
    | CARD_NUMBER_DETECTED | 422 | Văn bản tự do chứa chuỗi giống số thẻ (R-PAY-07) |
    | PAYMENT_NOT_CONFIGURED | 409 | Chưa cấu hình tài khoản nhận VietQR (US-120 AC2) |
    | REGISTRATION_INCOMPLETE | 409 | Chưa đủ người / chưa xử lý cảnh báo đối chiếu (K5) |
    | GUEST_LINK_INVALID | 401 | Link khách sai, hết hạn hoặc đã thu hồi |
    | GUEST_VERIFICATION_REQUIRED | 403 | Cần xác minh mức 2 (ADR-006) |
    | FILE_REJECTED | 422 | Tệp sai loại/kích thước/có mã độc |
    | RATE_LIMITED | 429 | Quá số lần (đăng nhập, xác minh khách) |
    | DEVICE_NOT_TRUSTED | 403 | Thao tác C3 từ thiết bị chưa được owner cấp (SR-DEV-03) |
    | GUEST_VERIFICATION_LOCKED | 429 | Token khách sai xác minh quá 5 lần/24 giờ – nhờ lễ tân cấp mã (SR-GST-08) |
    | GUEST_STAY_ENDED | 403 | Đơn đã trả phòng – chỉ còn xem bill/thanh toán phát sinh (SR-GST-11) |
    | DELIVERY_CHANNEL_DISABLED | 409 | Kênh gửi mã xác minh (OTA/Zalo) chưa được owner bật (phân xử ORC 15/10) |
    | MFA_REQUIRED | 401 | Cần mã TOTP để hoàn tất đăng nhập (SR-AUTH-06, R3) |
    | PASSWORD_CHANGE_REQUIRED | 403 | Đang dùng mật khẩu tạm – chỉ được gọi `POST /v1/me/password` (SR-AUTH-05) |
    | REAUTH_REQUIRED | 401 | Cần xác nhận lại PIN/mật khẩu trước thao tác C3 (SR-C3-09) |
    | PAYLOAD_TOO_LARGE | 413 | Body/tệp vượt giới hạn (webhook 64 KB, tệp 10 MB) |
    | CAPACITY_BELOW_BOOKINGS | 409 | Giảm sức chứa căn/nhóm xuống dưới số khách của đơn tương lai/đang ở – kèm `conflicts[]` (`reservationCode`, `stayFrom`, `stayTo`, `guestCount`) (US-004, BR-110; BUG-R1-007) |
    | PARAM_OUT_OF_RANGE | 422 | Giá trị tham số ngoài biên cho phép (`setParameter`) – kèm `min`, `max` (hoặc `allowed[]`) và `errors[{field: value}]`; áp dụng cả biên cứng tham số bảo mật (BUG-R1-007, BUG-R1-SEC-02) |
    | SHIFT_ALREADY_OPEN | 409 | Người dùng đã có ca chưa `closed` ở cơ sở (SM-17 C1, R3) |
    | SHIFT_NOT_OPEN | 409 | Ghi tiền mặt khi chưa mở ca (erd `payment.shift_id`, R3 – khi bật đóng ca) |
    | SHIFT_VARIANCE_REASON_REQUIRED | 422 | Đóng ca có chênh lệch tiền mặt ≠ 0 mà thiếu lý do (BR-526, SM-17 C3) |
    | GROUP_ALLOCATION_MISMATCH | 422 | Tổng phân bổ cọc nhóm ≠ số tiền giao dịch, hoặc đơn không thuộc nhóm (BR-322, SM-16 G2) |
    | USERNAME_TAKEN | 409 | `createUser`: tên đăng nhập đã có trong tổ chức (US-002; 0.3.1) |
    | PARTY_DUPLICATE | 409 | `addPartyMember`: người này đã có trong đơn, kể cả người đứng tên (US-022 AC3; 0.3.1) |
    | ROOM_NOT_READY | 409 | `changeRoom` (B14): căn mới chưa ở trạng thái buồng `VI`/`VC` (BR-803, US-024 AC4) – kèm `roomStatus` (0.3.1) |
    | SURCHARGE_CHANGED | 409 | `checkIn`/`setLateCheckout`/`checkOut`: phụ thu server tính lại khác `expectedSurchargeVnd` client đã hiển thị (BR-414) – kèm `surchargeVnd` mới; client tải lại preview rồi hỏi lại lễ tân (0.3.3, E03-02) |
    | MINIBAR_NOT_CHECKED | 409 | `checkOut`: căn có món minibar tính tiền mà chưa có lần kiểm `mode=checkout` (US-035, blocker `minibar_not_checked`) (0.3.3, E05-04) |
    | SELF_RECONCILE_FORBIDDEN | 403 | `reconcilePayment`: người đối soát là người đã ghi/xác nhận giao dịch, và không phải OWN (rbac A46) (0.3.3, E05-03) |
    | CONSENT_CHANGE_NOT_ALLOWED | 409 | `recordImageConsent`: đổi `refused → granted` khi ảnh đã xóa (khai báo đã `confirmed` hoặc ảnh đã purge) (BR-609 c) (0.3.3, E06-02) |
    | SELF_REFUND_FORBIDDEN | 403 | `executeCashRefund`/`executeRefund`: người chi là người đã tạo yêu cầu hoàn (`requestedBy`) – không ngoại lệ (rbac A47a ghi chú 38) (0.3.6) |
    | REFUND_DESTINATION_REQUIRED | 409 | `executeRefund`: yêu cầu hoàn chưa có nơi nhận (`setRefundDestination`) hoặc nơi nhận đổi sau khi duyệt (yêu cầu đã về `pending`) – F8 SEC (0.3.6, A-33) |
    | REFUND_SOURCE_NOT_RECONCILED | 409 | `executeRefund`/`executeCashRefund`: phần thừa định chi sinh từ khoản thu chưa đối soát (chuyển khoản/VietQR `pending`/`disputed`) – chỉ chi khi khoản tạo ra nó đã đối soát hoặc là tiền mặt/POS (BR-522 v0.3.4, DOM S3-16 a). Kèm `paymentIds[]`, `unreconciledVnd` (0.3.6 bổ sung 2 (BA v0.3, ARC 17/10), E15-05) |
    | ONLINE_CHECKIN_CLOSED | 409 | App khách ghi check-in online khi đã đóng (`onlineCheckinAvailable=false`: lễ tân đã nhập giấy tờ, đơn `in_house` hoặc không còn `confirmed`) (0.3.3, E06-06) |

    ## Trường mở rộng của Problem theo code (0.3.5)
    Tên cố định; client chỉ đọc các trường này (không đọc `detail`).
    | code | Trường |
    |---|---|
    | INVALID_TRANSITION | `currentState` (luôn có), `availableFrom` (hành động mở theo giờ), `allowedActions` (đơn, tùy chọn) |
    | HOLD_EXPIRED · QUOTE_EXPIRED | `expiredAt` |
    | DEPOSIT_INSUFFICIENT | `depositRequiredVnd`, `depositPaidVnd`, `shortfallVnd` |
    | ROOM_UNAVAILABLE · ROOM_BLOCKED · ROOM_OCCUPIED | `conflicts[]` (`OccupancyConflict`), `suggestions[]` |
    | ROOM_NOT_SELLABLE | `roomNo` |
    | CAPACITY_EXCEEDED | `roomNo`, `max` |
    | CAPACITY_BELOW_BOOKINGS | `conflicts[]` |
    | VERSION_CONFLICT | `currentVersion` |
    | SURCHARGE_CHANGED | `surchargeVnd` |
    | REFUND_SOURCE_NOT_RECONCILED | `paymentIds[]`, `unreconciledVnd` (0.3.6 bổ sung 2 (BA v0.3, ARC 17/10)) |
    | OVERPAYMENT_HANDLING_REQUIRED (mã trường) | `unhandledCreditVnd` (0.3.6 bổ sung 2 (BA v0.3, ARC 17/10)) |
    | ROOM_NOT_READY | `roomStatus` |
    | PARAM_OUT_OF_RANGE | `min`, `max`, `allowed[]` |
    | 422 có `HOLD_LIMIT_REACHED` | `max` |
    | 422 có `MIN_STAY_NOT_MET` | `minStayNights`, `suggestions[]` với `orphanNight=true` (BR-113 a) |
    | 422 có `RATE_OUT_OF_RANGE(_WARNING)` | `dates[]` |
    | 422 `moveReservation` (`overbookingResolution` sai) | `expected` |

    ## Mã lỗi theo trường (`FieldError.code`, nằm trong `errors[]` của `422 VALIDATION_FAILED`) – 0.3.1
    Tập mã **mở** (schema `FieldError.code` là chuỗi): client không biết mã → hiện `field_error.generic`. Nguồn: BA `specs/EP00-platform.md` mục 0.3 (V-01…V-11),
    `specs/EP02-reservations.md`. Mã `Problem.code` loại 422 (`CAPACITY_EXCEEDED`, `RATE_OUT_OF_RANGE`, `CARD_NUMBER_DETECTED`…) cũng được dùng làm `FieldError.code`
    khi gắn được vào một ô.
    | code | Kiểm tra | Áp cho |
    |---|---|---|
    | REQUIRED | Thiếu trường bắt buộc / bắt buộc có điều kiện | mọi form |
    | TOO_LONG | Vượt độ dài tối đa | V-01, text |
    | NAME_INVALID | Họ tên sai ký tự | V-01 |
    | PHONE_INVALID · PHONE_COUNTRY_CODE_REQUIRED | SĐT sai dạng / số nước ngoài thiếu `+mã nước` | V-02 |
    | EMAIL_INVALID | Email sai dạng | V-03 |
    | TAX_CODE_INVALID | MST sai dạng | V-04 |
    | DATE_INVALID · DATE_ORDER · DATE_IN_PAST | Ngày sai lịch / ngày đi ≤ ngày đến / trước ngày nghiệp vụ. **0.3.6 bổ sung 2 (BA v0.3, ARC 17/10)**: `DATE_INVALID` là mã **chính thức** cho `changeRoom.effectiveDate` ≠ ngày nghiệp vụ hôm nay (không dùng `VALUE_OUT_OF_RANGE`) | V-05; `changeRoom.effectiveDate` |
    | DOB_FUTURE · DOB_MINOR · DOB_INVALID | Ngày sinh | V-06 |
    | AMOUNT_INVALID · AMOUNT_NOT_POSITIVE · AMOUNT_EXCEEDS_LINE | Tiền âm/không nguyên · ô giá ≤ 0 · vượt giá trị dòng folio | V-07, US-007 |
    | REASON_REQUIRED | Lý do thiếu/ngắn | V-08; `markNoShow.contactAttemptNote`, `extendQuote.reason` (0.3.5) |
    | PASSWORD_TOO_SHORT · PASSWORD_SAME_AS_USERNAME · PASSWORD_REUSED · PASSWORD_TOO_COMMON | Mật khẩu mới (`PASSWORD_TOO_COMMON`: có trong danh sách mật khẩu phổ biến SR-AUTH-02 – 0.3.4) | V-10 |
    | NOT_IN_LIST | Giá trị không có trong danh mục đang hoạt động | V-11 |
    | VALUE_OUT_OF_RANGE | Số ngoài biên của trường (ví dụ `baseOccupancy` 1–10) | US-004 |
    | DUPLICATE | Trùng khóa duy nhất của danh mục (ví dụ `roomNo`) | US-004 |
    | MAX_OCCUPANCY_RANGE | `maxOccupancy` ∉ {`baseOccupancy`, `baseOccupancy` + 1} (ESC-014, BR-110 v0.3.1) | `createRoom`, `updateRoom` |
    | LAST_OWNER | Bỏ vai `owner` / khóa tài khoản của OWN `active` cuối cùng của cơ sở (rbac 5.3) – `field` = `roles` hoặc `status` | `setUserRoles`, `updateUser` |
    | MIN_STAY_NOT_MET | Ngày đến có ở tối thiểu (BR-113) mà số đêm thấp hơn; FDL+ bỏ qua bằng `minStayOverrideReason` (đơn trực tiếp); không áp đơn OTA nhập tay. 0.3.5: kèm `minStayNights`; nhóm có căn mà khoảng ngày là đêm lẻ → kèm `suggestions[]` `orphanNight=true` (lễ tân chọn căn đó; quầy R2 không tự gán căn) | `createReservation`, `calculateQuote`, `saveQuote` |
    | OTA_REF_DUPLICATE | `otaRef` + kênh trùng đơn khác chưa hủy | `createReservation` |
    | RATE_OUT_OF_RANGE_WARNING | Kênh `ota`: giá đêm ngoài sàn–trần (BR-105) **và** thiếu `rateOverrideReason` → client hiện **cảnh báo** + ô lý do rồi gửi lại; có lý do thì lưu (kênh `direct`/`agent` vẫn là `RATE_OUT_OF_RANGE` chặn) | `createReservation` |
    | CAPACITY_EXCEEDED_WARNING | **Cảnh báo** (DOM D-1; với `assignRoom`/`moveReservation` `field` = `roomId`, với `updateReservation` `field` = `adults`): kênh `ota` có số khách tính (`adults` + `children6to11`) > `maxOccupancy` của căn và thiếu `capacityWarningAckReason` → client hiện hộp cảnh báo + ô lý do rồi gửi lại; có lý do → lưu, đơn `capacityConflict=true`. Kênh khác vẫn `CAPACITY_EXCEEDED` chặn (0.3.5) | `createReservation`, `moveReservation`, `assignRoom`, `updateReservation` |
    | ALLOW_UNASSIGNED_OTA_ONLY | `allowUnassigned=true` cho kênh không phải `ota` | `createReservation` |
    | LONG_STAY_REQUIRES_CONTRACT | Số đêm đạt ngưỡng BR-108 mà không có `manualLongStay` (US-017 AC5) | `createReservation` |
    | MANUAL_LONG_STAY_BELOW_THRESHOLD | `manualLongStay` mà số đêm dưới ngưỡng BR-108 (AC5a) | `createReservation` |
    | OTA_AMOUNT_MISMATCH | Σ `nightlyRates` ≠ `otaRoomAmountVnd` | `createReservation` |
    | OTA_PENALTY_OTA_ONLY | `otaPenaltyVnd` cho đơn không thuộc kênh `ota` | `cancelReservation` |
    | DIRECT_SOURCE_NOT_ALLOWED | `directSource` cho kênh không thuộc nhóm `direct` | `createReservation` |
    | EXTENSION_LIMIT_EXCEEDED | `nights` > `ExtensionOptions.maxNights` (đêm liên tiếp còn trống, giới hạn BR-421) – 0.3.3 E04-01 | `extendStay` |
    | NIGHTLY_RATES_NOT_ALLOWED | Gửi `nightlyRates` cho đơn `externalContract=true` (đơn dài hạn nhập tay không sinh dòng `room`) – 0.3.3 E04-01 | `extendStay` |
    | VISA_EXPIRES_BEFORE_DEPARTURE | **Cảnh báo**: khách NN có hạn thị thực/tạm trú < ngày đi mới và thiếu `visaWarningAckReason` → client hiện hộp cảnh báo + ô lý do rồi gửi lại (như `RATE_OUT_OF_RANGE_WARNING`) – BR-605, US-050 AC2; 0.3.3 E04-01 | `extendStay`, `updateReservation`, `moveReservation` |
    | LATE_CHECKOUT_AFTER_LIMIT | Giờ trả sau mốc cuối `late_checkout_tiers` (BR-412/416) – dùng Gia hạn 1 đêm – 0.3.3 E04-02. **0.3.6 bổ sung 2 (BA v0.3, ARC 17/10)**: ở `checkOut` mã này nghĩa là "phải tính thêm 1 đêm" – `field` = `extraNight` (gửi `checkOut.extraNight`, BR-416 v0.3.4, DOM S3-9) | `setLateCheckout`, `checkOut` |
    | PRICE_NOT_EDITABLE | Gửi `unitPriceVnd` cho khoản danh mục có `priceEditable=false` (giá theo tham số BR) – 0.3.3 E04-03 | `addFolioLine` |
    | EVIDENCE_REQUIRED | Khoản `evidenceRequired=true` (phạt, hư hỏng) thiếu cả `evidenceAttachmentIds` lẫn `note` ≥ 3 ký tự (US-032 AC2) – 0.3.3 E04-03. **0.3.6 bổ sung 2 (BA v0.3, ARC 17/10)**: `earlyDeparture` có `noticeGivenAt` nhập lùi (> `manual_time_tolerance_minutes` trước lúc thao tác hoặc khác ngày nghiệp vụ – BR-011) mà thiếu `noticeEvidence` (`field` = `noticeEvidence`) | `addFolioLine`, `executeCashRefund`, `earlyDeparture` |
    | TIME_AFTER_ACTION | Giờ nhập tay (`checkinTime`, `checkoutTime`/`checkoutAt`) **muộn hơn** giờ server lúc thao tác quá `manual_time_tolerance_minutes` – không ghi giờ tương lai (BR-414 v0.3.4, DOM S3-12) – 0.3.6 bổ sung 2 (BA v0.3, ARC 17/10), E03-07 | `checkIn`, `checkOut` |
    | TIME_NOTE_REQUIRED | Giờ nhập tay **sớm hơn** giờ server lúc thao tác quá `manual_time_tolerance_minutes` mà thiếu ghi chú (`checkinTimeNote`/`checkoutTimeNote`, 3–300 ký tự) – ghi chú vào nhật ký thay đổi + audit, hiện ở đóng ca (R3) – 0.3.6 bổ sung 2 (BA v0.3, ARC 17/10), E03-07 | `checkIn`, `checkOut` |
    | AMOUNT_EXCEEDS_BALANCE | VietQR `amountVnd` > còn phải thu (hoặc cọc còn thiếu) mà không có `overBalanceReason` (FD+) – DOM G-4 đã quyết (0.3.6). **0.3.6 bổ sung (review S3)**: cũng dùng cho ghi tiền vượt còn phải thu (SAL/CTV luôn chặn; FD+ thiếu `note`) – kèm `max` (thay mã `AMOUNT_TOO_HIGH` chưa có trong hợp đồng) | `createVietQr`, `recordPayment`, `checkOut.finalPayment`, `confirmDeposit.payment` |
    | SURCHARGE_DECISION_REQUIRED | Phụ thu nhận sớm / trả muộn > 0 theo giờ đã nhập mà thiếu quyết định (`applySurcharge` ≠ `true`, có thể kèm `requestFocForSurcharge`) – không có "bỏ qua im lặng" (DOM S3-12, US-026 AC4) – 0.3.6 bổ sung (review S3, ARC đặt tên) | `checkIn`, `setLateCheckout`, `checkOut` |
    | NOT_ALLOWED | Trường gửi kèm không được phép trong ngữ cảnh này (ví dụ `bankBin`/`accountNo` khi nơi nhận hoàn là `cash`; `requestFocForSurcharge` khi không có phụ thu; `proposedUnitPriceVnd` cho khoản danh mục) – 0.3.6 bổ sung (review S3) | `setRefundDestination`, `checkIn`, `addFolioLine` |
    | DATE_RANGE_TOO_LONG | Khoảng lọc ngày vượt giới hạn (92 ngày, như nhật ký EP00 G-6) – 0.3.3 E05-03 | `listPayments` |
    | MINIBAR_ITEMS_INCOMPLETE | Kiểm `mode=checkout` thiếu món của tủ chuẩn căn (BR-701) – 0.3.3 E05-04 | `recordMinibarCheck` |
    | MINIBAR_QTY_OVER_STANDARD | `remainingQty` > mức chuẩn của món (US-035 AC3, BR-702) – 0.3.3 E05-04 | `recordMinibarCheck` |
    | DOC_NUMBER_INVALID | Số giấy tờ sai dạng theo `docType` (CCCD/định danh trẻ em 12 chữ số; hộ chiếu 6–12 chữ/số; khác 3–30) – 0.3.3 E06-05 | `addGuestDocument`, `updateGuestDocument` |
    | MAIN_GUEST_DUPLICATE | Đã có giấy tờ `isMain=true` khác trong khai báo – 0.3.3 E06-05 | `addGuestDocument`, `updateGuestDocument` |
    | ENTRY_DATE_FUTURE | `entryDate` sau hôm nay – 0.3.3 E06-05 | `addGuestDocument`, `updateGuestDocument` |
    | CHECK_NOTE_REQUIRED | Mục đối chiếu `fail`/`unverified` thiếu ghi chú xử lý 3–500 ký tự (US-044 AC4) – 0.3.3 E06-05 | `recordDocumentCheck`, `completeRegistrationReview` |
    | PORTAL_REFERENCE_REQUIRED | `mark-sent` thiếu/sai mã hồ sơ cổng (3–64 ký tự `[A-Za-z0-9-/._]` sau cắt khoảng trắng) – 0.3.3 E06-05 | `transitionRegistration` |
    | CHECKLIST_REQUIRED | `hardeningChecklistConfirmed` ≠ `true` (SR-DEV-07) – 0.3.4 Q2 | `trustCurrentDevice` |
    | CONTACT_REQUIRED | Thiếu cả SĐT và email (US-071 AC1) – `field` = `phone` – 0.3.4 Q2 | `createGuest`, `updateGuest` |
    | CONTACT_CHANNEL_EMPTY | `preferredContact` trỏ tới kênh chưa có giá trị (ví dụ `email` khi chưa có email) – 0.3.4 Q2 | `createGuest`, `updateGuest` |
    | REAUTH_FAILED | Mật khẩu/PIN xác nhận lại sai – nằm trong `401 REAUTH_FAILED` (không phải 422); `field` = ô mật khẩu của operation (`currentPassword` hoặc `secret`) – 0.3.4 Q4 | `changeMyPassword`, `trustCurrentDevice`, `approveRequest`, `rejectRequest` |
    | DUPLICATE_GUEST | Nằm trong `409 DUPLICATE_GUEST`; `field` = `phone` hoặc `email` bị trùng – 0.3.4 Q2/Q5 | `createGuest`, `updateGuest` |
    | HOLD_LIMIT_REACHED | Người tạo/chốt đã có số giữ chỗ đang mở bằng `max_open_holds_per_user` của vai (CTV 3, SAL 5, FD+ không giới hạn – BR-302 v0.3.2, DOM/SEC BE-28); `field` = `holdHours`, Problem kèm `max`. Không tính giữ chỗ đã hết hạn/hủy (0.3.5, A-26) | `createHoldFromQuote` |
    | HOLD_EXTENDED_ONCE | Giữ chỗ đã gia hạn 1 lần (BR-303) – nằm trong `errors[]` của `409 INVALID_TRANSITION`, `field` = `extraHours` (0.3.5) | `extendHold` |
    | OTA_DATES_LOCKED | Đổi ngày đơn kênh `ota` (ngày do OTA quyết – sửa trên extranet rồi nhập lại) (0.3.5) | `moveReservation` |
    | RETURN_CODE_INVALID | Mã khách quay lại không hợp lệ/hết hạn (BR-111) (0.3.5) | `calculateQuote`, `saveQuote` |
    | REFUND_EXCEEDS_APPROVED | Số hoàn > số duyệt còn lại của yêu cầu, hoặc > đã thu − đã hoàn của folio (server tính – F8) – 0.3.6 A-33 | `executeRefund` |
    | OVERPAYMENT_HANDLING_REQUIRED | Folio trả thừa (`creditVnd > 0`) mà thiếu `overpaymentHandling` – 0.3.6 A-34 | `checkOut` |
    | SENSITIVE_DATA_DETECTED | Chuỗi ≥ 6 chữ số liền nhau (sau khi bỏ dấu cách/chấm/gạch), trừ số hotline công khai của cơ sở – chặn mã cửa, số giấy tờ, SĐT khách trong văn bản hiện ở mức 1 (SEC B-15) – 0.3.6 | `transitionGuestRequest.replyNote` |
    | FEE_NOT_ACCEPTED | Loại yêu cầu có phí (`feeVnd > 0`) mà `feeAccepted` ≠ `true` (B-16) – 0.3.6 | `createGuestRequest` |
    | REQUEST_TYPE_NOT_AVAILABLE | Loại yêu cầu không dùng được lúc này (`available=false` ở `listGuestRequestOptions`; loại có phí khi đơn chưa `in_house`; đã có 3 yêu cầu có phí đang mở) (B-14/B-16) – 0.3.6 | `createGuestRequest` |
    | FILE_TYPE · FILE_TOO_LARGE · TOO_MANY_FILES | Chi tiết của `422 FILE_REJECTED` (`errors[]`): sai loại theo magic bytes (không JPEG/PNG/WebP) · > 10 MB hoặc > 40 MP · vượt 4 ảnh/người hoặc 30 tệp/đơn (SR-FILE-01/02, SR-RL-05) – 0.3.3 E06-07 | `uploadGuestDocument`, `addGuestDocument`, `uploadAttachment` |

