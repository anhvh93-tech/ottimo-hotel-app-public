      summary: Người trong đơn + cảnh báo thiếu người (US-022 AC1). SAL thấy số người, không thấy quan hệ (rbac D10).
      description: |
        Phạm vi `own_count_only` (SAL, CTV – đơn của mình): serializer **bỏ hẳn** `members` (không trả mảng rỗng), chỉ còn
        `requiredCount`, `presentCount`, `missingCount` (SR-AZ-04, rbac D10).
      x-roles: [owner, manager, front_desk_lead, front_desk, sales_staff, collaborator]
