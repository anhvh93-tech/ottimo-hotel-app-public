        làm tròn, phụ thu người; giá hạng = giá thấp nhất trong các căn còn trống của hạng. Chỉ ngắn ngày (1–27 đêm); từ 28 đêm (BR-108) trả `longStayHint` và mời gửi yêu cầu.
