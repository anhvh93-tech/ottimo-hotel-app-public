        kind:
          type: string
          enum: [hold_expired, hold_expiring, deposit_notice, deposit_after_cancel, guest_request_new, guest_request_overdue, work_order_overdue, approval_requested, approval_decided, registration_due, checkout_call_needed, security_alert, account_security_change, online_checkin_completed, payment_disputed, deposit_shortfall_accepted, receiving_account_changed, refund_ready, work_order_new, work_order_high_new, work_order_block_requested, hk_task_urgent, room_awaiting_inspection, hk_task_cancelled, approval_cancelled, no_show_marked, no_show_restored, website_request_new, website_request_cap_reached, website_request_overdue, website_request_linked_hold, public_booking_toggled, debt_recorded, manager_confirmation_requested, manager_confirmation_decided, manager_confirmation_expired, late_fee_post_review, foc_stay_total_exceeded]
          description: |
            **0.3.8 (US-164)**: `manager_confirmation_requested` (mọi OWN/MGR **đang hoạt động** của cơ sở; Web Push nếu đã đăng ký – payload chỉ `kind` + `refId`; refType `manager_confirmation`,
            refCode = mã đơn) · `manager_confirmation_decided` (người gửi – đã duyệt/từ chối) · `manager_confirmation_expired` (người gửi – hết hạn, Desk mở nhánh tự ghi) ·
            `late_fee_post_review` (OWN + MGR trừ người ghi – lễ tân tự ghi sau hết hạn, hoặc `postReview` ở v1.0 (bổ sung 8), hậu kiểm trong `post_checkout_charge_hours`; quá hạn chưa xem →
            mọi OWN thêm **một** lần (job `late_fee.post_review_overdue`); refType `reservation`). **ESC-026 A**: `foc_stay_total_exceeded` (mọi OWN – Σ số đang áp của FOC/giảm giá đặc biệt/xóa nợ
            do FD/FDL/MGR áp trên một lượt ở vượt ngưỡng BR-433 (c) v0.4.0 – ngưỡng = hạn mức một lần của vai cao nhất dưới OWN có khoản đang áp; **một thông báo mỗi lần áp** khi Σ đang vượt
            (oracle DOM E26-1…5, 9); refType `reservation`, refCode = mã đơn gốc của lượt; không số tiền, không tên khách). Không tên khách/SĐT trong mọi loại.
            **0.3.7 bổ sung 4 (BR-525 G-4, migration 0072)**: `debt_recorded` – công nợ của khách được ghi tự động khi MGR+ đảo khoản thu sau trả phòng làm còn phải thu > 0, hoặc khi J15 đóng folio còn phát sinh sau trả phòng chưa thu (R7LOCK-01 – hết 24 giờ kể từ trả phòng); gửi **OWN + MGR**
            (trừ người đảo); refType `reservation`, `refCode` = mã đơn; không số tiền, không tên khách.
            0.3.6 (A-36): `online_checkin_completed` (FD đang trực – "Khách {refCode} đã làm thủ tục trước – đến lúc {eta}", EP06 8.3; refType `reservation`);
            `payment_disputed` (OWN + MGR khác người ghi – SEC F5; refType `payment`); `deposit_shortfall_accepted` (OWN – B-29); `receiving_account_changed`
            (mọi OWN/MGR – SEC F3; refType `property`); `refund_ready` (MGR+ – yêu cầu hoàn đã duyệt và có nơi nhận; refType `approval_request`).
            **0.3.7**: `refund_ready` nơi nhận tiền mặt gửi thêm FD/FDL đang trực **khác người tạo** (người tạo không được tự chi – S4-42). Nhóm H (B-08, BA E07-08): `work_order_new` (MT),
            `work_order_high_new` (MT + FD + MGR), `work_order_block_requested` (FD + MT – HK đề nghị khóa), `hk_task_urgent` (HK của ca – việc dọn gấp/bộ đồ dùng thêm lên đầu hàng),
            `room_awaiting_inspection` (FDL+ – căn `VC` chờ kiểm khi tắt tự kiểm), `hk_task_cancelled` (HK được giao – việc hủy do đơn đổi); refType `work_order` hoặc `hk_task`.
            Nội dung chỉ loại + số căn + mã phiếu (SR-PWA-06).
            **0.3.7 bổ sung D1**: `approval_cancelled` (BR-434, BR-315 (g) – S4-18/S4-22: yêu cầu FOC/giảm giá **tự hủy** vì không còn dòng, đơn hủy hoặc no-show; gửi người gửi + mọi người đã
            nhận `approval_requested` của yêu cầu đó; refType `approval_request`, refCode = mã đơn); `no_show_marked` (US-136 AC2/AC4, BR-311 – OWN + MGR; refType `reservation`);
            `no_show_restored` (BR-315, US-136 AC4 – OWN + MGR, trừ người khôi phục; refType `reservation`).
            **0.3.7 bổ sung 2 (US-155)**: `website_request_new` (FDL, FD, SAL đang hoạt động của cơ sở – "Yêu cầu đặt phòng mới {refCode}: {arrival} · {nights} đêm · {guests} khách";
            refType `website_booking_request`, refCode = mã yêu cầu; **không** tên/SĐT/lời nhắn); `website_request_cap_reached` (OWN, tối đa một lần/ngày – đã chạm trần
            `public_booking_request_daily_cap`, SEC ARC-02; refType `property`).
            **0.3.7 bổ sung 2 – phản hồi review**: `website_request_overdue` (FDL + MGR, **một lần** mỗi yêu cầu – còn `new` khi tới `web_request_escalate_minutes` tính trong giờ trực, BR-912 (2);
            refType `website_booking_request`); `website_request_linked_hold` (người đang được giao yêu cầu – có giữ chỗ tạo từ báo giá cũ của yêu cầu bởi người khác, yêu cầu không đổi; SEC
            ARC-19 điểm 3); `public_booking_toggled` (OWN + MGR – bật/tắt form website, SEC ARC-17; refType `property`). Không tên/SĐT/lời nhắn.
        refType: { type: string, enum: [reservation, guest_request, work_order, approval_request, registration, user, payment, property, hk_task, website_booking_request, manager_confirmation] }
        refId: { $ref: '#/components/schemas/Uuid' }
        refCode: { type: string, description: 'Mã hiển thị (OTM-00171, WO-00034, số căn) – không C2/C3' }
        createdAt: { $ref: '#/components/schemas/Instant' }
        readAt: { $ref: '#/components/schemas/Instant' }
    ChannelFee:
      type: object
      required: [reservationId, amountEstimatedVnd, isEstimate, version]
      properties:
        reservationId: { $ref: '#/components/schemas/Uuid' }
        ratePctSnapshot: { $ref: '#/components/schemas/Percent' }
        amountEstimatedVnd: { $ref: '#/components/schemas/MoneyVnd' }
        amountActualVnd: { $ref: '#/components/schemas/MoneyVnd' }
        isEstimate: { type: boolean }
        source: { type: string, enum: [channel_manager, manual_reconcile, estimate] }
        recognizedOn: { $ref: '#/components/schemas/LocalDate' }
        reconciledAt: { $ref: '#/components/schemas/Instant' }
        version: { type: integer }
    Commission:
      type: object
      required: [id, payeeType, status, amountVnd]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        reservationCode: { type: string }
        leaseContractCode: { type: string }
        payeeType: { type: string, enum: [agent, staff] }
        payeeName: { type: string, x-visible-to: [owner, manager] }
        ratePctSnapshot: { $ref: '#/components/schemas/Percent' }
        baseAmountVnd: { $ref: '#/components/schemas/MoneyVnd' }
        amountVnd: { $ref: '#/components/schemas/MoneyVnd' }
        status: { $ref: '#/components/schemas/CommissionStatus' }
        recognizedAt: { $ref: '#/components/schemas/Instant' }
        payouts:
          type: array
          items:
            type: object
            properties:
              id: { $ref: '#/components/schemas/Uuid' }
              trancheNo: { type: integer }
              dueDate: { $ref: '#/components/schemas/LocalDate' }
              amountVnd: { $ref: '#/components/schemas/MoneyVnd' }
              paidAt: { $ref: '#/components/schemas/Instant' }
        version: { type: integer }

    # ── public-site + yêu cầu đặt phòng từ website (0.3.7 bổ sung 2 – US-155, ADR-014 mục 4; phương án B = contract-ahead) ──
    PublicFormToken:
      type: object
      required: [token, notBefore, expiresAt, minDelaySeconds]
      description: '0.3.7 bổ sung 2 – mã form có chữ ký dùng một lần (ADR-014 4.4). Trang giữ trong bộ nhớ, không lưu trình duyệt. Phản hồi review SEC: `minDelaySeconds` (ARC-23), `powChallenge` (ARC-22, contract-ahead)'
      properties:
        token: { type: string, minLength: 20, maxLength: 300 }
        notBefore: { $ref: '#/components/schemas/Instant' }
        expiresAt: { $ref: '#/components/schemas/Instant' }
        minDelaySeconds:
          type: integer
          minimum: 0
          maximum: 10
          description: |
            SEC ARC-23: số giây trang phải chờ trước khi gửi form bằng mã này, tính bằng **đồng hồ trình duyệt** từ lúc nhận mã (không so với giờ máy chủ) – hiện 3 (= `notBefore` − lúc cấp).
            Gặp `FORM_TOKEN_INVALID`: lấy mã mới, chờ đủ số giây này (hiện "Sending…") rồi gửi lại **một** lần.
        powChallenge:
          type: object
          additionalProperties: false
          description: |
            **Contract-ahead – tầng 2 chống spam** (SEC ARC-22; ADR-014 4.4): chỉ có khi tham số bảo mật `public_booking_request_pow_enabled = true`. Thử thách proof-of-work **tự host**
            (kiểu ALTCHA – không bên thứ ba, không Turnstile): trang tìm `number` ≤ `maxNumber` sao cho SHA-256(`salt` + `number`) = `challenge`, gửi lời giải ở `WebsiteBookingRequestInput.pow`.
            Thư viện dùng Web Worker thì CSP landing cần `worker-src 'self'` (không `blob:`) – ARC kiểm khi chọn thư viện. Vắng = không cần.
          required: [algorithm, challenge, salt, maxNumber, signature]
          properties:
            algorithm: { type: string, enum: [SHA-256] }
            challenge: { type: string, pattern: '^[0-9a-f]{64}$' }
            salt: { type: string, maxLength: 200 }
            maxNumber: { type: integer, minimum: 1000, maximum: 10000000 }
            signature: { type: string, pattern: '^[0-9a-f]{64}$', description: 'HMAC của server trên (`algorithm`, `challenge`, `salt`) – server kiểm, không lưu thử thách' }
    WebsiteUtm:
      type: object
      additionalProperties: false
      description: |
        0.3.7 bổ sung 2. Trang đọc `utm_source`/`utm_medium`/`utm_campaign` của **chính URL trang đặt phòng** (link nội bộ của landing giữ nguyên query UTM – không cookie,
        không localStorage); đổi chữ thường, ký tự ngoài `[a-z0-9._-]` → `-`, cắt 64 ký tự, rỗng thì bỏ. Nút "Book now" của fanpage (**PO chốt 17/10 – landing-scope 0.10**):
        `https://<tên-miền>/vi/?utm_source=facebook&utm_medium=social&utm_campaign=page_book_button#book` (bản EN không `/vi`). **Form nằm trong mục `#book` của trang chủ** (`/`, `/vi/`) –
        không có trang `/book/` riêng (ARC 17/10, thay ghi chú cũ); `#book` chỉ là neo, không chứa dữ liệu (SEC UXD-08).
      properties:
        source: { type: string, pattern: '^[a-z0-9._-]{1,64}$' }
        medium: { type: string, pattern: '^[a-z0-9._-]{1,64}$' }
        campaign: { type: string, pattern: '^[a-z0-9._-]{1,64}$' }
    DirectSubSource:
      type: string
      enum: [facebook, instagram, google, zalo, qr, other]
      description: |
        0.3.7 bổ sung 2 (FB-INV-002 ý 3 – "website · facebook"). **Nguồn phụ** của yêu cầu/đơn `directSource = website`; server suy ra lúc nhận yêu cầu, không ai nhập tay:
        (1) `utm.medium = qr` → `qr`; (2) `utm.source` ∈ {`facebook`, `fb`, `m.facebook.com`, `l.facebook.com`} → `facebook`; {`instagram`, `ig`} → `instagram`; {`google`} → `google`;
        {`zalo`} → `zalo`; giá trị khác → `other`; (3) không có `utm.source`: `refHost` là facebook.com / fb.com / fb.me / messenger.com (kể cả tên miền con) → `facebook`;
        instagram.com → `instagram`; google.<đuôi> → `google`; zalo.me / zalo.vn → `zalo`; tên miền ngoài khác → `other`; (4) không có cả hai, **hoặc `refHost` là tên miền của chính OTTIMO**
        (host của `LANDING_BASE_URL`, kể cả `www.` – đi giữa các trang của landing) → **null** = "không rõ" (BR-911 v0.3.8 gọi là "website – chưa rõ"; DOM-S4-18 – không phải `other`).
        Bảng ánh xạ là hằng số của module `public-site`; thêm giá trị = đổi hợp đồng (chỉ thêm, DATA báo cáo theo kênh – US-158).
    WebsiteBookingRequestInput:
      type: object
      additionalProperties: false
      required: [formToken, arrival, adults, guestName, preferredChannel, locale, consent, consentVersion]
      description: |
        0.3.7 bổ sung 2 – thân `createWebsiteBookingRequest` (phương án A). Chỉ hỏi đủ để trả lời yêu cầu (tối thiểu hóa – ADR-014 4.6): **không** hỏi quốc tịch, giấy tờ,
        ngày sinh, địa chỉ, số thẻ, tuổi chính xác của trẻ. Trang kiểm trước bằng cùng schema zod sinh từ đây (`packages/contracts`) – **không tự đặt tên khóa** (SEC UXD-07). Ô đồng ý
        **không** tích sẵn, một mục đích – **không** có ô nhận ưu đãi (SEC DOM-05, US-151 AC6).
        **Sửa theo review SEC 17/10 + UXD v1.2 (vẫn `x-round: R3`)**:
        - **Một cách liên hệ** (SEC ARC-14 – chốt): `preferredChannel` ∈ {`zalo`, `whatsapp`, `telegram`, `viber`, `phone`} → `phone` bắt buộc, **không** gửi `email`; `preferredChannel = email`
          → `email` bắt buộc, **không** gửi `phone`. Thiếu → mã trường `REQUIRED`; gửi thừa → `NOT_ALLOWED`. Khóa giới hạn 3/ngày và `contact_hmac` = HMAC của đúng liên hệ đã gửi.
        - **Kiểu ở** (UXD v1.2 "A few nights / A month or longer", DOM 5.1): `stayType = short` → `departure` bắt buộc; `stayType = long` → `months` (1–24 hoặc `null` = "Not sure yet"),
          không gửi `departure` (`NOT_ALLOWED`).
        - **Trẻ em theo nhóm tuổi BR-110** (SEC ARC-14; UXD `infants`): `children` = trẻ 6–11, `infants` = trẻ dưới 6; từ 12 tuổi tính là người lớn. Bỏ `childrenAges`.
        - **Chuẩn hóa** `guestName`, `note` (SEC ARC-21): NFC; bỏ ký tự điều khiển (Cc) và ký tự định dạng hướng (U+200E, U+200F, U+202A–U+202E, U+2066–U+2069) trước khi kiểm độ dài;
          nhận diện số thẻ/số giấy tờ áp cho **cả hai** trường.
      properties:
        formToken: { type: string, minLength: 20, maxLength: 300, writeOnly: true, description: 'Từ `getPublicFormToken`' }
        website:
          type: string
          maxLength: 200
          writeOnly: true
          description: |
            Ô bẫy (honeypot) – người thật để trống; có giá trị → 202 giống hệt, không lưu. SEC UXD-05: đưa ra ngoài màn hình bằng **class** (không `display:none`, không `style=`), nhãn đọc được
            "Leave this field empty", `tabindex="-1"`, `autocomplete="off"`, thuộc tính bỏ qua của trình quản lý mật khẩu (ví dụ `data-1p-ignore`, `data-lpignore="true"` – FE-LP tra đủ danh sách)
        stayType:
          type: string
          enum: [short, long]
          default: short
          description: '`short` = vài đêm (ngày đến + ngày đi); `long` = từ một tháng (ngày đến + số tháng) – UXD v1.2. Server vẫn ghi `stayKind = long` khi `short` mà ≥ 28 đêm (BR-108)'
        arrival: { $ref: '#/components/schemas/LocalDate', description: '≥ hôm nay (giờ cơ sở – ADR-008), ≤ hôm nay + `booking_window_days` (BR-112)' }
        departure:
          $ref: '#/components/schemas/LocalDate'
          description: |
            **Bắt buộc khi `stayType = short`** (> `arrival`, tối đa 366 đêm); `stayType = long` → không gửi (`NOT_ALLOWED`). Một form cho mọi khách (boutique stay – không tách "căn hộ dịch vụ").
        months:
          type: [integer, 'null']
          minimum: 1
          maximum: 24
          description: 'Chỉ `stayType = long`: số tháng dự kiến (UXD: 1 · 2 · 3 · 6 · 12 · 24); `null` hoặc vắng = "Not sure yet" (sale hỏi lại). Trên 24 tháng: ghi trong lời nhắn. `short` gửi → `NOT_ALLOWED`'
        adults: { type: integer, minimum: 1, maximum: 12 }
        children: { type: integer, minimum: 0, maximum: 8, default: 0, description: 'Số trẻ **6–11 tuổi** (BR-110) – sửa theo SEC ARC-14 (trước: mọi trẻ em + `childrenAges`)' }
        infants: { type: integer, minimum: 0, maximum: 8, default: 0, description: 'Số trẻ **dưới 6 tuổi** (BR-110) – SEC ARC-14, khóa của UXD v1.2' }
        roomType:
          type: string
          pattern: '^[a-z0-9-]{2,60}$'
          description: |
            Hạng phòng khách thích = slug của `Room.publicRoomType` (chữ thường, bỏ dấu, ký tự khác chữ-số → `-`, ví dụ "Standard Studio · Garden View" → `standard-studio-garden-view`).
            Vắng = "Chưa chọn – tư vấn giúp". Slug không khớp hạng nào đang bán → **vẫn nhận**, cờ `room_type_unmatched` (trang cũ không làm hỏng yêu cầu). Landing không hiện số phòng
            hay số căn của hạng (FB-INV-002 ý 1); server không trả gì về hạng. (Mock UXD gọi là `listingSlug` – dùng `roomType`.)
        guestName: { type: string, minLength: 1, maxLength: 80, writeOnly: true, x-classification: C2, x-rbac-field: D28, description: 'Tên gọi – chuẩn hóa như mô tả schema; số thẻ/số giấy tờ → `CARD_NUMBER_DETECTED`/`ID_NUMBER_DETECTED`' }
        phone:
          type: string
          minLength: 6
          maxLength: 32
          writeOnly: true
          x-classification: C2
          x-rbac-field: D28
          description: '**Bắt buộc** khi `preferredChannel` ≠ `email`, **không được gửi** khi `email` (SEC ARC-14). Dạng người dùng gõ (V-02): số Việt Nam `0…` hoặc `+84…`; số nước ngoài phải có `+mã nước`. Server chuẩn hóa E.164'
        email: { type: string, format: email, maxLength: 254, writeOnly: true, x-classification: C2, x-rbac-field: D28, description: '**Bắt buộc** khi `preferredChannel = email`; kênh khác → không được gửi (`NOT_ALLOWED`) – SEC ARC-14 (V-03)' }
        preferredChannel:
          type: string
          enum: [zalo, whatsapp, telegram, viber, phone, email]
          description: 'Kênh khách muốn được trả lời – quyết định trường liên hệ (một cách liên hệ – SEC ARC-14). Trang xếp `zalo` đầu và chọn sẵn; WhatsApp/Telegram/Viber trong "Kênh khác" (FB-INV-002 ý 4)'
        note:
          type: string
          maxLength: 500
          writeOnly: true
          x-classification: C2
          x-rbac-field: D28
          description: 'Lời nhắn. Trang ghi dưới ô: "Không ghi số thẻ, số giấy tờ hay thông tin sức khỏe" (SR-INP-05). Số thẻ → `CARD_NUMBER_DETECTED`; số giấy tờ → `ID_NUMBER_DETECTED` – không lưu, không vào log'
        locale: { $ref: '#/components/schemas/Locale' }
        consent: { type: boolean, const: true, description: 'Ô đồng ý đã tích (không tích sẵn) – khác `true` → mã trường `CONSENT_REQUIRED` (SEC C-3). Câu chữ: SEC Phụ lục A.1/A.2 (luật sư duyệt – ESC-001)' }
        consentVersion:
          type: string
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}(\.[0-9]{1,2})?$'
          description: 'Phiên bản thông báo xử lý dữ liệu trang đã hiện – lấy từ tệp thông báo phát hành cùng bản dựng, không viết tay (SEC UXD-04) (`privacy_notice_version` đã đăng của `locale`; bản trước còn nhận 7 ngày sau khi có bản mới) – sai → `NOTICE_VERSION_INVALID`'
        utm: { $ref: '#/components/schemas/WebsiteUtm' }
        refHost:
          type: string
          maxLength: 100
          pattern: '^[a-z0-9.-]{1,100}$'
          description: 'Chỉ **tên miền** của `document.referrer` khi khác origin landing (không đường dẫn, không query) – dùng suy `DirectSubSource` khi không có UTM; tên miền của chính OTTIMO → nguồn phụ rỗng'
        landingPath: { type: string, pattern: '^/[a-z0-9/_-]{0,199}$', description: 'Đường dẫn trang gửi form (không query, không `#`) – form nằm ở mục `#book` của trang chủ nên thường là `/` hoặc `/vi/`' }
        pow:
          type: string
          maxLength: 2000
          writeOnly: true
          description: '**Contract-ahead tầng 2** (SEC ARC-22): lời giải `powChallenge` (base64url của JSON `{algorithm, challenge, number, salt, signature}`). Chỉ bắt buộc khi `public_booking_request_pow_enabled = true` – thiếu/sai → mã trường `POW_INVALID`; tham số tắt → bỏ qua'
        offerSnapshot:
          $ref: '#/components/schemas/PublicOfferSnapshot'
          description: '**Contract-ahead phương án B** – server phương án A bỏ qua (không lưu)'
    WebsiteBookingRequestAccepted:
      type: object
      required: [refCode, promise]
      description: |
        0.3.7 bổ sung 2 – phản hồi 202 duy nhất (cả khi bị ô bẫy hay giới hạn liên hệ chặn im lặng). Không có dữ liệu khách nhập. **DOM-S4-18 (BR-912 (4) v0.3.8)**: trả **câu hứa
        công khai** `promise` – **không** trả `replyBy` (hạn nội bộ 15 phút, cố ý chặt hơn lời hứa với khách).
      properties:
        refCode:
          type: string
          pattern: '^[0-9A-HJKMNP-TV-Z]{8}$'
          description: |
            Mã tham chiếu ngẫu nhiên (Crockford base32, 40 bit CSPRNG, không tăng dần; UK theo cơ sở). Trang hiện "Mã yêu cầu" (nhóm 4–4 bằng khoảng trắng hẹp – SEC UXD-07) + nút
            "Nhắn Zalo" (link OA, chỉ chèn mã – SEC UXD-08). Chỉ để tra cứu nội bộ – **không** phải yếu tố xác minh, không có endpoint công khai tra theo mã (SEC ARC-04). Không đưa vào URL, `#hash`, tiêu đề trang.
        promise:
          type: object
          required: [kind, by]
          description: |
            Câu hứa công khai trên trang cảm ơn (BR-912 (3), (4) v0.3.8 – chữ đọc theo tham số, không viết cứng): `within_minutes` – gửi trong giờ trực `front_desk_hours` → "trả lời trong
            {minutes} phút" (`web_request_public_promise_minutes`, 60); `next_morning` – gửi ngoài giờ → "trả lời trước {giờ của `by`} sáng {ngày}" (`web_request_public_promise_next_morning_by`,
            09:00); `call_now` – ngày đến = ngày nghiệp vụ hiện tại và gửi ngoài giờ → trang hiện số gọi ngay, `minutes` = `web_request_public_promise_call_now_minutes` (**60** – BR-912 v0.3.8;
            0.3.7 bổ sung 4 sửa, không dùng hạn nội bộ `web_request_same_day_after_hours_minutes` 30). Trang thêm lối thoát
            "Nếu tới {by} OTTIMO chưa liên hệ, vui lòng gọi … hoặc nhắn Zalo kèm mã này" (SEC UXD-05).
          properties:
            kind: { type: string, enum: [within_minutes, next_morning, call_now] }
            by: { $ref: '#/components/schemas/Instant' }
            minutes: { type: integer, minimum: 1, description: 'Có với `within_minutes`, `call_now`' }
    WebsiteBookingRequestStatus: { type: string, enum: [new, in_progress, converted, declined, spam], description: '0.3.7 bổ sung 2 – SM-18 (`state-machines.md` mục 18)' }
    WebsiteBookingRequestDeclineReason:
      type: string
      enum: [no_availability, price_not_accepted, guest_unreachable, guest_not_proceeding, duplicate, policy_mismatch, stale, erased_on_request, other]
      description: |
        0.3.7 bổ sung 2 – lý do từ chối (DATA đếm nhu cầu mất, ví dụ `no_availability`). **7 mã nhân viên chọn** – DOM Q-W01 v0.3.8 giữ đúng danh sách hợp đồng (BR-913 (9)): `no_availability`,
        `price_not_accepted`, `guest_not_proceeding`, `guest_unreachable` (gồm liên hệ sai), `duplicate` (gồm "khách đã có đơn"), `policy_mismatch`, `other` (+ ghi chú). **Mã hệ thống** – client gửi
        → `NOT_IN_LIST`: `stale` (WR7, job), `erased_on_request` (WR8 – chỉ hành động `erase`, SEC ARC-16). Nhãn VI/EN do UXD (`webreq.decline.*`)
    WebsiteBookingRequestTransition:
      type: object
      additionalProperties: false
      description: '0.3.7 bổ sung 2 – thân `transitionWebsiteBookingRequest`; `decline` cần `reasonCode`; `erase` cần `verificationMethod` (SEC ARC-16); hành động khác bỏ trống'
      properties:
        reasonCode: { $ref: '#/components/schemas/WebsiteBookingRequestDeclineReason' }
        note: { type: string, minLength: 3, maxLength: 300, x-classification: C2, x-rbac-field: D28, description: 'Bắt buộc khi `reasonCode = other` (`REASON_REQUIRED`); chuẩn hóa + V-09 như `createWebsiteBookingRequest`' }
        verificationMethod:
          type: string
          enum: [same_contact, called_back]
          description: |
            Chỉ `erase` – **bắt buộc** (`REQUIRED`): `same_contact` – yêu cầu xóa đến từ chính SĐT/email trên yêu cầu (nhập vào `verifiedContact`, server so HMAC); `called_back` – nhân viên đã
            gọi lại đúng SĐT trên yêu cầu và người nghe xác nhận muốn xóa (SEC ARC-16 điểm 2, SR-DSR-04). Ghi vào audit `security` (không ghi liên hệ)
        verifiedContact:
          type: string
          maxLength: 254
          writeOnly: true
          x-classification: C2
          x-rbac-field: D28
          description: 'Chỉ `erase` + `same_contact`: SĐT hoặc email người xin xóa đã dùng để liên hệ; server chuẩn hóa (E.164 / BR-951) rồi so `contact_hmac` – khác → 422 mã trường `CONTACT_MISMATCH`. Không lưu, không log'
    WebsiteBookingRequestRef:
      type: object
      required: [id, refCode, status, createdAt]
      description: '0.3.7 bổ sung 2 – kết quả `lookupWebsiteBookingRequests` (SEC ARC-16): chỉ định danh, không C2'
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        refCode: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{8}$' }
        status: { $ref: '#/components/schemas/WebsiteBookingRequestStatus' }
        createdAt: { $ref: '#/components/schemas/Instant' }
    WebsiteBookingRequest:
      type: object
      required: [id, refCode, status, arrival, stayKind, adults, children, infants, locale, preferredChannel, replyBy, createdAt, updatedAt, version, allowedActions]
      description: |
        0.3.7 bổ sung 2 – bản nhìn của nhân viên (US-155). Trường C2 vắng khi `piiPurgedAt` có giá trị.
        **Chuyển thành giữ chỗ/đơn** (US-155 AC2 – WR6; "đã chuyển" = lúc tạo giữ chỗ/đơn – DOM Q-W02 v0.3.8; không có operation "convert" riêng, đi qua luồng có sẵn để giữ mọi ràng buộc
        chống trùng ADR-009, giá BR, chống trùng hồ sơ BR-951): (a) Desk mở `GuestPicker` điền sẵn tên + liên hệ → chọn hoặc tạo hồ sơ khách; (b) **giữ chỗ**: `saveQuote` kèm
        `websiteBookingRequestId` (yêu cầu vẫn `in_progress`, gắn `quoteId`) → `createHoldFromQuote`; (c) **đơn đảm bảo** (FD+, khách đã chốt và đã cọc; ở dài HĐ giấy: kèm `manualLongStay`):
        `createReservation` kèm `websiteBookingRequestId`. Đơn tạo ra có kênh `direct`, `directSource = website`, `directSubSource` = `subSource` của yêu cầu; yêu cầu → `converted`
        (`reservationId`) và **xóa trường C2** trong cùng giao dịch (dữ liệu đã ở hồ sơ khách). Không có lệnh sửa yêu cầu (DOM Q-W08).
        **Phản hồi review SEC**: (1) **SAL** với yêu cầu `new` **chưa giao**: không có `guestName`, `phone`, `email`, `note` (thuộc tính vắng – ARC-19); (2) **hiển thị dữ liệu người lạ ở Desk**
        (ARC-21, C-12 (b)): mọi trường hiển thị dạng chữ, **không** tự tạo link (kể cả khi có cờ `contains_url` – chỉ nhãn cảnh báo "Lời nhắn có đường link – không bấm"), không
        `dangerouslySetInnerHTML` (SR-INP-04), `white-space: pre-wrap` có giới hạn chiều cao; link liên hệ **chỉ** dựng từ `phone` E.164 server trả, đúng mẫu `^\+[1-9][0-9]{7,14}$`:
        `tel:+…` và `https://wa.me/<chữ số>`; **không** có nút mở chat Zalo/Telegram/Viber tới SĐT khách – thay bằng "Sao chép SĐT" + dòng nhắc "Liên hệ bằng tài khoản OTTIMO (Zalo OA / Zalo
        của cơ sở) – không dùng tài khoản cá nhân" (BR-913 (4)); (3) thông báo, SSE, outbox, audit, `state_transition`, `purge_journal` không chứa C2.
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        refCode: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{8}$' }
        aliasRefCodes:
          type: array
          maxItems: 5
          items: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{8}$' }
          description: 'Mã đã trả cho khách ở các lần cùng liên hệ gửi thêm bị giới hạn chặn im lặng (SEC ARC-15) – `listWebsiteBookingRequests?refCode=` tìm cả các mã này'
        status: { $ref: '#/components/schemas/WebsiteBookingRequestStatus' }
        arrival: { $ref: '#/components/schemas/LocalDate' }
        departure:
          oneOf: [{ $ref: '#/components/schemas/LocalDate' }, { type: 'null' }]
          description: '`short`: ngày đi khách nhập; `long` + `months`: = `arrival` + `months` tháng lịch (server tính để hiện và điền báo giá); `long` chưa biết bao lâu → null'
        nights: { type: [integer, 'null'], minimum: 1, description: 'null khi `departure` null' }
        stayKind: { type: string, enum: [short, long], description: '`long` khi khách chọn `stayType = long` hoặc ≥ 28 đêm (BR-108) – báo giá dài hạn (R3 – US-081) / HĐ giấy (US-017 AC5a)' }
        months: { type: [integer, 'null'], description: 'Số tháng khách chọn khi `stayType = long`; null = "Not sure yet" hoặc khách ở ngắn' }
        adults: { type: integer }
        children: { type: integer, description: 'Trẻ 6–11 tuổi (BR-110) = `children6to11` của báo giá/đơn' }
        infants: { type: integer, description: 'Trẻ dưới 6 tuổi (BR-110) = `childrenUnder6` của báo giá/đơn' }
        roomType: { type: [string, 'null'], description: 'Slug khách chọn; null = chưa chọn' }
        roomTypeLabel: { type: [string, 'null'], description: '`Room.publicRoomType` hiện hành khớp slug; null = chưa chọn hoặc không khớp (cờ `room_type_unmatched`)' }
        guestName: { type: string, x-classification: C2, x-rbac-field: D28, description: 'Đã chuẩn hóa (NFC, không ký tự điều khiển/ký tự hướng – SEC ARC-21); vắng với SAL khi yêu cầu chưa giao' }
        phone: { type: string, x-classification: C2, x-rbac-field: D28, description: 'E.164 có dấu `+`; chỉ có khi khách chọn kênh dùng SĐT (một cách liên hệ – SEC ARC-14). Desk: `tel:`/`wa.me` dựng từ trường này, "Sao chép SĐT" – không deep link Zalo (ARC-21)' }
        email: { type: string, x-classification: C2, x-rbac-field: D28, description: 'Chỉ có khi `preferredChannel = email`' }
        preferredChannel: { type: string, enum: [zalo, whatsapp, telegram, viber, phone, email] }
        note: { type: string, x-classification: C2, x-rbac-field: D28 }
        locale: { $ref: '#/components/schemas/Locale' }
        subSource:
          oneOf: [{ $ref: '#/components/schemas/DirectSubSource' }, { type: 'null' }]
          description: 'Nguồn phụ suy từ UTM/refHost – đơn chuyển từ yêu cầu mang `directSubSource` này; null = không rõ (gồm đi từ trang của chính OTTIMO – DOM-S4-18)'
        utmSource: { type: [string, 'null'] }
        utmMedium: { type: [string, 'null'] }
        utmCampaign: { type: [string, 'null'] }
        refHost: { type: [string, 'null'] }
        landingPath: { type: [string, 'null'] }
        suspiciousFlags:
          type: array
          description: |
            Cờ để nhân viên lọc, không chặn: lời nhắn có URL; chữ ngoài bảng chữ của 3 ngôn ngữ; ngày đến xa (> 180 ngày); liên hệ gửi lặp (bị giới hạn chặn); hạng phòng không khớp;
            `possible_duplicate` – cùng liên hệ với một yêu cầu còn mở, ngày giao nhau hoặc gửi cách ≤ `web_request_duplicate_window_hours` (NÊN – DOM Q-W10, BR-914 (3); không tự gộp);
            `offer_unverified` – phương án B: ảnh chụp giá thiếu/sai chữ ký nên không lưu (SEC ARC-18)
          items: { type: string, enum: [contains_url, unexpected_script, far_future, repeat_contact, room_type_unmatched, possible_duplicate, offer_unverified] }
        relatedRefCodes:
          type: array
          maxItems: 10
          items: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{8}$' }
          description: 'Mã các yêu cầu "có thể trùng" (NÊN – DOM Q-W10) – chỉ mã, không C2; người xử lý giữ một bản, đóng bản kia `duplicate`'
        duplicateCount: { type: integer, minimum: 0, description: 'Số lần cùng liên hệ gửi thêm trong ngày bị giới hạn chặn (không tạo bản mới)' }
        arrivesToday: { type: boolean, description: 'Ngày đến = ngày nghiệp vụ hiện tại (BR-010) – Desk xếp đầu; gửi ngoài giờ thì báo ngay người trực (BR-912 (3), DOM Q-W09)' }
        replyBy:
          $ref: '#/components/schemas/Instant'
          description: |
            Hạn phản hồi **nội bộ** (BR-912 v0.3.8 – không hiện cho khách): trong giờ trực `front_desk_hours` = lúc nhận + `web_request_response_minutes` (**15**); ngoài giờ = giờ mở trực kế
            tiếp + 15; liên hệ duy nhất là gọi điện (`preferredChannel = phone`) → không sớm hơn `guest_msg.send_window` mở + 15 (08:15); ngày đến = ngày nghiệp vụ và gửi ngoài giờ →
            lúc nhận + `web_request_same_day_after_hours_minutes` (30). Còn `new` ở mốc lúc nhận + `web_request_escalate_minutes` (30, tính trong giờ trực) → thông báo
            `website_request_overdue` (FDL + MGR, một lần)
        isReplyOverdue: { type: boolean, description: '`new` đã quá `replyBy` – Desk tô cảnh báo; cùng điều kiện mục "Cần chú ý" `website_request_new` mức `warning`' }
        assignedUserId: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        assignedUserName: { type: [string, 'null'], description: 'Tên hiển thị người đang xử lý' }
        claimedAt: { oneOf: [{ $ref: '#/components/schemas/Instant' }, { type: 'null' }] }
        declineReasonCode: { oneOf: [{ $ref: '#/components/schemas/WebsiteBookingRequestDeclineReason' }, { type: 'null' }] }
        declineNote: { type: string, x-classification: C2, x-rbac-field: D28 }
        quoteId: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }], description: 'Báo giá gần nhất gắn yêu cầu (`saveQuote.websiteBookingRequestId`)' }
        reservationId: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }], description: 'Đơn tạo ra khi `converted`' }
        reservationCode: { type: [string, 'null'], example: OTM-00212 }
        convertedAt: { oneOf: [{ $ref: '#/components/schemas/Instant' }, { type: 'null' }] }
        offerSnapshot: { oneOf: [{ $ref: '#/components/schemas/PublicOfferSnapshot' }, { type: 'null' }], description: 'Contract-ahead phương án B – luôn null ở A; ở B chỉ lưu khi `offerToken` đúng (SEC ARC-18)' }
        createdAt: { $ref: '#/components/schemas/Instant' }
        updatedAt: { $ref: '#/components/schemas/Instant' }
        piiPurgedAt: { oneOf: [{ $ref: '#/components/schemas/Instant' }, { type: 'null' }], description: 'Lúc xóa trường C2 (chuyển thành đơn, xóa theo yêu cầu `erase`, hoặc job hạn lưu – erd 4.14)' }
        version: { type: integer }
        allowedActions: { type: array, items: { $ref: '#/components/schemas/AllowedAction' }, description: 'Theo trạng thái và vai/phạm vi người gọi (claim, release, decline, mark-spam, reopen, erase)' }
    PublicOfferSnapshot:
      type: object
      additionalProperties: false
      required: [roomType, totalVnd, computedAt, priceVersion, offerToken]
      description: |
        **Contract-ahead phương án B** (0.3.7 bổ sung 2): giá trang đã hiện lúc gửi (từ `getPublicOffers`) – Desk hiện "Giá trên web lúc gửi" cạnh giá tính lại. **SEC ARC-18**: server lưu snapshot
        **chỉ khi** `offerToken` đúng chữ ký, còn hạn và khớp hạng/ngày/số người của yêu cầu; sai hoặc thiếu → không lưu, cờ `offer_unverified`, yêu cầu vẫn nhận. BR-916 (2) "giữ giá chụp"
        chỉ áp với snapshot đã kiểm chữ ký (DOM sửa – ORC chuyển).
      properties:
        roomType: { type: string, pattern: '^[a-z0-9-]{2,60}$' }
        totalVnd: { $ref: '#/components/schemas/MoneyVnd' }
        computedAt: { $ref: '#/components/schemas/Instant' }
        priceVersion: { type: string, maxLength: 40 }
        offerToken: { type: string, maxLength: 200, description: 'Từ `PublicOffers.offers[].offerToken`' }
    PublicAvailability:
      type: object
      required: [from, to, roomTypes]
      description: '**Contract-ahead phương án B** (0.3.7 bổ sung 2) – `getPublicAvailability`'
      properties:
        from: { $ref: '#/components/schemas/LocalDate' }
        to: { $ref: '#/components/schemas/LocalDate' }
        currency: { type: string, enum: [VND] }
        roomTypes:
          type: array
          items:
            type: object
            required: [roomType, nights]
            properties:
              roomType: { type: string, description: 'Slug của `Room.publicRoomType`' }
              nights:
                type: array
                items:
                  type: object
                  required: [date, available]
                  properties:
                    date: { $ref: '#/components/schemas/LocalDate' }
                    available: { type: boolean, description: 'Chỉ còn/hết – không số căn còn lại' }
                    nightlyRateVnd: { $ref: '#/components/schemas/MoneyVnd', description: 'Chỉ khi còn phòng và `public_show_prices = true`' }
    PublicOffers:
      type: object
      required: [arrival, departure, nights, offers]
      description: '**Contract-ahead phương án B** (0.3.7 bổ sung 2) – `getPublicOffers`'
      properties:
        arrival: { $ref: '#/components/schemas/LocalDate' }
        departure: { $ref: '#/components/schemas/LocalDate' }
        nights: { type: integer }
        priceVersion: { type: string }
        offers:
          type: array
          items:
            type: object
            required: [roomType, available]
            properties:
              roomType: { type: string }
              available: { type: boolean }
              totalVnd: { $ref: '#/components/schemas/MoneyVnd' }
              nightlyAvgVnd: { $ref: '#/components/schemas/MoneyVnd' }
              extraGuestFeeVnd: { $ref: '#/components/schemas/MoneyVnd' }
              losDiscountPct: { $ref: '#/components/schemas/Percent' }
              depositPct: { $ref: '#/components/schemas/Percent', description: 'BR-305' }
              cancellationPolicyKey: { type: string }
              offerToken: { type: string, maxLength: 200, description: 'SEC ARC-18 – chữ ký HMAC (`keyedHash(''public_offer'')`) trên cơ sở, hạng, ngày, số người theo nhóm tuổi, `totalVnd`, `priceVersion`, `computedAt`; hạn 24 giờ. Form gửi lại trong `offerSnapshot`' }
              offerTokenExpiresAt: { $ref: '#/components/schemas/Instant' }
        longStayHint:
          type: object
          description: 'Có khi ≥ 28 đêm (BR-108) – mời gửi yêu cầu, sale báo giá dài hạn'
          properties:
            fromMonthlyVnd: { $ref: '#/components/schemas/MoneyVnd' }
