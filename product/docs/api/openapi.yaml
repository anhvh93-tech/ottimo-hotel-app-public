        `DOC_NUMBER_INVALID`, `MAIN_GUEST_DUPLICATE`, `ENTRY_DATE_FUTURE` (E06-05). Hộ chiếu đã hết hạn **vẫn nhận** (để đối chiếu ra `fail`).
