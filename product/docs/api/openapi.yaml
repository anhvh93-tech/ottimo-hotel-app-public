        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [reservations]
      operationId: createReservation
      summary: Tạo đơn ngắn ngày đã đảm bảo (B2) – trực tiếp đã thu, khách vãng lai, đơn OTA nhập tay (US-017, US-018, US-019, US-047)
      description: |
        Server trong **một giao dịch**: kiểm quyền → tính giá (giá trống → giá niêm yết theo BR-101/104, hiển thị trước qua `.../quotes/calculate` hoặc `previewOnly`)
        → ghi `room_occupancy` (exclusion constraint) → cấp mã `OTM-xxxxx` → sinh `stay_night`, folio, bản ghi khai báo `none` (BR-608)
        → outbox đồng bộ kênh. Đơn kênh khác OTA trùng → `409 ROOM_UNAVAILABLE`.

        **Đơn OTA nhập tay vào căn đã kín** (decision-log PO 15/10, US-139 tối thiểu): server **không** tự đổi căn mà không báo –
        trả `409 ROOM_UNAVAILABLE` kèm `suggestions[]` (căn trống cùng nhóm, rồi nhóm cao hơn theo `room_group.sort_order`, đánh dấu `upgrade`).
        Lễ tân chọn căn và gửi lại với `roomId` mới; hết căn → gửi lại với `allowUnassigned: true` → đơn được tạo `confirmed`,
        `conflictState=open`, không gán căn (làn "Chưa gán căn", erd mục 7). `allowUnassigned` chỉ hợp lệ với kênh `channel_group=ota`.
        Đơn OTA về qua channel manager (R3) tự gán: căn ánh xạ → căn trống cùng nhóm; nhóm cao hơn chỉ gợi ý, không tự gán (DOM 15/10).

        Đơn OTA chỉ có tổng tiền (`otaRoomAmountVnd`, không `nightlyRates`) → chia đều theo đêm, phần nguyên đồng, dư dồn đêm cuối;
        có `nightlyRates` thì Σ phải bằng `otaRoomAmountVnd` (nếu gửi cả hai) – erd mục 8.

        **Đơn dài hạn nhập tay (US-017 AC5a, tạm R2)**: gửi `manualLongStay` – xem schema `ManualLongStayInput`. Không có `manualLongStay`
        mà số đêm đạt ngưỡng BR-108 → `422 VALIDATION_FAILED` mã trường `LONG_STAY_REQUIRES_CONTRACT` (US-017 AC5; R2 UI hướng sang AC5a).
        SAL/CTV không tạo được (A01 ✖ – operation này không có trong `x-roles` của họ).

        **Ở tối thiểu và đêm lẻ (BR-113, 0.3.5 A-05)**: `roomId` vẫn bắt buộc. Khoảng ngày là đêm lẻ của căn đã chọn → nhận (ngoại lệ a). Không phải →
        `422` mã trường `MIN_STAY_NOT_MET` kèm `minStayNights` và `suggestions[]` các căn cùng nhóm có đêm lẻ (`orphanNight=true`); FDL+ bỏ qua bằng `minStayOverrideReason`.
      x-roles: [owner, manager, front_desk_lead, front_desk]
      x-rbac: [A01, S05]
      x-transition: B2
      x-stories: [US-017, US-018, US-019, US-023, US-047, US-139]
