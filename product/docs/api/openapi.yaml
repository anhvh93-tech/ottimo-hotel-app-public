                roomNo: '401'
                arrivalDate: '2026-11-10'
                departureDate: '2026-11-13'
                nights:
                  - { date: '2026-11-10', oldRateVnd: 667000, newRateVnd: 1042000 }
                  - { date: '2026-11-11', oldRateVnd: 667000, newRateVnd: 1042000 }
                  - { date: '2026-11-12', oldRateVnd: 667000, newRateVnd: 1042000 }
                roomTotalOldVnd: 2001000
                roomTotalNewVnd: 3126000
                folioDeltaVnd: 1125000
                depositPaidVnd: 600000
                balanceDueAfterVnd: 2526000
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/RoomUnavailable' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
