  /v1/properties/{propertyId}/folios/{folioId}/lines:
    parameters:
      - $ref: '#/components/parameters/PropertyId'
      - $ref: '#/components/parameters/FolioId'
    post:
      tags: [folio]
      operationId: addFolioLine
      summary: Thêm dòng phát sinh từ danh mục (giặt, phạt thuốc lá, làm lại thẻ… BR-511) – ghi nhật ký tiền (US-032, A30)
      description: |
        **0.3.8 bổ sung 6 (ARC 24/10, BUG-R3-013, BR-522 K11-06)**: trên folio `settled`, dòng phát sinh sau trả phòng làm **giảm** tiền dư → server chạy lại `refundPlan`
        cùng giao dịch (dưới L1 → L3): yêu cầu hoàn đang chờ lớn hơn tiền dư bị hủy `superseded` và xin lại đúng số (giữ nguồn, người xin, `origin_actor_ids` của yêu cầu A32);
        hết tiền dư → yêu cầu **đã duyệt** chưa chi cũng đóng (`cancelled`, `superseded`, có nhật ký, báo người xin/người duyệt). Không đổi hình dạng phản hồi.
        Dòng folio là chỉ-thêm nên **không** cần `If-Match` (ngoại lệ có chủ đích với coding-standards 7.5). Server khóa
        `folio … FOR UPDATE`, kiểm `status='open'` (hoặc trong `post_checkout_window_until`) rồi ghi; bill đã khóa → `409 FOLIO_LOCKED`.

        **0.3.3 (EP03-05 mục 3.2, E04-03)**: khoản danh mục có `priceEditable=false` (phạt, hư hỏng theo bảng, dọn lẻ, giặt ủi – giá theo tham số BR) mà gửi
        `unitPriceVnd` → 422 `PRICE_NOT_EDITABLE`; khoản `evidenceRequired=true` cần ≥ 1 `evidenceAttachmentIds` **hoặc** `note` ≥ 3 ký tự → thiếu: 422 `EVIDENCE_REQUIRED`.
        Hư hỏng **ngoài bảng** (`category=damage`, không `chargeCode`) gửi `proposedUnitPriceVnd` → dòng `lineState=pending_approval` (không vào còn phải thu)
        + yêu cầu duyệt `damage_pricing` cho MGR+ (US-032 AC4, BR-512); phản hồi vẫn là `Folio` (dòng có `approvalRequestId`).
        Dòng phí phạt khi đơn chưa có `houseRulesSentAt` → vẫn ghi, client hiện cảnh báo (giả định BA, không chặn).
        **0.3.7 bổ sung 4 (vòng sửa 5b, DOM chốt K11-06 hướng (a))**: đơn của folio ở `cancelled`/`no_show` → **409 `INVALID_TRANSITION`** (kèm `currentState`) cho **mọi vai**, không ghi gì
        (kiểm **sau** khóa folio – ARC 16.19); sửa/void dòng đã có giữ như cũ. Thứ tự khóa: đơn của folio `KEY SHARE` → folio.
      x-roles: [owner, manager, front_desk_lead, front_desk]
      x-rbac: [A30, A31]
      x-stories: [US-032, US-006]
