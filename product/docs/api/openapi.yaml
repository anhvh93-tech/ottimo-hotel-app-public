      parameters:
        - { name: otherReservationId, in: query, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
        - { name: effectiveDate, in: query, schema: { $ref: '#/components/schemas/LocalDate' } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SwapRoomPreview' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/RoomUnavailable' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
