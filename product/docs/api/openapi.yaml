                    khi **mọi** khối đã có mã; trước đó vẫn `scanned` (giả định ARC – BA xác nhận K6 cho `mixed`). `mark-rejected` với `mixed` áp cho cả khai báo.
                rejectedReason: { type: string }
                actualDepartureDate: { $ref: '#/components/schemas/LocalDate' }
            examples:
              single: { value: { portalReference: LT-2026-0041872 } }
              mixedForeignerBlock: { value: { portalReference: LT-2026-0041872, kind: foreigner_temp_residence } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Registration' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/VersionConflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

