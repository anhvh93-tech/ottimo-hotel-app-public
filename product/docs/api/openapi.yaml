        '200':
          description: OK
          headers:
            Cache-Control: { schema: { type: string, enum: [no-store] } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GuestSession' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /v1/guest/sessions/otp:
    post:
      tags: [guest-portal]
      operationId: sendGuestOtp
      summary: Gửi OTP email 6 số (10 phút) tới email trên đơn để lên mức 2 (SR-GST-07a)
      description: |
        OTP sinh bằng CSPRNG, lưu băm trên `guest_verification_code` gắn token; gửi qua `NotificationAdapter` email (outbox).
        Tối đa 3 OTP/giờ/token (SR-GST-08). Đơn **không có email** → `409 INVALID_TRANSITION` với hướng dẫn "nhờ lễ tân cấp mã".
        Email trên đơn **vừa đổi trong 24 giờ** sau khi đã cấp link → từ chối cùng hướng dẫn, trừ khi lễ tân đã xác nhận lại (SR-GST-14).
        Phản hồi chỉ có email đã che (`d***@g***.com`).
