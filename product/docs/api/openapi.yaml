        Theo SEC R-REG-05, decision-log và US-045 (đợt 3): đồng ý **không** là điều kiện để khai báo. Bắt buộc **ghi quyết định**
        (granted/refused, không mặc định) trước bước `complete-review`; refused → ảnh xóa theo T01.

        **Đổi quyết định tại quầy (0.3.3, E06-02 – SEC P-R2-4 ĐK-5)**: mỗi lần gọi **thêm** một `consent_record` mới (append-only, giữ lịch sử – R-CON-02);
        quyết định hiện hành = bản ghi mới nhất của người đó.
        - `granted → refused` (rút đồng ý – NĐ 13/2023): luôn được. Khai báo chưa `confirmed` → ảnh xóa khi `confirmed` (như người không đồng ý);
          đã `confirmed` → **xóa ngay trong cùng giao dịch** (hủy DEK, `purge_journal`, `c3_access_log purge` actor = người ghi) – BR-609 (c), J16 chỉ là dự phòng.
        - `refused → granted`: chỉ khi ảnh **còn** (khai báo chưa `confirmed` và chưa purge); ngược lại → `409 CONSENT_CHANGE_NOT_ALLOWED`.
        - Người dưới ngưỡng dữ liệu (`minor_data_age_threshold`) không được hỏi → `422 NOT_IN_LIST` (ảnh xóa khi khai xong – chờ DOM E06-08).
        - Phản hồi `Registration` có `imagesPurgeScheduledAt`/`imagesPurgedAt` và `documents[].imagePurgeAt`.
      x-roles: [owner, manager, front_desk_lead, front_desk]
      x-rbac: [A72]
      x-stories: [US-045, US-049]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConsentInput' }
            example: { partyMemberId: 0192a1b0-0000-7000-8000-0000000bb001, purpose: P02B_ID_IMAGE_RETENTION, decision: granted, channel: desk, noticeVersion: privacy-2026-10-v1, locale: en }
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Registration' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: CONSENT_CHANGE_NOT_ALLOWED
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example: { type: /problems/consent-change-not-allowed, title: 'Ảnh đã xóa theo lựa chọn trước đó, không bật lại được', status: 409, code: CONSENT_CHANGE_NOT_ALLOWED }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /v1/properties/{propertyId}/registrations/{registrationId}/actions/complete-review:
    parameters:
      - $ref: '#/components/parameters/PropertyId'
      - $ref: '#/components/parameters/RegistrationId'
    post:
      tags: [registration]
      operationId: completeRegistrationReview
      summary: Đối chiếu xong (K5) review → scanned – mọi cảnh báo đối chiếu phải có ghi chú xử lý; cảnh báo không chặn nhận phòng (R-REG-03)
      description: |
        **0.3.3 (E06-01, E06-05)**: điều kiện – trạng thái `review`; đủ người (`party_count`); mọi mục `fail`/`unverified` có ghi chú (đã ghi qua
        `recordDocumentCheck` hoặc gửi trong `warningNotes`), mục `unverified` có `manualResult`; mọi người có ảnh (trừ dưới ngưỡng dữ liệu) đã ghi quyết định
        đồng ý. Thiếu → `409 REGISTRATION_INCOMPLETE` kèm `errors[]` (mục thiếu) hoặc 422 `CHECK_NOTE_REQUIRED`. Mục BR-613 (c) có kết quả cuối `fail`
        → `blocksDoorCode=true` (chặn B9 ở R2 – xem `checkIn`), các mục khác chỉ cảnh báo (R-REG-03).
      x-roles: [owner, manager, front_desk_lead, front_desk]
      x-rbac: [A70]
      x-transition: K5
      x-stories: [US-044, US-045]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                warningNotes:
                  type: array
                  items:
                    type: object
                    required: [documentId, checkCode, note]
                    properties:
                      documentId: { $ref: '#/components/schemas/Uuid' }
                      checkCode: { $ref: '#/components/schemas/DocumentCheckCode' }
                      note: { type: string, minLength: 3, maxLength: 500, description: 'V-09 – không ghi lại số giấy tờ' }
                      manualResult: { type: string, enum: [pass, fail], description: 'Bắt buộc với mục `unverified` chưa có `manualResult` (0.3.3, E06-01)' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Registration' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/VersionConflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /v1/properties/{propertyId}/registrations/{registrationId}/documents/{documentId}/checks/{checkCode}:
    parameters:
      - $ref: '#/components/parameters/PropertyId'
      - $ref: '#/components/parameters/RegistrationId'
      - $ref: '#/components/parameters/DocumentId'
      - name: checkCode
        in: path
        required: true
        schema: { $ref: '#/components/schemas/DocumentCheckCode' }
    put:
      tags: [registration]
      operationId: recordDocumentCheck
      summary: Lễ tân ghi kết quả kiểm tay / ghi chú xử lý cho một mục đối chiếu (nút "Đạt"/"Không đạt" ở bước Kiểm tra) – US-044 AC2, AC4
      description: |
        **0.3.3 (E06-01)** – để kết quả kiểm tay có hiệu lực **trước** nhận phòng (B9 chỉ cần khai báo ≥ `partial`, chưa cần K5).
        - Mục `unverified`: `manualResult` (bắt buộc) + `note`. Mục `fail`: chỉ `note` (`manualResult` gửi lên → 422 `NOT_IN_LIST` – không "sửa" kết quả hệ thống).
          Mục `pass`/`not_applicable` → `409 INVALID_TRANSITION`.
        - `note` 3–500 ký tự, V-09, không chứa số giấy tờ (thiếu → 422 `CHECK_NOTE_REQUIRED`).
        - Server tính lại `blocking` và `Registration.blocksDoorCode` trong cùng giao dịch; ghi nhật ký (người, thời điểm, kết quả) – không phải dữ liệu C3.
        - Gọi lại = ghi đè kết quả kiểm tay trước (có nhật ký). Khai báo đã `sent`/`confirmed` → `409 INVALID_TRANSITION`.
      x-roles: [owner, manager, front_desk_lead, front_desk]
      x-rbac: [A70]
      x-requires-trusted-device: true
      x-stories: [US-044]
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [note]
              properties:
                manualResult: { type: string, enum: [pass, fail] }
                note: { type: string, minLength: 3, maxLength: 500 }
            example: { manualResult: pass, note: 'Đã xem dấu nhập cảnh trên hộ chiếu gốc, trang 12' }
      responses:
        '200':
          description: OK – khai báo sau khi tính lại `blocksDoorCode`
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Registration' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/VersionConflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /v1/properties/{propertyId}/registrations/{registrationId}/portal-data:
    parameters:
      - $ref: '#/components/parameters/PropertyId'
      - $ref: '#/components/parameters/RegistrationId'
    get:
      tags: [registration]
      operationId: getPortalData
      summary: Dữ liệu sao chép lên cổng BCA đúng thứ tự trường (K6; US-046 AC2) – C3, ghi nhật ký mỗi lần lấy, chỉ trên máy quầy được cấp (rbac 8.7)
      description: |
        **0.3.3 (E06-03)**: khai báo `kind=mixed` → gọi **mỗi khối một lần** với `?kind=foreigner_temp_residence` rồi `?kind=vn_citizen_stay` (thiếu `kind` khi
        `mixed` → 422 `REQUIRED`; `kind` không có người nào → 422 `NOT_IN_LIST`). Điều kiện: `scanned` hoặc `needs_update` (khác → `409 INVALID_TRANSITION`).
        **Nhật ký (ARC chốt, SEC xem)**: **mỗi lần gọi** = một dòng `c3_access_log` (`portal_data`, `view`) ghi trước khi trả; **không** có endpoint báo từng lần
        sao chép – nút sao chép ở client chỉ dùng dữ liệu đã lấy (bản ghi `view` là bằng chứng truy cập; số lần client bấm sao chép không kiểm chứng được ở server).
        Client xóa clipboard ("Xóa bộ nhớ tạm" + tự xóa sau 60 giây – R-REG-07) và không lưu dữ liệu ra storage.
      x-roles: [owner, manager, front_desk_lead, front_desk]
      x-rbac: [A73]
      x-classification: C3
      x-requires-trusted-device: true
      x-step-up: true
      x-c3-log: { subjectType: portal_data, action: view }
      x-rate-limit: 60/giờ/người cảnh báo, 200/giờ chặn (SR-RL-06)
      x-stories: [US-046]
      parameters:
        - name: kind
          in: query
          description: 'Bắt buộc khi khai báo `mixed` (0.3.3, E06-03)'
          schema: { type: string, enum: [foreigner_temp_residence, vn_citizen_stay] }
      responses:
        '200':
          description: OK
          headers:
            Cache-Control: { schema: { type: string, enum: [no-store] } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PortalData' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
