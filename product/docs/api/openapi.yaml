      description: |
        **0.3.7 bổ sung 2 – contract-ahead phương án B** (FB-INV-002 ý 3 B; ADR-014 4.7). Chỉ cài khi INV chọn B; trước đó route không đăng ký (404). Ghi sẵn để form A
        chuyển sang B không đổi `createWebsiteBookingRequest` (chỉ thêm `offerSnapshot`).
