    # ── folio ──
    FolioLine:
      type: object
      required: [id, category, description, quantity, unitPriceVnd, amountVnd, lineState, postedAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        category: { $ref: '#/components/schemas/FolioLineCategory' }
        revenueGroup: { type: string, enum: [room, other, non_revenue] }
        description: { type: string, description: 'Mô tả kỹ thuật cho nhật ký – **không in** lên bill/màn khách (DOM BE-21); hiển thị theo `labelKey`' }
        labelKey:
          type: string
          pattern: '^bill\.line\.[a-z_]+$'
          description: |
            0.3.6 bổ sung (review S3 – ARC mục C chốt tên, DOM BE-21): khóa chuỗi hiển thị của dòng (`bill.line.*`), client dịch theo `locale`
            (VI, VI/EN). Danh sách khóa và tham số (đóng theo khóa): `room_night {date, room}` · `extra_night {date, room}` (0.3.6 bổ sung 2 (BA v0.3, ARC 17/10), E05-11) · `extra_person {date, count}` ·
            `early_checkin {time, pct}` · `late_checkout {time, pct}` · `early_departure_fee {pct?, nights?, noticeDays?}` · `overpayment_retained` ·
            `room_change {from, to}` · `minibar {item, qty}` · `cancellation_fee` · `no_show_fee` · `foc {reason}` · `discount {reason}` ·
            `laundry {qty}` · `adhoc_cleaning {qty}` · `smoking_fee` · `key_card_fee {qty}` · `damage {item, qty}` · `fnb {text, qty}` ·
            `service_fee {text, qty}` · `utilities` · `adjustment`.
            **0.3.7 bổ sung D1 (BR-012 (1), (5))**: `room` (ở `room_night`, `extra_night`) và `from`/`to` (ở `room_change`) là **tên phòng** (`Room.name`), **không** phải số căn – một
            chuỗi bill cho Desk, bản in và guest-web; căn chưa có tên → số căn (tạm, DS 11.3). Folio `open`: server điền **lúc đọc** theo căn của đêm (tên hiện hành – BR-012 (5) không
            snapshot; nội bộ có thể lưu id/số căn); khi folio chuyển `settled`, server **chụp** tên phòng các căn của folio (`folio.settled_room_names`, erd 4.6) trong cùng giao dịch chốt
            và từ đó điền theo bản chụp (dòng folio vẫn chỉ-thêm). Desk cần số căn thì lấy ở `Reservation.segments`.
        labelParams:
          type: object
          additionalProperties: { type: [string, number] }
          description: 'Tham số của `labelKey` – ngày `YYYY-MM-DD`, giờ `HH:mm`, phần trăm số nguyên; client định dạng. 0.3.6 bổ sung (review S3). `room`/`from`/`to` = tên phòng, chụp khi `settled` (0.3.7 bổ sung D1, BR-012)'
        serviceDate: { $ref: '#/components/schemas/LocalDate' }
        quantity: { type: number }
        unitPriceVnd: { $ref: '#/components/schemas/MoneyVnd' }
        amountVnd: { $ref: '#/components/schemas/MoneyVnd' }
        vatRatePct: { $ref: '#/components/schemas/Percent' }
        lineState: { type: string, enum: [posted, pending_approval, rejected] }
        relatedLineId: { $ref: '#/components/schemas/Uuid' }
        reversalOfId: { $ref: '#/components/schemas/Uuid' }
        approvalRequestId: { $ref: '#/components/schemas/Uuid' }
        postedAt: { $ref: '#/components/schemas/Instant' }
        postedBy: { type: string }
        chargeCode:
          type: [string, 'null']
          x-visible-to: [owner, manager, front_desk_lead, front_desk]
          description: |
            0.3.7 bổ sung 4 (FE-A cảnh báo N-1, ARC 16.14): `folio_line.charge_code` – mã khoản trong charge-catalog; dòng `minibar` = **mã món** (`item.code`, bất biến – khóa FOC
            `item:minibar:<code>`); mã hệ thống như `late_fee_as_night`, `overpayment_retained`; `null` = dòng không có mã. Dòng thay của `adjustFolioLine` giữ mã. Client so món theo trường
            này, không theo tên trên bill
    FolioLineCreate:
      type: object
      required: [quantity]
      properties:
        chargeCode: { type: string, description: 'Mã trong charge-catalog (giá mặc định từ tham số)' }
        category: { $ref: '#/components/schemas/FolioLineCategory' }
        description: { type: string, maxLength: 200 }
        quantity: { type: number, minimum: 0.01 }
        unitPriceVnd: { $ref: '#/components/schemas/MoneyVnd' }
        serviceDate: { $ref: '#/components/schemas/LocalDate' }
