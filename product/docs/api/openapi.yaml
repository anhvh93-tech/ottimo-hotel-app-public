      description: |
        Tra token bằng hàm `guest_resolve_token(token_hash)` SECURITY DEFINER (erd mục 2.4) vì `/v1/guest/*` chưa có ngữ cảnh RLS;
        sau đó đặt ngữ cảnh cơ sở của đơn. Mở phiên mới **không** reset bộ đếm xác minh sai (đếm theo token – SR-GST-08).
        **0.3.7 bổ sung 1 (MOB s4 mục 4, P-S4-10)**: ngôn ngữ phiên chọn theo thứ tự ở `GuestSession.locale` (khách đã chọn → hồ sơ → `Accept-Language`: `vi*` → vi, `ru*` → ru,
        còn lại/vắng → **en**); trả `localeChosenByGuest`.
      security: []
      x-roles: [guest]
      x-guest-level: 0
      x-after-checkout: allowed
      x-rate-limit: 10/phút/IP, 100/ngày/IP (SR-RL-03)
      x-stories: [US-106]
      parameters:
        - name: Accept-Language
          in: header
          required: false
          description: '0.3.7 bổ sung 1: header trình duyệt gửi sẵn (ví dụ `en-US,en;q=0.9`) – chỉ dùng khi khách chưa tự chọn và hồ sơ không có ngôn ngữ; server đọc thẻ đầu tiên'
          schema: { type: string, maxLength: 200 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string, minLength: 22, maxLength: 64, writeOnly: true, x-rbac-field: D25 }
      responses:
        '200':
          description: OK – đặt cookie `__Host-ottimo_gsid`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GuestSession' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '429': { $ref: '#/components/responses/RateLimited' }
