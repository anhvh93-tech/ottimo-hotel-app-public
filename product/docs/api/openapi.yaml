      - $ref: '#/components/parameters/LineId'
    post:
      tags: [folio]
      operationId: adjustFolioLine
      summary: Sửa một dòng = bút toán đảo + dòng mới, lý do bắt buộc (BR-008). Folio `settled` chỉ MGR+ (A32, US-038 AC2).
      description: |
        **0.3.6 bổ sung (review S3, ARC 17/10)**: `If-Match` = `Folio.version` (ETag của `getFolio`/`addFolioLine`; mọi thay đổi dòng của folio tăng version – BE-B decision 16/10).
        Dòng **sinh từ đêm lưu trú** (`room`, `extra_person`) sửa giá phải ghi lại giá đêm ở đơn (cùng giao dịch) để lần đồng bộ đêm sau (gia hạn, đổi phòng, đổi số người)
        **giữ** giá đã sửa và các dòng FOC/giảm giá đi kèm – không bao giờ tự đảo giá đã sửa (thẻ FB-R2-ARC-BE-S3-14).
      x-roles: [owner, manager, front_desk_lead, front_desk]
      x-rbac: [A31, A32]
      x-stories: [US-006, US-038]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                newQuantity: { type: number, minimum: 0 }
                newUnitPriceVnd: { $ref: '#/components/schemas/MoneyVnd' }
                voidLine: { type: boolean, default: false }
                reason: { type: string, minLength: 3, maxLength: 500 }
            example: { newUnitPriceVnd: 150000, reason: 'Khách trả 14:00 không phải 15:00' }
      responses:
        '201':
          description: Đã ghi bút toán
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Folio' }
        '409': { $ref: '#/components/responses/Conflict' }
