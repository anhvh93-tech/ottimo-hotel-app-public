                    properties:
                      lineId: { $ref: '#/components/schemas/Uuid' }
                      reason: { type: string, maxLength: 500 }
                dryRun:
                  type: boolean
                  default: false
                  description: |
                    Tính thử (US-021 AC3, US-135): trả `CancellationQuote` – phí/hoàn theo chính sách, `serviceLines[]` với `retained` theo `retainLines` gửi kèm, tổng sau khi đảo, số của yêu cầu hoàn
                    sẽ tạo. Giao dịch `readOnly`, không ghi, không cần `Idempotency-Key`/`If-Match`, không tiêu khóa. 0.3.7 bổ sung D1 (S4-08)
            example: { reasonCode: found_other, note: Khách báo qua Zalo, dryRun: false }
      responses:
