            orphanNight: { type: boolean, description: 'Khoảng ngày là đêm lẻ của căn (BR-113 a) – không vướng ở tối thiểu. 0.3.5 (A-05)' }
        alternatives:
          type: array
          maxItems: 6
          items:
            type: object
            required: [roomId, roomNo, available]
            properties:
              roomId: { $ref: '#/components/schemas/Uuid' }
              roomNo: { type: string }
              roomGroupCode: { type: string }
              available: { type: boolean }
              upgrade: { type: boolean, description: 'Nhóm cao hơn nhóm tham chiếu (`roomGroupId`, nhóm của `roomId` hoặc của `reservationId`) – nâng hạng cần FDL+ (BR-316). 0.3.5 (A-05)' }
              orphanNight: { type: boolean, description: 'Khoảng ngày là đêm lẻ của căn này (BR-113 a). 0.3.5 (A-05)' }

    # ── đơn ──
    NightRate:
      type: object
      required: [date, amountVnd]
      properties:
        date: { $ref: '#/components/schemas/LocalDate' }
        amountVnd: { $ref: '#/components/schemas/MoneyVnd' }
        edited:
          type: boolean
          writeOnly: true
          description: |
            0.3.7 bổ sung 4 (vòng sửa 5, ARC 16.18 – nguồn đêm theo thao tác, BR-417 phụ lục 5A): lễ tân **đã sửa ô** giá của đêm này (cờ "đã sửa" của ô, không so số).
            `true` → nguồn `manual` (kể cả gõ đúng số lịch/gợi ý). `false` → không phải nhập tay: B1 `createReservation` ghi `calendar`, B13 `extendStay` ghi `default`; server ghi
            `amountVnd` như gửi (xem trước = lệnh ghi). **Vắng** → quy tắc cũ của lệnh (tương thích ngược): B1 so với giá lịch như hiện nay, B13 có phần tử = `manual`.
            Đơn B1 có ít nhất một đêm `edited = true` (Trực tiếp/CTV ngắn ngày) → `bookingRateSource = manual_agreed`. Desk (H09, B13) **luôn gửi** cờ này cho mọi đêm
        calendarRateVnd:
          $ref: '#/components/schemas/MoneyVnd'
          readOnly: true
          description: |
            Chỉ trong phản hồi: giá lịch của đêm (BR-104, hoặc giá lễ tân sửa tay) **trước** bậc giảm số đêm BR-107/mã quay lại BR-111 (erd `stay_night.calendar_rate_vnd`).
            Đổi số đêm → server áp lại bậc giảm theo **tổng số đêm cuối cùng** trên giá này cho mọi đêm còn hiệu lực (DOM D-8, BR-106); cọc đã thu không đổi. 0.3.5 (A-22)
    MoveReasonCode:
      type: string
      enum: [guest_request, property_fault, overbooking, upgrade, inventory_optimize, force_majeure, other]
      description: |
        Lý do đổi căn/ngày B7/B8 (DOM D-5, 0.3.5 A-19). Ràng buộc kiểm ở server:
        `overbooking` chỉ khi đơn `conflictState=open` hoặc `capacityConflict=true` (khác → 422 `NOT_IN_LIST`);
        `upgrade` chỉ FDL+ (FD → 403 `FORBIDDEN_ACTION`); `force_majeure` chỉ `mode=postpone_instead_of_cancel`, MGR+, `note` bắt buộc (bằng chứng);
        `inventory_optimize` – sắp căn tránh đêm lẻ, khách chưa được báo số căn; `other` – `note` bắt buộc. B8 thường (dời thay hủy) dùng `guest_request`.
        Đơn kênh `ota` không đổi ngày được (`OTA_DATES_LOCKED`) – R2 làm bằng hủy `ota_cancelled` (phạt 0) + tạo đơn mới cùng `otaRef`, ghi chú "OTA sửa đơn".
        **0.3.7 (ESC-019 A – INV 17/10; BR-429 v0.3.5)**: mã lý do quyết giá khi đổi căn – `guest_request` = khách tự xin → **giá căn mới** (đơn OTA: chênh lệch so với căn gốc thu
        tại quầy, BR-424); mọi mã khác (`property_fault`, `overbooking`, `upgrade`, `inventory_optimize`, `force_majeure`) và `other` → **giữ giá** đã chốt; `other` sang căn có giá
        hiện hành cao hơn chỉ FDL+ (như `upgrade`). Xem `previewMoveReservation`.
    ReservationSummary:
      type: object
      required: [id, code, status, stayType, arrivalDate, departureDate]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        code: { type: string, example: OTM-00171 }
        status: { $ref: '#/components/schemas/ReservationStatus' }
        stayType: { type: string, enum: [short, long] }
        roomNo: { type: [string, 'null'] }
        arrivalDate: { $ref: '#/components/schemas/LocalDate' }
        departureDate: { $ref: '#/components/schemas/LocalDate' }
        nights: { type: integer }
        guestDisplayName: { type: string, x-rbac-field: D01 }
        channelCode: { type: string }
        etaTime: { $ref: '#/components/schemas/LocalTime' }
        holdExpiresAt: { $ref: '#/components/schemas/Instant' }
        conflictState: { $ref: '#/components/schemas/ConflictState' }
        registrationStatus: { $ref: '#/components/schemas/RegistrationStatus' }
        balanceDueVnd:
          $ref: '#/components/schemas/MoneyVnd'
          x-visible-to: [owner, manager, front_desk_lead, front_desk]
    CloserCandidate:
      type: object
      required: [userId, displayName, kind]
      properties:
        userId: { $ref: '#/components/schemas/Uuid' }
        displayName: { type: string, x-rbac-field: D27 }
        kind: { type: string, enum: [agent, staff], description: 'agent = CTV (hoa hồng `payeeType=agent`); staff = nhân viên (hoa hồng `payeeType=staff` khi là sale)' }
    BookingRules:
      type: object
      description: |
        Ánh xạ khóa tham số (BR mục 13) – 0.3.5 (A-07).
        **0.3.7 bổ sung 4 (S4-38, BR-107 v0.3.8 – thay quyết định ARC-BE-S3-24.3 "giá sửa tay không bao giờ tính lại bậc")**: giá đêm lễ tân **gõ tay** (tạo đơn, sửa giá S4-35, đêm B9a,
        đêm thêm, đổi căn/ngày) là **giá lịch** của đêm (`NightRate.calendarRateVnd`); bậc giảm theo số đêm BR-107 (và mã khách quay lại BR-111) áp **lên** giá đó – giá ghi = giá gõ × (1 − bậc),
        làm tròn BR-005 – và được áp lại khi tổng số đêm đổi. Form hiện giá sau bậc; không coi giá gõ là giá cuối.
      required: [businessDate, holdHoursOptions, holdHoursDefault, holdLatestTimeOnArrival, holdExtensionMaxHours, quoteValidityDays, shortStayDepositPct, longStayCompareFromNights, longStayRequiredFromNights, noShowCallTime, noShowMarkTime, checkinTime, checkoutTime]
      properties:
        businessDate: { $ref: '#/components/schemas/LocalDate' }
        businessDayRollover: { $ref: '#/components/schemas/LocalTime', description: '0.3.8 (R3-Q38) – `business_day_rollover` (BR-010) đang hiệu lực' }
        holdHoursOptions: { type: array, items: { type: integer }, description: '`hold_hours_options` (BR-302)' }
        holdHoursDefault: { type: integer, description: '`hold_hours_default`' }
        holdLatestTimeOnArrival: { $ref: '#/components/schemas/LocalTime', description: '`hold_latest_time_on_arrival`' }
        holdExtensionMaxHours: { type: integer, description: '`hold_extension_max_hours` (BR-303)' }
        quoteValidityDays: { type: integer, description: '`quote_validity_days` (BR-304)' }
        shortStayDepositPct: { $ref: '#/components/schemas/Percent', description: '`short_stay_deposit_pct` (BR-305)' }
        longStayCompareFromNights: { type: integer, description: '`long_stay_compare_from_nights` (BR-108)' }
        longStayRequiredFromNights: { type: integer, description: '`long_stay_required_from_nights` (BR-108)' }
        noShowCallTime: { $ref: '#/components/schemas/LocalTime', description: '`no_show_call_time` (BR-311)' }
        noShowMarkTime: { $ref: '#/components/schemas/LocalTime', description: '`no_show_mark_time` (BR-311)' }
        checkinTime: { $ref: '#/components/schemas/LocalTime', description: '`checkin_time` (BR-401)' }
        checkoutTime: { $ref: '#/components/schemas/LocalTime', description: '`checkout_time` (BR-401)' }
        oooReopenBufferDays:
          type: integer
          minimum: 0
          description: '0.3.7 bổ sung 3 (US-061 AC1, BR-804): `ooo_reopen_buffer_days` – form phiếu sửa/khối OOO của Desk hiện "mở bán lại từ {expectedDoneDate + n}" trước khi lưu; server vẫn tự tính `endDatePlanned`. Vắng khi server chưa trả (client hiện câu không có ngày)'
        lateCheckout:
          type: object
          description: '0.3.7 (nháp B-7, FE): bậc phụ thu trả muộn `late_checkout_tiers` + mốc cuối + giờ ân hạn `late_grace_until` (BR-412/416) – client chỉ hiển thị, server vẫn tính'
          required: [tiers, lastTime, graceUntil]
          properties:
            tiers:
              type: array
              items:
                type: object
                required: [until, pct]
                properties:
                  until: { $ref: '#/components/schemas/LocalTime' }
                  pct: { $ref: '#/components/schemas/Percent' }
            lastTime: { $ref: '#/components/schemas/LocalTime', description: 'Mốc cuối – trả sau mốc này là "tính thêm 1 đêm" (BR-416, E05-11)' }
            graceUntil: { $ref: '#/components/schemas/LocalTime', description: '`late_grace_until` (ESC-007 A: 12:30) – trước mốc này không phụ thu' }
    Reservation:
      type: object
      required: [id, code, status, stayType, channelId, arrivalDate, departureDate, adults, folioId, conflictState, allowedActions, version]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        code: { type: string, example: OTM-00171 }
        status: { $ref: '#/components/schemas/ReservationStatus' }
        stayType: { type: string, enum: [short, long] }
        channelId: { $ref: '#/components/schemas/Uuid' }
        channelCode: { type: string }
        directSource:
          type: [string, 'null']
          enum: [website, zalo_phone, walk_in, returning, sales_staff, null]
          description: 'Nguồn đơn kênh Trực tiếp (US-017 AC8); null = chưa rõ nguồn. 0.3.1'
        directSubSource:
          oneOf: [{ $ref: '#/components/schemas/DirectSubSource' }, { type: 'null' }]
          readOnly: true
          description: '0.3.7 bổ sung 2 (FB-INV-002 ý 3, US-158): nguồn phụ khi `directSource = website` – chỉ đơn chuyển từ yêu cầu website ("website · facebook"); server ghi, không nhập tay; null với nguồn khác'
        paymentModel: { type: string, enum: [direct, ota_prepaid, ota_pay_at_property] }
        otaRef:
          x-rbac-field: D19
          type: string
          x-visible-to: [owner, manager, front_desk_lead, front_desk]
        booker: { $ref: '#/components/schemas/GuestSummary' }
        closerUserId: { $ref: '#/components/schemas/Uuid' }
        parentReservationId: { $ref: '#/components/schemas/Uuid' }
        quoteId: { $ref: '#/components/schemas/Uuid' }
        groupId: { $ref: '#/components/schemas/Uuid', description: 'Nhóm đơn (SM-16, `reservation.group_id`) – null nếu đơn lẻ' }
        externalContract:
          type: boolean
          default: false
          description: 'Đơn dài hạn nhập tay R2 (US-017 AC5a) – "HĐ ngoài hệ thống – chuyển vào app ở R3"; erd `reservation.external_contract`'
        manualLongStay:
          type: object
          description: 'Chỉ có khi `externalContract=true`'
          x-visible-to: [owner, manager, front_desk_lead, front_desk]
          properties:
            monthlyRentVnd: { $ref: '#/components/schemas/MoneyVnd' }
            externalContractRef: { type: string }
            depositHeldVnd: { $ref: '#/components/schemas/MoneyVnd' }
        folioId: { $ref: '#/components/schemas/Uuid' }
        segments:
          type: array
          items:
            type: object
            required: [roomId, fromDate, toDate]
            properties:
              roomId: { type: [string, 'null'], format: uuid }
              roomNo: { type: [string, 'null'] }
              fromDate: { $ref: '#/components/schemas/LocalDate' }
              toDate: { $ref: '#/components/schemas/LocalDate' }
        arrivalDate: { $ref: '#/components/schemas/LocalDate' }
        departureDate: { $ref: '#/components/schemas/LocalDate' }
        nights: { type: integer }
        adults: { type: integer }
        children6to11: { type: integer }
        childrenUnder6: { type: integer }
        partyMissingCount: { type: integer, description: 'Số người còn thiếu so với số khách (US-022 AC1)' }
        extraGuestCount:
          type: integer
          minimum: 0
          description: |
            Số người vượt định mức của căn đang gán = max(0, `adults` + `children6to11` − `Room.baseOccupancy`) (BR-110, ESC-014; hiện tối đa 1).
            > 0 → UI hiện "Có {n} người ngủ sofa – buồng phòng chuẩn bị bộ đồ dùng thêm" và trạng thái việc HK `extra_guest_kit_*` (BR-812). Đơn chưa gán căn: 0. 0.3.1
        etaTime: { $ref: '#/components/schemas/LocalTime' }
        agreedCheckoutTime: { $ref: '#/components/schemas/LocalTime' }
        actualCheckinAt: { $ref: '#/components/schemas/Instant' }
        actualCheckoutAt: { $ref: '#/components/schemas/Instant' }
        hold:
          type: object
          properties:
            hours: { type: integer }
            expiresAt: { $ref: '#/components/schemas/Instant' }
            extendedCount: { type: integer }
        depositRequiredVnd:
          $ref: '#/components/schemas/MoneyVnd'
          description: |
            **0.3.7 bổ sung 4 (S4-38, BR-309-11 v0.3.8 – ghi rõ, không thêm trường)**: một giá trị lưu (`reservation.deposit_required_vnd`), **hai nghĩa theo trạng thái**:
            (1) đơn `hold` – **cọc phải thu để xác nhận** (BR-305: % cọc × tiền phòng, làm tròn) – Desk hiện "còn thiếu cọc" = `depositRequiredVnd − depositPaidVnd` và đòi khách;
            (2) từ `confirmed` trở đi – **cơ sở phí hủy/no-show** (BR-309, BR-311): tính lại **mỗi khi tiền phòng đổi** – B7/B8 và sửa giá đêm S4-35 (BUG-R2-128, BE-A) – = % cọc × tiền phòng
            **hiện hành** (giảm khi còn < 7 ngày và khách tự xin → giữ mức
            cũ); phí giữ = min(cọc đã thu, giá trị này, giá trị đơn). Desk **không** đòi cọc bổ sung khi giá trị này > `depositPaidVnd` ở đơn đã xác nhận (BR-429: không đòi cọc thêm khi đổi
            căn/ngày) – không hiện "còn thiếu cọc". Số dùng cho phí hủy hiện ở `CancellationQuote` (`retainedVnd`).
          x-visible-to: [owner, manager, front_desk_lead, front_desk, sales_staff, collaborator]
        nightlyRates:
          type: array
          x-visible-to: [owner, manager, front_desk_lead, front_desk, sales_staff]
          items: { $ref: '#/components/schemas/NightRate' }
        totalRoomVnd:
          $ref: '#/components/schemas/MoneyVnd'
          x-visible-to: [owner, manager, front_desk_lead, front_desk, sales_staff, collaborator]
        balanceDueVnd:
          $ref: '#/components/schemas/MoneyVnd'
          x-visible-to: [owner, manager, front_desk_lead, front_desk, sales_staff]
          description: |
            0.3.7 bổ sung 4 (BUG-R2-101, ARC 18/10): = `Folio.totals.balanceDueVnd` – còn phải thu **trên các dòng đã ghi folio** (Σ dòng `posted` − đã thu ròng, tối thiểu 0); không phải
            số dự kiến của đơn. **Vắng** khi folio của đơn chưa có dòng `posted` nào (đơn `hold` – dòng tiền phòng chỉ ghi khi xác nhận; đơn hủy/hết hạn trước khi xác nhận): Desk **không**
            hiện "Còn phải thu" mà hiện "Cọc cần thu" = `depositRequiredVnd − depositPaidVnd` (khi > 0) và "Tiền phòng" `totalRoomVnd`. Có số (kể cả 0) = đã có dòng folio
        conflictState: { $ref: '#/components/schemas/ConflictState' }
        registrationId: { $ref: '#/components/schemas/Uuid' }
        registrationStatus: { $ref: '#/components/schemas/RegistrationStatus' }
        registrationDeadlineAt: { $ref: '#/components/schemas/Instant' }
        progress:
          type: array
          description: 'Tiến trình theo loại đơn (US-020 AC1)'
          items:
            type: object
            required: [step, done]
            properties:
              step: { type: string, enum: [hold, deposit, confirmed, checked_in, checked_out, contract, first_period] }
              done: { type: boolean }
              at: { $ref: '#/components/schemas/Instant' }
        cancellation:
          type: object
          properties:
            cancelledAt: { $ref: '#/components/schemas/Instant' }
            reasonCode: { $ref: '#/components/schemas/CancelReasonCode' }
            note: { type: string }
        internalNote:
          x-rbac-field: D12c
          type: string
          x-visible-to: [owner, manager, front_desk_lead, front_desk]
        cardsIssued:
          type: [integer, 'null']
          description: 'Số thẻ phòng đã phát lúc nhận phòng (BR-511) – gợi ý số lượng phí thiếu thẻ khi trả phòng; null trước B9 (0.3.3, E03-04)'
          x-visible-to: [owner, manager, front_desk_lead, front_desk]
        houseRulesSentAt:
          type: [string, 'null']
          format: date-time
          description: 'Thời điểm lễ tân xác nhận đã gửi/giao nội quy (BR-511) – điều kiện thu phí phạt; null = chưa (0.3.3, E03-04)'
          x-visible-to: [owner, manager, front_desk_lead, front_desk]
        doorAccessHandedOverAt:
          type: [string, 'null']
          format: date-time
          description: 'Lễ tân tick "đã giao mã/thẻ" lúc nhận phòng (R2, không lưu mã cửa) – 0.3.3, đề nghị UXD, chờ PO'
          x-visible-to: [owner, manager, front_desk_lead, front_desk]
        noShowAvailableFrom:
          type: [string, 'null']
          format: date-time
          description: |
            Đơn `confirmed` có ngày đến ≤ ngày nghiệp vụ và chưa nhận phòng: thời điểm sớm nhất được đánh dấu không đến (`no_show_mark_time` của ngày đến, BR-311);
            `null` với trạng thái/ngày khác. `allowedActions` chỉ có `mark_no_show` khi giờ server ≥ mốc này – client **không** tự so giờ máy với tham số. 0.3.5 (A-04)
          x-visible-to: [owner, manager, front_desk_lead, front_desk]
        depositPaidVnd:
          $ref: '#/components/schemas/MoneyVnd'
          description: 'Tổng cọc `succeeded` của đơn (BR-305) – còn thiếu = `depositRequiredVnd − depositPaidVnd` khi > 0. 0.3.5 (A-13). **0.3.7 bổ sung 4**: "còn thiếu" chỉ có nghĩa khi đơn `hold` (xem `depositRequiredVnd`)'
          x-visible-to: [owner, manager, front_desk_lead, front_desk, sales_staff, collaborator]
        depositNotices:
          type: array
          x-visible-to: [owner, manager, front_desk_lead, front_desk, sales_staff, collaborator]
          description: |
            **0.3.7 bổ sung 1 (FE-B s4 mục 5 – BUG-R2-081, US-086 AC4)**: các báo "khách đã chuyển cọc" của đơn (`createDepositNotice`, A53), mới nhất trước. Tối đa **một** bản `open`
            (báo lại khi còn `open` = cập nhật bản đó – SEC-BE-28 (3)); bản `handled` (B4 đã xác nhận) giữ lại để đối chiếu. Desk hiện bản `open` trong hộp "Xác nhận cọc" (H11):
            số tiền, giờ báo, ghi chú, ảnh. **Người thấy**: FD+; SAL/CTV chỉ với đơn của mình (phạm vi `own` của `getReservation`) và **không** nhận `note` (D12c) và
            `createdByName` (D27) – rbac mục 6. Server trả ở `getReservation`; phản hồi khác dùng schema `Reservation` (sau hành động) có thể vắng trường này – client đọc lại bằng
            `getReservation`. Vắng hoặc rỗng = chưa có báo. Ảnh xem bằng `getAttachment` (`deposit_receipt` – FD+ và người tải). `amountVnd` là số **người báo khai**, chưa phải
            tiền đã nhận (đã nhận = `depositPaidVnd`, sau B4).
          items:
            type: object
            required: [id, amountVnd, createdAt, status]
            properties:
              id: { $ref: '#/components/schemas/Uuid' }
              amountVnd: { $ref: '#/components/schemas/MoneyVnd', description: 'Số tiền người báo khai (lần báo gần nhất) – chưa đối chiếu sao kê' }
              note:
                type: [string, 'null']
                maxLength: 500
                description: 'Ghi chú của người báo (V-09 khi ghi)'
                x-rbac-field: D12c
                x-visible-to: [owner, manager, front_desk_lead, front_desk]
              attachmentId:
                type: [string, 'null']
                format: uuid
                description: 'Ảnh biên nhận (`uploadAttachment purpose=deposit_receipt`); `null` = báo không kèm ảnh'
              createdAt: { $ref: '#/components/schemas/Instant', description: 'Lúc báo lần đầu' }
              updatedAt: { $ref: '#/components/schemas/Instant', description: 'Lúc báo/cập nhật gần nhất (= `createdAt` khi chưa báo lại) – Desk hiện giờ này cạnh số tiền' }
              createdByName:
                type: string
                description: 'Tên hiển thị người báo (CTV/sale)'
                x-rbac-field: D27
                x-visible-to: [owner, manager, front_desk_lead, front_desk]
              status: { type: string, enum: [open, handled], description: '`open` = chờ FD/SAL xác nhận cọc (B4); `handled` = B4 đã xác nhận (erd `deposit_notice.status`)' }
        depositShortfall:
          type: [object, 'null']
          description: |
            MGR+ đã chấp nhận xác nhận đơn với cọc thiếu (`confirmDeposit.acceptShortfallReason`, B-29 / DOM BE-11) – đọc từ cột `reservation.deposit_shortfall_*` (0040).
            `null` khi chưa từng chấp nhận. Màn nhận phòng hiện câu `ci.shortfall_accepted`. 0.3.6 bổ sung (review S3, đề nghị FE s3 mục 5 c)
          required: [shortfallVnd, acceptedAt, acceptedByName, reason]
          properties:
            shortfallVnd: { $ref: '#/components/schemas/MoneyVnd' }
            acceptedAt: { $ref: '#/components/schemas/Instant' }
            acceptedByName: { type: string, description: 'Tên hiển thị người chấp nhận (MGR/OWN)' }
            reason: { type: string, minLength: 3, maxLength: 500 }
          x-visible-to: [owner, manager, front_desk_lead, front_desk]
        otaGuestCount:
          type: [integer, 'null']
          minimum: 1
          description: |
            0.3.6 bổ sung 4 (DOM luật OTA 17/10, ARC) (BR-110/BR-307): số khách tính (người lớn + trẻ 6–11) OTA đã tính giá – lấy lúc nhập đơn OTA, chỉ đổi qua `partyChangeSource = ota_modification`.
            Người vượt max(định mức căn, `otaGuestCount`) mới bị phụ thu (thu tại quầy, không thuộc "Đã thu qua OTA"). `null` với đơn kênh khác.
          x-visible-to: [owner, manager, front_desk_lead, front_desk, sales_staff]
        requestedRoomGroupId:
          $ref: '#/components/schemas/Uuid'
          description: |
            Đơn `conflictState=open` (chưa gán căn): nhóm căn đơn yêu cầu = nhóm của `overbooking_incident.requested_room_id` (căn kênh OTA ánh xạ, hoặc căn cũ khi khôi phục
            no-show – D-3 b). Null khi đơn đã gán căn. Gán căn cùng nhóm → `overbookingResolution=reassigned_same_group`, nhóm cao hơn → `upgraded` (FDL+). 0.3.5 (A-25)
          x-visible-to: [owner, manager, front_desk_lead, front_desk]
        requestedRoomGroupCode:
          type: string
          description: 'Mã nhóm của `requestedRoomGroupId`. 0.3.5 (A-25)'
          x-visible-to: [owner, manager, front_desk_lead, front_desk]
        capacityConflict:
          type: boolean
          description: |
            Đơn OTA nhận với số khách > sức chứa căn (DOM D-1). Tự về `false` khi số khách ≤ `maxOccupancy` của căn đang gán (đổi căn B7, sửa số khách sau khi
            liên hệ khách). `true` → chặn nhận phòng (`CheckInPreview.conditions` `capacity_within_max`), mục "Cần chú ý" `capacity_conflict`. 0.3.5 (A-20)
          x-visible-to: [owner, manager, front_desk_lead, front_desk]
        roomDisclosedToGuest:
          type: boolean
          description: |
            0.3.7 bổ sung D1 (BR-012 (4), BR-429): khách **đã được báo căn cụ thể** chưa. `false` = đơn bán theo nhóm/hạng mà chưa báo căn (đơn OTA tự gán theo nhóm – BR-316 (2),
            đơn xung đột vừa gán B7a) → chữ khách nhìn thấy trước khi nhận phòng dùng **hạng phòng** (`GuestStay.roomName = null`, `publicRoomType`); `moveReservation`
            `reasonCode = inventory_optimize` **chỉ** được khi `false` (khác → 422 `NOT_IN_LIST`, `field` = `reasonCode`). Server đặt `true` khi: tạo đơn Trực tiếp/CTV (khách chọn căn – BR-101),
            đơn OTA căn ánh xạ từng căn (BR-316 (1)), B7 `guest_request` sang căn khách chọn, lễ tân bật bằng `updateReservation` (đã báo qua OA/OTA), nhận phòng B9. Không bao giờ tự về `false`
            [GIẢ ĐỊNH ARC – DOM xác nhận các mốc đặt `true`]
          x-visible-to: [owner, manager, front_desk_lead, front_desk]
        allowedActions: { type: array, items: { $ref: '#/components/schemas/AllowedAction' } }
        availableOperations:
          type: array
          description: |
            0.3.7 (nháp B-2, FE): thao tác **ngoài máy trạng thái** người gọi làm được với đơn lúc này (server tính theo vai × trạng thái × thiết bị) – khác `allowedActions`
            (chỉ chuyển SM-01). Client ẩn/khóa nút theo danh sách; server vẫn kiểm khi ghi.
          items:
            type: string
            enum: [updateReservation.doorAccessHandedOver, addFolioLine, recordCheckoutConfirmation, addPartyMember, removePartyMember]
        version: { type: integer }
    ReservationCreate:
      type: object
      required: [roomId, channelId, arrivalDate, departureDate, adults, bookerGuestId, paymentModel]
      properties:
        roomId: { $ref: '#/components/schemas/Uuid' }
        channelId: { $ref: '#/components/schemas/Uuid' }
        arrivalDate: { $ref: '#/components/schemas/LocalDate' }
        departureDate: { $ref: '#/components/schemas/LocalDate' }
        adults: { type: integer, minimum: 1 }
        children6to11: { type: integer, minimum: 0, default: 0 }
        childrenUnder6: { type: integer, minimum: 0, default: 0 }
        bookerGuestId: { $ref: '#/components/schemas/Uuid' }
        closerUserId: { $ref: '#/components/schemas/Uuid' }
        otaRef: { type: string, maxLength: 64, description: 'Bắt buộc khi channel.requiresOtaRef', x-rbac-field: D19 }
        paymentModel: { type: string, enum: [direct, ota_prepaid, ota_pay_at_property] }
        nightlyRates:
          type: array
          description: |
            Bỏ trống = giá mặc định (US-017 AC3). Kênh `direct`/`agent`: ngoài sàn–trần BR-105 → `422 RATE_OUT_OF_RANGE` (chặn).
            Kênh `ota`: ngoài sàn–trần mà thiếu `rateOverrideReason` → `422 VALIDATION_FAILED` mã trường `RATE_OUT_OF_RANGE_WARNING`
            (client hiện cảnh báo + ô lý do, gửi lại kèm lý do thì lưu) – 0.3.1.
          items: { $ref: '#/components/schemas/NightRate' }
        rateOverrideReason:
          type: string
          minLength: 3
          maxLength: 500
          description: 'Lý do giá đêm ngoài sàn–trần cho đơn kênh `ota` (US-017 AC3; V-08, V-09). Ghi vào `audit_event` + nhật ký giá của đơn. Kênh khác → bỏ qua. 0.3.1'
          x-rbac-field: D12c
        minStayOverrideReason:
          type: string
          minLength: 3
          maxLength: 500
          description: 'FDL+ bỏ qua ở tối thiểu BR-113 cho đơn kênh `direct` (đặc tả BA EP02 3.2 (b)); thiếu khi vi phạm → mã trường `MIN_STAY_NOT_MET`; FD gửi → `403 FORBIDDEN_ACTION`. 0.3.1'
          x-rbac-field: D12c
        capacityWarningAckReason:
          type: string
          minLength: 3
          maxLength: 500
          description: |
            Chỉ kênh `ota` (DOM D-1, BR-312 (1) không từ chối đơn OTA đã về): số khách tính > `maxOccupancy` của căn mà thiếu trường này → `422` mã trường
            `CAPACITY_EXCEEDED_WARNING` (+ `roomNo`, `max`); có lý do → lưu, `Reservation.capacityConflict=true`, "Cần chú ý" `capacity_conflict`, chặn nhận phòng
            (`capacity_within_max`). Kênh khác gửi → bỏ qua (vẫn `CAPACITY_EXCEEDED`). 0.3.5 (A-20)
          x-rbac-field: D12c
        directSource:
          type: string
          enum: [website, zalo_phone, walk_in, returning, sales_staff]
          description: |
            Nguồn của đơn kênh nhóm `direct` (US-017 AC8; erd `reservation.direct_source`): Website · Zalo/điện thoại · Khách vãng lai · Khách quay lại ·
            Sale nội bộ (metrics Q-11). **Bắt buộc** khi kênh thuộc nhóm `direct` (`REQUIRED`); kênh khác gửi → `DIRECT_SOURCE_NOT_ALLOWED`. 0.3.1
            0.3.5 (A-08): danh mục kênh chỉ có **một** kênh nhóm `direct` (mã `direct`) – nguồn không còn mô hình bằng 5 kênh riêng.
        websiteBookingRequestId:
          $ref: '#/components/schemas/Uuid'
          description: |
            0.3.7 bổ sung 2 (US-155 AC2 – contract-ahead, cài cùng US-155): FD+ tạo đơn đảm bảo (B2) cho yêu cầu từ website khi khách đã chốt và cọc. Kênh phải là `direct`;
            `directSource` vắng hoặc `website` (khác → 422 `NOT_ALLOWED`, `field` = `directSource`); yêu cầu `new`/`in_progress` trong phạm vi (khác → 404 / 409 `INVALID_TRANSITION`).
            Cùng giao dịch: `directSource = website`, `directSubSource` của yêu cầu, yêu cầu → `converted` + xóa C2. Trong `rooms[]` của đơn nhóm (R3) → 422 `NOT_ALLOWED`.
            **Phản hồi BA Q-W05 (DOM v0.3.8)**: đi được **cùng** `manualLongStay` – khách ở dài từ form chốt bằng HĐ giấy (US-017 AC5a, báo giá dài hạn US-081 là R3) → đơn dài hạn nhập tay
            nguồn `website` + nguồn phụ, yêu cầu `converted`. Quy tắc WR6 theo người gọi như `createHoldFromQuote` (FD+ luôn được).
        otaRoomAmountVnd: { $ref: '#/components/schemas/MoneyVnd' }
        otaChannelFeeVnd: { $ref: '#/components/schemas/MoneyVnd' }
        otaBookedAt:
          $ref: '#/components/schemas/Instant'
          description: Lúc khách đặt trên OTA (lead time đúng cho đơn OTA – DATA FB-05); R2 nhập tay, R3 lấy từ channel manager
        allowUnassigned:
          type: boolean
          default: false
          description: Chỉ kênh OTA – tạo đơn chưa gán căn sau khi đã nhận 409 kèm gợi ý và không còn căn phù hợp (decision-log PO 15/10)
        guestEmail:
          x-rbac-field: D02
          type: string
          format: email
          description: '`booker.email` – ô email **không bắt buộc** ở form đặt phòng mới (phân xử ORC 15/10, SR-GST-14) để gửi OTP mức 2; lưu vào hồ sơ khách người đứng tên. Trống → UI nhãn "Đơn chưa có email – khách cần mã xác minh từ lễ tân"'
        etaTime: { $ref: '#/components/schemas/LocalTime' }
        initialPayment:
          $ref: '#/components/schemas/PaymentCreate'
          description: |
            0.3.7 bổ sung 4 (S4-13, ARC 16.23 – hướng (B)): **không** nhận `attachmentId` – ảnh `deposit_receipt` cần `reservationId`, đơn chưa tồn tại lúc B2 → gửi kèm: 422 `NOT_ALLOWED`
            (`field` = `initialPayment.attachmentId`). Bằng chứng chuyển khoản lúc tạo đơn: mã giao dịch ngân hàng trong `note` (BR-527 "ảnh **hoặc** mã giao dịch"). Cần ảnh: sau khi tạo
            đơn – SAL/CTV dùng `createDepositNotice` (ảnh của đơn); FD+ ghi khoản bằng `recordPayment` kèm `attachmentId` thay cho `initialPayment`.
        internalNote: { type: string, maxLength: 1000, x-rbac-field: D12c }
        manualLongStay: { $ref: '#/components/schemas/ManualLongStayInput' }
    ManualLongStayInput:
      type: object
      required: [monthlyRentVnd]
      description: |
        **US-017 AC5a – tạm cho R2 (R-C, plan R2 P-R2-3; bỏ khi US-081/US-086 AC3 xong ở R3).** Có thuộc tính này → server tạo
        **đơn dài hạn nhập tay**: `stayType=long`, `paymentModel=direct`, trạng thái `confirmed` (B2), cờ `externalContract=true`
        ("HĐ ngoài hệ thống – chuyển vào app ở R3"), chiếm `room_occupancy` như mọi đơn (EXCLUDE ADR-009 → `409 ROOM_UNAVAILABLE` khi trùng),
        hiện trên rack kiểu đơn dài hạn (US-016 AC2). **Không** sinh hợp đồng, lịch kỳ thu, `stay_night` giá theo đêm hay hoa hồng;
        thu tiền ghi bằng `recordPayment` không gắn `billingPeriodId` (US-119 AC1). Chỉ hợp lệ khi số đêm đạt ngưỡng BR-108
        (dưới ngưỡng → `422 VALIDATION_FAILED` mã trường `MANUAL_LONG_STAY_BELOW_THRESHOLD`); không kèm `nightlyRates`, `otaRoomAmountVnd`,
        `allowUnassigned` (→ `422`). R3 chuyển sang HĐ đầy đủ **giữ nguyên `reservation_id` và mã đơn** (rủi ro R2-7).
      properties:
        monthlyRentVnd: { $ref: '#/components/schemas/MoneyVnd' }
        externalContractRef: { type: string, maxLength: 64, description: 'Số HĐ giấy/ngoài hệ thống (nếu có)' }
        depositHeldVnd:
          $ref: '#/components/schemas/MoneyVnd'
          description: 'Ký quỹ đã giữ ngoài hệ thống – chỉ để hiển thị/chuyển đổi R3, không tạo giao dịch'
        note: { type: string, maxLength: 500, x-rbac-field: D12c }
    ReservationPatch:
      type: object
      properties:
        capacityWarningAckReason:
          type: string
          minLength: 3
          maxLength: 500
          description: 'Đơn OTA: sửa số khách vượt `maxOccupancy` của căn → thiếu lý do: 422 mã trường `CAPACITY_EXCEEDED_WARNING` (`field` = `adults`); có lý do → lưu, `capacityConflict=true` (DOM D-1). 0.3.5'
          x-rbac-field: D12c
        adults: { type: integer, minimum: 1 }
        children6to11: { type: integer, minimum: 0 }
        childrenUnder6: { type: integer, minimum: 0 }
        partyChangeSource:
          type: string
          enum: [ota_modification, guest_direct]
          description: |
            0.3.6 bổ sung 4 (DOM luật OTA 17/10, ARC) (BR-110/BR-307 v0.3.4): **bắt buộc** khi đổi `adults`/`children6to11`/`childrenUnder6` của đơn kênh `ota` trước nhận phòng (`hold`/`confirmed`);
            thiếu → 422 `REQUIRED` (`field` = `partyChangeSource`). Client chọn sẵn `guest_direct` (mặc định khi không có bằng chứng).
            `ota_modification` = OTA đã sửa đơn (bắt buộc `otaModificationRef`) → cập nhật `otaGuestCount`, **không** phụ thu người.
            `guest_direct` = khách báo trực tiếp với OTTIMO → giữ `otaGuestCount`, phụ thu người vượt max(định mức căn, `otaGuestCount`) theo BR-110, thu tại quầy.
            Đơn kênh khác gửi → 422 `NOT_ALLOWED`. Khi đang ở (`in_house`) đổi người đi qua `addPartyMember`/`removePartyMember` (`effectiveFrom`) – luôn như `guest_direct`.
        otaModificationRef:
          type: string
          minLength: 3
          maxLength: 64
          pattern: '^[A-Za-z0-9\-/._]+$'
          description: '0.3.6 bổ sung 4 (DOM luật OTA 17/10, ARC): mã sửa đơn / mã xác nhận mới trên extranet (bằng chứng) – bắt buộc khi `partyChangeSource = ota_modification` (thiếu → 422 `REQUIRED`); lưu vào lịch sử đơn + audit'
        doorAccessHandedOver:
          type: boolean
          enum: [true]
          description: |
            0.3.6 (B-28, US-025 AC7): tick bổ sung "Đã giao mã cửa/thẻ" từ chi tiết đơn. Chỉ nhận `true`; FD+; đơn `in_house`; đặt **một lần**
            (đã có → `409 INVALID_TRANSITION` + `currentState`). Ghi `door_access_handed_over_at/_by` + audit `state`. Không lưu, không hiện mã cửa.
        roomDisclosedToGuest:
          type: boolean
          enum: [true]
          description: |
            0.3.7 bổ sung D1 (BR-012 (4)): lễ tân đánh dấu "đã báo căn cho khách" (qua OA/hội thoại OTA) – từ đây chữ khách thấy dùng tên phòng. Chỉ nhận `true` (một chiều); FD+;
            đơn `hold`/`confirmed`. Đã `true` → 200 không đổi gì. Audit `state` `reservation.room_disclosed`.
        roomReturnRecorded:
          type: boolean
          enum: [true]
          description: |
            0.3.7 bổ sung D1 (S4-09 – NÊN, BE-A; BR-424 v0.3.6): ghi "khách đã chuyển về căn cũ" ngày về của lượt `changeRoom.stayScope = until_parent_departure`. Chỉ đơn **con** `in_house`
            có ngày đến = ngày nghiệp vụ và đoạn trước ở căn khác (khác → 409 `INVALID_TRANSITION` + `currentState`); FD+; một lần. Cùng giao dịch: căn của đơn gốc → `VD` + việc
            `checkout_clean`; căn cũ → `OC`; audit `state` `reservation.room_returned`; SSE `room.status_changed`.
        etaTime: { $ref: '#/components/schemas/LocalTime' }
        closerUserId: { $ref: '#/components/schemas/Uuid' }
        internalNote: { type: string, maxLength: 1000, x-rbac-field: D12c }
        visaWarningAckReason:
          type: string
          minLength: 3
          maxLength: 500
          description: 'Như `extendStay` – khi sửa làm hạn thị thực của khách NN < ngày đi (US-050 AC2); thiếu → 422 cảnh báo `VISA_EXPIRES_BEFORE_DEPARTURE` (0.3.3)'
    CancellationQuote:
      type: object
      required: [refundableVnd, retainedVnd]
      properties:
        depositPaidVnd: { $ref: '#/components/schemas/MoneyVnd' }
        refundableVnd: { $ref: '#/components/schemas/MoneyVnd' }
        retainedVnd: { $ref: '#/components/schemas/MoneyVnd', description: 'Ghi "phí hủy" – doanh thu khác' }
        otaPenaltyVnd: { $ref: '#/components/schemas/MoneyVnd', description: 'Đơn OTA: tiền phạt theo kênh do lễ tân nhập (BR-310); không có ở đơn kênh khác. 0.3.1' }
        policyRef: { type: string, example: BR-309 }
        refundApprovalRequestId: { $ref: '#/components/schemas/Uuid', description: 'Yêu cầu `refund` tự tạo (hoặc đã mở và được cập nhật số) – vắng khi không có tiền hoàn; vắng ở `dryRun`' }
        refundRequestVnd:
          $ref: '#/components/schemas/MoneyVnd'
          description: |
            0.3.7 bổ sung D1 (S4-06, BR-522; BR-309): số của yêu cầu hoàn tự tạo = số dư thừa của folio **sau** khi ghi phí hủy và đảo dòng dịch vụ không giữ – gồm phần cọc được hoàn
            (`refundableVnd`) và tiền khác khách đã trả (ví dụ phụ thu trả tại quầy), **không** gồm tiền OTA thu hộ. 0 → không tạo yêu cầu
        serviceLines:
          type: array
          description: |
            0.3.7 bổ sung D1 (S4-08, BR-309 v0.3.4 – áp cả no-show): dòng dịch vụ `posted`, chưa đảo, của folio – `category` ∈ `early_checkin`, `late_checkout`, `minibar`, `fnb`, `laundry`,
            `cleaning`, `service_fee`, `utilities` (dòng FOC/giảm giá đi kèm theo dòng gốc). Mặc định **tự đảo** trong giao dịch hủy; dòng có trong `retainLines` được **giữ**. `performed` là
            gợi ý của server, không chặn lựa chọn. Rỗng = không có dòng dịch vụ.
          items:
            type: object
            required: [lineId, category, amountVnd, performed, retained]
            properties:
              lineId: { $ref: '#/components/schemas/Uuid' }
              category: { $ref: '#/components/schemas/FolioLineCategory' }
              labelKey: { type: string, pattern: '^bill\.line\.[a-z_]+$' }
              labelParams: { type: object, additionalProperties: { type: [string, number] } }
              serviceDate: { $ref: '#/components/schemas/LocalDate' }
              amountVnd: { $ref: '#/components/schemas/MoneyVnd', description: 'Giá trị ròng của dòng (sau FOC/giảm giá đã duyệt đi kèm). **0.3.7 bổ sung 3 (BE-B (h), DOM-S4-15)**: dòng **giữ** (`retained = true`) = số khách chịu sau khi đóng đơn – FOC trên dòng giữ không còn áp (hủy → `cancelled`; no-show → `suspended`)' }
              performed: { type: boolean, description: 'Server tính (gợi ý): **hủy** – ngày dịch vụ < ngày nghiệp vụ lúc hủy (BR-010); **no-show** – ngày dịch vụ ≤ ngày nghiệp vụ (0.3.7 bổ sung 3, DOM-S4-12, BR-309-09); hoặc dòng đã đánh dấu đã dùng; `false` = chưa thực hiện' }
              retained: { type: boolean, description: 'Theo `retainLines` của request (cả `dryRun`): `true` = giữ, không đảo' }
              retainReason: { type: string, description: 'Lý do lễ tân nhập khi `retained`' }
        serviceReversedVnd: { $ref: '#/components/schemas/MoneyVnd', description: '0.3.7 bổ sung D1 (S4-08): tổng dòng dịch vụ sẽ/đã đảo' }
        serviceRetainedVnd: { $ref: '#/components/schemas/MoneyVnd', description: '0.3.7 bổ sung D1 (S4-08): tổng dòng dịch vụ giữ' }
    CheckInPreview:
      type: object
      required: [checkinTime, standardCheckinTime, roomStatus, conditions]
      properties:
        checkinTime: { $ref: '#/components/schemas/LocalTime' }
        standardCheckinTime: { $ref: '#/components/schemas/LocalTime' }
        roomStatus: { $ref: '#/components/schemas/RoomStatusCode' }
        conditions:
          type: array
          items:
            type: object
            required: [code, met]
            properties:
              code:
                type: string
                enum: [room_ready, balance_paid, main_guest_document, not_unassigned, document_check_block, capacity_within_max]
                description: '`document_check_block` (0.3.3, E03-01): đạt khi `Registration.blocksDoorCode=false` (BR-613 c); `overridableBy` = FDL+ qua `checkIn.documentBlockOverride`. `capacity_within_max` (0.3.5, DOM D-1): đạt khi `capacityConflict=false`; không ai bỏ qua được (đổi căn hoặc sửa số khách)'
              met: { type: boolean }
              detail: { type: string }
              overridableBy: { type: array, items: { $ref: '#/components/schemas/Role' } }
        warnings:
          type: array
          description: 'Cảnh báo **không chặn** (hiện vàng) – 0.3.3, E03-01. Tập mở: client gặp mã lạ thì bỏ qua'
          items:
            type: object
            required: [code]
            properties:
              code:
                type: string
                enum: [extra_guest_kit_not_ready, visa_expires_before_departure, passport_expires_during_stay, pending_online_checkin, inspection_failed]
                description: '`extra_guest_kit_not_ready` – việc chuẩn bị bộ đồ dùng thêm chưa xong (BR-812, B9 sẽ đẩy việc lên đầu hàng đợi); `visa_expires_before_departure` – BR-613 a (khai đến hạn thị thực); `passport_expires_during_stay` – BR-613 b; `pending_online_checkin` – khách đã gửi giấy tờ qua app, cần đối chiếu bản gốc; `inspection_failed` (0.3.7, BA E07-17) – lần kiểm phòng gần nhất của căn chưa đạt (`VC` vẫn nhận được – BR-803), `detail` = mã các mục không đạt'
              detail: { type: string }
        priorNight:
          type: object
          description: 'Chỉ khi `earlyCheckinSurcharge.addsPreviousNight=true` (B9a, BR-417) – 0.3.3, E03-05'
          properties:
            date: { $ref: '#/components/schemas/LocalDate' }
            available: { type: boolean, description: 'Căn trống đêm trước và không có OOO (BR-906)' }
            defaultRateVnd: { $ref: '#/components/schemas/MoneyVnd', description: 'Vòng sửa 5: giá bước 4 của BR-417 phụ lục 5A cho đêm B9a (đêm tham chiếu = đêm nhập tay sớm nhất sau `date`, AN-32)' }
            floorVnd: { $ref: '#/components/schemas/MoneyVnd', description: 'Vòng sửa 5 – khoảng Desk bước 4 phụ lục 5A (min áp → sàn thấp hơn của hai căn)' }
            ceilingVnd: { $ref: '#/components/schemas/MoneyVnd', description: 'Vòng sửa 5 – khoảng Desk bước 4 phụ lục 5A (min áp → trần cao hơn của hai căn)' }
            createsChildReservation: { type: boolean, description: 'Đơn OTA → đơn con kênh Trực tiếp (BR-422)' }
        earlyCheckinSurcharge:
          type: object
          properties:
            tierPct: { $ref: '#/components/schemas/Percent' }
            baseNightVnd: { $ref: '#/components/schemas/MoneyVnd' }
            amountVnd: { $ref: '#/components/schemas/MoneyVnd' }
            addsPreviousNight: { type: boolean, description: 'Nhận trước mốc đổi ngày (BR-010) → B9a thêm đêm trước (`checkIn.addPriorNight`); tiền đêm là tiền phòng, không phải phụ thu (0.3.3 sửa mô tả)' }
            ruleRef: { type: string }
        registrationDeadlinePreview: { $ref: '#/components/schemas/Instant' }
        balanceDueVnd:
          $ref: '#/components/schemas/MoneyVnd'
          description: '0.3.7 (BUG-R2-038): còn phải thu hiện tại của folio, trước phụ thu nhận sớm / đêm B9a sắp ghi'
        amountDueAtCheckinVnd:
          $ref: '#/components/schemas/MoneyVnd'
          description: |
            0.3.7 (BUG-R2-038, s3-contract 7.7): số phải thu để đạt `balance_paid` nếu nhận phòng theo `checkinTime` đang xem = `balanceDueVnd` + phụ thu nhận sớm sẽ ghi
            (`earlyCheckinSurcharge.amountVnd`) + tiền đêm B9a (`priorNight.defaultRateVnd` khi `addsPreviousNight`) − Σ min(số xin, dòng) của FOC **chờ duyệt trên khoản phát sinh**
            (BR-402 v0.3.6 – không trừ FOC/giảm giá chờ duyệt trên tiền phòng). Đơn `ota_prepaid`: chỉ khoản tại quầy. Client hiện ở bước thu
            tiền H13 và điền sẵn `checkIn.payment.amountVnd`. Là trần của `checkIn.payment` và `createVietQr purpose=check_in`.
            **0.3.7 bổ sung 4 (S4-38, BR-417-04…06 – thay câu "lễ tân sửa giá đêm B9a → client cộng chênh")**: server tính **đủ** bằng cùng một hàm cho xem trước, trần QR `check_in` và
            lệnh B9: bậc giảm BR-107 tính lại trên **tổng số đêm gồm đêm B9a** (áp mọi đêm), giá mặc định của đêm B9a theo lịch **của chính đêm đó**, phụ thu người vượt định mức của đêm B9a
            (BR-110), FOC chờ duyệt như trên, rồi trừ tiền thừa (`creditVnd`) và kẹp 0 **một lần** ở cuối. Giá đêm B9a lễ tân **gõ khác mặc định**: client **không** tự cộng chênh – số đúng
            là trần `createVietQr purpose=check_in` gửi kèm `priorNightRateVnd` (cùng hàm, tính lại cả bậc và tiền thừa) và trần `checkIn.payment` (vượt → 422 `AMOUNT_EXCEEDS_BALANCE`, `max`).
            Bằng 0 → không tạo QR (BR-417-06). **BUG-R2-127 (bổ sung 4)**: tiền đêm B9a **chỉ** cộng khi `priorNight.available = true`; đêm trước không trống (có khách/OOO) → số này không
            gồm đêm B9a, Desk không mời B9a (đọc `priorNight.available`); `createVietQr purpose=check_in` gửi `addPriorNight` khi đó → 422 `NOT_ALLOWED` (`field` = `addPriorNight`); B9 gửi
            `addPriorNight` → 409 `ROOM_UNAVAILABLE` + `suggestions[]` như cũ.
    FocRequestInput:
      type: object
      required: [kind, amountVnd, reasonCode]
      properties:
        kind: { type: string, enum: [foc, special_discount] }
        amountVnd: { $ref: '#/components/schemas/MoneyVnd' }
        reasonCode: { type: string, enum: [regular_vip, room_ready_no_impact, service_recovery, long_stay_guest, other, debt_write_off], description: '0.3.7 bổ sung 4 (R7LOCK-02, DOM 18/10 BR-525): `debt_write_off` = **xóa công nợ** sau trả phòng – chỉ `kind = foc`, chỉ OWN/MGR, `note` bắt buộc; xem `requestFoc`' }
        note: { type: string, maxLength: 500 }
        authMethod:
          type: string
          enum: [password, pin]
          description: |
            0.3.3 (BE-A, US-007 AC6, BR-436): xác nhận lại của **chính người gửi** khi yêu cầu được **tự áp** trong hạn mức của vai (FD tự áp FOC minibar).
            Bắt buộc cùng `secret` khi yêu cầu đủ điều kiện tự áp mà người gửi là FD/FDL; không gửi → yêu cầu đi luồng duyệt thường (không tự áp).
            R2 chỉ `password`; `pin` từ R3. Sai → `401 REAUTH_FAILED` (dùng chung bộ đếm với duyệt – SR-RL-02).
        secret: { type: string, writeOnly: true, minLength: 6, maxLength: 256, description: '0.3.3 – đi cùng `authMethod`' }
    ExtensionOptions:
      type: object
      required: [maxNights, nights]
      properties:
        maxNights: { type: integer }
        exceedsShortStayLimit: { type: boolean, description: 'Vượt BR-421/BR-108 → gợi ý báo giá dài hạn' }
        createsChildReservation: { type: boolean, description: 'Đơn OTA → đơn con kênh Trực tiếp (BR-422)' }
        channelFeeSavingsVnd: { $ref: '#/components/schemas/MoneyVnd', description: 'Phí kênh tiết kiệm cho **1 đêm** gia hạn (đơn OTA). 0.3.6 bổ sung 3 (QA S3, ARC 17/10): giữ để tương thích – client dùng `repricing[].channelFeeSavingsVnd` theo số đêm khách chọn (BUG-R2-045)' }
        currentBookingRateVnd:
          oneOf: [{ $ref: '#/components/schemas/MoneyVnd' }, { type: 'null' }]
          description: |
            0.3.6 bổ sung 2 (BA v0.3, ARC 17/10) (E04-07, DOM S3-6, FB-R2-DOM-BE-31): giá một đêm cùng loại ngày gần nhất của đơn khi đơn có giá thỏa thuận (nhập tay/khác lịch giá);
            client hiện nút "Giữ giá đơn" điền giá này vào `nightlyRates` (vẫn kiểm sàn–trần BR-105; ngày đặc biệt luôn giá ngày đó). `null` = đơn theo lịch giá.
            **0.3.7 bổ sung 4 (BUG-R2-132)**: giá trước bậc BR-107/BR-111 (giá lịch của đêm), không phải giá sau bậc.
            **Vòng sửa 5 – thay các đoạn BUG-R2-132/134 trước đây (BR-417 phụ lục 5A, bảng AN-01…AN-47 là nguồn duy nhất; câu chữ lệch thì bảng thắng)**:
            = giá bước 4 của đêm thêm kế tiếp khi giá đến từ **thỏa thuận hoặc min**; `null` khi giá là lịch của căn đêm thêm (không đổi căn, hoặc khách xin) – xét theo **nguồn**, không so số
            (AN-45; ví dụ AN-34 650.000, AN-10 911.000, AN-22 792.000, AN-09/AN-03 `null`). Gợi ý `nights[].defaultRateVnd` và khoảng `floorVnd`–`ceilingVnd` theo bước 4 (AN-01…AN-42).
            Xem trước B9a/B13/B18 = trần QR = lệnh ghi.
        repricing:
          type: array
          description: |
            0.3.6 (DOM D-8, A-22; UXD #4): mỗi phần tử ứng với gia hạn `nights` đêm (1…`maxNights`) – server tính lại bậc giảm BR-107 cho **mọi** đêm còn hiệu lực
            theo tổng số đêm mới; client hiển thị, không tự tính. Đơn OTA/Nội bộ/`externalContract` → `losDiscountPct` = 0.
          items:
            type: object
            required: [nights, repricedTotalVnd, losDiscountPct]
            properties:
              nights: { type: integer, minimum: 1 }
              repricedTotalVnd: { $ref: '#/components/schemas/MoneyVnd', description: 'Tổng tiền phòng cả đơn sau gia hạn (đêm cũ còn hiệu lực + đêm mới)' }
              deltaVnd: { $ref: '#/components/schemas/MoneyVnd', description: 'Chênh so với tổng hiện tại (có thể âm khi bậc giảm tăng – kiểu integer)' }
              losDiscountPct: { $ref: '#/components/schemas/Percent' }
              channelFeeSavingsVnd:
                $ref: '#/components/schemas/MoneyVnd'
                description: |
                  0.3.6 bổ sung 3 (QA S3, ARC 17/10) (BUG-R2-045): chỉ đơn OTA (`createsChildReservation = true`) – phí kênh OTA **không** phải trả vì `nights` đêm gia hạn đi kênh Trực tiếp
                  = Σ giá mặc định các đêm × tỷ lệ hoa hồng kênh OTA của đơn (làm tròn đồng, server tính). Đơn khác: vắng mặt.
        nights:
          type: array
          items:
            type: object
            required: [date, available]
            properties:
              date: { $ref: '#/components/schemas/LocalDate' }
              available: { type: boolean }
              defaultRateVnd: { $ref: '#/components/schemas/MoneyVnd', description: 'Vòng sửa 5: giá bước 4 của BR-417 phụ lục 5A (giá trước bậc)' }
              floorVnd: { $ref: '#/components/schemas/MoneyVnd', description: 'Vòng sửa 5 – khoảng Desk theo bước 4 phụ lục 5A: sàn–trần căn đêm thêm; khi quy tắc min áp = sàn thấp hơn của hai căn' }
              ceilingVnd: { $ref: '#/components/schemas/MoneyVnd', description: 'Vòng sửa 5 – trần căn đêm thêm; khi quy tắc min áp = trần cao hơn của hai căn (bước 4 phụ lục 5A)' }
    LateCheckoutResult:
      type: object
      required: [checkoutTime, surchargeVnd]
      properties:
        checkoutTime: { $ref: '#/components/schemas/LocalTime' }
        tierPct: { $ref: '#/components/schemas/Percent' }
        surchargeVnd: { $ref: '#/components/schemas/MoneyVnd' }
        treatAsExtension: { type: boolean }
        arrivalSameDay:
          type: object
          properties:
            guestDisplayName: { type: string, x-rbac-field: D01 }
            etaTime: { $ref: '#/components/schemas/LocalTime' }
            alternativeRoomAvailable: { type: boolean }
        cleaningNotBefore: { $ref: '#/components/schemas/LocalTime' }
        saved: { type: boolean }
        reservation: { $ref: '#/components/schemas/Reservation' }
    EarlyDepartureResult:
      type: object
      required: [reservation, earlyDepartureFeeVnd]
      description: '0.3.6 bổ sung 2 (BA v0.3, ARC 17/10) (E04-06) – phản hồi `earlyDeparture`'
      properties:
        reservation: { $ref: '#/components/schemas/Reservation' }
        earlyDepartureFeeVnd: { $ref: '#/components/schemas/MoneyVnd', description: 'Dòng `early_departure_fee` đã ghi (đơn OTA = `otaRetainedVnd`)' }
        refundVnd: { $ref: '#/components/schemas/MoneyVnd', description: 'Số của yêu cầu hoàn vừa tạo (0 khi không có)' }
        extraPersonRefundVnd:
          $ref: '#/components/schemas/MoneyVnd'
          description: '0.3.6 bổ sung 4 (DOM luật OTA 17/10, ARC) (BR-428 v0.3.4): phụ thu người **đã thu** của các đêm bỏ – hoàn 100 %, nằm trong **một** yêu cầu hoàn duy nhất (`refundRequestId`); với đơn OTA đây là phần duy nhất OTTIMO hoàn (tiền phòng OTA do OTA hoàn)'
        extraPersonReversedVnd:
          $ref: '#/components/schemas/MoneyVnd'
          description: '0.3.6 bổ sung 4 (DOM luật OTA 17/10, ARC): phụ thu người **chưa thu** của các đêm bỏ – chỉ đảo dòng (không sinh hoàn)'
        refundRequestId: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }], description: 'Yêu cầu `refund` vừa tạo (null khi không có số dư thừa chưa xử lý)' }
    CheckoutReminderEntry:
      type: object
      required: [at, channel]
      properties:
        at: { $ref: '#/components/schemas/Instant' }
        slot: { type: string }
        channel: { type: string }
        replyType: { type: string }
        confirmedTime: { $ref: '#/components/schemas/LocalTime' }
        note: { type: string }
        recordedBy: { type: string }
    CheckoutSummary:
      type: object
      required: [checkoutTime, lines, totalVnd, paidVnd, balanceDueVnd]
      properties:
        checkoutTime: { $ref: '#/components/schemas/LocalTime' }
        standardCheckoutTime: { $ref: '#/components/schemas/LocalTime' }
        lateCheckoutSurcharge:
          type: object
          properties:
            tierPct: { $ref: '#/components/schemas/Percent' }
            amountVnd: { $ref: '#/components/schemas/MoneyVnd' }
        lines: { type: array, items: { $ref: '#/components/schemas/FolioLine' } }
        totalVnd: { $ref: '#/components/schemas/MoneyVnd' }
        paidVnd: { $ref: '#/components/schemas/MoneyVnd' }
        balanceDueVnd: { $ref: '#/components/schemas/MoneyVnd' }
        creditVnd: { $ref: '#/components/schemas/MoneyVnd', description: 'Trả thừa → `checkOut.overpaymentHandling` bắt buộc (0.3.6, A-34)' }
        lateSurchargeRecalc:
          type: object
          description: '0.3.6 (DOM G-10, BA E05-10): phụ thu trả muộn đã ghi (`oldVnd`, theo giờ hẹn) và theo giờ trả thực tế (`newVnd`); khác nhau → B18 đảo dòng cũ, ghi dòng mới'
          properties:
            oldVnd: { $ref: '#/components/schemas/MoneyVnd' }
            newVnd: { $ref: '#/components/schemas/MoneyVnd' }
            oldTierPct: { $ref: '#/components/schemas/Percent' }
            newTierPct: { $ref: '#/components/schemas/Percent' }
        pendingApprovals: { type: integer, description: 'Không tính yêu cầu loại `refund` (0.3.6). 0.3.6 bổ sung 2 (BA v0.3, ARC 17/10): chỉ yêu cầu tiền (`foc`, `special_discount`, `damage_pricing`)' }
        unhandledCreditVnd: { $ref: '#/components/schemas/MoneyVnd', description: '0.3.6 bổ sung 2 (BA v0.3, ARC 17/10) (E15-05): `creditVnd` − yêu cầu hoàn đang mở; blocker `credit_balance` khi > 0' }
        extraNightRequired: { type: boolean, description: '0.3.6 bổ sung 2 (BA v0.3, ARC 17/10) (E05-11): giờ trả (`checkoutTime`/`checkoutAt`) sau mốc cuối BR-412 → `checkOut` phải gửi `extraNight`' }
        extraNightDefaultRateVnd: { $ref: '#/components/schemas/MoneyVnd', description: '0.3.6 bổ sung 2 (BA v0.3, ARC 17/10); có khi `extraNightRequired`. **Vòng sửa 5**: giá bước 4 của BR-417 phụ lục 5A cho đêm ngày đi (AN-43) – thay các câu BUG-R2-134 trước đây' }
        extraNightFloorVnd: { $ref: '#/components/schemas/MoneyVnd', description: '0.3.7 bổ sung 4 (vòng sửa 5): khoảng Desk cho `extraNight.rateVnd` theo bước 4 phụ lục 5A – sàn căn đêm thêm; min áp → sàn thấp hơn của hai căn. Có khi `extraNightRequired`' }
        extraNightCeilingVnd: { $ref: '#/components/schemas/MoneyVnd', description: '0.3.7 bổ sung 4 (vòng sửa 5): trần tương ứng (min áp → trần cao hơn của hai căn)' }
        lateFeeAsNightVnd:
          $ref: '#/components/schemas/MoneyVnd'
          description: |
            0.3.7 bổ sung 4 (BUG-R2-139, BR-416-06 – DOM 18/10): **phụ thu trả muộn bằng giá 1 đêm** – có khi `extraNightRequired = true` **và** `extraNightAvailable = false` (đêm ngày đi không
            bán được). = giá bước 4 phụ lục 5A của đêm ngày đi (= `extraNightDefaultRateVnd`; AN-44; không thêm đêm nên không tính lại bậc BR-107 các đêm). Ghi bằng `checkOut.lateFeeInsteadOfNight` (quản lý xác nhận).
            Ví dụ 203, 16–18/04/2030, đã thu đủ, căn có khách đến 18/04, rời 19:00 → **792.000**
        extraNightAvailable: { type: boolean, description: '0.3.6 bổ sung 2 (BA v0.3, ARC 17/10): căn còn trống đêm ngày đi (false → lễ tân xử lý đổi phòng/khách đến trước khi trả). **0.3.7 bổ sung 4 (BUG-R2-139, BR-416-06)**: `false` → không bao giờ cộng đêm thêm; đường trả phòng là `lateFeeInsteadOfNight` (`lateFeeAsNightVnd`), hoặc dời khách đến sang căn khác rồi tóm tắt lại' }
        minibarUncheckedRooms:
          type: array
          description: '0.3.7 bổ sung 4 (mô hình minibar M-1, BUG-R2-136, BUG-R2-144): các tủ của lượt (mọi căn lượt đã ở, gồm căn cũ trước B14) có món tính tiền mà **chưa có lần đếm `checkout` sau mốc gần nhất** (mở kỳ, lượt vào lại căn, gia hạn B13 – BR-703-02) – gồm tủ khách quay lại hoặc gia hạn sau khi đã đếm; blocker `minibar_not_checked` xét **mọi** tủ trong danh sách. Vắng/rỗng = đã đủ. **Vòng sửa 5b (K11-09)**: tủ **căn đang ở** chỉ tính đã đếm khi lần đếm có ngày nghiệp vụ (giờ xử lý) bằng ngày nghiệp vụ của B18 (ngày đi, gồm cửa sổ sau nửa đêm); tủ căn đã rời không lọc ngày'
          items:
            type: object
            required: [roomId]
            properties:
              roomId: { $ref: '#/components/schemas/Uuid' }
              roomNo: { type: string }
              reason:
                type: string
                enum: [never_counted, stay_continued, new_fill, not_today]
                description: |
                  0.3.7 bổ sung 4 (FE-A, BUG-R2-144, BR-703-02 – ARC 16.14): `never_counted` = tủ chưa có lần đếm nào trong lượt; `stay_continued` = đã đếm nhưng lượt ở tiếp sau lần đếm
                  (vào lại căn, gia hạn B13 – kể cả khi kỳ mới mở bằng `refill`/`carry`); `new_fill` = kỳ mới sau một lần nạp `refill` mà không có sự kiện ở tiếp (R3 bổ sung giữa kỳ).
                  Hai mã sau Desk hiện "cần đếm lại". Thứ tự ưu tiên: `stay_continued` > `new_fill` > `never_counted`. Giá trị lạ → coi như cần đếm lại.
                  **Vòng sửa 5b (DOM ghi chú 7 BR-703, K11-09)**: `not_today` = tủ **căn đang ở** đã có lần đếm sau mốc nhưng không cùng ngày nghiệp vụ với B18 – Desk hiện "cần đếm lại";
                  thứ tự ưu tiên `stay_continued` > `new_fill` > `not_today` > `never_counted`
        postMidnightWindow: { type: boolean, description: '0.3.6 bổ sung 2 (BA v0.3, ARC 17/10): đang trong cửa sổ sau nửa đêm (ngày nghiệp vụ = ngày đi − 1, ngày lịch = ngày đi) – B18 hợp lệ, phụ thu 0' }
        blockers: { type: array, items: { type: string, enum: [balance_due, pending_approvals, minibar_not_checked, credit_balance] }, description: '`credit_balance` (0.3.6, DOM G-15): `creditVnd > 0` – gỡ bằng `checkOut.overpaymentHandling`. 0.3.6 bổ sung 2 (BA v0.3, ARC 17/10): theo `unhandledCreditVnd > 0`' }
        serverTime:
          $ref: '#/components/schemas/Instant'
          description: '0.3.7 (S4-47, FE KB7): giờ máy chủ lúc tính – giờ trả mặc định ở bước 2 (client không dùng đồng hồ máy quầy)'
        amountDueAtCheckoutVnd:
          $ref: '#/components/schemas/MoneyVnd'
          description: |
            0.3.7 (S4-47): số cần thu nếu hoàn tất B18 ngay với giờ trả đang xem = còn phải thu sau phụ thu trả muộn tính lại (`lateSurchargeRecalc`) và – khi `extraNightRequired` –
            đêm thêm theo `extraNightDefaultRateVnd` (dòng `late_checkout` sống bị đảo). Là trần của `checkOut.finalPayment` và `createVietQr purpose=check_out`. Không âm (dư → `creditVnd`).
            **0.3.7 bổ sung 4 (S4-38, BR-416-04/05)**: một hàm tính cho bản tóm tắt, trần QR `check_out` và lệnh B18 – lễ tân gõ giá đêm thêm khác mặc định: client **không** tự cộng chênh,
            số đúng là trần QR `check_out` gửi kèm `extraNightRateVnd` hoặc `max` của 422 `AMOUNT_EXCEEDS_BALANCE` ở `finalPayment`.
            **BUG-R2-139 (bổ sung 4, BR-416-06 – DOM 18/10)**: đêm thêm **chỉ** cộng khi `extraNightAvailable = true`. `extraNightRequired = true` và `extraNightAvailable = false` → số này
            = còn phải thu sau khi đảo dòng `late_checkout` theo bậc **cộng `lateFeeAsNightVnd`** (FOC trả muộn đã duyệt đi theo, khóa cả lượt BR-434) – xem trước = trần QR `check_out` với
            `lateFeeAsNight = true` = lệnh B18 `lateFeeInsteadOfNight` (ví dụ 203: **792.000**). QR `check_out` gửi `extraNightRateVnd` khi đó → 422 `NOT_ALLOWED` (như BUG-R2-127 ở B9a).
    SwapRoomPreview:
      type: object
      required: [reservations]
      description: '**Contract-ahead (0.3.7 bổ sung 4 – tuần Ổn định/R3)** – `previewSwapRoom`: tiền từng đơn khi đổi chéo căn theo quy tắc OTTIMO đổi căn (BR-429)'
      properties:
        reservations:
          type: array
          minItems: 2
          maxItems: 2
          items:
            type: object
            required: [reservationId, fromRoomId, toRoomId, folioDeltaVnd]
            properties:
              reservationId: { $ref: '#/components/schemas/Uuid' }
              reservationCode: { type: string }
              fromRoomId: { $ref: '#/components/schemas/Uuid' }
              toRoomId: { $ref: '#/components/schemas/Uuid' }
              folioDeltaVnd: { $ref: '#/components/schemas/MoneyVnd', description: 'Tổng thay đổi folio của đơn (có thể âm): phụ thu người (min theo DOM-S4-02) + chênh lệch OTA; tiền phòng giữ giá' }
              extraPersonDeltaVnd: { $ref: '#/components/schemas/MoneyVnd' }
              roomChangeDifferenceDeltaVnd: { $ref: '#/components/schemas/MoneyVnd' }
              requiresInformedGuest: { type: boolean, description: '`folioDeltaVnd` ≠ 0 → lệnh ghi sẽ cần `applyDifference` + số dự kiến' }
    ChangeRoomPreview:
      type: object
      required: [nights, folioDeltaVnd]
      description: |
        0.3.6 (BA E04-05): giá các đêm từ `effectiveDate`. `property_fault` → giữ giá cũ (nâng hạng miễn phí); `guest_request` → giá căn mới theo lịch giá kênh hiện hành
        (kênh `direct`/`agent` áp lại bậc giảm theo tổng số đêm – D-8); đơn OTA `guest_request` → không sửa giá OTA, chênh lệch dương ghi dòng `room_change_difference`
        thu tại quầy. Căn mới rẻ hơn với `guest_request` → giảm theo giá mới, không tự hoàn (dư → `creditVnd`).
      properties:
        nights:
          type: array
          items:
            type: object
            required: [date, oldRateVnd, newRateVnd]
            properties:
              date: { $ref: '#/components/schemas/LocalDate' }
              oldRateVnd: { $ref: '#/components/schemas/MoneyVnd' }
              newRateVnd: { $ref: '#/components/schemas/MoneyVnd' }
        folioDeltaVnd: { $ref: '#/components/schemas/MoneyVnd', description: 'Có thể âm' }
        roomChangeDifferenceVnd: { $ref: '#/components/schemas/MoneyVnd', description: 'Chỉ đơn OTA `guest_request`' }
        losDiscountPct: { $ref: '#/components/schemas/Percent' }
        extraGuestKitTransfer: { type: boolean }
        newRoomStatus: { type: string, description: 'Mã buồng hiện tại của căn mới (BR-801)' }
        stayScope: { type: string, enum: [whole_stay, until_parent_departure], description: '0.3.7 (S4-09) – phạm vi đã tính' }
        returnToRoomDate:
          $ref: '#/components/schemas/LocalDate'
          description: '0.3.7 (S4-09): chỉ khi `stayScope = until_parent_departure` – đêm đầu của đơn con, khách về lại căn cũ'
    MovePreview:
      type: object
      required: [pricingBasis, arrivalDate, departureDate, nights, folioDeltaVnd]
      description: |
        0.3.7 (ESC-019 A, S4-21) – phản hồi `previewMoveReservation`: lễ tân báo khách số mới rồi gửi `moveReservation.expectedDeltaVnd` = `folioDeltaVnd`.
        **0.3.7 bổ sung D1 (critic #10)**: mọi số ở đây do **cùng một hàm tính** với lệnh `moveReservation` sinh ra (không có nhánh tính riêng cho xem trước) – dữ liệu không đổi giữa
        hai lần gọi thì `folioDeltaVnd` luôn bằng số lệnh ghi tính lại, không bao giờ 409 `SURCHARGE_CHANGED` (ca kiểm BR-434-06, BR-434-09: xem trước rồi lưu).
      properties:
        pricingBasis:
          type: string
          enum: [new_room_rate, keep_booked_rate, external_contract]
          description: |
            `new_room_rate` khi `reasonCode = guest_request` và đổi căn (giá căn mới); `keep_booked_rate` với lý do do OTTIMO hoặc chỉ đổi ngày.
            **0.3.7 bổ sung D1 (BR-429 (h) v0.3.6)**: `external_contract` – đơn dài hạn nhập tay (`externalContract = true`): giá theo HĐ giấy, `folioDeltaVnd` = 0, client ghi chú "giá theo HĐ giấy"
        roomId: { $ref: '#/components/schemas/Uuid' }
        roomNo: { type: string }
        roomName: { type: [string, 'null'], description: '0.3.7 bổ sung D1 (BR-012): tên phòng căn mới – lễ tân báo khách bằng tên (khách không thấy số căn); `null` = căn chưa có tên' }
        arrivalDate: { $ref: '#/components/schemas/LocalDate' }
        departureDate: { $ref: '#/components/schemas/LocalDate' }
        nights:
          type: array
          description: 'Đêm của đơn sau khi đổi'
          items:
            type: object
            required: [date, newRateVnd]
            properties:
              date: { $ref: '#/components/schemas/LocalDate' }
              oldRateVnd: { oneOf: [{ $ref: '#/components/schemas/MoneyVnd' }, { type: 'null' }], description: 'Giá ròng hiện tại của đêm (null = đêm mới thêm)' }
              newRateVnd: { $ref: '#/components/schemas/MoneyVnd' }
              roomChangeDifferenceVnd: { $ref: '#/components/schemas/MoneyVnd', description: 'Chỉ đơn OTA `guest_request` – chênh giá Trực tiếp căn mới − căn gốc (≥ 0)' }
              focVnd: { $ref: '#/components/schemas/MoneyVnd', description: 'FOC/giảm giá đặc biệt đã duyệt đi theo = min(số đã duyệt, giá mới) (BR-434) – kể cả khi số đã duyệt > giá mới' }
              suggestedRateVnd:
                $ref: '#/components/schemas/MoneyVnd'
                description: '0.3.7 bổ sung D1 (BR-429 (g) – NÊN): gợi ý giá đêm căn mới giữ cùng % giảm so lịch căn cũ, làm tròn 1.000 – chỉ gợi ý, không áp; đi cùng cảnh báo `MANUAL_RATE_REPRICED`'
              pendingFocVnd:
                $ref: '#/components/schemas/MoneyVnd'
                description: '0.3.7 bổ sung D1 (BR-434 v0.3.5, S4-18): FOC/giảm giá **chờ duyệt** đi theo đêm này – khi duyệt sẽ áp min(số xin, giá mới); **không** tính vào `folioDeltaVnd`'
        removedNights: { type: array, items: { $ref: '#/components/schemas/LocalDate' }, description: 'Đêm bị bỏ (FOC của đêm này đi theo BR-434 (2)/(3))' }
        roomTotalOldVnd: { $ref: '#/components/schemas/MoneyVnd' }
        roomTotalNewVnd: { $ref: '#/components/schemas/MoneyVnd' }
        extraPersonOldVnd: { $ref: '#/components/schemas/MoneyVnd' }
        extraPersonNewVnd: { $ref: '#/components/schemas/MoneyVnd', description: 'Phụ thu người theo BR-429 (khách yêu cầu: định mức căn mới; do OTTIMO: min)' }
        roomChangeDifferenceVnd: { $ref: '#/components/schemas/MoneyVnd', description: 'Tổng dòng `room_change_difference` (đơn OTA)' }
        folioDeltaVnd: { $ref: '#/components/schemas/MoneyVnd', description: 'Chênh của folio sau đổi (phòng + phụ thu người + chênh lệch OTA − FOC đi theo); có thể âm' }
        losDiscountPct: { $ref: '#/components/schemas/Percent' }
        returningGuestDiscountPct:
          $ref: '#/components/schemas/Percent'
          description: |
            0.3.7 bổ sung D1 (BR-111, BR-429 (a); US-024 AC5): giảm mã khách quay lại áp lại trên giá căn mới khi đơn có mã (`returnGuestCode` lúc tạo). Không cộng dồn với BR-107:
            server áp mức có lợi hơn cho khách – chỉ một trong `losDiscountPct`, `returningGuestDiscountPct` > 0. Vắng = không áp
        depositPaidVnd: { $ref: '#/components/schemas/MoneyVnd', description: 'Cọc đã thu – không đổi, không đòi bổ sung (BR-429 (e))' }
        balanceDueAfterVnd: { $ref: '#/components/schemas/MoneyVnd', description: 'Còn phải thu mới sau khi đổi (thu khi nhận phòng – BR-305); 0 khi dư (phần thừa theo BR-522)' }
        warnings:
          type: array
          description: |
            Cảnh báo lệnh thật sẽ đòi lý do (`CAPACITY_EXCEEDED_WARNING` → `capacityWarningAckReason`, `VISA_EXPIRES_BEFORE_DEPARTURE` → `visaWarningAckReason`).
            **0.3.7 bổ sung D1 (BR-429 (g) v0.3.6 – NÊN, không chặn cổng)**: `MANUAL_RATE_REPRICED` (`field` = `nights[<i>]`) – đêm có giá cũ (`calendar_rate_vnd`) khác giá lịch hiện hành
            của căn cũ (có thể là giá sửa tay/thỏa thuận) nay lấy giá căn mới; kèm `nights[].suggestedRateVnd`. Chỉ báo, không đòi lý do; muốn giữ ưu đãi thì lễ tân sửa giá đêm căn mới
            sau khi lưu (`adjustFolioLine`, S4-35)
          items:
            type: object
            required: [code]
            properties:
              code: { type: string }
              field: { type: string }
    Party:
      type: object
      required: [requiredCount]
      description: Với phạm vi `own_count_only` (SAL/CTV) thuộc tính `members` vắng mặt hoàn toàn (D10).
      properties:
        requiredCount: { type: integer }
        presentCount: { type: integer }
        missingCount: { type: integer }
        members:
          type: array
          x-rbac-field: D10
          x-visible-to: [owner, manager, front_desk_lead, front_desk]
          items:
            type: object
            required: [id, role]
            properties:
              id: { $ref: '#/components/schemas/Uuid' }
              role: { type: string, enum: [booker, companion, child] }
              guest: { $ref: '#/components/schemas/GuestSummary' }
              relationship:
                x-rbac-field: D10
                type: string
                x-visible-to: [owner, manager, front_desk_lead, front_desk]
              childDisplayName:
                x-rbac-field: D09
                type: string
                description: 'Tên trẻ em che bớt; đầy đủ chỉ qua màn khai báo (C3)'
                x-visible-to: [owner, manager, front_desk_lead, front_desk]
              priceAgeBand: { type: string, enum: [adult, child_6_11, child_under_6], description: 'Bậc tuổi tính tại ngày đến (BR-110) – dùng thay `childAgeBand` BA E04-04 (cùng nghĩa: `adult` = 12+); không bao giờ trả năm sinh' }
              isMinorData: { type: boolean }
              effectiveFrom: { $ref: '#/components/schemas/LocalDate', description: 'Người thêm giữa kỳ ở (0.3.6)' }
        version: { type: integer, description: 'Phiên bản danh sách người – `ETag` của `listParty`; `If-Match` cho `removePartyMember` (0.3.6, E04-04)' }
        occupancyChange:
          type: object
          description: |
            0.3.6 (E04-04): chỉ có trong phản hồi `addPartyMember` (kể cả `dryRun`) khi số người tính định mức đổi. `surchargeVnd` = phụ thu người thêm BR-110
            từ đêm `effectiveFrom` × số đêm còn lại (đơn OTA: chỉ khi vượt số khách trên đơn OTA). `extraGuestKitTaskCreated` khi `extraCount` tăng (BR-812).
          properties:
            adults: { type: integer }
            children6to11: { type: integer }
            childrenUnder6: { type: integer }
            extraCount: { type: integer }
            surchargeVnd: { $ref: '#/components/schemas/MoneyVnd' }
            nights: { type: integer }
            surchargeApplied: { type: boolean }
            extraGuestKitTaskCreated: { type: boolean }
    PartyMemberCreate:
      type: object
      required: [role]
      description: |
        **0.3.7 bổ sung 3**: (BA E02-09, S4-45 – chỉ mô tả, không đổi `required`) `childName` + `childBirthYear` **bắt buộc khi `role = child`** (thiếu → 422 `REQUIRED`); gửi kèm
        `role = companion` → 422 `NOT_ALLOWED`. (BE-B S4-25, ORC đồng ý) **Không** thêm `requestFocForSurcharge` ở 0.3.7 – Desk xin FOC phụ thu người bằng `requestFoc` cho từng đêm;
        cân nhắc ở R3.
      properties:
        role: { type: string, enum: [companion, child] }
        guestId: { $ref: '#/components/schemas/Uuid' }
        relationship: { type: string, enum: [spouse, partner, family, friend, colleague, unknown], x-rbac-field: D10 }
        childName: { type: string, writeOnly: true, x-classification: C3, x-rbac-field: D09, description: 'Bắt buộc khi `role = child`; `companion` gửi → `NOT_ALLOWED` (0.3.7 bổ sung 3, BA E02-09)' }
        childBirthYear: { type: integer, minimum: 2000, writeOnly: true, x-classification: C3, x-rbac-field: D09, description: 'Bắt buộc khi `role = child` (S4-45); 2000 … năm của ngày nghiệp vụ (ngoài khoảng → `VALUE_OUT_OF_RANGE`); `companion` gửi → `NOT_ALLOWED` (0.3.7 bổ sung 3, BA E02-09)' }
        effectiveFrom:
          $ref: '#/components/schemas/LocalDate'
          description: '0.3.6 (BA E04-04, US-022 AC4): **bắt buộc** khi đơn `in_house` – ngày nghiệp vụ hôm nay … ngày đi − 1; phụ thu người thêm tính từ đêm này. Đơn chưa nhận phòng: bỏ qua'
        applyExtraPersonSurcharge:
          type: boolean
          default: false
          description: 'Lễ tân xác nhận "Ghi phụ thu {amount}" theo `occupancyChange.surchargeVnd` (BR-414) – 0.3.6'
        expectedSurchargeVnd:
          $ref: '#/components/schemas/MoneyVnd'
          description: 'Bắt buộc khi `applyExtraPersonSurcharge=true`; lệch → 409 `SURCHARGE_CHANGED` (như E03-02) – 0.3.6'
        dryRun: { type: boolean, default: false, description: 'Chỉ tính `occupancyChange`, không ghi (giao dịch readOnly – SEC A3) – 0.3.6' }
        capacityWarningAckReason: { type: string, minLength: 3, maxLength: 500, x-rbac-field: D12c, description: 'Đơn OTA vượt sức chứa (DOM D-1) – như `ReservationPatch` (0.3.6)' }
    DoorCredentialInput:
