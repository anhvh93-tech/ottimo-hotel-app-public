        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/me/2fa/setup:
    post:
      tags: [auth]
      operationId: startMy2faSetup
      summary: Bắt đầu đăng ký TOTP – trả URI otpauth để hiện QR (chỉ trả 1 lần, no-store)
