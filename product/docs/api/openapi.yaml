openapi: 3.1.0
info:
  title: OTTIMO Desk API
  version: 0.2.0-draft
  summary: Hợp đồng API bản nháp cho các story Must Round 2 (R1 Pha B – ARC)
  description: |
    Bản nháp hợp đồng API (contract-first, ADR-001). Nguồn sự thật cho kiểu dữ liệu dùng chung
    (`packages/contracts` sinh từ file này bằng openapi-typescript + zod).

    **Đọc cùng**: `product/docs/erd.md` (bảng, trạng thái), `product/docs/state-machines.md` (mã chuyển B1…, K1…),
    `product/docs/rbac-matrix.md` (vai, hành động A-xx, trường), `product/docs/business-rules.md` (BR-xxx),
    `product/docs/coding-standards.md` (quy ước API).

    ## Quy ước chung
    - **Đường dẫn**: `/v1/...`; tài nguyên cấp cơ sở nằm dưới `/v1/properties/{propertyId}/...` (ADR-007).
      Tài nguyên con được truy cập bằng id toàn cục (ví dụ `/v1/properties/{propertyId}/reservations/{reservationId}`).
    - **JSON**: tên trường `camelCase`; enum `snake_case` (trừ mã buồng `VC`, `VI`… giữ nguyên theo BR-801).
    - **Tiền**: số nguyên VND (`MoneyVnd`). **Ngày lưu trú**: `YYYY-MM-DD` theo giờ cơ sở. **Thời điểm**: ISO-8601 có offset `+07:00`.
      **Giờ cấu hình**: `HH:mm`.
    - **Lỗi**: RFC 9457 `application/problem+json` (schema `Problem`) với trường mở rộng `code` (mã máy đọc, ổn định)
      và `errors[]` (lỗi theo trường). Client hiển thị theo `code` + bản dịch của UXD, không hiển thị `detail` thô.
    - **Phân trang**: con trỏ (`cursor`, `limit` ≤ 100); phản hồi `{ data: [...], page: { nextCursor, limit } }`.
      Danh sách nhỏ cố định (căn, kênh, rack) không phân trang.
    - **Idempotency** (ADR-009): header `Idempotency-Key` (UUID) **bắt buộc** với mọi POST tạo đơn/giữ chỗ/thu tiền/chuyển trạng thái
      và mọi thao tác gửi từ hàng đợi offline của PWA. Gửi lại cùng key + cùng body → trả lại phản hồi cũ (kèm header `Idempotent-Replayed: true`);
      cùng key khác body → `422 IDEMPOTENCY_KEY_REUSED`; request trước còn đang xử lý → `409 IDEMPOTENCY_IN_PROGRESS`.
      Header khai `required: false` trong spec để validator không trả `422`; **middleware** kiểm operation có tham số này và trả
      `428 PRECONDITION_REQUIRED` khi thiếu (bảng mã lỗi là chuẩn).
      Khóa = (`principal_type` `user|guest_session`, `principal_id`, `key`). Bản ghi khóa INSERT `state=in_progress` **trong cùng giao dịch nghiệp vụ**:
      request trùng song song chờ UK rồi nhận `409 IDEMPOTENCY_IN_PROGRESS`; giao dịch rollback thì khóa cũng mất, client gửi lại được.
    - **Thứ tự kiểm** (bắt buộc, middleware dùng chung): xác thực → CSRF/Origin → thiết bị tin cậy (nếu `x-requires-trusted-device`)
      → `Idempotency-Key` (đã hoàn tất → trả lại phản hồi cũ, **không** kiểm `If-Match` nữa) → `If-Match` → quyền vai/phạm vi → nghiệp vụ.
      Nhờ vậy thao tác offline gửi lại sau khi đã thành công nhận lại kết quả cũ thay vì `412`.
    - **`dryRun: true`** (tính thử) **không** cần `Idempotency-Key`/`If-Match`, không ghi gì và không tiêu khóa; chỉ lần gọi thật mới cần.
    - **Khóa lạc quan**: GET tài nguyên sửa được trả `ETag: "<version>"`; PATCH và các hành động đổi trạng thái của đơn/folio/khai báo
      **bắt buộc** `If-Match: "<version>"`. Thiếu → `428 PRECONDITION_REQUIRED`; lệch → `412 VERSION_CONFLICT`
      ("Dữ liệu vừa thay đổi, tải lại" – state-machines 0.2.6). Ngoại lệ có chủ đích: thêm dòng folio (`addFolioLine`) là chỉ-thêm,
      không cần `If-Match`; server khóa `folio … FOR UPDATE` và trả `409 FOLIO_LOCKED` nếu bill đã khóa.
    - **Thiết bị tin cậy** (SR-DEV-01…06, decision-log SEC): operation có `x-requires-trusted-device: true` (mọi đọc/ghi C3 của nhân viên) chỉ chạy khi
      request có cookie `__Host-ottimo_did` hợp lệ, chưa thu hồi, cùng cơ sở → nếu không `403 DEVICE_NOT_TRUSTED` + `audit_event access.denied`.
      PWA nhân viên không bao giờ được cấp. Trực đêm dùng **thiết bị của cơ sở** đã được owner cấp (phân xử ORC 15/10).
    - **App khách** (ADR-006): operation `/v1/guest/*` có `x-guest-level` = `1` (chỉ cần link) hoặc `2` (đã xác minh bằng OTP email hoặc mã lễ tân cấp).
      Sau khi đơn `checked_out` chỉ còn `getGuestFolio` + thanh toán phát sinh (mức 2); mọi operation khác trả `403 GUEST_STAY_ENDED` (SR-GST-11).
      Thuộc tính có `x-guest-level: 2` vắng mặt khi phiên mới ở mức 1.
    - **Ba origin** (SR-HDR-04): admin-web, PWA nhân viên, guest-web ở 3 tên miền con; mỗi origin proxy `/v1` tới api (không CORS);
      cookie host-only tiền tố `__Host-`. Ở dev HTTP tên cookie bỏ tiền tố qua cấu hình `COOKIE_SECURE_PREFIX=false`.
    - **Phân quyền** (rbac-matrix mục 8): mỗi operation có `x-roles` (vai được gọi) và `x-scope` (phạm vi dữ liệu theo vai:
      `all` toàn cơ sở, `own` của mình, `today` việc hôm nay, `reservation` đơn của khách). Vai không có trong `x-roles` → `403 FORBIDDEN_ACTION`
      và ghi nhật ký lần bị từ chối (US-002 AC2). Bản ghi ngoài phạm vi hoặc thuộc cơ sở khác → `404 NOT_FOUND` (không lộ sự tồn tại).
    - **Cấu hình kênh gửi mã xác minh**: tham số cơ sở `guest_verify_code_channels` (mảng con của `airbnb_inbox`, `booking_inbox`, `agoda_inbox`, `zalo`;
      mặc định rỗng = tắt) đọc/sửa qua `GET/PUT /v1/properties/{propertyId}/parameters/{key}` – chỉ owner sửa, ghi audit `security` (SR-GST-13, BUG-R1-SEC-02).
    - **Tham số bảo mật** (BUG-R1-SEC-02): các khóa trong `setParameter.x-security-parameters` chỉ **owner** sửa (vai khác → `403 FORBIDDEN_ACTION`),
      giá trị phải nằm trong biên cứng do SEC đặt (ngoài biên → `422 VALIDATION_FAILED`, kể cả với owner), mỗi lần sửa ghi `audit_event category='security'`.
    - **Nhật ký C3** (`x-c3-log`): operation có thuộc tính này ghi **một** dòng `c3_access_log` (`subject_type`, `action` như khai) **trước khi** trả giá trị C3
      và luôn trả `Cache-Control: no-store`; với operation chỉ trả C3 trong một số trường hợp (ví dụ `getGuestStay` mức 2), chỉ ghi khi giá trị C3 thực sự có trong phản hồi.
    - **Mã trường rbac**: thuộc tính nhạy cảm có `x-rbac-field` (D01…D29 của rbac-matrix mục 6) để QA sinh test trường tự động; phủ dần ở R2.
    - **Lọc trường theo vai**: thuộc tính schema có `x-visible-to` chỉ xuất hiện trong JSON khi người gọi có một trong các vai đó;
      với vai khác thuộc tính **vắng mặt** (không phải `null`). Thuộc tính có `x-classification: C3` chỉ trả qua endpoint `.../sensitive`
      hoặc tải ảnh, mỗi lần đều ghi `c3_access_log`, luôn `Cache-Control: no-store`.
    - **Hành động hợp lệ**: tài nguyên có máy trạng thái trả `allowedActions[]` tính theo trạng thái **và** vai người gọi (US-020).
      Mỗi phần tử có `action` (tên route `kebab-case`) **và** `event` = mã chuyển của BA (`B4`, `B9`, `K6`…, state-machines.md) để FE/QA đối chiếu.
    - **Bảo mật**: nhân viên dùng cookie phiên `__Host-ottimo_sid` (HttpOnly, Secure, SameSite=Lax, Path=/) + header `X-CSRF-Token` và `Origin` hợp lệ cho method ghi;
      khách dùng cookie `__Host-ottimo_gsid` sau khi đổi token link (ADR-006). Không đưa dữ liệu C2/C3 vào URL/query.
      Đổi vai, khóa tài khoản, đặt lại/đổi mật khẩu, tắt 2FA → **thu hồi ngay mọi phiên** của người đó; quyền đọc theo `user_property_role`
      mỗi request (cache ≤ 60 giây có `roles_version`) – SR-SES-06, SR-AZ-08.
    - **Nhật ký**: `AuditEvent.before/after` sinh bằng serializer audit theo **danh sách trường cho phép** từng thực thể; cột `_enc` và giá trị C3
      không bao giờ vào nhật ký (SR-AUD-03).
    - **Tệp tải lên** (SR-FILE-01…06, bản SEC v0.2): server chỉ nhận **JPEG, PNG, WebP** xác định bằng magic bytes cho mọi kênh;
      **không nhận PDF, không nhận HEIC/HEIF** (→ `422 FILE_REJECTED` kèm hướng dẫn chụp lại); client chuẩn hóa (canvas → JPEG ~0,85, cạnh ≤ 2.500 px);
      ≤ 10 MB/tệp, ≤ 40 MP, ≤ 4 ảnh/người/giấy tờ, ≤ 30 tệp/đơn từ app khách; server vẫn **mã hóa lại** ảnh (sharp), bỏ EXIF/GPS; phản hồi tệp có `Cache-Control: no-store`,
      `X-Content-Type-Options: nosniff`, `Content-Security-Policy: sandbox; default-src 'none'`, `Content-Disposition: inline; filename="document"`.
    - **Xác nhận lại (step-up)**: operation có `x-step-up: true` cần PIN duyệt hoặc mật khẩu trong cửa sổ trượt `c3_stepup_minutes`
      (mặc định 15 phút, mỗi thao tác C3 gia hạn) qua `POST /v1/me/step-up`; hết cửa sổ → `401 REAUTH_REQUIRED` (SR-C3-09).
    - **Endpoint kiểm thử**: `/__test__/*` (đặt/tua giờ `MutableClock`, chạy job theo yêu cầu) **không** thuộc hợp đồng này – xem `openapi.test.yaml`;
      chỉ đăng ký khi `APP_ENV ∈ {dev, test, staging}`, không bao giờ ở production.
    - **Hành động không đảo ngược** (US-135): hủy đơn, trả sớm, đặt trả muộn hỗ trợ `dryRun: true` để client hiện hộp xác nhận nêu hậu quả
      (đêm mở bán lại, khoản giữ lại/hoàn, phụ thu); hoàn tất trả phòng dùng `GET .../checkout-summary`. Server **không** dựa vào hộp xác nhận
      để bảo vệ dữ liệu – mọi điều kiện vẫn kiểm lại khi ghi.
    - **Thời gian thực**: SSE `GET /v1/properties/{propertyId}/events` chỉ phát `{type, id}`; client gọi lại API để lấy dữ liệu theo quyền.

    ## Mã lỗi (`Problem.code`)
    | code | HTTP | Khi nào |
    |---|---|---|
    | VALIDATION_FAILED | 422 | Sai dữ liệu đầu vào (`errors[]`) |
    | UNAUTHENTICATED | 401 | Chưa đăng nhập / phiên hết hạn |
    | FORBIDDEN_ACTION | 403 | Vai không được làm hành động |
    | NOT_FOUND | 404 | Không có hoặc ngoài phạm vi |
    | ROOM_UNAVAILABLE | 409 | Trùng căn – đêm (BR-906) – kèm `conflicts[]` |
    | ROOM_BLOCKED | 409 | Căn đang khóa OOO (US-019) |
    | ROOM_NOT_SELLABLE | 409 | Căn ngừng bán (US-004) |
    | INVALID_TRANSITION | 409 | Chuyển trạng thái không hợp lệ với trạng thái hiện tại |
    | VERSION_CONFLICT | 412 | `If-Match` lệch |
    | PRECONDITION_REQUIRED | 428 | Thiếu `If-Match` hoặc `Idempotency-Key` |
    | IDEMPOTENCY_KEY_REUSED | 422 | Cùng key, khác body |
    | IDEMPOTENCY_IN_PROGRESS | 409 | Request cùng key đang xử lý |
    | HOLD_EXPIRED | 409 | Giữ chỗ đã hết hạn |
    | HOLD_NOT_ALLOWED_TODAY | 422 | Giữ chỗ cho ngày đến = hôm nay (BR-302) |
    | QUOTE_EXPIRED | 409 | Báo giá hết hiệu lực (BR-304) |
    | CAPACITY_EXCEEDED | 422 | Vượt sức chứa (BR-110) |
    | OUTSIDE_BOOKING_WINDOW | 422 | Ngoài cửa sổ bán / số đêm (BR-112) |
    | RATE_OUT_OF_RANGE | 422 | Giá ngoài sàn–trần (BR-105) |
    | PHONE_REQUIRED | 422 | Kênh trực tiếp/CTV thiếu SĐT |
    | DEPOSIT_INSUFFICIENT | 422 | Chưa đủ cọc để xác nhận (B4) |
    | CHECKIN_CONDITIONS_NOT_MET | 409 | Thiếu điều kiện BR-402 – kèm `unmet[]` |
    | RESERVATION_UNASSIGNED | 409 | Đơn OTA xung đột chưa gán căn |
    | LATE_CHECKOUT_CONFLICT | 409 | Có khách đến cùng ngày, không có căn thay thế (BR-416) |
    | BALANCE_DUE | 409 | Còn phải thu > 0 khi hoàn tất trả phòng (BR-426) |
    | PENDING_APPROVALS | 409 | Folio còn yêu cầu duyệt chờ (SM-10) |
    | FOLIO_LOCKED | 409 | Bill đã khóa (US-038 AC2) |
    | SELF_APPROVAL_FORBIDDEN | 403 | Tự duyệt yêu cầu của mình (BR-432) |
    | APPROVAL_LIMIT_EXCEEDED | 403 | Vượt hạn mức người duyệt (BR-433) – yêu cầu đã chuyển cấp trên |
    | REAUTH_FAILED | 401 | PIN/mật khẩu người duyệt sai |
    | DUPLICATE_GUEST | 409 | Trùng SĐT/email (BR-951) – kèm `existingGuestId` |
    | CARD_NUMBER_DETECTED | 422 | Văn bản tự do chứa chuỗi giống số thẻ (R-PAY-07) |
    | PAYMENT_NOT_CONFIGURED | 409 | Chưa cấu hình tài khoản nhận VietQR (US-120 AC2) |
    | REGISTRATION_INCOMPLETE | 409 | Chưa đủ người / chưa xử lý cảnh báo đối chiếu (K5) |
    | GUEST_LINK_INVALID | 401 | Link khách sai, hết hạn hoặc đã thu hồi |
    | GUEST_VERIFICATION_REQUIRED | 403 | Cần xác minh mức 2 (ADR-006) |
    | FILE_REJECTED | 422 | Tệp sai loại/kích thước/có mã độc |
    | RATE_LIMITED | 429 | Quá số lần (đăng nhập, xác minh khách) |
    | DEVICE_NOT_TRUSTED | 403 | Thao tác C3 từ thiết bị chưa được owner cấp (SR-DEV-03) |
    | GUEST_VERIFICATION_LOCKED | 429 | Token khách sai xác minh quá 5 lần/24 giờ – nhờ lễ tân cấp mã (SR-GST-08) |
    | GUEST_STAY_ENDED | 403 | Đơn đã trả phòng – chỉ còn xem bill/thanh toán phát sinh (SR-GST-11) |
    | DELIVERY_CHANNEL_DISABLED | 409 | Kênh gửi mã xác minh (OTA/Zalo) chưa được owner bật (phân xử ORC 15/10) |
    | MFA_REQUIRED | 401 | Cần mã TOTP để hoàn tất đăng nhập (SR-AUTH-06, R3) |
    | PASSWORD_CHANGE_REQUIRED | 403 | Đang dùng mật khẩu tạm – chỉ được gọi `POST /v1/me/password` (SR-AUTH-05) |
    | REAUTH_REQUIRED | 401 | Cần xác nhận lại PIN/mật khẩu trước thao tác C3 (SR-C3-09) |
    | PAYLOAD_TOO_LARGE | 413 | Body/tệp vượt giới hạn (webhook 64 KB, tệp 10 MB) |

    ## Phạm vi bản nháp
    Phủ 74 story Must R2 (`03-backlog/backlog.md` mục 4). Endpoint R3 chỉ để chỗ và ghi `x-round: R3`.
    Mỗi operation có `x-stories` (US-xxx) và `x-rbac` (mã hành động A-xx hoặc màn hình S-xx của rbac-matrix).

    ## Thay đổi phiên bản 0.2.0-draft (R1 bước 4 – trả lời review SEC, BE, DATA)
    Xác minh khách mức 2 bằng OTP email / mã lễ tân (bỏ `phoneLast4`, `bookingCode`); thiết bị tin cậy; thu hồi phiên; 2FA, đổi mật khẩu, PIN;
    thông báo nhân viên; hoa hồng; webhook có `{propertySlug}`; lọc trường theo vai bổ sung; `TonightKpi.unassignedConflictReservations`;
    đổi chéo căn; gửi lại link từ QR căn; rút đồng ý; thứ tự kiểm idempotency. Chi tiết: `rounds/round-01/responses/ARC-responses.md`.
  contact:
    name: ARC – OTTIMO Desk
