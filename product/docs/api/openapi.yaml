  /v1/properties/{propertyId}/parameters/{key}:
    parameters:
      - $ref: '#/components/parameters/PropertyId'
      - $ref: '#/components/parameters/ParameterKey'
    get:
      tags: [platform]
      operationId: getParameterHistory
      summary: Giá trị và lịch sử của một khóa (US-005 AC3)
      description: |
        **0.3.8 (R3-Q51, SEC Q51-1/Q51-2)**: khóa `payment_receiving_account` **chỉ OWN** (MGR, FDL → `403 FORBIDDEN_ACTION`); `listParameters` bỏ khóa này khỏi danh sách của vai khác OWN.
        `history` gồm cả dòng **đã lên lịch** (`effectiveFrom` > ngày kinh doanh hiện tại) – Desk tách "Đang dùng" / "Đã lên lịch". Số tài khoản luôn che (`accountNoMasked`, `bankName`).
        **0.3.8 bổ sung 2 (ARC 23/10, R3-Q51 – lần đặt đầu tiên)**: `current` = dòng có `effectiveFrom` lớn nhất ≤ ngày kinh doanh; **vắng mặt** (không có thuộc tính, không phải `null`) khi khóa chưa có dòng nào đang hiệu lực mà đã có dòng **đã lên lịch** – trả **200** với `history` chỉ gồm các dòng đã lên lịch (OWN thấy và hủy được qua `cancelScheduledParameter`). **404** chỉ khi khóa không có dòng nào (không đang dùng, không lên lịch) và không có giá trị mặc định trong danh mục. Áp cho mọi khóa; thực tế chỉ khóa không có mặc định (`payment_receiving_account`) rơi vào trường hợp này. Client đọc `current` như tùy chọn.
        **0.3.8 bổ sung 5 (ARC 24/10, BUG-R3-010)**: tham số bảo mật vẫn ẩn với `front_desk_lead` (404, không có trong `listParameters`), **trừ** `public_booking_requests_enabled` – FDL **đọc** được (hàng chờ S35 cần biết "form website đang tắt"), không sửa được (`setParameter` → 403). Danh sách khóa đọc được do server giữ; thêm khóa = đổi hợp đồng.
      x-roles: [owner, manager, front_desk_lead]
      x-stories: [US-005]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [history]
                properties:
                  current: { $ref: '#/components/schemas/Parameter' }
                  history: { type: array, items: { $ref: '#/components/schemas/Parameter' } }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [platform]
      operationId: setParameter
      summary: Thêm giá trị mới có ngày hiệu lực (không sửa giá trị quá khứ). Khóa `foc_limits`, tỷ lệ hoa hồng, phí kênh, `vat_rate`, `retention.*` và mọi tham số bảo mật chỉ OWN (rbac 5.3, A118).
      description: |
        **Chỉ owner** (manager → `403 FORBIDDEN_ACTION`, ghi `audit_event access.denied`): `foc_limits`, tỷ lệ hoa hồng, phí kênh, `vat_rate`, `retention.*`
        và các **tham số bảo mật** liệt kê ở `x-security-parameters` (BUG-R1-SEC-02; erd 9.3 cột "Người sửa / Biên").
        Tham số bảo mật có **biên cứng** do SEC đặt – giá trị ngoài biên hoặc phần tử ngoài tập cho phép → `422 PARAM_OUT_OF_RANGE`
        (kèm `min`/`max` hoặc `allowed[]`); sai kiểu → `422 VALIDATION_FAILED`. Áp dụng cả với owner; đổi biên = đổi hợp đồng (SEC duyệt), không phải cấu hình.
        Khóa không bảo mật có khoảng giá trị (erd 9) cũng trả `PARAM_OUT_OF_RANGE` khi vượt khoảng.
        Mỗi lần sửa tham số bảo mật ghi `audit_event category='security'` (giá trị trước/sau, lý do, người sửa); các khóa khác ghi `category='config'`.
        Kiểm tra thực hiện trên server theo khóa trong đường dẫn – client không quyết định khóa nào là "bảo mật".
        **0.3.7 bổ sung 2 (SEC ARC-17, C-3 (e))**: `public_booking_requests_enabled` là tham số bảo mật (chỉ OWN, audit `security`). Đặt `true` → server kiểm có dòng `privacy_notice_version`
        đang hiệu lực cho mỗi ngôn ngữ landing đang phát hành (`vi`, `en`; `ru` khi có trang RU) và khóa ký form đã nạp – thiếu → 422 `PUBLIC_FORM_NOT_READY` (`missing[]`), giá trị không đổi;
        đổi thành công → thông báo `public_booking_toggled` cho OWN + MGR. Đây là **công tắc duy nhất** việc nhận dữ liệu lúc chạy: trang luôn có sẵn mã form, form token 404 → khối Zalo;
        cờ build của landing chỉ chọn `request` (A) hay `live` (B), không bật/tắt việc nhận dữ liệu.
        **0.3.8 bổ sung 5 (ARC 24/10, BUG-R3-008) – công tắc khẩn (ngoại lệ duy nhất của "không sửa dòng đang hiệu lực", erd 4.1)**: OWN đặt `public_booking_requests_enabled = false`
        với `effectiveFrom` = ngày kinh doanh hiện tại → **có hiệu lực ngay**, kể cả khi đã có dòng của hôm nay (dòng đó bị ghi đè; audit `security` `config.changed` giữ
        `before.value`, `after.sameDayOverride: true`); hook báo `public_booking_toggled` OWN + MGR như mọi lần đổi. **Bật lại** (`true`) theo luật thường: đã có dòng hôm nay →
        422 `VALIDATION_FAILED` (`field` = `effectiveFrom`), đặt từ ngày kinh doanh sau. Dòng **đã lên lịch** cho ngày sau **không** bị hủy theo – muốn tắt hẳn thì OWN hủy thêm bằng
        `cancelScheduledParameter`. Danh sách khóa có ngoại lệ này do server giữ (hiện **chỉ** khóa này; `public_booking_request_pow_enabled` không thuộc); thêm khóa = đổi hợp đồng.
        **0.3.7 bổ sung 1 (BE-D s4 2.5 #6, S4-51 / P-S4-7)**: khóa `property_map_url` (chuỗi URL, **chỉ OWN** – MGR → 403; không phải tham số bảo mật, audit `config`) là **nguồn duy nhất**
        của `GuestStay.property.mapUrl` ("Chỉ đường" US-108; landing/bill dùng cùng khóa khi có). Mặc định danh mục = ghim INV gửi 17/10 (migration `0058`). Chỉ nhận `https` không
        user/mật khẩu/cổng, host đúng danh sách SEC E14-08 (`maps.google.com`, `www.google.com` path `/maps…`, `maps.app.goo.gl`, `maps.apple.com`, `www.openstreetmap.org`) –
        khác → 422 `VALIDATION_FAILED`, `errors[{field: value, code: NOT_IN_LIST}]`. Cột `property.map_url` chỉ còn là dự phòng khi khóa vắng (bỏ ở R3).
      x-roles: [owner, manager]
      x-rbac: [A101, A102, A118, A119]
      x-stories: [US-005]
      x-strong-reauth: 'chỉ khóa payment_receiving_account (0.3.8)'
      x-security-parameters:
        guest_verify_max_attempts: { type: integer, minimum: 3, maximum: 5, default: 5, ref: SR-GST-08 }
        guest_level2_idle_minutes: { type: integer, minimum: 5, maximum: 30, default: 30, ref: SR-GST-09 }
        guest_link_grace_hours: { type: integer, minimum: 0, maximum: 24, default: 24, ref: SR-GST-05/11 }
        guest_verify_code_channel_minutes: { type: integer, minimum: 5, maximum: 30, default: 15, ref: SR-GST-13 }
        guest_verify_code_channels: { type: array, uniqueItems: true, items: { enum: [airbnb_inbox, booking_inbox, agoda_inbox, zalo] }, default: [], ref: SR-GST-13 }
        trusted_device_days: { type: integer, minimum: 1, maximum: 180, default: 180, ref: SR-DEV-01 }
        trusted_device_mobile_days: { type: integer, minimum: 1, maximum: 30, default: 30, ref: SR-DEV-08 }
        c3_stepup_minutes: { type: integer, minimum: 1, maximum: 15, default: 15, ref: SR-C3-09 }
        # 0.3.7 (A.3 – CỔNG cùng mục A, BE-C; SEC s3 mục 7.2 – T05, hồ sơ khách "từ giấy tờ"): bật cùng migration 0057 của BE-C (dòng catalogue
        # `config_parameter_def.is_security`) – chỉ OWN, audit `security`; biên ARC đã chốt (ARC duyệt khi tích hợp).
        document_profile_retention_months: { type: integer, minimum: 1, maximum: 12, default: 12, ref: 'SEC s3 mục 7.2 / T05' }
        # 0.3.7 bổ sung 2 (US-155; SEC ARC-02/03/17/20/22 – biên SEC, mặc định DOM BR v0.3.8 [pháp lý chờ luật sư ESC-001]): khóa thêm cùng PR US-155 của BE-D (cùng lý do A.3).
        # Bật 24/10 (BE-D R3, v1.0 – migration 0086 thêm dòng catalogue `is_security`; architecture.test.ts so hai bên).
        # Tên khóa = catalogue của hợp đồng (DOM đã đổi BR theo – SEC ARC-20); BE chỉ tạo khóa có ở đây và ở erd 9.3:
        public_booking_requests_enabled: { type: boolean, default: false, ref: 'SEC ARC-17 – true cần privacy_notice_version đang hiệu lực mỗi ngôn ngữ landing + khóa ký form, khác → 422 PUBLIC_FORM_NOT_READY; đổi → thông báo OWN + MGR' }
        public_booking_request_daily_cap: { type: integer, minimum: 50, maximum: 500, default: 100, ref: 'SEC ARC-02, SR-RL-11' }
        public_booking_request_spam_pow_threshold_per_week: { type: integer, minimum: 5, maximum: 50, default: 10, ref: 'SEC ARC-20/22 – điều kiện đề nghị bật tầng 2' }
        public_booking_request_pow_enabled: { type: boolean, default: false, ref: 'SEC ARC-22 – tầng 2 proof-of-work tự host (contract-ahead)' }
        retention.web_request_stale_days: { type: integer, minimum: 7, maximum: 60, default: 30, ref: 'SEC ARC-03 (T19); DOM Q-W06 – 30' }
        retention.web_request_declined_days: { type: integer, minimum: 30, maximum: 90, default: 90, ref: 'SEC ARC-03 (T19)' }
        retention.web_request_spam_days: { type: integer, minimum: 1, maximum: 7, default: 7, ref: 'SEC ARC-03 (T19)' }
        retention.web_request_max_age_days: { type: integer, minimum: 90, maximum: 180, default: 180, ref: 'SEC ARC-03 (T19)' }
        retention.web_request_ip_hmac_days: { type: integer, minimum: 7, maximum: 30, default: 30, ref: 'SEC ARC-03' }
        # 0.3.8 (US-164, ESC-024 B) – khóa thường **chỉ OWN** (erd 9.3): remote_confirm_timeout_minutes { integer, 5–60, mặc định 15 } – hạn chờ quản lý xác nhận từ xa;
        #   late_fee_post_review_hours – **bỏ (0.3.8 bổ sung 8, ARC 26/10)**: hạn hậu kiểm = `post_checkout_charge_hours` (BR-427) vì miễn sau hậu kiểm chỉ làm được bằng A32
        #   khi folio còn `settled`; không thêm dòng catalogue (DOM: `late_fee_fallback_review_hours` BR mục 13 = bí danh của `post_checkout_charge_hours`).
        # Khóa thường (OWN, MGR – erd 9.3; mặc định DOM BR-912/914 v0.3.8): web_request_response_minutes (15), web_request_escalate_minutes (30),
        #   web_request_public_promise_minutes (60), web_request_public_promise_next_morning_by (09:00), web_request_public_promise_call_now_minutes (60 – bổ sung 4),
        #   web_request_same_day_after_hours_minutes (30 – hạn nội bộ),
        #   web_request_duplicate_window_hours (24); phương án B: web_request_offer_honor_hours (24).
        session_policy:
          type: object
          ref: SR-SES-03
          default: { admin: { idleMinutes: 30, maxHours: 12 }, staff_pwa: { idleMinutes: 4320, maxHours: 720 } }
          description: |
            0.3.4 (SEC s1-decisions mục 1). Ràng buộc chéo: `idleMinutes ≤ maxHours × 60` từng kênh; vi phạm → `PARAM_OUT_OF_RANGE` kèm `min`/`max` của khóa con.
            **Phạm vi**: lưu theo cơ sở như mọi tham số; khi áp cho đăng nhập/phiên (chưa có cơ sở) server dùng giá trị **chặt nhất** trong các cơ sở
            người dùng có vai đang hoạt động (idle/max nhỏ nhất); ngày hiệu lực theo giờ cơ sở (FB-R2-SEC-BE-20).
          required: [admin, staff_pwa]
          properties:
            admin:
              type: object
              required: [idleMinutes, maxHours]
              properties:
                idleMinutes: { type: integer, minimum: 5, maximum: 30, default: 30 }
                maxHours: { type: integer, minimum: 1, maximum: 12, default: 12 }
            staff_pwa:
              type: object
              required: [idleMinutes, maxHours]
              properties:
                idleMinutes: { type: integer, minimum: 60, maximum: 4320, default: 4320 }
                maxHours: { type: integer, minimum: 24, maximum: 720, default: 720 }
        login_lockout:
          type: object
          ref: SR-AUTH-04
          default: { maxFailures: 5, lockMinutes: 15, hardLockAfterLocks: 3, lockWindowHours: 24 }
          description: |
            0.3.4 (SEC s1-decisions mục 1). Khóa tạm/khóa cứng chỉ chặn **đăng nhập mới**, không hủy phiên đang sống (FB-R2-SEC-BE-05).
            Phạm vi như `session_policy`: giá trị chặt nhất trong các cơ sở của người dùng (`maxFailures`, `hardLockAfterLocks` nhỏ nhất; `lockMinutes`, `lockWindowHours` lớn nhất).
          required: [maxFailures, lockMinutes, hardLockAfterLocks, lockWindowHours]
          properties:
            maxFailures: { type: integer, minimum: 3, maximum: 5, default: 5 }
            lockMinutes: { type: integer, minimum: 15, maximum: 60, default: 15 }
            hardLockAfterLocks: { type: integer, minimum: 2, maximum: 3, default: 3 }
            lockWindowHours: { type: integer, minimum: 24, maximum: 72, default: 24 }
      x-reauth-parameters:
        # 0.3.6 (SEC F3): khóa chỉ OWN + xác nhận lại mật khẩu trong request (`reauth`); tách khỏi x-security-parameters vì giá trị là chuỗi
        # (meta/bounds của x-security-parameters chỉ nhận integer/array/object số). BE-B kiểm theo schema dưới đây.
        payment_receiving_account:
          type: object
          ref: SEC s3-checklist F3, BR-521
          description: |
            0.3.6. Tài khoản nhận VietQR. **Chỉ OWN**; request **bắt buộc** `reauth` (mật khẩu của chính OWN, kiểm ngay – không dùng cửa sổ step-up)
            → sai: `401 REAUTH_FAILED`; audit `category='money'` với số tài khoản **che giữa** (cũ/mới); push + `StaffNotification`
            `receiving_account_changed` tới **mọi** OWN/MGR của cơ sở. `listParameters`/`getParameterHistory` chỉ trả `accountNoMasked`
            (`9704••••1234`), không bao giờ trả số đầy đủ; số đầy đủ chỉ nằm trong `qrPayload` do server dựng. QR tạo trong 24 giờ sau khi đổi →
            `createVietQr.receivingAccountRecentlyChanged=true` (lễ tân thấy cảnh báo). Thiếu khóa → `createVietQr` `409 PAYMENT_NOT_CONFIGURED`.
            **0.3.8 (R3-Q51, SEC mục C)**: (1) đọc/ghi **chỉ OWN** (cả đọc che); (2) `effectiveFrom` ≥ ngày kinh doanh + 1 – kể cả lần đặt đầu (422 `EFFECTIVE_FROM_TOMORROW`); gửi lại cùng
            `effectiveFrom` của dòng **đã lên lịch** = sửa dòng đó (audit như đặt mới); hủy dòng lên lịch = `cancelScheduledParameter`; (3) `reauth` mức **S2** – thêm `totpCode`/`recoveryCode`
            (bắt buộc khi OWN đã bật 2FA); (4) dạng che mới `accountNoMasked = '•••• 1234'` + `bankName` tra từ BIN (bảng NAPAS tĩnh trong mã; BIN lạ → `bankName` vắng) – SEC Q51-2;
            (5) thông báo `receiving_account_changed` gửi ngay lúc lưu/hủy (kèm ngày hiệu lực) + email mọi `owner` (SEC Q51-6, kênh email xem `s1-contracts.md`);
            cảnh báo 24 giờ tính từ đầu ngày hiệu lực (cách tính hiện có `changedAt` = max(ghi, 00:00 ngày hiệu lực)).
          required: [bankBin, accountNo, accountName]
          properties:
            bankBin: { type: string, pattern: '^[0-9]{6}$', description: 'Mã BIN ngân hàng (NAPAS)' }
            accountNo: { type: string, pattern: '^[0-9]{6,19}$', writeOnly: true }
            accountName: { type: string, maxLength: 50, description: 'Tên chủ tài khoản không dấu, IN HOA' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value, effectiveFrom, reason]
              properties:
                value: { description: Giá trị theo schema của khóa (erd mục 9) }
                effectiveFrom: { $ref: '#/components/schemas/LocalDate' }
                reason: { type: string, minLength: 3, maxLength: 500 }
                reauth:
                  type: object
                  description: 'Bắt buộc với khóa `payment_receiving_account` (0.3.6, SEC F3); khóa khác bỏ qua. Thiếu → 422 `REQUIRED` (`field` = `reauth`). **0.3.8**: mức S2 – `secret` = mật khẩu, kèm `totpCode` hoặc `recoveryCode` khi OWN đã bật 2FA (thiếu → 422 `STRONG_REAUTH_REQUIRED`); sai → 401 `REAUTH_FAILED` (`field` = `reauth.secret`)'
                  required: [authMethod, secret]
                  properties:
                    authMethod: { type: string, enum: [password] }
                    secret: { type: string, writeOnly: true, minLength: 6, maxLength: 256 }
                    totpCode: { type: string, pattern: '^[0-9]{6}$', writeOnly: true }
                    recoveryCode: { type: string, writeOnly: true }
            example: { value: 48, effectiveFrom: '2026-10-16', reason: Khách hay chuyển khoản chậm cuối tuần }
      responses:
        '200':
          description: Đã lưu; bản ghi tạo từ ngày hiệu lực dùng giá trị mới, bản ghi cũ giữ snapshot (US-005 AC1)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Parameter' }
        '401': { $ref: '#/components/responses/ReauthFailed' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422':
          description: VALIDATION_FAILED (sai kiểu) / PARAM_OUT_OF_RANGE (ngoài biên – kèm `min`, `max` hoặc `allowed[]`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example: { type: /problems/param-out-of-range, title: Giá trị ngoài khoảng cho phép, status: 422, code: PARAM_OUT_OF_RANGE, min: 1, max: 30, errors: [{ field: value, code: PARAM_OUT_OF_RANGE }] }

  /v1/properties/{propertyId}/parameters/{key}/actions/cancel-scheduled:
    parameters:
      - $ref: '#/components/parameters/PropertyId'
      - $ref: '#/components/parameters/ParameterKey'
    post:
      tags: [platform]
      operationId: cancelScheduledParameter
      summary: Hủy một dòng tham số **đã lên lịch** (chưa tới ngày hiệu lực) – R3-Q51, SEC Q51-5
      description: |
        **0.3.8**. Xóa dòng `config_parameter` có `effectiveFrom` = ngày gửi và > ngày kinh doanh hiện tại (dòng đang/đã hiệu lực → `409 INVALID_TRANSITION`; không có → 404).
        Quyền như `setParameter` theo khóa (khóa chỉ OWN → MGR 403). Khóa `payment_receiving_account`: bắt buộc `reauth` S2 như `setParameter`; audit `money` `config.changed`
        (`after.cancelledEffectiveFrom`, số che); thông báo `receiving_account_changed` + email mọi `owner`. Khóa khác: audit `config`/`security` theo khóa.
      x-roles: [owner, manager]
      x-rbac: [A101, A102, A118, A119]
      x-round: R3
      x-stories: [US-005, US-120]
      x-strong-reauth: true
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [effectiveFrom, reason]
              additionalProperties: false
              properties:
                effectiveFrom: { $ref: '#/components/schemas/LocalDate' }
                reason: { type: string, minLength: 3, maxLength: 500 }
                reauth:
                  type: object
                  description: Như `setParameter.reauth` (S2) – bắt buộc với `payment_receiving_account`
                  required: [authMethod, secret]
                  properties:
                    authMethod: { type: string, enum: [password] }
                    secret: { type: string, writeOnly: true, minLength: 6, maxLength: 256 }
                    totpCode: { type: string, pattern: '^[0-9]{6}$', writeOnly: true }
                    recoveryCode: { type: string, writeOnly: true }
