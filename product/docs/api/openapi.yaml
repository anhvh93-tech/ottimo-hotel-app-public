                receivedAmountVnd: { $ref: '#/components/schemas/MoneyVnd', description: 'Bắt buộc khi `short` (số thực nhận, < `amountVnd`)' }
                note: { type: string, maxLength: 300, description: 'Bắt buộc khi `short` (3–300, `REASON_REQUIRED`)' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payment' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/VersionConflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
