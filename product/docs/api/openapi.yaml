    post:
      tags: [guest-requests]
      operationId: transitionGuestRequest
      summary: Đã nhận / xong / không thực hiện được (SM-15) – trạng thái phản ánh sang trang khách (US-109 AC2)
      description: |
        **0.3.7 bổ sung 4 (ARC 16.24, BE-D S4-07/08)**: `decline` nhận `new`/`acknowledged`, và **`in_progress` khi việc HK/phiếu liên kết đã `cancelled`** (SM-15 thêm cạnh
        `in_progress → declined`); khác → 409 `INVALID_TRANSITION`. Yêu cầu có việc liên kết: phí BR-506 chỉ ghi khi **việc** `done` – `complete` của lễ tân không ghi phí; yêu cầu
        không có việc liên kết mà có phí: `complete` ghi phí một lần. Thứ tự khóa theo 16.19 bổ sung 3 (`hk_task` → `guest_request`; ghi phí thì folio trước).
      x-roles: [owner, manager, front_desk_lead, front_desk, housekeeping, maintenance]
