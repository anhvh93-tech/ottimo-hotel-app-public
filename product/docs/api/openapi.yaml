        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contactAttemptNote]
              properties:
                contactAttemptNote: { type: string, minLength: 3, maxLength: 500 }
      responses:
        '200': { $ref: '#/components/responses/ReservationOk' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/VersionConflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /v1/properties/{propertyId}/reservations/{reservationId}/actions/restore-no-show:
    parameters:
      - $ref: '#/components/parameters/PropertyId'
      - $ref: '#/components/parameters/ReservationId'
    post:
      tags: [reservations]
      operationId: restoreNoShow
      summary: Khôi phục no-show (B12) – MGR+ ngay; FD/FDL tự làm khi đủ 3 điều kiện BR-315, ngoài ra tạo yêu cầu duyệt `no_show_restore` (US-136 AC4)
      description: |
        Chỉ trong ngày nghiệp vụ của đêm đến và khi căn còn trống (BR-906). Đóng lại phòng (outbox); khai báo **dùng lại bản ghi của đơn**, chuyển `void → none` (SM-05 K12 – giữ ràng buộc duy nhất `registration.reservation_id`, không tạo bản ghi mới); ảnh giấy tờ đã xóa không khôi phục (US-136 AC4).
        FD/FDL (A10 = ✔/D, ghi chú 35): đủ cả 3 điều kiện BR-315 (còn ngày nghiệp vụ của đêm đến; căn còn trống, không đổi căn; không hoàn tiền/đổi giá) → thực hiện ngay, lý do bắt buộc, báo MGR, hiện trong đóng ca;
        thiếu một điều kiện hoặc đơn OTA đã báo no-show lên kênh → `202` kèm yêu cầu duyệt thay vì đơn đã đổi.
        **0.3.5 (DOM D-3, A-21)**: đơn kênh `ota` → FD/FDL **luôn** `202` (R2 chưa lưu "đã báo kênh"). Căn cũ đã bán lại: MGR+ gửi `roomId` (căn trống khác – trùng → 409 + `suggestions[]`)
        hoặc `allowUnassigned: true` → đơn về `confirmed` ở **làn chưa gán căn** (`conflictState=open`, `overbooking_incident.source = no_show_restore`), gán căn sau bằng
        `moveReservation` (`reasonCode = overbooking`). Thực hiện từ yêu cầu duyệt đã `approved` **không bao giờ** trả 409: căn không còn → tự đi làn chưa gán.
        Đêm đã qua (khôi phục sau ngày nghiệp vụ, MGR duyệt) vẫn `sold` theo giá snapshot (BR-315 (3)); miễn tiền đi FOC BR-434.
      x-roles: [owner, manager, front_desk_lead, front_desk]
      x-rbac: [A10]
      x-transition: B12
      x-stories: [US-136]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 3 }
                roomId: { $ref: '#/components/schemas/Uuid', description: 'MGR+: khôi phục vào căn trống khác khi căn cũ đã bán lại (0.3.5, DOM D-3 b)' }
                allowUnassigned: { type: boolean, default: false, description: 'MGR+: không còn căn phù hợp → khôi phục vào làn chưa gán căn (0.3.5, DOM D-3 b)' }
      responses:
        '200': { $ref: '#/components/responses/ReservationOk' }
        '202':
          description: Đã tạo yêu cầu duyệt (vai FD/FDL)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApprovalRequest' }
        '409': { $ref: '#/components/responses/RoomUnavailable' }
