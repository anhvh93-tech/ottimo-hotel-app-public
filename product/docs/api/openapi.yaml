  /v1/properties/{propertyId}/reservations/{reservationId}/actions/confirm-deposit:
    parameters:
      - $ref: '#/components/parameters/PropertyId'
      - $ref: '#/components/parameters/ReservationId'
    post:
      tags: [reservations]
      operationId: confirmDeposit
      summary: Xác nhận cọc/ký quỹ – hold → confirmed (B4); dài hạn sinh HĐ + lịch kỳ thu (H1, US-086)
      description: |
        Ghi giao dịch `succeeded` (nếu gửi `payment`) rồi, **nếu tổng cọc đã đủ** `depositRequiredVnd`, chuyển `hold → confirmed` (B4) trong cùng giao dịch; kiểm trùng lại (BR-906).
        **Chưa đủ (US-086 AC2, 0.3.5 A-13)**: giao dịch vẫn được ghi, đơn giữ `hold` → **`200`** trả `Reservation` (`status=hold`, `depositPaidVnd` mới) – client báo
        "Đã ghi nhận, còn thiếu {depositRequiredVnd − depositPaidVnd}". Không trả 4xx khi đã ghi tiền (4xx = không có gì được ghi; client gửi lại an toàn).
        `422 DEPOSIT_INSUFFICIENT` chỉ khi **không** gửi `payment` mới (dùng `existingPaymentId` hoặc gọi lại) mà tổng cọc vẫn thiếu – không ghi gì.
        Giữ chỗ đã quá hạn chỉ xác nhận khi tiền về trước hạn (`receivedAt` < `hold.expiresAt`, US-085 AC4), ngược lại `409 HOLD_EXPIRED` (+ `expiredAt`).
        CTV **không** được gọi (rbac ghi chú 20) – CTV dùng `.../deposit-notices`.
      x-roles: [owner, manager, front_desk_lead, front_desk, sales_staff]
      x-scope: { sales_staff: own }
      x-rbac: [A04]
      x-transition: B4
      x-stories: [US-086, US-119]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                payment: { $ref: '#/components/schemas/PaymentCreate' }
                existingPaymentId: { $ref: '#/components/schemas/Uuid' }
                acceptShortfallReason:
                  type: string
                  minLength: 3
                  maxLength: 500
                  x-rbac-field: D12c
                  description: |
                    0.3.6 (B-29, DOM D-9). **Chỉ MGR+** (FD/FDL/SAL gửi → `403 FORBIDDEN_ACTION`). Đơn `hold` có tổng cọc `succeeded` > 0 (= 0 → `409 INVALID_TRANSITION`).
                    Tổng cọc < `depositRequiredVnd` mà có lý do → B4 `confirmed` (giữ `shortfallVnd` trên đơn), audit `money` + `StaffNotification`
                    `deposit_shortfall_accepted` tới OWN. Audit `category='money'`, `action='deposit.shortfall_accepted'`, `after` có `shortfallVnd`, `reason` (UXD #3).
                    Không gửi → hành vi A-13 (200, vẫn `hold`).
            example:
              payment: { type: deposit, method: bank_transfer, amountVnd: 1500000, receivedAt: '2026-10-15T10:12:00+07:00', note: CK Vietcombank }
      responses:
        '200': { $ref: '#/components/responses/ReservationOk' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/VersionConflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /v1/properties/{propertyId}/reservations/{reservationId}/deposit-notices:
    parameters:
      - $ref: '#/components/parameters/PropertyId'
      - $ref: '#/components/parameters/ReservationId'
    post:
      tags: [reservations]
      operationId: createDepositNotice
      summary: CTV/SAL báo "khách đã chuyển cọc" kèm ảnh biên nhận để FD/SAL xác nhận (A53)
      description: |
        **0.3.7 bổ sung 1 (FE-B s4 mục 5, BUG-R2-081 – ghi rõ cách server đã cài)**: chỉ đơn `hold` (khác → 409 `INVALID_TRANSITION`). Mỗi đơn có **tối đa một** báo `open`
        (SEC-BE-28 (3)): báo lại khi còn bản `open` → **cập nhật** bản đó (`amountVnd`, `note`, `attachmentId` nếu gửi), không tạo bản mới; FD/FDL và sale của đơn được
        nhắc lại sau một khoảng chống dồn. `attachmentId` phải là ảnh `uploadAttachment purpose=deposit_receipt` của chính đơn này (sai → 422 `VALIDATION_FAILED`, `errors[{field: attachmentId, code: NOT_IN_LIST}]`).
        B4 thành công (`confirmDeposit`) → báo chuyển `handled`. Đọc lại: `Reservation.depositNotices[]` (`getReservation`) – ảnh xem bằng `getAttachment`.
      x-roles: [sales_staff, collaborator]
      x-scope: { sales_staff: own, collaborator: own }
      x-rbac: [A53]
      x-stories: [US-086]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amountVnd]
              properties:
                amountVnd: { $ref: '#/components/schemas/MoneyVnd' }
                attachmentId: { $ref: '#/components/schemas/Uuid' }
                note: { type: string, maxLength: 500 }
      responses:
        '202': { description: 'Đã gửi; FD/SAL nhận thông báo' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /v1/properties/{propertyId}/reservations/{reservationId}/actions/cancel:
    parameters:
      - $ref: '#/components/parameters/PropertyId'
      - $ref: '#/components/parameters/ReservationId'
    post:
      tags: [reservations]
      operationId: cancelReservation
      summary: Hủy giữ chỗ (B5) hoặc hủy đơn đã đảm bảo (B10) – lý do bắt buộc (US-021)
      description: |
        Gọi trước với `dryRun=true` để nhận phí hủy/hoàn cọc theo `cancel_policy_direct` (snapshot của đơn) – US-021 AC3;
        lần gọi thử **không cần** `Idempotency-Key`/`If-Match` và không tiêu khóa. Gọi lại `dryRun=false` (kèm cả hai header) để lưu.
        Phần hoàn tạo yêu cầu duyệt `refund` (MGR+, BR-522). Mở phòng + outbox đồng bộ kênh trong cùng giao dịch.
        0.3.6 (B-13, SEC G4): thu hồi **mọi** `guest_access_token` + phiên khách của đơn trong **cùng giao dịch** (`GuestAccessPort.revokeAllForReservation`).
        **0.3.7 bổ sung D1 (S4-08 – BR-309 v0.3.4; S4-06 – BR-522; BR-434)**: cùng giao dịch hủy (cả `dryRun`, chỉ tính):
        (1) mọi dòng dịch vụ (`CancellationQuote.serviceLines`) **tự đảo**, trừ dòng có trong `retainLines` (lễ tân giữ, lý do bắt buộc); (2) phí hủy/hoàn tính **sau** bước (1), trần phí = giá trị đơn
        BR-309 (dòng sống `room` + `extra_person` lúc hủy); (3) FOC đã duyệt trên đêm bị hủy → hủy theo quy tắc (`folio.foc_cancelled`, trả hạn mức – BR-433), yêu cầu FOC chờ duyệt tự hủy
        (`approval_cancelled`); (4) số dư thừa còn lại sau phí (không gồm OTA thu hộ) → **một** yêu cầu `refund` tự tạo (`refundApprovalRequestId`, `refundRequestVnd`; đã có yêu cầu mở thì cập nhật số)
        + "Cần chú ý" `closed_reservation_credit` (S4-06). Desk: gọi thử không `retainLines` → hiện `serviceLines` (dòng `performed` gợi ý giữ) → lễ tân chọn + lý do → gọi thử lại → lưu
        với **cùng** `retainLines`. Thử và lưu dùng **cùng hàm tính** (như B7 – critic #10).
      x-roles: [owner, manager, front_desk_lead, front_desk, sales_staff, collaborator]
      x-scope: { sales_staff: own_direct_only, collaborator: own_hold_only }
      x-rbac: [A05, A06]
      x-transition: [B5, B10]
      x-stories: [US-021, US-135]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reasonCode]
              properties:
                reasonCode: { $ref: '#/components/schemas/CancelReasonCode' }
                note: { type: string, maxLength: 500 }
                otaPenaltyVnd:
                  $ref: '#/components/schemas/MoneyVnd'
                  description: |
                    Chỉ đơn kênh `ota`: tiền phạt hủy theo extranet của kênh (BR-310) – app **không tự tính**, lễ tân nhập; ≥ 0 (`AMOUNT_INVALID`).
                    Đơn kênh khác gửi → `422` mã trường `OTA_PENALTY_OTA_ONLY`. Ghi vào folio/`CancellationQuote.otaPenaltyVnd`. 0.3.1
                    **0.3.6 bổ sung 4 (DOM luật OTA 17/10, ARC) (BR-310 v0.3.4)**: tiền phạt = **doanh thu khác**, dòng folio `cancellation_fee` (`labelKey` `bill.line.cancellation_fee`).
                    `ota_prepaid` → kèm giao dịch hệ thống `ota_collect` bằng đúng tiền phạt (đã thu qua OTA, còn phải thu 0);
                    `ota_pay_at_property` → còn phải thu tại cơ sở (không chặn hủy). Phí kênh trên tiền phạt theo `otaPenaltyChannelFeeVnd` hoặc tỷ lệ BR-901.
                otaPenaltyChannelFeeVnd:
                  $ref: '#/components/schemas/MoneyVnd'
                  description: '0.3.6 bổ sung 4 (DOM luật OTA 17/10, ARC): phí kênh OTA thực tế trên tiền phạt (theo sao kê/extranet); không gửi → server tính theo tỷ lệ hoa hồng kênh (BR-901). Chỉ khi có `otaPenaltyVnd`, khác → 422 `NOT_ALLOWED`'
                retainLines:
                  type: array
                  maxItems: 50
                  description: |
                    0.3.7 bổ sung D1 (S4-08, BR-309): dòng dịch vụ lễ tân **giữ** (không đảo) – đã thực hiện hoặc đã phát sinh chi phí với bên thứ ba (xe đã đón, tour đã đặt); mọi dòng dịch vụ
                    khác tự đảo. `lineId` phải thuộc `CancellationQuote.serviceLines` (khác → 422 `NOT_IN_LIST`, `field` = `retainLines[<i>].lineId`); `reason` thiếu/< 3 ký tự → 422
                    `REASON_REQUIRED` (`field` = `retainLines[<i>].reason`). Gửi **y hệt** ở `dryRun` và lần lưu; server tính lại khi lưu. Lý do vào audit `folio.line_posted`/nhật ký hủy.
                  items:
                    type: object
                    required: [lineId, reason]
                    properties:
                      lineId: { $ref: '#/components/schemas/Uuid' }
                      reason: { type: string, maxLength: 500 }
                dryRun:
                  type: boolean
                  default: false
                  description: |
                    Tính thử (US-021 AC3, US-135): trả `CancellationQuote` – phí/hoàn theo chính sách, `serviceLines[]` với `retained` theo `retainLines` gửi kèm, tổng sau khi đảo, số của yêu cầu hoàn
                    sẽ tạo. Giao dịch `readOnly`, không ghi, không cần `Idempotency-Key`/`If-Match`, không tiêu khóa. 0.3.7 bổ sung D1 (S4-08)
            example: { reasonCode: found_other, note: Khách báo qua Zalo, dryRun: false }
      responses:
        '200':
          description: Đã hủy, hoặc kết quả tính thử khi `dryRun=true`
          content:
            application/json:
              schema:
                type: object
                required: [reservation, cancellation]
                properties:
                  reservation: { $ref: '#/components/schemas/Reservation' }
                  cancellation: { $ref: '#/components/schemas/CancellationQuote' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/VersionConflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /v1/properties/{propertyId}/reservations/{reservationId}/move-preview:
    parameters:
      - $ref: '#/components/parameters/PropertyId'
      - $ref: '#/components/parameters/ReservationId'
    get:
      tags: [reservations]
      operationId: previewMoveReservation
      summary: Xem trước tiền khi đổi căn / đổi ngày đơn chưa nhận phòng (B7/B8) – khách tự xin đổi căn tính giá căn mới (ESC-019 A, 0.3.7)
      description: |
        Không ghi gì (giao dịch `readOnly`), không cần `Idempotency-Key`/`If-Match`. Dùng **cùng** kiểm tra với `moveReservation`: 409 `ROOM_UNAVAILABLE`/`ROOM_BLOCKED` (kèm
        `suggestions[]`), 422 `CAPACITY_EXCEEDED`, `MIN_STAY_NOT_MET`, `OTA_DATES_LOCKED`, `NOT_IN_LIST`… để lễ tân biết trước khi lưu. Lỗi loại **cảnh báo cần lý do**
        (`CAPACITY_EXCEEDED_WARNING`, `VISA_EXPIRES_BEFORE_DEPARTURE`) không trả 422 ở đây mà nằm trong `MovePreview.warnings[]`.

        **Giá theo `reasonCode` (ESC-019 A – INV 17/10; BR-429 v0.3.5 (a)–(f), tham số `room_move_pricing`; US-024 AC5–AC7)**:
        - (a) `guest_request` (khách tự xin) **có đổi căn**: **mọi đêm** của đơn sau khi đổi lấy **lịch giá hiện hành của căn mới** từng đêm (BR-104, giá Trực tiếp/CTV), rồi áp lại
          giảm theo số đêm BR-107 và mã khách quay lại BR-111 nếu đơn có – **hai chiều** (căn đắt hơn trả thêm, rẻ hơn được giảm); đổi về lại căn cũ cũng lấy giá hiện hành.
        - (b) Do OTTIMO (`property_fault`, `overbooking`, `upgrade`, `inventory_optimize`, gán căn cho đơn xung đột) và `other`: **giữ nguyên mọi dòng** (giá từng đêm đã chốt BR-106,
          dòng chênh lệch OTA đã ghi); `other` sang căn có giá hiện hành cao hơn chỉ FDL+ như `upgrade` (FD → 403 `FORBIDDEN_ACTION`). Khách xin mà OTTIMO muốn tặng phần chênh →
          vẫn `guest_request`, phần chênh đi giảm giá đặc biệt có duyệt (`requestFoc kind=special_discount`, BR-431…433).
        - (c) Đơn **OTA** `guest_request`: giá OTA và "Đã thu qua OTA" giữ nguyên; mỗi đêm dòng `room_change_difference` = max(0, giá Trực tiếp hiện hành căn mới − căn **gốc**), căn gốc
          như BR-424 (căn gán đầu tiên, không tính nâng hạng do OTTIMO); đổi nhiều lần → đảo rồi ghi lại, không cộng dồn; đổi xuống → 0, không hoàn tiền OTA. Doanh thu phòng (BR-904),
          thu tại quầy muộn nhất khi nhận phòng.
        - Chỉ đổi/kéo dài ngày, giữ căn (mọi lý do): đêm giữ giữ giá; **đêm thêm theo BR-417 phụ lục 5A** – khách xin AN-47 (b), OTTIMO đổi căn kèm thêm đêm AN-46, **cùng hàm với B13**
          (căn khách mua, đêm tham chiếu của đơn thỏa thuận, min, kẹp sàn–trần); BR-107 tính lại. **0.3.7 bổ sung 4 (r5-5, G-1, BUG-R2-195)**: thay câu cũ "đêm thêm theo giá hiện hành"
          và "đơn thỏa thuận lễ tân nhập lại" (B7 không có ô giá từng đêm). Khách xin **có đổi căn** (a) vẫn ngoài bảng: lịch hiện hành căn mới từng đêm (AN-47 (a)).
        - (e) Cọc đã thu **không đổi**, không đòi cọc bổ sung; phần còn lại thu khi nhận phòng (BR-305); tổng mới thấp hơn số đã thu → phần thừa theo BR-522. Đơn giữ trạng thái.
        - (f) Phụ thu người theo BR-429 (khách yêu cầu: định mức căn mới; do OTTIMO: min từng đêm); FOC/giảm giá đặc biệt đã duyệt đi theo = min(số đã duyệt, giá mới) (BR-434);
          hoa hồng theo tiền phòng mới (BR-903).

        **Một hàm tính (0.3.7 bổ sung D1 – critic #10, S4-04; quyết định kỹ thuật ARC)**: operation này và `moveReservation` gọi **cùng một hàm** (module reservations, BE-A) nhận
        (đơn, yêu cầu đổi, thời điểm) và trả đủ số của `MovePreview` – giá từng đêm (BR-104/106/107/111), phụ thu người, `room_change_difference`, FOC đã duyệt đi theo (gồm FOC > giá mới →
        FOC = giá mới), FOC chờ duyệt (`pendingFocVnd`, không vào `folioDeltaVnd`). Xem trước chạy hàm trong giao dịch `readOnly`; lệnh ghi chạy **đúng hàm đó** sau khi khóa đơn → folio,
        so `expectedDeltaVnd` với `folioDeltaVnd` vừa tính, rồi ghi đúng các dòng hàm trả. Cấm tính lại riêng trong module folio. Ca kiểm bắt buộc (QA, oracle `br-examples.json`):
        BR-434-06, BR-434-09, BR-429 (101 → 401) chạy xem trước rồi lưu – không 409.
