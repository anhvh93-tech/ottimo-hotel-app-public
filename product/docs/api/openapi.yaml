  /v1/properties/{propertyId}/reservations/{reservationId}/guest-verification-code:
    parameters:
      - $ref: '#/components/parameters/PropertyId'
      - $ref: '#/components/parameters/ReservationId'
    post:
      tags: [reservations]
      operationId: issueGuestVerificationCode
      summary: Cấp mã xác minh mức 2 cho khách (6 số CSPRNG, dùng một lần, gắn token link đang hiệu lực) – SR-GST-07(b), SR-GST-13
      description: |
        Mã gắn với **token link đang hiệu lực** của đơn (cấp lại link → mã cũ vô hiệu); cấp mã mới vô hiệu mã cũ chưa dùng. Mã lưu băm.
        - `delivery=in_person|phone_call`: lễ tân đọc tại quầy hoặc gọi tới SĐT trên đơn; hạn 10 phút. Mã loại này **vẫn dùng được** khi token
          đã bị khóa xác minh do sai 5 lần (SR-GST-08) – dùng thành công thì mở khóa.
        - `delivery=airbnb_inbox|booking_inbox|agoda_inbox|zalo` (SR-GST-13, phân xử ORC 15/10): **mặc định tắt**; chỉ dùng được khi kênh có trong tham số
          `guest_verify_code_channels` (owner bật theo cơ sở) – nếu không `409 DELIVERY_CHANNEL_DISABLED`. Hạn `guest_verify_code_channel_minutes`
          (mặc định 15, tối đa 30); tối đa 3 lần/24 giờ/token; **không** mở khóa token đã bị khóa. Phản hồi kèm `messageText` từ mẫu `verify_code`
          (chỉ mã + hạn, **không chứa link**; link và mã luôn ở 2 tin khác nhau) để lễ tân sao chép, dán đúng hội thoại của đơn / Zalo của SĐT trên đơn
          bằng tài khoản của cơ sở (R2 không gửi tự động). Mã không lưu trong `message_log`.
        Chỉ gọi từ origin **admin-web** (PWA → 403). Ghi `audit_event` security mỗi lần cấp: người cấp, kênh, đơn – không ghi mã.
        Luồng khách đến khuya (SR-GST-15): người trực đêm dùng **thiết bị của cơ sở** đã được cấp để đọc mã trực tiếp.
      x-roles: [owner, manager, front_desk_lead, front_desk]
      x-rbac: [A113]
      x-stories: [US-106, US-111, US-141]
      x-rate-limit: kênh nhắn tin 3 lần/24 giờ/token; tại quầy/điện thoại 5 lần/giờ/đơn
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [delivery]
              properties:
                delivery: { type: string, enum: [in_person, phone_call, airbnb_inbox, booking_inbox, agoda_inbox, zalo] }
                locale: { type: string, enum: [vi, en, ru], description: Ngôn ngữ mẫu `verify_code` khi gửi qua kênh }
      responses:
        '201':
          description: Mã vừa cấp (chỉ trả một lần)
          headers:
            Cache-Control: { schema: { type: string, enum: [no-store] } }
          content:
            application/json:
              schema:
                type: object
                required: [code, expiresAt]
                properties:
                  code: { type: string, pattern: '^[0-9]{6}$' }
                  expiresAt: { $ref: '#/components/schemas/Instant' }
                  messageText: { type: string, description: 'Chỉ khi gửi qua kênh – nội dung mẫu `verify_code` (mã + hạn, không link)' }
              example: { code: '407219', expiresAt: '2026-10-19T14:10:00+07:00' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /v1/properties/{propertyId}/reservations/{reservationId}/door-credential:
    parameters:
      - $ref: '#/components/parameters/PropertyId'
      - $ref: '#/components/parameters/ReservationId'
    get:
      tags: [doorlock]
      operationId: getDoorCredential
      summary: Xem mã cửa (C3 – ghi c3_access_log, no-store) (US-128)
      description: |
        Cùng mức kiểm soát với `renderDoorCodeMessage` (trả cùng giá trị C3 – BUG-R1-SEC-10, quyết định SEC 16/10):
        thiết bị tin cậy (`403 DEVICE_NOT_TRUSTED`) → step-up trong cửa sổ trượt `c3_stepup_minutes` (hết cửa sổ → `401 REAUTH_REQUIRED`)
        → quyền vai (`403 FORBIDDEN_ACTION` + `audit_event access.denied`) → ghi **một** dòng `c3_access_log`
        (`door_credential`/`view`) **trước khi** trả mã; ghi log lỗi → `500`, không trả mã. Rate limit chung bộ đếm với
        `renderDoorCodeMessage` (`429 RATE_LIMITED`). Mỗi thao tác C3 thành công gia hạn cửa sổ step-up (SR-C3-09).
      x-roles: [owner, manager, front_desk_lead, front_desk]
      x-rbac: [A21]
      x-classification: C3
      x-requires-trusted-device: true
      x-step-up: true
      x-c3-log: { subjectType: door_credential, action: view }
      x-rate-limit: 60/giờ/người cảnh báo, 200/giờ chặn (SR-RL-06)
      x-stories: [US-128]
      responses:
        '200':
          description: OK
          headers:
            Cache-Control: { schema: { type: string, enum: [no-store] } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DoorCredential' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
    put:
      tags: [doorlock]
      operationId: setDoorCredential
      summary: Nhập/sửa mã cửa và hiệu lực (MVP nhập tay; mặc định hiệu lực = giờ nhận → giờ trả, BR-403) (US-128 AC1)
      description: |
        Bỏ trống `code` → lõi sinh 6 chữ số từ CSPRNG, không trùng mã đang hiệu lực trên cùng khóa, không tái dùng cho căn trong 90 ngày (SR-LOCK-01).
        Lần tạo đầu: `If-Match` không áp dụng; sửa mã đã có: bắt buộc `If-Match` (chống gửi lại ghi đè mã mới bằng mã cũ – SR-KEY-08 thẻ SEC-ARC-24).
        Đặt mã do người dùng chọn = biết mã → **step-up** như `getDoorCredential` (BUG-R1-SEC-10): hết cửa sổ → `401 REAUTH_REQUIRED`;
        thiết bị không tin cậy → `403 DEVICE_NOT_TRUSTED`. Ghi `c3_access_log` `door_credential` trong **cùng giao dịch** với thao tác ghi
        (`action=create` lần đầu, `update` khi sửa); phản hồi chỉ trả bản che (không trả lại mã), `Idempotency-Key` không lưu giá trị C3.
      x-roles: [owner, manager, front_desk_lead, front_desk]
      x-rbac: [A21]
      x-classification: C3
      x-requires-trusted-device: true
      x-step-up: true
      x-c3-log: { subjectType: door_credential, action: update, onCreate: create }
      x-stories: [US-128]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      x-blocked-by: 'Registration.blocksDoorCode = true → 409 INVALID_TRANSITION (BR-613 c)'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DoorCredentialInput' }
            example: { kind: pin, code: '582913', validFrom: '2026-10-19T14:00:00+07:00', validTo: '2026-10-22T12:00:00+07:00', cardsIssued: 2 }
      responses:
        '200':
          description: OK (trả bản che, không trả lại mã)
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DoorCredentialMasked' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/VersionConflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
