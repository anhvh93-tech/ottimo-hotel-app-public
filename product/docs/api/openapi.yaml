            properties:
              description: { type: string, description: 'Chữ dòng đã dịch theo ngôn ngữ phiên từ `labelKey`/`labelParams`; tiền phòng ghi **tên phòng**, không số căn (0.3.7 bổ sung D1, BR-012 (1))' }
              serviceDate: { $ref: '#/components/schemas/LocalDate' }
              quantity: { type: number }
