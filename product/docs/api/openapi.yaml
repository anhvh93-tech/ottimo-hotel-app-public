        - Link chờ **kế thừa** bộ đếm xác minh sai/khóa của link đang dùng (không reset `failed_verify_count`, `verify_locked_until` – SR-GST-08).
        - Đơn **không có email** → không cấp token, không đổi trạng thái token nào, không gửi gì (phản hồi vẫn như trên).
        - Mỗi lần xử lý (kể cả không gửi) ghi `audit_event category='security'` (`guest_link.resend_from_unit`, căn, đơn nếu khớp, IP HMAC; không ghi token).
