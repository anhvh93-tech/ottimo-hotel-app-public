  /v1/users/{userId}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    patch:
      tags: [users]
      operationId: updateUser
      summary: Khóa/mở tài khoản, đổi tên hiển thị, đặt lại mật khẩu
      description: |
        `status=disabled` hoặc `resetPassword` → **thu hồi ngay mọi phiên** của người đó (SR-SES-06), tăng `roles_version`,
        ghi `audit_event` security. `resetPassword` đặt mật khẩu tạm + `must_change_password=true` (SR-AUTH-05).
        Khóa (`status=disabled`) OWN `active` cuối cùng của một cơ sở → `422 VALIDATION_FAILED` mã trường `LAST_OWNER` (`field: status`; rbac 5.3).
      x-roles: [owner]
      x-rbac: [A100]
      x-stories: [US-002]
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                displayName: { type: string }
                status: { type: string, enum: [active, disabled] }
                resetPassword: { type: string, writeOnly: true, minLength: 10, maxLength: 256, description: 'V-10 (khớp `newPassword`); 0.3.1 nâng từ 8' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '412': { $ref: '#/components/responses/VersionConflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /v1/users/{userId}/roles:
    parameters:
      - $ref: '#/components/parameters/UserId'
    put:
      tags: [users]
      operationId: setUserRoles
      summary: Gán toàn bộ vai theo cơ sở cho tài khoản (US-002 AC1). Có hiệu lực ngay – thu hồi mọi phiên đang chạy của người đó.
      description: |
