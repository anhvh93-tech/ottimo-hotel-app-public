  /v1/properties/{propertyId}/approval-requests/{approvalId}/actions/approve:
    parameters:
      - $ref: '#/components/parameters/PropertyId'
      - $ref: '#/components/parameters/ApprovalId'
    post:
      tags: [approvals]
      operationId: approveRequest
      summary: Duyệt bằng xác nhận lại của chính người duyệt (A3; BR-432, 433; US-007 AC2, AC3)
      description: |
        **0.3.8 bổ sung 6 (ARC 24/10, critic M-1 – lớp chặn ở bước duyệt)**: `type = refund` – dưới khóa folio, server so `amountVnd` với **tiền dư còn trống**
        (`rawCreditVnd` − các yêu cầu hoàn **đã duyệt chưa chi** khác của folio). Vượt → server chạy lại `refundPlan` (yêu cầu này thành `cancelled` `superseded`, xin lại
        đúng số nếu còn dư) và trả **409 `INVALID_TRANSITION`** (`currentState = cancelled`, `autoCancelReason = superseded`); không duyệt gì. Màn duyệt tải lại hàng chờ.
        **R2: nhập lại mật khẩu** của chính tài khoản đang đăng nhập (`authMethod=password`, decision-log PO 15/10); **R3**: PIN duyệt
        (`authMethod=pin`, SR-AUTH-09) hoặc TOTP. Không chọn tên người duyệt. Người duyệt = người gửi → `403 SELF_APPROVAL_FORBIDDEN`
        (trừ MGR/OWN). Vượt hạn mức lần/tháng → yêu cầu chuyển `escalated` và trả `403 APPROVAL_LIMIT_EXCEEDED`.
        Sai → `401 REAUTH_FAILED` + `errors[{field: secret, code: REAUTH_FAILED}]` (5 sai/15 phút → khóa duyệt – SR-RL-02; 0.3.4 Q4).
        **0.3.7 (B-6, CỔNG – BE-B + FE-A cùng PR)**: `expectedVersion` = `ApprovalRequest.version` người duyệt đang xem – **bắt buộc với `type = refund`** (thiếu → 422 `REQUIRED`), lệch → 412
        `VERSION_CONFLICT` (`currentVersion`): người duyệt không duyệt một nơi nhận/số tiền đã đổi sau khi mở. Loại khác: tùy chọn (có thì vẫn so). Không dùng header `If-Match`
        vì guard dùng chung bật `If-Match` cho **cả** operation theo hợp đồng (mọi loại sẽ bắt buộc, vỡ luồng FOC).
        **0.3.7 bổ sung 4 (FB-R2-SEC-BE-80, BR-525; ARC 16.30)**: yêu cầu FOC `reasonCode = debt_write_off` chỉ áp min(`amountVnd`, công nợ đang mở **lúc duyệt**) – phản hồi `status = approved`,
        `amountVnd` giữ số xin (SM-10), `effectiveAmountVnd` = số thực áp (giữ cố định về sau). Công nợ đã về 0 (khách trả đủ trong lúc chờ) → vẫn **200**: lệnh duyệt thành công, hệ thống
        đóng yêu cầu trong cùng giao dịch – phản hồi `status = cancelled`, `autoCancelReason = debt_cleared`, `effectiveAmountVnd = 0`; không ghi dòng FOC, không tính hạn mức người duyệt, báo
        người gửi (`approval_cancelled`). Client đọc `status` của phản hồi, không mặc định "đã duyệt". Gửi lại cùng `Idempotency-Key` → cùng phản hồi.
      x-roles: [owner, manager, front_desk_lead]
      x-rbac: [A36]
      x-transition: [A3, A4, A7]
      x-stories: [US-007]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [authMethod, secret]
              properties:
                authMethod: { type: string, enum: [password, pin], description: 'R2 chỉ `password`; `pin` từ R3' }
                secret: { type: string, writeOnly: true, minLength: 6, maxLength: 256 }
                note: { type: string, maxLength: 300 }
                expectedVersion: { type: integer, minimum: 0, description: '0.3.7 (B-6, CỔNG) – `ApprovalRequest.version` đang xem; bắt buộc với `type = refund`' }
      responses:
        '200':
          description: Đã xử lý – yêu cầu như sau lệnh duyệt. Thường `approved` (folio có dòng gốc + dòng FOC âm); `debt_write_off` có thể `approved` với `effectiveAmountVnd` < `amountVnd`, hoặc `cancelled` (`autoCancelReason = debt_cleared`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApprovalRequest' }
        '401': { $ref: '#/components/responses/ReauthFailed' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/VersionConflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
