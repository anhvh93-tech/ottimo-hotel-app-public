      - $ref: '#/components/parameters/WorkOrderId'
      - name: action
        in: path
        required: true
        description: 'accept (W2), wait-parts / resume (W3), complete (W4 – mở khóa OOO → VD + việc dọn), cancel (W5), reopen (W6)'
        schema: { type: string, enum: [accept, wait-parts, resume, complete, cancel, reopen] }
    post:
      tags: [maintenance]
      operationId: transitionWorkOrder
      summary: Chuyển trạng thái phiếu sửa chữa SM-04 (US-062)
      description: |
        **0.3.7 (B-10, B-11; BA EP07-08 6.5)**: `accept` → `acceptedAt` (người bấm thành người xử lý nếu chưa giao); `wait-parts` bắt buộc `note` và (mức `medium`/`low`) `partsExpectedDate`
        – dừng hạn BR-809; `complete` bắt buộc `resultNote`, ảnh sau sửa theo `wo_done_photo_required_severities` (mặc định `[high, medium]`, DOM D-15) → `doneAt`; khối OOO liên kết →
        `released`, `endDateActual` = ngày nghiệp vụ kế tiếp, buồng `OOO → VD` + `after_repair_clean`; `cancel` bắt buộc `cancelReason` (MT chỉ phiếu mình tạo còn `new`); `reopen` bắt buộc
        `note`, trong kỳ ở của khách căn đó hoặc ≤ 7 ngày từ `done` (DOM D-12 g). Mọi chuyển ghi `history[]`. Chỉ online (không xếp hàng offline).
      x-roles: [owner, manager, front_desk_lead, front_desk, maintenance]
      x-rbac: [A85]
      x-transition: [W2, W3, W4, W5, W6]
      x-stories: [US-062]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string, maxLength: 500, description: '`wait-parts` (vật tư cần – bắt buộc 3–500), `reopen` (bắt buộc); hành động khác tùy chọn' }
                partsExpectedDate:
                  $ref: '#/components/schemas/LocalDate'
                  description: '0.3.7 (B-10): `wait-parts` – bắt buộc với mức `medium`/`low` (thiếu → 422 `REQUIRED`), ≥ hôm nay (`DATE_IN_PAST`); quá ngày mà vẫn chờ → cảnh báo lại + "Cần chú ý" `work_order_overdue`'
                resultNote: { type: string, minLength: 3, maxLength: 500, description: '0.3.7 (B-10): **bắt buộc** với `complete` (thiếu → 422 `REQUIRED`), V-09' }
                photoAttachmentIds:
                  type: array
                  maxItems: 4
                  items: { $ref: '#/components/schemas/Uuid' }
                  description: '0.3.7 (B-10): ảnh sau sửa (`uploadAttachment purpose=work_order`) – `complete` cần ≥ 1 khi mức phiếu thuộc `wo_done_photo_required_severities` → thiếu: 422 `EVIDENCE_REQUIRED`'
                cancelReason: { type: string, minLength: 3, description: '`cancel` – bắt buộc (V-08)' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkOrder' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/VersionConflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
