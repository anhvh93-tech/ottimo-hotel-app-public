    put:
      tags: [users]
      operationId: setUserRoles
      summary: Gán toàn bộ vai theo cơ sở cho tài khoản (US-002 AC1). Có hiệu lực ngay – thu hồi mọi phiên đang chạy của người đó.
      description: |
        Trong cùng giao dịch: ghi `user_property_role`, tăng `app_user.roles_version`, đặt `revoked_at` cho mọi `user_session` của người đó
        (SR-SES-06, SR-AZ-08). Request kế tiếp của phiên cũ nhận `401 UNAUTHENTICATED`. Ghi `audit_event` security.
      x-roles: [owner]
      x-rbac: [A100]
      x-stories: [US-002]
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
