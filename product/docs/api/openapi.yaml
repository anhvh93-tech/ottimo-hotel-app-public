          required: [id, code, status, expiresAt, version]
          properties:
            id: { $ref: '#/components/schemas/Uuid' }
            code: { type: string, example: BG-00049 }
            status: { $ref: '#/components/schemas/QuoteStatus' }
            guestId: { $ref: '#/components/schemas/Uuid' }
            leadId: { $ref: '#/components/schemas/Uuid' }
            roomId: { $ref: '#/components/schemas/Uuid' }
            arrivalDate: { $ref: '#/components/schemas/LocalDate' }
            createdAt: { $ref: '#/components/schemas/Instant' }
            expiresAt: { $ref: '#/components/schemas/Instant' }
            convertedReservationId: { $ref: '#/components/schemas/Uuid' }
            websiteBookingRequestId: { $ref: '#/components/schemas/Uuid', description: '0.3.7 bổ sung 2 – yêu cầu từ website mà báo giá trả lời (US-155)' }
            version: { type: integer }
    Lead:
      type: object
      required: [id, guestId, status]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        guestId: { $ref: '#/components/schemas/Uuid' }
        guestDisplayName: { type: string, x-rbac-field: D28 }
        need: { type: string }
        status: { $ref: '#/components/schemas/LeadStatus' }
        ownerUserId: { $ref: '#/components/schemas/Uuid' }
