  /v1/users/{userId}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    patch:
      tags: [users]
      operationId: updateUser
      summary: Khóa/mở tài khoản, đổi tên hiển thị, đặt lại mật khẩu
      description: |
        `status=disabled` hoặc `resetPassword` → **thu hồi ngay mọi phiên** của người đó (SR-SES-06), tăng `roles_version`,
        ghi `audit_event` security. `resetPassword` đặt mật khẩu tạm + `must_change_password=true` (SR-AUTH-05).
      x-roles: [owner]
      x-rbac: [A100]
      x-stories: [US-002]
