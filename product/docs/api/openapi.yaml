            etaTime: { $ref: '#/components/schemas/LocalTime' }
            guestDisplayName: { type: string, x-rbac-field: D01, description: '0.3.7 bổ sung 4 (BR-614): **HK** = tên gọi (cùng quy tắc `currentGuest`), **MT** không nhận, **FD trở lên** = họ tên đầy đủ; chỉ tên, không kèm số căn; chưa có tên → vắng' }
        serviceNotes: { type: array, items: { type: string }, description: '"Lưu ý phục vụ" từ danh mục (rbac D12)', x-rbac-field: D12a }
        allowedEvents: { type: array, items: { type: string, enum: [start_cleaning, finish_cleaning, needs_cleaning, inspect] } }
        openTaskIds: { type: array, items: { $ref: '#/components/schemas/Uuid' } }
        inspectionFailed: { type: boolean, description: '0.3.7 (BA E07-17, DOM D-12 d): lần kiểm gần nhất `fail`, chưa có lần đạt sau – chip "Kiểm chưa đạt"' }
        version: { type: integer }
    InspectionInput:
      type: object
      required: [checklistVersion, items, performedAt]
