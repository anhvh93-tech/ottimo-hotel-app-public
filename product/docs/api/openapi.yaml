                  paymentModel: direct
                  manualLongStay: { monthlyRentVnd: 9500000, externalContractRef: HĐ-2026-031, depositHeldVnd: 9500000 }
              ota:
                summary: Đơn Booking.com nhập tay (US-017 AC1)
                value:
                  roomId: 0192a1b0-0000-7000-8000-0000000c0203
