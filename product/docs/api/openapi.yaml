        nếu không → 409 `REGISTRATION_INCOMPLETE` (`errors[{field: party_count}]`, `missingCount`), khai báo giữ trạng thái; Desk hiện "Còn thiếu giấy tờ của {n} người…".
      x-roles: [owner, manager, front_desk_lead, front_desk]
      x-rbac: [A73]
