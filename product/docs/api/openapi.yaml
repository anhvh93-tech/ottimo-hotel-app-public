                    properties:
                      documentId: { $ref: '#/components/schemas/Uuid' }
                      checkCode: { $ref: '#/components/schemas/DocumentCheckCode' }
                      note: { type: string, minLength: 3, maxLength: 500, description: 'V-09 – không ghi lại số giấy tờ' }
                      manualResult: { type: string, enum: [pass, fail], description: 'Bắt buộc với mục `unverified` chưa có `manualResult` (0.3.3, E06-01)' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Registration' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/VersionConflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /v1/properties/{propertyId}/registrations/{registrationId}/documents/{documentId}/checks/{checkCode}:
    parameters:
      - $ref: '#/components/parameters/PropertyId'
      - $ref: '#/components/parameters/RegistrationId'
      - $ref: '#/components/parameters/DocumentId'
      - name: checkCode
        in: path
        required: true
        schema: { $ref: '#/components/schemas/DocumentCheckCode' }
    put:
      tags: [registration]
      operationId: recordDocumentCheck
      summary: Lễ tân ghi kết quả kiểm tay / ghi chú xử lý cho một mục đối chiếu (nút "Đạt"/"Không đạt" ở bước Kiểm tra) – US-044 AC2, AC4
      description: |
        **0.3.3 (E06-01)** – để kết quả kiểm tay có hiệu lực **trước** nhận phòng (B9 chỉ cần khai báo ≥ `partial`, chưa cần K5).
        - Mục `unverified`: `manualResult` (bắt buộc) + `note`. Mục `fail`: chỉ `note` (`manualResult` gửi lên → 422 `NOT_IN_LIST` – không "sửa" kết quả hệ thống).
          Mục `pass`/`not_applicable` → `409 INVALID_TRANSITION`.
        - `note` 3–500 ký tự, V-09, không chứa số giấy tờ (thiếu → 422 `CHECK_NOTE_REQUIRED`).
        - Server tính lại `blocking` và `Registration.blocksDoorCode` trong cùng giao dịch; ghi nhật ký (người, thời điểm, kết quả) – không phải dữ liệu C3.
        - Gọi lại = ghi đè kết quả kiểm tay trước (có nhật ký). Khai báo đã `sent`/`confirmed` → `409 INVALID_TRANSITION`.
      x-roles: [owner, manager, front_desk_lead, front_desk]
      x-rbac: [A70]
      x-requires-trusted-device: true
      x-stories: [US-044]
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [note]
              properties:
                manualResult: { type: string, enum: [pass, fail] }
                note: { type: string, minLength: 3, maxLength: 500 }
            example: { manualResult: pass, note: 'Đã xem dấu nhập cảnh trên hộ chiếu gốc, trang 12' }
      responses:
        '200':
          description: OK – khai báo sau khi tính lại `blocksDoorCode`
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Registration' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/VersionConflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
