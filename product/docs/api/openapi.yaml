              properties:
                amountVnd: { $ref: '#/components/schemas/MoneyVnd' }
                paidAt: { $ref: '#/components/schemas/Instant' }
                attachmentId: { $ref: '#/components/schemas/Uuid', description: 'Ảnh biên nhận khách ký nhận tiền (`purpose=refund_proof`)' }
                note: { type: string, maxLength: 300 }
      responses:
        '201':
          description: Đã ghi giao dịch hoàn tiền mặt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payment' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /v1/properties/{propertyId}/approval-requests/{approvalId}/actions/execute-refund:
    parameters:
      - $ref: '#/components/parameters/PropertyId'
      - $ref: '#/components/parameters/ApprovalId'
    post:
      tags: [approvals]
      operationId: executeRefund
      summary: Ghi giao dịch hoàn đã chi theo yêu cầu `refund` `approved` – OWN/MGR, mọi cách hoàn (A47, BR-522, SEC F8)
      description: |
        0.3.6 (A-33). **Chỉ nơi nhận `bank_transfer`/`original_method`** (nơi nhận `cash` → `409 INVALID_TRANSITION`, dùng `executeCashRefund` – PO 16/10).
        Ghi `payment` `type=refund` (`succeeded`, `approvalRequestId`) trên folio của yêu cầu – nhận cả khi folio `settled` (không đổi bill).
        Kiểm dưới `FOR UPDATE` của folio + yêu cầu: yêu cầu `approved`, có nơi nhận (`409 REFUND_DESTINATION_REQUIRED`), người duyệt ≠ người tạo (CHECK DB);
        `amountVnd` ≤ số duyệt − `refundedVnd` **và** ≤ đã thu − đã hoàn của folio (server tính) → 422 `REFUND_EXCEEDS_APPROVED`. **0.3.6 bổ sung 2 (BA v0.3, ARC 17/10) (E15-05)**: và ≤ `creditVnd`
        hiện tại; phần thừa sinh từ khoản thu chưa đối soát (`pending`/`disputed`) → `409 REFUND_SOURCE_NOT_RECONCILED` (`paymentIds[]`, `unreconciledVnd`). `method` theo nơi nhận
        (`cash` → ghi vào ca đang mở; `bank_transfer`; `original_method` → phương thức gốc). Hoàn đủ → hủy DEK `refund_account` trong cùng giao dịch (T09,
        `c3_access_log purge`). Audit `money`; phát `payment.changed`, `reservation.changed`.
        **Đối soát chi hoàn (DOM G-14)**: `bank_transfer` → `reconciliation = pending`, đối soát bằng `reconcilePayment` như khoản thu (người đối soát ≠ người chi);
        `cash` → `not_required`, tính vào ca. Folio số dư về 0 khi đã hoàn đủ `creditVnd`. Nguồn yêu cầu `refund`: hủy có cọc (B10), trả sớm (B16), dời ra ngoài
        (`resolveOverbookingExternal`, BE-12), trả thừa khi trả phòng (A-34), yêu cầu tay (`createRefundRequest`). Người chi ≠ người tạo yêu cầu → `403 SELF_REFUND_FORBIDDEN`.
      x-roles: [owner, manager]
      x-rbac: [A47]
      x-stories: [US-123]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amountVnd, paidAt]
              properties:
                amountVnd: { $ref: '#/components/schemas/MoneyVnd' }
                paidAt: { $ref: '#/components/schemas/Instant' }
                bankReference: { type: string, maxLength: 64, description: 'Mã giao dịch ngân hàng – **bắt buộc** khi nơi nhận `bank_transfer` hoặc hoàn qua POS (`REQUIRED`) – 0.3.6 E15-02' }
                attachmentId: { $ref: '#/components/schemas/Uuid', description: 'Ảnh ủy nhiệm chi / biên nhận ký nhận (`uploadAttachment purpose=refund_proof`) – **bắt buộc** khi `bank_transfer` (`EVIDENCE_REQUIRED`), không bắt buộc với `cash` – 0.3.6 E15-02' }
                note: { type: string, maxLength: 300 }
      responses:
        '201':
          description: Đã ghi giao dịch hoàn
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payment' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
