                    0.3.6 bổ sung 2 (BA v0.3, ARC 17/10) (E04-06, BR-011): bắt buộc khi `noticeGivenAt` sớm hơn lúc thao tác quá `manual_time_tolerance_minutes` hoặc khác ngày nghiệp vụ
                    (thiếu → 422 `EVIDENCE_REQUIRED`, `field` = `noticeEvidence`). Ảnh (tin nhắn khách…) `purpose=penalty_evidence` cùng `reservationId`.
                  required: [note]
                  properties:
                    note: { type: string, minLength: 3, maxLength: 500, x-rbac-field: D12c }
                    attachmentId: { $ref: '#/components/schemas/Uuid' }
      responses:
        '200':
          description: |
            0.3.6 bổ sung 2 (BA v0.3, ARC 17/10) (E04-06): đổi từ `Reservation` sang `EarlyDepartureResult` (FE chưa làm màn B16 – không vỡ client). Cơ sở BR-428 = giá **ròng** đêm bỏ
            (`room_revenue_vnd`, sau bậc BR-107 và FOC/giảm giá); phụ thu người đêm bỏ hoàn 100 %; yêu cầu hoàn = min(phần hoàn + phụ thu người đêm bỏ,
            `unhandledCreditVnd`), làm tròn nửa lên; không tính lại bậc BR-107 (DOM S3-1/S3-2).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EarlyDepartureResult' }
