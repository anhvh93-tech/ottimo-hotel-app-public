# QA – throwaway stack for the US-155 E2E (tests/e2e/ui/us155-website-requests.r3.spec.ts). Overlay on
# infra/docker-compose.yml; NEVER for dev/demo/staging. Relative paths resolve from infra/ (the first file's folder).
#
#   own project (-p ottimo-qa155), own images (… build api web → ottimo-api:qa155 / ottimo-web:qa155),
#   own ports: api 53155, Desk 58151/58152/58153, landing 58150 (https), PostgreSQL 55155 (127.0.0.1 only)
#   + `landing`: the REAL landing image (infra/docker/Dockerfile.landing, form build-args) with the REAL OPS
#     infra/caddy/Caddyfile.landing (LANDING_PUBLIC_API=on, host landing.localhost – Caddy's internal CA), on a fixed
#     address the api trusts (TRUST_PROXY), like `edge` in docker-compose.prod.yml. Only its TLS port is published.
#
# Build the landing image (slug = DS-E property DLT):
#   docker build -f infra/docker/Dockerfile.landing --build-arg LANDING_BOOKING_FORM=true \
#     --build-arg LANDING_PROPERTY_SLUG=dlt -t ottimo-landing:qa155 .
# .env of the stack: infra/ci/make-ci-env.sh .env.example <file>, then add (fresh random key, never a real one):
#   PUBLIC_FORM_SIGNING_KEY=<openssl rand -hex 32>   LANDING_BASE_URL=https://landing.localhost:58150
#   API_ADMIN_BASE_URL=http://127.0.0.1:58151  API_STAFF_BASE_URL=http://127.0.0.1:58152  API_GUEST_BASE_URL=http://127.0.0.1:58153
# Up + seed:  docker compose -p ottimo-qa155 --env-file <file> -f infra/docker-compose.yml \
#               -f tests/e2e/support/us155-stack/compose.us155.yml up -d  (then … run --rm seed)
# Run: E2E_UI=1 E2E_COMPOSE_CONTROL=1 E2E_COMPOSE_PROJECT=ottimo-qa155 E2E_COMPOSE_ENV_FILE=<file>
#      E2E_API_URL=http://127.0.0.1:53155 E2E_WEB_URL=http://127.0.0.1:58151 E2E_ORIGIN=http://127.0.0.1:58151
#      E2E_LANDING_URL=https://landing.localhost:58150 QA_SEED_PASSWORD=… TEST_SUPPORT_TOKEN=… (from <file>)
#      pnpm --filter @ottimo/tests exec playwright test -c e2e/playwright.config.ts --project=desk-chromium \
#        e2e/ui/us155-website-requests.r3.spec.ts
# Restart the api between two runs within an hour (RAM limit 30 public calls/hour/IP – C-11 step 0).
networks:
  default:
    ipam:
      config:
        - subnet: 172.31.155.0/24

services:
  postgres:
    ports: !override
      - '127.0.0.1:55155:5432'
  migrate:
    image: ottimo-api:qa155
  api:
    image: ottimo-api:qa155
    environment:
      LANDING_BASE_URL: ${LANDING_BASE_URL:?LANDING_BASE_URL}
      PUBLIC_FORM_SIGNING_KEY: ${PUBLIC_FORM_SIGNING_KEY:?PUBLIC_FORM_SIGNING_KEY}
      # Like production: X-Forwarded-For is trusted from the landing Caddy only.
      TRUST_PROXY: 172.31.155.11
    ports: !override
      - '127.0.0.1:53155:3000'
  worker:
    image: ottimo-api:qa155
    environment:
      LANDING_BASE_URL: ${LANDING_BASE_URL:?LANDING_BASE_URL}
      PUBLIC_FORM_SIGNING_KEY: ${PUBLIC_FORM_SIGNING_KEY:?PUBLIC_FORM_SIGNING_KEY}
  web:
    image: ottimo-web:qa155
    ports: !override
      - '127.0.0.1:58151:8081'
      - '127.0.0.1:58152:8082'
      - '127.0.0.1:58153:8083'
  seed:
    image: ottimo-api:qa155
  landing:
    image: ottimo-landing:qa155
    pull_policy: never
    sysctls:
      net.ipv4.ip_unprivileged_port_start: '0'
    environment:
      LANDING_HOST: landing.localhost
      LANDING_WWW_HOST: www.landing.localhost
      ACME_EMAIL: ops@example.invalid
      LANDING_PUBLIC_API: 'on'
      LANDING_API_UPSTREAM: api:3000
    volumes:
      - ./caddy/Caddyfile.landing:/etc/caddy/Caddyfile:ro
      - ../tests/e2e/support/us155-stack/landing_access.production:/run/secrets/landing_access:ro
    networks:
      default:
        ipv4_address: 172.31.155.11
    ports:
      - '127.0.0.1:58150:443'
    depends_on:
      api:
        condition: service_healthy
