<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>OTTIMO Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;1,500&family=Be+Vietnam+Pro:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#F4F0E8; --surface:#FBF9F4; --surface2:#EEE8DC; --side:#ECE5D8;
  --ink:#2B2B2B; --muted:#6B6760; --faint:#9A948A; --line:#E0D8CA;
  --oak:#B08D57; --oak-ink:#86693B; --oak-soft:#F1E7D6;
  --bar-in:#2F2D2A; --bar-in-t:#F4F0E8;
  --bar-cf:#C9A56E; --bar-cf-t:#2B2B2B;
  --bar-long:#5B7387; --bar-long-t:#FFFFFF;
  --ok:#3D7552; --ok-bg:#E2EEE5; --warn:#9A5F1C; --warn-bg:#F5E8D3;
  --bad:#A8403C; --bad-bg:#F5DFDC; --info:#3E5E78; --info-bg:#E0E8EF;
  --shadow:0 1px 2px rgba(43,43,43,.06),0 8px 24px rgba(43,43,43,.08);
  --serif:"Lora",Georgia,"Times New Roman",serif;
  --sans:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#1B1A18; --surface:#24221F; --surface2:#2D2A26; --side:#201E1C;
    --ink:#EDE8DF; --muted:#A9A398; --faint:#7D776E; --line:#38342F;
    --oak:#C9A56E; --oak-ink:#D9B987; --oak-soft:#3A3226;
    --bar-in:#E3DCCF; --bar-in-t:#1B1A18; --bar-cf:#B8925A; --bar-cf-t:#1B1A18; --bar-long:#7E98AD; --bar-long-t:#111;
    --ok:#7FBF95; --ok-bg:#22352A; --warn:#E0A866; --warn-bg:#3A2E1E; --bad:#E58A84; --bad-bg:#3D2422; --info:#8DB0CC; --info-bg:#22303B;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#1B1A18; --surface:#24221F; --surface2:#2D2A26; --side:#201E1C;
  --ink:#EDE8DF; --muted:#A9A398; --faint:#7D776E; --line:#38342F;
  --oak:#C9A56E; --oak-ink:#D9B987; --oak-soft:#3A3226;
  --bar-in:#E3DCCF; --bar-in-t:#1B1A18; --bar-cf:#B8925A; --bar-cf-t:#1B1A18; --bar-long:#7E98AD; --bar-long-t:#111;
  --ok:#7FBF95; --ok-bg:#22352A; --warn:#E0A866; --warn-bg:#3A2E1E; --bad:#E58A84; --bad-bg:#3D2422; --info:#8DB0CC; --info-bg:#22303B;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
:focus-visible{outline:2px solid var(--oak);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* shell */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.side{background:var(--side);border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh;height:100dvh}
.brand{font-family:var(--serif);font-weight:600;letter-spacing:.3em;font-size:16px;padding-left:10px}
.brand small{display:block;font-family:var(--sans);font-weight:500;letter-spacing:.2em;font-size:9.5px;color:var(--muted);margin-top:3px}
.nav{display:grid;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;border:0;background:none;text-align:left;padding:9px 10px;border-radius:8px;color:var(--muted);font-weight:500}
.nav button svg{width:18px;height:18px;flex:none}
.nav button:hover{background:var(--surface2);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 0 var(--line)}
.nav button[aria-current="page"] svg{color:var(--oak)}
.nav .sec{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);padding:14px 10px 4px;font-weight:600}
.side-foot{margin-top:auto;font-size:12px;color:var(--muted);padding:0 10px}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 28px;border-bottom:1px solid var(--line);background:var(--bg);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.topbar h1{font-family:var(--serif);font-weight:500;font-size:22px;margin:0;flex:1;min-width:0;text-wrap:balance}
.topbar .date{color:var(--muted);font-size:13px}
.role{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.role select{width:auto;padding:6px 8px}
.demo-badge{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--oak-ink);background:var(--oak-soft);padding:4px 8px;border-radius:999px}
.content{padding:24px 28px 96px;display:grid;gap:22px;align-content:start;grid-template-columns:minmax(0,1fr)}
.content>*,.grid>*,.card{min-width:0}
.mnav{display:none}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  .topbar{padding:12px 16px}
  .topbar h1{font-size:19px}
  .content{padding:16px 16px 110px}
  .mnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));overflow-x:auto;gap:2px}
  .mnav button{flex:1 0 64px;border:0;background:none;display:grid;justify-items:center;gap:2px;font-size:10.5px;color:var(--muted);padding:6px 2px;border-radius:8px}
  .mnav button svg{width:20px;height:20px}
  .mnav button[aria-current="page"]{color:var(--ink);background:var(--surface2)}
  .mnav button[aria-current="page"] svg{color:var(--oak)}
  .demo-badge{display:none}
}

/* generic blocks */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
h2{font-family:var(--serif);font-weight:500;font-size:18px;margin:0;text-wrap:balance}
h3{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0}
.sub{color:var(--muted);font-size:12.5px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-dash{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
@media (max-width:1100px){.g-dash{grid-template-columns:1fr}}
@media (max-width:760px){.g2,.g3{grid-template-columns:1fr}}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:900px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:2px}
.kpi .k{font-size:12px;color:var(--muted)}
.kpi .v{font-family:var(--serif);font-size:26px;line-height:1.2}
.kpi .d{font-size:12px;color:var(--muted)}
.up{color:var(--ok)} .down{color:var(--bad)}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:8px;font-weight:500;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--oak)}
.btn.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.chip .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.s-ok{background:var(--ok-bg);color:var(--ok)} .s-warn{background:var(--warn-bg);color:var(--warn)}
.s-bad{background:var(--bad-bg);color:var(--bad)} .s-info{background:var(--info-bg);color:var(--info)}
.s-oak{background:var(--oak-soft);color:var(--oak-ink)}
.list{display:grid}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:500}
.row .m{font-size:12px;color:var(--muted)}
.roomno{font-family:var(--serif);font-size:17px;min-width:40px}
.empty{color:var(--muted);font-size:13px;padding:8px 0}
.seg{display:inline-flex;background:var(--surface2);border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 12px;border-radius:7px;font-size:13px;color:var(--muted);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
td.r,th.r{text-align:right}
tr.tot td{font-weight:600;border-bottom:0}
.note{font-size:12px;color:var(--muted)}

/* rack */
.rack-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.rack{display:grid;min-width:880px;position:relative}
.rack .hd{font-size:11px;color:var(--muted);text-align:center;padding:8px 0;border-bottom:1px solid var(--line);border-left:1px solid var(--line)}
.rack .hd b{display:block;font-size:14px;color:var(--ink);font-weight:600}
.rack .hd.today{background:var(--oak-soft)}
.rack .hd.today b{color:var(--oak-ink)}
.rack .rl{padding:8px 12px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center;position:sticky;left:0;background:var(--surface);z-index:2}
.rack .rl .n{font-family:var(--serif);font-size:16px}
.rack .rl .nm{font-size:11.5px;color:var(--muted);line-height:1.2}
.rack .cell{border-bottom:1px solid var(--line);border-left:1px solid var(--line);min-height:46px}
.rack .cell.today{background:color-mix(in srgb,var(--oak) 7%,transparent)}
.bar{position:relative;z-index:1;margin:7px 3px;border-radius:6px;padding:4px 8px;font-size:12px;font-weight:500;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;border:0;text-align:left;line-height:1.35}
.bar small{display:block;font-size:10.5px;opacity:.8;font-weight:400}
.bar.in{background:var(--bar-in);color:var(--bar-in-t)}
.bar.cf{background:var(--bar-cf);color:var(--bar-cf-t)}
.bar.long{background:var(--bar-long);color:var(--bar-long-t)}
.bar.out{background:var(--surface2);color:var(--muted)}
.bar.ooo{background:repeating-linear-gradient(135deg,var(--bad-bg) 0 6px,transparent 6px 12px);color:var(--bad);border:1px solid var(--bad)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}

/* hk */
.hk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:12px}
.hk{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:8px;border-top:4px solid var(--line)}
.hk.st-VC{border-top-color:var(--ok)} .hk.st-VI{border-top-color:var(--ok)} .hk.st-VD{border-top-color:var(--warn)}
.hk.st-OC{border-top-color:var(--info)} .hk.st-OD{border-top-color:var(--warn)} .hk.st-OOO{border-top-color:var(--bad)} .hk.st-CL{border-top-color:var(--oak)}
.hk .top{display:flex;justify-content:space-between;align-items:baseline}
.hk .n{font-family:var(--serif);font-size:22px}
.hk .acts{display:flex;gap:6px;flex-wrap:wrap}
.task{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.task:last-child{border-bottom:0}
.task input{width:18px;height:18px;margin-top:2px;flex:none;accent-color:var(--oak)}
.task.done .t{text-decoration:line-through;color:var(--muted)}

/* charts */
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .ax{font-size:10.5px;fill:var(--muted);font-family:var(--sans)}
.chart .grid-l{stroke:var(--line);stroke-width:1}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:6px 9px;border-radius:7px;white-space:nowrap;transform:translate(-50%,-110%);z-index:5}
.hbar{display:grid;grid-template-columns:120px minmax(0,1fr) 92px;gap:10px;align-items:center;padding:6px 0}
.hbar .track{height:14px;background:var(--surface2);border-radius:4px;overflow:hidden}
.hbar .fill{height:100%;background:var(--oak);border-radius:0 4px 4px 0}
.hbar .val{text-align:right;font-variant-numeric:tabular-nums;font-size:13px}
@media (max-width:520px){.hbar{grid-template-columns:90px minmax(0,1fr) 80px}}

/* kanban */
.kanban{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:12px;overflow-x:auto;padding-bottom:4px}
.col{background:var(--surface2);border-radius:12px;padding:10px;display:grid;gap:8px;align-content:start}
.col h3{display:flex;justify-content:space-between;padding:2px 4px 4px}
.lead{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:6px}
.lead .t{font-weight:600}
.lead .amt{font-family:var(--serif);font-size:16px}

/* guests */
.g-layout{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.g-layout{grid-template-columns:1fr}}
.g-item{display:flex;gap:10px;align-items:center;padding:10px;border-radius:10px;border:0;background:none;width:100%;text-align:left}
.g-item:hover{background:var(--surface2)}
.g-item[aria-current="true"]{background:var(--oak-soft)}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font-weight:600;font-size:13px;color:var(--oak-ink);flex:none;border:1px solid var(--line)}
.avatar.lg{width:56px;height:56px;font-size:18px}
.kv{display:grid;grid-template-columns:140px 1fr;gap:6px 12px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.prefs{display:flex;flex-wrap:wrap;gap:6px}

/* drawer + modal */
.scrim{position:fixed;inset:0;background:rgba(20,18,15,.38);z-index:40;display:flex;justify-content:flex-end}
.drawer{background:var(--surface);width:min(440px,100%);height:100%;overflow:auto;padding:22px;display:grid;gap:16px;align-content:start;box-shadow:var(--shadow)}
.modal-scrim{justify-content:center;align-items:center;padding:16px}
.modal{background:var(--surface);width:min(480px,100%);max-height:100%;overflow:auto;border-radius:14px;padding:22px;display:grid;gap:14px;box-shadow:var(--shadow)}
.form{display:grid;gap:10px;grid-template-columns:1fr 1fr}
.form label{display:grid;gap:4px;font-size:12px;color:var(--muted);font-weight:600}
.form .full{grid-column:1/-1}
.form input,.form select,.form textarea{font-weight:400;font-size:14px}
.err{color:var(--bad);font-size:12.5px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:13px;z-index:60;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
@media (max-width:900px){.toast{bottom:90px}}

/* guest app */
.gapp-wrap{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:900px){.gapp-wrap{grid-template-columns:1fr}}
.phone{width:100%;max-width:380px;border:10px solid var(--bar-in);border-radius:36px;background:var(--bg);overflow:hidden;box-shadow:var(--shadow);justify-self:center}
.phone .scr{height:720px;max-height:78vh;overflow:auto;display:flex;flex-direction:column}
.ph-head{padding:22px 20px 18px;background:var(--bar-in);color:var(--bar-in-t)}
.ph-head .brand{padding:0;font-size:13px}
.ph-head .brand small{color:inherit;opacity:.7}
.ph-head .hi{font-family:var(--serif);font-size:24px;margin-top:14px}
.ph-head .rm{font-size:12.5px;opacity:.8}
.ph-body{padding:16px;display:grid;gap:12px;flex:1;align-content:start}
.ph-tabs{display:flex;border-top:1px solid var(--line);background:var(--surface);position:sticky;bottom:0}
.ph-tabs button{flex:1;border:0;background:none;padding:10px 2px;font-size:11px;color:var(--muted);display:grid;justify-items:center;gap:2px}
.ph-tabs button svg{width:19px;height:19px}
.ph-tabs button[aria-current="page"]{color:var(--ink)}
.ph-tabs button[aria-current="page"] svg{color:var(--oak)}
.ph-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:8px}
.req-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.req-grid button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:14px 10px;text-align:left;display:grid;gap:4px;font-size:13px;font-weight:500}
.req-grid button small{font-weight:400;color:var(--muted);font-size:11.5px}
.req-grid button[aria-pressed="true"]{border-color:var(--oak);background:var(--oak-soft)}
.steps{display:flex;gap:6px}
.steps span{flex:1;height:4px;border-radius:2px;background:var(--line)}
.steps span.on{background:var(--oak)}
.explain{display:grid;gap:12px;max-width:62ch}
.explain p{margin:0;color:var(--muted)}
@media (prefers-reduced-motion: no-preference){
  .drawer{animation:slide .22s ease-out}
  @keyframes slide{from{transform:translateX(24px);opacity:.6}to{transform:none;opacity:1}}
}

.btn:disabled{opacity:.45;cursor:not-allowed}
tr.hl td{background:color-mix(in srgb,var(--oak) 11%,transparent)}
.bar.hold{background:var(--oak-soft);color:var(--oak-ink);border:1.5px dashed var(--oak)}
.quote-grid{display:grid;grid-template-columns:minmax(0,360px) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:1000px){.quote-grid{grid-template-columns:1fr}}
.qform{display:grid;gap:14px}
.fl{display:grid;gap:6px;font-size:12px;color:var(--muted);font-weight:600}
.fl input,.fl select{font-weight:400;font-size:14px}
.two-in{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qres{display:grid;gap:14px}
.qres .kpi .v{font-size:22px}
.panel-mini{background:var(--surface2);border-radius:10px;padding:12px 14px;display:grid;gap:4px}
.steps-row{display:flex;gap:4px;flex-wrap:wrap}
.drawer{overflow-x:hidden}
.drawer table{width:100%}
.drawer td{white-space:normal}
.steps-row span{flex:1 1 0;min-width:0;font-size:11px;font-weight:600;color:var(--faint);padding-top:6px;border-top:3px solid var(--line)}
.steps-row span.on{color:var(--oak-ink);border-top-color:var(--oak)}
.tl{display:grid;gap:0;border-left:2px solid var(--line);margin-left:6px}
.tl-i{display:grid;grid-template-columns:52px 1fr;gap:10px;padding:6px 0 6px 14px;position:relative;font-size:13px}
.tl-i::before{content:"";position:absolute;left:-6px;top:11px;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--oak)}
.alert{padding:10px 12px;border-radius:8px;font-size:13px;font-weight:500}
.scanbox{display:grid;grid-template-columns:120px 1fr;gap:14px;align-items:center;background:var(--surface2);border-radius:12px;padding:12px}

function occChart(){
  const data=OCC30.map((v,i)=>({o:i-30,v,f:false})).concat(Array.from({length:14},(_,i)=>({o:i,v:sold(i),f:true})));
  const W=720,H=200,pl=34,pr=6,pt=10,pb=26,cw=(W-pl-pr)/data.length,bw=Math.max(4,cw-3);
  const y=v=>pt+(H-pt-pb)*(1-v/10);
  let g='';
  [0,25,50,75,100].forEach(p=>{const yy=y(p/10);g+=`<line class="grid-l" x1="${pl}" x2="${W-pr}" y1="${yy}" y2="${yy}"/><text class="ax" x="${pl-6}" y="${yy+3.5}" text-anchor="end">${p}%</text>`;});
  data.forEach((d,i)=>{
    const x=pl+i*cw+(cw-bw)/2, yy=y(d.v), h=Math.max(0,(H-pb)-yy);
    const r=Math.min(3,bw/2);
    const path=h>0?`M${x},${H-pb} V${yy+r} Q${x},${yy} ${x+r},${yy} H${x+bw-r} Q${x+bw},${yy} ${x+bw},${yy+r} V${H-pb} Z`:'';
    g+=`<path d="${path}" fill="${d.f?'color-mix(in srgb,var(--oak) 40%,transparent)':'var(--oak)'}"/>`;
    g+=`<rect x="${pl+i*cw}" y="${pt}" width="${cw}" height="${H-pt-pb}" fill="transparent" data-tip="${wd(d.o)} ${dm(d.o)} · ${d.v}/10 căn (${d.v*10}%)${d.f?' · đã đặt trước':''}"/>`;
    if(d.o%7===0||i===0) g+=`<text class="ax" x="${pl+i*cw+cw/2}" y="${H-8}" text-anchor="middle">${d.o===0?'Hôm nay':dm(d.o)}</text>`;
  });
  const x0=pl+30*cw;
  g+=`<line x1="${x0}" x2="${x0}" y1="${pt}" y2="${H-pb}" stroke="var(--ink)" stroke-dasharray="3 3" stroke-width="1"/>`;
  return `<div class="chart" data-chart><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Công suất phòng 30 ngày qua và 14 ngày tới">${g}</svg></div>
  <div class="legend" style="margin-top:8px"><span><i style="background:var(--oak)"></i>Thực tế 30 ngày qua</span><span><i style="background:color-mix(in srgb,var(--oak) 40%,transparent)"></i>Đã đặt trước 14 ngày tới</span></div>`;
}
function bindTips(){
  document.querySelectorAll('[data-chart]').forEach(c=>{
    let tip=c.querySelector('.tip');
    c.addEventListener('mousemove',e=>{
      const t=e.target.closest('[data-tip]');
      if(!t){tip&&(tip.hidden=true);return;}
      if(!tip){tip=document.createElement('div');tip.className='tip';c.appendChild(tip);}
      tip.hidden=false;tip.textContent=t.dataset.tip;
      const rc=c.getBoundingClientRect(), rt=t.getBoundingClientRect();
      tip.style.left=Math.min(rc.width-80,Math.max(80,rt.left-rc.left+rt.width/2))+'px';
      tip.style.top=(e.clientY-rc.top)+'px';
    });
    c.addEventListener('mouseleave',()=>{tip&&(tip.hidden=true);});
  });
}
function hbars(rows,unit){
  const max=Math.max(...rows.map(r=>r.v));
  return rows.map(r=>`<div class="hbar"><span>${esc(r.l)}</span><div class="track" title="${esc(r.l)}: ${unit(r.v)}"><div class="fill" style="width:${(r.v/max*100).toFixed(1)}%"></div></div><span class="val">${unit(r.v)}</span></div>`).join('');
}

const WPM=52/12;
const r10k=n=>Math.round(n/10000)*10000, r100k=n=>Math.round(n/100000)*100000, r1k=n=>Math.round(n/1000)*1000;
const PR={
  terms:[{m:1,l:'1 tháng',disc:0,depVN:.5,depNN:1,cyc:1,cIn:3,cCTV:5},{m:3,l:'3 tháng',disc:5,depVN:1,depNN:1,cyc:3,cIn:4,cCTV:6},{m:6,l:'6 tháng',disc:8,depVN:1,depNN:1.5,cyc:3,cIn:5,cCTV:7},{m:12,l:'1 năm',disc:12,depVN:1,depNN:2,cyc:3,cIn:6,cCTV:8.3},{m:24,l:'2 năm',disc:15,depVN:2,depNN:2,cyc:3,cIn:4,cCTV:6}],
  prem:10,bonusNN:1,
  grp:{'Lầu 1–2':{fix:300000,fc:150000,cl:[[180000,100000],[160000,100000],[150000,100000]]},'Căn N':{fix:400000,fc:200000,cl:[[250000,140000],[230000,140000],[210000,140000]]},'Căn N+':{fix:350000,fc:180000,cl:[[220000,120000],[200000,120000],[180000,120000]]}},
  elec:3500,water:25000,kwhVN:120,kwhNN:170,m3VN:3.5,m3NN:4
};
let Q={room:302,guest:'NN',mode:'long',term:2,clean:1,pax:1,sale:'CTV',start:'2026-11-01',nights:3,name:'Mark Thompson'};
Object.assign(S,{regSel:'OTM-0150',seg:'all'});
STAGES.splice(0,4,'Mới','Đã báo giá','Giữ chỗ · chờ cọc','Đã chốt');
LEADS.find(l=>l.id===2).st=1;
LEADS.forEach((l,i)=>{if(l.st===1&&!l.q) l.q='BG-0'+(41+i);});
let QSEQ=48, OSEQ=170;

const offOf=d=>Math.round((new Date(d+'T00:00:00')-T0)/864e5);
function calcQ(){
  const r=room(Q.room), grp=PR.grp[r.grp], NN=Q.guest==='NN', s=offOf(Q.start);
  let o;
  if(Q.mode==='long'){
    const t=PR.terms[Q.term], months=t.m;
    const rent=r10k(r.month*(1+(NN?PR.prem:0)/100)*(1-t.disc/100));
    const n=Q.clean+1, cl=Q.clean<0?[0,0]:grp.cl[Q.clean];
    const cleanFee=Q.clean<0?0:r1k(n*WPM*cl[0]);
    const svc=grp.fix+cleanFee;
    const kwh=NN?PR.kwhNN:PR.kwhVN, m3=(NN?PR.m3NN:PR.m3VN)*Q.pax;
    const util=kwh*PR.elec+m3*PR.water;
    const dep=r100k(rent*(NN?t.depNN:t.depVN)), cyc=Math.min(t.cyc,months);
    const rate=(Q.sale==='CTV'?t.cCTV:t.cIn)+(NN?PR.bonusNN:0), com=rent*months*rate/100;
    const cost=(Q.clean<0?0:n*WPM*cl[1]*months)+grp.fc*months;
    o={long:true,t,months,rent,svc,cleanFee,kwh,m3,util,monthly:rent+svc+util,dep,cyc,first:dep+(rent+svc)*cyc,total:(rent+svc)*months,rentTotal:rent*months,rate,com,net:(rent+svc)*months-com-cost,e:s+Math.round(months*30.4),nightly:r.night*30};
  } else {
    const n=Math.max(1,Q.nights), disc=n>=14?15:n>=7?10:0, night=r1k(r.night*(1-disc/100)), total=night*n;
    const rate=Q.sale==='CTV'?8:3, com=total*rate/100, cost=grp.cl[0][1]*n;
    o={long:false,n,disc,night,total,rentTotal:total,dep:r100k(total*.3),first:r100k(total*.3),rate,com,net:total-com-cost,e:s+n};
  }
  o.r=r;o.s=s;o.NN=NN;
  o.clash=BK.find(b=>b.room===Q.room&&!['out','cx'].includes(b.st)&&b.s<o.e&&s<b.e);
  o.alt=ROOMS.filter(x=>x.no!==Q.room&&!BK.some(b=>b.room===x.no&&!['out','cx'].includes(b.st)&&b.s<o.e&&s<b.e)).map(x=>x.no);
  return o;
}
function quoteText(q){
  const L=[`OTTIMO Boutique Stay · Báo giá ${q.r.no} ${q.r.name}`,`Khách: ${Q.name||'(chưa có tên)'} · ${q.NN?'Khách nước ngoài':'Khách Việt Nam'}`];
  if(q.long){L.push(`Hợp đồng ${q.t.l} từ ${dmy(q.s)}`,`Tiền thuê: ${fmt(q.rent)} đ/tháng`,`Phí dịch vụ${Q.clean<0?'':' + dọn '+(Q.clean+1)+' lần/tuần'}: ${fmt(q.svc)} đ/tháng`,`Điện nước theo công tơ (ước tính ${fmt(q.util)} đ/tháng)`,`Ký quỹ: ${fmt(q.dep)} đ · Thanh toán khi ký: ${fmt(q.first)} đ`);}
  else L.push(`${q.n} đêm từ ${dmy(q.s)} đến ${dmy(q.e)}`,`Giá: ${fmt(q.night)} đ/đêm${q.disc?' (đã giảm '+q.disc+'%)':''}`,`Tổng: ${fmt(q.total)} đ · Cọc giữ phòng 30%: ${fmt(q.dep)} đ`);

}

function confirmDeposit(id){
  const b=BK.find(x=>x.id===id); if(!b) return;
  b.st='cf'; b.dep=b.depDue;
  const l=LEADS.find(x=>x.bk===id); if(l) l.st=3;
  G[b.g].tags=G[b.g].tags.filter(t=>t!=='Tiềm năng');
  if(b.type==='long') CONTRACTS.push({g:b.g,room:b.room,term:b.term,from:b.s,to:b.e,rent:b.rate,dep:b.depDue,next:b.s,nextAmt:b.first-b.depDue,com:b.com||0,paid:0,who:l?l.who:'NV Hạnh'});
  logSync(`Desk → 7 kênh: xác nhận ${id}, căn ${b.room} giữ đóng ${dm(b.s)}–${dm(b.e)}`);
  closeLayer(); render(); toast(`Đã nhận ${b.type==='long'?'ký quỹ':'cọc'} ${fmt(b.depDue)} đ · ${id} đã xác nhận${b.type==='long'?' · đã tạo hợp đồng':''}`);
}
function cancelHold(id){
  const b=BK.find(x=>x.id===id); if(!b) return; b.st='cx';
  const l=LEADS.find(x=>x.bk===id); if(l){l.st=1;delete l.bk;}
  logSync(`Desk → 7 kênh: huỷ giữ chỗ ${id}, mở lại căn ${b.room} ${dm(b.s)}–${dm(b.e)}`);
  closeLayer(); render(); toast(`Đã huỷ giữ chỗ ${id}, mở lại căn ${b.room}`);
}

    if(b.st==='hold'){
      folio=`<tr><td>${b.type==='long'?'Tiền thuê '+esc(b.term)+' · '+fmt(b.rate)+'/tháng':'Tiền phòng '+n+' đêm × '+fmt(b.rate)}</td><td class="r">${b.type==='long'?'':fmt(n*b.rate)}</td></tr><tr><td>${b.type==='long'?'Ký quỹ cần thu':'Cọc cần thu'}</td><td class="r">${fmt(b.depDue)}</td></tr><tr><td>Hạn giữ chỗ</td><td class="r">${esc(b.hold)}</td></tr><tr class="tot"><td>Cách thanh toán</td><td class="r">${esc(b.pay)}</td></tr>`;
    } else if(b.type==='long'){
      folio=`<tr><td>Tiền thuê tháng</td><td class="r">${fmt(b.rate)}</td></tr><tr><td>Dọn phòng</td><td class="r">${esc(b.clean)}</td></tr><tr><td>Ký quỹ đang giữ</td><td class="r">${fmt(b.dep)}</td></tr><tr><td>Điện nước</td><td class="r">Theo công tơ</td></tr>`;

document.addEventListener('click',e=>{

  if(d.qsave!==undefined){const q=calcQ();const id='BG-0'+(QSEQ++);const name=Q.name||'Khách chưa có tên';const ex=LEADS.find(l=>l.n===name&&l.st<2);const need=q.long?`Căn ${Q.room} · ${q.t.l}`:`Căn ${Q.room} · ${q.n} đêm`;if(ex){ex.st=1;ex.q=id;ex.need=need;ex.v=q.rentTotal;}else LEADS.push({id:Date.now(),n:name,need,v:q.rentTotal,who:Q.sale==='CTV'?'CTV Minh Anh':'NV Hạnh',st:1,src:'Báo giá',q:id});render();toast(`Đã lưu ${id} cho ${name}`);return;}
  if(d.qcopy!==undefined){const txt=quoteText(calcQ());const ok=()=>toast('Đã sao chép báo giá, dán vào Zalo hoặc email');navigator.clipboard&&navigator.clipboard.writeText(txt).then(ok,()=>toast('Trình duyệt chặn sao chép. Nội dung: '+txt.split('\n')[0]));return;}
  if(d.qorder!==undefined){orderModal();return;}
  if(d.depok){confirmDeposit(d.depok);return;}
  if(d.cxhold){cancelHold(d.cxhold);return;}
  if(d.requote){const l=LEADS.find(x=>x.id===+d.requote);Q.name=l.n;const m=l.need.match(/Căn (\d{3})/);if(m)Q.room=+m[1];render();$('#quote')&&$('#quote').scrollIntoView({behavior:'smooth'});return;}
  if(d.quotefor){Q.name=G[d.quotefor].name;Q.guest=G[d.quotefor].nat==='VN'?'VN':'NN';S.view='sales';render();setTimeout(()=>$('#quote')&&$('#quote').scrollIntoView(),30);return;}
  if(d.seg){S.seg=d.seg;render();return;}
  if(d.regsel){S.regSel=d.regsel;render();return;}
  if(d.regopen){closeLayer();S.regSel=d.regopen;S.view=ROLEV[S.role].includes('reg')?'reg':S.view;render();return;}
  if(d.scan){scanNext(d.scan,false);return;}

function makeBill(b,R0,pay){
  const r=room(b.room), n=nights(b)-(b.extN||0), lines=[];
  if(b.type!=='long') for(let i=0;i<n;i++) lines.push({d:dm(b.s+i),vi:'Tiền phòng · '+r.name,en:'Room',q:1,u:b.rate,amt:b.rate});

  [['laundry','Giặt ủi','Laundry'],['food','Đồ ăn gọi thêm','Food & beverage'],['dmg','Hư hỏng, mất đồ','Damage / missing items']].forEach(([k,vi,en])=>{if(R0[k])lines.push({d:dm(0),vi,en,q:1,u:R0[k],amt:R0[k]});});
  if(R0.late){lines.push({d:dm(0),vi:`Trả phòng muộn ${R0.lateT} (${Math.round(R0.lateP*100)}%)`,en:'Late check-out',q:1,u:R0.late,amt:R0.late});if(R0.lateFoc)lines.push({d:dm(0),vi:'Miễn phí trả phòng muộn (FOC) · '+R0.lateReason,en:'Complimentary',q:'',u:'',amt:-R0.late});}

  const total=lines.reduce((a,l)=>a+l.amt,0), dep=b.type==='long'?0:b.dep;

}
function fakeQR(seed){
  let h=0;for(const ch of seed)h=(h*31+ch.charCodeAt(0))>>>0;
  const N=25,rnd=()=>{h^=h<<13;h>>>=0;h^=h>>17;h^=h<<5;h>>>=0;return h%100;};
  let s='';const fp=(x,y)=>{s+=`<rect x="${x}" y="${y}" width="7" height="7" fill="var(--ink)"/><rect x="${x+1}" y="${y+1}" width="5" height="5" fill="var(--surface)"/><rect x="${x+2}" y="${y+2}" width="3" height="3" fill="var(--ink)"/>`;};
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){const inF=(x<8&&y<8)||(x>N-9&&y<8)||(x<8&&y>N-9);if(!inF&&rnd()<47)s+=`<rect x="${x}" y="${y}" width="1" height="1" fill="var(--ink)"/>`;}
  fp(0,0);fp(N-7,0);fp(0,N-7);
  return `<svg viewBox="-1 -1 ${N+2} ${N+2}" width="132" height="132" role="img" aria-label="Mã QR chuyển khoản mẫu"><rect x="-1" y="-1" width="${N+2}" height="${N+2}" fill="var(--surface)"/>${s}</svg>`;
}

const DEPC={'OTM-0139':{log:[['20:00 hôm qua','Zalo','Nhắc trả phòng trước 12:00, hỏi có muốn ở thêm'],['09:00','App khách','Nhắc lần 2 kèm nút Trả đúng giờ / Ở thêm / Trả muộn']],reply:null}};
S.clock=S.clock||'11:05';

const LATE=[['13:00','Đến 13:00',0],['15:00','Đến 15:00',.3],['18:00','Đến 18:00',.5]];
function extAvail(b,n){
  const clash=BK.find(x=>x!==b&&x.room===b.room&&!['out','cx'].includes(x.st)&&x.s<b.e+n&&b.e<x.e);
  let max=0;for(let k=1;k<=7;k++){if(BK.some(x=>x!==b&&x.room===b.room&&!['out','cx'].includes(x.st)&&x.s<b.e+k&&b.e<x.e))break;max=k;}
  return {clash,max};
}
function depState(b){
  const c=DEPC[b.id]||(DEPC[b.id]={log:[],reply:null});
  if(c.reply==='time') return ['ok',`Khách xác nhận trả lúc ${c.time}`,'s-ok'];
  if(c.reply==='late') return ['ok',`Trả muộn ${c.time}${c.fee?(c.foc?' · miễn phí (FOC)':' · phụ thu '+fmt(c.fee)+' đ'):''}`,'s-info'];
  const m=mins(S.clock);
  if(m<660) return ['wait','Đã nhắc, chờ khách trả lời','s-info'];
  if(m<720) return ['call','Chưa trả lời · lễ tân gọi xác nhận','s-warn'];
  return ['over',`Quá giờ trả phòng ${m-720} phút`,'s-bad'];
}

function findDups(f,except){
  const out=[];const p=normPh(f.ph),e=normEm(f.em);

    if(why.length)out.push({id,why});});
  return out;
}
function dupPairs(){
  const seen=new Set(),pairs=[];
  Object.keys(G).forEach(a=>{const g=G[a];findDups({ph:g.ph,em:g.em,name:g.name,dob:g.dob},a).forEach(d=>{const k=[a,d.id].sort().join('|');if(!seen.has(k)){seen.add(k);pairs.push([a,d.id,d.why]);}});

function completeness(id){
  const g=G[id];const hasDoc=BK.some(b=>b.g===id&&REG[b.id]&&REG[b.id].people.length);
  const items=[['Họ tên',!!g.name],['SĐT',!!g.ph],['Email',!!g.em],['Quốc tịch',!!g.nat],['Ngày sinh',!!g.dob],['Giấy tờ',hasDoc||g.reg],['Sở thích',g.prefs.length>0],['Đồng ý nhận ưu đãi',g.mkt!==undefined]];
  return {pct:Math.round(items.filter(x=>x[1]).length/items.length*100),missing:items.filter(x=>!x[1]).map(x=>x[0])};
}
function createGuest(d,extra){
  const id='g'+(Object.keys(G).length+1+Math.floor(Math.random()*1000));
  G[id]=Object.assign({name:d.name,nat:d.nat||'VN',ph:d.ph||'',em:d.em||'',doc:'Chưa quét',reg:false,tags:[],prefs:[],note:'',code:'KH-'+String(++GSEQ).padStart(4,'0'),dob:d.dob||'',contact:d.contact||'Zalo',lang:d.nat==='VN'||!d.nat?'Tiếng Việt':'English',mkt:false,company:'',mst:'',otaRef:''},extra||{});
  return id;
}

function bindGuestPicker(p){
  const box=$('#'+p+'-gp');
  const pick=id=>{const g=G[id];$('#'+p+'-gid').value=id;$('#'+p+'-find').hidden=true;const s=$('#'+p+'-sel');s.hidden=false;
    s.innerHTML=`<span class="avatar">${ini(g.name)}</span><div class="grow"><div class="t">${esc(g.name)} <span class="chip">${g.code}</span></div><div class="m">${esc(g.ph||'chưa có SĐT')} · ${esc(g.em||'chưa có email')} · ${esc(g.nat)}${g.tags.length?' · '+g.tags.map(esc).join(', '):''}</div></div><button type="button" class="btn sm" data-gpclear>Đổi khách</button>`;};
  const search=()=>{const q=$('#'+p+'-q').value.trim();const res=$('#'+p+'-res');if(q.length<2){res.innerHTML='';return;}
    const qn=norm(q),qd=digits(q);
    const hits=Object.keys(G).filter(id=>{const g=G[id];return (qn.length>=2&&norm(g.name).includes(qn))||(qd.length>=3&&digits(g.ph).includes(qd))||normEm(g.em).includes(q.toLowerCase())||g.code.toLowerCase()===q.toLowerCase();}).slice(0,5);
    res.innerHTML=hits.length?hits.map(id=>{const g=G[id];return `<button type="button" class="gp-hit" data-gpick="${id}"><span class="avatar" style="width:28px;height:28px;font-size:11px">${ini(g.name)}</span><span class="grow"><b>${esc(g.name)}</b> <span class="sub">${g.code} · ${esc(g.ph||'—')} · ${esc(g.nat)}</span></span><span class="sub">Chọn</span></button>`;}).join(''):`<p class="note">Không thấy khách nào khớp "${esc(q)}". Tạo khách mới bên dưới.</p>`;};
  const dup=()=>{const d=findDups({ph:$('#'+p+'-ph').value,em:$('#'+p+'-em').value},null);
    $('#'+p+'-dup').innerHTML=d.length?`<div class="alert s-warn">${d.map(x=>`Đã có hồ sơ <b>${G[x.id].code} · ${esc(G[x.id].name)}</b> (${x.why.join(', ')}). <button type="button" class="btn sm" data-gpick="${x.id}">Dùng hồ sơ này</button>`).join('<br>')}</div>`:'';};
  box.addEventListener('input',e=>{if(e.target.id===p+'-q')search();if(e.target.id===p+'-ph'||e.target.id===p+'-em')dup();});
  box.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.gpick){pick(b.dataset.gpick);}if(b.dataset.gpclear!==undefined){$('#'+p+'-gid').value='';$('#'+p+'-sel').hidden=true;$('#'+p+'-find').hidden=false;}});
  search();
  return {pick};
}
function readGuestPicker(p,needPhone){
  const gid=$('#'+p+'-gid').value; if(gid) return {gid};
  const d={name:$('#'+p+'-name').value.trim(),ph:$('#'+p+'-ph').value.trim(),em:$('#'+p+'-em').value.trim(),nat:$('#'+p+'-nat').value,contact:$('#'+p+'-ct').value};
  if(!d.name) return {err:'Chọn khách đã có hoặc nhập họ tên khách mới.'};
  if(needPhone&&!d.ph) return {err:'Đặt trực tiếp cần SĐT/Zalo của khách để liên hệ và định danh.'};
  if(d.ph&&digits(d.ph).length<9) return {err:'SĐT chưa đúng, cần ít nhất 9 chữ số.'};
  if(d.em&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(d.em)) return {err:'Email chưa đúng định dạng.'};
  const du=findDups(d,null); if(du.length) return {err:`SĐT/email này đã thuộc hồ sơ ${G[du[0].id].code} · ${G[du[0].id].name}. Bấm "Dùng hồ sơ này".`};
  return {new:d};
}

function mergeModal(id){

  $('#mgform').addEventListener('submit',e=>{e.preventDefault();doMerge($('#mg-to').value,id);});

function doMerge(to,from){
  const a=G[to],b=G[from];
  BK.forEach(x=>{if(x.g===from)x.g=to;}); CONTRACTS.forEach(x=>{if(x.g===from)x.g=to;}); REQS.forEach(x=>{if(x.g===from)x.g=to;});
  ['ph','em','dob','company','mst','otaRef'].forEach(k=>{if(!a[k]&&b[k])a[k]=b[k];});
  if(b.otaRef&&a.otaRef&&!a.otaRef.includes(b.otaRef))a.otaRef+=' · '+b.otaRef;
  a.tags=[...new Set(a.tags.concat(b.tags))]; a.prefs=[...new Set(a.prefs.concat(b.prefs))];
  if(b.note) a.note=(a.note?a.note+' ':'')+`[Gộp từ ${b.code}] ${b.note}`;
  a.merged=(a.merged||[]).concat(b.code); a.reg=a.reg||b.reg;
  delete G[from]; S.guest=to; closeLayer(); render(); toast(`Đã gộp ${b.code} vào ${a.code} · ${a.name}`);
}

  const list=(b.guests||[]).slice();

function bkRev(b){
  if(['hold','cx'].includes(b.st)||b.type==='ooo') return 0;
  const room=b.type==='long'?b.rate*Math.max(1,Math.round((Math.min(b.e,0)-b.s)/30)):(nights(b)-(b.extN||0))*b.rate;
  return room+(b.fnb||[]).reduce((a,l)=>a+l.amt,0);
}

const allocRev=gid=>BK.filter(b=>adultsOf(b).some(x=>x.g===gid)).reduce((a,b)=>a+bkRev(b)/Math.max(1,adultsOf(b).length),0)+(LEGACY[gid]||0);

function linkScanned(id){
  const b=BK.find(x=>x.id===id), rg=REG[id]; if(!b||!rg) return [];

  rg.people.filter(p=>!p.main).forEach(p=>{

  </div>`;
}
function companionsHtml(gid){

  BK.filter(b=>inBk(b,gid)).forEach(b=>guestsOf(b).forEach(x=>{if(x.g&&x.g!==gid){const o=m.get(x.g)||{n:0,rel:x.rel||'',role:x.role};o.n++;if(b.g===gid)o.rel=x.rel||o.rel;m.set(x.g,o);}}));

const rptBase2=R.rpt;
R.rpt=()=>{
  const out=rptBase2(); if(S.rpt!=='ops') return out;
  const bks=BK.filter(b=>!['cx','hold'].includes(b.st)&&b.type!=='ooo');
  const pax=bks.reduce((a,b)=>a+(b.pax||1),0), rev=bks.reduce((a,b)=>a+bkRev(b),0);
  const sh=[];bks.forEach(b=>guestsOf(b).filter(x=>x.role==='sharer'&&x.g).forEach(x=>sh.push(x.g)));
  const uniq=[...new Set(sh)], withC=uniq.filter(id=>G[id]&&hasContact(G[id])).length, withM=uniq.filter(id=>G[id]&&G[id].mkt).length, conv=uniq.filter(id=>BK.some(b=>b.g===id)).length;
  const unknown=bks.reduce((a,b)=>a+Math.max(0,(b.pax||1)-guestsOf(b).length),0);
  return out+`<section class="card"><div class="card-h"><h2>Khách lưu trú theo người</h2><span class="sub">Tính trên ${bks.length} đơn đang có trong demo</span></div>

      <div class="kpi"><span class="k">Số khách lưu trú</span><span class="v num">${pax}</span><span class="d">${(pax/bks.length).toLocaleString('vi-VN',{maximumFractionDigits:1})} khách / phòng</span></div>
      <div class="kpi"><span class="k">Doanh thu / khách</span><span class="v num">${tr(rev/pax)}</span><span class="d">Doanh thu ${tr(rev)} ÷ ${pax} khách</span></div>
      <div class="kpi"><span class="k">Người đi cùng có liên hệ</span><span class="v num">${uniq.length?Math.round(withC/uniq.length*100):0}%</span><span class="d">${withC}/${uniq.length} người · ${withM} đồng ý nhận ưu đãi</span></div>
      <div class="kpi"><span class="k">Chưa có thông tin</span><span class="v num">${unknown}</span><span class="d">Khách trong đơn chưa có hồ sơ</span></div>
    </div>
    <p class="note">Doanh thu trong báo cáo kinh doanh vẫn tính theo đơn và đêm-phòng, không nhân theo số người. Chỉ số "người đi cùng tự đặt lại" hiện là ${conv}/${uniq.length}; đây là thước đo biến người đi cùng thành khách trực tiếp.</p></section>`;
};

  if(d.addparty){partyModal(d.addparty);return;}
  if(d.invite){const [bid,gid]=d.invite.split('|');const b=BK.find(x=>x.id===bid);const x=guestsOf(b).find(y=>y.g===gid);b.guests=guestsOf(b);const en=b.guests.find(y=>y.g===gid);en.inv='Đã gửi link mời 15/10';closeLayer();bookingDrawer(bid);toast(`Đã gửi link cho ${G[b.g].name} chuyển tới ${G[gid].name}: tự điền liên hệ và chọn nhận ưu đãi`);return;}
  if(d.inviteall){const b=BK.find(x=>x.id===d.inviteall);b.guests=guestsOf(b);b.guests.filter(x=>x.role==='sharer').forEach(x=>{if(!x.inv)x.inv='Đã gửi link mời 15/10';});closeLayer();bookingDrawer(b.id);toast(`Đã gửi link check-in nhóm cho ${G[b.g].name}. Mỗi người tự điền thông tin và tự chọn nhận ưu đãi.`);return;}
  if(d.regsave){setTimeout(()=>{const rg=REG[d.regsave];if(rg&&rg.st==='scanned'){const a=linkScanned(d.regsave);if(a.length){render();toast('Đã gắn người đi cùng vào đơn: '+a.join(', '));}}},0);return;}
});

/* ============ events ============ */
document.addEventListener('click',e=>{
  const t=e.target.closest('button,[data-scrim]'); if(!t) return;
  const d=t.dataset;
  if(t.matches('[data-scrim]')&&e.target===t){closeLayer();return;}
  if(d.close!==undefined){closeLayer();return;}
  if(d.go){closeLayer();S.view=d.go;render();window.scrollTo(0,0);return;}
  if(d.bk){closeLayer();bookingDrawer(d.bk);return;}
  if(d.ci){closeLayer();ciModal(d.ci);return;}
  if(d.co){closeLayer();mbModal(d.co,'co');return;}
  if(d.sendci){closeLayer();toast('Đã gửi link check-in online qua email và Zalo của khách');return;}
  if(d.guest){closeLayer();S.guest=d.guest;S.view=ROLEV[S.role].includes('guests')?'guests':S.view;render();return;}
  if(d.newbk!==undefined){newBookingModal();return;}
  if(d.newwo!==undefined){woModal();return;}
  if(d.fotab){S.foTab=d.fotab;render();return;}
  if(d.hkf){S.hkFilter=d.hkf;render();return;}
  if(d.hk){HK[+d.hk]=d.to;if(d.to==='VC'||d.to==='OC'){const tk=TASKS.find(x=>x.room===+d.hk&&!x.done&&/Dọn/.test(x.t));if(tk)tk.done=true;}render();toast(`Căn ${d.hk}: ${HKS[d.to][0]}`);return;}
  if(d.lead){const l=LEADS.find(x=>x.id===+d.lead);l.st=Math.min(3,l.st+1);render();toast(`${l.n} → ${STAGES[l.st]}`);return;}
  if(d.rpt){S.rpt=d.rpt;render();return;}
  if(d.gp){S.gp=d.gp;S.gt='home';S.reqType=null;render();return;}
  if(d.gt){S.gt=d.gt;render();return;}
  if(d.cistep){S.ci=+d.cistep;if(S.ci===2){G.g6.reg=true;}render();return;}
  if(d.reqt){S.reqType=d.reqt;const note=$('#p-req')?.value||'';render();$('#p-req')&&($('#p-req').value=note);return;}
  if(d.sendreq!==undefined){
    const q=REQT.find(x=>x.k===S.reqType); if(!q) return;
    const P=S.gp==='g7'?{g:'g7',room:301}:{g:'g6',room:203};
    const note=($('#p-req')?.value||'').trim();
    REQS.unshift({g:P.g,room:P.room,t:q.l,note,to:q.to==='hk'?'Buồng phòng':q.to==='mt'?'Bảo trì':'Lễ tân'});
    if(q.to==='hk') TASKS.unshift({id:Date.now(),room:P.room,t:q.l,m:note||'Khách yêu cầu qua app',who:'Chưa giao',done:false,src:1});
    if(q.to==='mt') WO.unshift({id:'WO-0'+(40+WO.length),room:P.room,t:note||q.l,p:'Trung bình',st:'Mới',who:'Chưa giao',d:0,src:1});
    S.reqType=null;render();toast('Đã gửi. Lễ tân OTTIMO sẽ phản hồi trong 10 phút.');return;
  }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.task){const k=TASKS.find(x=>x.id==t.dataset.task);k.done=t.checked;render();return;}
  if(t.dataset.wo){const w=WO.find(x=>x.id===t.dataset.wo);w.st=t.value;if(w.st==='Xong'&&HK[w.room]==='OOO'){HK[w.room]='VD';BK=BK.filter(b=>!(b.type==='ooo'&&b.room===w.room));toast(`Đã sửa xong. Mở khoá căn ${w.room}, chuyển sang cần dọn`);}render();return;}
  if(t.id==='role'){S.role=t.value;closeLayer();render();return;}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.meter!==undefined){const m=METER[+t.dataset.meter];m[t.dataset.k]=t.value===''?null:+t.value;const amt=(m.en!=null&&m.wn!=null)?(Math.max(0,m.en-m.eo)*3500+Math.max(0,m.wn-m.wo)*25000):null;const c=document.getElementById('mamt-'+t.dataset.meter);if(c)c.innerHTML=amt==null?'<span class="sub">Chờ chốt</span>':fmt(amt);}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeLayer();});

const h=(location.hash||'').slice(1); if(VIEWS[h]) S.view=h;
render();
})();
</script>
