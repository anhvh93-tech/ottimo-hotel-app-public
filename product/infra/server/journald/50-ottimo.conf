# OTTIMO host journal (v1.0.5 V5-63, ARC contract 0.3.13 1.15, SEC FB-R4-SEC-OPS-OR-04 / FB-R5-SEC-ARC-07).
# Installed by bootstrap-vps.sh to /etc/systemd/journald.conf.d/ (runbook v1.0.5 W6 step 1 on a running VPS).
# Container logs (Docker log driver journald, both stacks + edge) and the system logs share this journal.
[Journal]
# Kept on disk across reboots and re-created containers; /var/log/journal root:systemd-journal, files 0640.
Storage=persistent
Compress=yes
# Hard cap T16 / SR-LOG-05: nothing older than 90 days. One file per day, so the cap is late by 1 day at most.
MaxRetentionSec=90day
MaxFileSec=1day
# Size cap (whole journal: production + staging + OS). 4G is a first value (disk ≥ 40 GB, 18 % used on 06/11):
# OPS measures `journalctl --disk-usage` 7 days after the switch and sets SystemMaxUse ≥ 3 × the 90-day estimate
# (hosting-plan 7). Reaching it deletes the oldest files EARLY – ops-check `journal` warns (SEC ARC-07).
SystemMaxUse=4G
SystemKeepFree=8G
# Every container logs through docker.service, i.e. one rate-limit source: room for a burst of requests. Lines over
# the limit are dropped with "Suppressed N messages" – ops-check `journal` warns.
RateLimitIntervalSec=30s
RateLimitBurst=20000
# One copy, one cap: no second copy in /var/log/syslog (rsyslog would keep it on its own logrotate schedule).
ForwardToSyslog=no
