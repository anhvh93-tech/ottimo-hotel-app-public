# GENERATED by infra/server/bin/edge.sh render – do not edit (source: EDGE_MODE=edge stacks in @WORK@/prod @WORK@/stg @WORK@/old).
worker_processes auto;
worker_rlimit_nofile 32768;
pid /tmp/nginx.pid;
# crit only: connection errors would log full client addresses (the stacks' Caddy logs are masked /24 – SR-LOG-02).
error_log /dev/stderr crit;
# Each proxied connection uses two (client + upstream).
events { worker_connections 8192; }

stream {
	resolver 127.0.0.11 valid=10s ipv6=off;
	# One client address may not hold more than EDGE_CONN_PER_IP connections (slow / idle connection floods).
	limit_conn_zone $binary_remote_addr zone=ottimo_tls_perip:10m;
	limit_conn ottimo_tls_perip 100;
	map $ssl_preread_server_name $ottimo_tls_backend {
		hostnames;
		desk.localhost production-web:443;
		staff.desk.localhost production-web:443;
		g.desk.localhost production-web:443;
		landing.localhost production-landing:443;
		www.landing.localhost production-landing:443;
		desk.stg.localhost staging-web:443;
		staff.desk.stg.localhost staging-web:443;
		g.desk.stg.localhost staging-web:443;
		preview.localhost staging-landing:443;
		www.preview.localhost staging-landing:443;
		default 127.0.0.1:9;
	}
	server {
		listen 443;
		ssl_preread on;
		# The TLS ClientHello (SNI) must arrive within 5 s, or the connection is closed.
		preread_timeout 5s;
		proxy_pass $ottimo_tls_backend;
		proxy_protocol on;
		proxy_connect_timeout 5s;
		# SSE (notifications) keeps a connection open; the api sends a heartbeat well inside this.
		proxy_timeout 1h;
	}
}

http {
	access_log off;
	server_tokens off;
	client_body_temp_path /tmp/client_body;
	proxy_temp_path /tmp/proxy;
	fastcgi_temp_path /tmp/fastcgi;
	uwsgi_temp_path /tmp/uwsgi;
	scgi_temp_path /tmp/scgi;
	resolver 127.0.0.11 valid=10s ipv6=off;
	limit_conn_zone $binary_remote_addr zone=ottimo_http_perip:5m;
	limit_conn ottimo_http_perip 20;
	limit_conn_status 429;
	client_header_timeout 10s;
	client_body_timeout 10s;
	send_timeout 10s;
	keepalive_timeout 15s;
	map $host $ottimo_http_backend {
		hostnames;
		desk.localhost production-web;
		staff.desk.localhost production-web;
		g.desk.localhost production-web;
		landing.localhost production-landing;
		www.landing.localhost production-landing;
		desk.stg.localhost staging-web;
		staff.desk.stg.localhost staging-web;
		g.desk.stg.localhost staging-web;
		preview.localhost staging-landing;
		www.preview.localhost staging-landing;
		default "";
	}
	server {
		listen 80 default_server;
		client_max_body_size 1k;
		location / {
			if ($ottimo_http_backend = "") { return 404; }
			proxy_pass http://$ottimo_http_backend:80;
			proxy_set_header Host $host;
			proxy_connect_timeout 5s;
		}
	}
}
